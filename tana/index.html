<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>教室の作品棚</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 並び：大きな見出し → すりガラスの棚えらび（上に貼りつく） → 白いカードの棚。作品を押すと、すりガラスの上に1枚が出る */
:root{
  --bg:#fbfbfd; --card:#ffffff; --fg:#1d1d1f; --sub:#5e5e66; --line:#e6e6ea; --soft:#f2f2f5; --glass:rgba(251,251,253,.78);
  --kids:#1f7a4d; --kidsL:#e7f4ec; --tchr:#0a66c2; --tchrL:#e6f0fb;
  --web:#9a5b00;  --webL:#fbf0de; --waza:#8e2f6b; --wazaL:#f7e8f1;
  --btn:#1d1d1f; --btnFg:#ffffff; --link:#0a66c2;
  --sh:0 1px 2px rgba(16,24,40,.04),0 12px 30px -12px rgba(16,24,40,.14);
  --shUp:0 2px 4px rgba(16,24,40,.05),0 24px 48px -16px rgba(16,24,40,.22);
  --glow1:rgba(10,102,194,.07); --glow2:rgba(31,122,77,.05); --glow3:rgba(142,47,107,.045);
  --f:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Zen Kaku Gothic New",sans-serif;
}
/* 地はいつも白（ダークモードの端末でも白で出す） */
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.65;letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;
  background:
    radial-gradient(1100px 560px at 6% -10%,var(--glow1),transparent 62%),
    radial-gradient(900px 520px at 104% 4%,var(--glow3),transparent 60%),
    radial-gradient(1000px 700px at 80% 110%,var(--glow2),transparent 62%),
    var(--bg);
  background-attachment:fixed}
.ws-wrap{max-width:1120px;margin:0 auto;padding-block:8px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 見出し */
.ws-hero{text-align:center;padding:28px 0 18px;display:flex;flex-direction:column;align-items:center}
.ws-headupa{width:76px;height:auto;margin-bottom:6px}
.ws-eyebrow{margin:0;font-size:14px;font-weight:600;color:var(--sub);letter-spacing:.08em}
.ws-hero h1{margin:4px 0 0;font-size:clamp(30px,7.4vw,56px);font-weight:700;line-height:1.18;letter-spacing:-.01em;text-wrap:balance}
.ws-by{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--fg);letter-spacing:.06em}
.ws-lead{margin:12px auto 0;max-width:34em;font-size:clamp(15px,2.2vw,18px);color:var(--sub);line-height:1.7;text-wrap:pretty}

/* 棚えらび（すりガラス・上に貼りつく） */
.ws-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:8px -16px 0;padding:10px 16px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
.ws-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--soft);border-radius:999px;padding:4px;width:max-content;max-width:100%;margin:0 auto}
.ws-tabs::-webkit-scrollbar{display:none}
.ws-tab{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--sub);
  font:600 14px/1 var(--f);cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s,color .2s,box-shadow .2s}
.ws-tab[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 10px -4px rgba(0,0,0,.18)}
.ws-n{font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}

/* 棚 */
.ws-shelf{margin-top:36px}
.ws-shelf h2{font-size:clamp(22px,4vw,30px);font-weight:700;margin:0;letter-spacing:-.005em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ws-mark{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
.ws-shelf > p{margin:4px 0 16px;color:var(--sub);font-size:15px}
.ws-jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.ws-jump button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);
  font:600 14px/1 var(--f);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ws-sub{font-size:17px;font-weight:700;margin:22px 0 10px;scroll-margin-top:84px;display:flex;align-items:center;gap:8px}
/* 教科の色（色だけにせず、かならず教科名の字も出す）。白の上で字4.5:1以上 */
.s-koku{--c:#c0392b;--cL:#fdecea}
.s-sha {--c:#a35208;--cL:#fdf0e0}
.s-san {--c:#1a5fb4;--cL:#e8f0fb}
.s-tai {--c:#1e7b45;--cL:#e5f4eb}
.s-tok {--c:#7b3fa6;--cL:#f2eafa}
.ws-sub{color:var(--c)}
.ws-sub::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.ws-subblock{margin-top:8px;padding:2px 0 6px}
.ws-jump button[class^="s-"]{background:var(--cL);color:var(--c);border-color:transparent}
.ws-subj{align-self:flex-start;font-style:normal;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--cL);color:var(--c);margin-bottom:2px}
.ws-meta .ws-subj{margin:0;padding:3px 10px}
.ws-tile[class*=" s-"]{box-shadow:var(--sh),inset 0 3px 0 var(--c)}
.ws-tile[class*=" s-"] .ws-pic{border-bottom:3px solid var(--c)}

.ws-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:720px){.ws-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media (min-width:1000px){.ws-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.ws-tile{display:flex;flex-direction:column;text-align:left;border:0;border-radius:18px;background:var(--card);color:var(--fg);
  padding:0;overflow:hidden;cursor:pointer;font-family:inherit;min-width:0;box-shadow:var(--sh);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
@media (hover:hover){.ws-tile:hover{transform:translateY(-3px);box-shadow:var(--shUp)}}
.ws-tile:active{transform:scale(.985)}
.ws-tile:focus-visible,.ws-tab:focus-visible,.ws-go:focus-visible,.ws-x:focus-visible,.ws-jump button:focus-visible,.ws-back:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.ws-pic{aspect-ratio:16/9;width:100%;max-width:100%;background:var(--soft);overflow:hidden}
.ws-pic img{width:100%;height:100%;object-fit:cover;display:block}
.ws-ini{width:100%;height:100%;display:grid;place-items:center;font-size:20px;font-weight:700;padding:0 10px;text-align:center;line-height:1.3}
.ws-tb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ws-tb b{font-size:15px;font-weight:700;line-height:1.35}
.ws-tb span{font-size:14px;color:var(--sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ws-tb .ws-can{font-size:12px;font-weight:600;margin-top:4px;color:var(--sub);display:block}
.ws-tb .ws-can.ok{color:var(--link)}

.k-kids .ws-mark,.k-kids .ws-ini{background:var(--kidsL);color:var(--kids)}
.k-tchr .ws-mark,.k-tchr .ws-ini{background:var(--tchrL);color:var(--tchr)}
.k-web  .ws-mark,.k-web  .ws-ini{background:var(--webL);color:var(--web)}
.k-waza .ws-mark,.k-waza .ws-ini{background:var(--wazaL);color:var(--waza)}

/* 作品の1枚 */
.ws-sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ws-card{background:var(--card);width:100%;max-width:580px;max-height:100%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:0 0 calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px -10px rgba(0,0,0,.25)}
@media (min-width:720px){.ws-sheet{align-items:center}.ws-card{border-radius:22px;max-height:94%}}
.ws-in{padding:16px max(18px,env(safe-area-inset-left,0px)) 0 max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.ws-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ws-top h3{margin:0;font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.005em;text-wrap:balance}
.ws-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ws-meta span{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--sub)}
.ws-x{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--fg);font-size:20px;cursor:pointer}
.ws-one{margin:0;font-size:16px;line-height:1.75}
.ws-num{background:var(--soft);border-radius:14px;padding:12px 14px}
.ws-num small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.ws-num strong{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3;letter-spacing:-.01em}
.ws-ba{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.ws-ba div{background:var(--soft);border-radius:14px;padding:12px;font-size:14px;line-height:1.6;min-width:0}
.ws-ba small{display:block;font-size:12px;font-weight:600;color:var(--sub)}
.ws-ba i{font-style:normal;align-self:center;color:var(--sub);font-weight:700}
.ws-go{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;border:0;
  background:var(--btn);color:var(--btnFg);font:600 16px/1.2 var(--f);text-decoration:none;cursor:pointer;width:100%;transition:transform .15s}
.ws-go:active{transform:scale(.98)}
.ws-go.ws-sec{background:var(--soft);color:var(--fg)}
.ws-go.ws-off{background:transparent;color:var(--sub);cursor:default;border:1.5px dashed var(--line)}
.ws-note{font-size:13px;color:var(--sub);margin:-6px 0 0;text-align:center}
.ws-upa{display:flex;align-items:flex-end;gap:8px}
.ws-upa img{width:54px;height:auto;flex:none}
.ws-upa p{margin:0 0 6px;background:var(--soft);border-radius:16px 16px 16px 4px;padding:8px 13px;font-size:14px;line-height:1.5}

/* 体験版の窓 */
.ws-play{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.ws-playbar{display:flex;align-items:center;gap:10px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));
  padding-top:calc(6px + env(safe-area-inset-top,0px));background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.ws-playbar b{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-back{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--soft);color:var(--fg);font:600 14px var(--f);cursor:pointer}
.ws-play iframe{flex:1;border:0;width:100%;background:#fff}
.ws-rot{font-size:13px;color:var(--sub)}
@media (orientation:landscape){.ws-rot{display:none}}

/* 作品の詳しいページ。PCは3列で1画面（左＝何か・どこで／中＝効果の図／右＝しくみの流れ図）。スマホは縦に積む */
.ws-detail{position:fixed;inset:0;z-index:25;overflow-y:auto;background:
  radial-gradient(900px 500px at 0% 0%,var(--glow1),transparent 60%),radial-gradient(800px 500px at 100% 100%,var(--glow3),transparent 60%),var(--bg)}
.wd-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.wd-bar b{font-size:17px;font-weight:700}
.wd-bartag{flex:1;min-width:0}
.wd-play{width:auto;min-height:44px;padding:0 20px;font-size:15px}
.wd-play i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--btnFg);color:var(--btn)}
.wd-in{max-width:1320px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
.wd-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.wd-hero{display:flex;flex-direction:column;gap:8px}
.wd-hero .ws-pic{border-radius:14px;box-shadow:var(--sh)}
.wd-hero h2{margin:0;font-size:30px;line-height:1.2}
.wd-lead{margin:0;font-size:18px;font-weight:700;line-height:1.5;letter-spacing:-.005em;text-wrap:balance}
.wd-voice{position:relative;margin:0;padding:10px 14px 10px 34px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:16px;font-weight:700;line-height:1.45}
.wd-voice span{position:absolute;left:10px;top:2px;font-size:34px;line-height:1;color:var(--s-koku,#c0392b);font-family:Georgia,serif}
.wd-voice cite{display:block;font-style:normal;font-size:12px;font-weight:500;color:var(--sub);margin-top:2px}
.wd-sec h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:16px;line-height:1.35;letter-spacing:.01em}
.wd-sec h3 i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--btn);color:var(--btnFg);flex:none}
.wd-p{margin:0;font-size:14px;line-height:1.65}
.wd-where{margin:0 0 8px;font-size:14px;font-weight:600}
.wd-card{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px 14px}
.wd-week{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px 12px}
.wd-blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.wd-blocks span{display:flex;flex-direction:column;align-items:center;justify-content:center;height:40px;border-radius:8px;background:#e8f0fb;color:#1a5fb4;font-size:12px;font-weight:600;line-height:1.2}
.wd-blocks span.b-or{background:#fdf0e0;color:#a35208}
.wd-blocks span.b-gr{background:#e5f4eb;color:#1e7b45}
.wd-blocks span.b-gy{background:var(--soft);color:var(--sub)}
.wd-blocks b{font-size:15px}
.wd-week p{margin:6px 0 0;font-size:12px;color:var(--sub)}
.wd-week strong{font-size:14px;color:var(--fg)}
.wd-steps{list-style:none;margin:6px 0 0;border-top:1px solid var(--line);padding-top:6px !important;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.wd-steps li{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px 3px 3px;border-radius:999px;background:var(--soft);white-space:nowrap}
.wd-steps li i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--btn);color:var(--btnFg);flex:none}
.wd-steps li.wd-arr{background:none;box-shadow:none;padding:0;color:var(--sub)}
@media (min-width:960px){.wd-steps{flex-direction:column;align-items:flex-start;gap:3px}.wd-steps li.wd-arr{display:none}}
.wd-range{padding:10px 14px 6px}
.wd-rhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:2px 8px;margin-bottom:2px}
.wd-rhead small{font-size:12px;font-weight:700;color:var(--sub)}
.wd-leg{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.wd-leg i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:6px}
.wd-leg i.a{background:#fff;border:2px solid #8a939d}.wd-leg i.b{background:#1a5fb4}
.wd-db{display:grid;grid-template-columns:80px 1fr 78px;align-items:center;gap:8px;height:46px}
.wd-db em{white-space:nowrap}
.wd-db small{line-height:1.3;overflow-wrap:anywhere}
.wd-db small{font-size:12px;font-weight:700;color:var(--sub)}
.wd-db em{font-style:normal;font-size:13px;font-weight:700;color:#1a5fb4;text-align:right}
.wd-dbl{position:relative;height:100%;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.wd-dbs{position:absolute;top:50%;height:4px;margin-top:-2px;background:#1a5fb4;opacity:.35;border-radius:2px}
.wd-dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%}
.wd-dot b{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wd-dot-a{background:#fff;border:2px solid #8a939d}.wd-dot-a b{color:var(--sub);font-weight:600;bottom:auto;top:13px}
.wd-dot-b{background:#1a5fb4}.wd-dot-b b{color:#1a5fb4;font-size:14px}
.wd-ticks{position:relative;height:16px;margin-left:88px;margin-right:86px;border-top:1px solid var(--line)}
.wd-ticks span{position:absolute;top:2px;transform:translateX(-50%);font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.wd-tile{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px}
.wd-tile small{font-size:12px;font-weight:700;color:var(--sub)}
.wd-tile p{margin:0;display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums;color:var(--sub)}
.wd-tile .wd-a{font-size:15px}
.wd-tile strong{font-size:24px;color:var(--fg);line-height:1}
.wd-tile em{font-style:normal;font-size:13px;font-weight:700;color:#1a5fb4;margin-left:6px}
.wd-waffle{padding:10px 14px}
.wd-dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.wd-dots i{aspect-ratio:1;border-radius:50%;background:#cfd5db}
.wd-dots i.up{background:#1a5fb4}
.wd-waffle p{margin:6px 0 0;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#5c6670;white-space:nowrap}
.wd-waffle p .up{color:#1a5fb4}
.wd-waffle b{font-size:14px}
.wd-todo{margin-top:8px;border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.55}
.wd-todo small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.wd-tn{color:var(--sub)!important;font-weight:600!important}
.wd-tile+.wd-tile{margin-top:8px}
.ws-subj.s-tchr2{background:var(--tchrL);color:var(--tchr);font-style:normal;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.wd-note{margin:0;font-size:12px;color:var(--sub);line-height:1.5}
.wd-seen{margin-top:8px;border-left:0;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.55}
.wd-seen small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.wd-flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.wd-flow::before{content:"";position:absolute;left:15px;top:16px;bottom:16px;border-left:2px solid var(--line)}
.wd-flow li{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1.25fr);gap:10px;align-items:stretch}
.wd-node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--fg);font-weight:700;font-size:14px;align-self:center;z-index:1}
.wd-fs{display:flex;flex-direction:column;justify-content:center;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;line-height:1.45}
.wd-fs em{font-style:normal;align-self:flex-start;margin-top:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#1a5fb4;color:#fff}
.wd-fe{display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:var(--sh);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.5}
.wd-fe span{color:#1a5fb4;font-weight:700}

<body>


<div class="ws-wrap">

</div>

<script>
/* ── 作品の中身はここだけ。パンフレットやHPも、ここから作る ── */
const SHELVES=[
  {id:'kids',name:'子どもが使うアプリ',mark:'子ども',lead:'授業や休み時間に、子どもが自分で開いて使うもの。'},
  {id:'tchr',name:'先生が使う道具',mark:'先生',lead:'先生の仕事を短くする道具。学校の Google の中で動く。'},
  {id:'web', name:'HPづくり',mark:'HP',lead:'人と人をつなぐためのホームページ。'},
  {id:'waza',name:'授業づくりのわざ',mark:'わざ',lead:'アプリではなく「作り方」。材料を入れると、できあがりが出る。'}

// demo: 'file' = この棚の中で触れる / 'link' = 外のページで触れる / なし = これから
const WORKS=[

  if(d.range){ const R=d.range, pos=v=>((v-R.lo)/(R.hi-R.lo)*100).toFixed(2)+'%';
    let ticks=''; const st=R.step||10; for(let t=R.lo;t<=R.hi;t+=st) ticks+='<span style="left:'+pos(t)+'">'+t+'</span>';
    rangeH='<div class="wd-card wd-range"><div class="wd-rhead"><small>'+esc(R.label||'')+'</small><span class="wd-leg"><i class="a"></i>'+esc(R.aL||'前回')+'<i class="b"></i>'+esc(R.bL||'今回')+'</span></div>'+
      R.rows.map(r=>{const l=Math.min(r.a,r.b), h=Math.max(r.a,r.b);
        return '<div class="wd-db"><small>'+esc(r.k)+'</small><div class="wd-dbl"><span class="wd-dbs" style="left:'+pos(l)+';width:calc('+pos(h)+' - '+pos(l)+')"></span>'+
        '<span class="wd-dot wd-dot-a" style="left:'+pos(r.a)+'"><b>'+fmt(r.a)+'</b></span><span class="wd-dot wd-dot-b" style="left:'+pos(r.b)+'"><b>'+fmt(r.b)+'</b></span></div>'+
        '<em>'+dif(r.a,r.b,R.u,R.down)+'</em></div>';}).join('')+'<div class="wd-ticks">'+ticks+'</div></div>'; }
  const tiles=(d.tiles||(d.tile?[d.tile]:[])).map(t=>'<div class="wd-card wd-tile"><small>'+esc(t.k)+'</small><p>'+
      (t.a!=null?'<span class="wd-a">'+fmt(t.a)+'</span>→':'')+'<strong>'+esc(t.b)+'</strong>'+esc(t.u||'')+
      (t.a!=null?'<em>'+dif(t.a,t.b,t.u||'',t.down)+'</em>':(t.note?'<em class="wd-tn">'+esc(t.note)+'</em>':''))+'</p></div>').join('');
  let waffleH='';
  if(d.waffle){ const W=d.waffle; let dots=''; for(let k=0;k<W.all;k++) dots+='<i class="'+(k<W.up?'up':'')+'"></i>';
    waffleH='<div class="wd-card wd-waffle"><div class="wd-dots" role="img" aria-label="'+W.all+'中 '+W.up+'が'+esc(W.upL)+'">'+dots+'</div>'+
      '<p><span class="up">■ '+esc(W.upL)+' <b>'+W.up+esc(W.u||'人')+'</b></span><span>■ '+esc(W.dnL)+' <b>'+(W.all-W.up)+esc(W.u||'人')+'</b></span></p></div>'; }
  const shots=d.shots||(w.img?[{img:w.img,cap:''}]:[]);
  const play=w.demo==='file'?'<button class="ws-go st-play" type="button" data-play="'+w.href+'">▶ 触ってみる</button>':
             w.demo==='link'?'<a class="ws-go st-play" href="'+w.href+'" target="_blank" rel="noopener">▶ 触ってみる</a>':'';
  const tag=(w.sub?subPill(w):'<em class="ws-subj s-tchr2">'+esc((SHELVES.find(x=>x.id===w.s)||{}).mark||'')+'</em>')+(w.tag||[]).filter(t=>t!==w.sub).map(t=>'<span class="st-tag">'+esc(t)+'</span>').join('');
  let h='<div class="wd-bar"><button class="ws-back" type="button" data-dclose>← 棚にもどる</button><b>'+esc(w.name)+'</b><span class="wd-bartag"></span><span class="wd-by">作成者：伊藤 優</span>'+play.replace('st-play','wd-play')+'</div>'+
  '<article class="st">'+
   /* 1 何のアプリか */
   '<section class="st-hero">'+
     '<div class="st-say"><p class="st-tags">'+tag+'</p><h2>'+esc(w.name)+'</h2><p class="st-lead">'+esc(d.lead)+'</p><p class="st-aim">'+esc(d.aim)+'</p>'+
       (d.voice?'<blockquote class="wd-voice"><span aria-hidden="true">“</span>'+esc(d.voice.replace(/[「」]/g,''))+'<cite>'+esc(d.voiceBy||'')+'</cite></blockquote>':'')+
       (play?'<div class="st-cta">'+play+(w.extra?'<button class="ws-go ws-sec" type="button" data-play="'+w.extra.href+'">'+esc(w.extra.label)+'</button>':'')+'</div>':'')+'</div>'+
     (w.vid?'<div class="st-shots"><figure class="st-main"><video src="'+w.vid+'"'+(w.img?' poster="'+w.img+'"':'')+' controls playsinline preload="none" aria-label="'+esc(w.name)+'の使い方の動画"></video></figure><p class="st-vcap">▶ 動画で見る・約30秒・音なし（体験版を操作しているところ）</p></div>':
      w.img?'<div class="st-shots"><figure class="st-main"><img src="'+w.img+'" alt="'+esc(w.name)+'の画面"></figure></div>':'')+
   '</section>'+
   /* 2 どう使う */
   '<section class="st-use"><h3>'+esc(d.useTitle||'どう使う')+'</h3><div class="us">'+
     '<div class="us-cell"><small>いつ・どこで</small><p class="us-where">'+esc(d.where||'').replace('｜','<br>')+'</p></div>'+
     (d.week?'<div class="us-cell"><small>'+esc(d.week.total)+'</small><div class="us-blocks">'+d.week.blocks.map(b=>'<span class="'+(b[2]||'')+'"><b>'+esc(b[0])+'</b><i>'+esc(b[3]||d.week.per||'')+'</i></span>').join('')+'</div>'+(d.week.note?'<p class="us-note">'+esc(d.week.note)+'</p>':'')+'</div>':'')+
     (d.steps?'<div class="us-cell"><small>流れ</small><ol class="us-flow">'+d.steps.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol></div>':'')+
   '</div></section>'+
   /* 3 しくみ → その結果 */
   '<section class="st-mech2"><h3>'+esc(d.whyTitle||'このしくみがあるから、この効果が出る')+'</h3><div class="mx">'+
     '<ol class="mx-list">'+d.flow.map((x,k)=>'<li><button type="button" class="mx-item'+(x.key?' key':'')+(k===0?' on':'')+'" data-mx="'+k+'" aria-pressed="'+(k===0)+'"><span class="mx-dot" aria-hidden="true"></span><span class="mx-s">'+esc(x.s)+(x.key?'<em>'+esc(x.key)+'</em>':'')+'</span><span class="mx-e">'+esc(x.e)+'</span></button></li>').join('')+'</ol>'+
     '<div class="mx-view" aria-live="polite">'+d.flow.map((x,k)=>{const im=x.shot||x.img; return '<figure class="mx-fig'+(k===0?' on':'')+'" data-fig="'+k+'">'+(im?'<img src="'+im+'" alt="'+esc(x.alt||x.s)+'" loading="lazy">':'<div class="mx-off"><b>'+esc(x.s)+'</b><span>'+esc(x.off||'この段の画面は、まだありません')+'</span></div>')+'<figcaption>'+esc(x.s)+'</figcaption></figure>';}).join('')+'</div>'+
     '</div>'+(d.support?'<div class="wd-sup"><small>'+esc(d.supTitle||'やる気を支えるしかけ')+'</small><div>'+d.support.map(x=>'<p><b>'+esc(x.s)+'</b>'+esc(x.e)+'</p>').join('')+'</div></div>':'')+'</section>'+
   '<section class="st-res2"><h3>'+esc(d.effTitle&&d.effTitle!=='学習効果'?d.effTitle:'その結果')+'</h3><div class="rs-grid">'+rangeH+(waffleH||'')+'<div class="rs-tiles">'+tiles+'</div></div>'+
     (d.statNote?'<p class="wd-note">'+esc(d.statNote)+'</p>':'')+'</section>'+
   /* 4 さいごに */
   '<section class="st-end">'+
     (d.seen?'<div class="st-seen"><small>'+esc(d.seenTitle||'先生の見取り')+'</small><p>'+esc(d.seen)+'</p></div>':'')+
     (d.todo?'<div class="st-todo"><small>これから確かめること</small><p>'+esc(d.todo)+'</p></div>':'')+
     (d.caveat?'<p class="st-cav">'+esc(d.caveat)+'</p>':'')+
   '</section>'+
  '</article>';
  const el=$('ws-detail'); el.innerHTML=h; el.hidden=false; el.scrollTop=0; el.dataset.w=id; closeWork();
  let n=0; el.querySelectorAll('.st-say > *, .sh-row li, .st-use, .st-mech .wd-flow li, .st-res > *, .st-end > *').forEach(x=>x.style.setProperty('--d',Math.min(n++,12)));
  el.querySelector('[data-dclose]').focus();
}
function closeDetail(){ $('ws-detail').hidden=true; $('ws-detail').innerHTML=''; }
function closeWork(){ $('ws-sheet').hidden=true; $('ws-sheet').innerHTML=''; }
function play(href){
  const w=WORKS.find(x=>x.id===$('ws-sheet').dataset.w);
  $('ws-playname').textContent=w?w.name:''; $('ws-frame').src=href; $('ws-play').hidden=false;
}
$('ws-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;cur=b.dataset.t;renderTabs();renderMain();
  try{localStorage.setItem('ws-tab',cur)}catch(_){}});
$('ws-main').addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]'); if(j){const t=$(j.dataset.jump); if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); return;}
  const b=e.target.closest('[data-w]');if(!b)return; const w=WORKS.find(x=>x.id===b.dataset.w); if(w&&w.detail)openDetail(w.id); else openWork(b.dataset.w);});
$('ws-sheet').addEventListener('click',e=>{
  if(e.target.id==='ws-sheet'||e.target.closest('[data-close]'))return closeWork();
  const dd=e.target.closest('[data-detail]'); if(dd)return openDetail(dd.dataset.detail);
  const p=e.target.closest('[data-play]'); if(p)play(p.dataset.play);
});
function mxShow(k){const el=$('ws-detail');el.querySelectorAll('.mx-item').forEach(b=>{const on=b.dataset.mx==k;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});el.querySelectorAll('.mx-fig').forEach(f=>f.classList.toggle('on',f.dataset.fig==k));}
$('ws-detail').addEventListener('mouseover',e=>{const b=e.target.closest('.mx-item');if(b&&matchMedia('(hover:hover)').matches)mxShow(b.dataset.mx);});
$('ws-detail').addEventListener('click',e=>{
  const mx=e.target.closest('.mx-item'); if(mx){mxShow(mx.dataset.mx);return;}
  if(e.target.closest('[data-dclose]'))return closeDetail();
  const p=e.target.closest('[data-play]'); if(p){ $('ws-sheet').dataset.w=$('ws-detail').dataset.w; play(p.dataset.play); }
});
$('ws-back').addEventListener('click',()=>{$('ws-play').hidden=true;$('ws-frame').src='about:blank'});
document.addEventListener('click',e=>{const b=e.target.closest('[data-detail-open]');if(b)openDetail(b.dataset.detailOpen);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('ws-play').hidden)$('ws-back').click();else if(!$('ws-detail').hidden)closeDetail();else closeWork();}});
try{const t=localStorage.getItem('ws-tab');if(t&&(t==='all'||SHELVES.some(s=>s.id===t)))cur=t}catch(_){}
renderTabs();renderMain();
document.querySelectorAll('.hm-copy > *, .hm-stat').forEach((x,i)=>x.style.setProperty('--d',i));
</script>

</body>
</html>
