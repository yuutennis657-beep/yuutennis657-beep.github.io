#start::before{content:'';position:absolute;inset:0;background:rgba(255,240,210,0.45);backdrop-filter:blur(0px);}
#start>*{position:relative;z-index:1;}
.t-eye{font-size:clamp(12px,1.4vw,16px);letter-spacing:.3em;color:var(--gold2);font-weight:700;text-shadow:0 1px 3px #fff8;}
.t-main{
  font-size:clamp(36px,6vw,72px);font-weight:900;line-height:1.05;text-align:center;
  color:#FF8C00;
  -webkit-text-stroke:3px #5A3000;
  text-shadow:4px 4px 0 #5A3000, 6px 6px 0 #00000030;
  filter:drop-shadow(0 4px 8px #00000040);
}
.t-main .bl{color:var(--b1);-webkit-text-stroke:3px #0a2a40;} .t-main .rl{color:var(--r1);-webkit-text-stroke:3px #5a0a14;}
.card{background:rgba(255,252,246,0.92);border-radius:24px;padding:clamp(12px,2vw,26px) clamp(14px,2.6vw,32px);box-shadow:0 10px 0 #00000018,0 16px 30px #00000030;width:min(860px,93vw);display:flex;flex-direction:column;gap:13px;}
.srow{display:flex;gap:13px;flex-wrap:wrap;}
.tset{flex:1 1 210px;border-radius:14px;padding:10px 13px;display:flex;flex-direction:column;gap:5px;}
.tset.b{background:var(--bl);border:3px solid var(--b2);}
.tset.r{background:var(--rl);border:3px solid var(--r2);}
.tset label{font-size:clamp(10px,1vw,12px);font-weight:700;color:var(--soft);}
.tset input{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:clamp(14px,1.6vw,20px);border:none;background:transparent;outline:none;border-bottom:3px solid transparent;padding:3px 1px;}
.tset.b input{color:var(--bd);} .tset.r input{color:var(--rd);}
.tset input:focus{border-bottom-color:currentColor;}
.oblock{display:flex;flex-direction:column;gap:6px;flex:1 1 210px;}
.oblock .olabel{font-size:clamp(10px,1vw,12px);font-weight:700;color:var(--soft);}
.orow{display:flex;gap:7px;flex-wrap:wrap;}
.obtn{flex:1 1 80px;padding:7px 5px;border-radius:11px;border:3px solid #00000014;background:#fff;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:700;font-size:clamp(11px,1.1vw,14px);color:var(--soft);cursor:pointer;transition:all .14s ease;line-height:1.3;}
.obtn.on{background:var(--gold);border-color:var(--gold2);color:#4a3000;transform:translateY(-2px);box-shadow:0 4px 0 var(--gold2);}
.sbtn{align-self:center;padding:12px 44px;font-size:clamp(16px,1.9vw,22px);font-weight:900;color:#fff;background:linear-gradient(180deg,#5DB87E,#3E9A60);border:none;border-radius:999px;box-shadow:0 6px 0 #2c7747;cursor:pointer;transition:transform .08s;}
.sbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2c7747;}

/* ===== GAME ===== */
#game{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(5px,.9vh,11px) clamp(9px,1.5vw,20px);gap:clamp(5px,.8vh,9px);}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;}
.topbar .gtitle{font-weight:900;font-size:clamp(12px,1.4vw,16px);color:var(--soft);}
.topbar .clock{font-weight:800;font-size:clamp(15px,1.8vw,20px);background:var(--paper);padding:5px 16px;border-radius:999px;box-shadow:0 3px 0 #00000014;font-variant-numeric:tabular-nums;transition:color .2s;}
.clock.urgent{color:var(--ng);animation:pulse .6s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.tbr{display:flex;align-items:center;gap:6px;}
.ibtn{border:none;background:var(--paper);width:clamp(30px,3.3vw,40px);height:clamp(30px,3.3vw,40px);border-radius:50%;font-size:clamp(14px,1.6vw,18px);cursor:pointer;box-shadow:0 3px 0 #00000014;display:flex;align-items:center;justify-content:center;}

.mrow{flex:1;min-height:0;display:flex;flex-direction:row;gap:clamp(7px,1.1vw,15px);}

/* PANEL */
.panel{flex:1 1 0;min-width:0;min-height:0;border-radius:20px;display:flex;flex-direction:column;padding:clamp(7px,1vw,14px);overflow:hidden;transition:box-shadow .2s,transform .12s;}
.panel.b{background:var(--bl);border:4px solid var(--b2);}
.panel.r{background:var(--rl);border:4px solid var(--r2);}
.panel.fg{box-shadow:0 0 0 6px var(--ok) inset;}
.panel.fb{box-shadow:0 0 0 6px var(--ng) inset;}
.panel.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}

.ph2{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;margin-bottom:2px;gap:6px;}
.tlabel{font-weight:900;font-size:clamp(12px,1.4vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.panel.b .tlabel{color:var(--bd);}
.panel.r .tlabel{color:var(--rd);}
.badges{display:flex;gap:4px;flex-shrink:0;}
.badge{font-weight:800;font-size:clamp(9px,.95vw,12px);background:#ffffffb0;padding:2px 8px;border-radius:999px;color:var(--soft);white-space:nowrap;}
.badge.ng{color:var(--ng);}

/* EQUATION ROW: problem + = + answer input, all inline */
.eqrow{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:clamp(4px,.8vw,10px);
  padding:clamp(4px,.9vh,10px) 0;
}
/* fractions as CSS grid so bar is always the exact vertical center */
.fr{
  display:inline-grid;
  grid-template-rows:1fr 5px 1fr;
  align-items:center;
  font-family:'M PLUS Rounded 1c',sans-serif;
  font-weight:900;
  font-size:clamp(24px,4vw,50px);
  color:var(--ink);
}
.fr .fn{display:flex;align-items:flex-end;justify-content:center;padding:0 7px 4px;min-width:1.1em;}
.fr .fb2{background:currentColor;border-radius:2px;height:5px;}
.fr .fd{display:flex;align-items:flex-start;justify-content:center;padding:4px 7px 0;min-width:1.1em;}
.mixed{display:inline-flex;align-items:center;gap:.2em;}
.mwhole{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:900;font-size:clamp(24px,4vw,50px);}
.panel.ultra .fr{font-size:clamp(17px,2.6vw,32px);}
.panel.ultra .mwhole{font-size:clamp(17px,2.6vw,32px);}
.op{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:900;font-size:clamp(19px,3vw,38px);color:var(--soft);align-self:center;line-height:1;}

/* ANSWER INPUT as inline fraction */
.ifr{display:inline-grid;grid-template-rows:1fr 4px 1fr;align-items:center;}
.ibox{
  display:flex;align-items:center;justify-content:center;
  min-width:clamp(42px,4.8vw,64px);padding:2px 8px;
  border-radius:10px;background:#ffffffd0;border:3px solid #00000018;
  font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;
  font-size:clamp(20px,3.2vw,40px);color:var(--ink);cursor:pointer;
}
.ibox.on{border-color:var(--gold2);background:#fff;box-shadow:0 0 0 4px #F2B13455;}
.ibox .ph3{color:#00000038;font-size:.55em;font-weight:700;}
.ibar{background:var(--ink);border-radius:2px;height:4px;}

.fbline{flex-shrink:0;text-align:center;font-weight:800;font-size:clamp(10px,1.1vw,13px);min-height:1.3em;color:var(--soft);}
.fbline.ok{color:var(--ok);} .fbline.ng2{color:var(--ng);}

.kpad{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(4,minmax(0,1fr)) minmax(0,1.15fr);
  gap:clamp(4px,.65vh,7px);
}
.kpad button{border:none;border-radius:11px;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:clamp(14px,1.7vw,21px);background:#fff;color:var(--ink);box-shadow:0 4px 0 #00000018;transition:transform .06s,box-shadow .06s;min-height:0;}
.kpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #00000018;}
.kpad button.fn{background:#EFE7DA;color:var(--soft);font-size:clamp(11px,1.3vw,15px);}
.kpad button.okbtn{grid-column:1/span 3;font-weight:900;font-size:clamp(15px,1.8vw,22px);color:#fff;box-shadow:0 4px 0 #00000022;}
.panel.b .okbtn{background:linear-gradient(180deg,var(--b2),var(--b1));}
.panel.r .okbtn{background:linear-gradient(180deg,var(--r2),var(--r1));}

/* ===== ARENA (center column, vertical) ===== */
.arena{
  flex:0 0 clamp(90px,11vw,160px);min-height:0;
  border-radius:20px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,var(--bl) 0%,var(--bl) 33%,var(--paper) 50%,var(--rl) 67%,var(--rl) 100%);
  box-shadow:inset 0 0 0 3px #00000010,0 4px 0 #00000010;
  padding:5px 3px;
}
.agoal{flex-shrink:0;width:100%;text-align:center;font-weight:900;font-size:clamp(8px,.85vw,11px);color:#fff;padding:5px 3px;border-radius:9px;line-height:1.2;}
.agoal.top{background:var(--b1);}
.agoal.bot{background:var(--r1);}
.amascot{flex-shrink:0;display:flex;justify-content:center;margin:2px 0;}
.amascot.bot{transform:scaleY(-1);}
.mascot-svg{width:clamp(28px,3.4vw,48px);transition:transform .15s;}
.mascot-svg.pull{transform:scaleX(1.22) scaleY(0.8) translateY(3px);}
.mascot-svg.stagger{transform:translateX(-5px) rotate(-10deg);}

.rzone{flex:1;position:relative;width:100%;min-height:0;display:flex;justify-content:center;}
.rtrack{position:absolute;top:4%;bottom:4%;left:50%;width:9px;transform:translateX(-50%);border-radius:6px;background:repeating-linear-gradient(20deg,var(--rope) 0 10px,var(--rope2) 10px 14px);box-shadow:0 0 0 2px #00000012;}
.rcenter{position:absolute;left:6px;right:6px;top:50%;height:2px;background:repeating-linear-gradient(90deg,#00000030 0 6px,transparent 6px 12px);transform:translateY(-50%);}
.flag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:top .5s cubic-bezier(.34,1.56,.64,1);font-size:clamp(22px,2.6vw,34px);filter:drop-shadow(0 3px 2px #00000030);z-index:5;}

/* WIN */
#win{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:#00000055;}
#win.show{display:flex;}
.wcard{background:var(--paper);border-radius:26px;padding:clamp(20px,3vw,38px) clamp(24px,4vw,52px);text-align:center;box-shadow:0 20px 50px #00000040;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:90vw;}
.wflag{font-size:clamp(40px,5.6vw,64px);}
.wtanuki-wrap{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin-bottom:4px;}
.wtanuki{width:min(140px,38vw);border-radius:18px;object-fit:cover;}
.wtanuki-label{font-size:clamp(9px,1.1vw,12px);font-weight:700;text-align:center;color:var(--soft);margin-top:3px;}
.wtanuki-item{display:flex;flex-direction:column;align-items:center;}
.wtxt{font-weight:900;font-size:clamp(20px,3vw,32px);}
.wsub{font-weight:600;color:var(--soft);font-size:clamp(11px,1.3vw,15px);}
.wbtns{display:flex;gap:13px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
.wbtns button{font-family:'M PLUS Rounded 1c',sans-serif;padding:10px 24px;border-radius:999px;border:none;cursor:pointer;font-weight:800;font-size:clamp(12px,1.4vw,15px);box-shadow:0 4px 0 #00000020;}
.wbtns .ag{background:var(--gold);color:#4a3000;}
.wbtns .mn{background:#fff;color:var(--soft);}

.cf{position:absolute;top:-10%;width:10px;height:16px;opacity:.9;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(115vh) rotate(420deg);opacity:.3;}}
</style>
</head>
<body>
<div id="app">

<!-- START -->
<div id="start">
  <div style="text-align:center;">
    <div class="t-eye" style="font-size:clamp(13px,1.6vw,18px);color:#8B5E00;text-shadow:0 1px 4px #fff;">綱引きチャレンジ</div>
    <div class="t-main"><span class="bl">分数</span>÷<span class="rl">分数</span><br>バトル！</div>
  </div>

  <div class="card">
    <div class="srow">
      <div class="tset b"><label>チーム１の名前</label><input id="n1" value="チームあお" maxlength="10"></div>
      <div class="tset r"><label>チーム２の名前</label><input id="n2" value="チームあか" maxlength="10"></div>
    </div>
    <div class="srow">
      <div class="oblock">
        <div class="olabel">むずかしさ</div>
        <div class="orow" id="dbtn">
          <button class="obtn" data-d="easy">やさしい<br><span style="font-weight:400">1〜5</span></button>
          <button class="obtn on" data-d="normal">ふつう<br><span style="font-weight:400">1〜9<br>約分必須</span></button>
          <button class="obtn" data-d="hard">むずかしい<br><span style="font-weight:400">1〜12<br>約分必須</span></button>
          <button class="obtn" data-d="ultra">超むずかしい<br><span style="font-weight:400">帯分数・3口</span></button>
        </div>
      </div>
      <div class="oblock">
        <div class="olabel">制限時間</div>
        <div class="orow" id="tbtn">
          <button class="obtn" data-t="60">みじかい<br><span style="font-weight:400">1:00</span></button>
          <button class="obtn on" data-t="90">ふつう<br><span style="font-weight:400">1:30</span></button>
          <button class="obtn" data-t="120">ながい<br><span style="font-weight:400">2:00</span></button>
          <button class="obtn" data-t="240">超ながい<br><span style="font-weight:400">4:00</span></button>
        </div>
      </div>
    </div>
    <button class="sbtn" id="startbtn">▶ スタート！</button>
  </div>
</div>

<!-- GAME -->
<div id="game" style="display:none">
  <div class="topbar">
    <div class="gtitle">分数÷分数バトル</div>
    <div class="clock" id="clock">01:30</div>
    <div class="tbr">
      <button class="ibtn" id="mbtn">🔊</button>
      <button class="ibtn" id="setbtn">⚙️</button>
    </div>
  </div>

  <div class="mrow">
    <!-- Team 1 -->
    <div class="panel b" id="p1">
      <div class="ph2">
        <div class="tlabel" id="lb1">チームあお</div>
        <div class="badges"><div class="badge">○<span id="sc1">0</span></div><div class="badge ng">×<span id="ms1">0</span></div></div>
      </div>
      <div class="eqrow" id="eq1"></div>
      <div class="fbline" id="fb1">分母から 入力しよう</div>
      <div class="kpad" id="kp1"></div>
    </div>

    <!-- Arena -->
    <div class="arena">
      <div class="agoal top" id="gt">GOAL</div>
      <div class="amascot top" id="mc1">
        <svg class="mascot-svg" id="ms1svg" viewBox="0 0 60 80">
          <ellipse cx="30" cy="20" rx="14" ry="14" fill="#F5C99A"/>
          <path d="M16 20 Q14 8 30 6 Q46 8 44 20" fill="#1a1a1a"/>
          <ellipse cx="30" cy="52" rx="22" ry="24" fill="#F5C99A"/>
          <rect x="8" y="42" width="44" height="16" rx="7" fill="#2E6F95"/>
          <ellipse cx="8" cy="55" rx="9" ry="15" fill="#F5C99A"/>
          <ellipse cx="52" cy="55" rx="9" ry="15" fill="#F5C99A"/>
          <ellipse cx="22" cy="74" rx="10" ry="7" fill="#3A2E22"/>
          <ellipse cx="38" cy="74" rx="10" ry="7" fill="#3A2E22"/>
        </svg>
      </div>
      <div class="rzone">
        <div class="rtrack"></div>
        <div class="rcenter"></div>
        <div class="flag" id="flag">🚩</div>
      </div>
      <div class="amascot bot" id="mc2">
        <svg class="mascot-svg" id="ms2svg" viewBox="0 0 60 80">
          <ellipse cx="30" cy="20" rx="14" ry="14" fill="#F5C99A"/>
          <path d="M16 20 Q14 8 30 6 Q46 8 44 20" fill="#1a1a1a"/>
          <ellipse cx="30" cy="52" rx="22" ry="24" fill="#F5C99A"/>
          <rect x="8" y="42" width="44" height="16" rx="7" fill="#C9445A"/>
          <ellipse cx="8" cy="55" rx="9" ry="15" fill="#F5C99A"/>
          <ellipse cx="52" cy="55" rx="9" ry="15" fill="#F5C99A"/>
          <ellipse cx="22" cy="74" rx="10" ry="7" fill="#3A2E22"/>
          <ellipse cx="38" cy="74" rx="10" ry="7" fill="#3A2E22"/>
        </svg>
      </div>
      <div class="agoal bot" id="gb">GOAL</div>
    </div>

    <!-- Team 2 -->
    <div class="panel r" id="p2">
      <div class="ph2">
        <div class="tlabel" id="lb2">チームあか</div>
        <div class="badges"><div class="badge">○<span id="sc2">0</span></div><div class="badge ng">×<span id="ms2">0</span></div></div>
      </div>
      <div class="eqrow" id="eq2"></div>
      <div class="fbline" id="fb2">分母から 入力しよう</div>
      <div class="kpad" id="kp2"></div>
    </div>
  </div>
</div>

<!-- WIN -->
<div id="win">
  <div class="wcard">
    <div class="wtanuki-wrap" id="wtanuki-wrap" style="display:none">
      <div class="wtanuki-item" id="wtanuki-win-item">
        <img class="wtanuki" id="wtanuki-win" src="" alt="かった！">
        <div class="wtanuki-label" id="wtanuki-win-label"></div>
      </div>
      <div class="wtanuki-item" id="wtanuki-lose-item">
        <img class="wtanuki" id="wtanuki-lose" src="" alt="まけた…">
        <div class="wtanuki-label" id="wtanuki-lose-label"></div>
      </div>
    </div>
    <div class="wflag" id="wf">🏆</div>
    <div class="wtxt" id="wt">の勝ち！</div>
    <div class="wsub" id="ws"></div>
    <div class="wbtns">
      <button class="ag" id="ag">🔁 もう一度</button>
      <button class="mn" id="mn">⚙ せっていへ</button>
    </div>
  </div>
</div>

</div>

/* ─── audio ─── */
let ctx=null,mgain=null,sgain=null,mon=true,mtick=null,mstep=0;
function ac(){
  if(!ctx){
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    mgain=ctx.createGain();mgain.gain.value=0.05;mgain.connect(ctx.destination);
    sgain=ctx.createGain();sgain.gain.value=0.13;sgain.connect(ctx.destination);
  }
  if(ctx.state==='suspended')ctx.resume();
}
function tone(f,dur,tp,node,off,v){
  if(!ctx)return;
  const t0=ctx.currentTime+(off||0);
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=tp||'square';o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v??1,t0+.012);
  g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(node);o.start(t0);o.stop(t0+dur+.04);
}
function sfxOk(){ac();tone(660,.09,'square',sgain,0,.8);tone(880,.12,'square',sgain,.09,.8);}
function sfxNg(){ac();tone(180,.22,'sawtooth',sgain,0,.7);}
function sfxWin(){ac();[523,659,784,1046].forEach((f,i)=>tone(f,.2,'square',sgain,i*.13,.8));}
/* ── BGM: 愉快なマーチ (Web Audio API) ── */
let bgmNodes=[];
function stopBGM(){
  bgmNodes.forEach(n=>{try{n.stop();}catch(e){}});
  bgmNodes=[];
  if(mtick){clearInterval(mtick);mtick=null;}
}
function startBGM(){
  ac();
  stopBGM();
  if(!mon)return;

  // ── メロディ音符: [周波数Hz, 長さ(拍)] ──
  // ハ長調の陽気なマーチ風メロディ
  const BPM=144, beat=60/BPM;
  const melody=[
    [523,.5],[587,.5],[659,.5],[698,.5],
    [784,1],[784,.5],[880,.5],
    [784,.5],[698,.5],[659,.5],[587,.5],
    [523,2],
    [659,.5],[698,.5],[784,.5],[880,.5],
    [988,1],[988,.5],[1047,.5],
    [988,.5],[880,.5],[784,.5],[698,.5],
    [659,2],
    [784,.5],[784,.25],[784,.25],[784,.5],[698,.5],
    [659,.5],[659,.25],[659,.25],[659,.5],[587,.5],
    [523,.5],[587,.5],[659,.5],[523,.5],
    [698,.5],[659,.5],[587,.5],[523,.5],
    [523,.5],[587,.5],[659,.5],[698,.5],
    [784,1],[523,.5],[523,.5],
    [659,.5],[698,.5],[784,.5],[523,.5],
    [523,2],
  ];
  // ── 伴奏コード (ルート+5度) ──
  const chords=[
    [[262,392],4],[[262,392],4],
    [[294,440],4],[[294,440],4],
    [[262,392],4],[[330,494],4],
    [[349,523],4],[[262,392],4],
    [[262,392],2],[[392,587],2],
    [[349,523],2],[[262,392],2],
    [[330,494],4],[[294,440],4],
    [[262,392],2],[[262,392],2],
  ];

  function scheduleMelody(startT){
    let t=startT;
    melody.forEach(([freq,dur])=>{
      const dur_s=dur*beat;
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='square';o.frequency.value=freq;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.09,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur_s*0.88);
      o.connect(g);g.connect(ctx.destination);
      o.start(t);o.stop(t+dur_s);
      bgmNodes.push(o);
      t+=dur_s;
    });
    return t;
  }
  function scheduleChords(startT){
    let t=startT;
    chords.forEach(([freqs,dur])=>{
      const dur_s=dur*beat;
      freqs.forEach(freq=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.type='triangle';o.frequency.value=freq;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.028,t+0.015);
        g.gain.exponentialRampToValueAtTime(0.001,t+dur_s*0.75);
        o.connect(g);g.connect(ctx.destination);
        o.start(t);o.stop(t+dur_s);
        bgmNodes.push(o);
      });
      t+=dur_s;
    });
    return t;
  }
  function scheduleBass(startT){
    // シンプルなベースライン
    const bass=[
      [131,2],[131,2],[147,2],[147,2],
      [131,2],[165,2],[175,2],[131,2],
      [131,2],[196,2],[175,2],[131,2],
      [165,2],[147,2],[131,2],[131,2],
    ];
    let t=startT;
    bass.forEach(([freq,dur])=>{
      const dur_s=dur*beat;
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sawtooth';o.frequency.value=freq;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.035,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur_s*0.6);
      o.connect(g);g.connect(ctx.destination);
      o.start(t);o.stop(t+dur_s);
      bgmNodes.push(o);
      t+=dur_s;
    });
    return t;
  }

  // ループ再生
  const totalBeats=melody.reduce((s,[,d])=>s+d,0);
  const loopLen=totalBeats*beat;
  let loopStart=ctx.currentTime+0.05;
  scheduleMelody(loopStart);
  scheduleChords(loopStart);
  scheduleBass(loopStart);

  mtick=setInterval(()=>{
    if(!mon||!ctx)return;
    const now=ctx.currentTime;
    // 次のループをちょっと前から予約
    if(now>=loopStart+loopLen-0.3){
      loopStart+=loopLen;
      scheduleMelody(loopStart);
      scheduleChords(loopStart);
      scheduleBass(loopStart);
      // 古いノードを掃除
      bgmNodes=bgmNodes.filter(n=>{try{return n.playbackState!==3;}catch(e){return true;}});
    }
  },200);
}

/* ─── math ─── */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function genNormal(s){
  const{min,max}=DIFF;
  let a=rnd(min,max),b=rnd(2,max),c=rnd(min,max),d=rnd(2,max);
  const num=a*d,den=b*c,g=gcd(num,den);
  s.type='normal';s.terms=[{n:a,d:b},{n:c,d:d}];
  s.ansN=num/g;s.ansD=den/g;
  if(s.ansD===1)genNormal(s);
}
function genThree(s){
  let a=rnd(1,9),b=rnd(2,9),c=rnd(1,9),d=rnd(2,9),e=rnd(1,9),f=rnd(2,9);
  const num=a*d*f,den=b*c*e,g=gcd(num,den);
  s.type='three';s.terms=[{n:a,d:b},{n:c,d:d},{n:e,d:f}];
  s.ansN=num/g;s.ansD=den/g;
  if(s.ansD===1)genThree(s);
}
function genMixed(s){
  let w1=rnd(1,3),d1=rnd(2,6),n1=rnd(1,d1-1);
  let w2=rnd(1,3),d2=rnd(2,6),n2=rnd(1,d2-1);
  const an=w1*d1+n1,bn=w2*d2+n2;
  const num=an*d2,den=d1*bn,g=gcd(num,den);
  s.type='mixed';s.terms=[{w:w1,n:n1,d:d1},{w:w2,n:n2,d:d2}];
  s.ansN=num/g;s.ansD=den/g;
  if(s.ansD===1)genMixed(s);
}

function newProb(team){
  const s=ST[team];
  if(DIFF.type==='ultra') Math.random()<.5?genMixed(s):genThree(s);
  else genNormal(s);
  s.num='';s.den='';s.active='den';
  renderProb(team);renderInputs(team);
}

/* ─── render fraction HTML (CSS-grid based for correct ÷ alignment) ─── */
function frH(n,d){
  return `<span class="fr"><span class="fn">${n}</span><div class="fb2"></div><span class="fd">${d}</span></span>`;
}
function mixH(w,n,d){
  return `<span class="mixed"><span class="mwhole">${w}</span>${frH(n,d)}</span>`;
}

function renderProb(team){
  const s=ST[team];
  const el=$('eq'+team);
  // clear old answer inputs from previous render, rebuild
  let probHTML='';
  if(s.type==='normal'||s.type==='three'){
    probHTML=s.terms.map(t=>frH(t.n,t.d)).join('<span class="op">÷</span>');
  } else {
    probHTML=s.terms.map(t=>mixH(t.w,t.n,t.d)).join('<span class="op">÷</span>');
  }
  el.innerHTML=probHTML+
    '<span class="op">=</span>'+
    `<span class="ifr">
      <div class="ibox" id="ib${team}n" data-team="${team}" data-field="num"><span class="ph3">分子</span></div>
      <div class="ibar"></div>
      <div class="ibox" id="ib${team}d" data-team="${team}" data-field="den"><span class="ph3">分母</span></div>
    </span>`;
  // attach click handlers to new input boxes
  el.querySelectorAll('.ibox').forEach(box=>{
    box.addEventListener('click',()=>{
      ST[box.dataset.team].active=box.dataset.field;
      renderInputs(box.dataset.team);
    });
  });
  // ultra mode: smaller font
  $('p'+team).classList.toggle('ultra', DIFF.type==='ultra');
}

function renderInputs(team){
  const s=ST[team];
  const nb=$('ib'+team+'n'),db=$('ib'+team+'d');
  if(!nb||!db)return;
  nb.innerHTML=s.num!==''?s.num:'<span class="ph3">分子</span>';
  db.innerHTML=s.den!==''?s.den:'<span class="ph3">分母</span>';
  nb.classList.toggle('on',s.active==='num');
  db.classList.toggle('on',s.active==='den');
}

/* ─── keypad ─── */
function buildKP(team){
  const kp=$('kp'+team);kp.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','⌫','0','C'].forEach(k=>{
    const b=document.createElement('button');
    b.textContent=k;
    if(k==='⌫'||k==='C')b.classList.add('fn');
    b.addEventListener('click',()=>handleKey(team,k));
    kp.appendChild(b);
  });
  const ok=document.createElement('button');
  ok.textContent='OK ✓';ok.classList.add('okbtn');
  ok.addEventListener('click',()=>submit(String(team)));
  kp.appendChild(ok);
}
buildKP(1);buildKP(2);

function handleKey(team,k){
  if(over)return;
  const s=ST[team],f=s.active;
  if(k==='C')s[f]='';
  else if(k==='⌫')s[f]=s[f].slice(0,-1);
  else if(s[f].length<3)s[f]+=k;
  renderInputs(team);
}

function submit(team){
  if(over)return;
  const s=ST[team],fb=$('fb'+team),panel=$('p'+team);
  if(s.num===''||s.den===''){flash(panel,fb,false,'分子と分母 りょうほう 入れてね');return;}
  const uN=parseInt(s.num),uD=parseInt(s.den);
  if(uD===0){flash(panel,fb,false,'0で わることは できないよ');return;}
  const g=gcd(uN,uD);
  // easy以外は約分必須：入力値がまだ約分できるならNG
  if(DIFF.type!=='easy'&&g!==1){
    flash(panel,fb,false,'約分してね！ まだ約分できるよ');sfxNg();
    return;
  }
  // 正解判定：入力値をそのまま（約分済みで）正解と比較
  if(uN===s.ansN&&uD===s.ansD){
    s.score++;$('sc'+team).textContent=s.score;
    flash(panel,fb,true,'せいかい！ ひっぱった！');sfxOk();
    mascotAnim(team,'pull');pullRope(team,1);
    if(!over)newProb(team);
  } else {
    s.miss++;$('ms'+team).textContent=s.miss;
    flash(panel,fb,false,'おしい！ つながひかれた…');sfxNg();
    mascotAnim(team,'stagger');pullRope(team,-PENALTY);
    s.num='';s.den='';s.active='den';renderInputs(team);
  }
}

function flash(panel,fb,ok,msg){
  fb.textContent=msg;fb.className='fbline '+(ok?'ok':'ng2');
  panel.classList.remove('fg','fb','shake');void panel.offsetWidth;
  panel.classList.add(ok?'fg':'fb');if(!ok)panel.classList.add('shake');
  setTimeout(()=>panel.classList.remove('fg','fb','shake'),450);
}
function mascotAnim(team,cls){
  const el=$('ms'+team+'svg');
  el.classList.remove('pull','stagger');void el.offsetWidth;
  el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),320);
}

/* ─── rope ─── */
function pullRope(team,mag){
  const dir=String(team)==='1'?-1:1;
  pos+=dir*mag;
  let pct=50+(pos/ROPE)*40;pct=Math.max(6,Math.min(94,pct));
  $('flag').style.top=pct+'%';
  if(Math.abs(pos)>=ROPE){endGame(pos<0?1:2,'rope');}
}

/* ─── timer ─── */
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function startTick(){
  stopTick();remaining=TLIMIT;
  const cl=$('clock');cl.textContent=fmt(remaining);cl.classList.remove('urgent');
  ticker=setInterval(()=>{
    remaining--;cl.textContent=fmt(remaining);
    cl.classList.toggle('urgent',remaining<=10&&remaining>0);
    if(remaining<=0){stopTick();timeUp();}
  },1000);
}
function stopTick(){if(ticker){clearInterval(ticker);ticker=null;}}
function timeUp(){if(!over){pos<0?endGame(1,'time'):pos>0?endGame(2,'time'):endGame(0,'time');}}

/* ─── lifecycle ─── */
function reset(){
  over=false;pos=0;
  [1,2].forEach(t=>{
    ST[t].score=0;ST[t].miss=0;
    $('sc'+t).textContent=0;$('ms'+t).textContent=0;
    $('lb'+t).textContent=ST[t].name;
    $('p'+t).classList.remove('ultra');
  });
  $('gt').textContent=ST[1].name+' GOAL';
  $('gb').textContent=ST[2].name+' GOAL';
  $('flag').style.top='50%';
  $('wtanuki-wrap').style.display='none';
  $('wtanuki-lose-item').style.display='flex';
  newProb(1);newProb(2);
  startTick();
}

function endGame(winner,reason){
  over=true;stopTick();
  const used=fmt(TLIMIT-remaining);
  const wrap=$('wtanuki-wrap');
  if(winner===0){
    $('wf').textContent='🤝';$('wt').textContent='引き分け！';
    // 引き分けは辛そうたぬき1枚
    $('wtanuki-win').src=TANUKI_LOSE;
    $('wtanuki-win-label').textContent='引き分け…';
    $('wtanuki-lose-item').style.display='none';
    wrap.style.display='flex';
  } else {
    const loser=winner===1?2:1;
    $('wtanuki-win').src=TANUKI_WIN;
    $('wtanuki-win-label').textContent=ST[winner].name+' 🏆';
    $('wtanuki-lose').src=TANUKI_LOSE;
    $('wtanuki-lose-label').textContent=ST[loser].name+' …';
    $('wtanuki-lose-item').style.display='flex';
    wrap.style.display='flex';
    $('wf').textContent=winner===1?'🔵🏆':'🔴🏆';
    $('wt').textContent=ST[winner].name+' の勝ち！'+(reason==='rope'?' （つなを ひっぱりきった！）':'');
    sfxWin();
  }
  $('ws').textContent=
    ST[1].name+' ○'+ST[1].score+' ×'+ST[1].miss+'　/　'+
    ST[2].name+' ○'+ST[2].score+' ×'+ST[2].miss+'　（'+used+'）';
  winEl.classList.add('show');confetti();
}

function confetti(){
  const cols=['#2E6F95','#C9445A','#F2B134','#4C9A6A','#fff'];
  for(let i=0;i<55;i++){
    const c=document.createElement('div');c.className='cf';
    c.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%5]};animation-duration:${2.2+Math.random()*1.6}s;animation-delay:${Math.random()*.6}s`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),4500);
  }
}
window.addEventListener('resize',()=>{
  let pct=50+(pos/ROPE)*40;pct=Math.max(6,Math.min(94,pct));
  $('flag').style.top=pct+'%';
});
})();
</script>
