<title>算数バトル</title>
<style>
:root{
  color-scheme:light;
  /* たよす建設（暗算の塔）の色 */
  --ks-bg:#EAF6FD; --ks-paper:#FAFDFF; --ks-ink:#1C1C1A; --ks-mute:#55544E;
  --ks-ki:#FFD43B; --ks-ki-men:#FFF0B8; --ks-sora:#A8DBF5; --ks-sora-men:#DDF1FB;
  --ks-ok:#1E7A45; --ks-ok-men:#DDF5E6; --ks-shu:#B8441C; --ks-shu-men:#FCE3D8; --ks-mid:#7A5A00;
  --ks-board:#2E5A46; --ks-board-ink:#FFFFFF; --ks-board-sub:#DCEFE6; --ks-board-op:#FFE48A;
  --ks-sen:2.5px solid var(--ks-ink); --ks-kage:4px 4px 0 var(--ks-ink); --ks-kage-s:3px 3px 0 var(--ks-ink);
  --ks-tape:repeating-linear-gradient(-45deg,#FFD43B 0 12px,#1C1C1A 12px 24px);
  --ks-f:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP",sans-serif;
  --ks-f-num:"BIZ UDGothic","BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ks-bg);color:var(--ks-ink);font-family:var(--ks-f);font-weight:500;font-size:16px;overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,rgba(28,28,26,.07) 1.5px,transparent 1.6px);background-size:22px 22px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid #2F5F96;outline-offset:3px}
[hidden]{display:none!important}
.ks-app{height:100%;display:flex;flex-direction:column}

/* ボタン（たよす建設の .btn） */
.ks-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:var(--ks-sen);border-radius:999px;background:var(--ks-paper);box-shadow:var(--ks-kage-s);font-weight:700;font-size:17px;white-space:nowrap}
.ks-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ks-ink)}
.ks-btn.is-ki{background:var(--ks-ki)}
.ks-btn.is-big{min-height:58px;font-size:20px;padding:0 28px;box-shadow:var(--ks-kage)}

/* 上の帯 */
.ks-bar{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:10px;height:60px;padding:0 16px}
.ks-bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--ks-tape);opacity:.9}
.ks-ttl{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;white-space:nowrap;min-width:0;overflow:hidden}
.ks-ttl img{height:40px}
.ks-ttl small{font-weight:700;font-size:14px;color:var(--ks-mute);overflow:hidden;text-overflow:ellipsis}
.ks-prog{flex:1;min-width:80px;height:30px;border:var(--ks-sen);border-radius:999px;background:#fff;overflow:hidden;position:relative}
.ks-prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ks-tape);border-right:2.5px solid var(--ks-ink);transition:width .3s}
.ks-prog[hidden]+.ks-sp{flex:1}

/* はじめの画面 */
.ks-start{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:28px;padding:16px}
.ks-start-ty{height:min(52vh,300px)}
.ks-start-r{display:flex;flex-direction:column;gap:14px;align-items:flex-start;max-width:560px}
.ks-start h1{margin:0;font-size:clamp(28px,4.6vw,44px);font-weight:900;line-height:1.15}
.ks-start p{margin:0;font-weight:700;font-size:17px}
.ks-lvls{display:flex;flex-wrap:wrap;gap:10px}
.ks-lvl{min-height:64px;min-width:150px;padding:6px 16px;border:var(--ks-sen);border-radius:16px;background:var(--ks-paper);box-shadow:var(--ks-kage-s);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.3}
.ks-lvl b{font-size:19px;font-weight:900}
.ks-lvl span{font-size:14px;color:var(--ks-mute);font-weight:700}
.ks-lvl:hover{background:var(--ks-sora-men)}
.ks-lvl:active{transform:translate(3px,3px);box-shadow:none}

/* あそぶ画面：工事現場（左に たよすと 建物・右に 黒板） */
.ks-play{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px}
.ks-site{flex:1;min-height:0;position:relative;overflow:hidden;border:var(--ks-sen);border-radius:22px;background:var(--ks-paper) center 30%/cover no-repeat}
.ks-site::before{content:"";position:absolute;inset:0;background:rgba(120,190,235,.16);pointer-events:none}
.ks-mast{position:absolute;left:2%;bottom:14%;height:84%}
.ks-jib{position:absolute;left:-2%;top:1%;width:44%}
.ks-bld{position:absolute;left:13%;bottom:15%;width:25%;aspect-ratio:1}
.ks-bld img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ks-ghost{opacity:.2;filter:grayscale(1)}
.ks-real{transition:clip-path .35s cubic-bezier(.2,1.3,.4,1);clip-path:inset(100% 0 0 0)}
.ks-btag{position:absolute;left:3%;top:4%;background:#fff;border:2px solid var(--ks-ink);border-radius:999px;padding:1px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ks-ty{position:absolute;left:5%;bottom:1%;height:36%;transform-origin:bottom center}
.ks-ty.is-hop{animation:ks-hop .3s}
@keyframes ks-hop{50%{transform:translateY(-8%)}}
.ks-board{position:absolute;right:2%;top:4%;bottom:6%;width:58%;background:var(--ks-board);border:6px solid #8A6A3E;border-radius:14px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.08),var(--ks-kage);color:var(--ks-board-ink);display:flex;flex-direction:column;padding:8px 16px 10px;gap:6px}
.ks-bd-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ks-board-sub);white-space:nowrap}
.ks-chip{border:2px solid var(--ks-board-sub);border-radius:999px;padding:0 10px;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.ks-bun{font-size:17px;line-height:1.6}
.ks-zu{display:flex;justify-content:center;max-height:40%}
.ks-zu svg{max-height:100%;height:auto;background:#fff;border-radius:8px}
.ks-board.is-zu .ks-zu{flex:1 1 0;min-height:0;max-height:none}
.ks-board.is-zu .ks-zu svg{height:100%;width:auto;max-width:100%}
.ks-board.is-zu .ks-q{flex:0 0 auto;font-size:clamp(28px,7vh,44px)}
/* 低学年（1・2年）：黒板を 広く・図を 大きく・えらぶ ボタンを 大きく */
.is-tei .ks-board{width:66%}
.is-tei .ks-btag{display:none}
.is-tei .ks-ch{height:clamp(60px,12vh,80px);font-size:clamp(26px,5.2vh,36px)}
.ks-q{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.3em;
  font:700 clamp(34px,min(9vh,6vw),72px)/1 var(--ks-f-num);letter-spacing:.02em}
.ks-op{color:var(--ks-board-op)}
.ks-fr{display:inline-grid;grid-template-rows:auto 4px auto;align-items:center;justify-items:center;vertical-align:middle}
.ks-fr>span{padding:0 .12em}
.ks-fr>i{width:100%;height:4px;background:currentColor;border-radius:2px}
.ks-mx{display:inline-flex;align-items:center;gap:.08em}
.ks-frs{font-size:.95em;grid-template-rows:auto 2px auto;margin:0 .15em}.ks-frs>i{height:2px}
/* 答えの箱（1けた1箱。分数は 分子・分母の 箱） */
.ks-ans{display:inline-flex;gap:8px}
.ks-ans>span,.ks-box{display:inline-grid;place-items:center;min-width:1.05em;height:1.2em;padding:0 .08em;background:#fff;color:var(--ks-ink);border:3px solid var(--ks-ink);border-radius:10px}
.ks-ans>span.is-cur,.ks-box.is-on{box-shadow:inset 0 -8px 0 var(--ks-ki)}
.ks-boxfr .ks-box{font-size:.8em}
.ks-ph{color:var(--ks-mute);font-size:max(14px,.4em);font-weight:700;line-height:1}
.ks-q.is-ok .ks-ans>span,.ks-q.is-ok .ks-box{background:var(--ks-ok-men)}
.ks-q.is-ng .ks-ans>span,.ks-q.is-ng .ks-box{background:var(--ks-shu-men);color:var(--ks-shu)}
/* ことば（黒板の下） */
.ks-say{flex:0 0 auto;min-height:44px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center}
.ks-say:empty{visibility:hidden}
.ks-say b{display:inline-flex;align-items:center;gap:6px;background:#fff;border:var(--ks-sen);border-radius:999px;padding:2px 16px;font-weight:900;font-size:20px}
.ks-say.is-ok b{background:var(--ks-ki);color:var(--ks-ink)}
.ks-say.is-ng b{color:var(--ks-shu)}
.ks-say.is-mid b{color:var(--ks-mid);background:var(--ks-ki-men)}
.ks-say .ks-hint{font-weight:700;font-size:17px;line-height:1.5;color:var(--ks-board-ink)}

/* 下：キー（たよす建設の .az-pad） */
.ks-pad{flex:0 0 auto;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 16px 12px;background:#F3E6CC;border:var(--ks-sen);border-radius:22px;box-shadow:inset 0 8px 0 0 var(--ks-ki)}
.ks-pad-h{white-space:nowrap;font-weight:700;font-size:14px;color:var(--ks-mute);line-height:1.3;text-align:center}
.ks-k{width:clamp(48px,6vw,72px);height:clamp(52px,9vh,66px);border:var(--ks-sen);border-radius:16px;background:#fff;box-shadow:0 5px 0 var(--ks-ink);font:700 clamp(24px,4.4vh,34px) var(--ks-f-num);color:var(--ks-ink)}
.ks-k:active,.ks-k.is-hit{transform:translateY(4px);box-shadow:0 1px 0 var(--ks-ink);background:var(--ks-ki)}
.ks-k.is-wide{width:auto;padding:0 16px;font:700 18px var(--ks-f);white-space:nowrap}
.ks-k.is-go{background:var(--ks-ki);min-width:120px}
.ks-ch{min-width:120px;height:clamp(56px,10vh,70px);padding:0 18px;border:var(--ks-sen);border-radius:16px;background:#fff;box-shadow:0 5px 0 var(--ks-ink);font:700 clamp(24px,4.4vh,32px) var(--ks-f-num);display:inline-flex;align-items:center;justify-content:center}
.ks-ch.is-ok{background:var(--ks-ok-men)} .ks-ch.is-ng{background:var(--ks-shu-men);color:var(--ks-shu)}
.ks-ch:disabled{cursor:default}
.ks-ch{white-space:nowrap}

/* ひとまとまり おわり＝建物 完成 */
.ks-end{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:24px;padding:16px}
.ks-end-pic{position:relative;width:min(42vw,340px);aspect-ratio:1;border:var(--ks-sen);border-radius:22px;background:var(--ks-paper) center/cover no-repeat;overflow:hidden;box-shadow:var(--ks-kage)}
.ks-end-pic img{position:absolute;object-fit:contain}
.ks-end-b{left:28%;bottom:8%;width:66%;height:84%}
.ks-end-ty{left:2%;bottom:0;height:46%}
.ks-end-r{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.ks-end-r h2{margin:0;font-size:clamp(26px,4vw,38px);font-weight:900}
.ks-end-r p{margin:0;font-weight:700;font-size:17px}
.ks-end-r .ks-marks{font:700 clamp(30px,5vw,40px)/1.2 var(--ks-f-num);letter-spacing:.15em}
.ks-marks .is-x{color:var(--ks-shu)}
.ks-row{display:flex;gap:12px;flex-wrap:wrap}

#ks-err{position:fixed;inset:0;background:#fff;z-index:99;padding:24px;font-size:16px;overflow:auto}
#ks-err b{color:var(--ks-shu);font-size:20px}
@media (prefers-reduced-motion:reduce){.ks-ty.is-hop{animation:none}.ks-real,.ks-prog i{transition:none}}

/* スマホ・たて長：黒板を上、建物と たよすを 下に */
@media (max-width:720px){
  .ks-bar{gap:8px;padding:0 10px}
  .ks-ttl small{display:none}
  .ks-play{padding:8px 10px 10px;gap:8px}
  .ks-board{left:3%;right:3%;width:auto;top:3%;bottom:auto;height:58%}
  .is-tei .ks-board{width:auto;height:64%}
  .is-tei .ks-ch{font-size:clamp(20px,6.2vw,28px)}
  .ks-bld{left:auto;right:6%;bottom:4%;width:34%}
  .ks-ty{left:6%;height:34%}
  .ks-btag{top:auto;bottom:38%;left:auto;right:4%}
  .ks-mast,.ks-jib{display:none}
  .ks-pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px 10px 12px}
  .ks-pad-h{display:none}
  .ks-k{width:auto;height:56px}
  .ks-k.is-wide{grid-column:span 2;padding:0 6px}
  .ks-pad.is-erabu{grid-template-columns:1fr 1fr}
  .ks-ch{min-width:0;padding:0 8px;font-size:clamp(18px,5.6vw,26px)}
  .ks-start,.ks-end{flex-direction:column;gap:12px}
  .ks-start-ty{height:28vh}
  .ks-start-r,.ks-end-r{align-items:stretch}
  .ks-end-pic{width:min(80vw,300px)}
}
</style>
<style>
/* ── 算数バトル・国語バトル：本体（クラス名の 頭は tk-） ── */
:root{--ks-bg:#FFFFFF}
body{background-image:none}
.tk-app{height:100%;display:flex;flex-direction:column}
.tk-bar{flex:0 0 48px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:2px solid #D9D6CC}
.tk-ttl{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;white-space:nowrap}
.tk-ttl .pt-ic{width:26px;height:26px}
.tk-what{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:var(--ks-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-what .pt-ic{width:22px;height:22px;flex:0 0 auto}
.tk-bar .ks-btn{min-height:44px;padding:0 14px;font-size:15px;box-shadow:none}
.tk-bar .ks-btn .pt-ic{width:20px;height:20px}
.tk-main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.tk-scr{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:10px 14px;padding:10px 14px}
.tk-card{min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:#fff;border:var(--ks-sen);border-radius:16px;overflow:auto}
.tk-card h2,.tk-card h3{margin:0;display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px}
.tk-card h2 .pt-ic,.tk-card h3 .pt-ic{width:26px;height:26px}
.tk-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:16px}
.tk-chip{min-height:44px;padding:0 14px;border:2px solid var(--ks-ink);border-radius:12px;background:#fff;font-weight:700;font-size:16px;color:var(--ks-ink)}
.tk-chip.is-on{background:var(--ks-ki);border-width:3px;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.tk-nt .ks-btn{min-width:48px;min-height:44px;padding:0 12px;font-size:22px;box-shadow:none}
.tk-nt b{min-width:4.4em;text-align:center;font:700 20px var(--ks-f-num)}
.tk-go{margin-top:auto}
.tk-app .ks-btn .pt-ic{width:1.2em;height:1.2em;flex:0 0 auto}
.tk-foot{grid-column:1/-1;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.tk-err{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;max-width:92%;margin:0;padding:8px 14px;border:2px solid #B3261E;border-radius:12px;background:#FDECEA;color:#8C1D18;font-weight:700;font-size:16px}
.tk-err::before{content:"！ ";font-weight:900}
.tk-note{margin:0;font-size:14px;color:var(--ks-mute)}
/* 入口：遊び方の 札 */
.tk-top{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.tk-heyas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.tk-hy{width:100%;min-height:112px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border:var(--ks-sen);border-radius:14px;background:#fff;text-align:left;box-shadow:var(--ks-kage-s)}
.tk-hy:hover{background:var(--ks-ki-men)}
.tk-hy:active{transform:translate(3px,3px);box-shadow:none}
.tk-hy .pt-ic{width:34px;height:34px}
.tk-hy b{font-weight:900;font-size:18px}
.tk-hy small{font-size:14px;color:var(--ks-mute);font-weight:700}
.tk-hy span{font-size:14px;font-weight:700;line-height:1.35}
.tk-code{width:100%;max-width:200px;height:60px;padding:0 14px;border:var(--ks-sen);border-radius:12px;background:#fff;font:700 32px var(--ks-f-num);color:var(--ks-ink);letter-spacing:.2em}
.tk-rules{margin:0;padding-left:1.4em;font-weight:700;font-size:16px;line-height:1.6}
/* まつ所 */
.tk-big{font:900 clamp(56px,14vh,96px) var(--ks-f-num);letter-spacing:.18em;line-height:1;text-align:center;padding:6px 0}
.tk-msg{margin:0;font-weight:700;font-size:17px;text-align:center}

<style>
/* ── 部屋：つな引き（クラス名の 頭は tsuna-） ──
   上＝つなの 舞台（はば いっぱい）／下＝むずかしさ（左）と ぴったりの 問題（右）。動きは みじかく、点めつ なし */
:root{--tsuna-a:#2F5F96;--tsuna-a-men:#E3EEFA;--tsuna-b:#A63D16;--tsuna-b-men:#FCE9DF;--tsuna-run:120px}
.tsuna-wrap{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:152px minmax(0,1fr);gap:8px 10px;padding:8px 14px 10px}
/* 舞台 */
.tsuna-st{--tsuna-x:0;--tsuna-a0:0;--tsuna-a1:0;grid-column:1/-1;position:relative;overflow:hidden;border:var(--ks-sen);border-radius:18px;background:#fff}
.tsuna-bg{position:absolute;top:0;bottom:0;width:50%}
.tsuna-bg.is-t0{left:0;background:var(--tsuna-a-men)} .tsuna-bg.is-t1{right:0;background:var(--tsuna-b-men)}
.tsuna-bg::after{content:"";position:absolute;inset:0;transition:opacity .4s}
.tsuna-bg.is-t0::after{background:var(--tsuna-a);opacity:calc(var(--tsuna-a0) * .22)}
.tsuna-bg.is-t1::after{background:var(--tsuna-b);opacity:calc(var(--tsuna-a1) * .22)}
.tsuna-top{position:absolute;left:8px;right:8px;top:6px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tsuna-tl{display:flex;align-items:center;gap:5px;padding:2px 10px 2px 3px;background:#fff;border:2px solid var(--ks-ink);border-radius:12px;font-weight:900;font-size:16px;white-space:nowrap}
.tsuna-tl.is-me{border-width:3px;box-shadow:var(--ks-kage-s)}
.tsuna-tl small{margin-left:2px;padding:0 8px;border:2px solid var(--ks-ink);border-radius:999px;font-size:14px;font-weight:900}
.tsuna-tl .tk-mk{width:28px;height:28px;border-radius:7px}.tsuna-tl .tk-mk .pt-ic{width:18px;height:18px}
.tsuna-tl.is-t0 .tk-mk{color:var(--tsuna-a)} .tsuna-tl.is-t1 .tk-mk{color:var(--tsuna-b)}
.tsuna-tl.is-yank{animation:tsuna-bump .35s ease-out}
@keyframes tsuna-bump{40%{transform:scale(1.08)}}
.tsuna-time{position:relative;width:min(320px,40%);height:36px;border:2px solid var(--ks-ink);border-radius:999px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;font:700 17px var(--ks-f-num)}
.tsuna-time i{position:absolute;inset:0 auto 0 0;background:var(--ks-ki-men);border-right:2px solid var(--ks-ink);transition:width .2s linear}
.tsuna-time span{position:relative;white-space:nowrap}
.tsuna-mid{position:absolute;left:50%;top:46px;bottom:26px;z-index:1;border-left:3px dashed var(--ks-ink);transform:translateX(-1.5px)}
/* つなと 人：しるしと いっしょに まとめて 動く（引いた がわへ ぐっと、少し はずんで 止まる） */
.tsuna-move{position:absolute;left:0;right:0;top:46px;height:78px;z-index:2;transform:translateX(calc(var(--tsuna-x) * var(--tsuna-run)));transition:transform .45s cubic-bezier(.25,1.45,.45,1)}
.tsuna-cord{position:absolute;left:6%;right:6%;top:38px;height:12px;border:2px solid #5A3E1B;border-radius:6px;background:repeating-linear-gradient(-55deg,#C99A55 0 6px,#8A6A3E 6px 10px)}
.tsuna-crew{position:absolute;top:5px;display:flex;gap:2px}
.tsuna-crew.is-t0{left:13%} .tsuna-crew.is-t1{right:13%;transform:scaleX(-1)}
.tsuna-man{width:44px;height:64px;stroke:var(--ks-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:#fff;transform-origin:50% 100%}
.tsuna-crew.is-t0 .tsuna-helm{fill:var(--tsuna-a-men);stroke:var(--tsuna-a)} .tsuna-crew.is-t1 .tsuna-helm{fill:var(--tsuna-b-men);stroke:var(--tsuna-b)}
.tsuna-crew.is-yank .tsuna-man{animation:tsuna-lean .4s ease-out}
.tsuna-crew.is-yank .tsuna-man:nth-child(2){animation-delay:.05s} .tsuna-crew.is-yank .tsuna-man:nth-child(3){animation-delay:.1s}
@keyframes tsuna-lean{40%{transform:translateX(-7px) rotate(-12deg)}}
.tsuna-crew.is-win .tsuna-man{animation:tsuna-hop .5s ease-out 2}
@keyframes tsuna-hop{45%{transform:translateY(-10px)}}
.tsuna-flag{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.tsuna-flag b{display:block;width:28px;height:28px;background:#fff;border:3px solid var(--ks-ink);transform:rotate(45deg);box-shadow:inset 0 0 0 6px var(--ks-ki)}
.tsuna-flag i{display:block;width:4px;height:16px;background:var(--ks-ink);margin-top:-5px}
/* 正かいの 手ごたえ：力の 数だけの やじるしと「ぐっ！」が 引いた ほうへ 流れる */
.tsuna-burst{position:absolute;top:58px;left:calc(50% + var(--tsuna-x) * var(--tsuna-run));z-index:4;transform:translateX(-50%);pointer-events:none;opacity:0}
.tsuna-burst b{display:inline-flex;align-items:center;gap:2px;padding:2px 12px;background:var(--ks-ki);border:2.5px solid var(--ks-ink);border-radius:999px;font-weight:900;font-size:18px;white-space:nowrap}
.tsuna-burst .pt-ic{width:18px;height:18px;stroke-width:3}
.tsuna-lf{display:inline-flex;transform:scaleX(-1)}
.tsuna-burst.is-t0.is-go{animation:tsuna-fl .7s ease-out}
.tsuna-burst.is-t1.is-go{animation:tsuna-fr .7s ease-out}
@keyframes tsuna-fl{0%{opacity:1;transform:translate(-50%,0)}70%{opacity:1}100%{opacity:0;transform:translate(-130%,-6px)}}
@keyframes tsuna-fr{0%{opacity:1;transform:translate(-50%,0)}70%{opacity:1}100%{opacity:0;transform:translate(30%,-6px)}}
/* さいごの 5びょう */
.tsuna-cd{position:absolute;left:calc(50% + min(160px,20%) + 12px);top:2px;z-index:4;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid var(--ks-ink);border-radius:50%;font:900 28px var(--ks-f-num);box-shadow:var(--ks-kage-s)}
.tsuna-cd.is-pop{animation:tsuna-pop .25s ease-out}
@keyframes tsuna-pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tsuna-lead{position:absolute;left:0;right:0;bottom:0;height:26px;z-index:3;display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;border-top:2px solid var(--ks-ink);font-weight:900;font-size:15px;white-space:nowrap}
.tsuna-lead .tk-mk{width:22px;height:22px;border-radius:5px}.tsuna-lead .tk-mk .pt-ic{width:15px;height:15px}
/* ラストスパート：ふちが 黄色の しまに・時間の 帯も 黄色 */
.tsuna-st.is-spurt{box-shadow:inset 0 0 0 4px var(--ks-ki)}
.tsuna-st.is-spurt::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;z-index:3;background:var(--ks-tape)}
.tsuna-st.is-spurt .tsuna-time{border-width:3px;background:var(--ks-ki)}
.tsuna-st.is-spurt .tsuna-time i{background:#fff}
.tsuna-st.is-spurt .tsuna-time span{font-weight:900}
/* かち */
.tsuna-win{position:absolute;left:50%;top:40px;z-index:5;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 26px;background:#fff;border:var(--ks-sen);border-radius:16px;box-shadow:var(--ks-kage);animation:tsuna-pop .3s ease-out;white-space:nowrap}
.tsuna-win b{display:flex;align-items:center;gap:8px;font-size:28px;font-weight:900}
.tsuna-win span{font-weight:700;font-size:15px}
.tsuna-win .tk-mk{width:36px;height:36px}.tsuna-win .tk-mk .pt-ic{width:24px;height:24px}
/* むずかしさ */
.tsuna-l{min-height:0;display:flex;flex-direction:column;gap:6px}
.tsuna-th{font-weight:900;font-size:15px}
.tsuna-tiers{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(48px,1fr);gap:6px}
.tsuna-tier{min-height:48px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:2px 12px;border:var(--ks-sen);border-radius:14px;background:#fff;box-shadow:var(--ks-kage-s);text-align:left;font-weight:700;font-size:15px;line-height:1.2;color:var(--ks-ink);min-width:0}
.tsuna-tier span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsuna-tier.is-on{background:var(--ks-ki);box-shadow:inset 0 0 0 2px var(--ks-ink),var(--ks-kage-s)}
.tsuna-tier:active{transform:translate(2px,2px);box-shadow:none}
.tsuna-tier:disabled{opacity:.6;cursor:default}
.tsuna-pw{display:flex;align-items:center;gap:2px}
.tsuna-pw i{width:16px;height:12px;border:2px solid var(--ks-ink);border-radius:3px;background:#fff}
.tsuna-pw i.is-on{background:var(--ks-ink)}
.tsuna-pw b{margin-left:4px;font:900 15px var(--ks-f-num)}
.tsuna-pw b::before{content:"ひく力 ";font:700 14px var(--ks-f)}
/* ぴったりの 問題 */
.tsuna-r{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.tsuna-board{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:6px 14px;background:var(--ks-board);border:6px solid #8A6A3E;border-radius:16px;color:var(--ks-board-ink)}
.tsuna-goal{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:16px;color:var(--ks-board-sub)}
.tsuna-goal b{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;padding:0 .3em;border:3px dashed var(--ks-board-op);border-radius:14px;font:700 clamp(28px,7vh,42px)/1.1 var(--ks-f-num);color:var(--ks-board-op)}
.tsuna-shiki{flex:1;min-height:1.4em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.18em;padding:2px 8px;border-top:2px dashed rgba(255,255,255,.35);font:700 clamp(24px,6vh,34px)/1.1 var(--ks-f-num)}
.tsuna-shiki .tsuna-c{display:inline-flex;align-items:center;justify-content:center;min-width:1.2em;padding:.04em .16em;background:#fff;color:var(--ks-ink);border-radius:8px}
.tsuna-shiki .tsuna-k{color:var(--ks-board-sub)}
.tsuna-shiki .tsuna-ph{font:700 16px/1.5 var(--ks-f);color:var(--ks-board-sub)}
.tsuna-shiki.is-ok .tsuna-c{background:var(--ks-ok-men)}
.tsuna-shiki.is-ng .tsuna-c{background:var(--ks-shu-men)}
.tsuna-shiki.is-mihon .tsuna-c{background:var(--ks-ki-men)}
.tsuna-goal .ks-fr,.tsuna-shiki .ks-fr{font-size:.66em}
.tsuna-say{flex:0 0 44px;display:flex;align-items:center;justify-content:center;gap:4px 10px;flex-wrap:nowrap;overflow:hidden;font-weight:700;font-size:16px}
.tsuna-say b{display:inline-flex;align-items:center;gap:6px;background:#fff;border:var(--ks-sen);border-radius:999px;padding:2px 14px;font-size:17px;white-space:nowrap}
.tsuna-say.is-ok b{background:var(--ks-ki);animation:tsuna-pop .25s ease-out}
.tsuna-say.is-ng b{color:var(--ks-shu)}
.tsuna-say .pt-ic{width:20px;height:20px}

.nazoru-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:6px 12px 10px}
.nazoru-bar{display:flex;align-items:center;gap:8px;min-height:48px;flex-wrap:wrap}
.nazoru-tm{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 4px;border:1px solid var(--ks-line,#d1d5db);border-radius:22px;background:#fff;font-size:15px}
.nazoru-tm.is-me{border:2px solid #1f2937}
.nazoru-tm small{font-size:14px;font-weight:700;margin-right:2px}
.nazoru-tm .tk-mk{width:30px;height:30px}
.nazoru-od{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#6b7280}
.nazoru-od svg{width:20px;height:20px}
.nazoru-od.is-done{background:#e6f4ea;color:#1b7f3b;box-shadow:inset 0 0 0 2px #1b7f3b}
.nazoru-od.is-now{box-shadow:inset 0 0 0 2px #1f2937;color:#1f2937}
.nazoru-time{margin-left:auto;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.nazoru-box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.nazoru-st{position:relative;aspect-ratio:var(--nazoru-ar,16/9);max-width:100%;max-height:100%;width:100%;border-radius:12px;overflow:hidden;background:#eef1f4}
.nazoru-st video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.nazoru-veil{position:absolute;inset:0;background:rgba(255,255,255,.35)}
.nazoru-st canvas{position:absolute;inset:0;width:100%;height:100%}
.nazoru-msg{position:absolute;left:50%;top:8px;transform:translateX(-50%);padding:5px 14px;border-radius:18px;background:rgba(255,255,255,.94);font-size:18px;font-weight:700;white-space:nowrap;pointer-events:none}
.nazoru-msg:empty{display:none}
.nazoru-pl{position:absolute;bottom:8px;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid #d1d5db;border-radius:20px;background:rgba(255,255,255,.94);font-size:16px;font-weight:700}
.nazoru-pl.is-p0{left:8px} .nazoru-pl.is-p1{right:8px}
.nazoru-pl svg{width:22px;height:22px;flex:none}
.nazoru-pl[data-k="ok"]{color:#1b7f3b;border-color:#86c79a;background:#f0faf3}
.nazoru-pl[data-k="ng"]{color:#b45309;border-color:#f3c48a;background:#fffaf2}
.nazoru-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;padding:16px;text-align:center}
.nazoru-cam p{margin:0;font-size:18px;line-height:1.6}
.nazoru-cam .nazoru-err{color:#b91c1c;font-size:16px}
.nazoru-cam button{min-height:48px;padding:0 24px;border:1px solid #d1d5db;border-radius:24px;background:#f3f4f6;font-size:17px;font-weight:700}
.nazoru-done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.88);text-align:center;pointer-events:none}
.nazoru-done b{font-size:44px;color:#1b7f3b}
.nazoru-done span{font-size:22px}
.nazoru-cam[hidden],.nazoru-done[hidden],.nazoru-cam [hidden]{display:none!important}
</style>
</head>
<body>
<div class="tk-app">
  <header class="tk-bar">

        <label class="tk-row" for="tk-code">あいことば（4けた）</label>
        <input class="tk-code" id="tk-code" type="text" inputmode="numeric" maxlength="4" autocomplete="off">
        <button class="ks-btn is-ki is-big tk-go" id="tk-join" type="button">入る <svg class="pt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

      </div>
    </section>

    <section class="tk-scr" id="tk-make" hidden aria-labelledby="tk-m-h">
      <div class="tk-card">
        <h2 id="tk-m-h"></h2>
        <ol class="tk-rules" id="tk-m-rules"></ol>
      </div>
      <div class="tk-card">
        <h3>へやを つくる</h3>
        <div class="tk-row" id="tk-kind" role="group" aria-label="たいせんの かたち">
          <button class="tk-chip" type="button" data-k="1v1">1対1</button>
          <button class="tk-chip" type="button" data-k="team">チーム戦</button>
        </div>
        <div class="tk-row tk-nt" id="tk-nt" hidden>チームの 数<button class="ks-btn" id="tk-nt-m" type="button" aria-label="チームを へらす">−</button><b id="tk-nt-v"></b><button class="ks-btn" id="tk-nt-p" type="button" aria-label="チームを ふやす">＋</button></div>
        <div id="tk-pick"></div>
        <button class="ks-btn is-ki is-big tk-go" id="tk-mk" type="button">へやを つくる <svg class="pt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </section>

    <section class="tk-scr" id="tk-wait" hidden aria-label="まつ所">
      <div class="tk-card">
        <h3>あいことば</h3>
        <div class="tk-big" id="tk-w-code"></div>
        <p class="tk-msg" id="tk-w-msg"></p>
        <button class="ks-btn is-ki is-big tk-go" id="tk-start" type="button" hidden>はじめる <svg class="pt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="tk-card">
        <h3 id="tk-w-th">チーム</h3>
        <ul class="tk-teams" id="tk-w-teams"></ul>
      </div>
    </section>

    <section class="tk-play" id="tk-play" hidden aria-label="あそぶ所"></section>

    <section class="tk-scr" id="tk-end" hidden aria-labelledby="tk-e-h">
      <div class="tk-card">
        <h3 id="tk-e-h">けっか</h3>
        <ol class="tk-res" id="tk-e-l"></ol>
        <div class="tk-endx" id="tk-e-x"></div>

        <div class="tk-cmrow"><input id="tk-cm" type="text" maxlength="30" autocomplete="off" placeholder="コメント（30字まで）" aria-label="コメント 30字まで"><button class="ks-btn is-ki" id="tk-cm-go" type="button"><svg class="pt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15V4M7 9l5-5 5 5M5 14v5h14v-5"/></svg> おくる</button></div>
        <span class="tk-cmn" id="tk-cm-n"></span>
        <ul class="tk-feed" id="tk-feed" aria-live="polite"></ul>
      </div>
    </section>
    <p class="tk-err" id="tk-err" hidden role="alert"></p>
  </main>
</div>

    draw(ctx) { C = ctx; if (S && ctx.el.querySelector('.nazoru-wrap')) { bar(); clock(); } },
    stop() {
      if (!S) return;
      cancelAnimationFrame(S.raf); clearTimeout(S.doneT);
      if (S.ro) S.ro.disconnect();
      if (S.stream) S.stream.getTracks().forEach(t => t.stop());   // カメラを とめる
      S = null;
    },
    wait(ctx) { return ctx.live ? 2000 : 1000; },
    // 見本だけ：たよすの チームも 15〜25びょうに 1つ 合体
    bot(R, me, now) {
      if (!R.g || !R.g.k) return null;
      const k = R.g.k[me] || 0, last = (R.g.at && R.g.at[me]) || R.t0;
      if (k >= NAZO_N || now - last < 15000 + ((k * 3700 + R.n * 1300) % 10000)) return null;
      return ['clr', { i: k }];
    }
  };
})());
TK.init();
if (KUBARU_NG) { var tkN = document.getElementById('tk-note'); if (tkN) { tkN.textContent = KUBARU_NG; tkN.hidden = false; tkN.style.color = '#b42318'; } }
</script>
