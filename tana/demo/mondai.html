<script>const JM_ROUTE={"assignment":"","result":"","board":"","story":""};</script>
<script>
// 見本の描画と教材を保ち、保存と配布だけ学校の処理へ接続する。
const jmCloud={boot:null,pending:false,saved:new Map(),revs:new Map(),task:null,dirty:false,answers:[],index:0,requestId:jmShelfId()};
const jmStatus=document.createElement('div');jmStatus.className='jm-cloud-status';jmStatus.setAttribute('role','status');document.body.append(jmStatus);
function jmMessage(s=''){jmStatus.textContent=s}
function jmRPC(op,arg={}){return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{done=true;reject(Error('返事が届きません。入力は残っています。もう一度保存してください。'))},30000);google.script.run.withSuccessHandler(v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)}).withFailureHandler(e=>{if(done)return;done=true;clearTimeout(timer);reject(Error(e.message||'接続できませんでした。'))}).jmApi(op,arg)})}
async function jmRun(fn){if(jmCloud.pending)return;jmCloud.pending=true;const targets=[$('#app'),$('#layer')].filter(Boolean);targets.forEach(x=>x.inert=true);jmMessage('確認中…');try{await fn();jmMessage('')}catch(e){jmMessage(e.message)}finally{jmCloud.pending=false;targets.forEach(x=>x.inert=false)}}
// 自動保存は編集中のメモリへ。明示した保存で学校へ送る。
jmShelfWrite=function(){jmCloud.dirty=jmShelf.some(e=>JSON.stringify(e.material)!==jmCloud.saved.get(e.id));return true};
jmDraftLoad=function(){};
window.addEventListener('beforeunload',e=>{jmDraftSave();if(jmCloud.dirty||jmCloud.pending){e.preventDefault();e.returnValue=''}});
function jmFromServer(m){return m.mock||{title:m.title,g:m.grade,s:m.subject,creationMode:'free',qs:m.questions.map(q=>q.type==='choice'?{t:'c',p:q.prompt,a:q.choices[q.correct],w:q.choices.filter((_,i)=>i!==q.correct)}:{t:'k',p:q.prompt})}}
async function jmSaveCloud(){jmDraftSave();for(const e of jmShelf){if(e.metadata)continue;const body=JSON.stringify(e.material);if(jmCloud.saved.get(e.id)===body)continue;const out=await jmRPC('saveDraft',{id:e.id,rev:jmCloud.revs.get(e.id)||0,material:e.material});jmCloud.revs.set(e.id,out.rev);jmCloud.saved.set(e.id,body)}jmShelfWrite()}
jmShelfDownload=()=>jmRun(async()=>{jmDraftSave();for(const e of jmShelf)await jmGetDraft(e.id);jmDownloadJSON({version:2,currentId:S.draftId||null,entries:jmShelf.map(({id,material,updatedAt})=>({id,material,updatedAt}))},'授業メイト_教材の棚.json')});
async function jmGetDraft(id){const e=jmShelf.find(x=>x.id===id);if(!e)throw Error('教材が見つかりません。');if(e.metadata){const r=await jmRPC('getMaterial',{id});e.material=jmFromServer(r.material);delete e.metadata;jmCloud.revs.set(id,r.rev);jmCloud.saved.set(id,JSON.stringify(e.material))}return e}
const jmOriginalOpen=jmShelfOpen;
jmShelfOpen=id=>jmRun(async()=>{await jmGetDraft(id);jmOriginalOpen(id)});
jmShelfCopy=id=>jmRun(async()=>{const e=await jmGetDraft(id),m=jmClone(e.material);m.title=(m.title+'（コピー）').slice(0,200);if(jmDraftBegin(m)){S.view='edit';render()}});
const jmOriginalShelf=jmShelfView;
jmShelfView=function(){jmOriginalShelf();$('#head .jm-month').textContent='';document.querySelectorAll('.jm-shelf-open').forEach(b=>{const e=jmShelf.find(x=>x.id===b.dataset.jmDraft);if(e?.metadata)b.lastElementChild.textContent=''});jmSaveButton()};
const jmOriginalEdit=edit;
edit=function(){jmOriginalEdit();jmSaveButton()};
function jmSaveButton(){const b=document.createElement('button');b.className='jm-btn jm-cloud-save';b.id='jm-cloud-save';b.textContent='保存';b.onclick=()=>jmRun(async()=>{await jmSaveCloud();toast('学校のGoogleに保存しました')});$('#head').append(b)}
// 見本の「配る」の位置・様式を使う。未対応の形式は配布前に止める。
shareSheet=function(){if(!S.cur)return;const id=jmShelfId();$('#layer').innerHTML=`<div class="jm-veil" data-close><form class="jm-sheet" id="jm-cloud-share"><div class="jm-sh-head"><h2>配る</h2><button class="jm-ic" type="button" data-close aria-label="閉じる">${IC.x}</button></div><div class="jm-sh-body"><b>${esc(S.cur.title)}</b><div class="jm-distribution-fields"><label>学年<select class="jm-sel" id="jm-send-grade">${[1,2,3,4,5,6].map(g=>`<option ${g===S.cur.g?'selected':''}>${g}</option>`).join('')}</select></label><label>組<select class="jm-sel" id="jm-send-class">${[1,2,3].map(k=>`<option ${k===S.me?.k?'selected':''}>${k}</option>`).join('')}</select></label></div><button class="jm-btn jm-btn-p">${IC.send}配布リンクを作る</button></div></form></div>`;$('#jm-cloud-share').onsubmit=e=>{e.preventDefault();const grade=+$('#jm-send-grade').value,kumi=+$('#jm-send-class').value;jmRun(async()=>{await jmSaveCloud();const r=await jmRPC('distribute',{id,materialId:S.draftId,materialRev:jmCloud.revs.get(S.draftId),grade,kumi});jmCloud.boot.assignments.unshift(r);closeSheet();S.view='dist';render()})}}
function jmURL(key,id){const u=new URL(jmCloud.boot.url);u.searchParams.set(key,id);return u.href}
jmPreviewURL=id=>jmURL('k',id);jmEvaluationURL=id=>jmURL('r',id);
jmCopyLink=async url=>{try{await navigator.clipboard.writeText(url);toast('リンクをコピーしました')}catch(e){$('#layer').innerHTML=`<div class="jm-veil" data-close><div class="jm-sheet"><div class="jm-sh-head"><h2>配布リンク</h2><button class="jm-ic" data-close aria-label="閉じる">${IC.x}</button></div><div class="jm-sh-body"><input class="jm-sel" aria-label="コピーするリンク" readonly value="${esc(url)}"></div></div></div>`}};
function jmDistributionView(resultsOnly){$('#head').innerHTML=`<h1>${resultsOnly?'結果':'配る'}</h1>`;$('#body').innerHTML=`<div class="jm-dlist">${jmCloud.boot.assignments.map(r=>`<div class="jm-drow"><div class="jm-dt"><b>${esc(r.title)}</b><span>${r.grade}年${r.kumi}組${r.on?'':'・停止中'}</span></div>${resultsOnly?'':`<button class="jm-ic" data-cloud-copy="${r.id}" aria-label="配布リンクをコピー">${IC.copy}</button><button class="jm-ic" data-cloud-stop="${r.id}" aria-label="${r.on?'配布を止める':'配布を再開する'}" aria-pressed="${r.on}">${r.on?IC.ok:IC.x}</button>`}<a class="jm-ic" href="${esc(jmEvaluationURL(r.id))}" target="_blank" rel="noopener" aria-label="${esc(r.title)}の結果を開く">${IC.open}</a></div>`).join('')||'<p>配布した教材はまだありません</p>'}</div>`;document.querySelectorAll('[data-cloud-copy]').forEach(b=>b.onclick=()=>jmCopyLink(jmPreviewURL(b.dataset.cloudCopy)));document.querySelectorAll('[data-cloud-stop]').forEach(b=>b.onclick=()=>jmRun(async()=>{const a=jmCloud.boot.assignments.find(x=>x.id===b.dataset.cloudStop);const r=await jmRPC('toggle',{id:a.id,rev:a.rev,on:!a.on});Object.assign(a,r);jmDistributionView(false)}))}
distView=()=>jmDistributionView(false);result=()=>jmDistributionView(true);
// 子どもに正答を送らず、見本の枠・色・進み具合を使って回答する。
function jmChild(){const m=jmCloud.opened.material,i=jmCloud.index,q=m.questions[i];S.who='k';$('#layer').innerHTML=`<div class="jm-kidfull"><div class="jm-kidtop"><span class="jm-child-title"><span class="jm-child-book" aria-hidden="true">${jmIcon('book')}</span>${esc(m.title)}</span></div><form class="jm-kid" id="jm-cloud-answer"><div class="jm-child-progress"><span>${i+1} / ${m.questions.length}</span></div><div class="jm-q">${esc(q.prompt)}</div>${q.type==='choice'?`<div class="jm-ch">${q.choices.map((c,j)=>`<button type="button" class="jm-cloud-choice" data-answer="${j}" aria-pressed="${jmCloud.answers[i]===c}"><span class="jm-child-choice-number">${j+1}</span>${esc(c)}</button>`).join('')}</div>`:`<textarea class="jm-ta jm-cloud-child-answer" aria-label="答え" maxlength="2000" required>${esc(jmCloud.answers[i]||'')}</textarea>`}<div class="jm-next">${i?`<button type="button" class="jm-ic" id="jm-cloud-prev" aria-label="前の問題">${IC.back}</button>`:''}<button class="jm-ic jm-go" aria-label="${i===m.questions.length-1?'回答を送る':'つぎへ'}">${i===m.questions.length-1?IC.send:IC.next}</button></div></form></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{jmCloud.answers[i]=q.choices[+b.dataset.answer];jmCloud.dirty=true;jmChild()});const ta=$('#jm-cloud-answer textarea');if(ta)ta.oninput=()=>{jmCloud.answers[i]=ta.value;jmCloud.dirty=true};if($('#jm-cloud-prev'))$('#jm-cloud-prev').onclick=()=>{jmCloud.index--;jmChild()};$('#jm-cloud-answer').onsubmit=e=>{e.preventDefault();if(!jmCloud.answers[i]?.trim()){jmMessage('答えを入れてね');return}jmMessage();if(i<m.questions.length-1){jmCloud.index++;jmChild();return}jmRun(async()=>{await jmRPC('submit',{id:JM_ROUTE.assignment,requestId:jmCloud.requestId,answers:jmCloud.answers,profile:jmCloud.profile});jmCloud.dirty=false;jmChildDone('回答を送りました')})}}
function jmChildDone(message){$('#layer').innerHTML=`<div class="jm-kidfull"><div class="jm-kid"><div class="jm-done"><div class="jm-child-finish" aria-hidden="true">${IC.ok}</div><h2>おつかれさま！</h2><p>${esc(message)}</p></div></div></div>`}

jmRun(async()=>{const b=await jmRPC('boot');jmCloud.boot=b;document.querySelectorAll('.jm-who').forEach(e=>e.textContent='学年・組');if(JM_ROUTE.board){$('#app').hidden=true;document.querySelectorAll('nav').forEach(x=>x.hidden=true);await jmBoardStart(JM_ROUTE.board);return}if(JM_ROUTE.assignment){$('#app').hidden=true;jmCloud.opened=await jmRPC('open',{id:JM_ROUTE.assignment});if(jmCloud.opened.submitted){jmChildDone('回答は届いています');return}if(jmCloud.opened.needsProfile){S.kid={m:{title:jmCloud.opened.material.title}};const original=nameForm;nameForm=function(){original();$('#nf').onsubmit=e=>{e.preventDefault();const f=S.kid.form;jmCloud.profile={grade:f.g,kumi:f.k,ban:f.b,sei:f.sei.trim(),mei:f.mei.trim()};jmChild()}};nameForm()}else jmChild();return}if(b.me.role!=='teacher'){ $('#body').textContent='先生から配られたリンクで開いてね。';document.querySelectorAll('nav').forEach(x=>x.hidden=true);return}jmShelf=b.materials.map(m=>({id:m.id,metadata:true,updatedAt:Date.parse(m.updated)||0,material:{title:m.title,g:m.grade,s:m.subject,qs:[]}}));jmShelf.forEach(e=>{jmCloud.revs.set(e.id,b.materials.find(m=>m.id===e.id).rev);jmCloud.saved.set(e.id,JSON.stringify(e.material))});S.me={g:b.me.grade||6,k:b.me.kumi||1,subj:HOME_SUBJ.slice()};S.grade=S.me.g;document.querySelectorAll('.jm-who').forEach(e=>e.textContent=S.me.g+'年'+S.me.k+'組');if(JM_ROUTE.result){document.querySelectorAll('nav').forEach(x=>x.hidden=true);await jmResults()}else render()});

<script>
// 板の用意：アプリの画面（国語）のいちばん上に「みんなで書く板」。単元ごとのカード（挿絵か形の絵）→ 右の引き出し →［始める］の2クリック。
// 中身は学校の表「中身」（act 'contents'）、使用中は act 'list' の src（どの行から作ったか）で見分ける。挿絵は act 'thumbs' で12まで。
// 単元（題）でまとめる。学年0（どの学年でも）はどの学年にも出す。使用中が先、そのあと今月に近い順、月のないものは最後。
function ibUnits(list,grade,boards,now){const m=new Map();
 list.forEach(c=>{if(grade&&c.grade&&c.grade!==grade)return;const t=c.content.title||c.name,k=c.grade+'|'+t;if(!m.has(k))m.set(k,{title:t,grade:c.grade,mo:c.mo||0,rows:[]});m.get(k).rows.push(c)});
 const live=u=>u.rows.some(r=>boards.some(b=>!b.closed&&b.src===r.id)),near=mo=>mo?(mo-now+12)%12:99;
 return [...m.values()].map(u=>Object.assign(u,{live:live(u)})).sort((a,b)=>(b.live-a.live)||near(a.mo)-near(b.mo))}
/*IB_UI*/
const ib={grade:0,boards:null,img:{},want:new Set()};
// 形（中身の表の「形」）を色＋1字に。決まりはここだけ。
const IB_SH={'流れの帯':['帯','b'],'線でつなぐ':['線','t'],'くらべる列':['列','c'],'白い板':['板','g'],'絵':['絵','g'],'札で分ける':['札','c'],'なぞる':['な','c'],'物語ボード':['物','o'],'説明文ボード':['説','e'],'カンガエルー':['考','r']};
const ibShape=r=>IB_SH[r.shape]||['板','g'];
// 挿絵のない形は、形そのものを絵にする
function ibDraw(r){const k=ibShape(r)[0],f={'板':'<g stroke="#c9ccd2"><rect x="22" y="16" width="34" height="26" fill="#fff4b8"/><rect x="66" y="22" width="34" height="26" fill="#d9ecff"/><rect x="108" y="14" width="34" height="26" fill="#fff4b8"/><rect x="44" y="56" width="34" height="26" fill="#ffe0e6"/><rect x="90" y="54" width="34" height="26" fill="#fff4b8"/></g>',
 '説':'<g fill="#fff" stroke="#9cc4a4"><rect x="10" y="10" width="40" height="76" rx="5"/><rect x="58" y="10" width="44" height="76" rx="5"/><rect x="110" y="10" width="40" height="76" rx="5"/></g><g fill="#fff4b8" stroke="#d8c06a"><rect x="15" y="22" width="30" height="10"/><rect x="63" y="22" width="34" height="10"/><rect x="63" y="40" width="34" height="10"/><rect x="115" y="22" width="30" height="10"/></g>',
 '考':'<path d="M40 78a40 40 0 0 1 80 0" fill="none" stroke="#e3b2ba" stroke-width="12"/><path d="M40 78a40 40 0 0 1 22-36" fill="none" stroke="#a3122a" stroke-width="12"/><path d="M80 78 98 46" stroke="#1f2933" stroke-width="4" stroke-linecap="round"/>',
 '物':'<path d="M14 60C40 20 60 80 84 44S128 30 146 52" fill="none" stroke="#c46a1d" stroke-width="3"/><path d="M14 40C40 70 66 30 90 60S130 70 146 30" fill="none" stroke="#1a4fa0" stroke-width="3" stroke-dasharray="6 4"/>',
 '帯':'<g fill="#fff" stroke="#a9bddf"><rect x="8" y="14" width="26" height="68" rx="3"/><rect x="38" y="14" width="26" height="68" rx="3"/><rect x="68" y="14" width="26" height="68" rx="3"/><rect x="98" y="14" width="26" height="68" rx="3"/><rect x="128" y="14" width="24" height="68" rx="3"/></g><g fill="#fff4b8"><rect x="12" y="40" width="18" height="12"/><rect x="72" y="30" width="18" height="12"/><rect x="102" y="56" width="18" height="12"/></g>',
 '線':'<g fill="#fff" stroke="#9fd0c9"><rect x="8" y="14" width="26" height="68" rx="3"/><rect x="38" y="14" width="26" height="68" rx="3"/><rect x="68" y="14" width="26" height="68" rx="3"/><rect x="98" y="14" width="26" height="68" rx="3"/><rect x="128" y="14" width="24" height="68" rx="3"/></g><path d="M140 30 111 62 81 40 51 66 21 44" fill="none" stroke="#0f6b62" stroke-width="3"/>',
 '列':'<g fill="#fff" stroke="#c7b3e0"><rect x="10" y="12" width="42" height="72" rx="4"/><rect x="59" y="12" width="42" height="72" rx="4"/><rect x="108" y="12" width="42" height="72" rx="4"/></g><g fill="#fff4b8"><rect x="16" y="30" width="30" height="12"/><rect x="65" y="30" width="30" height="12"/><rect x="114" y="30" width="30" height="12"/><rect x="16" y="56" width="30" height="12"/></g>'};
 return `<svg viewBox="0 0 160 96" aria-hidden="true"><rect width="160" height="96" fill="#f4f5f7"/>${f[k]||f['板']}</svg>`}
const ibImgs=c=>(c.scenes||[]).map(s=>s.img).filter(Boolean);
// カードの絵は、教科書のその単元のはじめのページ（@中身のID・最初から GAS の中の束にある）。ページのない中身と、読めるまでは形の絵。
const ibThumb=r=>{const n='@'+r.id;return ib.img[n]?`<img src="${ib.img[n]}" alt="">`:`<span class="ib-wait" data-ib-img="${esc(n)}">${ibDraw(r)}</span>`};
const ibMo=c=>{try{const u=UNITS.find(x=>x.s==='国語'&&x.g===c.grade&&x.n===c.content.title);return u&&u.mo?u.mo[0]:0}catch(e){return 0}};
const ibTag=(mo,now)=>!mo?'':`<span class="ib-mo${(mo-now+12)%12<2?' ib-now':''}">${mo===now?'今月':mo===now%12+1?'来月':mo+'月'}</span>`;
const ibSh=r=>{const [t,k]=ibShape(r);return `<span class="ib-sh ib-k-${k}">${t}</span>`};
// 挿絵は小さくして手もとに持つ（何度も取らない）
async function ibSmall(url){try{const im=await createImageBitmap(await (await fetch(url)).blob()),k=Math.min(1,320/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.75)}catch(e){return url}}
async function ibLoadImgs(names){names=[...new Set(names)].filter(n=>!ib.img[n]&&!ib.want.has(n)).slice(0,12);if(!names.length)return;names.forEach(n=>ib.want.add(n));
 try{const r=await jmRPC('board',{act:'thumbs',names});for(const [n,u] of Object.entries(r.images||{}))ib.img[n]=await ibSmall(u)}catch(e){}
 document.querySelectorAll('[data-ib-img]').forEach(e=>{const u=ib.img[e.dataset.ibImg];if(u)e.outerHTML=`<img src="${u}" alt="">`})}
function ibSection(){if(S.view!=='apps'||S.appS!=='国語'||S.me?.role==='child')return;const box=document.querySelector('#body .jm-app-genres');if(!box)return;
 // 札の段（shelf.js）は .jm-app-genres の頭に入り、読みこみ後にも入れ直すので、板の段はその外のすぐ前に置く（いつも板が上）。
 const old=document.querySelector('#body .ib-sec');if(old)old.remove();box.insertAdjacentHTML('beforebegin','<section class="jm-app-genre ib-sec"><div class="ib-hd"><h2>みんなのボード</h2><div class="ib-gr" role="group" aria-label="学年"></div></div><div class="ib-grid"></div></section>');
 Promise.all([jmbContents(),ib.boards||jmRPC('board',{act:'list'}).then(r=>ib.boards=r.boards)]).then(([m])=>ibGrid(m)).catch(e=>{const g=document.querySelector('.ib-grid');if(g)g.textContent=e.message})}
function ibGrid(m){const sec=document.querySelector('.ib-sec');if(!sec)return;const now=new Date().getMonth()+1;ib.grade=ib.grade||S.me?.g||6;
 sec.querySelector('.ib-gr').innerHTML=[1,2,3,4,5,6].map(g=>`<button aria-pressed="${g===ib.grade}" data-ib-g="${g}" aria-label="${g}年">${g}</button>`).join('');
 const list=m.contents.map(c=>Object.assign(c,{mo:c.mo??ibMo(c)})),us=ibUnits(list,ib.grade,ib.boards||[],now);
 sec.querySelector('.ib-grid').innerHTML=us.map((u,i)=>`<button class="ib-card" data-ib-u="${i}">${u.live?`<span class="ib-live"><i></i>使用中</span>`:''}<span class="ib-th">${ibThumb(u.rows[0])}</span><b>${esc(u.title)}</b><span class="ib-meta">${[...new Set(u.rows.map(r=>ibSh(r)))].join('')}${u.rows.length>1?`<span>×${u.rows.length}</span>`:''}${ibTag(u.mo,now)}</span></button>`).join('')||'<p>—</p>';
 sec.querySelectorAll('[data-ib-g]').forEach(b=>b.onclick=()=>{ib.grade=+b.dataset.ibG;ibGrid(m)});sec.querySelectorAll('[data-ib-u]').forEach(b=>b.onclick=()=>ibDrawer(us[+b.dataset.ibU]));
 ibLoadImgs(us.map(u=>'@'+u.rows[0].id))}
// 引き出し：板（①②③）・題と問い（その場で直せる）・カンガエルーの見え方・組 →［始める］。使用中なら［開く］とリンクのコピー。
function ibDrawer(u){const st={ri:Math.max(0,u.rows.findIndex(r=>!ibLive(r,S.me?.k||1))),k:S.me?.k||1,mieru:'A'},g=u.grade||S.me?.g||6,n=jmCloud.boot?.classes||3;
 const draw=()=>{const r=u.rows[st.ri],c=r.content,lv=ibLive(r,st.k),im=ibImgs(c);
  $('#layer').innerHTML=`<div class="jm-veil ib-veil" data-close><aside class="ib-dr" role="dialog" aria-modal="true" aria-label="${esc(u.title)}"><div class="ib-dh"><label class="ib-t">${IC.pen}<input id="ib-title" value="${esc(c.title)}" maxlength="100" aria-label="題"></label><span class="ib-mo">${g}年</span><button class="jm-ic" type="button" data-close aria-label="閉じる">${IC.x}</button></div>
  <div class="ib-db"><div class="ib-big">${ibThumb(r)}</div>${im.length>1?`<div class="ib-strip">${im.map(x=>ib.img[x]?`<img src="${ib.img[x]}" alt="">`:`<span data-ib-img="${esc(x)}"></span>`).join('')}</div>`:''}
  ${u.rows.length>1?`<div class="ib-seg" role="group" aria-label="板">${u.rows.map((x,i)=>`<button type="button" aria-pressed="${i===st.ri}" data-ib-r="${i}">${esc(x.name.replace(u.title,'').trim()||x.name)}${ibSh(x)}</button>`).join('')}</div>`:''}
  <label class="ib-q">${IC.pen}<input id="ib-q" value="${esc(c.question||'')}" maxlength="200" aria-label="問い"></label><div id="jmb-imgs"></div>
  ${c.kind==='kg'?`<div class="ib-row" role="group" aria-label="友だちの考えが見えるとき">${[['A','いっせいに開く'],['B','出したら見られる'],['D','先生だけ']].map(([v,t])=>`<button type="button" aria-pressed="${st.mieru===v}" data-ib-m="${v}">${t}</button>`).join('')}</div>`:''}
  <div class="ib-row" role="group" aria-label="組">${Array.from({length:n},(_,i)=>i+1).map(k=>`<button type="button" aria-pressed="${k===st.k}" data-ib-k="${k}">${ibLive(r,k)?'<i class="ib-on" aria-label="使用中"></i>':''}${k}組</button>`).join('')}</div></div>
  <div class="ib-df">${lv?`<button type="button" class="ib-sub" data-ib-copy aria-label="リンクをコピー">${IC.copy}</button><button type="button" class="ib-go" data-ib-open>${IC.open}開く</button>`:`<button type="button" class="ib-go" data-ib-go>${IC.next}始める</button>`}</div></aside></div>`;
  const L=$('#layer');L.querySelectorAll('[data-ib-r]').forEach(b=>b.onclick=()=>{st.ri=+b.dataset.ibR;draw()});L.querySelectorAll('[data-ib-k]').forEach(b=>b.onclick=()=>{st.k=+b.dataset.ibK;draw()});L.querySelectorAll('[data-ib-m]').forEach(b=>b.onclick=()=>{st.mieru=b.dataset.ibM;draw()});

  // 先に板を開き、そのあとリンクをコピー（コピーできない所では、リンクの欄が板の上に出る）。別のタブは押したときに開いておく（あとからだと止められる）。
  else L.querySelector('[data-ib-go]').onclick=()=>{const w=key==='s'?window.open('','_blank'):null;jmRun(async()=>{const p=JSON.parse(JSON.stringify(c));p.title=$('#ib-title').value.trim()||c.title;p.question=$('#ib-q').value.trim();p.src=r.id;if(p.kind==='kg')p.mieru=st.mieru;
   let res;try{res=await jmRPC('board',{act:'start',id:'b-'+crypto.randomUUID(),grade:g,kumi:st.k,content:p})}catch(e){if(w)w.close();throw e}
   ib.boards=null;const u=url(res.board.id);if(key==='s'){if(w)w.location.href=u;closeSheet();appsView();await jmCopyLink(u);return}
   // 板の画面は #layer にかくので、コピーできないときのリンクの欄とは重ねない（欄に［開く］を置く）。
   let ok=false;try{await navigator.clipboard.writeText(u);ok=true}catch(e){}

   $('#layer').innerHTML=`<div class="jm-veil" data-close><div class="jm-sheet"><div class="jm-sh-head"><h2>配布リンク</h2><button class="jm-ic" data-close aria-label="閉じる">${IC.x}</button></div><div class="jm-sh-body"><input class="jm-sel" aria-label="コピーするリンク" readonly value="${esc(u)}"><button class="ib-go" data-ib-open2>${IC.open}開く</button></div></div></div>`;
   $('[data-ib-open2]').onclick=()=>ibOpen('b',res.board.id);appsView()})}};
 draw()}

// 教材研究所（11-04 先生「その画面は内蔵していてもいいのでは」）：物語研究の単元をえらぶ画面を授業メイトの中に。
// 単元の札を押すと、物語研究の GAS を ?tangen=単元 で別のタブに開く。物語研究の住所は学校の表「アプリの札」の monogatari の行。
// 単元を足したら MG_UNITS に1行（物語研究の monogatari/build.cjs の UNITS と同じ ID）、絵は tools/build-mg-thumb.py の MG に1行。
const MG_UNITS=[
 {id:'sannen',g:3,n:'三年とうげ',by:'李 錦玉'},
 {id:'mochi',g:3,n:'モチモチの木',by:'斎藤 隆介'},
 {id:'yujo',g:4,n:'友情のかべ新聞',by:'はやみね かおる'},
 {id:'swan',g:4,n:'スワンレイクのほとりで',by:'小手鞠 るい'},
 {id:'daizo',g:5,n:'大造じいさんとガン',by:'椋 鳩十'},
 {id:'yanase',g:5,n:'やなせたかし',by:'梯 久美子'},
 {id:'umi',g:6,n:'海の命',by:'立松 和平'},
 {id:'book',g:6,n:'ぼくのブック・ウーマン',by:'ヘザー・ヘンソン'}
];
function mgUrl(id){const base=jmFudaLinks('monogatari').open;if(!base)return '';try{const u=new URL(base);u.searchParams.set('tangen',id);return u.href}catch(e){return ''}}
function mgView(){
 $('#head').innerHTML='<h1>教材研究所</h1><span class="jm-sp"></span>';
 if(!jmFuda.cards)jmFudaLoad();
 const card=u=>{const href=mgUrl(u.id),th=typeof MG_THUMB!=='undefined'&&MG_THUMB[u.id]?`<img class="mg-th" src="${MG_THUMB[u.id]}" alt="">`:'<span class="mg-th"></span>';
  const inner=`${th}<b>${esc(u.n)}</b><span>${esc(u.by)}</span>`;
  return href?`<a class="mg-card" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
   :`<div class="mg-card mg-off" aria-disabled="true">${inner}<i>まだ開けません</i></div>`};
 $('#body').innerHTML=`<div class="mg-grid">${[3,4,5,6].map(g=>`<section class="mg-col" aria-label="${g}年"><h2>${g}年</h2>${MG_UNITS.filter(u=>u.g===g).map(card).join('')}</section>`).join('')}</div>`;
}
// 指導要領（11-04 先生「一気に飛ぶのではなくて、各教科の選択画面に」）：教科の札をえらぶ。
// 開く先は1か所＝YO_KYOKA。a は授業メイトの ?a=、url は外のページ、どちらも無い教科は「準備中」。教科ができたらここに a か url を足す。
const YO_KYOKA=[
 {n:'国語',a:'yoryo'},{n:'社会'},{n:'算数'},{n:'理科'},{n:'生活'},{n:'音楽'},{n:'図画工作'},
 {n:'家庭'},{n:'体育'},{n:'外国語'},{n:'道徳'},{n:'総合'},{n:'特活',url:'https:/\/tokkatsu-web.github.io/digital-yoryo/tokkatsu/'}
];
function yoView(){
 $('#head').innerHTML='<h1>指導要領</h1><span class="jm-sp"></span>';
 const card=k=>{const href=k.a?heyaUrl(k.a):k.url||'',inner=`<span class="mg-ki" aria-hidden="true">${jmSubjectIcon(k.n)}</span><b>${esc(k.n)}</b>`;
  return href?`<a class="mg-card mg-kyoka" href="${esc(href)}" target="_blank" rel="noopener noreferrer" style="${jmSubjectStyle(k.n)}">${inner}</a>`
   :`<div class="mg-card mg-kyoka mg-off" aria-disabled="true" style="${jmSubjectStyle(k.n)}">${inner}<i>準備中</i></div>`};
 $('#body').innerHTML=`<div class="mg-kgrid">${YO_KYOKA.map(card).join('')}</div>`;
}
{const baseRender=render;
 render=function(){if(S.view==='mg')mgView();else if(S.view==='yo')yoView();else return baseRender.apply(this,arguments)
  // 帯の光る所と見出しのアイコンは heya.js の render（このあと）がそろえる
 }}
// 札の表が届いたら、リンクを入れて描き直す
{const baseRedraw=jmFudaRedraw;jmFudaRedraw=function(){baseRedraw();try{if(S.view==='mg')mgView()}catch(e){}}}
try{document.head.insertAdjacentHTML('beforeend',`<style>
.mg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-top:4px}
.mg-col{display:flex;flex-direction:column;gap:10px;min-width:0}

.mg-card:hover{border-color:#B9C6D6}
.mg-th{display:block;width:100%;aspect-ratio:1/.62;object-fit:cover;border-radius:10px;background:var(--side);margin-bottom:6px}

.mg-kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding-top:4px}
.mg-kyoka{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;min-height:64px;flex-wrap:wrap}
.mg-ki{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--jm-soft);color:var(--jm-ink);flex:none}.mg-ki svg{width:22px;height:22px}
.mg-kyoka b{padding:0;color:var(--jm-ink)}.mg-kyoka.mg-off b{color:var(--sub)}.mg-kyoka.mg-off i{flex-basis:100%;padding:0}
@media (max-width:760px){.mg-grid{grid-template-columns:1fr 1fr}.mg-kgrid{grid-template-columns:1fr 1fr}}
</style>`)}catch(e){}

</script>
<script>
// 5つの部屋の並び（11-04 先生 OK・見本は mock/hone/5つの部屋_見本_もと.html）。
// 部屋の名前・アイコン・色・出すかどうかは HEYA の1か所。go は授業メイトの中の画面、a は GAS の ?a= で別のタブに開く画面。
// 中身が本物でそろっていない部屋は on:false で出さない。そろったら true にするだけでよい。
// 教材研究所（go:'mg'）と指導要領（go:'yo'）のえらぶ画面は ui/mg.js。
// ヨンスタへ（11-04 ヨンスタ本番 版52 のあと on）：［記録］でヨンスタを ?from=jm… で開く。授業メイトからは送らない。ヨンスタの住所は学校の表「アプリの札」の yonsuta の行。
// 結果は部屋ではなく、どの部屋からでも押せる1か所（帯のいちばん下）。
const HEYA=[
 {id:'home',go:'home',n:'きょうの単元',ic:'home',sub:'社会',on:true},
 {id:'apps',go:'apps',n:'アプリ',ic:'apps',sub:'理科',on:true},
 {id:'monogatari',go:'mg',n:'教材研究所',ic:'book',sub:'国語',on:true},
 {id:'mine',go:'mine',n:'問題メーカー',ic:'spark',sub:'算数',on:true,also:['dist','edit']},
 {id:'yoryo',go:'yo',n:'指導要領',ic:'search',sub:'道徳',on:true},
 {id:'yonsuta',go:'ys',n:'ヨンスタへ',ic:'send',sub:'体育',on:true},
 {id:'result',go:'result',n:'結果',ic:'result',sub:'先生',on:true,foot:true}
];
// 問題メーカーの中の画面（見出しの切りかえ）
const HEYA_MK=[['mine','わたしの教材'],['dist','配る']];
function heyaUrl(a){try{const u=new URL(jmCloud.boot.url);u.searchParams.set('a',a);return u.href}catch(e){return ''}}
// 別のタブで開く部屋（?a=）。開けないときは止めずに知らせる
function heyaOpen(r){const u=heyaUrl(r.a);if(!u){toast('まだ開けません。少し待ってからもう一度');return}window.open(u,'_blank','noopener')}
function heyaNav(){
 const on=HEYA.filter(r=>r.on),rooms=on.filter(r=>!r.foot),foot=on.filter(r=>r.foot);
 const btn=(r,cls)=>`<button type="button" class="${cls}" data-heya="${r.id}" aria-label="${esc(r.n)}"${r.go?` data-go="${r.go}"`:''} style="${jmSubjectStyle(r.sub)}"><span class="jm-nav-icon" aria-hidden="true">${jmIcon(r.ic)}</span>${esc(r.n)}</button>`;
 const side=document.querySelector('.jm-side'),tabs=document.querySelector('.jm-tabs');
 if(side){side.querySelectorAll('.jm-nav').forEach(x=>x.remove());const sp=side.querySelector('.jm-sp');
  sp.insertAdjacentHTML('beforebegin',rooms.map(r=>btn(r,'jm-nav')).join(''));sp.insertAdjacentHTML('afterend',foot.map(r=>btn(r,'jm-nav hy-foot')).join(''))}
 if(tabs)tabs.innerHTML=on.map(r=>btn(r,'')).join('');
 document.querySelectorAll('[data-heya]').forEach(b=>{const r=HEYA.find(x=>x.id===b.dataset.heya);if(!r.a)return;
  b.onclick=e=>{e.stopPropagation();heyaOpen(r)}});
}
// 問題メーカーの画面の見出しに わたしの教材・配る の切りかえ。見出しを描き直す画面があるので、消えたら足し直す。
function heyaHead(){
 const head=document.querySelector('#head'),h1=head&&head.querySelector('h1');if(!h1||head.querySelector('.hy-mk'))return;
 if(!HEYA_MK.some(([v])=>v===S.view))return;
 h1.insertAdjacentHTML('afterend',`<div class="hy-mk" role="group" aria-label="問題メーカーの中">${HEYA_MK.map(([v,n])=>`<button type="button" data-go="${v}" aria-pressed="${S.view===v}">${n}</button>`).join('')}</div>`);
}
// ── きょうの単元（ホーム）：見本 mock/hone/5つの部屋_見本_もと.html の形。単元の札に行き先、下に部屋の札。説明の文は出さない ──
// 単元は UNITS（国語＝光村・算数＝東書）、行き先のアプリは学校の表「単元とアプリ」（jmFudaForUnit）から。
const HEYA_SUBJ=['国語','算数'],HEYA_BOOK={'国語':'光村','算数':'東書'};
function heyaHome(){
 if(!S.me)regSheet();
 const room=id=>HEYA.find(r=>r.id===id),rs=id=>jmSubjectStyle(room(id).sub),ric=id=>`<span class="hy-ri" aria-hidden="true">${jmIcon(room(id).ic)}</span>`;
 $('#head').innerHTML=`<h1>きょうの単元</h1><select class="hy-pill" id="hy-grade" aria-label="学年">${[1,2,3,4,5,6].map(g=>`<option value="${g}"${g===S.grade?' selected':''}>${g}年</option>`).join('')}</select>
  <div class="hy-mos" role="group" aria-label="月">${[11,12,1,2,3].map(mo=>`<button type="button" data-hymo="${mo}" aria-pressed="${mo===S.month}">${mo}月</button>`).join('')}</div>`;
 const units=[];UNITS.forEach((r,i)=>{if(r.g===S.grade&&HEYA_SUBJ.includes(r.s)&&r.mo.includes(S.month))units.push([r,i])});
 const card=([r,i])=>{const apps=(jmFuda.cards?jmFudaForUnit(r):[]).map(x=>({x,url:x.card.link?jmFudaUrl(x.card.link,x.tangen):null})).filter(a=>a.url);
  const dest=apps.map(a=>`<a class="hy-dest" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" style="${rs('apps')}">${ric('apps')}${esc(a.x.card.name)}</a>`)
  ;
  // ［問題を作る］は操作なのでアイコンだけ（名前は aria-label）。指導要領は単元との対応表ができたら行き先に足す
  return `<div class="hy-unit" style="${jmSubjectStyle(r.s)}"><div class="hy-utop"><span class="hy-tag">${jmSubjectIcon(r.s)}${r.s}</span><span class="hy-uact"><button type="button" class="hy-make" data-rec="${i}" aria-label="「${esc(r.n)}」の授業をヨンスタで記録" style="${rs('yonsuta')}">${jmIcon(room('yonsuta').ic)}</button><button type="button" class="hy-make" data-make="${i}" aria-label="「${esc(r.n)}」で問題を作る" style="${rs('mine')}">${jmIcon(room('mine').ic)}</button></span></div><h2><button type="button" data-un="${i}">${esc(r.n)}</button></h2>
   <span class="hy-meta">${HEYA_BOOK[r.s]} ${r.g}年${r.all?'・'+r.all+'時間':''}</span>${dest.length?`<div class="hy-dests">${dest.join('')}</div>`:''}</div>`};
 const st={apps:jmFuda.cards?jmFuda.cards.length+'本':'',mine:'作る・配る',yoryo:'国語',yonsuta:'記録した授業'};
 // ［記録］で渡す「使うもの」は、その単元の札の行き先（アプリの名前）
 heyaHome.uses={};units.forEach(([r,i])=>{heyaHome.uses[i]=(jmFuda.cards?jmFudaForUnit(r):[]).filter(x=>x.card.link).map(x=>x.card.name).join('・')});
 $('#body').innerHTML=`<div class="hy-units">${units.map(card).join('')||`<p class="hy-none">${S.grade}年 ${S.month}月の単元はまだありません</p>`}</div>
  <div class="hy-rooms">${['apps','mine','yoryo','yonsuta'].filter(id=>room(id).on).map(id=>`<button type="button" class="hy-room" data-hyroom="${id}" style="${rs(id)}">${ric(id)}<span class="hy-rt"><b>${room(id).n}</b><span>${st[id]}</span></span></button>`).join('')}</div>`;
 $('#hy-grade').onchange=e=>{S.grade=Number(e.target.value);heyaHome()};
 document.querySelectorAll('[data-hymo]').forEach(b=>b.onclick=()=>{S.month=+b.dataset.hymo;heyaHome()});
 document.querySelectorAll('.hy-unit [data-un]').forEach(b=>b.onclick=()=>unitSheet2(+b.dataset.un));
 document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rec,r=UNITS[i];heyaRec({s:r.s,u:r.n,tsu:heyaHome.uses[i]||''})});
 // 問題を作る：単元の画面の［この単元で作る］と同じ流れ
 document.querySelectorAll('[data-make]').forEach(b=>b.onclick=()=>{const r=UNITS[+b.dataset.make];if(!jmDraftBegin(jmUnitMaterial(r,S.use||'lesson')))return;S.open=0;S.view='edit';render();toast('「'+r.n+'」で作ります')});
 document.querySelectorAll('[data-hya],[data-hyroom]').forEach(b=>b.onclick=()=>{const id=b.dataset.hya||b.dataset.hyroom,r=room(id);
  if(r.a){heyaOpen(r);return}S.view=r.go;render()});
}
home=heyaHome;
// 札の表が届いたら、ホームの行き先も描き直す
{const baseRedraw=jmFudaRedraw;jmFudaRedraw=function(){baseRedraw();try{if(S.view==='home'&&!document.querySelector('#layer .jm-sheet'))heyaHome()}catch(e){}}}
// 見出しの左に、その部屋の色つきアイコン
function heyaHeadIcon(){const h1=document.querySelector('#head h1');if(!h1||h1.querySelector('.hy-ri'))return;
 const r=HEYA.find(x=>x.go&&(x.go===S.view||(x.also||[]).includes(S.view)));if(!r)return;
 h1.style.cssText=jmSubjectStyle(r.sub);h1.classList.add('hy-h1');h1.insertAdjacentHTML('afterbegin',`<span class="hy-ri hy-ri-fill" aria-hidden="true">${jmIcon(r.ic)}</span>`)}
// ── ヨンスタへ：［記録］の窓と、開いた授業の一覧。URL と「授業の前・あと」の決まりはここ1か所（ヨンスタ側の決まりと同じ：先の日＝前） ──
function heyaYsUrl(o){const base=jmFudaLinks('yonsuta').open;if(!base)return '';const u=new URL(base);
 [['from','jm'],['d',o.d],['j',o.j],['k',o.k],['s',o.s],['u',o.u],['ne',o.ne],['tsu',o.tsu]].forEach(([k,v])=>{if(v!=null&&v!=='')u.searchParams.set(k,String(v))});return u.href}
function heyaToday(){const t=new Date();return t.getFullYear()+String(t.getMonth()+1).padStart(2,'0')+String(t.getDate()).padStart(2,'0')}
const heyaYsMode=d=>d>heyaToday()?'授業の前':'授業のあと';
const heyaMd=d=>Number(d.slice(4,6))+'月'+Number(d.slice(6,8))+'日',heyaKumi=k=>/^[0-9]-[0-9]$/.test(k)?k.replace('-','年')+'組':k;
// 開いたら一覧に残す（待たない）。残せなくてもヨンスタは開く
function heyaYsLog(o){jmRPC('ysLog',{act:'add',...o}).catch(()=>toast('一覧に残せませんでした'))}
function heyaRec(o){o=o||{};const me=S.me||{g:S.grade,k:1},d=o.d||heyaToday(),iso=d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
 $('#layer').innerHTML=`<div class="jm-veil" data-close><form class="jm-sheet hy-rec" role="dialog" aria-label="授業を記録" style="${jmSubjectStyle('体育')}"><div class="jm-sh-head"><h2>授業を記録</h2><button type="button" class="jm-ic" data-close aria-label="閉じる">${IC.x}</button></div>
  <div class="jm-sh-body hy-recf"><label>日<input type="date" id="hy-rd" value="${iso}"></label><label>時間<select id="hy-rj">${[1,2,3,4,5,6].map(j=>`<option value="${j}"${+o.j===j?' selected':''}>${j}時間め</option>`).join('')}</select></label>
  <label>学級<input id="hy-rk" value="${esc(o.k||me.g+'-'+me.k)}"></label><label>教科<input id="hy-rs" value="${esc(o.s||'')}"></label>
  <label class="hy-wide">単元<input id="hy-ru" value="${esc(o.u||'')}"></label><label class="hy-wide">ねらい<textarea id="hy-rne" rows="2">${esc(o.ne||'')}</textarea></label>
  <label class="hy-wide">使うもの<input id="hy-rtsu" value="${esc(o.tsu||'')}"></label>
  <div class="hy-wide hy-recgo"><span class="hy-mode"></span><a class="jm-btn jm-btn-p hy-go" target="_blank" rel="noopener noreferrer">${IC.open}ヨンスタで開く</a></div></div></form></div>`;
 const v=id=>$('#'+id).value.trim(),go=$('.hy-rec .hy-go'),read=()=>({d:v('hy-rd').replace(/-/g,''),j:+v('hy-rj'),k:v('hy-rk'),s:v('hy-rs'),u:v('hy-ru'),ne:v('hy-rne'),tsu:v('hy-rtsu')});
 const upd=()=>{const x=read(),ok=/^[0-9]{8}$/.test(x.d),url=ok?heyaYsUrl(x):'';$('.hy-rec .hy-mode').textContent=!url&&ok?'ヨンスタのリンクがまだありません':ok?heyaYsMode(x.d):'日を入れてください';if(url)go.href=url;else go.removeAttribute('href');go.setAttribute('aria-disabled',String(!url))};
 document.querySelectorAll('.hy-rec input,.hy-rec select,.hy-rec textarea').forEach(e=>e.oninput=e.onchange=upd);upd();
