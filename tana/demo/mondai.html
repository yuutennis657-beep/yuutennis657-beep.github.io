  }

<script>
/* 授業メイト：入力の確認。学校・個人の情報は設定に置く。 */
var JM = {classes:3, maxQuestions:30, maxText:2000};
function fail_(text){throw new Error(text);}
function text_(v,max,empty){if(typeof v!=='string'||v.length>max||(!empty&&!v.trim()))fail_('入力を確かめてください。');return v.trim();}
function number_(v,min,max){if(!Number.isInteger(v)||v<min||v>max)fail_('数を確かめてください。');return v;}
function id_(v){if(typeof v!=='string'||!/^[-a-zA-Z0-9]{1,80}$/.test(v))fail_('リンクを確かめてください。');return v;}
function normalize_(s){return String(s).normalize('NFKC').trim();}
function material_(v){
 if(!v||typeof v!=='object')fail_('教材を確かめてください。');
 var m={title:text_(v.title,100),grade:number_(v.grade,1,6),subject:text_(v.subject,20),questions:[]};
 if(['国語','算数','社会','理科','体育','特活・道徳','その他'].indexOf(m.subject)<0)fail_('教科を確かめてください。');
 if(!Array.isArray(v.questions)||!v.questions.length||v.questions.length>JM.maxQuestions)fail_('問題は1〜30問です。');
 m.questions=v.questions.map(function(q){
  if(!q||['choice','written'].indexOf(q.type)<0)fail_('今回は「えらぶ」「書く」に対応しています。');
  var x={type:q.type,prompt:text_(q.prompt,JM.maxText)};
  if(q.type==='choice'){
   if(!Array.isArray(q.choices)||q.choices.length<2||q.choices.length>4)fail_('選択肢は2〜4個です。');
   x.choices=q.choices.map(function(c){return text_(c,200);});
   if(new Set(x.choices.map(normalize_)).size!==x.choices.length)fail_('選択肢を別の内容にしてください。');
   x.correct=number_(q.correct,0,x.choices.length-1);
  }return x;
 });return m;
}
function profile_(v){if(!v)fail_('学年・組・番号・名前を入れてください。');return {grade:number_(v.grade,1,6),kumi:number_(v.kumi,1,JM.classes),ban:number_(v.ban,1,99),sei:text_(v.sei,30),mei:text_(v.mei,30)};}
function publicMaterial_(m){return {title:m.title,grade:m.grade,subject:m.subject,questions:m.questions.map(function(q){var r={type:q.type,prompt:q.prompt};if(q.choices)r.choices=q.choices.slice();return r;})};}
function markAnswers_(m,a){
 if(!Array.isArray(a)||a.length!==m.questions.length)fail_('すべての問題に答えてください。');
 return m.questions.map(function(q,i){var t=text_(a[i],JM.maxText);if(q.type==='choice'&&q.choices.indexOf(t)<0)fail_('選択肢から選んでください。');return {text:t,correct:q.type==='choice'?t===q.choices[q.correct]:null};});
}

// 見本の下書き。未知の項目は落とし、描画に使う値をサーバーでも確かめる。
function mockDraft_(v){
 if(!v||typeof v!=='object')fail_('教材を確かめてください。');
 var m={title:text_(v.title,200,true),g:number_(v.g,1,6),s:text_(v.s,20),qs:[]};
 if(['国語','算数','社会','理科','体育','特活','道徳','学活','先生','特活・道徳','その他','いろいろ'].indexOf(m.s)<0)fail_('教科を確かめてください。');
 ['unitTitle','learningGoal','creationMode','use'].forEach(function(k){if(v[k]!==undefined)m[k]=text_(v[k],2000,true);});
 if(!Array.isArray(v.qs)||v.qs.length>200)fail_('問題は200問までです。');
 m.qs=v.qs.map(function(q){if(!q||['c','w','ox','n','m','f','card','map','ten','frac','clock','nl','k'].indexOf(q.t)<0)fail_('問題の形を確かめてください。');
 var x={t:q.t,p:text_(q.p,9999,true)};
 if(q.a!==undefined){if(typeof q.a==='number'){if(!isFinite(q.a))fail_('答えを確かめてください。');x.a=q.a;}else x.a=text_(q.a,9999,true);}
 if(q.u!==undefined)x.u=text_(q.u,100,true);
 if(q.t==='c'){if(!Array.isArray(q.w)||q.w.length>10)fail_('選択肢を確かめてください。');x.w=q.w.map(function(s){return text_(s,2000,true);});}
 if(q.t==='m'){if(!Array.isArray(q.pairs)||q.pairs.length>30)fail_('組み合わせを確かめてください。');x.pairs=q.pairs.map(function(p){if(!Array.isArray(p)||p.length!==2)fail_('組み合わせを確かめてください。');return p.map(function(s){return text_(s,2000,true);});});}
 if(q.t==='ox')x.a=number_(q.a,0,1);
 if(q.t==='ten'){x.x=number_(q.x,0,20);x.y=number_(q.y,0,20);if(q.op!==undefined){if(q.op!=='-'&&q.op!=='+')fail_('式を確かめてください。');x.op=q.op;}if(!/^[0-9]{1,3}$/.test(String(q.a)))fail_('答えを確かめてください。');}
 if(q.t==='frac'){x.d=number_(q.d,2,20);if(!/^[0-9]{1,3}$/.test(String(q.a)))fail_('答えを確かめてください。');}

 if(q.t==='nl'){['from','to','unit','lab'].forEach(function(k){if(typeof q[k]!=='number'||!isFinite(q[k])||Math.abs(q[k])>1e12)fail_('数直線を確かめてください。');x[k]=q[k];});if(x.to<=x.from||x.unit<=0||(x.to-x.from)/x.unit>200)fail_('数直線を確かめてください。');}
 if(q.t==='map'){if(MOCK_PREFS_.indexOf(q.a)<0)fail_('県を確かめてください。');x.mode=q.mode==='name'?'name':'where';}
 return x;});return m;
}
var MOCK_PREFS_='北海道 青森 岩手 宮城 秋田 山形 福島 茨城 栃木 群馬 埼玉 千葉 東京 神奈川 新潟 富山 石川 福井 山梨 長野 岐阜 静岡 愛知 三重 滋賀 京都 大阪 兵庫 奈良 和歌山 鳥取 島根 岡山 広島 山口 徳島 香川 愛媛 高知 福岡 佐賀 長崎 熊本 大分 宮崎 鹿児島 沖縄'.split(' ');
function deliverable_(m){if(!m.mock)return m;var d=m.mock;return material_({title:d.title,grade:d.g,subject:['特活','道徳','学活'].indexOf(d.s)>=0?'特活・道徳':d.s,questions:d.qs.map(function(q){if(q.t==='c')return {type:'choice',prompt:q.p,choices:[q.a].concat(q.w),correct:0};if(q.t==='w'||q.t==='k')return {type:'written',prompt:q.p};fail_('この形式は学校への配布にまだ対応していません。下書きは保存済みです。ワークシートで使えます。');})});}

/* 書き込みは writeRows_ だけ。ロック中に版の確認と保存を行う。 */
function config_(){var p=PropertiesService.getScriptProperties().getProperties();['JM_DB_ID','JM_ROSTER_ID','JM_ALLOWED_DOMAIN'].forEach(function(k){if(!p[k])fail_('学校の接続設定がまだありません。');});return p;}
function db_(){return SpreadsheetApp.openById(config_().JM_DB_ID);}
function sheet_(name){var s=db_().getSheetByName(name);if(!s)fail_('初期設定を実行してください。');return s;}
function writeRows_(sheet,row,values){var safe=values.map(function(r){return r.map(function(v){return typeof v==='string'&&/^[=+@-]/.test(v)?"'"+v:v;});});sheet.getRange(row,1,safe.length,safe[0].length).setValues(safe);SpreadsheetApp.flush();}
function lock_(fn){var l=LockService.getScriptLock();if(!l.tryLock(10000))fail_('混み合っています。少し待ってもう一度お試しください。');try{return fn();}finally{l.releaseLock();}}
function read_(name,key,width){var s=sheet_(name);if(s.getLastRow()<2)return null;var hit=s.getRange(2,1,s.getLastRow()-1,1).createTextFinder(key).matchEntireCell(true).useRegularExpression(false).findNext();return hit?{row:hit.getRow(),v:s.getRange(hit.getRow(),1,1,width).getValues()[0]}:null;}
function list_(name,width){var s=sheet_(name);return s.getLastRow()<2?[]:s.getRange(2,1,s.getLastRow()-1,width).getValues();}
function save_(name,key,values){var s=sheet_(name),old=read_(name,key,1);writeRows_(s,old?old.row:s.getLastRow()+1,[values]);}
function stamp_(){return new Date().toISOString();}
function hash_(s){return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,s).map(function(b){return ('0'+((b+256)%256).toString(16)).slice(-2);}).join('');}
function newId_(){return Utilities.getUuid();}
function ensure_(name,head){var s=db_().getSheetByName(name);if(!s){s=db_().insertSheet(name);writeRows_(s,1,[head]);s.setFrozenRows(1);}return s;}
/* エディタからだけ実行。末尾 _ の関数はブラウザから呼べない。 */
function setup_(){config_();return lock_(function(){ensure_('教材',['ID','持ち主','版','名前','学年','教科','更新','本文']);ensure_('配布',['ID','持ち主','版','名前','学年','組','受付','更新','本文']);ensure_('プロフィール',['ID','本文']);return '初期設定が終わりました。';});}
function rosterColumns_(head){var h=head.map(function(x){return String(x).normalize('NFKC').replace(/\s+/g,'');});var f=function(re){return h.findIndex(function(x){return re.test(x);});};var s=f(/^姓\(ふりがな\)|^せい$/),m=f(/^名\(ふりがな\)|^めい$/);return {mail:f(/^メール|^email/i),grade:f(/^学年/),kumi:f(/^組$|^クラス/),ban:f(/^番$|^出席番号/),sei:s>=0?s:f(/^姓/),mei:m>=0?m:f(/^名/),role:f(/^役/)};}
function me_(){
 var cfg=config_(),mail=String(Session.getActiveUser().getEmail()||'').trim().toLowerCase();
 if(!mail||mail.split('@').length!==2||mail.split('@')[1]!==cfg.JM_ALLOWED_DOMAIN.toLowerCase())fail_('学校のアカウントで開いてください。');
 var cache=CacheService.getScriptCache(),key='jm-person-'+hash_(cfg.JM_ROSTER_ID+'|'+mail),raw=cache.get(key),p;
 if(raw)p=JSON.parse(raw);else{
  var sh=SpreadsheetApp.openById(cfg.JM_ROSTER_ID).getSheetByName(cfg.JM_ROSTER_TAB||'名簿');if(!sh||!sh.getLastRow())fail_('名簿が見つかりません。');
  var cols=sh.getLastColumn(),c=rosterColumns_(sh.getRange(1,1,1,cols).getValues()[0]);
  if(c.mail<0)fail_('名簿のメール列を確認してください。');
  var hit=sh.getLastRow()>1?sh.getRange(2,c.mail+1,sh.getLastRow()-1,1).createTextFinder(mail).matchCase(false).matchEntireCell(true).useRegularExpression(false).findAll():[];
  /* 同じ先生が複数行にいる名簿にも対応。役割が違う場合や児童の重複は止める。 */
  if(hit.length>1&&!hit.every(function(h){return c.role>=0&&String(sh.getRange(h.getRow(),c.role+1,1,1).getValues()[0][0]||'').normalize('NFKC').trim()==='先生';}))fail_('名簿の同じアカウントが重なっています。');
  p={role:'child',registered:false};
  if(hit.length){var row=sh.getRange(hit[0].getRow(),1,1,cols).getValues()[0],get=function(k){return c[k]>=0?String(row[c[k]]||'').normalize('NFKC').trim():'';},num=function(k){return Number(get(k).replace(/[^0-9]/g,''));};p={role:get('role')==='先生'?'teacher':'child',registered:true,grade:num('grade'),kumi:num('kumi'),ban:num('ban'),sei:get('sei'),mei:get('mei')};}
  else if(cfg.JM_ALLOW_TEACHER_PREFIX==='true'&&/^t-/.test(mail))p.role='teacher';
  cache.put(key,JSON.stringify(p),300);
 }
 p.mail=mail;return p;
}
function teacher_(){var p=me_();if(p.role!=='teacher')fail_('先生だけが使えます。');return p;}
/* 入口の門（決まりはここ1か所）。いまは名簿の「先生」と、このアプリの持ち主だけが開ける。子どもにも開くときは、スクリプトのプロパティ JM_OPEN_TO を all にする。 */
var JM_GATE_NG='授業メイトは、いまは先生だけが開けます。';
function gate_(){var p=me_();if(config_().JM_OPEN_TO==='all'||p.role==='teacher')return p;
 var own='';try{own=String(Session.getEffectiveUser().getEmail()||'').toLowerCase();}catch(e){}
 if(own&&own===p.mail)return p;fail_(JM_GATE_NG);}
function gatePage_(text){return HtmlService.createHtmlOutput('<div style="background:#fff;color:#1d1d1f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:\'BIZ UDPGothic\',\'Hiragino Sans\',sans-serif"><p style="font-size:18px;line-height:1.8;margin:0;text-align:center">'+String(text).replace(/[<>&]/g,'')+'</p></div>').setTitle('授業メイト').addMetaTag('viewport','width=device-width,initial-scale=1');}
function owner_(name,id,mail,width){var r=read_(name,id_(id),width);if(!r||r.v[1]!==mail)fail_('この教材・結果は開けません。');return r;}
function safeMe_(p){return {role:p.role,registered:p.registered,grade:p.grade||0,kumi:p.kumi||0,ban:p.ban||0,sei:p.sei||'',mei:p.mei||''};}

/* 付箋の型（みんなで集める）。お手本は絵巻ふせん。書き込みは Store.gs の writeRows_ だけ。
   付箋板：ID・持ち主・版・名前・学年・組・受付・更新・本文（中身と今の時間）
   付箋_板ID：板ごとに1枚の表（1年分たまっても、開く板の分だけ読む）。ID・板・時間・x・y・字・書いた人（メールのハッシュ）・番号・名前・共有・かくす・はがした・更新・操作 */

var FUDA_ID=/^[a-z0-9-]{1,30}$/,FUDA_LINK=/^https:\x2f\x2f[^\s]+$/;
function fudaOn_(v){return v===true||/^(TRUE|○|◯)$/i.test(String(v).trim());}

function fudaRows_(ss,name,width){var s=ss.getSheetByName(name);return !s||s.getLastRow()<2?[]:s.getRange(2,1,s.getLastRow()-1,width).getValues();}

function fuda_(){teacher_();var ss=db_();
 if(!ss.getSheetByName('アプリの札')){fudaSeed_('アプリの札',FUDA_HEAD,FUDA_SEED);}
 if(!ss.getSheetByName('単元とアプリ')){fudaSeed_('単元とアプリ',FUDA_UNIT_HEAD,FUDA_UNIT_SEED);}
 var out={cards:[],units:[],problems:[],wants:FUDA_WANT.map(function(w){return {id:w[0],name:w[1],sub:w[2]};})},known={},on={},t=function(v){return String(v==null?'':v).trim();};
 var wantOf={};FUDA_WANT.forEach(function(w){wantOf[w[1]]=w[0];});
 var bad=function(tab,i,msg){out.problems.push({tab:tab,row:i+2,msg:msg});};
 fudaRows_(ss,'アプリの札',FUDA_HEAD.length).forEach(function(r,i){var id=t(r[0]);if(!id)return;
  if(!FUDA_ID.test(id))return bad('アプリの札',i,'札の印は、半角の英小文字・数字・「-」で書いてください。');
  if(known[id])return bad('アプリの札',i,'札の印が、ほかの行と同じです。');known[id]=true;
  if(!fudaOn_(r[1]))return;
  var name=t(r[2]),place=t(r[3]),link=t(r[5]),result=t(r[7]);
  if(!name||name.length>30)return bad('アプリの札',i,'名前を30字までで書いてください。');
  if(place!=='札'&&place!=='配る')return bad('アプリの札',i,'置き場所は「札」か「配る」と書いてください。');
  if(link&&!FUDA_LINK.test(link))return bad('アプリの札',i,'リンクは https:// から始まる形で書いてください。');
  if(result&&!FUDA_LINK.test(result))return bad('アプリの札',i,'結果のリンクは https:// から始まる形で書いてください。');
  // したいこと・記録の字がちがっても、札は出す（教科の棚・単元の札は今までどおり）。その行だけ知らせる。
  var want=t(r[8]),kiroku=t(r[9]);

  if(kiroku&&FUDA_KIROKU.indexOf(kiroku)<0){bad('アプリの札',i,'記録は「'+FUDA_KIROKU.join('」「')+'」のどれか、または空にしてください。');kiroku='';}

  if(!(g>=1&&g<=6&&g%1===0))return bad('単元とアプリ',i,'学年は1〜6の数字で書いてください。');

function doGet(e){try{gate_();}catch(err){return gatePage_(err&&err.message||JM_GATE_NG);}var p=e&&e.parameter||{};var app=Object.prototype.hasOwnProperty.call(JM_APPS,p.a)&&JM_APPS[p.a];if(app){var out;if(app.tangen){var a=HtmlService.createTemplateFromFile(app.file);var tg=String(p.tangen||'');a.tangen=JSON.stringify(/^[A-Za-z0-9_-]{1,40}$/.test(tg)?tg:'');out=a.evaluate();}else out=HtmlService.createHtmlOutputFromFile(app.file);return out.setTitle(app.title).addMetaTag('viewport','width=device-width,initial-scale=1');}var t=HtmlService.createTemplateFromFile(p.s?'Story':'Index');t.route=JSON.stringify({assignment:p.k||'',result:p.r||'',board:p.b||'',story:p.s||''}).replace(/</g,'\\u003c');return t.evaluate().setTitle('授業メイト').addMetaTag('viewport','width=device-width,initial-scale=1');}
function jmApi(op,arg){arg=arg||{};gate_();switch(op){case 'boot':return boot_();case 'getMaterial':return getMaterial_(arg);case 'saveMaterial':return saveMaterial_(arg);case 'saveDraft':return saveDraft_(arg);case 'distribute':return distribute_(arg);case 'toggle':return toggle_(arg);case 'open':return open_(arg);case 'submit':return submit_(arg);case 'results':return results_(arg);case 'review':return review_(arg);case 'board':return board_(arg);case 'fuda':return fuda_();case 'ysLog':return ysLog_(arg);default:fail_('この操作は使えません。');}}
function boot_(){var p=me_(),out={me:safeMe_(p),classes:JM.classes,url:ScriptApp.getService().getUrl()||'',namedEnabled:config_().JM_NAMED_COLLECTION==='true'};

  out.materials=list_('教材',7).filter(function(r){return r[1]===p.mail;}).map(function(r){return {id:r[0],rev:r[2],title:r[3],grade:r[4],subject:r[5],updated:r[6]};});
  out.assignments=list_('配布',8).filter(function(r){return r[1]===p.mail;}).map(function(r){return assignmentMeta_(r);});
 }return out;}

<meta charset="utf-8">
<title>授業メイト 見本</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 白の地に、教科と行き先の色を少し。主役は真ん中の教材。 */
:root{
  --bg:#FFFFFF; --side:#F5F6F8; --fg:#1D1D1F; --sub:#5E6068; --line:#E3E4E8;
  --accent:#0066CC; --accent-soft:#E8F1FC; --ok:#1F7A3A; --ok-soft:#E6F4EA;
  --ng:#B3261E; --ng-soft:#FBEAE8; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
input,textarea{font:inherit;color:var(--fg)}

.jm-app{display:flex;height:100%;overflow:hidden}
/* 左の並び（PC） */
.jm-side{width:208px;flex:none;background:var(--side);display:flex;flex-direction:column;gap:4px;padding:18px 12px 72px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.jm-logo{font-size:17px;font-weight:700;padding:4px 10px 14px;letter-spacing:.02em}
.jm-nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;font-size:15px;text-align:left;width:100%}
.jm-nav svg{width:20px;height:20px;flex:none}
.jm-nav[aria-current="page"]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600;color:var(--accent)}
.jm-side .jm-sp{flex:1}
.jm-who{font-size:14px;color:var(--sub);padding:8px 12px}

.jm-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.jm-head{flex:none;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 20px}
.jm-head h1{font-size:24px;font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.jm-head .jm-sp{flex:1}
.jm-body{flex:1;min-height:0;overflow:auto;padding:0 20px 20px}

/* ボタン */
.jm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:22px;font-weight:600;font-size:15px;white-space:nowrap}
.jm-btn svg{width:18px;height:18px}
.jm-btn-p{background:var(--accent);color:#fff}
.jm-btn-s{background:var(--accent-soft);color:var(--accent)}
.jm-ic{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;color:var(--fg)}
.jm-ic:hover{background:var(--side)}
.jm-ic svg{width:22px;height:22px}

/* さがす */
.jm-search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;background:var(--side);width:260px;max-width:100%}
.jm-search svg{width:18px;height:18px;color:var(--sub);flex:none}
.jm-search input{border:0;background:none;outline:none;width:100%;font-size:15px}
.jm-seg{display:inline-flex;background:var(--side);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.jm-seg button{min-height:44px;min-width:52px;padding:0 12px;border-radius:9px;font-size:15px;color:var(--sub)}
.jm-seg button[aria-pressed="true"]{background:#fff;color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.jm-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.jm-month{font-size:14px;color:var(--sub)}

.jm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.jm-card{text-align:left;display:flex;flex-direction:column;gap:8px;padding:0;border-radius:16px;transition:transform .15s}
.jm-card:hover{transform:translateY(-2px)}
.jm-thumb{position:relative;height:118px;border-radius:14px;background:var(--side);overflow:hidden}
.jm-thumb .jm-t-app,.jm-thumb .jm-t-print{position:absolute;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.jm-t-app{left:14px;top:18px;width:96px;height:78px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:end}
.jm-t-app i{display:block;height:16px;border-radius:4px;background:var(--accent-soft)}
.jm-t-app b{grid-column:1/3;align-self:start;height:8px;width:70%;border-radius:3px;background:var(--line);margin-bottom:6px}
.jm-t-print{right:16px;top:12px;width:66px;height:92px;padding:9px 8px;display:flex;flex-direction:column;gap:7px}
.jm-t-print i{display:block;height:3px;border-radius:2px;background:var(--line)}
.jm-t-print i:nth-child(odd){width:60%}
.jm-ctitle{font-size:15px;font-weight:600;line-height:1.35}
.jm-cmeta{font-size:14px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap}

.jm-appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 8px}
.jm-appt{flex:none;width:auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:14px;text-align:center}
.jm-appt:hover{background:var(--side)}
.jm-appi{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.jm-appn{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.jm-apps-s{font-size:14px;color:var(--sub);line-height:1.2}
/* シート（下から出る面） */
.jm-veil{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;animation:jm-fade .18s}
.jm-sheet{background:#fff;border-radius:20px;box-shadow:var(--shadow);width:min(720px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;animation:jm-up .22s cubic-bezier(.2,.8,.2,1)}
.jm-sh-head{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 22px}
.jm-sh-head h2{font-size:19px;margin:0;flex:1}
.jm-sh-body{padding:8px 22px 20px;display:flex;flex-direction:column;gap:14px}
@keyframes jm-fade{from{opacity:0}}
@keyframes jm-up{from{transform:translateY(24px);opacity:0}}

/* 見本を開いたとき：アプリとプリントを横に */
.jm-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.jm-pane{background:var(--side);border-radius:14px;padding:14px;min-width:0}
.jm-pane .jm-paper{height:min(300px,52vh);margin:0 auto}
.jm-pane .jm-kid{max-height:min(300px,52vh);overflow:hidden;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.jm-pane h3{font-size:14px;color:var(--sub);margin:0 0 8px;font-weight:600;display:flex;align-items:center;gap:6px}
.jm-pane h3 svg{width:16px;height:16px}

/* 子どもの画面（小さい版と全体で共通） */
.jm-kid{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.jm-dots{display:flex;gap:6px;justify-content:center}
.jm-dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.jm-dots i.on{background:var(--accent);width:20px}
.jm-dots i.ok{background:var(--ok)}
.jm-q{font-size:18px;font-weight:600;text-align:center;line-height:1.5}
.jm-ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jm-ch button{min-height:52px;border-radius:12px;background:var(--side);font-size:17px;font-weight:600;padding:6px 8px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.jm-ch button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.jm-ch button.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng);animation:jm-shake .3s}
.jm-ch button svg{width:18px;height:18px}
@keyframes jm-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.jm-write{display:flex;gap:8px}
.jm-write input{flex:1;min-width:0;height:52px;border-radius:12px;border:2px solid var(--line);padding:0 14px;font-size:18px}

/* プリント */
.jm-paper{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.14);padding:16px 18px;font-size:14px;line-height:1.6;aspect-ratio:210/297;overflow:hidden;max-width:100%}
.jm-paper .jm-p-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--fg);padding-bottom:4px;margin-bottom:10px;gap:8px}
.jm-paper .jm-p-title{font-weight:700;font-size:16px}
.jm-paper .jm-p-name{font-size:14px;color:var(--sub);white-space:nowrap}
.jm-paper ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.jm-paper .jm-p-box{display:inline-block;min-width:88px;border-bottom:1px solid var(--sub);height:18px;vertical-align:bottom;margin-left:4px}
.jm-paper .jm-p-ch{color:var(--sub)}

/* 作る（エディタ） */
.jm-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:20px;height:100%}
.jm-list{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;padding:2px}
.jm-item{border-radius:14px;background:var(--side);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.jm-item[aria-expanded="true"]{background:#fff;box-shadow:0 0 0 2px var(--accent)}
.jm-ihead{display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;width:100%}
.jm-no{flex:none;width:28px;height:28px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.jm-item[aria-expanded="true"] .jm-no{background:var(--accent);color:#fff}
.jm-ip{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jm-kind{flex:none;font-size:14px;color:var(--sub);padding:2px 10px;border-radius:10px;background:#fff}
.jm-field{display:flex;flex-direction:column;gap:4px}
.jm-field label{font-size:14px;color:var(--sub)}
.jm-field input{height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;font-size:15px;background:#fff}
.jm-field input.jm-right{border-color:var(--ok);background:var(--ok-soft)}
.jm-ws{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.jm-ws input{min-width:0;width:100%}
.jm-add{display:flex;gap:8px}
.jm-add button{flex:1;min-height:48px;border-radius:14px;border:1.5px dashed var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.jm-add button svg{width:18px;height:18px}
.jm-prev{display:flex;flex-direction:column;gap:10px;min-height:0}
.jm-prev .jm-stage{flex:1;min-height:0;overflow:auto;background:var(--side);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.jm-title-in{font-size:24px;font-weight:700;min-height:44px;border:0;border-bottom:2px solid transparent;padding:2px 0;background:none;min-width:0;width:100%;outline:none}
.jm-title-in:focus{border-bottom-color:var(--accent)}

/* 配る */
.jm-link{display:flex;align-items:center;gap:8px;background:var(--side);border-radius:12px;padding:6px 6px 6px 14px}
.jm-link code{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.jm-ways{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jm-way{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:14px;background:var(--side);font-size:15px;font-weight:600;min-height:44px}
.jm-way svg{width:28px;height:28px;color:var(--accent)}
.jm-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-size:15px;width:100%;text-align:left;border-radius:12px}
.jm-sw{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.jm-sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
[aria-checked="true"] .jm-sw{background:var(--ok)}
[aria-checked="true"] .jm-sw::after{transform:translateX(20px)}

/* 結果 */
.jm-res{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;height:100%}
.jm-rq{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border-radius:12px;text-align:left;width:100%}
.jm-rq[aria-pressed="true"]{background:var(--accent-soft)}
.jm-rq .jm-ip{font-size:15px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.jm-bar{flex:none;width:56px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.jm-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.jm-pct{flex:none;width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.jm-low .jm-bar i{background:var(--ng)}
.jm-low .jm-pct{color:var(--ng)}
.jm-detail{background:var(--side);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.jm-detail h3{margin:0;font-size:17px}
.jm-seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.jm-seat{min-width:0;height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-variant-numeric:tabular-nums;padding:0 8px}
.jm-seat.ng{background:var(--ng-soft);color:var(--ng);font-weight:700}
.jm-seat.no{color:var(--sub);background:transparent;border:1px dashed var(--line)}
.jm-ans{display:flex;flex-wrap:wrap;gap:6px}
.jm-ans div{display:flex;gap:10px;background:#fff;border-radius:10px;padding:8px 12px;font-size:15px}
.jm-grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.jm-gh{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;min-width:64px}
.jm-gh svg{width:16px;height:16px}
.jm-gh.ng{color:var(--ng)} .jm-gh.no{color:var(--sub)} .jm-gh.okk{color:var(--ok)}
.jm-nms{display:contents}
.jm-nm{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:5px 10px;font-size:15px}
.jm-nm b{font-size:14px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.jm-legend{display:flex;gap:14px;font-size:14px;color:var(--sub);flex-wrap:wrap}
.jm-legend span{display:inline-flex;align-items:center;gap:4px}
.jm-legend .jm-seat{width:28px}

/* 子どもが開いたとき（全体） */
.jm-kidfull{position:fixed;inset:0;background:var(--side);z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.jm-kidfull .jm-kid{width:min(640px,100%);padding:28px;gap:20px;border-radius:24px;box-shadow:var(--shadow)}
.jm-kidfull .jm-q{font-size:26px}
.jm-kidfull .jm-ch button{min-height:72px;font-size:22px;border-radius:16px}
.jm-kidfull .jm-write input{height:64px;font-size:22px}
.jm-kidtop{width:min(640px,100%);display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:15px;color:var(--sub)}
.jm-next{align-self:center}
.jm-done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.jm-done .jm-big{font-size:34px;font-weight:700}
.jm-marks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.jm-marks span{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.jm-marks .ok{background:var(--ok-soft);color:var(--ok)}
.jm-marks .ng{background:var(--ng-soft);color:var(--ng)}

.jm-nf{align-items:center;gap:14px}
.jm-nf-who{width:56px;height:56px;border-radius:28px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.jm-nf-who svg{width:30px;height:30px}
.jm-nf-seg{display:flex;width:100%;flex-wrap:nowrap}
.jm-nf-seg button{flex:1;min-width:0;padding:0 2px;font-size:17px}
.jm-nf-ban{display:flex;align-items:center;gap:16px}
.jm-nf-ban output{min-width:96px;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.jm-nf-pm{width:52px;height:52px;border-radius:26px;background:var(--side);font-size:26px;font-weight:600}
.jm-nf-name{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.jm-nf-name label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--sub);min-width:0}
.jm-nf-name input{height:56px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font-size:20px;min-width:0;width:100%}
.jm-nf-name input:focus{border-color:var(--accent);outline:none}
.jm-nf-go{width:64px;height:64px;border-radius:32px;background:var(--accent);color:#fff}
.jm-nf-go:disabled{background:var(--line);color:var(--sub);cursor:default}
/* 問題の形 */
.jm-go{width:64px;height:64px;border-radius:32px;background:var(--accent);color:#fff;flex:none}
.jm-go:disabled{background:var(--line);color:var(--sub);cursor:default}
.jm-go[hidden]{display:none!important}
.jm-kid input.ok,.jm-kid textarea.ok,.jm-nv.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.jm-kid input.ng,.jm-kid textarea.ng,.jm-nv.ng{border-color:var(--ng);background:var(--ng-soft);color:var(--ng);text-decoration:line-through}
.jm-right-ans{align-self:center;color:var(--ok);font-weight:700;font-size:18px;white-space:nowrap}
.jm-ox{display:flex;gap:16px;justify-content:center}
.jm-ox button{width:120px;height:104px;border-radius:20px;background:var(--side);font-size:52px;font-weight:700;border:3px solid transparent;line-height:1}
.jm-ox button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.jm-ox button.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng);animation:jm-shake .3s}
.jm-num{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.jm-nv{min-width:150px;height:56px;border-radius:14px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 12px}
.jm-nu{font-size:22px;font-weight:600}
.jm-pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center}
.jm-pad button{height:48px;border-radius:12px;background:var(--side);font-size:22px;font-weight:600}
.jm-mt{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
.jm-mc{display:flex;flex-direction:column;gap:8px}
.jm-mc button{min-height:52px;border-radius:12px;background:var(--side);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;border:2px solid transparent;text-align:left;flex-wrap:wrap}
.jm-mc button.sel{border-color:var(--accent);background:var(--accent-soft)}
.jm-mc button.ok{border-color:var(--ok);background:var(--ok-soft)}
.jm-mc button.ng{border-color:var(--ng);background:var(--ng-soft)}
.jm-mc button svg{width:18px;height:18px;flex:none}
.jm-mc button.ok{color:var(--ok)}
.jm-mc button.ng{color:var(--ng)}
.jm-mc .jm-right-ans{width:100%;font-size:14px;white-space:normal}
.jm-badge{min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.jm-badge:empty{background:transparent;border:2px dashed var(--line)}
.jm-fill{display:block;font-size:22px;line-height:2.3;text-align:center}
.jm-fill input{height:44px;border-radius:10px;border:2px solid var(--line);padding:0 8px;font-size:19px;margin:0 4px;text-align:center;max-width:100%;vertical-align:middle}
.jm-fill .jm-go{display:flex;align-items:center;justify-content:center;margin:10px auto 0}
.jm-flip{position:relative;display:block;width:min(420px,100%);height:190px;margin:0 auto;perspective:900px;border-radius:20px}
.jm-fr,.jm-bk{position:absolute;inset:0;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s;font-weight:700;text-align:center}
.jm-fr{background:var(--accent-soft);color:var(--accent);font-size:34px}
.jm-bk{background:#fff;border:2px solid var(--line);font-size:19px;transform:rotateY(180deg);line-height:1.5}
.jm-flip.back .jm-fr{transform:rotateY(-180deg)}
.jm-flip.back .jm-bk{transform:rotateY(0)}
.jm-cardbtn{display:flex;gap:12px;justify-content:center}
.jm-think{display:flex;flex-direction:column;gap:10px;align-items:center}
.jm-think textarea{width:100%;border-radius:14px;border:2px solid var(--line);padding:12px;font-size:18px;resize:none;font-family:inherit}
.jm-marks .kk{background:var(--accent-soft);color:var(--accent)}
.jm-kidfull .jm-kid{gap:16px}
.jm-kidfull .jm-mc button{min-height:60px;font-size:18px}
.jm-stage .jm-paper{overflow:visible}
.jm-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jm-type{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;background:var(--side);font-size:15px;font-weight:600;min-height:44px}
.jm-type-i{width:48px;height:48px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent)}
.jm-mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:6px}
.jm-mrow input{min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);padding:0 10px;font-size:15px}
.jm-ta{border-radius:10px;border:1px solid var(--line);padding:8px 12px;font-size:15px;resize:vertical;font-family:inherit}
.jm-oxset button{min-width:64px;font-size:20px}
.jm-p-m{display:flex;justify-content:space-around;gap:24px;margin-top:4px}
.jm-p-m div{display:flex;flex-direction:column;gap:6px}
.jm-p-m span{display:flex;gap:6px;align-items:center}
.jm-p-m i{font-style:normal}
.jm-p-card{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--fg)}
.jm-p-card span{padding:6px 10px}
.jm-p-card span:first-child{border-right:1.5px dashed var(--fg);font-weight:700}
.jm-p-lines i{display:block;height:26px;border-bottom:1px solid var(--sub)}
.jm-gtypes{display:flex;flex-wrap:wrap;gap:6px}
.jm-gtypes button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;background:var(--side);font-size:15px;border:2px solid transparent}
.jm-gtypes button svg{width:18px;height:18px}
.jm-gtypes button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.jm-gprompt{padding:10px 14px;align-items:flex-start}
.jm-gprompt span{flex:1;font-size:15px;white-space:pre-wrap}
.jm-gpr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jm-gpr .jm-link{flex:1;min-width:220px}
/* Gemini を開いたら、貼る欄だけの画面にする。右の窓で開いたときは左へ寄せて隠れないように */
.jm-veil.jmg-left{justify-content:flex-start}
.jmg-pick{display:none;align-items:center;gap:10px;font-size:15px;font-weight:600}
.jmg-pick .jm-type-i{width:36px;height:36px}
.jmg-pick button{margin-left:auto;min-height:44px;padding:0 14px;border-radius:12px;background:var(--side);font-size:15px}
.jmg-paste .jmg-pick{display:flex}
.jmg-paste .jm-types,.jmg-paste .jm-gprompt{display:none}
.jmg-paste .jm-gpr{justify-content:flex-start}
.jmg-paste #paste{min-height:min(320px,45vh);font-size:16px}
.jm-gerr[hidden]{display:none!important}
.jm-gerr{background:var(--ng-soft);color:var(--ng);border-radius:12px;padding:10px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.jm-gerr b{display:flex;align-items:center;gap:6px}
.jm-gerr svg{width:16px;height:16px}
.jm-gerr div{color:var(--fg)}
.jm-gerr div span{color:var(--ng);font-weight:600;margin-right:8px}
input,textarea{background:#fff;color:var(--fg)}
/* 教科のしかけ */
.jm-jpwrap{position:relative;width:min(256px,100%);margin:0 auto;aspect-ratio:400/439}
.jm-jp{width:100%;height:100%;display:block;border-radius:14px;touch-action:manipulation}
.jm-jpname{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.jm-jpname .jm-jpwrap{width:220px}
.jm-ch.jm-ch1{grid-template-columns:1fr}
@media (max-width:760px){.jm-jpname{grid-template-columns:1fr}.jm-jpname .jm-jpwrap{width:min(200px,100%)}.jm-ch.jm-ch1{grid-template-columns:1fr 1fr}}
.jm-jp-sea{fill:#EAF2FB}
.jm-jp-box{fill:none;stroke:#9AB0C8;stroke-width:1;stroke-dasharray:3 2}
.jm-jp path{fill:#D5E6C8;stroke:#6E8F5E;stroke-width:.6;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer}
.jm-jp path.hl{fill:var(--accent)}
.jm-jp path.sel{fill:#F2C14E;stroke:#7A5A00;stroke-width:2}
.jm-jp path.ok{fill:var(--ok)}
.jm-jp path.ng{fill:var(--ng)}
.jm-jp-lb{font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.jm-jp-lb.ok{fill:var(--ok)}
.jm-jp-lb.ng{fill:var(--ng)}
.jm-jp-out{position:absolute;left:6px;top:6px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.jm-jp-out[hidden]{display:none!important}
.jm-jp.pr path{fill:#fff;stroke:#333}
.jm-jp.pr path.hl{fill:#777}
.jm-jp.pr .jm-jp-sea{fill:#fff}
.jm-p-jp{width:150px;margin:4px 0}
.jm-sel{height:44px;border-radius:10px;border:1px solid var(--line);padding:0 10px;font-size:15px;background:#fff;color:var(--fg)}
.jm-tens{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.jm-tf{display:grid;grid-template-columns:repeat(5,40px);grid-template-rows:repeat(2,40px);gap:4px;padding:6px;border:2px solid var(--fg);border-radius:8px}
.jm-tf span{border-radius:7px;background:var(--side)}
.jm-tf span.b{background:#2F6FD0}
.jm-tf span.o{background:#E8892B}
.jm-loose{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:44px}
.jm-loose [data-blk]{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.jm-loose [data-blk] i{width:34px;height:34px;border-radius:7px;background:#E8892B}
.jm-loose [data-blk][hidden]{display:none!important}
.jm-blk-re{font-size:22px;background:var(--side);margin-left:8px}
.jm-row10{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.jm-row10 button{min-width:44px;height:48px;border-radius:10px;background:var(--side);font-size:20px;font-weight:600}
.jm-fq{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap}
.jm-fres{display:inline-flex;align-items:center;gap:4px}
.jm-fres svg{width:20px;height:20px}
.jm-fr2{display:inline-flex;flex-direction:column;align-items:center;font-size:30px;font-weight:700;line-height:1.1}
.jm-fr2 i{font-style:normal;padding:0 8px}
.jm-fr2 i:first-child{border-bottom:3px solid var(--fg)}
.jm-tape{display:grid;width:100%;height:64px;border:3px solid var(--fg);border-radius:6px;overflow:hidden}
.jm-tape button{border-right:2px solid var(--fg);background:#fff;min-width:0}
.jm-tape button:last-child{border-right:0}
.jm-tape button[aria-pressed="true"]{background:#F2C14E;background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.18) 6px 8px)}
.jm-tape.ok{border-color:var(--ok)}
.jm-tape.ng{border-color:var(--ng)}
.jm-tape-n{display:flex;justify-content:space-between;font-size:15px;color:var(--sub);margin-top:-10px}
.jm-p-tf{display:flex;gap:8px;margin-top:4px}
.jm-p-tf .jm-tf{grid-template-columns:repeat(5,14px);grid-template-rows:repeat(2,14px);gap:2px;padding:3px;border-width:1px}
.jm-p-tf .jm-tf span{border-radius:7px;background:#fff;border:1px solid #333}
.jm-p-tf .jm-tf span.b{background:#333}
.jm-p-loose{letter-spacing:2px}
.jm-p-tape{display:grid;height:24px;border:1.5px solid #333;margin-top:4px;width:80%}
.jm-p-tape i{border-right:1px solid #333}
.jm-p-tape i:last-child{border-right:0}
.jm-types-h{font-size:14px;color:var(--sub);font-weight:600;margin:4px 0 -4px}
.jm-feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.jm-featc{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--side);text-align:left;min-height:44px}
.jm-featc .jm-appi{width:64px;height:64px;font-size:28px;flex:none}
.jm-featc b{display:block;font-size:17px}
.jm-featc span.d{font-size:14px;color:var(--sub)}
.jm-dlist{display:flex;flex-direction:column;gap:8px}
.jm-drow{display:flex;align-items:center;gap:4px;background:var(--side);border-radius:14px;padding:8px 8px 8px 16px}
.jm-drow.off .jm-dt b{color:var(--sub)}
.jm-dt{flex:1;min-width:0;display:flex;flex-direction:column}
.jm-dt b{font-size:16px}
.jm-dt span{font-size:14px;color:var(--sub)}
.jm-dsw{width:auto;padding:0 8px}
/* 時計・数直線・ひき算のブロック */
.jm-clockwrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.jm-clock{width:220px;height:220px;display:block}

// 貼った文を行に分ける（番号・表の｜・``` ・見出しの行を取りのぞく）
function gemRows(text){
  return text.split(/\r?\n/).map((raw,n)=>({n:n+1,raw:raw.trim()})).filter(x=>x.raw&&!/^```/.test(x.raw)&&!/^\|?\s*:?-{2,}/.test(x.raw))
    .map(x=>{let s=x.raw.replace(/^\|/,'').replace(/\|$/,'').replace(/^(\d+|[０-９]+)[.．、)）]\s*/,'').replace(/^[-・*]\s+/,'');
      return {...x,cols:s.split(/[｜|]/).map(c=>c.replace(/\*\*/g,'').trim()).filter((c,i,a)=>c||i<a.length-1)}});
}
function gemParse(type,text){
  const ok=[],bad=[];
  gemRows(text).forEach(x=>{if(/^(問題|問い|文|おもて)$/.test(x.cols[0]||'')&&x.n<=2)return;   // 表の見出し
    const q=GEM[type].parse(x.cols);q?ok.push(q):bad.push(x)});

const clockSvg=(h,m,cls='')=>{const ha=((h%12)+m/60)*30,ma=m*6,R=90;
  const tk=Array.from({length:60},(_,j)=>{const a=j*6*Math.PI/180,r1=j%5?R-6:R-12;return `<line x1="${(Math.sin(a)*r1).toFixed(1)}" y1="${(-Math.cos(a)*r1).toFixed(1)}" x2="${(Math.sin(a)*R).toFixed(1)}" y2="${(-Math.cos(a)*R).toFixed(1)}" class="${j%5?'mi':'ma'}"/>`}).join('');
  const nums=Array.from({length:12},(_,j)=>{const a=(j+1)*30*Math.PI/180;return `<text x="${(Math.sin(a)*70).toFixed(1)}" y="${(-Math.cos(a)*70+8).toFixed(1)}" text-anchor="middle">${j+1}</text>`}).join('');
  const hand=(ang,len,c)=>{const a=ang*Math.PI/180;return `<line x1="0" y1="0" x2="${(Math.sin(a)*len).toFixed(1)}" y2="${(-Math.cos(a)*len).toFixed(1)}" class="${c}"/>`};
  return `<svg class="jm-clock ${cls}" viewBox="-100 -100 200 200" aria-hidden="true"><circle r="96" class="fc"/>${tk}${nums}${hand(ha,48,'hh')}${hand(ma,76,'mh')}<circle r="5" class="cp"/></svg>`};
const hm=(h,m)=>`${h}じ${m?m+'ふん':''}`;
const clockChoices=(q,i)=>{const h=q.h,m=q.m,nh=h%12+1,ph=(h+10)%12+1;
  const c=[hm(h,m),hm(m>=30?nh:ph,m),hm(Math.round(m/5)||12,(h%12)*5),hm(h,(m+30)%60),hm(nh,(m+10)%60)];  // 短い針の読みちがい・針の取りちがえ
  return shuffle([...new Set(c)].slice(0,4),i+h)};
// 数直線：v は 0.1 などの小数も。中では「何めもり」の整数で数える
const nlIdx=(q,v)=>Math.round((v-q.from)/q.unit);
function nlSvg(q,cls=''){const n=nlIdx(q,q.to),W=480,x0=24,x1=W-24,X=k=>x0+(x1-x0)*k/n;const ai=nlIdx(q,+q.a);
  const fmt=v=>String(+v.toFixed(6));
  let t='';for(let k=0;k<=n;k++){const big=k%q.lab===0;t+=`<line x1="${X(k)}" y1="${big?34:40}" x2="${X(k)}" y2="${big?62:56}" class="${big?'ma':'mi'}"/>`;if(big)t+=`<text x="${X(k)}" y="86" text-anchor="middle">${fmt(q.from+k*q.unit)}</text>`}
  return `<svg class="jm-nl ${cls}" viewBox="0 0 ${W} 96" aria-hidden="true"><line x1="${x0}" y1="48" x2="${x1+12}" y2="48" class="ax"/>${t}<path d="M${X(ai)} 30 l-8 -14 h16 z" class="ar"/></svg>`}
Object.assign(SUBJ_T,{
  clock:{
    kid(q,i,live){const ti=live?'':' tabindex="-1"';return `<div class="jm-clockwrap">${clockSvg(q.h,q.m)}<div class="jm-ch jm-ch1">${clockChoices(q,i).map(c=>`<button data-c="${c}"${ti}>${c}</button>`).join('')}</div></div>`},
    bind(q,i,done){const ans=hm(q.h,q.m);document.querySelectorAll('.jm-kidfull .jm-ch button').forEach(b=>b.onclick=()=>{if(S.kid.lock)return;const ok=b.dataset.c===ans;b.classList.add(ok?'ok':'ng');b.insertAdjacentHTML('afterbegin',ok?IC.ok:IC.ng);
      if(!ok){const r=document.querySelector(`.jm-kidfull .jm-ch [data-c="${ans}"]`);r.classList.add('ok');r.insertAdjacentHTML('afterbegin',IC.ok)}done(ok)})},
    print(q){return `${esc(q.p)}<div class="jm-p-clock">${clockSvg(q.h,q.m,'pr')}<span>（　　）じ（　　）ふん</span></div>`},
    fields(q,i){return `<div class="jm-field"><label for="f${i}_p">問題</label><input id="f${i}_p" data-path="p" value="${esc(q.p)}"></div><div class="jm-ws" style="grid-template-columns:1fr 1fr">
      <div class="jm-field"><label for="f${i}_h">じ（1〜12）</label><input id="f${i}_h" data-num="h" inputmode="numeric" value="${q.h}"></div>
      <div class="jm-field"><label for="f${i}_m">ふん（0〜59）</label><input id="f${i}_m" data-num="m" inputmode="numeric" value="${q.m}"></div></div>`}
  },
  nl:{
    kid(q,i,live){const ti=live?'':' tabindex="-1"';return `${nlSvg(q)}<div class="jm-num"><output id="nv" class="jm-nv" aria-live="polite"></output>${q.u?`<span class="jm-nu">${esc(q.u)}</span>`:''}</div>
      <div class="jm-row10">${['1','2','3','4','5','6','7','8','9','0','.','⌫'].map(k=>`<button data-key="${k}" aria-label="${k==='⌫'?'1字けす':k==='.'?'小数点':k}"${ti}>${k}</button>`).join('')}</div>
      <button class="jm-ic jm-go" id="nok" aria-label="答える"${ti} style="align-self:center">${IC.next}</button>`},
    bind(q,i,done){SUBJ_T.ten.pad(q,done)},
    print(q){return `${esc(q.p)}<span class="jm-p-box" style="min-width:56px"></span>${esc(q.u||'')}<div class="jm-p-nl">${nlSvg(q,'pr')}</div>`},
    fields(q,i){const f=(k,l)=>`<div class="jm-field"><label for="f${i}_${k}">${l}</label><input id="f${i}_${k}" data-nl="${k}" inputmode="decimal" value="${q[k]}"></div>`;
      return `<div class="jm-field"><label for="f${i}_p">問題</label><input id="f${i}_p" data-path="p" value="${esc(q.p)}"></div><div class="jm-ws" style="grid-template-columns:repeat(5,1fr)">${f('from','はじめ')}${f('to','おわり')}${f('unit','1めもり')}${f('lab','数を書く間')}${f('a','答え')}</div>`}
  }
});
// ひき算のブロック（13−9：10のまとまりから ひく）
const tenAdd=SUBJ_T.ten.kid, tenBind=SUBJ_T.ten.bind, tenPrint=SUBJ_T.ten.print, tenFields=SUBJ_T.ten.fields;
Object.assign(SUBJ_T.ten,{
  kid(q,i,live){if(q.op!=='-')return tenAdd(q,i,live);const ti=live?'':' tabindex="-1"';
    return `<div class="jm-tens"><div class="jm-tf jm-tf-sub">${Array.from({length:10},(_,j)=>`<button class="b" data-take="${j}" aria-label="ブロックを とる"${ti}></button>`).join('')}</div><div class="jm-tf">${Array.from({length:10},(_,j)=>`<span class="${j<q.x-10?'b':''}"></span>`).join('')}</div></div>
      <div class="jm-num"><output id="nv" class="jm-nv" aria-live="polite"></output></div>
      <div class="jm-row10">${['1','2','3','4','5','6','7','8','9','0','⌫'].map(k=>`<button data-key="${k}" aria-label="${k==='⌫'?'1字けす':k}"${ti}>${k}</button>`).join('')}</div>
      <button class="jm-ic jm-go" id="nok" aria-label="答える"${ti} style="align-self:center">${IC.next}</button>`},
  bind(q,i,done){if(q.op!=='-')return tenBind(q,i,done);
    document.querySelectorAll('.jm-kidfull [data-take]').forEach(b=>b.onclick=()=>{if(S.kid.lock)return;b.classList.toggle('gone');b.setAttribute('aria-label',b.classList.contains('gone')?'とったブロック（もどす）':'ブロックを とる')});
    SUBJ_T.ten.pad(q,done)},
  print(q){if(q.op!=='-')return tenPrint(q);return `${esc(q.p)}<span class="jm-p-box" style="min-width:56px"></span><div class="jm-p-tf">${tenFrame(10,10,'')}${tenFrame(10,q.x-10,'')}</div>`},
  fields(q,i){if(q.op!=='-')return tenFields(q,i);return `<div class="jm-ws" style="grid-template-columns:1fr 1fr 1fr">
      <div class="jm-field"><label for="f${i}_x">ひかれる数</label><input id="f${i}_x" data-num="x" inputmode="numeric" value="${q.x}"></div>
      <div class="jm-field"><label for="f${i}_y">ひく数</label><input id="f${i}_y" data-num="y" inputmode="numeric" value="${q.y}"></div>
      <div class="jm-field"><label>答え</label><input class="jm-right" value="${q.a}" readonly tabindex="-1"></div></div>`}
});
const setNum0=setNum;
setNum=function(q,k,v){
  if(q.t==='ten'&&q.op==='-'){v=parseInt(zen(String(v)),10);if(k==='x'&&!(v>=11&&v<=18))return false;if(k==='y'&&!(v>=2&&v<=9))return false;q[k]=v;q.p=`${q.x}−${q.y}＝？`;q.a=String(q.x-q.y);return true}
  if(q.t==='clock'){v=parseInt(zen(String(v)),10);if(k==='h'&&!(v>=1&&v<=12))return false;if(k==='m'&&!(v>=0&&v<=59))return false;q[k]=v;return true}
  return setNum0(q,k,v)};
function setNl(q,k,v){v=parseFloat(zen(String(v)));if(!isFinite(v))return false;const o={...q,[k]:k==='lab'?Math.round(v):v};
  const n=nlIdx(o,o.to);if(!(o.unit>0)||!(o.to>o.from)||n<2||n>40||!(o.lab>=1)||o.a<o.from||o.a>o.to||Math.abs(nlIdx(o,o.a)*o.unit+o.from-o.a)>1e-9)return false;
  q[k]=o[k];if(k==='a')q.a=String(v);return true}
const qTitle=q=>q.t==='f'?q.p.replace(/\[([^\]]*)\]/g,'（　）'):q.p;

// 子どもの画面の中身（live=false は見え方だけ）
function kidBody(q,i,live){
  if(SUBJ_T[q.t])return SUBJ_T[q.t].kid(q,i,live);
  const ti=live?'':' tabindex="-1"';
  switch(q.t){
    case 'c': return `<div class="jm-ch">${choices(q,i).map(c=>`<button data-c="${esc(c)}"${ti}>${esc(c)}</button>`).join('')}</div>`;
    case 'w': return `<form class="jm-write" id="wf"><input id="wa" autocomplete="off" aria-label="答え"${ti}><button class="jm-ic jm-go" aria-label="答える"${ti}>${IC.next}</button></form>`;
    case 'ox': return `<div class="jm-ox"><button data-ox="1" aria-label="まる"${ti}>○</button><button data-ox="0" aria-label="ばつ"${ti}>✕</button></div>`;
    case 'n': return `<div class="jm-num"><output id="nv" class="jm-nv" aria-live="polite"></output>${q.u?`<span class="jm-nu">${esc(q.u)}</span>`:''}</div>
      <div class="jm-row10">${['1','2','3','4','5','6','7','8','9','0','.','⌫'].map(k=>`<button data-key="${k}" aria-label="${k==='⌫'?'1字けす':k}"${ti}>${k}</button>`).join('')}</div>
      <button class="jm-ic jm-go" id="nok" aria-label="答える"${ti} style="align-self:center">${IC.next}</button>`;
    case 'm': {const R=shuffle(q.pairs.map((_,j)=>j),i+3);
      return `<div class="jm-mt"><div class="jm-mc">${q.pairs.map((p,j)=>`<button data-ml="${j}"${ti}><span>${esc(p[0])}</span><b class="jm-badge"></b></button>`).join('')}</div>
      <div class="jm-mc">${R.map(j=>`<button data-mr="${j}"${ti}><b class="jm-badge"></b><span>${esc(q.pairs[j][1])}</span></button>`).join('')}</div></div>
      <button class="jm-ic jm-go" id="mok" aria-label="答える" disabled${ti} style="align-self:center">${IC.next}</button>`}
    case 'f': {const h=holes(q.p);
      return `<form class="jm-fill" id="ff">${h.map((s,j)=>j%2?`<input data-fi="${(j-1)/2}" aria-label="（${(j+1)/2}）" style="width:${Math.max(3,s.length)+1.5}em" autocomplete="off"${ti}>`:esc(s)).join('')}
      <button class="jm-ic jm-go" aria-label="答える"${ti}>${IC.next}</button></form>`}
    case 'card': return `<button class="jm-flip" id="cd"${ti} aria-label="めくる"><span class="jm-fr">${esc(q.p)}</span><span class="jm-bk">${esc(q.a)}</span></button>
      <div class="jm-cardbtn" id="cb" hidden><button class="jm-btn jm-btn-s" data-cd="0">↺ もう一回</button><button class="jm-btn jm-btn-p" data-cd="1">${IC.ok}おぼえた</button></div>`;
    case 'k': return `<form class="jm-think" id="kf"><textarea id="kt" rows="4" aria-label="考え"${ti}></textarea><button class="jm-ic jm-go" aria-label="出す"${ti}>${IC.next}</button></form>`;
  }
}
const kidQ=q=>q.t==='card'||q.t==='f'?'':`<div class="jm-q">${esc(q.p)}</div>`;

// 子どもが答えたとき（done(true/false/'k')）
function kidBind(q,i,done){
  if(SUBJ_T[q.t])return SUBJ_T[q.t].bind(q,i,done);
  const lock=()=>S.kid.lock;
  const okMark=(el,ok)=>{el.classList.add(ok?'ok':'ng');el.insertAdjacentHTML('afterbegin',ok?IC.ok:IC.ng)};
  switch(q.t){
    case 'c': document.querySelectorAll('.jm-ch button').forEach(b=>b.onclick=()=>{if(lock())return;const ok=b.dataset.c===q.a;okMark(b,ok);
      if(!ok)okMark([...document.querySelectorAll('.jm-ch button')].find(x=>x.dataset.c===q.a),true);done(ok)});break;
    case 'w': $('#wf').onsubmit=e=>{e.preventDefault();if(lock())return;const inp=$('#wa'),ok=inp.value.trim()===q.a;inp.classList.add(ok?'ok':'ng');
      if(!ok)inp.insertAdjacentHTML('afterend',`<span class="jm-right-ans">${esc(q.a)}</span>`);done(ok)};break;
    case 'ox': document.querySelectorAll('.jm-ox button').forEach(b=>b.onclick=()=>{if(lock())return;const ok=+b.dataset.ox===+q.a;b.classList.add(ok?'ok':'ng');
      if(!ok)document.querySelector(`.jm-ox [data-ox="${q.a}"]`).classList.add('ok');done(ok)});break;
    case 'n': {let v='';const out=$('#nv');
      document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(lock())return;const k=b.dataset.key;v=k==='⌫'?v.slice(0,-1):(v+k).slice(0,8);out.textContent=v});
      $('#nok').onclick=()=>{if(lock()||!v)return;const ok=+v===+q.a;out.classList.add(ok?'ok':'ng');if(!ok)out.insertAdjacentHTML('afterend',`<span class="jm-right-ans">${esc(q.a)}</span>`);done(ok)};break}
    case 'm': {let sel=null;const pair={};const go=$('#mok');
      const paint=()=>{document.querySelectorAll('[data-ml]').forEach(b=>{const j=+b.dataset.ml;b.classList.toggle('sel',sel===j);b.querySelector('.jm-badge').textContent=pair[j]!=null?j+1:''});
        document.querySelectorAll('[data-mr]').forEach(b=>{const r=+b.dataset.mr;const l=Object.keys(pair).find(k=>pair[k]===r);b.querySelector('.jm-badge').textContent=l!=null?+l+1:''});
        go.disabled=Object.keys(pair).length<q.pairs.length};
      document.querySelectorAll('[data-ml]').forEach(b=>b.onclick=()=>{if(lock())return;sel=+b.dataset.ml;paint()});
      document.querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>{if(lock()||sel==null)return;const r=+b.dataset.mr;for(const k in pair)if(pair[k]===r)delete pair[k];pair[sel]=r;sel=null;paint()});
      go.onclick=()=>{if(lock())return;let all=true;document.querySelectorAll('[data-ml]').forEach(b=>{const j=+b.dataset.ml,ok=pair[j]===j;all=all&&ok;b.classList.add(ok?'ok':'ng');b.insertAdjacentHTML('afterbegin',ok?IC.ok:IC.ng);
        if(!ok)b.insertAdjacentHTML('beforeend',`<span class="jm-right-ans">${esc(q.pairs[j][1])}</span>`)});done(all)};break}
    case 'f': $('#ff').onsubmit=e=>{e.preventDefault();if(lock())return;const ans=holes(q.p).filter((_,j)=>j%2);let all=true;
      document.querySelectorAll('[data-fi]').forEach(inp=>{const ok=inp.value.trim()===ans[+inp.dataset.fi];all=all&&ok;inp.classList.add(ok?'ok':'ng');inp.readOnly=true;if(!ok)inp.insertAdjacentHTML('afterend',`<span class="jm-right-ans">${esc(ans[+inp.dataset.fi])}</span>`)});done(all)};break;
    case 'card': $('#cd').onclick=()=>{$('#cd').classList.toggle('back');$('#cb').hidden=false};
      document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{if(lock())return;$('#cb').hidden=true;done(b.dataset.cd==='1')});break;
    case 'k': $('#kf').onsubmit=e=>{e.preventDefault();if(lock()||!$('#kt').value.trim())return;$('#kt').readOnly=true;done('k')};break;
  }
}

// プリント
function printQ(q,i){
  if(SUBJ_T[q.t])return SUBJ_T[q.t].print(q,i);
  const box=w=>`<span class="jm-p-box" style="min-width:${w}px"></span>`;
  switch(q.t){
    case 'c': return `${esc(q.p)}<br><span class="jm-p-ch">${choices(q,i).map((c,k)=>KANA[k]+' '+esc(c)).join('　')}</span>　（${box(36)}）`;
    case 'w': return `${esc(q.p)}${box(88)}`;
    case 'ox': return `（${box(28)}）${esc(q.p)}`;
    case 'n': return `${esc(q.p)}${box(64)}${esc(q.u||'')}`;
    case 'm': {const R=shuffle(q.pairs.map((_,j)=>j),i+3);return `${esc(q.p)}<div class="jm-p-m"><div>${q.pairs.map(p=>`<span>${esc(p[0])}<i>●</i></span>`).join('')}</div><div>${R.map(j=>`<span><i>●</i>${esc(q.pairs[j][1])}</span>`).join('')}</div></div>`}
    case 'f': return holes(q.p).map((s,j)=>j%2?`（${box(Math.max(3,s.length)*14)}）`:esc(s)).join('');
    case 'card': return `<div class="jm-p-card"><span>${esc(q.p)}</span><span>${esc(q.a)}</span></div>`;
    case 'k': return `${esc(q.p)}<div class="jm-p-lines"><i></i><i></i><i></i></div>`;
  }
}

// 作る画面の欄

  switch(q.t){
    case 'c': return inp('問題','p',q.p)+inp('答え','a',q.a,'jm-right')+`<div class="jm-field"><label>ちがう答え</label><div class="jm-ws">${q.w.map((w,k)=>`<input aria-label="ちがう答え${k+1}" data-path="w.${k}" value="${esc(w)}">`).join('')}</div></div>`;
    case 'w': return inp('問題','p',q.p)+inp('答え','a',q.a,'jm-right');

    case 'm': return inp('問題','p',q.p)+`<div class="jm-field"><label>くみ</label>${q.pairs.map((p,j)=>`<div class="jm-mrow"><input aria-label="左${j+1}" data-path="pairs.${j}.0" value="${esc(p[0])}"><span aria-hidden="true">⟷</span><input aria-label="右${j+1}" data-path="pairs.${j}.1" value="${esc(p[1])}"></div>`).join('')}
      <button type="button" class="jm-btn jm-btn-s" data-addpair style="align-self:flex-start">${IC.plus}くみ</button></div>`;

    case 'card': return inp('おもて','p',q.p)+inp('うら','a',q.a);

const ryoiki=u=>{const m=(u.h.match(/（(.*)）/)||[])[1]||'';const r=[];if(/読/.test(m))r.push('読む');if(/書/.test(m))r.push('書く');if(/話・聞/.test(m))r.push('話す・聞く');if(/知・技/.test(m))r.push('言葉');return r};
const jikan=u=>(u.h.match(/(\d+)時間/)||[])[1]||'';
function keiRow(u){const r=ryoiki(u),t=u.t+u.head;const R=YS_KEI.kokugo.rows,f=n=>R.find(x=>x.n===n);
  if(/漢字|かん字|カンジー|熟語/.test(t))return f('漢字');
  if(r.includes('読む'))return /筆者|説明|要約|事例|資料|ずかん|くらべ|大事なことば/.test(t)?f('読む（説明文）'):f('読む（物語）');
  if(r.includes('書く'))return f('書く');if(r.includes('話す・聞く'))return f('話す・聞く');
  if(/古典|狂言|御伽草子|文字文化|仮名/.test(t))return f('伝統・書写');return f('言葉のきまり')}
function unitApps(u){const t=u.t,ids=[];
  if(/漢字|かん字|カンジー|熟語/.test(t))ids.push('torehan','choii','kanji');
  if(/鳥獣戯画/.test(t))ids.push('choju');if(/やまなし/.test(t))ids.push('yamanashi');if(/話し言葉と書き言葉/.test(t))ids.push('hanashi');
  if(/短歌|俳句|詩/.test(t)||(ryoiki(u).includes('書く')&&+jikan(u)>=4))ids.push('kakkun');
  if(/ことば|言葉|語/.test(t)&&ryoiki(u).join()==='言葉')ids.push('jiten');
  return [...new Set(ids)].filter(wk)}
const bookOf=g=>{const b=YS_BOOK.kokugo[g]||[];return b.find(x=>x[0]==='下')||b[0]};

function mathApps(m){const t=m.title,g=m.g,ids=[];

  if(/角柱|円柱/.test(t)&&g>=5)ids.push('block');
  if(/円|三角形|四角形|面積|多角形/.test(t)&&g>=5)ids.push('zukei');
  if(/ひきざん|たしざん|かけ算|九九/.test(t))ids.push('tower');
  return [...new Set(ids)].filter(wk)}

function jmDraftValid(m){
  if(!m||typeof m.title!=='string'||m.title.length>200||!Number.isInteger(m.g)||m.g<1||m.g>6||typeof m.s!=='string'||!Array.isArray(m.qs)||m.qs.length>200)return false;

    (!['c'].includes(q.t)||Array.isArray(q.w)&&q.w.length<=10&&q.w.every(v=>typeof v==='string'))&&
    (q.t!=='m'||Array.isArray(q.pairs)&&q.pairs.length<=30&&q.pairs.every(p=>Array.isArray(p)&&p.length===2&&p.every(v=>typeof v==='string')))&&
    (q.t!=='map'||PREFS.includes(q.a))&&
    (q.t!=='frac'||Number.isInteger(q.d)&&q.d>=2&&q.d<=20)&&
    (q.t!=='clock'||Number.isFinite(q.h)&&q.h>=0&&q.h<=12&&Number.isFinite(q.m)&&q.m>=0&&q.m<60)&&
    (q.t!=='ten'||Number.isFinite(q.x)&&Number.isFinite(q.y)&&q.x>=0&&q.x<=20&&q.y>=0&&q.y<=20)&&
    (q.t!=='nl'||['from','to','unit','lab'].every(k=>Number.isFinite(q[k]))&&q.to>q.from&&q.unit>0&&(q.to-q.from)/q.unit<=200));
}

    if(text!==jmShelfLast){localStorage.setItem(JM_SHELF_KEY,text);jmShelfLast=text}jmShelfNotice('');return true;

// 問題追加とGeminiで共通の候補。教材の内容は変更しない。
function jmTypeChoices(m){
 if(m?.creationMode==='free')return Object.keys(TYPES);
 const title=m?.unitTitle||m?.title||'',subject=m?.s||'';
 if(subject==='算数'&&/三角形|四角形|多角形|円柱|角柱|立体|形|面積|体積/.test(title))return ['k','c'];
 if(subject==='算数'&&/グラフ|表|資料|データ|比例/.test(title))return ['k','n','c'];
 if(subject==='国語'){
  if(/漢字|文字|ローマ字|ことば|言葉|熟語/.test(title))return ['w','c','f'];
  const unit=UNITS.find(r=>r.s===subject&&r.g===m.g&&r.n===title);
  const areas=unit?ryoiki(uLike(unit)):[];
  if(areas.includes('書く')||/日本文化|紹介|作文|意見|提案/.test(title))return ['k','w','card'];
  if(areas.some(x=>x.includes('話す')||x.includes('聞く')))return ['k','card','w'];
  return ['k','c','w'];
 }
 if(subject==='算数'){
  if(/分数/.test(title))return ['frac','n','k'];
  if(/時こく|時刻|時計|時間/.test(title))return ['clock','n','k'];
  if(/数直線|小数|大きな数/.test(title))return ['nl','n','k'];
  if(m.g<=2&&/たし|ひき|あわせ|のこり/.test(title))return ['ten','n','k'];
  return ['n','k','c'];
 }
 if(subject==='社会')return /地図|都道府県|日本の国土/.test(title)?['map','c','k']:['k','c','m'];
 if(subject==='体育'||/道徳|特活/.test(subject))return ['k','card','c'];
 return ['k','c','w'];
}
function jmTypePicker(m,attribute,selected){
 const first=jmTypeChoices(m);
 const button=k=>`<button type="button" class="jm-type" ${attribute}="${k}"${selected?` aria-pressed="${k===selected}"`:''}><span class="jm-type-i" aria-hidden="true">${TYPES[k].ic}</span><span>${TYPES[k].n}</span></button>`;
 return `<div class="jm-types" role="group" aria-label="${m?.creationMode==='free'?'問題の形':'単元に合う問題の形'}">${first.map(button).join('')}</div>`;
}

// 最初の問いは、学年・領域に合う下書き。既存の問題は書き換えない。
function jmUnitMaterial(r,use='lesson'){
 const m={g:r.g,s:r.s,title:r.n,unitTitle:r.n,creationMode:'unit',learningGoal:r.goal||'',use,qs:[]};
 const choices=jmTypeChoices(m),low=r.g<=2,t=r.n;let prompt;
 if(r.s==='国語'){
  if(/日本文化|紹介/.test(t))prompt='紹介したいもののよさを、理由や例をあげて書きましょう。';
  else if(/漢字|文字|ローマ字|熟語/.test(t)){m.qs=[{t:'w',p:'学習した言葉の読み方を書きましょう。',a:''}];return m}
  else{const areas=ryoiki(uLike(r));prompt=areas.includes('書く')?'だれに、何を伝えたいですか。伝えたいことと、その理由を書きましょう。':areas.some(x=>x.includes('話す')||x.includes('聞く'))?'友達の話を聞いて、考えが広がったことを書きましょう。':low?'おはなしを よんで、こころに のこった ところを かきましょう。':'心に残った言葉を取り上げ、その言葉から考えたことを書きましょう。'}
 }else if(r.s==='算数')prompt=low?'どのように かんがえましたか。えや ことばで かきましょう。':/形|面積|体積|円|角/.test(t)?'図のどこに注目しましたか。使った性質と考え方を説明しましょう。':'答えを求める考え方を、式と理由を結び付けて説明しましょう。';
 else if(r.s==='体育')prompt='試した動きと、そのときに気付いたことを書きましょう。';
 else prompt='資料や活動から分かったことと、その理由を書きましょう。';
 if(use==='morning')prompt=low?'きょうの がくしゅうで おぼえている ことを 一つ かきましょう。':'前の学習で大切だと思ったことを一つ、理由とともに書きましょう。';
 m.qs=[{t:choices.includes('k')?'k':choices[0],p:prompt}];return m;
}

 document.querySelectorAll('[data-external-open]').forEach(b=>b.onclick=()=>{const url=jmSafeExternal(document.querySelector(`[data-external="${b.dataset.externalOpen}"]`).value);if(url)window.open(url,'_blank','noopener,noreferrer');else $('#jm-external-status').textContent='https:/\/から始まるリンクを入れてください'});
 $('#jm-external-form').onsubmit=e=>{e.preventDefault();const next={...links};for(const input of document.querySelectorAll('[data-external]')){const value=input.value.trim();if(value&&!jmSafeExternal(value)){$('#jm-external-status').textContent='https:/\/から始まるリンクを入れてください';return}next[input.dataset.external]=value}try{localStorage.setItem(JM_EXTERNAL_KEY,JSON.stringify(next));links=next;$('#jm-external-status').textContent='この端末に保存しました'}catch(e){$('#jm-external-status').textContent='保存できませんでした'}};
 if(app)$('#jm-practice-copy').onclick=async()=>{const text=`アプリ：${app.name}\nアプリID：${app.id}\n学年：\n単元：\n使った場面：\n子どもの反応（個人名は書かない）：\n次に工夫したいこと：`;try{await navigator.clipboard.writeText(text);$('#jm-external-status').textContent='実践メモのひな形をコピーしました'}catch(e){$('#jm-external-status').innerHTML=`<textarea class="jm-ta" aria-label="コピーする実践メモ" readonly>${esc(text)}</textarea>`}};
}

function kidStart(fresh){S.kid={m:S.cur||LIB[0],i:0,marks:[],lock:false,me:fresh?null:{g:6,k:2,b:12,sei:'中村',mei:'さくら'}};S.kid.me?kidDraw():nameForm()}

function nameForm(){

  const seg=(key,n,unit)=>`<div class="jm-seg jm-nf-seg" role="group" aria-label="${unit}">${Array.from({length:n},(_,i)=>`<button type="button" data-nf="${key}" data-v="${i+1}" aria-pressed="${f[key]===i+1}">${i+1}${unit}</button>`).join('')}</div>`;
  const ready=f.g&&f.k&&f.b&&f.sei.trim()&&f.mei.trim();
  $('#layer').innerHTML=`<div class="jm-kidfull"><div class="jm-kidtop"><span>${esc(S.kid.m.title)}</span></div>
   <form class="jm-kid jm-nf" id="nf" autocomplete="off">

    <button class="jm-ic jm-nf-go" id="nfgo" aria-label="これで始める" ${ready?'':'disabled'}>${IC.next}</button>
   </form></div>`;
  const chk=()=>{f.sei=$('#sei').value;f.mei=$('#mei').value;$('#nfgo').disabled=!(f.g&&f.k&&f.b&&f.sei.trim()&&f.mei.trim())};
  $('#sei').oninput=chk;$('#mei').oninput=chk;
  $('#nf').onclick=e=>{const b=e.target.closest('[data-nf]');if(!b)return;

    else{f[b.dataset.nf]=+b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}
    chk()};
  $('#nf').onsubmit=e=>{e.preventDefault();if($('#nfgo').disabled)return;S.kid.me={g:f.g,k:f.k,b:f.b,sei:f.sei.trim(),mei:f.mei.trim()};kidDraw()};
}
function kidDraw(){
  const k=S.kid,m=k.m;
  if(k.i>=m.qs.length){
    const mk={true:['ok','○','正しい'],false:['ng','△','もう一度'],k:['kk','✎','書いた']};
    $('#layer').innerHTML=`<div class="jm-kidfull"><div class="jm-kid"><div class="jm-done"><div class="jm-child-finish" aria-hidden="true">${IC.ok}</div><div class="jm-big">おつかれさま！</div><div class="jm-marks">${k.marks.map((r,i)=>{const x=mk[r];return `<span class="${x[0]}" aria-label="${i+1}問目 ${x[2]}">${x[1]}</span>`}).join('')}</div><button class="jm-btn jm-btn-s" id="again">もう一度</button></div></div></div>`;
    $('#again').onclick=()=>{const me=S.kid.me;kidStart();S.kid.me=me;kidDraw()};return;
  }
  const q=m.qs[k.i], dots=m.qs.map((_,j)=>`<i class="${j===k.i?'on':j<k.i?'ok':''}"></i>`).join('');
  $('#layer').innerHTML=`<div class="jm-kidfull"><div class="jm-kidtop"><span class="jm-child-title"><span class="jm-child-book" aria-hidden="true">${jmIcon('book')}</span>${esc(m.title)}</span><span>${S.kid.me.b} ${esc(S.kid.me.sei)} ${esc(S.kid.me.mei)}</span></div><div class="jm-kid jm-t-${q.t}"><div class="jm-child-progress"><span>${k.i+1} / ${m.qs.length}</span><div class="jm-dots" aria-hidden="true">${m.qs.length<=15?dots:''}</div></div>${kidQ(q)}${kidBody(q,k.i,true)}<div id="nx" class="jm-next"></div></div></div>`;
  const done=r=>{if(k.lock)return;if(!jmCapturePreview(q,r))return;k.lock=true;k.marks.push(r);
    document.querySelectorAll('.jm-kidfull .jm-go').forEach(b=>b.hidden=true);
    $('#nx').innerHTML=`<span class="jm-child-feedback ${r===false?'jm-child-retry':''}" role="status">${r===false?'△ たしかめてみよう':r==='k'?'✓ 書けたね':'✓ できたね'}</span><button class="jm-ic jm-go" aria-label="つぎへ">${IC.next}</button>`;
    $('#nx button').onclick=()=>{k.i++;k.lock=false;kidDraw()};$('#nx button').focus()};
  document.querySelectorAll('.jm-kidfull .jm-ch button').forEach((b,i)=>b.insertAdjacentHTML('afterbegin',`<span class="jm-child-choice-number">${i+1}</span>`));
  kidBind(q,k.i,done);
}

<script>
/*JM_WORKSHEET_START*/
// 紙の決まりはここに集める。印刷時だけ組み立て、外部通信しない。
const JM_WS = {font:'"YuKyokasho", "YuKyokasho Yoko", "Yu Mincho", serif', line:9, ink:'#8f1d14'};
function jmWsText(s,vertical=false){
  const safe=esc(String(s??''));
  return vertical?safe.replace(/[0-9]{1,3}|[A-Za-z]/g,t=>`<span class="jm-wp-tcy">${t}</span>`):safe;
}
function jmWsAnswer(q,i){
  if(q.t==='c')return KANA[choices(q,i).indexOf(q.a)]+'　'+q.a;
  if(q.t==='ox')return +q.a===1?'○':'✕';
  if(q.t==='f')return holes(q.p).filter((_,j)=>j%2).join('・');
  if(q.t==='m')return q.pairs.map(p=>p.join(' → ')).join('／');
  if(q.t==='clock')return q.h+'時'+q.m+'分';
  if(q.t==='map')return fullPref(q.a);
  if(q.t==='frac')return q.d+'こに分けたうちの'+q.a+'こ';
  if(q.t==='k')return '一つの正解に決めず、考えとその理由を見る。';
  return String(q.a??'')+(q.u||'');
}
function jmWsQuestion(q,i,vertical,teacher,lines=7){
  let body;
  if(vertical&&!SUBJ_T[q.t]){
    const prompt=q.t==='f'?holes(q.p).map((s,j)=>j%2?'（　　　）':s).join(''):q.p;
    const extra=q.t==='c'?choices(q,i).map((c,j)=>KANA[j]+'　'+c).join('　／　'):q.t==='m'?q.pairs.map(p=>p[0]).join('・')+'　／　'+shuffle(q.pairs.map(p=>p[1]),i+3).join('・'):q.t==='ox'?'○か✕を書きましょう。':'';
    body=`<div class="jm-wp-prompt">${jmWsText(prompt,true)}${extra?`<p>${jmWsText(extra,true)}</p>`:''}</div><div class="jm-wp-lines">${'<i></i>'.repeat(lines)}</div>`;
  }else{
    body=q.t==='card'?`${esc(q.p)}<div class="jm-p-lines"><i></i><i></i><i></i></div>`:printQ(q,i);
  }
  return `<article class="jm-wp-q${SUBJ_T[q.t]?' jm-wp-diagram':''}"><b class="jm-wp-no">${i+1}</b><div class="jm-wp-content">${body}</div>${teacher?`<div class="jm-wp-answer">${q.t==='k'?'見るところ':'答え'}　${jmWsText(jmWsAnswer(q,i),vertical)}</div>`:''}</article>`;
}
function jmWsDoc(m,{teacher=false,size=m.s==='国語'?'B4':'A4',lines=null}={}){
  const vertical=m.s==='国語', large=size==='B4';
  const lineCount=[4,5,7,10].includes(lines)?lines:(large?7:5);
  const w=vertical?(large?364:297):(large?257:210),h=vertical?(large?257:210):(large?364:297);
  const shared=document.querySelector('style').textContent;
  const title=jmWsText(m.title,vertical);
  const header=()=>`<header class="jm-wp-header"><h1>${title}</h1><div>${teacher?'先生用・朱書き':`${jmWsText(m.g,vertical)}年（<span class="jm-wp-class"></span>）組　名前（<span class="jm-wp-name"></span>）`}</div></header>`;
  return `<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(m.title)} ${teacher?'先生用':'子ども用'}</title><style>${shared}
@page{size:${w}mm ${h}mm;margin:0}
html,body{height:auto;margin:0;background:white;color:#222;font-family:${JM_WS.font};font-size:12pt;line-height:1.8}
*{box-sizing:border-box}h1{font-size:18pt;margin:0;font-weight:600}p{margin:4mm 0}
.jm-wp-page{width:${w}mm;height:${h}mm;padding:12mm;background:white;break-after:page;position:relative;overflow:visible}
.jm-wp-page:last-child{break-after:auto}.jm-wp-inner{width:100%;height:100%;display:flex;flex-direction:column;gap:5mm}
.jm-wp-header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:5mm;border-bottom:.3mm solid #777;padding-bottom:4mm}
.jm-wp-class{display:inline-block;inline-size:12mm}.jm-wp-name{display:inline-block;inline-size:45mm}
.jm-wp-items{flex:1;min-height:0;display:flex;flex-direction:column;gap:5mm}
.jm-wp-q{flex:none;display:flex;gap:3mm;position:relative;padding-bottom:4mm;border-bottom:.3mm solid #aaa;min-height:35mm;break-inside:avoid}
.jm-wp-no{font-family:system-ui,sans-serif;flex:none;font-size:12pt}.jm-wp-content{flex:1;min-width:0;overflow-wrap:anywhere}
.jm-wp-answer{color:${JM_WS.ink};font-size:11pt;flex:0 0 36mm;overflow-wrap:anywhere}
.jm-wp-footer{position:absolute;bottom:4mm;left:0;width:100%;text-align:center;font:11pt system-ui,sans-serif}
.jm-p-box{display:inline-block;min-width:25mm;min-height:9mm;border-bottom:.3mm dotted #8a94a3;vertical-align:bottom}
.jm-p-lines i{height:9mm;border-bottom:.6mm dotted #8a94a3}.jm-p-lines i:last-child{border-color:transparent}
.jm-p-jp{width:55mm}.jm-p-clock .jm-clock{width:35mm;height:35mm}.jm-p-nl{width:100%;max-width:150mm}.jm-p-tape{height:12mm}
.jm-p-ch{color:#222}.jm-p-m{gap:30mm}.jm-p-m span{min-height:9mm}.jm-wp-tcy{text-combine-upright:all;text-orientation:upright}
.jm-wp-vertical .jm-wp-inner{flex-direction:row-reverse;gap:6mm}
.jm-wp-vertical .jm-wp-header{writing-mode:vertical-rl;flex:0 0 20mm;align-items:stretch;border:0;border-left:.3mm solid #777;padding:0 0 0 3mm;justify-content:space-between;gap:5mm}
.jm-wp-vertical .jm-wp-header h1{font-size:17pt;max-height:115mm;overflow-wrap:anywhere}.jm-wp-vertical .jm-wp-header>div{font-size:11pt;white-space:nowrap}
.jm-wp-vertical .jm-wp-items{flex-direction:row-reverse;gap:0;min-width:0}
.jm-wp-vertical .jm-wp-q{width:${lineCount*JM_WS.line+37}mm;height:100%;min-height:0;flex-direction:row-reverse;border:0;border-left:.3mm solid #777;padding:0 3mm;gap:2mm}
.jm-wp-vertical .jm-wp-no{writing-mode:vertical-rl;text-combine-upright:all}
.jm-wp-vertical .jm-wp-content{display:flex;flex-direction:row-reverse;gap:3mm;min-width:0}
.jm-wp-vertical .jm-wp-prompt{writing-mode:vertical-rl;text-orientation:mixed;flex:1;min-width:0;font-size:12pt;line-height:1.8}
.jm-wp-vertical .jm-wp-prompt p{margin:0 3mm 0 0}
.jm-wp-lines{display:flex;flex-direction:row-reverse;flex:none;align-self:stretch}
.jm-wp-lines i{display:block;width:${JM_WS.line}mm;flex:0 0 ${JM_WS.line}mm;height:100%;border-left:.6mm dotted #8a94a3}
.jm-wp-lines i:last-child{border-left-color:transparent}
.jm-wp-vertical .jm-wp-answer{position:absolute;left:5mm;top:0;height:100%;width:30mm;writing-mode:vertical-rl;background:white;font-size:11pt}
.jm-wp-vertical .jm-wp-q:has(.jm-jp,.jm-clock,.jm-nl,.jm-tf,.jm-p-tape) .jm-wp-content{display:block;writing-mode:horizontal-tb}
.jm-wp-vertical .jm-wp-diagram{width:135mm;flex-direction:column}.jm-wp-vertical .jm-wp-diagram .jm-wp-content{display:block;writing-mode:horizontal-tb}.jm-wp-vertical .jm-wp-diagram .jm-wp-answer{position:static;writing-mode:horizontal-tb;width:auto;height:auto;flex:none}.jm-wp-vertical .jm-wp-diagram .jm-wp-no{writing-mode:horizontal-tb}
.jm-wp-content svg{max-width:100%}.jm-p-ch{overflow-wrap:anywhere}.jm-p-m{flex-wrap:wrap}.jm-p-lines i{display:block}
@media screen{body{background:#f5f6f8;padding:8px}.jm-wp-page{zoom:var(--jm-print-scale,1);margin:0 auto 16px;box-shadow:0 1px 5px #0002}}
@media print{body{padding:0}.jm-wp-page{zoom:1!important;margin:0;box-shadow:none}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style><body><section class="jm-wp-page ${vertical?'jm-wp-vertical':''}"><div class="jm-wp-inner">${header()}<div class="jm-wp-items">${m.qs.map((q,i)=>jmWsQuestion(q,i,vertical,teacher,lineCount)).join('')}</div></div><div class="jm-wp-footer"></div></section></body></html>`;
}
function jmWsPaginate(doc){
  const first=doc.querySelector('.jm-wp-page'),items=first.querySelector('.jm-wp-items');
  const questions=[...items.children];items.replaceChildren();let page=first,box=items;
  for(const q of questions){box.append(q);const vertical=page.classList.contains('jm-wp-vertical');
    const bounds=box.getBoundingClientRect(),item=q.getBoundingClientRect();
    if(box.children.length>1&&(vertical?item.left<bounds.left-1:item.bottom>bounds.bottom+1)){
      q.remove();page=first.cloneNode(true);page.querySelector('.jm-wp-items').replaceChildren();doc.body.append(page);box=page.querySelector('.jm-wp-items');box.append(q);
    }
  }
  const pages=[...doc.querySelectorAll('.jm-wp-page')];pages.forEach((p,i)=>p.querySelector('.jm-wp-footer').textContent=`${i+1} / ${pages.length}`);
  return [...doc.querySelectorAll('.jm-wp-q,.jm-wp-prompt,.jm-wp-answer,.jm-wp-header')].some(q=>q.scrollWidth>q.clientWidth+2||q.scrollHeight>q.clientHeight+2)||pages.some(p=>{const e=p.querySelector('.jm-wp-items');return e.scrollHeight>e.clientHeight+2||e.scrollWidth>e.clientWidth+2});
}
async function jmWorksheetCopy(m=S.cur){
  const data=m||{g:S.grade,s:S.hs,title:'ワークシート',qs:[]};
  const text=`次の教材から、子ども用と先生用のワークシートを作ってください。国語は縦書き、書く欄は等幅の薄い点線、本文は游教科書体、字は10.5pt以上。先生用の答えは赤字。問いや正答は勝手に変えず、未記入の内容は私に確認してください。紙のはみ出しとPDFのページ数を確認してください。\n\n${JSON.stringify(data,null,2)}`;
  try{await navigator.clipboard.writeText(text);toast('Claudeに渡す内容をコピーしました')}
  catch(e){$('#layer').innerHTML=`<div class="jm-veil"><div class="jm-sheet"><div class="jm-sh-head"><h2>Claudeに渡す内容</h2><button class="jm-ic" data-close aria-label="閉じる">${IC.x}</button></div><div class="jm-sh-body"><textarea class="jm-ta" id="jm-copy-manual" aria-label="コピーする内容" rows="10" readonly>${esc(text)}</textarea></div></div></div>`;$('#jm-copy-manual').select()}
}
let jmWsObserver;
function jmWorksheet(m=S.cur){
  if(!m||!m.qs.length){toast('問題を入れてください');return}
  jmWsObserver?.disconnect();
  const opts={teacher:false,size:m.s==='国語'?'B4':'A4',lines:7};
  $('#layer').innerHTML=`<div class="jm-veil"><div class="jm-sheet jm-ws-dialog" role="dialog" aria-label="ワークシート"><div class="jm-ws-toolbar"><select class="jm-sel" id="jm-ws-size" aria-label="用紙"><option>A4</option><option>B4</option></select>${m.s==='国語'?'<select class="jm-sel" id="jm-ws-lines" aria-label="書く列の数"><option value="4">4列</option><option value="7" selected>7列</option><option value="10">10列</option></select>':''}<div class="jm-seg"><button id="jm-ws-child" aria-pressed="true">子ども用</button><button id="jm-ws-teacher" aria-pressed="false">先生用</button></div><span class="jm-sp"></span><button class="jm-ic" id="jm-ws-print" aria-label="印刷・PDFに保存">${IC.print}</button><button class="jm-ic" id="jm-ws-close" aria-label="閉じる">${IC.x}</button></div><p id="jm-ws-error" role="alert" hidden></p><iframe id="jm-ws-frame" title="印刷するワークシート"></iframe></div></div>`;
  const frame=$('#jm-ws-frame'),print=$('#jm-ws-print');$('#jm-ws-size').value=opts.size;
  const draw=()=>{frame.dataset.ready='false';print.disabled=true;$('#jm-ws-error').hidden=true;frame.onload=async()=>{
    const doc=frame.contentDocument;await doc.fonts.ready;if(!frame.isConnected||frame.contentDocument!==doc)return;
    const bad=jmWsPaginate(doc);print.disabled=bad;$('#jm-ws-error').hidden=!bad;$('#jm-ws-error').textContent=bad?'紙に入りきらない問題があります。文を短くするか、B4に変えてください。':'';
    const fit=()=>{const p=doc.querySelector('.jm-wp-page');doc.documentElement.style.setProperty('--jm-print-scale',Math.min(1,(frame.clientWidth-24)/p.offsetWidth))};fit();jmWsObserver?.disconnect();jmWsObserver=new ResizeObserver(fit);jmWsObserver.observe(frame);frame.dataset.ready='true';
  };frame.srcdoc=jmWsDoc(m,opts)};
  if($('#jm-ws-lines'))$('#jm-ws-lines').onchange=e=>{opts.lines=+e.target.value;draw()};
  $('#jm-ws-size').onchange=e=>{opts.size=e.target.value;draw()};
  for(const [id,v] of [['child',false],['teacher',true]])$('#jm-ws-'+id).onclick=()=>{opts.teacher=v;$('#jm-ws-child').setAttribute('aria-pressed',!v);$('#jm-ws-teacher').setAttribute('aria-pressed',v);draw()};
  print.onclick=()=>{frame.contentWindow.focus();frame.contentWindow.print()};
  $('#jm-ws-close').onclick=()=>{jmWsObserver?.disconnect();closeSheet()};draw();
}
