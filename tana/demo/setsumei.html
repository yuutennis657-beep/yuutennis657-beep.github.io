  }

<script>
/* 授業メイト：入力の確認。学校・個人の情報は設定に置く。 */
var JM = {classes:3, maxQuestions:30, maxText:2000};
function fail_(text){throw new Error(text);}
function text_(v,max,empty){if(typeof v!=='string'||v.length>max||(!empty&&!v.trim()))fail_('入力を確かめてください。');return v.trim();}
function number_(v,min,max){if(!Number.isInteger(v)||v<min||v>max)fail_('数を確かめてください。');return v;}
function id_(v){if(typeof v!=='string'||!/^[-a-zA-Z0-9]{1,80}$/.test(v))fail_('リンクを確かめてください。');return v;}
function normalize_(s){return String(s).normalize('NFKC').trim();}
function material_(v){
 if(!v||typeof v!=='object')fail_('教材を確かめてください。');
 var m={title:text_(v.title,100),grade:number_(v.grade,1,6),subject:text_(v.subject,20),questions:[]};
 if(['国語','算数','社会','理科','体育','特活・道徳','その他'].indexOf(m.subject)<0)fail_('教科を確かめてください。');
 if(!Array.isArray(v.questions)||!v.questions.length||v.questions.length>JM.maxQuestions)fail_('問題は1〜30問です。');
 m.questions=v.questions.map(function(q){
  if(!q||['choice','written'].indexOf(q.type)<0)fail_('今回は「えらぶ」「書く」に対応しています。');
  var x={type:q.type,prompt:text_(q.prompt,JM.maxText)};
  if(q.type==='choice'){
   if(!Array.isArray(q.choices)||q.choices.length<2||q.choices.length>4)fail_('選択肢は2〜4個です。');
   x.choices=q.choices.map(function(c){return text_(c,200);});
   if(new Set(x.choices.map(normalize_)).size!==x.choices.length)fail_('選択肢を別の内容にしてください。');
   x.correct=number_(q.correct,0,x.choices.length-1);
  }return x;
 });return m;
}
function profile_(v){if(!v)fail_('学年・組・番号・名前を入れてください。');return {grade:number_(v.grade,1,6),kumi:number_(v.kumi,1,JM.classes),ban:number_(v.ban,1,99),sei:text_(v.sei,30),mei:text_(v.mei,30)};}
function publicMaterial_(m){return {title:m.title,grade:m.grade,subject:m.subject,questions:m.questions.map(function(q){var r={type:q.type,prompt:q.prompt};if(q.choices)r.choices=q.choices.slice();return r;})};}
function markAnswers_(m,a){
 if(!Array.isArray(a)||a.length!==m.questions.length)fail_('すべての問題に答えてください。');
 return m.questions.map(function(q,i){var t=text_(a[i],JM.maxText);if(q.type==='choice'&&q.choices.indexOf(t)<0)fail_('選択肢から選んでください。');return {text:t,correct:q.type==='choice'?t===q.choices[q.correct]:null};});
}

// 見本の下書き。未知の項目は落とし、描画に使う値をサーバーでも確かめる。
function mockDraft_(v){
 if(!v||typeof v!=='object')fail_('教材を確かめてください。');
 var m={title:text_(v.title,200,true),g:number_(v.g,1,6),s:text_(v.s,20),qs:[]};
 if(['国語','算数','社会','理科','体育','特活','道徳','学活','先生','特活・道徳','その他','いろいろ'].indexOf(m.s)<0)fail_('教科を確かめてください。');
 ['unitTitle','learningGoal','creationMode','use'].forEach(function(k){if(v[k]!==undefined)m[k]=text_(v[k],2000,true);});
 if(!Array.isArray(v.qs)||v.qs.length>200)fail_('問題は200問までです。');
 m.qs=v.qs.map(function(q){if(!q||['c','w','ox','n','m','f','card','map','ten','frac','clock','nl','k'].indexOf(q.t)<0)fail_('問題の形を確かめてください。');
 var x={t:q.t,p:text_(q.p,9999,true)};
 if(q.a!==undefined){if(typeof q.a==='number'){if(!isFinite(q.a))fail_('答えを確かめてください。');x.a=q.a;}else x.a=text_(q.a,9999,true);}
 if(q.u!==undefined)x.u=text_(q.u,100,true);
 if(q.t==='c'){if(!Array.isArray(q.w)||q.w.length>10)fail_('選択肢を確かめてください。');x.w=q.w.map(function(s){return text_(s,2000,true);});}
 if(q.t==='m'){if(!Array.isArray(q.pairs)||q.pairs.length>30)fail_('組み合わせを確かめてください。');x.pairs=q.pairs.map(function(p){if(!Array.isArray(p)||p.length!==2)fail_('組み合わせを確かめてください。');return p.map(function(s){return text_(s,2000,true);});});}
 if(q.t==='ox')x.a=number_(q.a,0,1);
 if(q.t==='ten'){x.x=number_(q.x,0,20);x.y=number_(q.y,0,20);if(q.op!==undefined){if(q.op!=='-'&&q.op!=='+')fail_('式を確かめてください。');x.op=q.op;}if(!/^[0-9]{1,3}$/.test(String(q.a)))fail_('答えを確かめてください。');}
 if(q.t==='frac'){x.d=number_(q.d,2,20);if(!/^[0-9]{1,3}$/.test(String(q.a)))fail_('答えを確かめてください。');}

 if(q.t==='nl'){['from','to','unit','lab'].forEach(function(k){if(typeof q[k]!=='number'||!isFinite(q[k])||Math.abs(q[k])>1e12)fail_('数直線を確かめてください。');x[k]=q[k];});if(x.to<=x.from||x.unit<=0||(x.to-x.from)/x.unit>200)fail_('数直線を確かめてください。');}
 if(q.t==='map'){if(MOCK_PREFS_.indexOf(q.a)<0)fail_('県を確かめてください。');x.mode=q.mode==='name'?'name':'where';}
 return x;});return m;
}
var MOCK_PREFS_='北海道 青森 岩手 宮城 秋田 山形 福島 茨城 栃木 群馬 埼玉 千葉 東京 神奈川 新潟 富山 石川 福井 山梨 長野 岐阜 静岡 愛知 三重 滋賀 京都 大阪 兵庫 奈良 和歌山 鳥取 島根 岡山 広島 山口 徳島 香川 愛媛 高知 福岡 佐賀 長崎 熊本 大分 宮崎 鹿児島 沖縄'.split(' ');
function deliverable_(m){if(!m.mock)return m;var d=m.mock;return material_({title:d.title,grade:d.g,subject:['特活','道徳','学活'].indexOf(d.s)>=0?'特活・道徳':d.s,questions:d.qs.map(function(q){if(q.t==='c')return {type:'choice',prompt:q.p,choices:[q.a].concat(q.w),correct:0};if(q.t==='w'||q.t==='k')return {type:'written',prompt:q.p};fail_('この形式は学校への配布にまだ対応していません。下書きは保存済みです。ワークシートで使えます。');})});}

/* 書き込みは writeRows_ だけ。ロック中に版の確認と保存を行う。 */
function config_(){var p=PropertiesService.getScriptProperties().getProperties();['JM_DB_ID','JM_ROSTER_ID','JM_ALLOWED_DOMAIN'].forEach(function(k){if(!p[k])fail_('学校の接続設定がまだありません。');});return p;}
function db_(){return SpreadsheetApp.openById(config_().JM_DB_ID);}
function sheet_(name){var s=db_().getSheetByName(name);if(!s)fail_('初期設定を実行してください。');return s;}
function writeRows_(sheet,row,values){var safe=values.map(function(r){return r.map(function(v){return typeof v==='string'&&/^[=+@-]/.test(v)?"'"+v:v;});});sheet.getRange(row,1,safe.length,safe[0].length).setValues(safe);SpreadsheetApp.flush();}
function lock_(fn){var l=LockService.getScriptLock();if(!l.tryLock(10000))fail_('混み合っています。少し待ってもう一度お試しください。');try{return fn();}finally{l.releaseLock();}}
function read_(name,key,width){var s=sheet_(name);if(s.getLastRow()<2)return null;var hit=s.getRange(2,1,s.getLastRow()-1,1).createTextFinder(key).matchEntireCell(true).useRegularExpression(false).findNext();return hit?{row:hit.getRow(),v:s.getRange(hit.getRow(),1,1,width).getValues()[0]}:null;}
function list_(name,width){var s=sheet_(name);return s.getLastRow()<2?[]:s.getRange(2,1,s.getLastRow()-1,width).getValues();}
function save_(name,key,values){var s=sheet_(name),old=read_(name,key,1);writeRows_(s,old?old.row:s.getLastRow()+1,[values]);}
function stamp_(){return new Date().toISOString();}
function hash_(s){return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,s).map(function(b){return ('0'+((b+256)%256).toString(16)).slice(-2);}).join('');}
function newId_(){return Utilities.getUuid();}

/* エディタからだけ実行。末尾 _ の関数はブラウザから呼べない。 */
function setup_(){config_();return lock_(function(){ensure_('教材',['ID','持ち主','版','名前','学年','教科','更新','本文']);ensure_('配布',['ID','持ち主','版','名前','学年','組','受付','更新','本文']);ensure_('プロフィール',['ID','本文']);return '初期設定が終わりました。';});}
function rosterColumns_(head){var h=head.map(function(x){return String(x).normalize('NFKC').replace(/\s+/g,'');});var f=function(re){return h.findIndex(function(x){return re.test(x);});};var s=f(/^姓\(ふりがな\)|^せい$/),m=f(/^名\(ふりがな\)|^めい$/);return {mail:f(/^メール|^email/i),grade:f(/^学年/),kumi:f(/^組$|^クラス/),ban:f(/^番$|^出席番号/),sei:s>=0?s:f(/^姓/),mei:m>=0?m:f(/^名/),role:f(/^役/)};}
function me_(){
 var cfg=config_(),mail=String(Session.getActiveUser().getEmail()||'').trim().toLowerCase();
 if(!mail||mail.split('@').length!==2||mail.split('@')[1]!==cfg.JM_ALLOWED_DOMAIN.toLowerCase())fail_('学校のアカウントで開いてください。');
 var cache=CacheService.getScriptCache(),key='jm-person-'+hash_(cfg.JM_ROSTER_ID+'|'+mail),raw=cache.get(key),p;
 if(raw)p=JSON.parse(raw);else{
  var sh=SpreadsheetApp.openById(cfg.JM_ROSTER_ID).getSheetByName(cfg.JM_ROSTER_TAB||'名簿');if(!sh||!sh.getLastRow())fail_('名簿が見つかりません。');
  var cols=sh.getLastColumn(),c=rosterColumns_(sh.getRange(1,1,1,cols).getValues()[0]);
  if(c.mail<0)fail_('名簿のメール列を確認してください。');
  var hit=sh.getLastRow()>1?sh.getRange(2,c.mail+1,sh.getLastRow()-1,1).createTextFinder(mail).matchCase(false).matchEntireCell(true).useRegularExpression(false).findAll():[];
  /* 同じ先生が複数行にいる名簿にも対応。役割が違う場合や児童の重複は止める。 */
  if(hit.length>1&&!hit.every(function(h){return c.role>=0&&String(sh.getRange(h.getRow(),c.role+1,1,1).getValues()[0][0]||'').normalize('NFKC').trim()==='先生';}))fail_('名簿の同じアカウントが重なっています。');
  p={role:'child',registered:false};
  if(hit.length){var row=sh.getRange(hit[0].getRow(),1,1,cols).getValues()[0],get=function(k){return c[k]>=0?String(row[c[k]]||'').normalize('NFKC').trim():'';},num=function(k){return Number(get(k).replace(/[^0-9]/g,''));};p={role:get('role')==='先生'?'teacher':'child',registered:true,grade:num('grade'),kumi:num('kumi'),ban:num('ban'),sei:get('sei'),mei:get('mei')};}
  else if(cfg.JM_ALLOW_TEACHER_PREFIX==='true'&&/^t-/.test(mail))p.role='teacher';
  cache.put(key,JSON.stringify(p),300);
 }
 p.mail=mail;return p;
}
function teacher_(){var p=me_();if(p.role!=='teacher')fail_('先生だけが使えます。');return p;}
/* 入口の門（決まりはここ1か所）。いまは名簿の「先生」と、このアプリの持ち主だけが開ける。子どもにも開くときは、スクリプトのプロパティ JM_OPEN_TO を all にする。 */
var JM_GATE_NG='授業メイトは、いまは先生だけが開けます。';
function gate_(){var p=me_();if(config_().JM_OPEN_TO==='all'||p.role==='teacher')return p;
 var own='';try{own=String(Session.getEffectiveUser().getEmail()||'').toLowerCase();}catch(e){}
 if(own&&own===p.mail)return p;fail_(JM_GATE_NG);}
function gatePage_(text){return HtmlService.createHtmlOutput('<div style="background:#fff;color:#1d1d1f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:\'BIZ UDPGothic\',\'Hiragino Sans\',sans-serif"><p style="font-size:18px;line-height:1.8;margin:0;text-align:center">'+String(text).replace(/[<>&]/g,'')+'</p></div>').setTitle('授業メイト').addMetaTag('viewport','width=device-width,initial-scale=1');}
function owner_(name,id,mail,width){var r=read_(name,id_(id),width);if(!r||r.v[1]!==mail)fail_('この教材・結果は開けません。');return r;}
function safeMe_(p){return {role:p.role,registered:p.registered,grade:p.grade||0,kumi:p.kumi||0,ban:p.ban||0,sei:p.sei||'',mei:p.mei||''};}

/* 付箋の型（みんなで集める）。お手本は絵巻ふせん。書き込みは Store.gs の writeRows_ だけ。
   付箋板：ID・持ち主・版・名前・学年・組・受付・更新・本文（中身と今の時間）
   付箋_板ID：板ごとに1枚の表（1年分たまっても、開く板の分だけ読む）。ID・板・時間・x・y・字・書いた人（メールのハッシュ）・番号・名前・共有・かくす・はがした・更新・操作 */

var FUDA_ID=/^[a-z0-9-]{1,30}$/,FUDA_LINK=/^https:\x2f\x2f[^\s]+$/;
function fudaOn_(v){return v===true||/^(TRUE|○|◯)$/i.test(String(v).trim());}

function fudaRows_(ss,name,width){var s=ss.getSheetByName(name);return !s||s.getLastRow()<2?[]:s.getRange(2,1,s.getLastRow()-1,width).getValues();}

function fuda_(){teacher_();var ss=db_();
 if(!ss.getSheetByName('アプリの札')){fudaSeed_('アプリの札',FUDA_HEAD,FUDA_SEED);}
 if(!ss.getSheetByName('単元とアプリ')){fudaSeed_('単元とアプリ',FUDA_UNIT_HEAD,FUDA_UNIT_SEED);}
 var out={cards:[],units:[],problems:[],wants:FUDA_WANT.map(function(w){return {id:w[0],name:w[1],sub:w[2]};})},known={},on={},t=function(v){return String(v==null?'':v).trim();};
 var wantOf={};FUDA_WANT.forEach(function(w){wantOf[w[1]]=w[0];});
 var bad=function(tab,i,msg){out.problems.push({tab:tab,row:i+2,msg:msg});};
 fudaRows_(ss,'アプリの札',FUDA_HEAD.length).forEach(function(r,i){var id=t(r[0]);if(!id)return;
  if(!FUDA_ID.test(id))return bad('アプリの札',i,'札の印は、半角の英小文字・数字・「-」で書いてください。');
  if(known[id])return bad('アプリの札',i,'札の印が、ほかの行と同じです。');known[id]=true;
  if(!fudaOn_(r[1]))return;
  var name=t(r[2]),place=t(r[3]),link=t(r[5]),result=t(r[7]);
  if(!name||name.length>30)return bad('アプリの札',i,'名前を30字までで書いてください。');
  if(place!=='札'&&place!=='配る')return bad('アプリの札',i,'置き場所は「札」か「配る」と書いてください。');
  if(link&&!FUDA_LINK.test(link))return bad('アプリの札',i,'リンクは https:// から始まる形で書いてください。');
  if(result&&!FUDA_LINK.test(result))return bad('アプリの札',i,'結果のリンクは https:// から始まる形で書いてください。');
  // したいこと・記録の字がちがっても、札は出す（教科の棚・単元の札は今までどおり）。その行だけ知らせる。
  var want=t(r[8]),kiroku=t(r[9]);

  if(kiroku&&FUDA_KIROKU.indexOf(kiroku)<0){bad('アプリの札',i,'記録は「'+FUDA_KIROKU.join('」「')+'」のどれか、または空にしてください。');kiroku='';}

  if(!(g>=1&&g<=6&&g%1===0))return bad('単元とアプリ',i,'学年は1〜6の数字で書いてください。');

function doGet(e){try{gate_();}catch(err){return gatePage_(err&&err.message||JM_GATE_NG);}var p=e&&e.parameter||{};var app=Object.prototype.hasOwnProperty.call(JM_APPS,p.a)&&JM_APPS[p.a];if(app){var out;if(app.tangen){var a=HtmlService.createTemplateFromFile(app.file);var tg=String(p.tangen||'');a.tangen=JSON.stringify(/^[A-Za-z0-9_-]{1,40}$/.test(tg)?tg:'');out=a.evaluate();}else out=HtmlService.createHtmlOutputFromFile(app.file);return out.setTitle(app.title).addMetaTag('viewport','width=device-width,initial-scale=1');}var t=HtmlService.createTemplateFromFile(p.s?'Story':'Index');t.route=JSON.stringify({assignment:p.k||'',result:p.r||'',board:p.b||'',story:p.s||''}).replace(/</g,'\\u003c');return t.evaluate().setTitle('授業メイト').addMetaTag('viewport','width=device-width,initial-scale=1');}
function jmApi(op,arg){arg=arg||{};gate_();switch(op){case 'boot':return boot_();case 'getMaterial':return getMaterial_(arg);case 'saveMaterial':return saveMaterial_(arg);case 'saveDraft':return saveDraft_(arg);case 'distribute':return distribute_(arg);case 'toggle':return toggle_(arg);case 'open':return open_(arg);case 'submit':return submit_(arg);case 'results':return results_(arg);case 'review':return review_(arg);case 'board':return board_(arg);case 'fuda':return fuda_();case 'ysLog':return ysLog_(arg);default:fail_('この操作は使えません。');}}
function boot_(){var p=me_(),out={me:safeMe_(p),classes:JM.classes,url:ScriptApp.getService().getUrl()||'',namedEnabled:config_().JM_NAMED_COLLECTION==='true'};

  out.materials=list_('教材',7).filter(function(r){return r[1]===p.mail;}).map(function(r){return {id:r[0],rev:r[2],title:r[3],grade:r[4],subject:r[5],updated:r[6]};});
  out.assignments=list_('配布',8).filter(function(r){return r[1]===p.mail;}).map(function(r){return assignmentMeta_(r);});
 }return out;}
function assignmentMeta_(r){return {id:r[0],rev:r[2],title:r[3],grade:r[4],kumi:r[5],on:r[6],updated:r[7]};}
function getMaterial_(a){var p=teacher_(),r=owner_('教材',a.id,p.mail,8);return {id:r.v[0],rev:r.v[2],material:JSON.parse(r.v[7])};}

function distribute_(a){var p=teacher_(),id=id_(a.id),g=number_(a.grade,1,6),k=number_(a.kumi,1,JM.classes);return lock_(function(){var m=owner_('教材',a.materialId,p.mail,8),old=read_('配布',id,9);
 var snap={materialId:m.v[0],materialRev:m.v[2],material:deliverable_(JSON.parse(m.v[7])),named:config_().JM_NAMED_COLLECTION==='true'};
 if(old){var was=JSON.parse(old.v[8]);if(old.v[1]!==p.mail||was.materialId!==a.materialId||old.v[4]!==g||old.v[5]!==k)fail_('配布の保存先を確認してください。');return assignmentMeta_(old.v);}
 if(m.v[2]!==a.materialRev)fail_('教材が更新されています。開き直してください。');
 ensure_('回答_'+id,['ID','版','回答']);var row=[id,p.mail,1,m.v[3],g,k,true,stamp_(),json_(snap)];save_('配布',id,row);return assignmentMeta_(row);});}

function pupilAssignment_(a,p){if(p.role!=='child')fail_('子どものアカウントで開いてください。');var r=read_('配布',id_(a.id),9);if(!r)fail_('配布が見つかりません。');if(p.registered&&(p.grade!==r.v[4]||p.kumi!==r.v[5]))fail_('自分の学級のリンクで開いてください。');return r;}
function pupilKey_(p,id){return hash_(id+'|'+p.mail);}
function open_(a){var p=me_(),r=pupilAssignment_(a,p),snap=JSON.parse(r.v[8]),old=read_('回答_'+a.id,pupilKey_(p,a.id),3);if(!r.v[6])fail_('この教材の受付は終わりました。');var saved=read_('プロフィール',hash_(p.mail),2);return {me:safeMe_(p),profile:saved?JSON.parse(saved.v[1]):null,needsProfile:snap.named&&!p.registered,material:publicMaterial_(snap.material),submitted:!!old};}
function submit_(a){var p=me_(),token=id_(a.requestId);return lock_(function(){var r=pupilAssignment_(a,p),snap=JSON.parse(r.v[8]),key=pupilKey_(p,a.id),old=read_('回答_'+a.id,key,3);

function results_(a){var p=teacher_(),r=owner_('配布',a.id,p.mail,9);return {assignment:assignmentMeta_(r.v),material:JSON.parse(r.v[8]).material,responses:list_('回答_'+a.id,3).map(function(x){var v=JSON.parse(x[2]);delete v.requestId;return {id:x[0],rev:x[1],data:v};})};}

// 子ども：ツール → わけ → 出す。出したら「出したよ」と「直す」。見てよいときは上に「みんなの考え」の帯
function kgKid(el){const c=C(),kai=kgKai(),sent=kgMine()[kai],d=kg.draft[kai]||(kg.draft[kai]=sent?Object.assign({},sent):{t:kg.tool,s:null,m:.5,w:''}),lock=!!sent&&!kg.fix||closed(),t=d.t=lock?sent.t:(d.t||kg.tool),first=kai===2&&kgMine()[1];
 const band=kgSee(kai)?`<div class="jmkg-band"><img class="jmkg-face" src="${KG_IMG.open}" alt="">${T('みんなの考え','みんなの かんがえ')}<span class="jmkg-sp"></span><button id="jmkg-open">${T('提出箱を開く','ていしゅつばこを ひらく')}</button></div>`:'';
 el.innerHTML=`${band}<div class="jmkg-body"><div class="jmkg-card">${c.tools.length>1?`<div class="jmkg-tsel">${c.tools.map(x=>`<button data-t="${x}" aria-pressed="${x===t}" ${lock?'disabled':''}>${KG_TOOL[x]}</button>`).join('')}</div>`:`<h2>${KG_TOOL[t]}</h2>`}
  ${t==='stance'?kgStance(c,d.s,lock):kgMeter(c,d.m)}
  ${first?`<div class="jmkg-first"><b>${T('1回めの考え','1かいめの かんがえ')}</b>${esc(kgDesc(first))}　${esc(first.w)}</div>`:''}</div>
  <div class="jmkg-card"><h2>${T('わけ','わけ')}</h2><textarea class="jmkg-why" maxlength="200" placeholder="${T('どうして そう考えたのかな','どうして そう かんがえたのかな')}" ${lock?'readonly':''}>${esc(d.w)}</textarea></div></div>
  <div class="jmkg-foot">${lock?(closed()?`<span class="jmkg-wait">${T('今はしめきっています。','いまは しめきっています。')}</span>`:`<span class="jmkg-sent"><img class="jmkg-face" src="${KG_IMG.ok}" alt="">${T('出したよ','だしたよ')}</span><button id="jmkg-fix">${T('直す','なおす')}</button>`)
   :`<span class="jmkg-wait">${{A:T('先生が開くまで、友だちの考えは見えません。','せんせいが ひらくまで、ともだちの かんがえは みえません。'),B:T('出すと、友だちの考えが見られます。','だすと、ともだちの かんがえが みられます。'),D:T('先生だけが見ます。','せんせいだけが みます。')}[kgK().mieru]}</span>`}<span class="jmkg-sp"></span>${lock?'':`<button class="jmkg-go" id="jmkg-send">${T('出す','だす')}</button>`}</div>`;
 el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{kg.tool=d.t=b.dataset.t;kgDraw()});
 el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{d.s=+b.dataset.st;kgDraw()});
 const kn=el.querySelector('.jmkg-knob');if(kn&&!lock){const bar=el.querySelector('.jmkg-meter'),set=v=>{d.m=Math.round(Math.max(0,Math.min(1,v))*100)/100;kn.style.left=d.m*100+'%';kn.setAttribute('aria-valuenow',Math.round(d.m*100))};
  kn.onpointerdown=e=>{kn.setPointerCapture(e.pointerId);jms.drag=true;kn.onpointermove=ev=>{const r=bar.getBoundingClientRect();set((ev.clientX-r.left)/r.width)}};kn.onpointerup=kn.onpointercancel=()=>{kn.onpointermove=null;jms.drag=false};
  kn.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){set(d.m+(e.key==='ArrowLeft'?-.05:.05));e.preventDefault()}}}
 const ta=el.querySelector('textarea');ta.oninput=()=>{d.w=ta.value};ta.onfocus=()=>{jms.edit=true};ta.onblur=()=>{jms.edit=false};
 const s=$s('jmkg-send');if(s)s.onclick=()=>{if(t==='stance'&&d.s===null){jmsMsg(T('立場をえらんでね','たちばを えらんでね'));return}if(!d.w.trim()){jmsMsg(T('わけを書いてね','わけを かいてね'));return}kg.fix=false;kgSend()};
 const f=$s('jmkg-fix');if(f)f.onclick=()=>{kg.fix=true;kgDraw()};
 const o=$s('jmkg-open');if(o)o.onclick=()=>{kg.box=true;kgDraw()}}
// 送る：待たない。画面を先に「出したよ」にし、裏で送る。失敗は赤い帯で見せ、書いた考えは消さない
async function kgSend(){if(kg.sending)return;const kai=kgKai(),d=kg.draft[kai],ans=d.t==='stance'?{t:'stance',s:d.s,w:d.w}:{t:'meter',m:d.m,w:d.w},first=!jms.noteId,id=jms.noteId||'n-'+crypto.randomUUID();
 const mine=jmsMine();if(mine)mine.doc=Object.assign({},mine.doc,{[kai]:ans});else jms.st.board.notes.push({id,doc:{[kai]:ans},mine:true,ban:jms.st.me.ban,name:''});
 if(jms.kid){kgDraw();return}
 kg.sending=true;kgDraw();
 try{const r=await jmRPC('board',{act:'note',id:jms.id,session:jms.st.board.session,op:first?'add':'edit',noteId:id,doc:ans,x:.5,y:.5,requestId:'r-'+crypto.randomUUID(),profile:first?jms.profile||undefined:undefined});jms.noteId=id;jms.st=r}
 catch(e){if(/時間が変わり|しめきって|もうあります/.test(e.message)){jmsMsg(e.message);try{jms.st=await jmRPC('board',{act:'open',id:jms.id});jms.noteId='';jmsTakeMine()}catch(_){}}else kg.failed=true}
 finally{kg.sending=false;kgDraw()}}
// まとめ（提出箱と先生で同じもの）。人数は出さない。並びは番号でなく、ばらばら
function kgSum(tool,kai){const c=C(),list=jms.st.board.notes.map(n=>({n,a:(n.doc||{})[kai]})).filter(x=>x.a&&x.a.t===tool).sort((x,y)=>((x.n.ban*37)%31)-((y.n.ban*37)%31)),who=x=>`<b>${x.n.ban}${T('番','ばん')} ${esc(x.n.name)}</b>`;
 if(!list.length)return `<p class="jmkg-wait">${T('まだ考えが届いていません。','まだ かんがえが とどいていません。')}</p>`;
 if(tool==='stance')return `<div class="jmkg-cols">${[...c.stances.keys(),c.stances.length].map(i=>`<div class="jmkg-col"><h3><span class="jmkg-k jmkg-ks" style="background:${kgStColor(c,i)}">${kgStKey(c,i)}</span>${esc(kgStName(c,i))}</h3>${list.filter(x=>x.a.s===i).map(x=>`<div class="jmkg-fuda">${who(x)}${esc(x.a.w)}</div>`).join('')}</div>`).join('')}</div>`;
 const dots=list.map((x,j)=>`<span class="jmkg-dot" style="left:${x.a.m*100}%;top:${8+(j%5)*16}px">${esc(String(x.n.name||'').slice(0,1))}</span>`).join('');
 return `<div class="jmkg-card jmkg-fix">${kgMeter(c,0,dots)}</div><div class="jmkg-cols"><div class="jmkg-col">${list.map(x=>`<div class="jmkg-fuda">${who(x)}${esc(x.a.w)}</div>`).join('')}</div></div>`}
function kgToolTabs(c,cur,attr){return c.tools.length>1?`<span class="jmkg-seg">${c.tools.map(t=>`<button ${attr}="${t}" aria-pressed="${cur===t}">${KG_TOOL[t]}</button>`).join('')}</span>`:''}
function kgBox(el){const c=C(),t=kg.btool||c.tools[0];el.innerHTML=`<div class="jmkg-foot"><button id="jmkg-back">${T('← 自分の考えにもどる','← じぶんの かんがえに もどる')}</button>${kgToolTabs(c,t,'data-bt')}</div>${kgSum(t,kgKai())}`;
 $s('jmkg-back').onclick=()=>{kg.box=false;kgDraw()};el.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{kg.btool=b.dataset.bt;kgDraw()})}
// 先生：出した子・まだの子（名簿）、開く・2回目・見せ方。名前を押すと、その子の考え
function kgTeacher(el){const c=C(),k=kgK(),kai=k.kai,by={};jms.st.board.notes.forEach(n=>by[n.ban]=n);const roster=(jms.st.board.roster||[]).length?jms.st.board.roster:jms.st.board.notes.map(n=>({ban:n.ban,name:n.name})).sort((a,b)=>a.ban-b.ban),t=kg.btool||c.tools[0];
 el.innerHTML=`<div class="jmkg-foot"><label class="jmkg-ml">${T('友だちの考えが見えるとき','')}<select id="jmkg-mieru">${Object.keys(KG_MIERU).map(m=>`<option value="${m}" ${m===k.mieru?'selected':''}>${KG_MIERU[m]}</option>`).join('')}</select></label><span class="jmkg-sp"></span>
  ${k.mieru==='A'?(k.open[kai-1]?'<span class="jmkg-opened" id="jmkg-opened">開いています</span>':'<button class="jmkg-go" id="jmkg-kopen">開く</button>'):''}<button id="jmkg-kai2" ${kai===2?'disabled':''}>2回目をとる</button></div>
  <div class="jmkg-body"><div class="jmkg-card jmkg-left"><h2>出した子・まだの子</h2><div class="jmkg-names">${roster.map(x=>{const a=by[x.ban]&&by[x.ban].doc[kai];return `<button class="${a?'':'jmkg-mada'}" data-kid="${x.ban}">${a&&a.t==='stance'?`<span class="jmkg-k jmkg-ks" style="background:${kgStColor(c,a.s)}">${kgStKey(c,a.s)}</span>`:''}<span class="jmkg-no">${x.ban}</span>${esc(x.name)}${a?'':'（まだ）'}</button>`}).join('')}</div></div>
  <div class="jmkg-card" id="jmkg-tsum">${kg.peek?kgPeek(kg.peek):`<div class="jmkg-foot">${kgToolTabs(c,t,'data-bt')}</div>${kgSum(t,kai)}`}</div></div>`;
 $s('jmkg-mieru').onchange=e=>kgAct({op:'mieru',mieru:e.target.value});const o=$s('jmkg-kopen');if(o)o.onclick=()=>kgAct({op:'open'});$s('jmkg-kai2').onclick=()=>kgAct({op:'kai2'});
 el.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{kg.btool=b.dataset.bt;kgDraw()});el.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{kg.peek=+b.dataset.kid;kgDraw()});
 const pb=$s('jmkg-peekback');if(pb)pb.onclick=()=>{kg.peek=null;kgDraw()}}
function kgPeek(ban){const n=jms.st.board.notes.find(x=>x.ban===ban),r=(jms.st.board.roster||[]).find(x=>x.ban===ban),name=n?n.name:r?r.name:'';
 return `<h2>${ban}番 ${esc(name)}</h2>${[1,2].filter(k=>n&&n.doc[k]).map(k=>`<div class="jmkg-fuda"><b>${k}回め　${esc(kgDesc(n.doc[k]))}</b>${esc(n.doc[k].w)}</div>`).join('')||'<p class="jmkg-wait">まだ出していません。</p>'}<div><button id="jmkg-peekback">みんなのまとめにもどる</button></div>`}
async function kgAct(a){try{jms.st=await jmRPC('board',Object.assign({act:'kg',id:jms.id},a))}catch(e){jmsMsg(e.message)}kgDraw()}

jmsStart();
</script></body></html>
