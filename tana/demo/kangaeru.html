<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>カンガエルー型 見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
/* 授業メイトから配る → カンガエルーが開く、の見本。見た目はカンガエルーの茶（11-03 先生決定）。PC は 1000×570 に収める */
:root{--jmkg-ink:#22252a;--jmkg-sub:#5b636e;--jmkg-line:#d6dbe2;--jmkg-soft:#f5f7fa;--jmkg-ac:#B85300;--jmkg-ac2:#fbeee3;--jmkg-ok:#1F7A36;
 --jmkg-sA:#1D5FB0;--jmkg-sB:#1F7A36;--jmkg-sC:#B5371F;--jmkg-sD:#6B45A8;--jmkg-sQ:#5C5C66;
 --jmkg-g:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;--jmkg-m:"Klee One","Hiragino Mincho ProN",serif}
body.jmkg-blue{--jmkg-ac:#1a4fa0;--jmkg-ac2:#e8eef8}
html,body{height:100%;margin:0}#jmkg-root{height:100%}body{background:#fff;color:var(--jmkg-ink);font-family:var(--jmkg-g);font-size:15px}
*{box-sizing:border-box}[hidden]{display:none!important}
.jmkg-page{height:100%;display:flex;flex-direction:column;gap:6px;padding:8px 14px;max-width:1200px;margin:0 auto}
:is(.jmkg-page,.jmkg-sheet) button,.jmkg-page input,.jmkg-page select,.jmkg-page textarea,.jmkg-sheet button{font:inherit;color:var(--jmkg-ink)}
:is(.jmkg-page,.jmkg-sheet) button{min-height:44px;min-width:44px;border:1px solid #9aa3ad;border-radius:8px;background:#fff;padding:6px 12px;cursor:pointer;white-space:nowrap}
:is(.jmkg-page,.jmkg-sheet) button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #0066CC;outline-offset:2px}
:is(.jmkg-page,.jmkg-sheet) button.jmkg-main{background:var(--jmkg-ac);border-color:var(--jmkg-ac);color:#fff;font-weight:700}
:is(.jmkg-page,.jmkg-sheet) button[aria-pressed=true]{background:var(--jmkg-ac2);border-color:var(--jmkg-ac);color:var(--jmkg-ac);font-weight:700}
.jmkg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:46px}.jmkg-head h1{margin:0;font-size:19px}
.jmkg-seg{display:inline-flex;border:1px solid var(--jmkg-line);border-radius:10px;overflow:hidden}.jmkg-page .jmkg-seg button{border:0;border-radius:0}
.jmkg-try{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--jmkg-sub);border:1px dashed var(--jmkg-line);border-radius:10px;padding:2px 2px 2px 8px}
.jmkg-sp{flex:1}
.jmkg-face{width:40px;height:40px;object-fit:contain}
/* 授業メイトの配る画面（見本） */
.jmkg-tm{--jmkg-ac:#1a4fa0;--jmkg-ac2:#e8eef8}
.jmkg-tm .jmkg-list{flex:1;border:1px solid var(--jmkg-line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.jmkg-row{display:flex;align-items:center;gap:10px;border:1px solid var(--jmkg-line);border-radius:8px;padding:6px 8px}.jmkg-row b{flex:1}.jmkg-row small{color:var(--jmkg-sub);font-size:14px}
.jmkg-veil{position:fixed;inset:0;background:rgba(20,24,30,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.jmkg-sheet{background:#fff;border-radius:14px;width:min(640px,100%);max-height:100%;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.jmkg-sheet h2{margin:0;font-size:18px;flex:1}.jmkg-sheet label{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--jmkg-sub)}
.jmkg-sheet select,.jmkg-sheet input{min-height:44px;border:1px solid #9aa3ad;border-radius:8px;padding:0 8px;font-size:16px;color:var(--jmkg-ink);background:#fff}
.jmkg-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jmkg-mieru{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.jmkg-sheet .jmkg-mieru button{white-space:normal;text-align:left;line-height:1.3}
.jmkg-mieru small{display:block;font-weight:400;font-size:14px;color:var(--jmkg-sub)}
.jmkg-tools{font-size:14px;color:var(--jmkg-sub);margin:0}
.jmkg-raw{white-space:pre-wrap;font-size:14px;margin:0;font-family:ui-monospace,Menlo,monospace;background:var(--jmkg-soft);padding:8px;border-radius:8px}
/* カンガエルーの画面 */
.jmkg-q{display:flex;align-items:center;gap:10px}.jmkg-q p{margin:0;font-family:var(--jmkg-m);font-weight:600;font-size:22px;flex:1}
.jmkg-kai{font-size:14px;border:1px solid var(--jmkg-line);border-radius:999px;padding:2px 10px;color:var(--jmkg-sub)}
.jmkg-band{display:flex;align-items:center;gap:10px;background:var(--jmkg-ac);color:#fff;border-radius:10px;padding:4px 6px 4px 10px;font-weight:700}
.jmkg-page .jmkg-band button{background:#fff;color:var(--jmkg-ac);border-color:#fff;font-weight:700}
.jmkg-body{flex:1;min-height:0;display:flex;gap:10px}
.jmkg-card{flex:1;min-width:0;min-height:0;border:1px solid var(--jmkg-line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.jmkg-card h2{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
.jmkg-tsel{display:flex;gap:6px;flex-wrap:wrap}
.jmkg-st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
:is(.jmkg-page) .jmkg-st button{min-height:64px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;text-align:left;white-space:normal}
.jmkg-k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
:is(.jmkg-page) .jmkg-st button[aria-pressed=true]{border-width:3px}
.jmkg-meter{position:relative;height:120px;margin:4px 18px}
.jmkg-meter .bar{position:absolute;left:0;right:0;top:56px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--jmkg-sA),var(--jmkg-sC))}
.jmkg-meter .ends{position:absolute;left:-10px;right:-10px;top:78px;display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.jmkg-meter .ends span:first-child{color:var(--jmkg-sA)}.jmkg-meter .ends span:last-child{color:var(--jmkg-sC)}
.jmkg-page .jmkg-meter .knob{position:absolute;top:38px;width:44px;height:44px;border-radius:50%;border:3px solid var(--jmkg-ink);background:#fff;transform:translateX(-50%);padding:0;touch-action:none;cursor:grab}
.jmkg-meter .ask{position:absolute;left:0;right:0;top:0;text-align:center;color:var(--jmkg-sub);font-size:14px}
.jmkg-meter .dot{position:absolute;top:44px;width:30px;height:30px;border-radius:50%;transform:translateX(-50%);display:grid;place-items:center;font-size:14px;font-weight:700;background:#fff;border:2px solid var(--jmkg-sQ)}
textarea.jmkg-why{flex:1;min-height:90px;width:100%;border:1px solid #9aa3ad;border-radius:8px;padding:8px 10px;font-size:18px;resize:none;line-height:1.6}
.jmkg-first{border:1px dashed var(--jmkg-line);border-radius:8px;padding:6px 10px;font-size:15px}.jmkg-first b{color:var(--jmkg-sub);font-size:14px;display:block}
.jmkg-foot{display:flex;gap:8px;align-items:center}
.jmkg-sent{display:flex;align-items:center;gap:8px;color:var(--jmkg-ok);font-weight:700}
.jmkg-wait{color:var(--jmkg-sub);font-size:14px}
/* まとめ（提出箱・先生）。人数は出さない */
.jmkg-cols{display:flex;gap:8px;flex:1;min-height:0}
.jmkg-col{flex:1;min-width:0;border:1px solid var(--jmkg-line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.jmkg-col h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
.jmkg-fuda{border:1px solid var(--jmkg-line);border-radius:8px;padding:6px 8px;font-size:15px}.jmkg-fuda b{display:block;font-size:14px}
.jmkg-names{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.jmkg-page .jmkg-names button{padding:4px 10px;display:flex;align-items:center;gap:6px}
.jmkg-names .no{color:var(--jmkg-sub);font-size:14px}
.jmkg-names .mada{border-style:dashed;color:var(--jmkg-sub)}
.jmkg-sk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.jmkg-toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:60;background:#fff;border:1px solid #b9bec5;border-radius:12px;padding:8px 14px;font-size:14px}
@media (max-width:760px){.jmkg-body,.jmkg-cols{flex-direction:column}.jmkg-page{height:auto;min-height:100%;padding:8px 16px}.jmkg-two,.jmkg-mieru{grid-template-columns:1fr}.jmkg-st{grid-template-columns:1fr}.jmkg-q p{font-size:19px}textarea.jmkg-why{min-height:120px}}
</style></head>

 ['k-lorenzo',true,6,'ロレンゾの友達（道徳）','カンガエルー','ロレンゾの友達','あなたなら、ロレンゾにどうする？','友だちを守る｜きまりを守る','にがす｜自首をすすめる｜警察に知らせる','立場えらび｜心のメーター'],
 ['k-buranko',true,6,'ブランコ乗りとピエロ（道徳）','カンガエルー','ブランコ乗りとピエロ','あなたがピエロなら、サムをゆるせる？','ゆるせない｜ゆるせる','','心のメーター'],
 ['k-sakoku',true,6,'江戸の鎖国（社会）','カンガエルー','江戸の鎖国','鎖国は、人々にとってよかった？','よくなかった｜よかった','よかった｜よくなかった','立場えらび']];
const cut=v=>String(v||'').split(/[｜|]/).map(s=>s.trim()).filter(Boolean);
// 1行を読む（本番は Board.gs の boardRow_ と同じ場所に足す）。合わない行は理由を返す
function readRow(r){const o={id:r[0],grade:r[2],name:r[3],shape:r[4],title:r[5],q:r[6]};if(r[4]!=='カンガエルー')return o;
 const tools=cut(r[9]),st=cut(r[8]),ends=cut(r[7]);if(!tools.length)throw Error('場面に「立場えらび」か「心のメーター」を書いてください');
 tools.forEach(t=>{if(t!=='立場えらび'&&t!=='心のメーター')throw Error('ツールは「立場えらび・心のメーター」です')});
 if(tools.includes('立場えらび')&&(st.length<2||st.length>4))throw Error('段に立場を2〜4つ書いてください');
 if(tools.includes('心のメーター')&&ends.length!==2)throw Error('軸に両はしの言葉を2つ書いてください');
 return Object.assign(o,{tools,stances:st,ends})}
const UNITS=ROWS.map(readRow);
const MIERU=[['A','いっせいに開く','先生が開くまで、友だちの考えは見えない'],['B','出したら見られる','自分が出したあと、提出箱で見られる'],['D','先生だけ','子どもには見えない']];
const SC=['var(--jmkg-sA)','var(--jmkg-sC)','var(--jmkg-sB)','var(--jmkg-sD)'],KEY=['A','B','C','D'];
// ---- にせのクラス（本番は名簿） ----
const NAMES=['あおい','はると','ゆい','そうた','めい','れん','ひなた','さくら','いつき','みお','こうき','ゆうき','りこ','かいと','ゆな','はやと','あかり','たくみ','ここな','りく','ちひろ','しょう','まひろ','けんた','ひまり','だいち','のあ','そら','えま','ゆうと'];
const ME=13;
const WHY=['友だちだから、まず話を聞きたい。','正しいことを言うのも友だちだと思う。','どちらも大事で、まよう。','自分ならこうしたいと思った。','相手の気持ちを考えると、こう思う。','きまりがあるのには、わけがある。'];
function rnd(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
const S={page:'tm',unit:1,mieru:'A',blue:false,who:'ko',boards:[],b:null,kai:1,open:false,ans:{},draft:{},tool:null,box:false,toast:''};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=()=>S.b.u;
function fakeAll(){const r=rnd(7+S.kai*31),u=U(),out={};NAMES.forEach((n,i)=>{const ban=i+1;if(ban===ME||r()<.18)return;const t=u.tools[Math.floor(r()*u.tools.length)];
 out[ban]={tool:t,st:t==='立場えらび'?Math.floor(r()*(u.stances.length+1)):null,m:t==='心のメーター'?Math.round(r()*100)/100:null,why:WHY[Math.floor(r()*WHY.length)]}});return out}
function toast(t){const e=document.createElement('div');e.className='jmkg-toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function render(){document.body.classList.toggle('jmkg-blue',S.blue);(S.page==='tm'?renderTM:renderKG)()}

// ===== 授業メイト：配る =====
function renderTM(){document.title='授業メイト 見本';$('#jmkg-root').innerHTML=`<div class="jmkg-page jmkg-tm"><header class="jmkg-head"><h1>授業メイト</h1><span class="jmkg-sp"></span><button class="jmkg-main" id="jmkg-make">付箋の板を作る</button></header>
 <div class="jmkg-list">${S.boards.length?S.boards.map((b,i)=>`<div class="jmkg-row"><img class="jmkg-face" src="${IMG.icon}" alt=""><b>${esc(b.u.title)}<small>　${b.g}年${b.k}組・${esc(MIERU.find(m=>m[0]===b.mieru)[1])}</small></b><button class="jmkg-main" data-open="${i}">開く</button></div>`).join(''):'<p class="jmkg-wait">まだ配っていません。［付箋の板を作る］から、中身「ロレンゾの友達（道徳）」などを選んでください。</p>'}</div></div>`;
 $('#jmkg-make').onclick=makeSheet;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.b=S.boards[+b.dataset.open];S.page='kg';S.kai=1;S.open=false;S.ans={};S.draft={};S.tool=U().tools[0];S.all=fakeAll();S.box=false;render()})}
function makeSheet(){const L=document.createElement('div');L.className='jmkg-veil jmkg-tm';const draw=()=>{const u=UNITS[S.unit],kg=u.shape==='カンガエルー';
 L.innerHTML=`<form class="jmkg-sheet" onsubmit="return false"><div style="display:flex;align-items:center;gap:8px"><h2>付箋の板を作る</h2><button type="button" data-x>閉じる</button></div>
 <label>中身<select id="jmkg-u">${UNITS.map((x,i)=>`<option value="${i}" ${i===S.unit?'selected':''}>${x.grade}年　${esc(x.name)}（${esc(x.shape)}）</option>`).join('')}</select></label>
 <div class="jmkg-two"><label>題<input value="${esc(u.title)}"></label><label>問い<input value="${esc(u.q)}"></label></div>
 ${kg?`<p class="jmkg-tools">ツール：${esc(u.tools.join('・'))}${u.tools.length>1?'（子どもが選ぶ）':''}</p><div><span style="font-size:14px;color:var(--jmkg-sub)">友だちの考えが見えるとき</span><div class="jmkg-mieru">${MIERU.map(m=>`<button type="button" data-m="${m[0]}" aria-pressed="${S.mieru===m[0]}">${m[1]}<small>${m[2]}</small></button>`).join('')}</div></div>`:'<p class="jmkg-tools">（この中身は付箋の板です。カンガエルーの行を選ぶと、見せ方が出ます）</p>'}
 <div class="jmkg-two"><label>学年<select><option>6</option></select></label><label>組<select><option>1</option><option>2</option><option>3</option></select></label></div>
 <button type="button" data-raw>中身の表の1行を見る</button><button type="button" class="jmkg-main" data-go ${kg?'':'disabled'}>配布リンクを作る</button></form>`;
 L.querySelector('#jmkg-u').onchange=e=>{S.unit=+e.target.value;draw()};L.querySelector('[data-x]').onclick=()=>L.remove();
 L.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mieru=b.dataset.m;draw()});
 L.querySelector('[data-raw]').onclick=()=>{const r=ROWS[S.unit];L.querySelector('[data-raw]').outerHTML=`<pre class="jmkg-raw">${HEAD.map((h,i)=>h+'：'+esc(r[i])).join('\n')}</pre>`};
 L.querySelector('[data-go]').onclick=()=>{S.boards.unshift({u:UNITS[S.unit],mieru:S.mieru,g:6,k:1});L.remove();render();toast('配りました。［開く］で、カンガエルーが開きます')}};
 document.body.append(L);draw()}

// ===== カンガエルー =====
function canSee(){const m=S.b.mieru;if(m==='D')return false;if(m==='A')return S.open;return !!S.ans[S.kai]}
function renderKG(){const u=U();document.title=u.title+' カンガエルー';
 $('#jmkg-root').innerHTML=`<div class="jmkg-page"><header class="jmkg-head"><button id="jmkg-back" aria-label="授業メイトにもどる">← 授業メイト</button><img class="jmkg-face" src="${IMG.icon}" alt=""><h1>カンガエルー</h1>
 <span class="jmkg-seg" role="group" aria-label="見る人"><button data-who="ko" aria-pressed="${S.who==='ko'}">子ども</button><button data-who="te" aria-pressed="${S.who==='te'}">先生</button></span>
 </header>
 <div class="jmkg-q"><p>${esc(u.q)}</p><span class="jmkg-kai">${S.kai}回め</span></div><div id="jmkg-main" style="flex:1;min-height:0;display:flex;flex-direction:column;gap:6px"></div></div>`;
 $('#jmkg-back').onclick=()=>{S.page='tm';render()};document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{S.who=b.dataset.who;S.box=false;render()});
 (S.who==='ko'?(S.box?kidBox:kid):teacher)($('#jmkg-main'))}
function stanceBtns(u,v,dis){return `<div class="jmkg-st">${[...u.stances,'まよい中'].map((t,i)=>{const c=i<u.stances.length?SC[i]:'var(--jmkg-sQ)',k=i<u.stances.length?KEY[i]:'？';return `<button data-st="${i}" aria-pressed="${v===i}" ${dis?'disabled':''} style="${v===i?'border-color:'+c:''}"><span class="jmkg-k" style="background:${c}">${k}</span>${esc(t)}</button>`}).join('')}</div>`}
function meterH(u,v,dots){return `<div class="jmkg-meter"><div class="ask">${dots?'':'いまの考えは どのあたり？　○を動かそう'}</div><div class="bar"></div><div class="ends"><span>${esc(u.ends[0])}</span><span>${esc(u.ends[1])}</span></div>${dots||`<button class="knob" aria-label="考えの位置" role="slider" aria-valuenow="${Math.round(v*100)}" style="left:${v*100}%"></button>`}</div>`}
function kid(el){const u=U(),a=S.ans[S.kai],d=S.draft[S.kai]||(S.draft[S.kai]={st:null,m:.5,why:''}),t=S.tool,first=S.kai===2&&S.ans[1];
 const band=canSee()?`<div class="jmkg-band"><img class="jmkg-face" src="${IMG.open}" alt="">みんなの考え<span class="jmkg-sp"></span><button id="jmkg-box">提出箱を開く</button></div>`:'';
 el.innerHTML=`${band}<div class="jmkg-body"><div class="jmkg-card">${u.tools.length>1?`<div class="jmkg-tsel">${u.tools.map(x=>`<button data-t="${x}" aria-pressed="${x===t}" ${a?'disabled':''}>${x}</button>`).join('')}</div>`:`<h2>${esc(t)}</h2>`}
  ${t==='立場えらび'?stanceBtns(u,d.st,!!a):meterH(u,d.m)}
  ${first?`<div class="jmkg-first"><b>1回めの考え</b>${esc(descr(u,S.ans[1]))}　${esc(S.ans[1].why)}</div>`:''}</div>
  <div class="jmkg-card"><h2>わけ</h2><textarea class="jmkg-why" maxlength="200" placeholder="どうして そう考えたのかな" ${a?'readonly':''}>${esc(d.why)}</textarea></div></div>
  <div class="jmkg-foot">${a?`<span class="jmkg-sent"><img class="jmkg-face" src="${IMG.ok}" alt="">出したよ</span><button id="jmkg-fix">直す</button>`:`<span class="jmkg-wait">${S.b.mieru==='D'?'先生だけが見ます。':S.b.mieru==='A'?'先生が開くまで、友だちの考えは見えません。':'出すと、友だちの考えが見られます。'}</span>`}<span class="jmkg-sp"></span>${a?'':'<button class="jmkg-main" id="jmkg-send">出す</button>'}</div>`;
 el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tool=b.dataset.t;render()});
 el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{d.st=+b.dataset.st;render()});
 const k=el.querySelector('.knob');if(k&&!a){const bar=el.querySelector('.jmkg-meter');k.onpointerdown=e=>{k.setPointerCapture(e.pointerId);const mv=ev=>{const r=bar.getBoundingClientRect();d.m=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));k.style.left=d.m*100+'%'};k.onpointermove=mv;k.onpointerup=()=>{k.onpointermove=null}};
  k.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){d.m=Math.max(0,Math.min(1,d.m+(e.key==='ArrowLeft'?-.05:.05)));k.style.left=d.m*100+'%';e.preventDefault()}}}
 el.querySelector('textarea').oninput=e=>{d.why=e.target.value};
 const s=el.querySelector('#jmkg-send');if(s)s.onclick=()=>{if(t==='立場えらび'&&d.st===null){toast('立場をえらんでね');return}if(!d.why.trim()){toast('わけを書いてね');return}S.ans[S.kai]={tool:t,st:t==='立場えらび'?d.st:null,m:t==='心のメーター'?d.m:null,why:d.why.trim()};render()};
 const f=el.querySelector('#jmkg-fix');if(f)f.onclick=()=>{delete S.ans[S.kai];render()};
 const bx=el.querySelector('#jmkg-box');if(bx)bx.onclick=()=>{S.box=true;render()}}
const descr=(u,a)=>a.tool==='立場えらび'?(a.st<u.stances.length?KEY[a.st]+' '+u.stances[a.st]:'？ まよい中'):'メーター：'+(a.m<.4?u.ends[0]+'より':a.m>.6?u.ends[1]+'より':'まん中あたり');
function everyone(){const all=Object.assign({},S.all);if(S.ans[S.kai])all[ME]=S.ans[S.kai];return all}
// まとめ（提出箱とテレビ・先生で同じもの）。人数は出さない。並びはばらばら
function summary(tool,names){const u=U(),all=everyone(),keys=Object.keys(all).map(Number).filter(b=>all[b].tool===tool).sort((a,b)=>((a*37)%31)-((b*37)%31));
 if(tool==='立場えらび')return `<div class="jmkg-cols">${[...u.stances,'まよい中'].map((t,i)=>{const c=i<u.stances.length?SC[i]:'var(--jmkg-sQ)';return `<div class="jmkg-col"><h3><span class="jmkg-k" style="background:${c};width:26px;height:26px;font-size:14px">${i<u.stances.length?KEY[i]:'？'}</span>${esc(t)}</h3>${keys.filter(b=>all[b].st===i).map(b=>`<div class="jmkg-fuda"><b>${b}番 ${esc(NAMES[b-1])}</b>${esc(all[b].why)}</div>`).join('')}</div>`}).join('')}</div>`;
 const dots=keys.map((b,j)=>`<span class="dot" style="left:${all[b].m*100}%;top:${10+(j%5)*18}px" title="${esc(NAMES[b-1])}">${names?esc(NAMES[b-1].slice(0,1)):''}</span>`).join('');
 return `<div class="jmkg-card" style="flex:none">${meterH(u,0,dots||' ')}</div><div class="jmkg-cols"><div class="jmkg-col">${keys.map(b=>`<div class="jmkg-fuda"><b>${b}番 ${esc(NAMES[b-1])}</b>${esc(all[b].why)}</div>`).join('')}</div></div>`}
function kidBox(el){const u=U();el.innerHTML=`<div class="jmkg-foot"><button id="jmkg-close">← 自分の考えにもどる</button>${u.tools.length>1?`<span class="jmkg-seg">${u.tools.map(t=>`<button data-bt="${t}" aria-pressed="${(S.btool||u.tools[0])===t}">${t}</button>`).join('')}</span>`:''}</div>${summary(S.btool||u.tools[0],true)}`;
 el.querySelector('#jmkg-close').onclick=()=>{S.box=false;render()};el.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{S.btool=b.dataset.bt;render()})}
function teacher(el){const u=U(),all=everyone();el.innerHTML=`<div class="jmkg-foot"><span class="jmkg-wait">${esc(MIERU.find(m=>m[0]===S.b.mieru)[1])}</span><span class="jmkg-sp"></span>
 ${S.b.mieru==='A'?`<button class="jmkg-main" id="jmkg-open" ${S.open?'disabled':''}>${S.open?'開いています':'開く'}</button>`:''}<button id="jmkg-kai2" ${S.kai===2?'disabled':''}>2回目をとる</button></div>
 <div class="jmkg-body"><div class="jmkg-card" style="flex:0 0 46%"><h2>出した子・まだの子</h2><div class="jmkg-names">${NAMES.map((n,i)=>{const a=all[i+1];const k=a&&a.tool==='立場えらび'?`<span class="jmkg-sk" style="background:${a.st<u.stances.length?SC[a.st]:'var(--jmkg-sQ)'}">${a.st<u.stances.length?KEY[a.st]:'？'}</span>`:'';return `<button class="${a?'':'mada'}" data-kid="${i+1}" title="${a?'出した':'まだ'}">${k}<span class="no">${i+1}</span>${esc(n)}${a?'':'（まだ）'}</button>`}).join('')}</div></div>
 <div class="jmkg-card" id="jmkg-tsum">${summary(u.tools[0],true)}</div></div>`;
 const o=el.querySelector('#jmkg-open');if(o)o.onclick=()=>{S.open=true;render();toast('開きました。子どもの画面に「みんなの考え」が出ます')};
 el.querySelector('#jmkg-kai2').onclick=()=>{S.kai=2;S.open=false;S.all=fakeAll();S.tool=(S.ans[1]||{}).tool||u.tools[0];render();toast('2回目をとります。子どもの画面に1回めの考えが出ます')};
 el.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{const a=all[+b.dataset.kid],n=NAMES[+b.dataset.kid-1];$('#jmkg-tsum').innerHTML=`<h2>${b.dataset.kid}番 ${esc(n)}</h2>${a?`<div class="jmkg-fuda"><b>${esc(descr(u,a))}</b>${esc(a.why)}</div>`:'<p class="jmkg-wait">まだ出していません。</p>'}<button id="jmkg-sumb">みんなのまとめにもどる</button>`;$('#jmkg-sumb').onclick=()=>render()})}
render();
</script>
</body></html>
