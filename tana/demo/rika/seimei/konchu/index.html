<!doctype html>
<html lang="ja">
<head><script>window.RL_HOME_URL="../../seimei.html";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>こん虫に なろう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 理科ラボ 生命 見本 v0.1（2026-11-07）3年 こん虫の 体。カメラに うつる 自分に 頭・むね・はら・あし6本を かさねる */
:root{/* 生命の 部屋の 色（理科ラボで 名前を そろえる） */--rl-bg:#ffffff;--rl-ink:#1f2937;--rl-accent:#23784a;--rl-accent2:#a6d785;--rl-soft:#eaf6ec;
  --rs-ink:var(--rl-ink);--rs-sub:#4b5563;--rs-line:#d1d5db;--rs-btn:var(--rl-soft);--rs-acc:#1d4ed8;--rs-ok:var(--rl-accent);--rs-ng:#b45309}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--rl-bg);color:var(--rs-ink);font-family:"BIZ UDPGothic",sans-serif;font-size:16px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.rs-app{display:grid;grid-template-rows:auto 1fr;gap:8px;height:100vh;height:100dvh;padding:8px 12px 12px}
.rs-top{display:flex;align-items:center;gap:8px;min-height:48px}
.rs-top h1{margin:0 8px 0 0;font-size:20px;white-space:nowrap}
.rs-seg{display:flex;gap:6px}
.rs-seg button{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--rs-line);background:#fff;border-radius:22px;font-size:16px;display:flex;align-items:center;gap:6px}
.rs-seg button svg{width:24px;height:24px;flex:none}
.rs-seg button{white-space:nowrap}
@media (max-width:900px){.rs-seg button{padding:0 9px}.rs-seg button svg{display:none}.rs-top h1{font-size:18px;margin-right:2px}}
@media (max-height:440px){.rs-card .rs-facts svg{display:none}.rs-card .rs-facts li{grid-template-columns:1fr;font-size:15px}.rs-card .rs-facts b{font-size:15px}}
.rs-look{margin-left:auto}
.rs-seg button[aria-pressed="true"]{border:2px solid var(--rl-accent);color:var(--rl-accent);font-weight:700;background:var(--rl-soft)}
.rs-main{display:grid;grid-template-columns:1fr 280px;gap:10px;min-height:0}
.rs-left{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.rs-stage{position:relative;border-radius:12px;overflow:hidden;background:var(--rl-soft);width:400px;height:300px}
.rs-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.rs-veil{position:absolute;inset:0;background:rgba(255,255,255,.3)}
.rs-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.rs-msg{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:6px 16px;border-radius:20px;background:rgba(255,255,255,.94);border:1px solid var(--rs-line);font-size:16px;white-space:nowrap;pointer-events:none}
.rs-msg:empty{display:none}
.rs-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;padding:12px;text-align:center}
.rs-start>svg{width:min(220px,40%);height:auto}
.rs-start p{margin:0;font-size:18px;line-height:1.7}
.rs-big{min-height:60px;padding:0 36px;font-size:22px;font-weight:700;border-radius:30px;border:2px solid var(--rl-accent);background:var(--rl-accent);color:#fff}
.rs-big:disabled{opacity:.6}
.rs-start p.rs-hint2{font-size:15px;color:var(--rs-sub);line-height:1.4}
.rs-gos{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.rs-big{display:inline-flex;align-items:center;gap:8px}.rs-big svg{width:28px;height:28px;flex:none}.rs-big.rs-sub{background:#fff;color:var(--rl-accent)}
.rs-err{color:#b91c1c;max-width:86%;font-size:16px}
.rs-start[hidden],.rs-err[hidden]{display:none!important}
.rs-side{display:flex;flex-direction:column;gap:8px;min-height:0}
.rs-card{border:1px solid var(--rs-line);border-radius:20px 6px 20px 6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.rs-card h2{margin:0;font-size:20px}
.rs-facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.rs-facts li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;font-size:16px;line-height:1.45}
.rs-facts li svg{width:26px;height:26px;flex:none}
.rs-facts b{font-size:17px;display:block}
.rs-is{font-size:16px;font-weight:700;padding:4px 10px;border-radius:10px;align-self:flex-start}
.rs-is[data-k="yes"]{color:var(--rs-ok);background:#ecfdf3;border:1px solid #86c79a}
.rs-is[data-k="no"]{color:var(--rs-ng);background:#fffaf2;border:1px solid #f3c48a}
.rs-touch{font-size:16px;line-height:1.6;min-height:3.2em}
.rs-touch b{font-size:18px}
.rs-card{overflow:hidden}
.rs-real{position:absolute;left:8px;bottom:8px;width:24%;margin:0;display:flex;flex-direction:column;align-items:center;gap:0;background:rgba(255,255,255,.94);border:1px solid var(--rs-line);border-radius:16px 4px 16px 4px;padding:4px 4px 2px;pointer-events:none}
.rs-real img{width:100%;aspect-ratio:1/1;object-fit:contain}
.rs-real figcaption{font-size:14px;line-height:1.3;color:var(--rs-sub);text-align:center}
.rs-real[hidden]{display:none!important}
@media (max-height:440px){.rs-main{grid-template-columns:1fr 250px}.rs-card{padding:6px 10px;gap:4px}.rs-card h2{font-size:18px}.rs-facts li{line-height:1.3;gap:6px}.rs-facts b{display:inline;margin-right:.4em;font-size:16px}.rs-touch{min-height:0;line-height:1.4}.rs-top{min-height:44px}}
</style>
</head>
<body>
<div class="rs-app">
  <div class="rs-top">
    <h1>こん虫に なろう</h1>
    <div class="rs-seg" id="rsSeg">
      <button type="button" data-m="insect" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5.5" r="2.3"/><ellipse cx="12" cy="10" rx="2.6" ry="2"/><ellipse cx="12" cy="16.5" rx="3.2" ry="4.3"/><path d="M10.5 3.6 8.6 1.6M13.5 3.6l1.9-2M9.6 9.4 6 8M9.4 10.6 5.6 12.4M9.7 11.6 7 15.6M14.4 9.4 18 8M14.6 10.6l3.8 1.8M14.3 11.6l2.7 4"/></svg>こん虫</button>
      <button type="button" data-m="spider" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="8" rx="3" ry="2.8"/><ellipse cx="12" cy="15.5" rx="3.8" ry="4.3"/><path d="M9.4 6.6 5 3.5M9.2 8 4 7M9.2 9.2 4 11.5M9.6 10.2 5.5 15M14.6 6.6 19 3.5M14.8 8 20 7M14.8 9.2l5.2 2.3M14.4 10.2l4.1 4.8"/></svg>クモ</button>
      <button type="button" data-m="pill" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 4h8M7 7h10M6.5 10h11M6.5 13h11M7 16h10M8 19h8"/><path d="M8 4c-2 3-2.5 12 0 15M16 4c2 3 2.5 12 0 15"/><path d="M10.5 4 9 1.5M13.5 4 15 1.5"/></svg>ダンゴムシ</button>
    </div>
    <div class="rs-seg rs-look" id="rsLook">
      <button type="button" data-l="easy" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="6" r="3"/><ellipse cx="12" cy="12.5" rx="4" ry="2.5"/><ellipse cx="12" cy="18.5" rx="4" ry="3.5"/></svg>かんたん</button>
      <button type="button" data-l="real" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 4 3-3 4 5z"/><circle cx="8" cy="7" r="2"/><rect x="2" y="3" width="20" height="18" rx="3"/></svg>リアル</button>
    </div>
  </div>
  <div class="rs-main">
    <div class="rs-left" id="rsLeft">
      <div class="rs-stage" id="rsStage">
        <video id="rsVideo" playsinline muted></video>
        <div class="rs-veil"></div>
        <canvas id="rsCanvas"></canvas>
        <div class="rs-msg" id="rsMsg"></div>
        <figure class="rs-real" id="rsRealBox"><img id="rsReal" src="img/insect.webp" alt="" onerror="document.getElementById('rsRealBox').hidden=true"><figcaption id="rsRealCap">本物の 体</figcaption></figure>
        <div class="rs-start" id="rsStart">
          <svg viewBox="0 0 120 120" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <circle cx="60" cy="26" r="11" fill="#dbeafe"/><ellipse cx="60" cy="48" rx="14" ry="10" fill="#dcfce7"/><ellipse cx="60" cy="84" rx="17" ry="24" fill="#ffedd5"/>
            <path d="M54 17 44 4M66 17l10-13M46 44 26 36M46 50 24 58M48 54 34 78M74 44l20-8M74 50l22 8M72 54l14 24"/>
          </svg>
          <p>カメラの まえに 立って、<br>こん虫に なってみよう。</p>
          <p class="rs-hint2">手を 上に 上げて、ボタンの 上で とめると おせるよ</p>
          <div class="rs-gos"><button class="rs-big" id="rsGo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>カメラで</button><button class="rs-big rs-sub" id="rsTap" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12V5.5a1.8 1.8 0 0 1 3.6 0V12l3.6.8a2 2 0 0 1 1.5 2.3L18 21h-8l-3.3-4.6a1.6 1.6 0 0 1 2.4-2.1L10 15"/><path d="M6.5 6.5a5.5 5.5 0 0 1 10.5-1"/></svg>ゆびで</button></div>
          <div class="rs-err" id="rsErr" hidden></div>
        </div>
      </div>
    </div>
    <div class="rs-side">
      <div class="rs-card">
        <h2 id="rsName">こん虫</h2>
        <ul class="rs-facts" id="rsFacts"></ul>
        <div class="rs-is" id="rsIs" data-k="yes"></div>
      </div>
      <div class="rs-card">
        <div class="rs-touch" id="rsTouch"></div>
      </div>
    </div>
  </div>
</div>

<script src="../_parts/rs-te.js"></script>
<script>
/* ===== きまり（体の つくり）：ここ 1か所 ===== */
const $=id=>document.getElementById(id);
const KINDS={
  insect:{name:'こん虫', parts:['頭','むね','はら'], legs:6, ant:2, is:true,
    real:['insect','本物の 体'], facts:[['体','頭・むね・はら の 3つ'],['あし','6本（ぜんぶ むねから）'],['はね','4まいが 多い（むね）'],['しょっかく','2本（頭に ある）']],
    touch:{'頭':'目・口・しょっかく が ある','むね':'あしが 6本、はねが ついている','はら':'ふしが ある。あしは ついていない'}},
  spider:{name:'クモ', real:['spider','本物の 体'], parts:['頭むね','はら'], legs:8, ant:0, is:false,
    facts:[['体','頭むね・はら の 2つ'],['あし','8本'],['しょっかく','ない']],
    touch:{'頭むね':'頭と むねが 1つに なっている。あしが 8本','はら':'あしは ついていない'}},
  pill:{name:'ダンゴムシ', real:['pill','本物の 体'], parts:['頭','ふし'], legs:14, ant:2, is:false,
    facts:[['体','たくさんの ふしに 分かれる'],['あし','14本'],['しょっかく','2本']],
    touch:{'頭':'しょっかくが ある','ふし':'体は たくさんの ふし。あしが 14本'}},
};
const FACT_ICON={
  '体':'<rect x="4" y="3" width="16" height="18" rx="8"/><path d="M5 10h14M5 15h14"/>',
  'あし':'<path d="M4 20l5-8 6 0 5 8"/><circle cx="12" cy="7" r="3"/>',
  'しょっかく':'<path d="M9 20c0-8-4-12-6-16M15 20c0-8 4-12 6-16"/>',
  'はね':'<path d="M12 8C8 2 2 4 3 9s6 5 9 1M12 8c4-6 10-4 9 1s-6 5-9 1M12 12c-3 3-7 6-8 3s3-4 8-3M12 12c3 3 7 6 8 3s-3-4-8-3"/>',
};
const rs={look:'easy', mode:'insect', src:'', L:null, touched:'', t0:performance.now()};
window.rs=rs;

function renderSide(){
  const K=KINDS[rs.mode];
  $('rsName').textContent=K.name;
  $('rsFacts').innerHTML=K.facts.map(([k,v])=>`<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${FACT_ICON[k]}</svg><span><b>${k}</b>${v}</span></li>`).join('');
  const is=$('rsIs'); is.dataset.k=K.is?'yes':'no'; is.textContent=K.is?'◯ こん虫です':'× こん虫では ない';
  [...$('rsSeg').children].forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.m===rs.mode)));
  const im=$('rsReal'); if(im && !im.src.endsWith(`img/${K.real[0]}.webp`)){ $('rsRealBox').hidden=false; im.src=`img/${K.real[0]}.webp`; }
  $('rsRealCap').textContent=K.real[1];
  showTouch();
}
function showTouch(){
  const K=KINDS[rs.mode], el=$('rsTouch');
  const html = rs.touched ? `<b>${rs.touched}</b>：${K.touch[rs.touched]}` : rs.src==='mouse' ? '体を ゆびで さわってみよう' : '自分の 体に 手で さわってみよう';
  if(el.innerHTML!==html) el.innerHTML=html;
}
function setMode(m){ rs.mode=m; rs.touched=''; renderSide(); }
$('rsSeg').onclick=e=>{ const b=e.target.closest('button'); if(b) setMode(b.dataset.m); };
function setLook(l){ rs.look=l; [...$('rsLook').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===l))); }
$('rsLook').onclick=e=>{ const b=e.target.closest('button'); if(b) setLook(b.dataset.l); };

/* ===== 大きさ（ステージは カメラと 同じ よこたて） ===== */
const cv=$('rsCanvas'), g=cv.getContext('2d');
let W=0,H=0, AR=4/3;
function fit(){
  const r=$('rsLeft').getBoundingClientRect();
  let w=r.width, h=w/AR; if(h>r.height){ h=r.height; w=h*AR; }
  const st=$('rsStage'); st.style.width=Math.floor(w)+'px'; st.style.height=Math.floor(h)+'px';
  W=Math.floor(w); H=Math.floor(h); const d=window.devicePixelRatio||1;
  cv.width=Math.round(W*d); cv.height=Math.round(H*d); g.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize',fit);
window.rsSetAR=a=>{ AR=a; fit(); };

/* ===== からだの 点（画面の 0〜1・かがみの むき）を なめらかに ===== */
const SM=0.45;
function feed(L){
  if(!L){ rs.L=null; if(rs.src==='cam'&&window.RsTe) RsTe.point(null); return; }
  if(!rs.L) rs.L=L.map(p=>({...p}));
  else L.forEach((p,i)=>{ const o=rs.L[i]; o.x+= (p.x-o.x)*SM; o.y+=(p.y-o.y)*SM; o.visibility=p.visibility; });
  if(rs.src==='cam') handPointer(L);
}
/* 手を かたより 上に 上げると、画面の しるしに なる（ボタンの 上で とめると おせる） */
function handPointer(L){
  if(!window.RsTe) return;
  const ok=i=>L[i]&&L[i].visibility>0.5, sy=Math.min(ok(11)?L[11].y:1, ok(12)?L[12].y:1);
  const up=[19,20].filter(i=>ok(i) && L[i].y<sy-0.03).sort((a,b)=>L[a].y-L[b].y);
  if(up.length) RsTe.point(L[up[0]].x, L[up[0]].y, [0.1,0.02,0.9,0.5]); else RsTe.point(null);
}
window.rsHandPointer=handPointer;
const P=i=>{ const p=rs.L&&rs.L[i]; return p&&p.visibility>0.5 ? {x:p.x*W, y:p.y*H} : null; };
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
// 体の わく：S＝かたの まん中、D＝下むき、A＝よこむき、w＝かたはば、T＝どうの 長さ
function frame(){
  const l=P(11), r=P(12); if(!l||!r) return null;
  const S=mid(l,r), w=dist(l,r); if(w<10) return null;
  const hl=P(23), hr=P(24); let Hp = hl&&hr ? mid(hl,hr) : {x:S.x, y:S.y+w*1.5};
  let T=dist(S,Hp); if(T<w*0.8){ T=w*1.5; Hp={x:S.x,y:S.y+T}; }
  const D={x:(Hp.x-S.x)/T, y:(Hp.y-S.y)/T};
  let A={x:-D.y, y:D.x}; if((r.x-l.x)*A.x+(r.y-l.y)*A.y<0) A={x:-A.x,y:-A.y};   // A は 画面の 右むき
  const e7=P(7), e8=P(8), n=P(0);
  const Hd = e7&&e8 ? mid(e7,e8) : (n||{x:S.x-D.x*w*0.6, y:S.y-D.y*w*0.6});
  const hr2 = e7&&e8 ? Math.max(dist(e7,e8)*0.62, w*0.2) : w*0.3;
  const tilt = e7&&e8 ? Math.atan2(e8.y-e7.y, e8.x-e7.x) : 0;
  return {S,D,A,w,T,Hd,hr:hr2,tilt:(e7&&e8 && (e8.x<e7.x)) ? Math.atan2(e7.y-e8.y,e7.x-e8.x) : tilt};
}
const at=(F,u,v)=>({x:F.S.x+F.D.x*u*F.T+F.A.x*v*F.w, y:F.S.y+F.D.y*u*F.T+F.A.y*v*F.w});
const ang=F=>Math.atan2(F.D.y,F.D.x)-Math.PI/2;

/* ===== 体の 部分の 形（u＝たて・かたが0 こしが1、rx・ry） ===== */
function parts(F){
  const m=rs.mode;
  if(m==='insect') return [
    {k:'頭', c:F.Hd, rx:F.hr, ry:F.hr*1.1, fill:'rgba(191,219,254,.55)', rot:F.tilt},
    {k:'むね', c:at(F,0.15,0), rx:F.w*0.5, ry:F.T*0.15, fill:'rgba(187,247,208,.6)', rot:ang(F)},
    {k:'はら', c:at(F,0.68,0), rx:F.w*0.5, ry:F.T*0.38, fill:'rgba(254,215,170,.55)', rot:ang(F), ring:5},
  ];
  if(m==='spider'){ const top=F.Hd, low=at(F,0.25,0), c=mid(top,low);
    return [
      {k:'頭むね', c, rx:F.w*0.5, ry:dist(top,low)/2+F.hr*0.9, fill:'rgba(191,219,254,.55)', rot:ang(F)},
      {k:'はら', c:at(F,0.78,0), rx:F.w*0.62, ry:F.T*0.46, fill:'rgba(254,215,170,.55)', rot:ang(F)},
    ]; }
  return [
    {k:'頭', c:F.Hd, rx:F.hr*1.05, ry:F.hr*0.85, fill:'rgba(191,219,254,.55)', rot:F.tilt},
    {k:'ふし', c:at(F,0.5,0), rx:F.w*0.6, ry:F.T*0.62, fill:'rgba(229,231,235,.6)', rot:ang(F), plates:11},
  ];
}
// あしの ねもと（体の 中の いち u・左右）。うでは いちばん 前の あし
function legRoots(F){
  const m=rs.mode;
  if(m==='insect') return [0.2,0.27];                        // 中あし・うしろあし（むねの 中）
  if(m==='spider') return [0.12,0.2,0.28];                    // 頭むねの 中
  return [0.18,0.32,0.46,0.6,0.74,0.88];                      // ふしごとに 1組
}

/* ===== リアル版：Codex で 作った 部品の 絵（img/r_*.webp・前が 上、あしは 左が つけ根） ===== */
const REAL={
  insect:{head:'r_ins_head', parts:{'むね':'r_ins_mune','はら':'r_ins_hara'}, leg:['r_ins_leg1','r_ins_leg2']},
  spider:{head:null, parts:{'頭むね':'r_spi_atamamune','はら':'r_spi_hara'}, leg:['r_spi_leg']},
  pill:{head:'r_pill_head', parts:{'ふし':'r_pill_body'}, leg:['r_pill_leg']},
};
// 頭の 絵の 中で、頭の まん中が ある 所（下から の わりあい）と、頭の はばが 絵の はばに しめる わりあい
const HEADFIT={r_ins_head:{cy:0.62, w:0.95}, r_pill_head:{cy:0.74, w:0.42}};
const RIMG={};

const INK=getComputedStyle(document.documentElement).getPropertyValue('--rl-ink').trim()||'#1f2937';

function draw(now){
  g.clearRect(0,0,W,H);

    for(const [u,v0,len,wd,open] of WG) for(const s of [-1,1]){

      g.save(); g.translate(p.c.x,p.c.y); g.rotate(p.rot); g.beginPath(); g.moveTo(-xx,yy); g.quadraticCurveTo(0,yy+p.ry*0.06,xx,yy); g.lineWidth=2; g.strokeStyle='rgba(31,41,55,.55)'; g.stroke(); g.restore(); } }

      g.save(); g.translate(p.c.x,p.c.y); g.rotate(p.rot); g.beginPath(); g.moveTo(-xx,yy); g.quadraticCurveTo(0,yy-p.ry*0.08,xx,yy); g.lineWidth=2.5; g.strokeStyle='rgba(31,41,55,.7)'; g.stroke(); g.restore(); } }

/* ===== ためし用（?test：マウスで 右の 手を うごかす。人形が 立つ） ===== */

<script type="module">
/* ===== カメラと からだの トラッキング（からだミラーと 同じ 作り） ===== */
const $=id=>document.getElementById(id);
const VER='0.10.14', video=$('rsVideo');
let pose=null, lastT=-1, modelP=null;
async function loadModel(){
  const vision=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
  const fs=await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
  const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:1});
  try{ return await vision.PoseLandmarker.createFromOptions(fs,opts('GPU')); }
  catch(e){ return await vision.PoseLandmarker.createFromOptions(fs,opts('CPU')); }
}
if(!/[?&]test/.test(location.search)){
  modelP=loadModel().catch(e=>{ modelP=null; throw e; }); modelP.catch(()=>{});
  $('rsGo').onclick=start;
}
async function start(){
  const err=$('rsErr'); err.hidden=true; $('rsGo').disabled=true; $('rsGo').textContent='じゅんびちゅう…';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ const e=new Error(); e.name='NoCamPage'; throw e; }
    const st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:960},height:{ideal:720},aspectRatio:{ideal:4/3},facingMode:'user'},audio:false});
    video.srcObject=st; await video.play();
    window.rsSetAR((video.videoWidth||4)/(video.videoHeight||3));
    pose=await (modelP||(modelP=loadModel()));
    $('rsStart').hidden=true; window.rs.src='cam';
    track(); window.rsLoop();
  }catch(e){
    $('rsGo').disabled=false; $('rsGo').textContent='もう いちど'; err.hidden=false;
    err.textContent = e&&e.name==='NoCamPage' ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : e&&(e.name==='NotFoundError'||e.name==='NotReadableError') ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : e&&e.name==='NotAllowedError' ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした（'+(e&&(e.name||e.message)||'')+'）。インターネットに つながっているか みてね。';
  }
}
function track(){
  requestAnimationFrame(track);
  if(!pose||video.readyState<2||video.currentTime===lastT) return;
  lastT=video.currentTime;
  const r=pose.detectForVideo(video,performance.now()), L=(r.landmarks||[])[0];
  window.rsFeed(L ? L.map(p=>({x:1-p.x, y:p.y, visibility:p.visibility==null?1:p.visibility})) : null);   // かがみの むきに あわせる
}
