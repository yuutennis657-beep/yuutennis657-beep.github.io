<!doctype html>
<!-- 生成物：直すときは src.html と ../kit/ を 直して python3 ../build.py（このファイルは 手で 直さない） -->
<html lang="ja">
<head><script>window.RL_HOME_URL="../../chikyu.html";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理科ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 見本 v0.3（2026-11-07 月の 形 クイズ）理科ラボ／地球。直すのは この src.html。index.html は ../rika/chikyu/build.py で 作る（手で 直さない）。部屋は TT_ROOMS に ならべる（いまは 月の 部屋 1つ。エネルギー・粒子・生命の 入口は あとで） */
:root{
  /* 理科ラボで そろえる 名前（地・字・主の色・2番目の色・うすい色）＋ 字の 2番目・線 */
  --rl-bg:#0f1b3d; --rl-ink:#f3f5ff; --rl-accent:#ffd36b; --rl-accent2:#7cc4ff; --rl-soft:#1b2a55;
  --rl-sub:#c3cbe8; --rl-line:#53639a;
  /* 月の 部屋だけの 色（ここ以外に 色は 書かない） */
  --tt-btn:var(--rl-soft); --tt-stage:#0a1330; --tt-veil:rgba(10,19,48,.35); --tt-star:#dfe6ff;
  --tt-lit:var(--rl-accent); --tt-dark:#4f5872; --tt-edge:#e8ecfa;
  --tt-sun:#ff9f43; --tt-sunfill:#ffe29a; --tt-sunink:#ffb870;
  --tt-earth:var(--rl-accent2); --tt-earthdark:#2b4a8a; --tt-orbit:#9aa6cc;
  --tt-tagbg:rgba(15,27,61,.88); --tt-person:#7d89ad; --tt-head:#22396e;
  --tt-ng:#ff9b9b; --tt-bigink:#1a1400;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--rl-bg);color:var(--rl-ink);
  font-family:"BIZ UDPGothic",sans-serif;font-size:16px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
svg.tt-i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
/* 地に 小さな 星（動かさない） */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-size:420px 380px;background-image:
  radial-gradient(1.2px 1.2px at 12% 18%,var(--tt-star) 50%,transparent 51%),radial-gradient(1px 1px at 33% 72%,var(--tt-star) 50%,transparent 51%),
  radial-gradient(1.4px 1.4px at 58% 12%,var(--tt-star) 50%,transparent 51%),radial-gradient(1px 1px at 81% 44%,var(--tt-star) 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 92% 82%,var(--tt-star) 50%,transparent 51%),radial-gradient(1px 1px at 46% 92%,var(--tt-star) 50%,transparent 51%)}
.tt-home,.tt-app{position:relative}
/* 線画の 色（SVG の 中も 変数で） */
.tt-s-ink{stroke:var(--rl-ink)} .tt-s-sun{stroke:var(--tt-sun)} .tt-f-sun{fill:var(--tt-sunfill)}
.tt-s-earth{stroke:var(--tt-earth)} .tt-f-earth{fill:var(--tt-head)} .tt-s-orbit{stroke:var(--tt-orbit)}
.tt-f-dark{fill:var(--tt-dark)} .tt-f-lit{fill:var(--tt-lit)} .tt-s-edge{stroke:var(--tt-edge)}

/* 入口（部屋を ならべる） */
.tt-home{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
.tt-home h1{margin:0;font-size:26px}
.tt-grp{font-size:18px;font-weight:700;color:var(--rl-sub)}
.tt-rooms{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.tt-room{display:flex;flex-direction:column;align-items:center;gap:8px;width:250px;min-height:180px;padding:16px;
  border:1px solid var(--rl-line);border-radius:16px;background:var(--rl-soft)}
.tt-room:hover,.tt-room:focus-visible{border-color:var(--rl-ink)}
.tt-room svg{width:96px;height:96px}
.tt-room b{font-size:20px;white-space:nowrap}
.tt-room span{font-size:15px;color:var(--rl-sub)}

/* 部屋 */
.tt-app{display:grid;grid-template-rows:auto 1fr;gap:8px;height:100vh;height:100dvh;padding:8px 12px 12px}
.tt-top{display:flex;align-items:center;gap:10px;min-height:52px}
.tt-top h2{margin:0;font-size:20px;white-space:nowrap}
.tt-sp{flex:1}
.tt-b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;
  border:1px solid var(--rl-line);background:var(--tt-btn);border-radius:12px;font-size:16px}
.tt-b[aria-pressed="true"]{background:var(--rl-bg);border:2px solid var(--rl-ink);font-weight:700}
.tt-b .tt-ck{display:none}
.tt-b[aria-pressed="true"] .tt-ck{display:block}
.tt-main{display:flex;gap:8px;min-height:0}
.tt-left{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.tt-stage{position:relative;aspect-ratio:var(--tt-ar,16/9);max-width:100%;max-height:100%;width:100%;
  border-radius:12px;overflow:hidden;background:var(--tt-stage)}
.tt-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.tt-veil{position:absolute;inset:0;background:var(--tt-veil)}
.tt-stage canvas,.tt-pn canvas{position:absolute;inset:0;width:100%;height:100%}
.tt-msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:6px 16px;border-radius:20px;
  background:var(--tt-tagbg);font-size:18px;font-weight:700;white-space:nowrap;pointer-events:none}
.tt-msg:empty{display:none}
.tt-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--rl-bg);padding:12px}
.tt-start p{margin:0;font-size:18px;text-align:center;line-height:1.7}
.tt-start svg{width:min(300px,60%);height:auto;max-height:45%}
.tt-big{min-height:60px;padding:0 36px;font-size:22px;font-weight:700;border-radius:30px;border:0;background:var(--rl-accent);color:var(--tt-bigink)}
.tt-big:disabled{opacity:.6}
.tt-gorow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tt-big.tt-big-sub{background:var(--rl-soft);color:var(--rl-ink);border:2px solid var(--rl-line)}
.tt-err{color:var(--tt-ng);font-size:16px;max-width:80%;text-align:center}
.tt-side{display:flex;flex-direction:column;gap:8px;flex:none}
.tt-pn{position:relative;flex:1;border:1px solid var(--rl-line);border-radius:12px;background:var(--rl-soft);overflow:hidden}
.tt-cap{position:absolute;left:8px;top:6px;font-size:14px;font-weight:700;color:var(--rl-sub);pointer-events:none}
.tt-name{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:22px;font-weight:700;pointer-events:none}
.tt-name ruby{ruby-align:center}
.tt-name rt{font-size:10px;font-weight:400;letter-spacing:-.05em}
/* 月の 形 クイズ：お題の 札（絵の 右上。たいようと 月の みちに 重ならない 所） */
.tt-quiz{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:34%;
  padding:8px 14px 10px;border-radius:14px;background:var(--tt-tagbg);border:1px solid var(--rl-line)}
.tt-quiz-ask{font-size:28px;font-weight:700;line-height:1.5;color:var(--rl-accent)}
.tt-quiz-ask rt{font-size:12px;font-weight:400;color:var(--rl-ink)}
.tt-quiz-sub{font-size:16px;line-height:1.4}
.tt-quiz-ok{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700}
.tt-quiz-ok svg{width:28px;height:28px;stroke:var(--rl-accent);stroke-width:3}
.tt-quiz .tt-b{min-width:96px}
</style>
</head>
<body>

<!-- 入口 -->
<div class="tt-home" id="ttHome">
  <h1>理科ラボ</h1>
  <div class="tt-grp">そらと大地</div>
  <div class="tt-rooms" id="ttRooms"></div>
</div>

<!-- 月の 部屋 -->
<div class="tt-app" id="ttTsuki" hidden>
  <div class="tt-top">
    <button class="tt-b" id="ttBack" type="button" aria-label="理科ラボの 入口へ"><svg class="tt-i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
    <h2>月に なって まわろう</h2>
    <span class="tt-sp"></span>
    <button class="tt-b" id="ttQuizBtn" type="button" aria-pressed="false"><svg class="tt-i tt-ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>クイズ</button>
    <button class="tt-b" id="ttNameBtn" type="button" aria-pressed="false"><svg class="tt-i tt-ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>月の なまえ</button>
  </div>
  <div class="tt-main" id="ttMain">
    <div class="tt-left">
      <div class="tt-stage" id="ttStage">
        <video id="ttVideo" playsinline muted></video>
        <div class="tt-veil"></div>
        <canvas id="ttCam"></canvas>
        <div class="tt-msg" id="ttMsg"></div>
        <div class="tt-quiz" id="ttQuiz" aria-live="polite" hidden></div>
        <div class="tt-start" id="ttStart">
          <svg viewBox="0 0 300 170" aria-hidden="true" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <!-- たいよう -->
            <circle class="tt-f-sun tt-s-sun" cx="34" cy="62" r="20"/>
            <path class="tt-s-sun" d="M34 30v-8M34 102v-8M2 62h8M58 62h8M12 40l-6-6M56 84l6 6M12 84l-6 6M56 40l6-6"/>
            <!-- 人（あたま＝ちきゅう） -->
            <circle class="tt-f-earth tt-s-earth" cx="160" cy="62" r="18"/>
            <path class="tt-s-ink" d="M160 80v52M160 132l-16 30M160 132l16 30M160 94l-22 26M160 94l26-22l12-24"/>
            <!-- 手の 月と まわる みち -->
            <circle class="tt-s-orbit" cx="160" cy="62" r="56" stroke-width="2" stroke-dasharray="6 7"/>
            <circle class="tt-f-dark" cx="200" cy="22" r="11"/>
            <path class="tt-f-lit" d="M200 11a11 11 0 0 0 0 22z"/>
            <circle class="tt-s-edge" cx="200" cy="22" r="11"/>
          </svg>
          <p>あたまが ちきゅう、手が 月。<br>かた手を あげて、あたまの まわりを まわそう。</p>
          <div class="tt-gorow">
            <button class="tt-big" id="ttGo" type="button">カメラで</button>
            <button class="tt-big tt-big-sub" id="ttGo2" type="button">ゆびで</button>

    <div class="tt-side" id="ttSide">
      <div class="tt-pn"><canvas id="ttTop"></canvas><div class="tt-cap">上から 見ると</div></div>
      <div class="tt-pn"><canvas id="ttView"></canvas><div class="tt-cap">ちきゅうから 見ると</div><div class="tt-name" id="ttName" hidden></div></div>
    </div>
  </div>
</div>

<script>
/* ===== 手で おす（地球の 部屋で 共通） =====
   もとは 生命の 部屋の mock/rika/seimei/_parts/rs-te.js（使い方は 同じ・window.RsTe）。
   地球の 部屋は「色は :root だけ」の 決まりなので、色を CSS の 変数から 読むように 写した もの。
   カメラの 手を 画面 ぜんたいの「わ」に うつす。ボタンの 上で 約1.1びょう とめると おせる。タップや マウスは そのまま。
     RsTe.point(nx,ny,box) … カメラの 中の 位置（0〜1・かがみの むき）。null で けす
     RsTe.startHand({onPoint,onLost,hint}) … 手の トラッキング（人さし指の 先）を はじめる
     RsTe.stop() / RsTe.bindButton(btn,opt) / RsTe.errText(e) / RsTe.cur（画面の px）
   使う 色：--rl-ink（わ）--rl-soft（わの ふち）--rl-accent2（たまる 円） */
(function(){
  const DWELL=1100, BOX=[0.1,0.1,0.9,0.9], SM=0.5;
  const cv=document.createElement('canvas'); cv.className='rc-te'; cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60';
  const tip=document.createElement('div'); tip.className='rc-te-tip'; tip.hidden=true;
  const st=document.createElement('style');
  st.textContent='.rc-te-tip{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:61;pointer-events:none;background:var(--rl-soft);border:2px solid var(--rl-ink);border-radius:22px;padding:8px 16px;font-size:16px;font-weight:700;color:var(--rl-ink);white-space:nowrap}'
    +'.rc-te-tip[hidden]{display:none}.rc-te-near{box-shadow:inset 0 0 0 4px var(--rl-accent2)!important}'
    +'#rsTeBtn[aria-pressed="true"]{background:var(--rl-accent2);color:var(--rl-soft);border-color:var(--rl-accent2)}';
  const g=cv.getContext('2d');
  function size(){ const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; g.setTransform(d,0,0,d,0,0); }
  function mount(){ document.head.appendChild(st); document.body.appendChild(cv); document.body.appendChild(tip); size(); }
  if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
  addEventListener('resize',size);
  const T={cur:null, el:null, t0:0, done:false, on:false, dwell:DWELL, clicks:0, box:BOX};
  const cl=v=>Math.max(0,Math.min(1,v));
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  T.point=function(nx,ny,box){
    if(nx==null){ T.cur=null; return null; }
    const b=box||BOX, x=cl((nx-b[0])/(b[2]-b[0]))*innerWidth, y=cl((ny-b[1])/(b[3]-b[1]))*innerHeight;
    if(!T.cur) T.cur={x,y}; else { T.cur.x+=(x-T.cur.x)*SM; T.cur.y+=(y-T.cur.y)*SM; }
    return T.cur;
  };
  T.say=function(t){ tip.hidden=!t; if(t && tip.textContent!==t) tip.textContent=t; };
  function target(){
    const c=T.cur; if(!c) return null;
    const e=document.elementFromPoint(c.x,c.y), b=e&&e.closest&&e.closest('button');
    return b && !b.disabled && b.offsetParent && !b.closest('[hidden]') ? b : null;
  }
  function frame(now){
    requestAnimationFrame(frame);
    g.clearRect(0,0,innerWidth,innerHeight);
    const c=T.cur, el=target();
    if(el!==T.el){ if(T.el) T.el.classList.remove('rc-te-near'); T.el=el; T.t0=now; T.done=false; if(el) el.classList.add('rc-te-near'); }
    let prog=0;
    if(el && !T.done){ prog=Math.min(1,(now-T.t0)/T.dwell); if(prog>=1){ T.done=true; T.clicks++; el.click(); } }
    if(!c) return;
    const R=Math.max(20,Math.min(innerWidth,innerHeight)*0.035), ink=css('--rl-ink'), soft=css('--rl-soft'), acc=css('--rl-accent2');
    g.lineWidth=7; g.strokeStyle=soft; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.lineWidth=3; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.fillStyle=ink; g.beginPath(); g.arc(c.x,c.y,4,0,7); g.fill();
    // みちていく わ：こい ふち（11）の 上に 部屋の 色（6）。うすい 色でも 見える（生命の rs-te.js と 同じ 直し）
    if(prog>0 && !T.done){ g.lineCap='round'; const a1=-Math.PI/2+prog*Math.PI*2;
      g.lineWidth=11; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke();
      g.lineWidth=6; g.strokeStyle=acc; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke(); }
  }
  requestAnimationFrame(frame);

  /* ---- 手の トラッキング（人さし指の 先） ---- */
  const VER='0.10.14';
  let hands=null, video=null, stream=null, lastT=-1, onPoint=null, onLost=null, seen=0, hint='人さし指を カメラに 見せてね';
  async function load(){
    const vision=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
    const fs=await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
    const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:1});
    try{ return await vision.HandLandmarker.createFromOptions(fs,o('GPU')); }
    catch(e){ return await vision.HandLandmarker.createFromOptions(fs,o('CPU')); }
  }
  T.errText=function(e){
    return e&&e.name==='NoCamPage' ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : e&&(e.name==='NotFoundError'||e.name==='NotReadableError') ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : e&&e.name==='NotAllowedError' ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした。インターネットに つながっているか みてね。';
  };
  T.startHand=async function(opt){
    opt=opt||{}; onPoint=opt.onPoint||null; onLost=opt.onLost||null; if(opt.hint!=null) hint=opt.hint;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ const e=new Error(); e.name='NoCamPage'; throw e; }
    if(!video){ video=document.createElement('video'); video.playsInline=true; video.muted=true; video.setAttribute('playsinline','');
      video.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none'; document.body.appendChild(video); }
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:960},height:{ideal:540},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    hands=hands||await load();
    T.on=true; T.video=video; seen=performance.now(); requestAnimationFrame(track);
    return video;
  };
  function track(){
    if(!T.on) return;
    requestAnimationFrame(track);
    if(!hands||video.readyState<2||video.currentTime===lastT) return;
    lastT=video.currentTime;
    const now=performance.now(), r=hands.detectForVideo(video,now), L=(r.landmarks||[])[0];
    if(L){ seen=now; const c=T.point(1-L[8].x, L[8].y); T.say(''); if(onPoint) onPoint(c); }
    else { T.point(null); if(onPoint) onPoint(null); if(now-seen>1200 && hint) T.say(hint); if(onLost) onLost(); }
  }
  T.stop=function(){ T.on=false; T.point(null); T.say(''); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } if(onPoint) onPoint(null); };
  // ［手で］ボタン：おすと カメラの 手が はじまる。もう いちど おすと やめる
  T.bindButton=function(btn,opt){
    btn.setAttribute('aria-pressed','false');
    btn.addEventListener('click',async()=>{
      if(T.on){ T.stop(); btn.setAttribute('aria-pressed','false'); return; }
      btn.disabled=true; T.say('じゅんびちゅう…');
      try{ await T.startHand(opt); btn.setAttribute('aria-pressed','true'); T.say(''); }
      catch(e){ T.say(T.errText(e)); setTimeout(()=>T.say(''),5000); }
      finally{ btn.disabled=false; }
    });
  };
  window.RsTe=T;
})();
</script>
<script>
/* ===== 部屋の ならび（あとで 星ざ・星の動き・太陽の通り道 を ここに 足す） ===== */
const $ = id => document.getElementById(id);
const TT_ROOMS = [
  { id:'tsuki', name:'月に なって まわろう', grade:'4年・6年', el:'ttTsuki',
    icon:'<svg viewBox="0 0 96 96" aria-hidden="true" fill="none" stroke-width="2.5"><circle class="tt-s-orbit" cx="48" cy="48" r="32" stroke-dasharray="5 6"/><circle class="tt-f-earth tt-s-earth" cx="48" cy="48" r="14"/><circle class="tt-f-dark" cx="80" cy="48" r="9"/><path class="tt-f-lit" d="M80 39a9 9 0 0 0 0 18z"/><circle class="tt-s-edge" cx="80" cy="48" r="9"/></svg>',
    open:()=>TS.open(), close:()=>TS.close() },
];
function showHome(){
  for(const r of TT_ROOMS){ if(!$(r.el).hidden){ r.close && r.close(); $(r.el).hidden=true; } }
  $('ttHome').hidden=false; if(window.ttOneHome) ttOneHome();
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
}
function openRoom(id){
  const r=TT_ROOMS.find(x=>x.id===id); if(!r) return showHome();
  $('ttHome').hidden=true; $(r.el).hidden=false;
  if(location.hash!=='#'+id) history.replaceState(null,'',location.pathname+location.search+'#'+id);
  r.open && r.open(); if(window.ttOneHome) ttOneHome();
}
$('ttRooms').innerHTML = TT_ROOMS.map(r=>`<button class="tt-room" type="button" data-room="${r.id}">${r.icon}<b>${r.name}</b><span>${r.grade}</span></button>`).join('');
$('ttRooms').onclick = e=>{ const b=e.target.closest('[data-room]'); if(b) openRoom(b.dataset.room); };

/* ===== 月の きまり（計算は ここ 1か所） =====
   向きは 画面と 同じ：たいようは ひだり。φ は 月の いち（右が 0、上が 90°、反時計まわり）。
   e は たいようから はかった 月の はなれぐあい（0＝新月、180°＝満月、ふえる むき＝満ちる）。 */
const MOON = {
  elong(phi){ const t=2*Math.PI; return ((phi-Math.PI)%t+t)%t; },
  litFrac(e){ return (1-Math.cos(e))/2; },
  waxing(e){ return e>0 && e<Math.PI; },
  NAMES:[ {c:0,w:15,h:'<ruby>新<rt>しん</rt></ruby><ruby>月<rt>げつ</rt></ruby>',t:'新月'},
          {c:40,w:20,h:'<ruby>三日月<rt>みかづき</rt></ruby>',t:'三日月'},
          {c:90,w:15,h:'<ruby>上<rt>じょう</rt></ruby><ruby>弦<rt>げん</rt></ruby>の<ruby>月<rt>つき</rt></ruby>',t:'上弦の月'},
          {c:180,w:15,h:'<ruby>満<rt>まん</rt></ruby><ruby>月<rt>げつ</rt></ruby>',t:'満月'},
          {c:270,w:15,h:'<ruby>下<rt>か</rt></ruby><ruby>弦<rt>げん</rt></ruby>の<ruby>月<rt>つき</rt></ruby>',t:'下弦の月'} ],
  name(e){ const d=e*180/Math.PI;
    return MOON.NAMES.find(n=>{ let x=Math.abs(d-n.c); x=Math.min(x,360-x); return x<=n.w; }) || null; },
};

/* ===== 月の 部屋 ===== */
const tt = { src:null, nose:null, hand:null, rN:null, ang:225*Math.PI/180, target:225*Math.PI/180, lostAt:0, showName:false, run:false, raf:0,
  quiz:{on:false, order:[], i:0, ask:'', hold:0, out:0, count:3, done:false, end:false, hide:false, t:0} };
const cam=$('ttCam'), cv=$('ttTop'), vw=$('ttView');
let W=0,H=0, TW=0, VW=0, DPR=1;
// 色は :root の 変数から 読む（ここで 色を 書かない）
const P={};
function readP(){ const g=getComputedStyle(document.documentElement), v=k=>g.getPropertyValue(k).trim();
  Object.assign(P,{ink:v('--rl-ink'), lit:v('--tt-lit'), dark:v('--tt-dark'), edge:v('--tt-edge'), sun:v('--tt-sun'), sunfill:v('--tt-sunfill'),
    sunink:v('--tt-sunink'), earth:v('--tt-earth'), earthdark:v('--tt-earthdark'), orbit:v('--tt-orbit'), tagbg:v('--tt-tagbg'),
    person:v('--tt-person'), head:v('--tt-head')}); }
function fit(){
  if($('ttTsuki').hidden) return;
  readP();
  const m=$('ttMain').getBoundingClientRect();
  const side=Math.max(120, Math.min(300, (m.height-8)/2, m.width*0.32));
  $('ttSide').style.width=side+'px';
  DPR=window.devicePixelRatio||1;
  const s=$('ttStage').getBoundingClientRect(); W=s.width; H=s.height;
  cam.width=Math.round(W*DPR); cam.height=Math.round(H*DPR);
  for(const c of [cv,vw]){ const r=c.getBoundingClientRect(); c.width=Math.round(r.width*DPR); c.height=Math.round(r.height*DPR); }
  draw();
}
window.addEventListener('resize', fit);

// 手と あたまの いちを 受けとる（0〜1、かがみの むき）。hand が null なら 見うしなった
function feed(p){
  const now=performance.now();
  if(p.nose) tt.nose=p.nose;
  if(p.r) tt.rN=p.r;
  if(p.hand && tt.nose){
    tt.hand=p.hand; tt.lostAt=0;
    const dx=(p.hand.x-tt.nose.x)*W, dy=(p.hand.y-tt.nose.y)*H;
    if(Math.hypot(dx,dy) > Math.min(W,H)*0.06) tt.target=Math.atan2(-dy,dx);   // 画面は 下むきが +y なので 上を +に
  }else{ if(!tt.lostAt) tt.lostAt=now; }
}
function settle(){ tt.ang=tt.target; draw(); }
function step(){
  let d=tt.target-tt.ang; d=Math.atan2(Math.sin(d),Math.cos(d));
  tt.ang+=d*0.35;
}
function loopDraw(t){ if(!tt.run) return; tt.raf=requestAnimationFrame(loopDraw); step(); quizTick(t); draw(); }

/* ===== 月の 形 クイズ（11-07 先生：名前を 言われたら その 場所へ 月を 動かし、3びょう とめる。体で 場所を おぼえる）
   当たりの はんいは MOON.name と 同じ（月の なまえの 決まりは 1か所）。1回で 5つの 形を ぜんぶ、じゅんばんは まぜる */
const Q_HOLD=3, Q_GRACE=0.25;   // とめる びょう・手が ふるえて 少し 出ても もどさない びょう
const ruby=t=>(MOON.NAMES.find(n=>n.t===t)||{}).h||t;
const OK_SVG='<svg class="tt-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function quizShuffle(){ const a=MOON.NAMES.map(n=>n.t); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if(a[0]===tt.quiz.ask) a.push(a.shift()); return a; }   // 前の 回の さいごと 同じ 名前から 始めない
function quizSet(i){ const q=tt.quiz; q.i=i; q.ask=q.order[i]; q.hold=0; q.out=0; q.count=Q_HOLD; q.done=false; q.end=false; q.hide=true; quizCard(); }
function quizStart(){ const q=tt.quiz; q.on=true; q.order=quizShuffle(); q.t=0; quizSet(0); }
function quizStop(){ const q=tt.quiz; q.on=false; q.hide=false; q.done=false; q.end=false; q.hold=0; $('ttQuiz').hidden=true; }
function quizNext(){ const q=tt.quiz; if(q.i+1<q.order.length) quizSet(q.i+1); }
function quizCard(){
  const q=tt.quiz, el=$('ttQuiz'); el.hidden=!q.on; if(!q.on) return;
  el.innerHTML = q.end ? `<div class="tt-quiz-ok">${OK_SVG}ぜんぶ できた！</div><div class="tt-quiz-ask">${ruby(q.ask)}</div><button class="tt-b" id="ttQuizAgain" type="button">もう いちど</button>`
    : q.done ? `<div class="tt-quiz-ok">${OK_SVG}できた！</div><div class="tt-quiz-ask">${ruby(q.ask)}</div><button class="tt-b" id="ttQuizNext" type="button">つぎ</button>`
    : `<div class="tt-quiz-ask">${ruby(q.ask)}</div><div class="tt-quiz-sub">の ばしょで<br>3びょう とめよう</div>`;
}
function quizTick(t){
  const q=tt.quiz, dt=q.t? Math.min(0.1,(t-q.t)/1000) : 0; q.t=t;
  if(!q.on || q.done || q.end || !tt.src) return;
  const lost = tt.src==='cam' && tt.lostAt;
  const nm = MOON.name(MOON.elong(tt.ang));
  if(!lost && nm && nm.t===q.ask){ q.out=0; q.hold+=dt; }
  else if(lost){ q.hold=0; }
  else { q.out+=dt; if(q.out>Q_GRACE) q.hold=0; }
  q.count=Math.max(1,Math.ceil(Q_HOLD-q.hold));
  if(q.hold>=Q_HOLD){ q.done=true; q.hide=false; q.end = q.i+1>=q.order.length; quizCard(); }   // さいごの 形なら そのまま おわりの 札
}

// 月（または ちきゅう）を 上から：たいようの がわ（ひだり）半分が 明るい
function halfLit(c,x,y,r,dark){
  c.fillStyle=dark; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
  c.fillStyle=P.lit; c.beginPath(); c.arc(x,y,r,Math.PI/2,Math.PI*1.5); c.closePath(); c.fill();
  c.strokeStyle=P.edge; c.lineWidth=Math.max(1.5,r*0.12); c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.stroke();
}
// ちきゅうから 見た 月の 形
function phaseDisc(c,x,y,r,e){
  c.save(); c.translate(x,y);
  c.fillStyle=P.dark; c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
  let k=e; if(e>Math.PI){ c.scale(-1,1); k=2*Math.PI-e; }   // かけていくときは 左が 明るい
  const rx=Math.abs(Math.cos(k))*r;
  c.fillStyle=P.lit; c.beginPath();
  c.arc(0,0,r,-Math.PI/2,Math.PI/2,false);                  // 右の 半円
  if(Math.cos(k)>=0) c.ellipse(0,0,rx,r,0,Math.PI/2,-Math.PI/2,true);   // 細い（三日月がわ）
  else c.ellipse(0,0,rx,r,0,Math.PI/2,Math.PI*1.5,false);               // 太い（満月がわ）
  c.closePath(); if(k>0.01) c.fill();
  c.restore();
  c.strokeStyle=P.edge; c.lineWidth=Math.max(2,r*0.04); c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.stroke();
}
function sun(c,x,y,r){
  c.strokeStyle=P.sun; c.lineWidth=Math.max(2,r*0.12); c.lineCap='round';
  for(let i=0;i<8;i++){ const a=i*Math.PI/4; c.beginPath(); c.moveTo(x+Math.cos(a)*r*1.25,y+Math.sin(a)*r*1.25); c.lineTo(x+Math.cos(a)*r*1.6,y+Math.sin(a)*r*1.6); c.stroke(); }
  c.fillStyle=P.sunfill; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.stroke();
}
function tag(c,t,x,y,px,col){
  c.font=`700 ${px}px "BIZ UDPGothic",sans-serif`; c.textAlign='center'; c.textBaseline='middle';
  const w=c.measureText(t).width+px*0.8;
  c.fillStyle=P.tagbg; c.beginPath(); c.roundRect(x-w/2,y-px*0.75,w,px*1.5,px*0.5); c.fill();
  c.fillStyle=col||P.ink; c.fillText(t,x,y+1);
}

function draw(){
  if(!W) return;
  const e=MOON.elong(tt.ang);
  // --- カメラの 上 ---
  let c=cam.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  const n=tt.nose||{x:0.5,y:0.45}, nx=n.x*W, ny=n.y*H, R=(tt.rN||0.3)*H;
  if(tt.src==='mouse'){   // ためすとき：人の 形を かく（カメラの かわり）
    c.strokeStyle=P.person; c.lineWidth=4; c.lineCap='round'; c.fillStyle=P.head;
    c.beginPath(); c.arc(nx,ny,H*0.09,0,Math.PI*2); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(nx-H*0.2,H); c.quadraticCurveTo(nx-H*0.2,ny+H*0.17,nx,ny+H*0.16); c.quadraticCurveTo(nx+H*0.2,ny+H*0.17,nx+H*0.2,H); c.stroke();
  }
  sun(c, -H*0.02, H*0.5, H*0.11);
  tag(c,'たいよう', H*0.11, H*0.5+H*0.2, Math.max(14,H*0.04), P.sunink);
  c.setLineDash([8,9]); c.strokeStyle=P.orbit; c.lineWidth=3;
  c.beginPath(); c.arc(nx,ny,R,0,Math.PI*2); c.stroke(); c.setLineDash([]);
  if(tt.src) tag(c,'ちきゅう', nx, ny+H*0.12, Math.max(14,H*0.04), P.earth);
  const mx=nx+Math.cos(tt.ang)*R, my=ny-Math.sin(tt.ang)*R, mr=Math.max(14,H*0.055);
  if(tt.src){ halfLit(c,mx,my,mr,P.dark); tag(c,'月', mx, my-mr-Math.max(14,H*0.04)*0.9, Math.max(14,H*0.04)); }
  const q=tt.quiz;
  if(tt.src && q.on && (q.hold>0 || q.done)){   // とめている あいだ わが みちる（こい ふちの 上に 光の 色）
    const k=q.done?1:q.hold/Q_HOLD, a1=-Math.PI/2+k*Math.PI*2, rr=mr+12; c.lineCap='round';
    c.lineWidth=11; c.strokeStyle=P.tagbg; c.beginPath(); c.arc(mx,my,rr,-Math.PI/2,a1); c.stroke();
    c.lineWidth=6; c.strokeStyle=P.lit; c.beginPath(); c.arc(mx,my,rr,-Math.PI/2,a1); c.stroke();
    if(!q.done) tag(c,String(q.count), mx, my+rr+Math.max(18,H*0.05), Math.max(20,H*0.06), P.lit);
    tag(c,'月', mx, my-mr-Math.max(14,H*0.04)*0.9, Math.max(14,H*0.04));   // 月の 札は わの 上に もう いちど
  }
  const lost = tt.src && tt.lostAt && performance.now()-tt.lostAt>700;
  $('ttMsg').textContent = lost ? 'かた手を あげてね' : '';

  // --- 上から 見た 図 ---
  c=cv.getContext('2d'); const w=cv.width/DPR, h=cv.height/DPR; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,w,h);
  const fs=14, cx=w*0.56, cy=24+(h-24)/2, oR=Math.min(w*0.3, ((h-24)/2-fs*1.6)*0.82), er=oR*0.28, mr2=oR*0.17;
  // ひかりの むき
  c.strokeStyle=P.sun; c.lineWidth=2; c.fillStyle=P.sun;
  for(const yy of [cy-oR*1.05, cy, cy+oR*1.05]){ c.beginPath(); c.moveTo(w*0.04,yy); c.lineTo(w*0.16,yy); c.stroke();
    c.beginPath(); c.moveTo(w*0.19,yy); c.lineTo(w*0.14,yy-5); c.lineTo(w*0.14,yy+5); c.closePath(); c.fill(); }
  sun(c, -w*0.05, cy, h*0.11);
  // 月の みち と まわる むき
  c.setLineDash([5,6]); c.strokeStyle=P.orbit; c.lineWidth=2; c.beginPath(); c.arc(cx,cy,oR,0,Math.PI*2); c.stroke(); c.setLineDash([]);
  const ar=-Math.PI*0.25, ax=cx+Math.cos(ar)*oR, ay=cy+Math.sin(ar)*oR;   // 右上に 反時計まわりの 矢じり
  c.save(); c.translate(ax,ay); c.rotate(ar-Math.PI/2); c.fillStyle=P.orbit; c.beginPath(); c.moveTo(0,-7); c.lineTo(7,5); c.lineTo(-7,5); c.closePath(); c.fill(); c.restore();
  // 見る むき（ちきゅう → 月）
  const tx=cx+Math.cos(tt.ang)*oR, ty=cy-Math.sin(tt.ang)*oR;
  c.strokeStyle=P.earth; c.lineWidth=2; c.beginPath(); c.moveTo(cx,cy); c.lineTo(tx,ty); c.stroke();
  halfLit(c,cx,cy,er,P.earthdark);
  halfLit(c,tx,ty,mr2,P.dark);
  // 名前の 札は 月と 重ならない がわへ（ちきゅうは 月の 反対の 上下、月は 外がわ）
  const eo=er+fs*0.9, mo=mr2+fs*0.9;
  tag(c,'ちきゅう',cx,cy+(Math.sin(tt.ang)<0?-eo:eo),fs,P.earth);
  tag(c,'月',tx+Math.cos(tt.ang)*mo, ty-Math.sin(tt.ang)*mo, fs);

  // --- ちきゅうから 見た 形 ---
  c=vw.getContext('2d'); const w2=vw.width/DPR, h2=vw.height/DPR; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,w2,h2);
  const showNm=tt.showName && !tt.quiz.hide, nm=showNm?MOON.name(e):null;
  const topY=24, botY=h2-(showNm?42:8), pr=Math.max(10,Math.min(w2*0.4,(botY-topY)/2-4));
  tt.disc={x:w2/2, y:(topY+botY)/2, r:pr};
  if(tt.quiz.hide){   // クイズで こたえる 前：形は かくして「？」
    c.fillStyle=P.dark; c.beginPath(); c.arc(tt.disc.x,tt.disc.y,pr,0,Math.PI*2); c.fill();
    c.strokeStyle=P.edge; c.lineWidth=Math.max(2,pr*0.04); c.setLineDash([6,6]); c.stroke(); c.setLineDash([]);
    c.fillStyle=P.ink; c.font=`700 ${Math.max(20,pr*0.9)}px "BIZ UDPGothic",sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText('？',tt.disc.x,tt.disc.y+2);
  } else phaseDisc(c, tt.disc.x, tt.disc.y, pr, e);
  const el=$('ttName'); el.hidden=!showNm; const html=nm?nm.h:''; if(el.innerHTML!==html) el.innerHTML=html;
  tt.e=e; tt.name=nm?nm.t:'';
}

/* ためすとき（?test）：マウスの いちが 手。あたまは まんなか */
const TEST=/[?&]test/.test(location.search);
const TS = {
  open(){ tt.run=true; requestAnimationFrame(()=>{ fit(); loopDraw(); }); },
  close(){ tt.run=false; cancelAnimationFrame(tt.raf); window.ttStopCam && window.ttStopCam();
    tt.src=null; $('ttStart').hidden=false; $('ttGo').disabled=false; if(window.RsTe) RsTe.point(null);
    quizStop(); $('ttQuizBtn').setAttribute('aria-pressed','false'); },
};
$('ttBack').onclick=showHome;
// 理科ラボの「もどる ⌂」（rl-home.js）が 上の帯に 入ったら、月の 部屋の 家の ボタンは かくす（家が 2つ ならばない ように）
// 入口では 左下に うかべ、部屋では 上の帯の 左はしへ うつす
function ttOneHome(){ const a=document.querySelector('.rlh-home'); if(!a) return;
  const inRoom=!$('ttTsuki').hidden, top=document.querySelector('.tt-top');
  if(inRoom){ if(a.parentNode!==top) top.insertBefore(a,top.firstChild); a.classList.remove('rlh-float'); $('ttBack').hidden=true; }
  else { if(a.parentNode!==document.body) document.body.appendChild(a); a.classList.add('rlh-float'); } }
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(ttOneHome)); else setTimeout(ttOneHome);
$('ttQuizBtn').onclick=()=>{ if(tt.quiz.on) quizStop(); else quizStart(); $('ttQuizBtn').setAttribute('aria-pressed',String(tt.quiz.on)); draw(); };
$('ttQuiz').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; if(b.id==='ttQuizNext') quizNext(); else if(b.id==='ttQuizAgain') quizStart(); draw(); };
$('ttNameBtn').onclick=()=>{ tt.showName=!tt.showName; $('ttNameBtn').setAttribute('aria-pressed',String(tt.showName)); draw(); };
// ［ゆびで］（カメラなし）：指や マウスの いちが 手。あたまは まんなか。?test でも 同じ
const byFinger=()=>{ $('ttStart').hidden=true; tt.src='mouse'; tt.nose={x:0.5,y:0.45}; fit(); };
$('ttGo2').onclick=byFinger;
$('ttStage').addEventListener('pointermove', e=>{
  if(tt.src!=='mouse') return;
  const r=$('ttStage').getBoundingClientRect();
  feed({nose:{x:0.5,y:0.45}, hand:{x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}});
});
$('ttStage').addEventListener('pointerdown', e=>{ if(tt.src==='mouse'&&!e.target.closest('button')) $('ttStage').dispatchEvent(new PointerEvent('pointermove',e)); });
if(TEST){ $('ttGo').textContent='マウスで ためす'; $('ttGo').onclick=byFinger; }
window.tt=tt; window.MOON=MOON; window.ttFeed=feed; window.ttSettle=settle; window.ttFit=fit; window.ttDraw=draw; window.ttOpenRoom=openRoom; window.ttShowHome=showHome; window.ttOneHome=ttOneHome;
if(location.hash.length>1) openRoom(location.hash.slice(1));
</script>

<script type="module">
/* ===== カメラと 体の トラッキング（あたまと 手首）。うつした ものは 外に 出さない ===== */
const $ = id => document.getElementById(id);
const TEST=/[?&]test/.test(location.search);
const VER='0.10.14';
const video=$('ttVideo');
let lm=null, lastT=-1, modelP=null, raf=0, stream=null;
async function loadModel(){
  const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
  const fs = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
  const opts = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate:d },
    runningMode:'VIDEO', numPoses:1, minPoseDetectionConfidence:0.5, minTrackingConfidence:0.5 });
  const safari = /Safari/.test(navigator.userAgent) && !/Chrome|CriOS|Edg/.test(navigator.userAgent);
  if(!safari){
    try{ return await Promise.race([ vision.PoseLandmarker.createFromOptions(fs, opts('GPU')),
      new Promise((_,ng)=>setTimeout(()=>ng(new Error('gpu-timeout')),10000)) ]); }catch(e){}
  }
  return await vision.PoseLandmarker.createFromOptions(fs, opts('CPU'));
}
if(!TEST){
  modelP = loadModel().catch(e=>{ modelP=null; throw e; }); modelP.catch(()=>{});
  $('ttGo').onclick = start;
}
async function start(){
  const err=$('ttErr'); err.hidden=true;
  $('ttGo').disabled=true; $('ttGo').textContent='じゅんびちゅう…';
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const e=new Error('nocam'); e.name='NoCamPage'; throw e; }
    stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    $('ttStage').style.setProperty('--tt-ar', (video.videoWidth||16)+'/'+(video.videoHeight||9));
    lm = await Promise.race([ (modelP || (modelP = loadModel())),
      new Promise((_,ng)=>setTimeout(()=>ng(new Error('model-timeout')),45000)) ]);
    $('ttStart').hidden=true; window.tt.src='cam';
    requestAnimationFrame(()=>window.ttFit());
    loop();
  }catch(e){
    $('ttGo').disabled=false; $('ttGo').textContent='もう いちど';
    err.hidden=false;
    err.textContent = (e && e.name==='NoCamPage') ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : (e && (e.name==='NotFoundError'||e.name==='NotReadableError')) ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : (e && e.name==='NotAllowedError') ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした（'+(e && (e.name||e.message)||'')+'）。インターネットに つながっているか みてね。';
  }
}
window.ttStopCam=()=>{ cancelAnimationFrame(raf); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } video.srcObject=null; $('ttGo').textContent='カメラで'; };
const ok = p => p && (p.visibility==null || p.visibility>0.5);
function loop(){
  raf=requestAnimationFrame(loop);
  if(!lm || video.readyState<2 || video.currentTime===lastT) return;
  lastT=video.currentTime;
  const res = lm.detectForVideo(video, performance.now());
  const L = res.landmarks && res.landmarks[0];
  if(!L || !ok(L[0])){ window.ttFeed({hand:null}); window.RsTe&&RsTe.point(null); return; }
  const m = p => ({x:1-p.x, y:p.y});                         // かがみの むきに あわせる
  const nose=m(L[0]);
  // 月の 手：見えている 手首のうち 高い ほう（あげている 手）
  const ws=[L[15],L[16]].filter(ok).sort((a,b)=>a.y-b.y);
  // まわる みちの 大きさ：かたはばの 1.3ばい（かたが 見えないときは 前のまま）
  let r=null; if(ok(L[11]) && ok(L[12])) r=Math.min(0.45, Math.max(0.15, Math.hypot((L[11].x-L[12].x)*16/9, L[11].y-L[12].y)*1.3));
  window.ttFeed({nose, r, hand: ws.length ? m(ws[0]) : null});
  // 上げた ほうの 手の 人さし指（19・20）で 画面の ボタンも おせる（rc-te.js）
  const f=[L[19],L[20]].filter(ok).sort((a,b)=>a.y-b.y)[0]; if(window.RsTe) RsTe.point(f?1-f.x:null, f?f.y:null);
}
</script>
