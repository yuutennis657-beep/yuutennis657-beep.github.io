<!doctype html>
<!-- 生成物：直すときは src.html と ../kit/ を 直して python3 ../build.py（このファイルは 手で 直さない） -->
<html lang="ja">
<head><script>window.RL_HOME_URL="../../chikyu.html";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雲の 動きと 天気</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 理科ラボ／地球 の 部屋で つかう 共通の 形（色は 書かない：各部屋の :root の --rl-・--rc- を つかう）
   各部屋の :root に 置く 名前
     そろえる 5つ：--rl-bg（地）--rl-ink（字）--rl-accent（主の色）--rl-accent2（2番目の色）--rl-soft（うすい色・板）
     そのほか   ：--rl-sub（2番目の字）--rl-line（線）--rc-stage（絵の 地）--rc-tagbg（札の 地）--rc-ng（まちがい・こまった 字）--rc-bigink（大きい ボタンの 字） */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--rl-bg);color:var(--rl-ink);
  font-family:"BIZ UDPGothic",sans-serif;font-size:16px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
svg.rc-i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.rc-app{display:grid;grid-template-rows:auto 1fr;gap:8px;height:100vh;height:100dvh;padding:8px 12px 12px}
.rc-top{display:flex;align-items:center;gap:8px;min-height:52px}
.rc-top h1{margin:0;font-size:20px;white-space:nowrap}
.rc-top .rc-path{font-size:14px;color:var(--rl-sub);white-space:nowrap}
.rc-sp{flex:1}
.rc-b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;
  border:1px solid var(--rl-line);background:var(--rl-soft);border-radius:12px;font-size:16px;white-space:nowrap}
.rc-b[aria-pressed="true"]{border:2px solid var(--rl-ink);font-weight:700}
.rc-b .rc-ck{display:none}
.rc-b[aria-pressed="true"] .rc-ck{display:block}
.rc-main{display:flex;gap:8px;min-height:0}
.rc-stage{position:relative;flex:1;min-width:0;border-radius:12px;overflow:hidden;background:var(--rc-stage);touch-action:none}
.rc-stage>canvas{position:absolute;inset:0;width:100%;height:100%}
.rc-pip{position:absolute;right:8px;bottom:8px;width:24%;max-width:240px;aspect-ratio:var(--rc-ar,16/9);border-radius:10px;overflow:hidden;
  border:2px solid var(--rl-line);background:var(--rc-stage)}
.rc-pip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.rc-pip canvas{position:absolute;inset:0;width:100%;height:100%}
.rc-msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:6px 16px;border-radius:20px;
  background:var(--rc-tagbg);font-size:18px;font-weight:700;white-space:nowrap;pointer-events:none}
.rc-msg:empty{display:none}
.rc-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:var(--rl-bg);padding:12px;text-align:center}
.rc-start p{margin:0;font-size:18px;line-height:1.7}
.rc-start svg{width:min(300px,60%);height:auto;max-height:42%}
.rc-big{min-height:60px;padding:0 36px;font-size:22px;font-weight:700;border-radius:30px;border:0;background:var(--rl-accent);color:var(--rc-bigink)}
.rc-big:disabled{opacity:.6}
.rc-gorow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.rc-big.rc-big-sub{background:var(--rl-soft);color:var(--rl-ink);border:2px solid var(--rl-line)}
.rc-b:disabled{opacity:.45;cursor:default}
.rc-err{color:var(--rc-ng);font-size:16px;max-width:80%}
.rc-side{display:flex;flex-direction:column;gap:8px;flex:none;width:260px}
.rc-pn{position:relative;flex:1;border:1px solid var(--rl-line);border-radius:12px;background:var(--rl-soft);overflow:hidden;min-height:0}
.rc-pn>canvas{position:absolute;inset:0;width:100%;height:100%}
.rc-cap{position:absolute;left:8px;top:6px;font-size:14px;font-weight:700;color:var(--rl-sub);pointer-events:none}
rt{font-size:10px}
</style>
<style>
/* 見本 v0.4（2026-11-07）理科ラボ／地球／雲の 動きと 天気（5年）タッチだけ
   授業の 流れ：①見る（雲画像を 日ごとに 見る・表に 天気が たまる）→ ②クイズ（雲画像を 読む 問題と 天気の 知しき。QUIZ に ならべる）→ ③よそう（さいごの 日の 東京）
   地図は 教科書の 雲画像と 同じ 見た目（くらい 海に 白い 雲、雨は 青い 点＝アメダス）。
   資料は 先生用（歯車）で えらぶ：お手本（ネットなし）／今日から（予報）／日を えらぶ（教科書と 同じ 日の 本物）。どれも 1日ごと 4日。 */
:root{
  --rl-bg:#eef4f9; --rl-ink:#14213d; --rl-accent:#ffb23e; --rl-accent2:#1d5fa8; --rl-soft:#ffffff;
  --rl-sub:#3d4a63; --rl-line:#8fa3b8;
  --rc-stage:#0f2742; --rc-stageink:#ffffff; --rc-tagbg:rgba(255,255,255,.93); --rc-ng:#b42318; --rc-bigink:#2b1700;
  --rc-land:#3f5747; --rc-landedge:#b7cbb3; --rc-grid:rgba(200,220,255,.28); --rc-cloud:#ffffff; --rc-rain:#2f8cff;
  --rc-arrow:#ffb23e; --rc-arrowedge:#2b1700; --rc-ok:#1b7f3b; --rc-now:#1d5fa8; --rc-city:#ffd34d; --rc-cityedge:#14213d;
  --rc-sun:#c2410c; --rc-sunfill:#ffd34d; --rc-icloud:#c3ccd8; --rc-icloudedge:#4d5a70; --rc-irain:#1d5fa8;
  --rc-dot:#c3cfdc; --rc-dotnow:#1d5fa8; --rc-shadow:rgba(20,33,61,.18); --rc-skyblue:#7cc0f2; --rc-chipbg:#e3eefb;
}
.rc-s-sun{stroke:var(--rc-sun)} .rc-f-sun{fill:var(--rc-sunfill)} .rc-s-cedge{stroke:var(--rc-icloudedge)} .rc-f-cloud{fill:var(--rc-icloud)}
.rc-f-rainc{fill:var(--rc-icloudedge)} .rc-s-rain{stroke:var(--rc-irain)} .rc-f-white{fill:var(--rl-soft)} .rc-f-stage{fill:var(--rc-stage)} .rc-f-rainp{fill:var(--rc-rain)}

/* 上：段（①②③）と 先生用 */
.rc-steps{display:flex;gap:6px;flex:none}
.rc-steps button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 6px;border:1px solid var(--rl-line);border-radius:22px;background:var(--rl-soft);font-size:16px;white-space:nowrap}
.rc-steps b{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--rl-accent2);color:var(--rl-accent2);font-size:16px}
.rc-steps button[aria-current="step"]{background:var(--rl-accent2);border-color:var(--rl-accent2);color:var(--rl-soft);font-weight:700}
.rc-steps button[aria-current="step"] b{background:var(--rl-soft);border-color:var(--rl-soft)}

/* 地図（雲画像） */
.rc-stage{background:var(--rc-stage)}
.rc-date{position:absolute;left:10px;top:10px;padding:4px 12px;border-radius:10px;background:var(--rc-tagbg);font-size:22px;font-weight:700;color:var(--rl-ink);pointer-events:none}
.rc-date small{font-size:16px;color:var(--rl-accent2);margin-left:6px}
.rc-days{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px;border-radius:30px;background:var(--rc-tagbg)}
.rc-days .rc-b{border-radius:50%;width:48px;height:48px;padding:0;background:var(--rl-soft)}
.rc-days .rc-b svg{width:26px;height:26px}
.rc-dots{display:flex;gap:2px}
.rc-dots button{width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.rc-dots i{display:block;width:14px;height:14px;border-radius:50%;background:var(--rc-dot);border:2px solid var(--rc-dot)}
.rc-dots button[aria-current="true"] i{width:20px;height:20px;background:var(--rc-dotnow);border-color:var(--rc-dotnow)}
.rc-dots button[data-lock="1"] i{background:var(--rl-soft);border:2px dashed var(--rl-accent2)}
.rc-dots button:disabled{cursor:default}
@keyframes rc-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.rc-days .rc-b.rc-go{animation:rc-pulse 1.2s ease-in-out infinite;border:3px solid var(--rl-accent2)}
.rc-cr{position:absolute;right:2px;bottom:2px;width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:var(--rc-stageink)}
.rc-cr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;opacity:.7}
.rc-src{position:absolute;right:46px;bottom:8px;z-index:3;max-width:calc(100% - 60px);font-size:14px;line-height:1.5;color:var(--rl-sub);background:var(--rc-tagbg);padding:4px 8px;border-radius:6px}

/* 右：天気の きろく と 段の 札 */
.rc-side{width:300px}
.rc-pn{display:flex;flex-direction:column}
.rc-tb{width:100%;border-collapse:collapse;margin-top:26px;table-layout:fixed}
.rc-tb th,.rc-tb td{font-size:14px;text-align:center;padding:1px 0;border-bottom:1px solid var(--rl-line);white-space:nowrap}
.rc-tb th:first-child{width:84px;text-align:left;padding-left:6px}
.rc-tb td{height:28px}
.rc-tb td svg{width:20px;height:20px;vertical-align:middle;margin-right:2px}
.rc-tb td span{vertical-align:middle}
.rc-tb th[data-now="1"]{color:var(--rc-now);text-decoration:underline;text-underline-offset:3px}
.rc-tb td.rc-q{font-size:18px;font-weight:700;color:var(--rl-accent2)}
.rc-card{margin:auto 8px 8px;padding:10px;border:2px solid var(--rl-accent2);border-radius:12px;background:var(--rl-soft)}
.rc-card h2{margin:0 0 8px;font-size:18px}
.rc-card p{margin:6px 0 0;font-size:16px;font-weight:700}
.rc-leg{display:flex;flex-direction:column;gap:4px;font-size:15px}
.rc-leg div{display:flex;align-items:center;gap:6px}
.rc-leg svg{width:24px;height:24px;flex:none}
.rc-pick{display:flex;gap:6px}
.rc-pick button{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:2px;min-height:48px;padding:0 2px;white-space:nowrap;border:1px solid var(--rl-line);border-radius:12px;background:var(--rl-soft);font-size:16px}
.rc-pick button svg{width:24px;height:24px}
.rc-pick button[aria-pressed="true"]{border:3px solid var(--rl-accent2);font-weight:700}
.rc-pick.rc-dir button{min-height:52px}
.rc-pick.rc-dir svg{width:28px;height:28px;fill:none;stroke:var(--rl-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rc-ok{color:var(--rc-ok)}
.rc-pn[data-step="2"] .rc-tb,.rc-pn[data-step="2"] .rc-cap{display:none}
.rc-pn[data-step="2"] .rc-card{margin:8px;flex:1;display:flex;flex-direction:column}
.rc-qhead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.rc-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 6px;border-radius:14px;background:var(--rc-chipbg);color:var(--rl-accent2);font-size:14px;font-weight:700;white-space:nowrap}
.rc-chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rc-qn{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.rc-qn{gap:2px!important} .rc-qn i{width:8px!important;height:8px!important;border-width:2px}
.rc-pick.rc-big2 button{min-height:54px;font-size:18px;position:relative}
.rc-pick button[data-st="ok"]{border:3px solid var(--rc-ok);font-weight:700;animation:rc-pop .45s ease-out}
.rc-pick button[data-st="ng"]{border:2px dashed var(--rl-line);color:var(--rl-sub);animation:rc-shake .35s}
.rc-pick button em{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;font-style:normal;font-size:15px;font-weight:700;line-height:22px;text-align:center;background:var(--rl-soft);border:2px solid currentColor}
.rc-pick button[data-st="ok"] em{color:var(--rc-ok);border:0;font-size:22px;line-height:24px}
@keyframes rc-pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes rc-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){ .rc-pick button,.rc-days .rc-b.rc-go{animation:none!important} }
.rc-qn i{width:12px;height:12px;border-radius:50%;border:2px solid var(--rl-line)}
.rc-qn i[data-s="now"]{border-color:var(--rl-accent2);background:var(--rl-accent2)}
.rc-qn i[data-s="ok"]{border-color:var(--rc-ok);background:var(--rc-ok)}
.rc-card .rc-q2{font-size:20px;font-weight:700;margin:0 0 10px;line-height:1.45}
.rc-pick.rc-wrap{flex-wrap:wrap}
.rc-pick.rc-wrap button{flex:1 1 calc(50% - 6px)}
.rc-note{margin:6px 0 0;font-size:15px;line-height:1.4}
.rc-note b{font-size:22px;vertical-align:-2px;margin-right:4px}
.rc-qnext{margin-top:auto;align-self:flex-end;display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px;border:0;border-radius:22px;background:var(--rl-accent2);color:var(--rl-soft);font-size:16px;font-weight:700}
.rc-qnext svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rc-sky{display:block;margin:0 auto 6px;width:200px;height:24px}
/* 答えの あとの 参考の 写真（地図の 上に 大きく） */
.rc-photo{position:absolute;left:8px;right:8px;top:8px;bottom:8px;margin:0;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:var(--rl-soft);box-shadow:0 8px 24px var(--rc-shadow);z-index:2}
.rc-photo img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:8px;background:var(--rc-stage)}
.rc-photo figcaption{display:flex;flex-direction:column;gap:2px;padding-right:52px}
.rc-photo figcaption span{font-size:18px;font-weight:700}
.rc-photo .rc-b{position:absolute;right:10px;bottom:10px}
.rc-qrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.rc-qrow .rc-qnext{margin:0 0 0 auto}
.rc-seeph{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px;border:1px solid var(--rl-line);border-radius:22px;background:var(--rl-soft);font-size:16px}
.rc-seeph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.rc-f-sky{fill:var(--rc-skyblue)} .rc-f-cl{fill:var(--rc-icloud)} .rc-s-cl{stroke:var(--rc-icloudedge)}

/* 先生用 */
.rc-teach{position:absolute;right:12px;top:62px;z-index:3;width:300px;padding:12px;border:1px solid var(--rl-line);border-radius:12px;background:var(--rl-soft);box-shadow:0 6px 18px var(--rc-shadow)}
.rc-teach h2{margin:0 0 8px;font-size:16px;color:var(--rl-sub)}
.rc-teach .rc-b{width:100%;justify-content:flex-start;margin-bottom:6px}
.rc-teach .rc-b[aria-pressed="true"]{border:2px solid var(--rl-accent2);font-weight:700}
.rc-teach input{width:100%;min-height:44px;margin:2px 0 6px;font:inherit;font-size:16px;padding:0 6px;border:1px solid var(--rl-line);border-radius:8px;color:var(--rl-ink);background:var(--rl-soft)}
@media (max-width:900px){ .rc-top .rc-path{display:none} .rc-steps button{padding:0 10px 0 4px} }
@media (max-height:420px){ .rc-pick.rc-dir button,.rc-pick.rc-big2 button{min-height:44px;font-size:16px} .rc-card .rc-q2{font-size:16px;margin-bottom:4px;line-height:1.35} .rc-qhead{margin-bottom:2px} .rc-note{font-size:14px;line-height:1.35;margin-top:4px} .rc-pick{gap:4px} .rc-pick.rc-wrap{row-gap:4px} .rc-qrow{padding-top:2px} .rc-sky{height:18px;margin-bottom:2px} .rc-tb td{height:24px} .rc-card{padding:6px} .rc-card h2{margin-bottom:4px} .rc-leg{font-size:14px;gap:0} }
</style>
</head>
<body>
<div class="rc-app">
  <div class="rc-top">
    <h1><ruby>雲<rt>くも</rt></ruby>の 動きと 天気</h1><span class="rc-path">理科ラボ／そらと大地</span>
    <span class="rc-sp"></span>
    <nav class="rc-steps" id="rcSteps" aria-label="学習の 段">
      <button type="button" data-s="1"><b>1</b>見る</button>
      <button type="button" data-s="2"><b>2</b>クイズ</button>
      <button type="button" data-s="3"><b>3</b>よそう</button>
    </nav>
    <button class="rc-b" id="rsTeBtn" type="button" aria-label="手で うごかす"><svg class="rc-i" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6 7s-5-2-6.5-4.5L3 12a1.5 1.5 0 0 1 2.5-1.5L8 13"/></svg>手で</button>
    <button class="rc-b" id="rcClear" type="button" aria-label="はじめから"><svg class="rc-i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg></button>
    <button class="rc-b" id="rcGear" type="button" aria-label="先生用：資料を えらぶ" aria-expanded="false"><svg class="rc-i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
  <div class="rc-teach" id="rcTeach" hidden>
    <h2>資料（先生用）</h2>
    <button class="rc-b" type="button" data-src="otehon" aria-pressed="true">お手本（教科書のような 動き）</button>
    <button class="rc-b" type="button" data-src="today" aria-pressed="false">今日から 4日（予報）</button>
    <button class="rc-b" type="button" data-src="date" aria-pressed="false">日を えらぶ（本物の 記録）</button>
    <input type="date" id="rcDate" aria-label="はじめの 日">
  </div>
  <div class="rc-main">
    <div class="rc-stage" id="rcStage">
      <canvas id="rcMap"></canvas>
      <div class="rc-date" id="rcDateTag"></div>
      <div class="rc-msg" id="rcMsg"></div>
      <div class="rc-days">
        <button class="rc-b" id="rcPrev" type="button" aria-label="前の 日"><svg class="rc-i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="rc-dots" id="rcDots"></div>
        <button class="rc-b" id="rcNext" type="button" aria-label="次の 日"><svg class="rc-i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <button class="rc-cr" id="rcCredit" type="button" aria-label="出典" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8v.5"/></svg></button>
      <figure class="rc-photo" id="rcPhoto" hidden>
        <img id="rcPhotoImg" alt="">
        <figcaption><span id="rcPhotoCap"></span></figcaption>
        <button class="rc-b" id="rcPhotoX" type="button" aria-label="写真を とじる"><svg class="rc-i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </figure>
      <div class="rc-src" id="rcSrc" hidden>地図：地球地図日本（国土地理院）<br>天気：Open-Meteo.com（CC BY 4.0）<span id="rcSrcPh"></span></div>
    </div>
    <div class="rc-side">
      <div class="rc-pn">
        <div class="rc-cap">天気の きろく</div>
        <table class="rc-tb" id="rcTable"></table>
        <div class="rc-card" id="rcCard"></div>
      </div>
    </div>
  </div>
</div>
<script>
/* ===== 手で おす（地球の 部屋で 共通） =====
   もとは 生命の 部屋の mock/rika/seimei/_parts/rs-te.js（使い方は 同じ・window.RsTe）。
   地球の 部屋は「色は :root だけ」の 決まりなので、色を CSS の 変数から 読むように 写した もの。
   カメラの 手を 画面 ぜんたいの「わ」に うつす。ボタンの 上で 約1.1びょう とめると おせる。タップや マウスは そのまま。

     RsTe.stop() / RsTe.bindButton(btn,opt) / RsTe.errText(e) / RsTe.cur（画面の px）
   使う 色：--rl-ink（わ）--rl-soft（わの ふち）--rl-accent2（たまる 円） */
(function(){

  cv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60';
  const tip=document.createElement('div'); tip.className='rc-te-tip'; tip.hidden=true;
  const st=document.createElement('style');
  st.textContent='.rc-te-tip{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:61;pointer-events:none;background:var(--rl-soft);border:2px solid var(--rl-ink);border-radius:22px;padding:8px 16px;font-size:16px;font-weight:700;color:var(--rl-ink);white-space:nowrap}'
    +'.rc-te-tip[hidden]{display:none}.rc-te-near{box-shadow:inset 0 0 0 4px var(--rl-accent2)!important}'
    +'#rsTeBtn[aria-pressed="true"]{background:var(--rl-accent2);color:var(--rl-soft);border-color:var(--rl-accent2)}';

  function size(){ const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; g.setTransform(d,0,0,d,0,0); }

    if(!T.cur) T.cur={x,y}; else { T.cur.x+=(x-T.cur.x)*SM; T.cur.y+=(y-T.cur.y)*SM; }

  };

    const c=T.cur; if(!c) return null;
    const e=document.elementFromPoint(c.x,c.y), b=e&&e.closest&&e.closest('button');

    g.clearRect(0,0,innerWidth,innerHeight);

    if(el!==T.el){ if(T.el) T.el.classList.remove('rc-te-near'); T.el=el; T.t0=now; T.done=false; if(el) el.classList.add('rc-te-near'); }

    g.lineWidth=7; g.strokeStyle=soft; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.lineWidth=3; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.fillStyle=ink; g.beginPath(); g.arc(c.x,c.y,4,0,7); g.fill();
    // みちていく わ：こい ふち（11）の 上に 部屋の 色（6）。うすい 色でも 見える（生命の rs-te.js と 同じ 直し）
    if(prog>0 && !T.done){ g.lineCap='round'; const a1=-Math.PI/2+prog*Math.PI*2;
      g.lineWidth=11; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke();
      g.lineWidth=6; g.strokeStyle=acc; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke(); }
  }

  const VER='0.10.14';

  async function load(){
    const vision=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
    const fs=await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
    const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:1});
    try{ return await vision.HandLandmarker.createFromOptions(fs,o('GPU')); }
    catch(e){ return await vision.HandLandmarker.createFromOptions(fs,o('CPU')); }
  }
  T.errText=function(e){
    return e&&e.name==='NoCamPage' ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : e&&(e.name==='NotFoundError'||e.name==='NotReadableError') ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : e&&e.name==='NotAllowedError' ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした。インターネットに つながっているか みてね。';
  };
  T.startHand=async function(opt){
    opt=opt||{}; onPoint=opt.onPoint||null; onLost=opt.onLost||null; if(opt.hint!=null) hint=opt.hint;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ const e=new Error(); e.name='NoCamPage'; throw e; }
    if(!video){ video=document.createElement('video'); video.playsInline=true; video.muted=true; video.setAttribute('playsinline','');
      video.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none'; document.body.appendChild(video); }

    else { T.point(null); if(onPoint) onPoint(null); if(now-seen>1200 && hint) T.say(hint); if(onLost) onLost(); }
  }
  T.stop=function(){ T.on=false; T.point(null); T.say(''); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } if(onPoint) onPoint(null); };

  T.bindButton=function(btn,opt){

      btn.disabled=true; T.say('じゅんびちゅう…');
      try{ await T.startHand(opt); btn.setAttribute('aria-pressed','true'); T.say(''); }

<script>
/* 理科ラボ／地球 の 部屋で つかう 共通の 部品（カメラ・体の 読み・色・キャンバス）
   うつした 映像は この 端末の 中だけで つかい、外へ 送らない。
   ?test のときは カメラを つかわず、マウス（ゆび）で ためせる。 */
(function(){
const TEST=/[?&]test/.test(location.search);
const VER='0.10.14';
const MODEL={
  pose:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
  hand:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'};

// 色は :root の 変数から 読む（部屋の 中で 色を 書かない）
function colors(names){ const g=getComputedStyle(document.documentElement), o={};
  for(const n of names) o[n.replace(/^--(rl|rc)-/,'')]=g.getPropertyValue(n).trim(); return o; }

// キャンバスを 見えている 大きさに 合わせる（にじまない）
function fit(cv){ const d=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=Math.max(1,Math.round(r.width*d)); cv.height=Math.max(1,Math.round(r.height*d));
  const c=cv.getContext('2d'); c.setTransform(d,0,0,d,0,0); return {c,w:r.width,h:r.height}; }

// 字の 札（地を しいて 読みやすく）
function tag(c,t,x,y,px,col,bg){ c.font=`700 ${px}px "BIZ UDPGothic",sans-serif`; c.textAlign='center'; c.textBaseline='middle';
  const w=c.measureText(t).width+px*0.8; c.fillStyle=bg; c.beginPath(); c.roundRect(x-w/2,y-px*0.75,w,px*1.5,px*0.5); c.fill();
  c.fillStyle=col; c.fillText(t,x,y+1); return w; }

const ease=(a,b,k)=>a+(b-a)*k;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const mirror=L=>L.map(p=>({x:1-p.x,y:p.y,v:p.visibility==null?1:p.visibility}));

async function loadModel(kind){
  const vision=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
  const fs=await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
  const K=kind==='hand'?vision.HandLandmarker:vision.PoseLandmarker;
  const opts=d=>({baseOptions:{modelAssetPath:MODEL[kind],delegate:d},runningMode:'VIDEO',
    ...(kind==='hand'?{numHands:2,minHandDetectionConfidence:0.5,minHandPresenceConfidence:0.5}:{numPoses:1,minPoseDetectionConfidence:0.5}),
    minTrackingConfidence:0.5});
  // Safari は GPU の じゅんびが 返らない ことが あるので はじめから CPU。ほかも 10びょうで CPU に
  const safari=/Safari/.test(navigator.userAgent)&&!/Chrome|CriOS|Edg/.test(navigator.userAgent);
  if(!safari){ try{ return await Promise.race([K.createFromOptions(fs,opts('GPU')),
    new Promise((_,ng)=>setTimeout(()=>ng(new Error('gpu-timeout')),10000))]); }catch(e){} }
  return await K.createFromOptions(fs,opts('CPU'));
}

/* camera({kind, go, go2, err, start, stage, pip, video, onStart(src), onFrame(点|null), onMouse(x,y,type,e)})
   go＝［カメラで］、go2＝［ゆびで］（カメラなし。指や マウスで 動かす。onStart('mouse')）。
   カメラの ときは、手の 人さし指（pose なら 上げた ほうの 手）で 画面の ボタンも おせる（rc-te.js の RsTe）
   pose のとき onFrame には 体の 33点（かがみの むき）、hand のときは 手ごとの 21点の ならび */
function camera(o){
  let lm=null,lastT=-1,raf=0,stream=null,modelP=null,ptr=false;
  // 指・マウスで 動かす（［ゆびで］と ?test）
  const usePointer=()=>{ if(ptr) return; ptr=true;
    const ev=e=>{ const r=o.stage.getBoundingClientRect(); o.onMouse&&o.onMouse((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,e.type,e); };
    for(const t of ['pointerdown','pointermove','pointerup','pointercancel']) o.stage.addEventListener(t,ev); };
  const byFinger=()=>{ o.start.hidden=true; usePointer(); o.onStart('mouse'); };
  if(o.go2) o.go2.onclick=byFinger;
  if(TEST){
    o.go.textContent='マウスで ためす';
    o.go.onclick=byFinger;
    return {stop(){}};
  }
  modelP=loadModel(o.kind).catch(e=>{ modelP=null; throw e; }); modelP.catch(()=>{});
  o.go.onclick=async()=>{
    o.err.hidden=true; o.go.disabled=true; o.go.textContent='じゅんびちゅう…';
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ const e=new Error('nocam'); e.name='NoCamPage'; throw e; }
      stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
      o.video.srcObject=stream; await o.video.play();
      o.pip.style.setProperty('--rc-ar',(o.video.videoWidth||16)+'/'+(o.video.videoHeight||9));
      lm=await Promise.race([(modelP||(modelP=loadModel(o.kind))),new Promise((_,ng)=>setTimeout(()=>ng(new Error('model-timeout')),45000))]);
      o.start.hidden=true; o.pip.hidden=false; o.onStart('cam'); loop();
    }catch(e){
      o.go.disabled=false; o.go.textContent='もう いちど'; o.err.hidden=false;
      o.err.textContent=(e&&e.name==='NoCamPage')?'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
        :(e&&(e.name==='NotFoundError'||e.name==='NotReadableError'))?'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
        :(e&&e.name==='NotAllowedError')?'カメラが つかえません。先生に カメラを ゆるして もらってね。'
        :'じゅんびが できませんでした（'+(e&&(e.name||e.message)||'')+'）。インターネットに つながっているか みてね。';
    }
  };
  function loop(){
    raf=requestAnimationFrame(loop);
    if(!lm||o.video.readyState<2||o.video.currentTime===lastT) return;
    lastT=o.video.currentTime;
    const res=o.kind==='hand'?lm.detectForVideo(o.video,performance.now()):lm.detectForVideo(o.video,performance.now());
    const L=res.landmarks||[];
    if(o.kind==='hand'){ const H=L.map(mirror); o.onFrame(H); point(H[0]&&H[0][8]); }
    else { const B=L[0]?mirror(L[0]):null; o.onFrame(B);
      // 上げた ほうの 手の 人さし指（pose の 19・20）で ボタンを おす
      point(B&&[B[19],B[20]].filter(p=>p&&p.v>0.5).sort((a,b)=>a.y-b.y)[0]); }
  }
  function point(p){ if(window.RsTe) window.RsTe.point(p?p.x:null, p?p.y:null); }
  return {stop(){ cancelAnimationFrame(raf); point(null); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }};
}

// 体の 点の 番号（MediaPipe Pose）
const P={nose:0,lEar:7,rEar:8,lSh:11,rSh:12,lWr:15,rWr:16};
window.RC={TEST,colors,fit,tag,ease,clamp,camera,P};
})();
</script>

<script>
/* ===== 雲と 天気の きまり（計算は ここ 1か所） ===== */
// --- お手本（教科書のような 動き・ネットなし） ---
//   地図の 1目もりは 約20km。雲は 1日に 約500km（24目もり）西から 東へ 動く（少し 北へ）。
//   1日ごとの 表で 福岡→大阪→東京 と 雨が うつるのが 見えるよう、本当より 少し ゆっくり。
const KM = {
  DAYS:4, SPEED:24, NORTH:4,
  BLOBS:[ {x:-55,y:-29,r:10,rain:1}, {x:-49,y:-23,r:7,rain:1}, {x:-62,y:-36,r:8}, {x:-42,y:-33,r:7}, {x:-52,y:-16,r:7}, {x:-40,y:-25,r:6},
          {x:-70,y:-26,r:8}, {x:-76,y:-33,r:6} ],
  at(d){ return KM.BLOBS.map(b=>({...b, x:b.x+d*KM.SPEED, y:b.y+d*KM.NORTH})); },
  weather(x,y,d){ let w='hare';
    for(const b of KM.at(d)){ const r=Math.hypot(x-b.x,y-b.y); if(b.rain&&r<b.r*1.05) return 'ame'; if(r<b.r*1.25) w='kumori'; } return w; },
  // 地図の 点での 雲の 量・雨（0〜1）
  field(x,y,d){ let c=0,r=0; for(const b of KM.at(d)){ const q=((x-b.x)**2+(y-b.y)**2)/(b.r*b.r); const v=Math.exp(-q*1.1); c+=v; if(b.rain) r+=v; } return [Math.min(1,c*1.2), Math.min(1,r*1.3)]; },

//   町3つ＋雲を 見る 点42こ（3度ごと）。1日を 6〜18時で まとめる（教科書の 雲画像と 同じく 1日 1まい）。
const WX = {
  CITY:{'福岡':[33.59,130.40],'大阪':[34.69,135.50],'東京':[35.69,139.69]},
  LA0:31, LO0:128, STEP:3, NLA:6, NLO:7,
  get GRID(){ const a=[]; for(let i=0;i<WX.NLA;i++) for(let j=0;j<WX.NLO;j++) a.push([WX.LA0+i*WX.STEP, WX.LO0+j*WX.STEP]); return a; },
  // 緯度経度 ↔ 地図の 目もり（地図の 点7つで 合わせた。ずれは 50km ほど）
  toMap(la,lo){ return {x:4.4407*lo+0.1876*la-614.86, y:-0.0974*lo+5.9154*la-210.69}; },
  toLL(x,y){ const a=4.4407,b=0.1876,c=-0.0974,d=5.9154, X=x+614.86, Y=y+210.69, D=a*d-b*c; return {lo:(X*d-b*Y)/D, la:(a*Y-c*X)/D}; },
  pts(){ return [...Object.values(WX.CITY),...WX.GRID]; },
  url(){ const P=WX.pts(); return 'https://api.open-meteo.com/v1/forecast?latitude='+P.map(p=>p[0]).join(',')+'&longitude='+P.map(p=>p[1]).join(',')
      +'&hourly=cloud_cover,precipitation,snowfall&timezone=Asia%2FTokyo&forecast_days=4'; },
  urlPast(start,end){ const P=WX.pts(); return 'https://archive-api.open-meteo.com/v1/archive?latitude='+P.map(p=>p[0]).join(',')+'&longitude='+P.map(p=>p[1]).join(',')
      +'&hourly=cloud_cover,precipitation,snowfall&timezone=Asia%2FTokyo&start_date='+start+'&end_date='+end; },
  // 1日の 天気：雨（雪）の 量 1mm 以上で 雨（雪）、雲の 量 70% 以上で くもり、ほかは 晴れ
  day(cloud,rain,snow){ if(cloud==null) return null; if(rain>=1) return snow>0?'yuki':'ame'; return cloud>=70?'kumori':'hare'; },
  parse(j){ const A=Array.isArray(j)?j:[j], names=Object.keys(WX.CITY), n=names.length;
    if(A.length!==n+WX.GRID.length) throw new Error('数が あわない');
    const T=A[0].hourly.time, days=[];
    for(let h=0;h+24<=T.length;h+=24){ if(!/T00:00$/.test(T[h])) throw new Error('時こくが あわない'); days.push({date:T[h].slice(0,10), a:h+6, b:h+18}); }
    const agg=(H,s)=>{ let c=0,r=0,sn=0,k=0; for(let t=s.a;t<s.b;t++){ if(H.cloud_cover[t]==null) continue; c+=H.cloud_cover[t]; r+=H.precipitation[t]||0; sn+=H.snowfall[t]||0; k++; } return k?{c:c/k,r,sn}:null; };
    const city={}; names.forEach((nm,i)=>{ city[nm]=days.map(s=>{ const g=agg(A[i].hourly,s); return g?WX.day(g.c,g.r,g.sn):null; }); });
    const grid=WX.GRID.map((g,i)=>days.map(s=>agg(A[n+i].hourly,s)||{c:0,r:0}));
    return {days, city, grid}; },
  async get(url,key){
    try{ const s=localStorage.getItem(key); if(s) return WX.parse(JSON.parse(s)); }catch(_){}
    const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch(url,{signal:ctl.signal}); clearTimeout(tm);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(), data=WX.parse(j);
    try{ localStorage.setItem(key,JSON.stringify(j)); }catch(_){}
    return data; },
  loadToday(today){ return WX.get(WX.url(),'rc-kumo4-'+today); },
  loadPast(start){ const e=new Date(start+'T00:00'); e.setDate(e.getDate()+3); return WX.get(WX.urlPast(start,ymd(e)),'rc-kumo4-past-'+start); },
  // 本物の 地図の 点での 雲・雨（3度ごとの 点を なめらかに つなぐ）
  field(data,x,y,i){ const {la,lo}=WX.toLL(x,y), fi=(la-WX.LA0)/WX.STEP, fj=(lo-WX.LO0)/WX.STEP;
    // 点の 外がわへ 行くほど うすく（四角く 切れない）
    const edge=RC.clamp(Math.min(fi+0.8,fj+0.8,WX.NLA-0.2-fi,WX.NLO-0.2-fj)/1.0,0,1); if(edge<=0) return [0,0];
    const i0=RC.clamp(Math.floor(fi),0,WX.NLA-2), j0=RC.clamp(Math.floor(fj),0,WX.NLO-2), sm=t=>t*t*(3-2*t);
    const u=sm(RC.clamp(fi-i0,0,1)), v=sm(RC.clamp(fj-j0,0,1));          // つなぎ目が 見えないよう なめらかに
    const g=(a,b)=>data.grid[a*WX.NLO+b][i], mix=k=>(g(i0,j0)[k]*(1-v)+g(i0,j0+1)[k]*v)*(1-u)+(g(i0+1,j0)[k]*(1-v)+g(i0+1,j0+1)[k]*v)*u;
    return [RC.clamp((mix('c')-45)/45,0,1)*edge, RC.clamp(mix('r')/4,0,1)*edge]; },
};

  { const w=W('大阪',1); if(w&&w!=='yuki') Q.push({id:'read', cat:'map', day:1, q:S.head(1)+'の 大阪の 天気は？', ch:WCH, a:w, note:'白い 雲が かかると くもり、青い 点が あると 雨'}); }
  const f=JAPAN.cities.map(c=>[c.n,first(c.n)]).filter(x=>x[1]>=0).sort((a,b)=>a[1]-b[1]);
  if(f.length&&(f.length===1||f[0][1]<f[1][1])) Q.push({id:'first', cat:'map', q:'3日の うちで、さいしょに 雨に なった 町は？', ch:CITY_CH(), a:f[0][0], note:'西の 町から 天気が かわっていく'});
  // 知しきは ラウンドごとに じゅんばんを ずらして まぜる（同じ 問題が つづかない）
  let seed=(round||0)*7919+13; const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
  const pool=BANK.slice(); for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  if(!round){ pool.sort((a,b)=>(b.id==='sky9')-(a.id==='sky9')); }       // 1回目は 雲の 量から
  while(Q.length<10&&pool.length) Q.push(pool.shift());
  return Q;
}

function drawBase(){
  const d=window.devicePixelRatio||1; base.width=Math.round(G.w*d); base.height=Math.round(G.h*d);
  const c=base.getContext('2d'); c.setTransform(d,0,0,d,0,0);
  c.fillStyle=C.stage; c.fillRect(0,0,G.w,G.h);
  c.strokeStyle=C.grid; c.lineWidth=1;
  const line=(a,b)=>{ const p=px(a.x,a.y),q=px(b.x,b.y); c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(q.x,q.y); c.stroke(); };
  for(let la=25;la<=50;la+=5) line(WX.toMap(la,110),WX.toMap(la,160));
  for(let lo=110;lo<=160;lo+=5) line(WX.toMap(20,lo),WX.toMap(55,lo));
  c.fillStyle=C.land; c.strokeStyle=C.landedge; c.lineWidth=1.2;
  for(const P of JAPAN.polys){ c.beginPath(); P.forEach((p,i)=>{ const q=px(p[0],p[1]); i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y); }); c.closePath(); c.fill(); c.stroke(); }
}

// 雲（小さい 画像に かいて 広げる。細かい もようは 1回だけ 作る）
const NZ=128, noise=new Float32Array(NZ*NZ);
(function(){ const h=(a,b)=>{ let z=Math.imul(a,374761393)^Math.imul(b,668265263); z=Math.imul(z^(z>>>13),1274126177); return ((z^(z>>>16))>>>0)/4294967295; };
  const vn=(x,y)=>{ const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy), m=k=>((k%NZ)+NZ)%NZ;
    return (h(m(ix),m(iy))*(1-u)+h(m(ix+1),m(iy))*u)*(1-v)+(h(m(ix),m(iy+1))*(1-u)+h(m(ix+1),m(iy+1))*u)*v; };
  for(let y=0;y<NZ;y++) for(let x=0;x<NZ;x++){ let n=0,a=0.5,f=1/16; for(let k=0;k<4;k++){ n+=a*vn(x*f*16/NZ*8,y*f*16/NZ*8); a*=0.5; f*=2; } noise[y*NZ+x]=n/0.94; } })();
const nz=(x,y)=>{ const ix=((Math.floor(x)%NZ)+NZ)%NZ, iy=((Math.floor(y)%NZ)+NZ)%NZ; return noise[iy*NZ+ix]; };
const cloud={key:'', cv:document.createElement('canvas'), wet:null, w:0, h:0};
function drawClouds(c){
  const key=[R.d.toFixed(3),R.src,G.w,G.h,S===cloud.S].join('/');
  if(cloud.key!==key){ cloud.key=key; cloud.S=S;
    const w=Math.min(260,Math.ceil(G.w/3)), h=Math.ceil(w*G.h/G.w), cv=cloud.cv, ctx=cv.getContext('2d');
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
    const im=ctx.createImageData(w,h), wet=new Float32Array(w*h), [dx,dy]=S.drift(R.d), sx=G.w/w, sy=G.h/h;
    const W=[1,3,5].map(k=>parseInt(C.cloud.slice(k,k+2),16));        // 雲の 色（:root の --rc-cloud）
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const p=mp((x+0.5)*sx,(y+0.5)*sy), [cv0,rv]=S.field(p.x,p.y,R.d);
      if(cv0<=0.02){ continue; }
      const n=nz((p.x-dx)*3.2,(p.y-dy)*3.2), a=RC.clamp((cv0*1.15+(n-0.5)*0.9-0.25)*2.2,0,1);
      if(a<=0) continue;
      const i=y*w+x, br=0.78+0.22*RC.clamp(cv0+n*0.4-0.2,0,1);
      im.data[i*4]=W[0]*br; im.data[i*4+1]=W[1]*br; im.data[i*4+2]=W[2]*br; im.data[i*4+3]=a*240; wet[i]=a>0.4?rv:0;
    }
    ctx.putImageData(im,0,0); cloud.wet=wet; cloud.w=w; cloud.h=h;
  }
  c.imageSmoothingEnabled=true; c.drawImage(cloud.cv,0,0,G.w,G.h);
  // 雨（アメダスのような 青い 点。色だけで なく 点の もようで 伝える）
  c.fillStyle=C.rain; const step=9, sx=cloud.w/G.w, sy=cloud.h/G.h;
  for(let Y=step/2;Y<G.h;Y+=step) for(let X=step/2+((Y/step)%2?step/2:0);X<G.w;X+=step){
    const v=cloud.wet[Math.floor(Y*sy)*cloud.w+Math.floor(X*sx)]; if(v>0.3){ c.beginPath(); c.arc(X,Y,1.6+v*1.2,0,Math.PI*2); c.fill(); } }
}
// ②で 正しく 答えたら、西から 東へ 大きな 矢じるし
function drawArrow(c){
  if(!R.arrowT||(R.step===2&&QZ[R.qi]&&QZ[R.qi].id!=='dir')) return; const t=Math.min(1,R.arrowT), y=G.h*0.42, x0=G.w*0.12, x1=x0+(G.w*0.76)*t, hw=Math.max(14,G.h*0.035);
  c.lineCap='round'; c.lineJoin='round';
  for(const [col,lw] of [[C.arrowedge,hw*0.9+6],[C.arrow,hw*0.9]]){ c.strokeStyle=col; c.lineWidth=lw; c.beginPath(); c.moveTo(x0,y); c.lineTo(x1-hw,y); c.stroke(); }
  c.fillStyle=C.arrow; c.strokeStyle=C.arrowedge; c.lineWidth=3; c.beginPath(); c.moveTo(x1+hw*0.6,y); c.lineTo(x1-hw*1.4,y-hw*1.5); c.lineTo(x1-hw*1.4,y+hw*1.5); c.closePath(); c.fill(); c.stroke();
}
function drawMarks(c){
  const di=Math.round(R.d);
  for(const t of JAPAN.cities){ const q=px(t.x,t.y), w=hidden(t.n,di)?null:S.cityW(t,di);
    c.fillStyle=C.city; c.strokeStyle=C.cityedge; c.lineWidth=2; c.beginPath(); c.arc(q.x,q.y,6,0,Math.PI*2); c.fill(); c.stroke();
    RC.tag(c,R.step===2?t.n:t.n+' '+(w?KM.NAME[w]:'？'),q.x,q.y-20,14,C.ink,C.tagbg); }     // クイズの 間は 名前だけ（答えを 見せない）
  RC.tag(c,'西',22,G.h*0.5,18,C.ink,C.tagbg); RC.tag(c,'東',G.w-22,G.h*0.5,18,C.ink,C.tagbg);
  // 北と ものさし（右上。下の 日の ボタンと かさならない）
  const L=500/(111.32*Math.cos(35*Math.PI/180))*4.4407*M.s, y=66, x=G.w-16-L;
  c.strokeStyle=C.tagbg; c.lineWidth=3; c.beginPath(); c.moveTo(x,y-6); c.lineTo(x,y); c.lineTo(x+L,y); c.lineTo(x+L,y-6); c.stroke();
  RC.tag(c,'500km',x+L/2,y-16,14,C.ink,C.tagbg);
  const nx=x-26; RC.tag(c,'北',nx,y-34,14,C.ink,C.tagbg);               // ものさしの 左に 北の 矢じるし
  c.beginPath(); c.moveTo(nx,y+2); c.lineTo(nx,y-20); c.moveTo(nx-6,y-14); c.lineTo(nx,y-20); c.lineTo(nx+6,y-14); c.stroke();
}

// よそうが まだなら さいごの 日へは 行けない・その日の 東京は ？
const locked=()=>!R.guess;
const hidden=(city,i)=>locked()&&city===CITY_Q&&i===S.n-1;
function setDay(d){ R.dT=RC.clamp(d,0,S.n-1-(locked()?1:0)); }
function guess(w){ R.guess=w; }
function answerDir(k){ R.dir=k; if(k==='e') R.arrowT=0.001; }
let QZ=[];
const hasPh=q=>q&&q.ph&&typeof PHOTO!=='undefined'&&PHOTO[q.ph];
function showPhoto(q){ const P=hasPh(q); if(!P) return; $('rcPhotoImg').src=P.src; $('rcPhotoImg').alt=q.cap; $('rcPhotoCap').textContent=q.cap; $('rcPhoto').hidden=false; R.photo=q.ph; }
function hidePhoto(){ $('rcPhoto').hidden=true; R.photo=null; }
function quizAnswer(k){ const q=QZ[R.qi]; if(!q||R.qok[q.id]) return; R.qa=k; if(q.id==='dir') answerDir(k); if(k===q.a){ R.qok[q.id]=true; if(!q.pre) showPhoto(q); } else R.wrong[q.id+k]=true; }
function quizOpen(){ const q=QZ[R.qi]; if(!q) return; if(q.day!=null) setDay(q.day); if(q.pre) showPhoto(q); }
function quizNext(){ hidePhoto(); R.qa=null;
  if(R.qi+1>=QZ.length){ R.round++; QZ=makeQuiz(R.round); R.qi=0; R.qok={}; R.wrong={}; } else R.qi++;      // さいごまで 行ったら べつの 問題で もう一回
  quizOpen(); }
function setStep(n){ hidePhoto(); R.step=n; if(n===2) quizOpen(); }

function table(){
  const now=Math.round(R.d);
  let h='<tr><th></th>'+JAPAN.cities.map(c=>`<th scope="col">${c.n}</th>`).join('')+'</tr>';
  for(let i=0;i<S.n;i++) h+=`<tr><th scope="row" data-now="${i===now?1:0}">${S.head(i)}</th>`+JAPAN.cities.map(c=>{
    if(hidden(c.n,i)) return '<td class="rc-q">？</td>'; const w=R.rec[c.n+i]; return `<td>${w?ICON[w]+'<span>'+KM.NAME[w]+'</span>':''}</td>`; }).join('')+'</tr>';
  if(table.k!==h){ table.k=h; $('rcTable').innerHTML=h; }
}
function card(){
  let h;
  if(R.step===1) h='<h2>雲画像の 見かた</h2><div class="rc-leg">'
    +'<div><svg viewBox="0 0 24 24"><rect class="rc-f-stage" width="24" height="24" rx="4"/><path class="rc-f-white" d="M5 16a4 4 0 0 1 3-6 5 5 0 0 1 9 1 3 3 0 0 1 1 5z"/></svg>白い 所＝雲</div>'
    +'<div><svg viewBox="0 0 24 24"><rect class="rc-f-stage" width="24" height="24" rx="4"/><path class="rc-f-white" d="M5 16a4 4 0 0 1 3-6 5 5 0 0 1 9 1 3 3 0 0 1 1 5z"/><circle cx="8" cy="19" r="1.6" class="rc-f-rainp"/><circle cx="12" cy="19" r="1.6" class="rc-f-rainp"/><circle cx="16" cy="19" r="1.6" class="rc-f-rainp"/></svg>青い 点＝雨</div></div>';
  else if(R.step===2){ const q=QZ[R.qi], ok=!!R.qok[q.id];
    const ct=CAT[q.cat]||CAT.map, last=R.qi===QZ.length-1;
    h='<div class="rc-qhead"><span class="rc-chip"><svg viewBox="0 0 24 24">'+ct.i+'</svg>'+ct.t+'</span><span class="rc-qn" aria-hidden="true">'+QZ.map((x,i)=>`<i data-s="${i===R.qi?'now':R.qok[x.id]?'ok':''}"></i>`).join('')+'</span></div>'
    +(q.sky!=null?SKY(q.sky):'')+`<p class="rc-q2">${q.q}</p><div class="rc-pick rc-big2${q.ch.length>3?' rc-wrap':''}${q.ch[0].arrow?' rc-dir':''}">`
    +q.ch.map(c=>{ const st=ok&&c.k===q.a?'ok':R.wrong[q.id+c.k]?'ng':''; return `<button type="button" data-qk="${c.k}" data-st="${st}" aria-pressed="${R.qa===c.k}"${c.arrow?` aria-label="${c.t}"`:''}>${c.arrow?`<svg viewBox="0 0 24 24">${ARROW[c.arrow]}</svg>`:c.icon||''}${c.t}${st?`<em aria-hidden="true">${st==='ok'?'○':'×'}</em>`:''}</button>`; }).join('')+'</div>'
    +(ok?`<p class="rc-note"><b class="rc-ok">○</b> ${q.note}</p>`:R.qa?'<p class="rc-note">もう一度 考えてみよう</p>':'')
    +(ok?'<div class="rc-qrow">'+(hasPh(q)?'<button type="button" class="rc-seeph" id="rcSeePh" aria-label="写真を 見る"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M4 18l6-5 4 3 3-2 4 4"/></svg>写真</button>':'')
      +`<button type="button" class="rc-qnext" id="rcQNext" aria-label="${last?'べつの 問題で もう一回':'次の もんだい'}">${last?'もう一回':'次'}<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>`:''); }
  else{ const A=JAPAN.cities.find(c=>c.n===CITY_Q), ans=S.cityW(A,S.n-1), seen=R.guess&&Math.round(R.d)===S.n-1;
    h=`<h2>${S.head(S.n-1)}の ${CITY_Q}は？</h2><div class="rc-pick">`
    +['hare','kumori','ame'].map(w=>`<button type="button" data-w="${w}" aria-pressed="${R.guess===w}">${ICON[w]}${KM.NAME[w]}</button>`).join('')+'</div>'
    +(seen?`<p>よそう ${KM.NAME[R.guess]} → 答え ${KM.NAME[ans]}${R.guess===ans?' <span class="rc-ok">○</span>':''}</p>`:''); }
  if(card.k!==h){ card.k=h; $('rcCard').innerHTML=h; }
  const pn=document.querySelector('.rc-pn'); if(pn.dataset.step!==String(R.step)) pn.dataset.step=R.step;
}
function step(){ R.d=Math.abs(R.d-R.dT)<0.0005?R.dT:RC.ease(R.d,R.dT,0.18);
  const i=Math.round(R.d); if(Math.abs(R.d-i)<0.08) for(const c of JAPAN.cities){ if(hidden(c.n,i)) continue; const w=S.cityW(c,i); if(w) R.rec[c.n+i]=w; }
  if(R.arrowT&&R.arrowT<1) R.arrowT=Math.min(1,R.arrowT+0.03); }
function draw(){
  if(!G) return; const c=G.c; c.clearRect(0,0,G.w,G.h);
  c.drawImage(base,0,0,G.w,G.h); drawClouds(c); drawArrow(c); drawMarks(c);
  const di=Math.round(R.d), dt=S.big(di)+(S.future(di)?'<small>予報</small>':'');
  if($('rcDateTag').innerHTML!==dt) $('rcDateTag').innerHTML=dt;
  // 日の 点（さいごの 日は よそうするまで 点線）
  const dh=Array.from({length:S.n},(_,i)=>`<button type="button" data-i="${i}" aria-label="${S.head(i)}" aria-current="${i===di}" data-lock="${hidden(CITY_Q,i)?1:0}"${hidden(CITY_Q,i)?' disabled':''}><i></i></button>`).join('');
  if(draw.k!==dh){ draw.k=dh; $('rcDots').innerHTML=dh; }
  document.querySelectorAll('#rcSteps button').forEach(b=>b.setAttribute('aria-current',+b.dataset.s===R.step?'step':'false'));
  table(); card();
  $('rcMsg').textContent=R.loading?'天気を 読んでいます…':R.err;
  $('rcPrev').disabled=R.dT<=0; const last=S.n-1-(locked()?1:0); $('rcNext').disabled=R.dT>=last;
  $('rcNext').classList.toggle('rc-go', R.step===3&&!!R.guess&&Math.round(R.dT)<S.n-1);
}
let raf=0; function loop(){ raf=requestAnimationFrame(loop); step(); draw(); }
function settle(){ R.d=R.dT; if(R.arrowT) R.arrowT=1; step(); draw(); }
function reset(){ hidePhoto(); R.rec={}; R.dT=0; R.d=0; R.guess=null; R.dir=null; R.arrowT=0; R.step=1; R.round=0; QZ=makeQuiz(0); R.qi=0; R.qa=null; R.qok={}; R.wrong={}; }

// 資料を えらぶ（先生用）
async function setSource(m,start){
  R.err=''; R.src=m;
  document.querySelectorAll('#rcTeach [data-src]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.src===m)));
  if(m==='otehon'){ S=srcOtehon(); reset(); return; }
  if(m==='date'){ start=start||$('rcDate').value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||start>daysAgo(6)||start<'1940-01-01'){ R.err='6日より 前の 日を えらんでね'; return; } }
  R.loading=true;
  try{ const data=m==='date'?await WX.loadPast(start):await WX.loadToday(todayStr()); R.loading=false;
    if(R.src!==m) return; S=srcData(data,todayStr()); reset(); }
  catch(e){ R.loading=false; R.err='天気が 読めませんでした。お手本に もどしました'; R.src='otehon'; S=srcOtehon(); reset();
    document.querySelectorAll('#rcTeach [data-src]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.src==='otehon'))); }
}

$('rcSteps').onclick=e=>{ const b=e.target.closest('[data-s]'); if(b) setStep(+b.dataset.s); };
$('rcClear').onclick=reset;
$('rcGear').onclick=()=>{ const o=$('rcTeach').hidden; $('rcTeach').hidden=!o; $('rcGear').setAttribute('aria-expanded',String(o)); };
$('rcTeach').onclick=e=>{ const b=e.target.closest('[data-src]'); if(b) setSource(b.dataset.src); };
$('rcDate').max=daysAgo(6); $('rcDate').min='1940-01-01'; $('rcDate').value=daysAgo(14);
$('rcDate').onchange=()=>setSource('date');
$('rcCard').onclick=e=>{ const w=e.target.closest('[data-w]'), q=e.target.closest('[data-qk]'); if(w) guess(w.dataset.w); if(q) quizAnswer(q.dataset.qk); if(e.target.closest('#rcQNext')) quizNext(); if(e.target.closest('#rcSeePh')) showPhoto(QZ[R.qi]); };
$('rcPhotoX').onclick=hidePhoto;
// 写真の 出典も ⓘ の 中へ（同じ 人の 写真は 1行に まとめる）
if(typeof PHOTO!=='undefined'){ const L=[...new Set(Object.values(PHOTO).map(p=>p.credit))]; $('rcSrcPh').innerHTML=L.map(t=>'<br>'+t.replace(/[<>&]/g,'')).join(''); }
$('rcCredit').onclick=()=>{ const h=!$('rcSrc').hidden; $('rcSrc').hidden=h; $('rcCredit').setAttribute('aria-expanded',String(!h)); };
$('rcPrev').onclick=()=>setDay(Math.round(R.dT)-1);
$('rcNext').onclick=()=>setDay(Math.round(R.dT)+1);
$('rcDots').onclick=e=>{ const b=e.target.closest('[data-i]'); if(b&&!b.disabled) setDay(+b.dataset.i); };
// 地図を 左右に なぞる（ひだり＝はじめ、みぎ＝おわり）
let drag=false;
const onMap=e=>{ const r=$('rcStage').getBoundingClientRect(); setDay(((e.clientX-r.left)/r.width-0.1)/0.8*(S.n-1)); };
$('rcStage').addEventListener('pointerdown',e=>{ if(e.target.closest('button,.rc-src,.rc-photo')) return; drag=true; try{ $('rcStage').setPointerCapture(e.pointerId); }catch(_){} onMap(e); });
$('rcStage').addEventListener('pointermove',e=>{ if(drag) onMap(e); });
for(const t of ['pointerup','pointercancel']) $('rcStage').addEventListener(t,()=>{ drag=false; });
// 手で：ボタンの 上で とめて おす（前・次・日の 点・クイズの 答え・①②③）
RsTe.bindButton($('rsTeBtn'),{hint:'人さし指を カメラに 見せてね'});
fit(); reset(); loop();
window.R=R; window.KM=KM; window.WX=WX; window.rcSettle=settle; window.rcSetDay=setDay; window.rcSetSource=setSource; window.rcSrc=()=>S;
window.rcGuess=guess; window.rcAnswerDir=answerDir; window.rcQuiz=()=>QZ; window.rcQuizAnswer=quizAnswer; window.rcQuizNext=quizNext; window.rcBank=()=>BANK; window.rcHidePhoto=hidePhoto; window.rcStep=setStep; window.rcReset=reset;
</script>

      '.rlh-home.rlh-float{position:fixed;left:12px;bottom:12px;z-index:9999;margin:0}';
    document.head.appendChild(st);
    var bar=[].slice.call(document.querySelectorAll('[class$="-top"],[class*="-top "]')).filter(function(e){
      var r=e.getBoundingClientRect(); return r.top<20&&r.height>=44&&getComputedStyle(e).display.indexOf('flex')>=0;})[0];
    if(bar) bar.insertBefore(a,bar.firstChild); else { a.classList.add('rlh-float'); document.body.appendChild(a); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',put); else put();
})();
