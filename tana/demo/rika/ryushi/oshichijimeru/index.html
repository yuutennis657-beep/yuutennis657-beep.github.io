/* 見本 v0.1（2026-11-07）理科ラボ／粒子／4年 とじこめた空気と水。両手の あいだを せまくすると ピストンを おす */
:root{
  /* 理科ラボ 粒子の 部屋の 色（4つの 部屋で 同じ 名前）。色は ここだけに 書く */
  --rl-bg:#ffffff; --rl-ink:#1f2937; --rl-accent:#2ba3d9; --rl-accent2:#7fd1ee; --rl-soft:#e6f6fc;
  /* この 部屋の 意味の 色 */
  --rp-sub:#4b5563; --rp-mute:#6b7280; --rp-line:#d1d5db; --rp-btn:#f3f4f6; --rp-deep:#0b6e99;
  --rp-ok:#1b7f3b; --rp-warn:#b45309; --rp-warn2:#d97706; --rp-hot:#c2410c; --rp-hot2:#fb923c; --rp-cold:#1d4ed8;
  --rp-red:#dc2626; --rp-err:#b91c1c; --rp-flame:#fde68a; --rp-clay:#e7d3b0; --rp-brown:#78350f; --rp-alum:#7c3aed;
  --rp-t2:#93c5fd; --rp-t4:#f97316;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--rl-bg);color:var(--rl-ink);
  font-family:"BIZ UDPGothic",sans-serif;font-size:16px;overflow:hidden}

.rp-tabs button{min-height:44px;padding:0 14px;border:0;background:var(--rl-bg);font-size:16px;display:flex;align-items:center;gap:6px}

.rp-stage{position:relative;border-radius:12px;overflow:hidden;background:var(--rl-soft);min-height:0;touch-action:none}
.rp-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.rp-veil{position:absolute;inset:0;background:color-mix(in srgb, var(--rl-bg) 55%, transparent)}

.rp-msg:empty{display:none}
.rp-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--rl-bg);padding:16px}

.rp-big:disabled{opacity:.6}
.rp-err{color:var(--rp-err);font-size:16px;max-width:80%;text-align:center}
.rp-err[hidden],.rp-start[hidden]{display:none!important}
.rp-side{display:flex;flex-direction:column;gap:10px;min-height:0}

.rp-bar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--rp-warn) 0 6px,var(--rp-warn2) 6px 12px)}

.rp-say[data-k="ok"]{border-color:var(--rp-ok);color:var(--rp-ok)}

@media (max-width:860px){

  .rp-tabs button{padding:0 10px}
}
html #rsTeBtn[aria-pressed="true"]{background:var(--rl-accent);color:var(--rl-ink);border-color:var(--rl-ink)}   /* 手で：おしている ときも 字は こい色 */

.rp-big.rp-big2{background:var(--rl-bg);border:2px solid var(--rl-ink)}
</style>

<script>/* 手で おす（生命の 部屋の 部品 seimei/_parts/rs-te.js を tools_parts.py で 中に 入れる） */
/*RS-TE*/
/* ===== 手で おす（生命の 部屋で 共通） =====
   カメラの 手を 画面 ぜんたいの「しるし（わ）」に うつす。ボタンの 上で 手を とめると、わが みちて おせる。
   星ざ・社会地図の「とめて おす」と 同じ 考え。タップや マウスは そのまま つかえる（どっちでも できる）。
   つかい方：
     RsTe.point(nx,ny,box)  … カメラの 中の 位置（0〜1・かがみの むき）。null で しるしを けす
     RsTe.startHand({onPoint, onLost}) … カメラと 手の トラッキングを はじめる（人さし指の 先＝しるし）
     RsTe.stop()            … 手を やめる
     RsTe.cur               … いまの しるしの 位置（画面の px）
*/
(function(){
  const DWELL=1100;                 // とめて おすまでの 時間（ミリ秒）
  const BOX=[0.1,0.1,0.9,0.9];      // カメラの この はんいを 画面 ぜんたいに 広げる（はしまで とどくように）
  const SM=0.5;
  const cv=document.createElement('canvas'); cv.className='rs-te'; cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60';
  const tip=document.createElement('div'); tip.className='rs-te-tip'; tip.hidden=true;
  tip.style.cssText='position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:61;pointer-events:none;background:#fff;border:2px solid var(--rl-ink,#1f2937);border-radius:22px;padding:8px 16px;font-size:16px;font-weight:700;color:var(--rl-ink,#1f2937);white-space:nowrap';
  const st=document.createElement('style');
  st.textContent='.rs-te-near{box-shadow:inset 0 0 0 4px var(--rl-accent,#23784a)!important}#rsTeBtn[aria-pressed="true"]{background:var(--rl-accent,#23784a);color:#fff;border-color:var(--rl-accent,#23784a)}';
  const g=cv.getContext('2d');
  function size(){ const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; g.setTransform(d,0,0,d,0,0); }
  function mount(){ document.head.appendChild(st); document.body.appendChild(cv); document.body.appendChild(tip); size(); }
  if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
  addEventListener('resize',size);
  const T={cur:null, el:null, t0:0, done:false, on:false, dwell:DWELL, clicks:0};
  const cl=v=>Math.max(0,Math.min(1,v));
  T.point=function(nx,ny,box){
    if(nx==null){ T.cur=null; return null; }
    const b=box||BOX, x=cl((nx-b[0])/(b[2]-b[0]))*innerWidth, y=cl((ny-b[1])/(b[3]-b[1]))*innerHeight;
    if(!T.cur) T.cur={x,y}; else { T.cur.x+=(x-T.cur.x)*SM; T.cur.y+=(y-T.cur.y)*SM; }
    return T.cur;
  };
  T.say=function(t){ tip.hidden=!t; if(t && tip.textContent!==t) tip.textContent=t; };
  function target(){
    const c=T.cur; if(!c) return null;
    const e=document.elementFromPoint(c.x,c.y), b=e&&e.closest&&e.closest('button');
    return b && !b.disabled && b.offsetParent && !b.closest('[hidden]') ? b : null;
  }
  function frame(now){
    requestAnimationFrame(frame);
    g.clearRect(0,0,innerWidth,innerHeight);
    const c=T.cur, el=target();
    if(el!==T.el){ if(T.el) T.el.classList.remove('rs-te-near'); T.el=el; T.t0=now; T.done=false; if(el) el.classList.add('rs-te-near'); }
    let prog=0;
    if(el && !T.done){ prog=Math.min(1,(now-T.t0)/T.dwell); if(prog>=1){ T.done=true; T.clicks++; el.click(); } }
    if(!c) return;
    const R=Math.max(20,Math.min(innerWidth,innerHeight)*0.035);
    const ink=getComputedStyle(document.documentElement).getPropertyValue('--rl-ink').trim()||'#1f2937';
    const acc=getComputedStyle(document.documentElement).getPropertyValue('--rl-accent').trim()||'#23784a';
    g.lineWidth=7; g.strokeStyle='#fff'; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.lineWidth=3; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.fillStyle=ink; g.beginPath(); g.arc(c.x,c.y,4,0,7); g.fill();
    // みちる わ：こい ふちの 上に 部屋の 色（黄など うすい 色でも 白地で 見える）
    if(prog>0 && !T.done){ g.lineCap='round'; const a1=-Math.PI/2+prog*Math.PI*2;
      g.lineWidth=11; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke();
      g.lineWidth=6; g.strokeStyle=acc; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke(); }
  }
  requestAnimationFrame(frame);

  /* ---- 手の トラッキング（人さし指の 先） ---- */
  const VER='0.10.14';
  let hands=null, video=null, stream=null, lastT=-1, onPoint=null, onLost=null, seen=0;
  async function load(){
    const vision=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
    const fs=await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
    const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:1});
    try{ return await vision.HandLandmarker.createFromOptions(fs,o('GPU')); }
    catch(e){ return await vision.HandLandmarker.createFromOptions(fs,o('CPU')); }
  }
  T.errText=function(e){
    return e&&e.name==='NoCamPage' ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : e&&(e.name==='NotFoundError'||e.name==='NotReadableError') ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : e&&e.name==='NotAllowedError' ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした。インターネットに つながっているか みてね。';
  };
  T.startHand=async function(opt){
    opt=opt||{}; onPoint=opt.onPoint||null; onLost=opt.onLost||null; opt_hint=opt.hint!=null?opt.hint:'人さし指を カメラに 見せてね';
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ const e=new Error(); e.name='NoCamPage'; throw e; }
    if(!video){ video=document.createElement('video'); video.playsInline=true; video.muted=true; video.setAttribute('playsinline','');
      video.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none'; document.body.appendChild(video); }
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:960},height:{ideal:540},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    hands=hands||await load();
    T.on=true; T.video=video; seen=performance.now(); requestAnimationFrame(track);
    return video;
  };
  function track(){
    if(!T.on) return;
    requestAnimationFrame(track);
    if(!hands||video.readyState<2||video.currentTime===lastT) return;
    lastT=video.currentTime;
    const now=performance.now(), r=hands.detectForVideo(video,now), L=(r.landmarks||[])[0];
    if(L){ seen=now; const c=T.point(1-L[8].x, L[8].y); T.say(''); if(onPoint) onPoint(c); }
    else { T.point(null); if(onPoint) onPoint(null); if(now-seen>1200 && opt_hint) T.say(opt_hint); if(onLost) onLost(); }
  }
  let opt_hint='人さし指を カメラに 見せてね';
  T.stop=function(){ T.on=false; T.point(null); T.say(''); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } if(onPoint) onPoint(null); };
  // 「手で」ボタン：おすと カメラの 手が はじまる。もう いちど おすと やめる
  T.bindButton=function(btn,opt){
    btn.setAttribute('aria-pressed','false');
    btn.addEventListener('click',async()=>{
      if(T.on){ T.stop(); btn.setAttribute('aria-pressed','false'); return; }
      btn.disabled=true; T.say('じゅんびちゅう…');
      try{ await T.startHand(opt); btn.setAttribute('aria-pressed','true'); T.say(''); }
      catch(e){ T.say(T.errText(e)); setTimeout(()=>T.say(''),5000); }
      finally{ btn.disabled=false; }
    });
  };
  window.RsTe=T;
})();
/*RS-TE-END*/
</script>
<script>
/* 色は :root から 読む（K＝そのまま、KA＝すきとおらせる） */
const RL_CS=getComputedStyle(document.documentElement), RL_C={};
const K=n=>RL_C[n]||(RL_C[n]=RL_CS.getPropertyValue('--'+n).trim());

const PIMG={}; for(const k in RP_PARTS){ if(k==='start') continue; const im=new Image(); im.onload=()=>{ try{ draw(); }catch(e){} }; im.src=RP_PARTS[k]; PIMG[k]=im; }
const ok=k=>!!(PIMG[k] && PIMG[k].complete && PIMG[k].naturalWidth>0);
if(RP_PARTS.start){ const sv=document.querySelector('.rp-start svg'); if(sv){ const im=new Image(); im.src=RP_PARTS.start; im.alt=''; im.className='rp-startimg'; sv.replaceWith(im); } }

/* ===== きまり（1か所） ===== */
// c：おす 強さ 0〜1。体積は はじめを 1 と する。
const RP = {
  MIN_AIR: 0.45,                       // 空気が いちばん ちぢんだ ときの 体積
  vol(mode,c){
    const air = 1 - (1-RP.MIN_AIR)*c;   // 空気は おすほど ちぢむ
    if(mode==='air') return air;
    if(mode==='water') return 1;        // 水は ちぢまない
    return 0.5 + 0.5*air;               // 空気と水：ちぢむのは 空気だけ
  },
  airVol(mode,c){ return mode==='water' ? 0 : (mode==='air' ? RP.vol(mode,c) : 0.5*(1-(1-RP.MIN_AIR)*c)); },
  force(mode,c){
    if(mode==='water') return c>0.03 ? 1 : 0;        // 水は すぐ かたい（うごかない）
    const v = 1-(1-RP.MIN_AIR)*c;                      // 空気：体積が 小さいほど 力が 大きい（1/v）
    return Math.min(1, (1/v - 1)/(1/RP.MIN_AIR - 1));
  },
  say(mode,c){
    if(c<0.05) return ['', 'おしてみよう'];
    if(mode==='water') return ['hard','水は ちぢまない'];
    if(mode==='both') return ['ok','ちぢむのは 空気だけ'];
    return c>0.7 ? ['hard','手ごたえが 大きい'] : ['ok','空気が ちぢんだ'];
  }
};
window.RP = RP;
const $ = id => document.getElementById(id);
const rp = { mode:'air', c:0, cShow:0, tsubu:false, hands:[null,null], d0:0, src:'', dots:[] };
window.rp = rp;

/* ===== 手から おす強さ ===== */
// pts：画面の 0〜1 の 手のひら（0〜2こ）
function onHands(pts){
  const list=(pts||[]).map(p=>[p.x,p.y]).sort((a,b)=>a[0]-b[0]);
  if(list.length<2){ rp.hands=[list[0]||null,null]; setMsg(list.length? 'もう 1つの 手も 見せて' : '両手を 見せて'); rp.c+=(0-rp.c)*0.15; return; }
  rp.hands=[list[0],list[1]];
  const d=Math.abs(list[1][0]-list[0][0]);
  if(!rp.d0 || d>rp.d0) rp.d0=d;                 // いちばん ひろげた 所を はじめに する
  rp.d0=Math.max(0.25, rp.d0*0.999);             // 立つ場所が かわっても あわせる
  const dMin=rp.d0*0.3;
  const c=Math.max(0,Math.min(1,(rp.d0-d)/(rp.d0-dMin)));
  rp.c+= (c-rp.c)*0.5;
  setMsg('');
}
function setMsg(t){ const el=$('rpMsg'); if(el.textContent!==t) el.textContent=t; }

/* ===== えがく ===== */
const cv=$('rpCanvas'), cx=cv.getContext('2d');
let W=0,H=0;
function fit(){ const r=$('rpStage').getBoundingClientRect(), d=window.devicePixelRatio||1;
  W=r.width; H=r.height; cv.width=Math.round(W*d); cv.height=Math.round(H*d); cx.setTransform(d,0,0,d,0,0); }
window.addEventListener('resize', fit);
// 注射器の 絵（parts/syringe_barrel.svg）は 中の場所が x60〜560・y40〜120。L（体積1の 長さ）＝中の 長さ÷1.05
function geo(){ let L=W*0.5; if(L*1.05/500*160>H*0.5) L=H*0.5/160*500/1.05; const sc=L*1.05/500; return {x0:W*0.12, L, h:80*sc, sc, y:H*0.55}; }
window.rpGeo=geo;
function mkDots(){ rp.dots=[]; for(let i=0;i<22;i++) rp.dots.push({u:Math.random(),v:Math.random(),a:Math.random()*6.28,s:0.004+Math.random()*0.004}); }
mkDots();

function draw(){
  rp.cShow += (rp.c-rp.cShow)*0.35;
  const c=rp.cShow, m=rp.mode, g=geo();
  cx.clearRect(0,0,W,H);
  const V=RP.vol(m,c), aV=RP.airVol(m,c), wV=V-aV;
  const xi=g.x0, xHead=g.x0+g.L*V, top=g.y-g.h/2;
  // 中み：左（せん）から 水、その右に 空気
  if(wV>0){ cx.fillStyle=K('rl-accent2'); cx.fillRect(xi, top, g.L*wV, g.h);
    cx.strokeStyle=K('rp-cold'); cx.lineWidth=2; if(!rp.tsubu) for(let k=1;k<4;k++){ const yy=top+g.h*k/4; cx.beginPath(); cx.moveTo(xi+4,yy); cx.lineTo(xi+g.L*wV-4,yy); cx.stroke(); } }
  if(aV>0){ cx.fillStyle=K('rl-bg'); cx.fillRect(xi+g.L*wV, top, g.L*aV, g.h); }
  // つぶ
  if(rp.tsubu){
    const R=Math.max(4,g.h*0.05);
    if(aV>0){ const ax=xi+g.L*wV, aw=g.L*aV;
      cx.fillStyle=K('rp-sub');
      rp.dots.forEach(d=>{ d.a+= (Math.random()-.5)*0.6; d.u=(d.u+Math.cos(d.a)*d.s+1)%1; d.v=Math.min(1,Math.max(0,d.v+Math.sin(d.a)*d.s));
        if(d.v<=0||d.v>=1) d.a=-d.a;
        cx.beginPath(); cx.arc(ax+R+d.u*(aw-2*R), top+R+d.v*(g.h-2*R), R,0,6.28); cx.fill(); }); }
    if(wV>0){ const r=Math.max(4,g.h*0.06), step=r*2.1, wx=g.L*wV; cx.fillStyle=K('rp-cold');
      for(let yy=top+r; yy<=top+g.h-r+0.1; yy+=step) for(let xx=xi+r; xx<=xi+wx-r+0.1; xx+=step){ cx.beginPath(); cx.arc(xx,yy,r,0,6.28); cx.fill(); } }
  }
  // 中みの 名前
  cx.font='700 18px "BIZ UDPGothic",sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
  if(!rp.tsubu){
    if(wV>0){ cx.fillStyle=K('rp-deep'); cx.fillText('水', xi+g.L*wV/2, g.y); }
    if(aV>0.05){ cx.fillStyle=K('rp-sub'); cx.fillText('空気', xi+g.L*wV+g.L*aV/2, g.y); }
  }
  let rodEnd;
  if(ok('syringe_barrel') && ok('syringe_plunger')){
    // おしぼう（ピストン・ぼう・円ばんの 3つに 分けて、ぼうだけ のばす）→ その上に すきとおった つつ
    const P=PIMG.syringe_plunger, sc=g.sc, k=P.naturalWidth/520, rod=W*0.15;
    cx.drawImage(P, 0,0,60*k,160*k, xHead, g.y-80*sc, 60*sc, 160*sc);
    cx.drawImage(P, 60*k,0,420*k,160*k, xHead+60*sc, g.y-80*sc, rod, 160*sc);
    cx.drawImage(P, 480*k,0,40*k,160*k, xHead+60*sc+rod, g.y-80*sc, 40*sc, 160*sc);
    rodEnd = xHead+60*sc+rod+26*sc;
    cx.drawImage(PIMG.syringe_barrel, g.x0-60*sc, g.y-80*sc, 600*sc, 160*sc);
  }else{
    cx.strokeStyle=K('rl-ink'); cx.lineWidth=4; cx.strokeRect(g.x0, top, g.L*1.05, g.h);
    cx.fillStyle=K('rl-ink'); cx.fillRect(xHead, top+2, Math.max(8,g.h*0.14), g.h-4);
    rodEnd = xHead + g.L*0.6;
    cx.fillRect(xHead, g.y-g.h*0.07, rodEnd-xHead, g.h*0.14);
    cx.fillRect(rodEnd, g.y-g.h*0.4, g.h*0.12, g.h*0.8);
  }
  // 目もり
  cx.strokeStyle=K('rl-ink'); cx.lineWidth=1.5; for(let k=1;k<10;k++){ const xx=g.x0+g.L*k/10; cx.beginPath(); cx.moveTo(xx,top+2); cx.lineTo(xx,top+(k%5?g.h*0.16:g.h*0.3)); cx.stroke(); }
  // おす 矢じるし（おしているときだけ）
  if(c>0.05){ const ax=rodEnd+g.h*0.5; cx.strokeStyle=K('rp-warn'); cx.lineWidth=6; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(ax+g.h*0.6,g.y); cx.lineTo(ax,g.y); cx.moveTo(ax+g.h*0.25,g.y-g.h*0.22); cx.lineTo(ax,g.y); cx.lineTo(ax+g.h*0.25,g.y+g.h*0.22); cx.stroke(); }
  // 手の しるし
  const R=Math.max(16,Math.min(W,H)*0.04);
  rp.hands.forEach((h,i)=>{ if(!h) return; const x=h[0]*W, y=h[1]*H;
    cx.lineWidth=5; cx.strokeStyle=K('rl-ink'); cx.fillStyle=KA('rl-bg',.9);
    cx.beginPath(); cx.arc(x,y,R,0,6.28); cx.fill(); cx.stroke();
    cx.beginPath(); cx.moveTo(x+(i?-R*0.5:R*0.5),y-R*0.5); cx.lineTo(x+(i?-R*0.5:R*0.5),y+R*0.5); cx.stroke(); });
  // まわりの 表示
  const f=RP.force(m,c);
  $('rpForce').firstChild.style.width=(f*100).toFixed(0)+'%';
  $('rpVol').firstChild.style.width=(V*100).toFixed(0)+'%';
  const [k,t]=RP.say(m,c), s=$('rpSay'); if(s.textContent!==t){ s.textContent=t; s.dataset.k=k; }
}
function loopDraw(){ requestAnimationFrame(loopDraw); if(rp.src) draw(); }

/* ===== ボタン ===== */
document.querySelectorAll('#rpModes button').forEach(b=>b.onclick=()=>{
  rp.mode=b.dataset.m; document.querySelectorAll('#rpModes button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false')); draw(); });
$('rpTsubu').onclick=()=>{ rp.tsubu=!rp.tsubu; $('rpTsubu').setAttribute('aria-pressed', rp.tsubu?'true':'false'); draw(); };
fit();

// カメラの 手（0〜1・かがみの むき）。両手＝おす、片手＝人さし指で ボタンを さす（とめると おせる）
window.rpCam=(hs)=>{
  hs=hs||[];
  if(hs.length===1) RsTe.point(hs[0].tx, hs[0].ty); else RsTe.point(null);
  onHands(hs);
};
// ゆびで（カメラなし）：おしぼうを ゆびで 左へ おす。はなすと もどる
let tapId=null, tapX=0;
function startTap(){ $('rpStart').hidden=true; rp.src='tap'; fit(); draw(); loopDraw(); setMsg('おしぼうを ゆびで 左へ おそう'); }
$('rpTap').onclick=startTap;
$('rpStage').addEventListener('pointerdown', e=>{ if(rp.src!=='tap') return; tapId=e.pointerId; tapX=e.clientX; $('rpStage').setPointerCapture?.(tapId); setMsg(''); });
$('rpStage').addEventListener('pointermove', e=>{ if(rp.src!=='tap'||e.pointerId!==tapId) return; rp.c=Math.max(0,Math.min(1,(tapX-e.clientX)/(W*0.3))); });
const tapUp=e=>{ if(e.pointerId!==tapId) return; tapId=null; rp.c=0; };
$('rpStage').addEventListener('pointerup', tapUp); $('rpStage').addEventListener('pointercancel', tapUp);
window.rpFeed=(pts)=>{ onHands(pts); rp.cShow=rp.c; draw(); };
window.rpOnHands=onHands; window.rpDraw=draw; window.rpFit=fit;
// ためし用（?test：マウスの 左右と、それを 反対に した 所を 両手に する）
if(/[?&]test/.test(location.search)){
  $('rpGo').textContent='マウスで ためす';
  $('rpGo').onclick=()=>{ $('rpStart').hidden=true; rp.src='mouse'; fit(); draw(); loopDraw(); };
  $('rpStage').addEventListener('pointermove', e=>{
    if(rp.src!=='mouse') return;
    const r=$('rpStage').getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    onHands([{x,y},{x:1-x,y}]);
  });
}
</script>

<script type="module">
/* ===== カメラと 手の トラッキング（2つの 手）＝ふたりで なぞろう と 同じ 作り ===== */
const $ = id => document.getElementById(id);
const VER = '0.10.14';
const video = $('rpVideo');
let lm=null, lastT=-1, modelP=null;
async function loadModel(){
  const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
  const fs = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
  const opts = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d },
    runningMode:'VIDEO', numHands:2, minHandDetectionConfidence:0.5, minHandPresenceConfidence:0.5, minTrackingConfidence:0.5 });
  try{ return await vision.HandLandmarker.createFromOptions(fs, opts('GPU')); }
  catch(e){ return await vision.HandLandmarker.createFromOptions(fs, opts('CPU')); }
}
if(!/[?&]test/.test(location.search)){
  modelP = loadModel().catch(e=>{ modelP=null; throw e; }); modelP.catch(()=>{});
  $('rpGo').onclick = start;
}
async function start(){
  const err=$('rpErr'); err.hidden=true;
  $('rpGo').disabled=true; $('rpGo').textContent='じゅんびちゅう…';
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const e=new Error('nocam'); e.name='NoCamPage'; throw e; }
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    lm = await (modelP || (modelP = loadModel()));
    $('rpStart').hidden=true; window.rp.src='cam';
    requestAnimationFrame(()=>window.rpFit());
    loop();
  }catch(e){
    $('rpGo').disabled=false; $('rpGo').textContent='もう いちど';
    err.hidden=false;
    err.textContent = (e && e.name==='NoCamPage') ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : (e && (e.name==='NotFoundError'||e.name==='NotReadableError')) ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : (e && e.name==='NotAllowedError') ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした（'+(e && (e.name||e.message)||'')+'）。インターネットに つながっているか みてね。';
  }
}
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  if(!lm || video.readyState<2 || video.currentTime===lastT){ window.rpDraw(); return; }
  lastT=video.currentTime;
  const res = lm.detectForVideo(video, now);
  const pts = (res.landmarks||[]).map(L=>({x:1-L[9].x, y:L[9].y, tx:1-L[8].x, ty:L[8].y}));   // 手のひらの まん中・人さし指の 先（かがみの むき）
  window.rpCam(pts);
  window.rpDraw();
}
</script>

   へやの 上の帯（.xx-top）の いちばん左に 44px の ⌂ を 足す。帯が ない へやは 左下に うかべる。
   行き先：その へやが 入っている 部屋の ページ（理科ラボ/1_エネルギー.html など）。そこから ホームへも もどれる。
   へやの 中の 字や クラス名には さわらない（クラス名は rlh- で はじめる）。 */
(function(){
  if(window.__rlHome) return; window.__rlHome=1;
  // どの へやが どの 部屋に 入るか（mock/ の 下の 道 → 部屋の ページ）
  var PAGE={energy:'1_エネルギー.html',ryushi:'2_粒子.html',seimei:'3_生命.html',chikyu:'4_地球.html'};
  var EXTRA={teko:'energy','karada-mirror':'seimei',tentai:'chikyu','seiza-tsunagu':'chikyu'};
  function room(p){
    var m=/\/mock\/rika\/(energy|ryushi|seimei|chikyu)\//.exec(p); if(m) return m[1];
    m=/\/mock\/([^\/]+)\//.exec(p); return m&&EXTRA[m[1]]||'';
  }
  function href(){
    var p=decodeURIComponent(location.pathname), r=room(p), i=p.lastIndexOf('/mock/');
    if(window.RL_HOME_URL) return window.RL_HOME_URL;          // 授業メイトの 中では 入れる側が 決める
    if(!r||i<0) return '';
    return 'file://'+encodeURI(p.slice(0,i)+'/理科ラボ/'+PAGE[r]);
  }
  function put(){
    var to=href(); if(!to||document.querySelector('.rlh-home')) return;
    var a=document.createElement('a'); a.className='rlh-home'; a.href=to; a.title='へやの 一らんに もどる';
    a.setAttribute('aria-label','へやの 一らんに もどる');
    a.innerHTML='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
    var st=document.createElement('style');
    st.textContent='.rlh-home{flex:0 0 44px;width:44px;height:44px;margin-right:8px;display:inline-flex;align-items:center;justify-content:center;border-radius:22px;background:var(--rl-bg,white);color:var(--rl-ink,black);border:1px solid currentColor;text-decoration:none;box-sizing:border-box}'+
      '.rlh-home:hover{opacity:.8}.rlh-home:focus-visible{outline:3px solid currentColor;outline-offset:2px}'+
      '.rlh-home.rlh-float{position:fixed;left:12px;bottom:12px;z-index:9999;margin:0}';
    document.head.appendChild(st);
    var bar=[].slice.call(document.querySelectorAll('[class$="-top"],[class*="-top "]')).filter(function(e){
      var r=e.getBoundingClientRect(); return r.top<20&&r.height>=44&&getComputedStyle(e).display.indexOf('flex')>=0;})[0];
    if(bar) bar.insertBefore(a,bar.firstChild); else { a.classList.add('rlh-float'); document.body.appendChild(a); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',put); else put();
})();
</script><!--/rl-home-->
