<style>
/* 見本 v0.1（2026-11-07）理科ラボ／粒子／5年 もののとけ方。人さし指が ガラスぼう、かき混ぜると とける */
:root{
  /* 理科ラボ 粒子の 部屋の 色（4つの 部屋で 同じ 名前）。色は ここだけに 書く */
  --rl-bg:#ffffff; --rl-ink:#1f2937; --rl-accent:#2ba3d9; --rl-accent2:#7fd1ee; --rl-soft:#e6f6fc;
  /* この 部屋の 意味の 色 */
  --rp-sub:#4b5563; --rp-mute:#6b7280; --rp-line:#d1d5db; --rp-btn:#f3f4f6; --rp-deep:#0b6e99;
  --rp-ok:#1b7f3b; --rp-warn:#b45309; --rp-warn2:#d97706; --rp-hot:#c2410c; --rp-hot2:#fb923c; --rp-cold:#1d4ed8;
  --rp-red:#dc2626; --rp-err:#b91c1c; --rp-flame:#fde68a; --rp-clay:#e7d3b0; --rp-brown:#78350f; --rp-alum:#7c3aed;
  --rp-t2:#93c5fd; --rp-t4:#f97316;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--rl-bg);color:var(--rl-ink);
  font-family:"BIZ UDPGothic",sans-serif;font-size:16px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.rp-app{display:grid;grid-template-rows:auto 1fr;gap:8px;height:100vh;height:100dvh;padding:8px 12px 12px}
.rp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:52px}
.rp-tabs{display:flex;border:1px solid var(--rp-line);border-radius:12px;overflow:hidden}
.rp-tabs button{min-height:44px;min-width:44px;padding:0 12px;border:0;background:var(--rl-bg);font-size:16px;display:flex;align-items:center;gap:6px}
.rp-tabs button+button{border-left:1px solid var(--rp-line)}
.rp-tabs button[aria-pressed="true"]{background:var(--rl-accent);color:var(--rl-ink);font-weight:700}
.rp-tabs svg,.rp-b svg{width:22px;height:22px;flex:none}
.rp-b{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--rp-line);background:var(--rp-btn);border-radius:12px;
  font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.rp-b[aria-pressed="true"]{background:var(--rl-bg);border:2px solid var(--rl-ink);font-weight:700}
.rp-add{background:var(--rl-accent);color:var(--rl-ink);border-color:var(--rp-deep);font-weight:700;font-size:18px;min-height:52px}
.rp-main{display:grid;grid-template-columns:1fr 220px;gap:10px;min-height:0}
.rp-stage{position:relative;border-radius:12px;overflow:hidden;background:var(--rl-soft);min-height:0}
.rp-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.rp-veil{position:absolute;inset:0;background:color-mix(in srgb, var(--rl-bg) 60%, transparent)}
.rp-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.rp-msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:6px 16px;border-radius:20px;
  background:color-mix(in srgb, var(--rl-bg) 94%, transparent);font-size:20px;font-weight:700;white-space:nowrap;pointer-events:none}
.rp-msg:empty{display:none}
.rp-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--rl-bg);padding:16px}
.rp-start p{margin:0;font-size:20px;text-align:center;line-height:1.7}
.rp-startimg{width:min(440px,62%);max-height:48%;object-fit:contain}
.rp-start svg{width:min(240px,50%);height:auto}
.rp-big{min-height:64px;padding:0 40px;font-size:24px;font-weight:700;border-radius:32px;border:0;background:var(--rl-accent);color:var(--rl-ink)}
.rp-big:disabled{opacity:.6}
.rp-err{color:var(--rp-err);font-size:16px;max-width:80%;text-align:center}
.rp-err[hidden],.rp-start[hidden]{display:none!important}
.rp-side{display:flex;flex-direction:column;gap:8px;min-height:0}
.rp-scale{border:1px solid var(--rp-line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.rp-scale h2{margin:0;font-size:16px;display:flex;align-items:center;gap:6px}
.rp-scale h2 svg{width:22px;height:22px}
.rp-num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;background:var(--rp-btn);border-radius:8px;padding:2px 10px}
.rp-num small{font-size:18px;margin-left:2px}
.rp-row{display:flex;justify-content:space-between;font-size:15px;color:var(--rp-sub)}
.rp-row b{color:var(--rl-ink);font-variant-numeric:tabular-nums}
.rp-say{word-break:keep-all;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:12px;
  font-size:18px;font-weight:700;padding:6px;border:2px solid var(--rp-line)}
.rp-say[data-k="ok"]{border-color:var(--rp-ok);color:var(--rp-ok)}
.rp-say[data-k="hard"]{border-color:var(--rp-warn);color:var(--rp-warn)}
.rp-sp{flex:1}
@media (max-width:860px){
  .rp-main{grid-template-columns:1fr 180px}
  .rp-tabs button{padding:0 8px}
  .rp-num{font-size:26px}
  .rp-say{font-size:16px;min-height:44px}
  .rp-scale{padding:6px 8px}
  .rp-side{gap:6px}
}
html #rsTeBtn[aria-pressed="true"]{background:var(--rl-accent);color:var(--rl-ink);border-color:var(--rl-ink)}   /* 手で：おしている ときも 字は こい色 */
.rp-gos{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.rp-big{display:flex;align-items:center;gap:8px;padding:0 28px}.rp-big svg{width:28px!important;height:28px;flex:none}
.rp-big.rp-big2{background:var(--rl-bg);border:2px solid var(--rl-ink)}
</style>

<script>/* 手で おす（生命の 部屋の 部品 seimei/_parts/rs-te.js を tools_parts.py で 中に 入れる） */
/*RS-TE*/
/* ===== 手で おす（生命の 部屋で 共通） =====
   カメラの 手を 画面 ぜんたいの「しるし（わ）」に うつす。ボタンの 上で 手を とめると、わが みちて おせる。
   星ざ・社会地図の「とめて おす」と 同じ 考え。タップや マウスは そのまま つかえる（どっちでも できる）。
   つかい方：
     RsTe.point(nx,ny,box)  … カメラの 中の 位置（0〜1・かがみの むき）。null で しるしを けす
     RsTe.startHand({onPoint, onLost}) … カメラと 手の トラッキングを はじめる（人さし指の 先＝しるし）
     RsTe.stop()            … 手を やめる
     RsTe.cur               … いまの しるしの 位置（画面の px）
*/
(function(){
  const DWELL=1100;                 // とめて おすまでの 時間（ミリ秒）
  const BOX=[0.1,0.1,0.9,0.9];      // カメラの この はんいを 画面 ぜんたいに 広げる（はしまで とどくように）
  const SM=0.5;
  const cv=document.createElement('canvas'); cv.className='rs-te'; cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60';
  const tip=document.createElement('div'); tip.className='rs-te-tip'; tip.hidden=true;
  tip.style.cssText='position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:61;pointer-events:none;background:#fff;border:2px solid var(--rl-ink,#1f2937);border-radius:22px;padding:8px 16px;font-size:16px;font-weight:700;color:var(--rl-ink,#1f2937);white-space:nowrap';
  const st=document.createElement('style');
  st.textContent='.rs-te-near{box-shadow:inset 0 0 0 4px var(--rl-accent,#23784a)!important}#rsTeBtn[aria-pressed="true"]{background:var(--rl-accent,#23784a);color:#fff;border-color:var(--rl-accent,#23784a)}';
  const g=cv.getContext('2d');
  function size(){ const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; g.setTransform(d,0,0,d,0,0); }
  function mount(){ document.head.appendChild(st); document.body.appendChild(cv); document.body.appendChild(tip); size(); }
  if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
  addEventListener('resize',size);
  const T={cur:null, el:null, t0:0, done:false, on:false, dwell:DWELL, clicks:0};
  const cl=v=>Math.max(0,Math.min(1,v));
  T.point=function(nx,ny,box){
    if(nx==null){ T.cur=null; return null; }
    const b=box||BOX, x=cl((nx-b[0])/(b[2]-b[0]))*innerWidth, y=cl((ny-b[1])/(b[3]-b[1]))*innerHeight;
    if(!T.cur) T.cur={x,y}; else { T.cur.x+=(x-T.cur.x)*SM; T.cur.y+=(y-T.cur.y)*SM; }
    return T.cur;
  };
  T.say=function(t){ tip.hidden=!t; if(t && tip.textContent!==t) tip.textContent=t; };
  function target(){
    const c=T.cur; if(!c) return null;
    const e=document.elementFromPoint(c.x,c.y), b=e&&e.closest&&e.closest('button');
    return b && !b.disabled && b.offsetParent && !b.closest('[hidden]') ? b : null;
  }
  function frame(now){
    requestAnimationFrame(frame);
    g.clearRect(0,0,innerWidth,innerHeight);
    const c=T.cur, el=target();
    if(el!==T.el){ if(T.el) T.el.classList.remove('rs-te-near'); T.el=el; T.t0=now; T.done=false; if(el) el.classList.add('rs-te-near'); }
    let prog=0;
    if(el && !T.done){ prog=Math.min(1,(now-T.t0)/T.dwell); if(prog>=1){ T.done=true; T.clicks++; el.click(); } }
    if(!c) return;
    const R=Math.max(20,Math.min(innerWidth,innerHeight)*0.035);
    const ink=getComputedStyle(document.documentElement).getPropertyValue('--rl-ink').trim()||'#1f2937';
    const acc=getComputedStyle(document.documentElement).getPropertyValue('--rl-accent').trim()||'#23784a';
    g.lineWidth=7; g.strokeStyle='#fff'; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.lineWidth=3; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.fillStyle=ink; g.beginPath(); g.arc(c.x,c.y,4,0,7); g.fill();
    // みちる わ：こい ふちの 上に 部屋の 色（黄など うすい 色でも 白地で 見える）
    if(prog>0 && !T.done){ g.lineCap='round'; const a1=-Math.PI/2+prog*Math.PI*2;
      g.lineWidth=11; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke();
      g.lineWidth=6; g.strokeStyle=acc; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke(); }
  }
  requestAnimationFrame(frame);

  /* ---- 手の トラッキング（人さし指の 先） ---- */
  const VER='0.10.14';
  let hands=null, video=null, stream=null, lastT=-1, onPoint=null, onLost=null, seen=0;
  async function load(){
    const vision=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
    const fs=await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
    const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:1});
    try{ return await vision.HandLandmarker.createFromOptions(fs,o('GPU')); }
    catch(e){ return await vision.HandLandmarker.createFromOptions(fs,o('CPU')); }
  }
  T.errText=function(e){
    return e&&e.name==='NoCamPage' ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : e&&(e.name==='NotFoundError'||e.name==='NotReadableError') ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : e&&e.name==='NotAllowedError' ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした。インターネットに つながっているか みてね。';
  };
  T.startHand=async function(opt){
    opt=opt||{}; onPoint=opt.onPoint||null; onLost=opt.onLost||null; opt_hint=opt.hint!=null?opt.hint:'人さし指を カメラに 見せてね';
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ const e=new Error(); e.name='NoCamPage'; throw e; }
    if(!video){ video=document.createElement('video'); video.playsInline=true; video.muted=true; video.setAttribute('playsinline','');
      video.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none'; document.body.appendChild(video); }
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:960},height:{ideal:540},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    hands=hands||await load();
    T.on=true; T.video=video; seen=performance.now(); requestAnimationFrame(track);
    return video;
  };
  function track(){
    if(!T.on) return;
    requestAnimationFrame(track);
    if(!hands||video.readyState<2||video.currentTime===lastT) return;
    lastT=video.currentTime;
    const now=performance.now(), r=hands.detectForVideo(video,now), L=(r.landmarks||[])[0];
    if(L){ seen=now; const c=T.point(1-L[8].x, L[8].y); T.say(''); if(onPoint) onPoint(c); }
    else { T.point(null); if(onPoint) onPoint(null); if(now-seen>1200 && opt_hint) T.say(opt_hint); if(onLost) onLost(); }
  }
  let opt_hint='人さし指を カメラに 見せてね';
  T.stop=function(){ T.on=false; T.point(null); T.say(''); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } if(onPoint) onPoint(null); };
  // 「手で」ボタン：おすと カメラの 手が はじまる。もう いちど おすと やめる
  T.bindButton=function(btn,opt){
    btn.setAttribute('aria-pressed','false');
    btn.addEventListener('click',async()=>{
      if(T.on){ T.stop(); btn.setAttribute('aria-pressed','false'); return; }
      btn.disabled=true; T.say('じゅんびちゅう…');
      try{ await T.startHand(opt); btn.setAttribute('aria-pressed','true'); T.say(''); }
      catch(e){ T.say(T.errText(e)); setTimeout(()=>T.say(''),5000); }
      finally{ btn.disabled=false; }
    });
  };
  window.RsTe=T;
})();
/*RS-TE-END*/
</script>
<script>
/* 色は :root から 読む（K＝そのまま、KA＝すきとおらせる） */
const RL_CS=getComputedStyle(document.documentElement), RL_C={};
const K=n=>RL_C[n]||(RL_C[n]=RL_CS.getPropertyValue('--'+n).trim());

/* Codex で 作った 部品の 絵（parts/*.svg を tools_parts.py で 中に 入れる）。読めない ときは 前の 線の 絵 */
const PIMG={}; for(const k in RP_PARTS){ if(k==='start') continue; const im=new Image(); im.onload=()=>{ try{ draw(); }catch(e){} }; im.src=RP_PARTS[k]; PIMG[k]=im; }
const ok=k=>!!(PIMG[k] && PIMG[k].complete && PIMG[k].naturalWidth>0);
if(RP_PARTS.start){ const sv=document.querySelector('.rp-start svg'); if(sv){ const im=new Image(); im.src=RP_PARTS.start; im.alt=''; im.className='rp-startimg'; sv.replaceWith(im); } }

/* ===== きまり（1か所） ===== */
const RP = {
  // 水50mLに とける 量（g）。教科書の 表（10・30・60℃）と 同じ 数（理科年表の 水100gの 半分）。東京書籍の ページで 最後に たしかめる
  TABLE:{ salt:{10:17.9, 30:18.0, 60:18.5}, alum:{10:3.8, 30:8.3, 60:28.7} },
  STEP:2,                     // 1回に 入れる 量（g）
  K:1.4,                      // かき混ぜ 1（画面の はば ぶん 動かす）で とける 量（g）
  cap(mat,temp,water){ return RP.TABLE[mat][temp]*water/50; },
  weight(s){ return s.water + s.put; },          // 水1mL＝1g。とけても 重さは かわらない
};
window.RP = RP;
const $ = id => document.getElementById(id);
const rp = { mat:'salt', water:50, temp:10, put:0, solved:0, finger:null, prev:null, stir:0, swirl:0, mist:0, tsubu:false, src:'', grains:[] };
window.rp = rp;
const left = () => Math.max(0, rp.put - rp.solved);

function seedGrains(){ rp.grains=[]; for(let i=0;i<200;i++) rp.grains.push({u:Math.random(), v:Math.random(), r:Math.random()}); }
seedGrains();

/* ===== とける ===== */
function stirBy(len){
  rp.stir+=len; rp.swirl+=len*6;
  const cap=RP.cap(rp.mat,rp.temp,rp.water);
  const can=Math.min(left(), Math.max(0,cap-rp.solved), len*RP.K);
  if(can>0){ rp.solved+=can; rp.mist=1; }
  if(cap-rp.solved<1e-6 && left()>0) rp.stuck=(rp.stuck||0)+len; else rp.stuck=0;
  show();
}
// 温度や 水の 量を かえたとき：とけきれない ぶんは 出てくる
function settle(){ const cap=RP.cap(rp.mat,rp.temp,rp.water); if(rp.solved>cap) rp.solved=cap; rp.stuck=0;  show(); }
function add(){ rp.put=Math.round((rp.put+RP.STEP)*10)/10; rp.stuck=0; show(); }
function reset(){ rp.put=0; rp.solved=0; rp.stir=0; rp.stuck=0; show(); }

/* ===== 指から かき混ぜ ===== */
function onFinger(pts){
  const f=(pts||[])[0];
  if(!f){ rp.finger=null; rp.prev=null; setMsg('人さし指を 見せて'); return; }
  setMsg('');
  const p=[f.x*W, f.y*H];
  rp.finger = rp.finger ? [rp.finger[0]+(p[0]-rp.finger[0])*0.6, rp.finger[1]+(p[1]-rp.finger[1])*0.6] : p;
  const g=geo();
  const inside = rp.finger[0]>g.x+8 && rp.finger[0]<g.x+g.w-8 && rp.finger[1]>g.wy && rp.finger[1]<g.y+g.h;
  if(inside && rp.prev){ const len=Math.hypot(rp.finger[0]-rp.prev[0], rp.finger[1]-rp.prev[1])/W; if(len<0.2) stirBy(len); }
  rp.prev = inside ? rp.finger.slice() : null;
}
function setMsg(t){ const el=$('rpMsg'); if(el.textContent!==t) el.textContent=t; }

/* ===== えがく ===== */
const cv=$('rpCanvas'), cx=cv.getContext('2d');
let W=0,H=0;
function fit(){ const r=$('rpStage').getBoundingClientRect(), d=window.devicePixelRatio||1;
  W=r.width; H=r.height; cv.width=Math.round(W*d); cv.height=Math.round(H*d); cx.setTransform(d,0,0,d,0,0); }
window.addEventListener('resize', ()=>{ fit(); draw(); });
// ビーカーの 絵（parts/beaker.svg）は 中の場所が x20〜180・y20〜230（たて÷よこ＝1.3125）
function geo(){ let h=H*0.72, w=h/1.3125; if(w>W*0.5){ w=W*0.5; h=w*1.3125; } const x=(W-w)/2, y=H*0.17;
  const level = rp.water===100 ? 0.82 : 0.46;
  return {x,y,w,h, wy: y+h*(1-level)}; }
window.rpGeo=geo;

function grainShape(x,y,s){
  if(rp.mat==='salt'){ cx.fillRect(x-s/2,y-s/2,s,s); cx.strokeRect(x-s/2,y-s/2,s,s); }
  else { cx.beginPath(); cx.moveTo(x,y-s*0.7); cx.lineTo(x+s*0.7,y); cx.lineTo(x,y+s*0.7); cx.lineTo(x-s*0.7,y); cx.closePath(); cx.fill(); cx.stroke(); }
}
function draw(){
  cx.clearRect(0,0,W,H);
  const g=geo();
  // 水
  cx.fillStyle=KA('rl-accent2',.75); cx.fillRect(g.x, g.wy, g.w, g.y+g.h-g.wy);
  cx.strokeStyle=K('rp-deep'); cx.lineWidth=2; cx.beginPath(); cx.moveTo(g.x,g.wy); cx.lineTo(g.x+g.w,g.wy); cx.stroke();
  // とけて 広がった つぶ（つぶ ボタンの とき）
  if(rp.tsubu && rp.solved>0){
    const n=Math.min(200, Math.round(rp.solved*6)); cx.fillStyle=rp.mat==='salt'?K('rp-sub'):K('rp-alum');
    for(let i=0;i<n;i++){ const q=rp.grains[i]; const xx=g.x+8+((q.u+rp.swirl*0.002*(0.5+q.r))%1)*(g.w-16), yy=g.wy+6+q.v*(g.y+g.h-g.wy-12);
      cx.beginPath(); cx.arc(xx,yy,2.6,0,6.28); cx.fill(); }
  }
  // もやもや（とけている とき）
  if(rp.mist>0.02){ cx.strokeStyle=KA('rl-bg',0.9*rp.mist); cx.lineWidth=3;
    for(let k=0;k<4;k++){ const bx=g.x+g.w*(0.25+k*0.17), by=g.y+g.h-20; cx.beginPath();
      for(let s=0;s<6;s++){ const yy=by-s*16, xx=bx+Math.sin(s*1.3+rp.swirl+k)*10; s?cx.lineTo(xx,yy):cx.moveTo(xx,yy); } cx.stroke(); }
    rp.mist*=0.94; }
  // とけのこり（底に たまる）
  const n=Math.min(200, Math.ceil(left()*5)), s=Math.max(6,g.w*0.026);
  cx.fillStyle=K('rl-bg'); cx.strokeStyle=K('rp-sub'); cx.lineWidth=1.5;
  for(let i=0;i<n;i++){ const q=rp.grains[i], row=Math.floor(i/22);
    const xx=g.x+12+((q.u+i*0.618)%1)*(g.w-24), yy=g.y+g.h-s*0.8-row*s*0.8-q.r*s*0.5;
    grainShape(xx,yy,s); }
  // ガラスぼう（指の 先が ぼうの 下の はし）→ その上に すきとおった ビーカー
  if(rp.finger){ const [fx,fy]=rp.finger, dx=H*0.08, dy=-H*0.45, len=Math.hypot(dx,dy);
    if(ok('glass_rod')){ const s=len/400; cx.save(); cx.translate(fx,fy); cx.rotate(Math.atan2(dx,-dy)); cx.drawImage(PIMG.glass_rod,-12*s,-400*s,24*s,400*s); cx.restore(); }
    else { cx.strokeStyle=KA('rl-ink',.85); cx.lineWidth=8; cx.lineCap='round'; cx.beginPath(); cx.moveTo(fx,fy); cx.lineTo(fx+dx,fy+dy); cx.stroke(); } }
  if(ok('beaker')){ const sc=g.w/160; cx.drawImage(PIMG.beaker, g.x-20*sc, g.y-20*sc, 200*sc, 240*sc); }
  else { cx.strokeStyle=K('rl-ink'); cx.lineWidth=5; cx.lineJoin='round';
    cx.beginPath(); cx.moveTo(g.x-10,g.y); cx.lineTo(g.x,g.y+8); cx.lineTo(g.x,g.y+g.h); cx.lineTo(g.x+g.w,g.y+g.h); cx.lineTo(g.x+g.w,g.y); cx.stroke(); }
  // 目もり
  cx.lineWidth=2; cx.font='700 15px "BIZ UDPGothic",sans-serif'; cx.fillStyle=K('rl-ink'); cx.textAlign='left'; cx.textBaseline='middle';
  [[0.46,'50'],[0.82,'100']].forEach(([lv,t])=>{ const yy=g.y+g.h*(1-lv); cx.beginPath(); cx.moveTo(g.x+g.w,yy); cx.lineTo(g.x+g.w-18,yy); cx.stroke(); cx.fillText(t+'mL', g.x+g.w*1.14, yy); });
  // 温度
  cx.textAlign='right'; cx.font='700 18px "BIZ UDPGothic",sans-serif'; cx.fillText(rp.temp+'℃', g.x-24, g.y+g.h-12);
  // ガラスぼう（指）
  if(rp.finger){ const [fx,fy]=rp.finger;
    cx.lineWidth=4; cx.strokeStyle=K('rp-warn'); cx.fillStyle=K('rl-bg'); cx.beginPath(); cx.arc(fx,fy,10,0,6.28); cx.fill(); cx.stroke(); }
  show();
}
function show(){
  const w=RP.weight(rp), fmt=v=>(Math.round(v*10)/10)+'g';
  const wt=$('rpWeight'), wtxt=(Math.round(w*10)/10)+'<small>g</small>'; if(wt.innerHTML!==wtxt) wt.innerHTML=wtxt;
  $('rpPut').textContent=fmt(rp.put); $('rpLeft').textContent=fmt(left());
  let k='', t='入れてみよう';
  if(rp.put>0){
    if(left()<1e-6){ k='ok'; t='見えなくなった'; }
    else if((rp.stuck||0)>0.6){ k='hard'; t='もう とけない'; }
    else t='かき混ぜよう';
  }
  const sEl=$('rpSay'); if(sEl.textContent!==t){ sEl.textContent=t; sEl.dataset.k=k; }
}
function loopDraw(){ requestAnimationFrame(loopDraw); if(rp.src) draw(); }

/* ===== ボタン ===== */
function tabs(id,fn){ document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false')); fn(b.dataset.v); draw(); }); }
tabs('rpMat', v=>{ rp.mat=v; reset(); });
tabs('rpWater', v=>{ rp.water=+v; settle(); });
tabs('rpTemp', v=>{ rp.temp=+v; settle(); });
$('rpAdd').onclick=add;
$('rpReset').onclick=()=>{ reset(); draw(); };
$('rpTsubu').onclick=()=>{ rp.tsubu=!rp.tsubu; $('rpTsubu').setAttribute('aria-pressed', rp.tsubu?'true':'false'); draw(); };
fit(); show();

// 画面の px → ステージの 0〜1（外なら null）
function toStage(c){ if(!c) return null; const r=$('rpStage').getBoundingClientRect(), x=(c.x-r.left)/r.width, y=(c.y-r.top)/r.height;
  return (x>=0&&x<=1&&y>=0&&y<=1) ? {x,y} : null; }
// カメラの 手（0〜1・かがみの むき）
window.rpCam=(hs)=>{
  const h=(hs||[])[0]; if(!h){ RsTe.point(null); onFinger([]); return; }
  const q=toStage(RsTe.point(h.tx, h.ty));
  if(q) onFinger([q]); else { onFinger([]); setMsg(''); }
};
// ゆびで（カメラなし）：ビーカーの 中を ゆびで ぐるぐる
let tapId=null;
function startTap(){ $('rpStart').hidden=true; rp.src='tap'; fit(); draw(); loopDraw(); setMsg('ビーカーの 中を ゆびで ぐるぐる'); }
$('rpTap').onclick=startTap;
const tapXY=e=>{ const r=$('rpStage').getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; };
$('rpStage').addEventListener('pointerdown', e=>{ if(rp.src!=='tap') return; tapId=e.pointerId; $('rpStage').setPointerCapture?.(tapId); onFinger([tapXY(e)]); });
$('rpStage').addEventListener('pointermove', e=>{ if(rp.src!=='tap'||e.pointerId!==tapId) return; onFinger([tapXY(e)]); });
const tapUp=e=>{ if(e.pointerId!==tapId) return; tapId=null; onFinger([]); setMsg(''); };
$('rpStage').addEventListener('pointerup', tapUp); $('rpStage').addEventListener('pointercancel', tapUp);
window.rpFeed=(pts)=>{ onFinger(pts); draw(); };
window.rpOnHands=onFinger; window.rpDraw=draw; window.rpFit=fit; window.rpStir=stirBy;
if(/[?&]test/.test(location.search)){
  $('rpGo').textContent='マウスで ためす';
  $('rpGo').onclick=()=>{ $('rpStart').hidden=true; rp.src='mouse'; fit(); draw(); loopDraw(); };
  $('rpStage').addEventListener('pointermove', e=>{
    if(rp.src!=='mouse') return;
    const r=$('rpStage').getBoundingClientRect(); onFinger([{x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}]); });
}
</script>

<script type="module">
/* ===== カメラと 手の トラッキング＝ふたりで なぞろう と 同じ 作り（ここは 手1つ） ===== */
const $ = id => document.getElementById(id);
const VER = '0.10.14';
const video = $('rpVideo');
let lm=null, lastT=-1, modelP=null;
async function loadModel(){
  const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
  const fs = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
  const opts = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d },
    runningMode:'VIDEO', numHands:1, minHandDetectionConfidence:0.5, minHandPresenceConfidence:0.5, minTrackingConfidence:0.5 });
  try{ return await vision.HandLandmarker.createFromOptions(fs, opts('GPU')); }
  catch(e){ return await vision.HandLandmarker.createFromOptions(fs, opts('CPU')); }
}
if(!/[?&]test/.test(location.search)){
  modelP = loadModel().catch(e=>{ modelP=null; throw e; }); modelP.catch(()=>{});
  $('rpGo').onclick = start;
}
async function start(){
  const err=$('rpErr'); err.hidden=true;
  $('rpGo').disabled=true; $('rpGo').textContent='じゅんびちゅう…';
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const e=new Error('nocam'); e.name='NoCamPage'; throw e; }
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    lm = await (modelP || (modelP = loadModel()));
    $('rpStart').hidden=true; window.rp.src='cam';
    requestAnimationFrame(()=>window.rpFit());
    loop();
  }catch(e){
    $('rpGo').disabled=false; $('rpGo').textContent='もう いちど';
    err.hidden=false;
    err.textContent = (e && e.name==='NoCamPage') ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : (e && (e.name==='NotFoundError'||e.name==='NotReadableError')) ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : (e && e.name==='NotAllowedError') ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした（'+(e && (e.name||e.message)||'')+'）。インターネットに つながっているか みてね。';
  }
}
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  if(!lm || video.readyState<2 || video.currentTime===lastT){ window.rpDraw(); return; }
  lastT=video.currentTime;
  const res = lm.detectForVideo(video, now);
  const pts = (res.landmarks||[]).map(L=>({tx:1-L[8].x, ty:L[8].y}));   // 人さし指の 先（かがみの むき）
  window.rpCam(pts);
  window.rpDraw();
}
</script>
