<style>
/* 見本 v0.1（2026-11-07）理科ラボ／粒子／4年 水の すがた。パーの 手を かざすと あたためる、グーで ひやす */
:root{
  /* 理科ラボ 粒子の 部屋の 色（4つの 部屋で 同じ 名前）。色は ここだけに 書く */
  --rl-bg:#ffffff; --rl-ink:#1f2937; --rl-accent:#2ba3d9; --rl-accent2:#7fd1ee; --rl-soft:#e6f6fc;
  /* この 部屋の 意味の 色 */
  --rp-sub:#4b5563; --rp-mute:#6b7280; --rp-line:#d1d5db; --rp-btn:#f3f4f6; --rp-deep:#0b6e99;
  --rp-ok:#1b7f3b; --rp-warn:#b45309; --rp-warn2:#d97706; --rp-hot:#c2410c; --rp-hot2:#fb923c; --rp-cold:#1d4ed8;
  --rp-red:#dc2626; --rp-err:#b91c1c; --rp-flame:#fde68a; --rp-clay:#e7d3b0; --rp-brown:#78350f; --rp-alum:#7c3aed;
  --rp-t2:#93c5fd; --rp-t4:#f97316;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--rl-bg);color:var(--rl-ink);
  font-family:"BIZ UDPGothic",sans-serif;font-size:16px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.rp-app{display:grid;grid-template-rows:auto 1fr;gap:8px;height:100vh;height:100dvh;padding:8px 12px 12px}
.rp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:52px}
.rp-states{display:flex;gap:6px}
.rp-states span{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--rp-line);border-radius:22px;color:var(--rp-sub);background:var(--rl-bg)}
.rp-states span svg{width:22px;height:22px}
.rp-states span[data-on="1"]{border:2px solid var(--rl-ink);color:var(--rl-ink);font-weight:700}
.rp-b{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--rp-line);background:var(--rp-btn);border-radius:12px;
  font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.rp-b svg{width:22px;height:22px}
.rp-sp{flex:1}
.rp-main{display:grid;grid-template-columns:1fr 250px;gap:10px;min-height:0}
.rp-stage{position:relative;border-radius:12px;overflow:hidden;background:var(--rl-soft);min-height:0}
.rp-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.rp-veil{position:absolute;inset:0;background:color-mix(in srgb, var(--rl-bg) 60%, transparent)}
.rp-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.rp-msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:6px 16px;border-radius:20px;
  background:color-mix(in srgb, var(--rl-bg) 94%, transparent);font-size:20px;font-weight:700;white-space:nowrap;pointer-events:none}
.rp-msg:empty{display:none}
.rp-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--rl-bg);padding:16px}
.rp-start p{margin:0;font-size:20px;text-align:center;line-height:1.7}
.rp-startimg{width:min(440px,62%);max-height:48%;object-fit:contain}
.rp-start svg{width:min(300px,60%);height:auto}
.rp-big{min-height:64px;padding:0 40px;font-size:24px;font-weight:700;border-radius:32px;border:0;background:var(--rl-accent);color:var(--rl-ink)}
.rp-big:disabled{opacity:.6}
.rp-err{color:var(--rp-err);font-size:16px;max-width:80%;text-align:center}
.rp-err[hidden],.rp-start[hidden]{display:none!important}
.rp-side{display:flex;flex-direction:column;gap:8px;min-height:0}
.rp-temp{border:1px solid var(--rp-line);border-radius:12px;padding:6px 10px;display:flex;align-items:baseline;justify-content:space-between}
.rp-temp h2{margin:0;font-size:16px}
.rp-temp b{font-size:34px;font-variant-numeric:tabular-nums}
.rp-graph{flex:1;min-height:0;border:1px solid var(--rp-line);border-radius:12px;position:relative}
.rp-graph canvas{position:absolute;inset:0;width:100%;height:100%}
.rp-say{word-break:keep-all;min-height:48px;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:12px;
  font-size:18px;font-weight:700;padding:4px;border:2px solid var(--rp-line)}
@media (max-width:860px){
  .rp-main{grid-template-columns:1fr 200px}
  .rp-states span{padding:0 8px}
  .rp-temp b{font-size:26px}
  .rp-say{font-size:15px;min-height:44px}
}
.rp-tabs{display:flex;border:1px solid var(--rp-line);border-radius:12px;overflow:hidden}
.rp-tabs[hidden]{display:none!important}
.rp-tabs button{min-height:44px;padding:0 12px;border:0;background:var(--rl-bg);font-size:16px;display:flex;align-items:center;gap:6px}
.rp-tabs button+button{border-left:1px solid var(--rp-line)}
.rp-tabs button[aria-pressed="true"]{background:var(--rl-accent);color:var(--rl-ink);font-weight:700}
.rp-tabs svg{width:22px;height:22px;flex:none}
@media (max-width:860px){ .rp-tabs button{padding:0 8px} .rp-tabs svg{display:none} }
html #rsTeBtn[aria-pressed="true"]{background:var(--rl-accent);color:var(--rl-ink);border-color:var(--rl-ink)}   /* 手で：おしている ときも 字は こい色 */
.rp-gos{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.rp-big{display:flex;align-items:center;gap:8px;padding:0 28px}.rp-big svg{width:28px!important;height:28px;flex:none}
.rp-big.rp-big2{background:var(--rl-bg);border:2px solid var(--rl-ink)}
</style>

      <span data-s="vapor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="16" r="2.5"/><circle cx="15" cy="9" r="2.5"/><circle cx="18" cy="17" r="2"/></svg>水じょう気（気体）</span>

    </div>

  </div>
  <div class="rp-main">
    <div class="rp-stage" id="rpStage">
      <video id="rpVideo" playsinline muted></video>
      <div class="rp-veil"></div>
      <canvas id="rpCanvas"></canvas>
      <div class="rp-msg" id="rpMsg"></div>
      <div class="rp-start" id="rpStart">
        <svg viewBox="0 0 300 140" aria-hidden="true">
          <path d="M120 30v90h60V30" stroke-width="5" stroke-linejoin="round" style="fill:var(--rl-soft);stroke:var(--rl-ink)"/>
          <path d="M50 70c-14 0-22-12-14-26 4 8 10 8 10 0 0-10 8-16 14-22 0 12 12 18 12 32 0 10-8 16-22 16z" fill="none" stroke-width="5" stroke-linejoin="round" style="stroke:var(--rp-hot)"/>
          <text x="54" y="110" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--rp-hot)">パー</text>
          <path d="M250 22v52M228 35l44 26M228 61l44-26" stroke-width="5" stroke-linecap="round" style="stroke:var(--rp-cold)"/>
          <text x="250" y="110" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--rp-cold)">グー</text>
        </svg>
        <p>手を パーにして ビーカーに 近づけると あたためる。<br>グーにして 近づけると ひやす。</p>
        <div class="rp-gos"><button class="rp-big" id="rpGo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>カメラで</button><button class="rp-big rp-big2" id="rpTap" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12V5.5a1.8 1.8 0 0 1 3.6 0V12l3.6.8a2 2 0 0 1 1.5 2.3L18 21h-8l-3.3-4.6a1.6 1.6 0 0 1 2.4-2.1L10 15"/><path d="M6.5 6.5a5.5 5.5 0 0 1 10.5-1"/></svg>ゆびで</button></div>

      <div class="rp-say" id="rpSay">手を かざそう</div>

<script>/* 手で おす（生命の 部屋の 部品 seimei/_parts/rs-te.js を tools_parts.py で 中に 入れる） */
/*RS-TE*/
/* ===== 手で おす（生命の 部屋で 共通） =====
   カメラの 手を 画面 ぜんたいの「しるし（わ）」に うつす。ボタンの 上で 手を とめると、わが みちて おせる。
   星ざ・社会地図の「とめて おす」と 同じ 考え。タップや マウスは そのまま つかえる（どっちでも できる）。
   つかい方：
     RsTe.point(nx,ny,box)  … カメラの 中の 位置（0〜1・かがみの むき）。null で しるしを けす
     RsTe.startHand({onPoint, onLost}) … カメラと 手の トラッキングを はじめる（人さし指の 先＝しるし）
     RsTe.stop()            … 手を やめる
     RsTe.cur               … いまの しるしの 位置（画面の px）
*/
(function(){
  const DWELL=1100;                 // とめて おすまでの 時間（ミリ秒）
  const BOX=[0.1,0.1,0.9,0.9];      // カメラの この はんいを 画面 ぜんたいに 広げる（はしまで とどくように）
  const SM=0.5;
  const cv=document.createElement('canvas'); cv.className='rs-te'; cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60';
  const tip=document.createElement('div'); tip.className='rs-te-tip'; tip.hidden=true;
  tip.style.cssText='position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:61;pointer-events:none;background:#fff;border:2px solid var(--rl-ink,#1f2937);border-radius:22px;padding:8px 16px;font-size:16px;font-weight:700;color:var(--rl-ink,#1f2937);white-space:nowrap';
  const st=document.createElement('style');
  st.textContent='.rs-te-near{box-shadow:inset 0 0 0 4px var(--rl-accent,#23784a)!important}#rsTeBtn[aria-pressed="true"]{background:var(--rl-accent,#23784a);color:#fff;border-color:var(--rl-accent,#23784a)}';
  const g=cv.getContext('2d');
  function size(){ const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; g.setTransform(d,0,0,d,0,0); }
  function mount(){ document.head.appendChild(st); document.body.appendChild(cv); document.body.appendChild(tip); size(); }
  if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
  addEventListener('resize',size);
  const T={cur:null, el:null, t0:0, done:false, on:false, dwell:DWELL, clicks:0};
  const cl=v=>Math.max(0,Math.min(1,v));
  T.point=function(nx,ny,box){
    if(nx==null){ T.cur=null; return null; }
    const b=box||BOX, x=cl((nx-b[0])/(b[2]-b[0]))*innerWidth, y=cl((ny-b[1])/(b[3]-b[1]))*innerHeight;
    if(!T.cur) T.cur={x,y}; else { T.cur.x+=(x-T.cur.x)*SM; T.cur.y+=(y-T.cur.y)*SM; }
    return T.cur;
  };
  T.say=function(t){ tip.hidden=!t; if(t && tip.textContent!==t) tip.textContent=t; };
  function target(){
    const c=T.cur; if(!c) return null;
    const e=document.elementFromPoint(c.x,c.y), b=e&&e.closest&&e.closest('button');
    return b && !b.disabled && b.offsetParent && !b.closest('[hidden]') ? b : null;
  }
  function frame(now){
    requestAnimationFrame(frame);
    g.clearRect(0,0,innerWidth,innerHeight);
    const c=T.cur, el=target();
    if(el!==T.el){ if(T.el) T.el.classList.remove('rs-te-near'); T.el=el; T.t0=now; T.done=false; if(el) el.classList.add('rs-te-near'); }
    let prog=0;
    if(el && !T.done){ prog=Math.min(1,(now-T.t0)/T.dwell); if(prog>=1){ T.done=true; T.clicks++; el.click(); } }
    if(!c) return;
    const R=Math.max(20,Math.min(innerWidth,innerHeight)*0.035);
    const ink=getComputedStyle(document.documentElement).getPropertyValue('--rl-ink').trim()||'#1f2937';
    const acc=getComputedStyle(document.documentElement).getPropertyValue('--rl-accent').trim()||'#23784a';
    g.lineWidth=7; g.strokeStyle='#fff'; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.lineWidth=3; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R,0,7); g.stroke();
    g.fillStyle=ink; g.beginPath(); g.arc(c.x,c.y,4,0,7); g.fill();
    // みちる わ：こい ふちの 上に 部屋の 色（黄など うすい 色でも 白地で 見える）
    if(prog>0 && !T.done){ g.lineCap='round'; const a1=-Math.PI/2+prog*Math.PI*2;
      g.lineWidth=11; g.strokeStyle=ink; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke();
      g.lineWidth=6; g.strokeStyle=acc; g.beginPath(); g.arc(c.x,c.y,R+8,-Math.PI/2,a1); g.stroke(); }
  }
  requestAnimationFrame(frame);

  /* ---- 手の トラッキング（人さし指の 先） ---- */
  const VER='0.10.14';
  let hands=null, video=null, stream=null, lastT=-1, onPoint=null, onLost=null, seen=0;
  async function load(){
    const vision=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
    const fs=await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
    const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:1});
    try{ return await vision.HandLandmarker.createFromOptions(fs,o('GPU')); }
    catch(e){ return await vision.HandLandmarker.createFromOptions(fs,o('CPU')); }
  }
  T.errText=function(e){
    return e&&e.name==='NoCamPage' ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : e&&(e.name==='NotFoundError'||e.name==='NotReadableError') ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : e&&e.name==='NotAllowedError' ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした。インターネットに つながっているか みてね。';
  };
  T.startHand=async function(opt){
    opt=opt||{}; onPoint=opt.onPoint||null; onLost=opt.onLost||null; opt_hint=opt.hint!=null?opt.hint:'人さし指を カメラに 見せてね';
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ const e=new Error(); e.name='NoCamPage'; throw e; }
    if(!video){ video=document.createElement('video'); video.playsInline=true; video.muted=true; video.setAttribute('playsinline','');
      video.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none'; document.body.appendChild(video); }
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:960},height:{ideal:540},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    hands=hands||await load();
    T.on=true; T.video=video; seen=performance.now(); requestAnimationFrame(track);
    return video;
  };
  function track(){
    if(!T.on) return;
    requestAnimationFrame(track);
    if(!hands||video.readyState<2||video.currentTime===lastT) return;
    lastT=video.currentTime;
    const now=performance.now(), r=hands.detectForVideo(video,now), L=(r.landmarks||[])[0];
    if(L){ seen=now; const c=T.point(1-L[8].x, L[8].y); T.say(''); if(onPoint) onPoint(c); }
    else { T.point(null); if(onPoint) onPoint(null); if(now-seen>1200 && opt_hint) T.say(opt_hint); if(onLost) onLost(); }
  }
  let opt_hint='人さし指を カメラに 見せてね';
  T.stop=function(){ T.on=false; T.point(null); T.say(''); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } if(onPoint) onPoint(null); };
  // 「手で」ボタン：おすと カメラの 手が はじまる。もう いちど おすと やめる
  T.bindButton=function(btn,opt){
    btn.setAttribute('aria-pressed','false');
    btn.addEventListener('click',async()=>{
      if(T.on){ T.stop(); btn.setAttribute('aria-pressed','false'); return; }
      btn.disabled=true; T.say('じゅんびちゅう…');
      try{ await T.startHand(opt); btn.setAttribute('aria-pressed','true'); T.say(''); }
      catch(e){ T.say(T.errText(e)); setTimeout(()=>T.say(''),5000); }
      finally{ btn.disabled=false; }
    });
  };
  window.RsTe=T;
})();
/*RS-TE-END*/
</script>
<script>
/* 色は :root から 読む（K＝そのまま、KA＝すきとおらせる） */
const RL_CS=getComputedStyle(document.documentElement), RL_C={};
const K=n=>RL_C[n]||(RL_C[n]=RL_CS.getPropertyValue('--'+n).trim());

const PIMG={}; for(const k in RP_PARTS){ if(k==='start') continue; const im=new Image(); im.onload=()=>{ try{ draw(); }catch(e){} }; im.src=RP_PARTS[k]; PIMG[k]=im; }
const ok=k=>!!(PIMG[k] && PIMG[k].complete && PIMG[k].naturalWidth>0);
if(RP_PARTS.start){ const sv=document.querySelector('.rp-start svg'); if(sv){ const im=new Image(); im.src=RP_PARTS.start; im.alt=''; im.className='rp-startimg'; sv.replaceWith(im); } }

/* ===== きまり（1か所） ===== */
// 熱の やりとりを 1つの 量で 考える。とけている間（0℃）と ふっとうしている間（100℃）は 温度が かわらない。
const RP = {
  LM:30,          // 氷が ぜんぶ とけるのに いる 熱（見本なので 実さいより 小さく した）
  LV:150,         // 水が ぜんぶ 水じょう気に なるのに いる 熱（同じく 小さく した）
  MIN:-20,        // 氷を ひやせる 下の はし（氷と 食塩で ひやす）
  ICE_GROW:0.1,   // 氷に なると 体積が 約1.1倍
  POWER:15,       // 手を いちばん 近づけた ときの 1びょうの 熱
  heat(s,q){      // s={T,f,m} f=氷の わりあい m=のこっている 水の りょう（はじめ1）
    while(Math.abs(q)>1e-9 && s.m>1e-9){
      if(q>0){
        if(s.T<0){ const d=Math.min(q,-s.T); s.T+=d; q-=d; }
        else if(s.f>0){ const d=Math.min(q, s.f*RP.LM); s.f-=d/RP.LM; q-=d; s.T=0; if(s.f<1e-9) s.f=0; }
        else if(s.T<100){ const d=Math.min(q,100-s.T); s.T+=d; q-=d; }
        else { const d=Math.min(q, s.m*RP.LV); s.m-=d/RP.LV; q-=d; s.T=100; if(s.m<1e-9){ s.m=0; } }
      }else{
        if(s.T>0){ const d=Math.min(-q,s.T); s.T-=d; q+=d; }
        else if(s.f<1){ const d=Math.min(-q,(1-s.f)*RP.LM); s.f+=d/RP.LM; q+=d; s.T=0; if(s.f>1-1e-9) s.f=1; }
        else if(s.T>RP.MIN){ const d=Math.min(-q,s.T-RP.MIN); s.T-=d; q+=d; }
        else break;
      }
    }
    return s;
  },
  vol(s){ return s.m*(1+RP.ICE_GROW*s.f); },
  state(s){
    if(s.m<=1e-9) return 'gone';
    if(s.f>=1) return 'ice';
    if(s.f>0) return 'melt';
    if(s.T>=100) return 'boil';
    return 'water';
  },
};
window.RP = RP;
const $ = id => document.getElementById(id);
const rp = { s:{T:20,f:0,m:1}, hand:null, power:0, hist:[], t:0, src:'', bub:[], last:0 };
window.rp = rp;

/* ===== 手から あたためる・ひやす ===== */
// pts：{x,y,fist}（画面の 0〜1）
function onHand(pts){
  const h=(pts||[])[0];
  if(!h){ rp.hand=null; rp.power=0; setMsg('手を 見せて'); return; }
  setMsg('');
  const p=[h.x*W,h.y*H];
  rp.hand = rp.hand ? {x:rp.hand.x+(p[0]-rp.hand.x)*0.6, y:rp.hand.y+(p[1]-rp.hand.y)*0.6, fist:h.fist} : {x:p[0],y:p[1],fist:h.fist};
  const g=geo(), bx=g.x+g.w/2, by=g.y+g.h*0.6;
  const d=Math.hypot(rp.hand.x-bx, rp.hand.y-by)/Math.max(W,H);
  const near=Math.max(0,Math.min(1,(0.42-d)/0.27));     // 近いほど 強い
  rp.power = (h.fist?-1:1)*near;
}
function setMsg(t){ const el=$('rpMsg'); if(el.textContent!==t) el.textContent=t; }
function step(dt){
  RP.heat(rp.s, rp.power*RP.POWER*dt);
  rp.t+=dt;
  if(rp.t-rp.last>=0.25){ rp.last=rp.t; rp.hist.push(rp.s.T); if(rp.hist.length>240) rp.hist.shift(); }
}

/* ===== えがく ===== */
const cv=$('rpCanvas'), cx=cv.getContext('2d'), gv=$('rpGraph'), gx=gv.getContext('2d');
let W=0,H=0,GW=0,GH=0;
function fit(){ const d=window.devicePixelRatio||1;
  let r=$('rpStage').getBoundingClientRect(); W=r.width; H=r.height; cv.width=Math.round(W*d); cv.height=Math.round(H*d); cx.setTransform(d,0,0,d,0,0);
  r=gv.parentNode.getBoundingClientRect(); GW=r.width; GH=r.height; gv.width=Math.round(GW*d); gv.height=Math.round(GH*d); gx.setTransform(d,0,0,d,0,0); }
window.addEventListener('resize', ()=>{ fit(); draw(); });
// ビーカーの 絵（parts/beaker.svg）は 中の場所が x20〜180・y20〜230
function geo(){ let h=H*0.56, w=h/1.3125; if(w>W*0.3){ w=W*0.3; h=w*1.3125; } const x=(W-w)/2, y=H*0.3; return {x,y,w,h}; }
window.rpGeo=geo;

function draw(){
  const s=rp.s, g=geo(), st=RP.state(s);
  cx.clearRect(0,0,W,H);
  const full=g.h*0.55, lv=full*RP.vol(s), top=g.y+g.h-lv;
  // 中み：氷は 下、水は 上（とけている 間）
  const iceH=lv*s.f*(1+RP.ICE_GROW)/(1+RP.ICE_GROW*s.f) || 0;
  if(lv>0){
    cx.fillStyle=KA('rl-accent2',.85); cx.fillRect(g.x, top, g.w, lv-iceH);
    if(iceH>0){ cx.fillStyle=K('rl-soft'); cx.fillRect(g.x, g.y+g.h-iceH, g.w, iceH);
      cx.strokeStyle=K('rp-mute'); cx.lineWidth=2; for(let k=0;k<5;k++){ const xx=g.x+g.w*(0.15+k*0.18); cx.beginPath(); cx.moveTo(xx,g.y+g.h-iceH*0.2); cx.lineTo(xx+12,g.y+g.h-iceH*0.6); cx.stroke(); } }
    cx.strokeStyle=K('rp-deep'); cx.lineWidth=2; cx.beginPath(); cx.moveTo(g.x,top); cx.lineTo(g.x+g.w,top); cx.stroke();
  }
  // あわ（ふっとう）
  if(st==='boil'){ if(Math.random()<0.6) rp.bub.push({x:g.x+12+Math.random()*(g.w-24), y:g.y+g.h-6, r:4+Math.random()*7}); }
  rp.bub=rp.bub.filter(b=>{ b.y-=3+b.r*0.3; b.r+=0.15; if(b.y<top) return false;
    cx.strokeStyle=K('rp-deep'); cx.lineWidth=2; cx.fillStyle=KA('rl-bg',.7); cx.beginPath(); cx.arc(b.x,b.y,b.r,0,6.28); cx.fill(); cx.stroke(); return true; });
  // 湯気（白い けむり）
  if(st==='boil' || (st==='water' && s.T>80)){
    cx.strokeStyle=KA('rp-mute',.9); cx.lineWidth=4; cx.lineCap='round';
    for(let k=0;k<3;k++){ const bx=g.x+g.w*(0.25+k*0.25); cx.beginPath();
      for(let i=0;i<8;i++){ const yy=g.y-8-i*10, xx=bx+Math.sin(i*0.9+rp.t*4+k)*8; i?cx.lineTo(xx,yy):cx.moveTo(xx,yy); } cx.stroke(); }
  }
  // ビーカー と はじめの 水面
  // 温度計（赤い 液 → その上に ガラスの 温度計）
  const tx=g.x+g.w*0.78, tt=g.y-34;
  if(ok('thermometer')){ const sc=(g.y+g.h-8-tt)/292, T=Math.max(RP.MIN,Math.min(110,s.T)), ty=tt+(262-(T-RP.MIN)/(110-RP.MIN)*236)*sc;
    cx.fillStyle=K('rp-red'); cx.beginPath(); cx.arc(tx,tt+280*sc,10*sc,0,6.28); cx.fill(); cx.fillRect(tx-2*sc,ty,4*sc,tt+280*sc-ty);
    cx.drawImage(PIMG.thermometer, tx-20*sc, tt, 40*sc, 300*sc); }
  if(ok('beaker')){ const sc=g.w/160; cx.drawImage(PIMG.beaker, g.x-20*sc, g.y-20*sc, 200*sc, 240*sc); }
  else { cx.strokeStyle=K('rl-ink'); cx.lineWidth=5; cx.lineJoin='round';
    cx.beginPath(); cx.moveTo(g.x-8,g.y); cx.lineTo(g.x,g.y+8); cx.lineTo(g.x,g.y+g.h); cx.lineTo(g.x+g.w,g.y+g.h); cx.lineTo(g.x+g.w,g.y); cx.stroke(); }
  const y0=g.y+g.h-full; cx.strokeStyle=K('rp-warn'); cx.lineWidth=3; cx.setLineDash([8,6]);
  cx.beginPath(); cx.moveTo(g.x-g.w*0.16,y0); cx.lineTo(g.x+g.w*1.14,y0); cx.stroke(); cx.setLineDash([]);
  cx.fillStyle=K('rp-warn'); cx.font='700 15px "BIZ UDPGothic",sans-serif'; cx.textAlign='left'; cx.textBaseline='middle'; cx.fillText('はじめ', g.x+g.w*1.18, y0);
  // ことば（あわ・湯気）
  cx.fillStyle=K('rl-ink'); cx.font='700 16px "BIZ UDPGothic",sans-serif';
  if(st==='boil'){ cx.textAlign='left'; cx.fillText('あわ＝水じょう気', g.x+g.w*1.18, g.y+g.h*0.8); cx.fillText('湯気', g.x+g.w*0.85, g.y-60); }
  // 温度計（絵が 読めない とき）
  if(!ok('thermometer')){ const tx=g.x+g.w*0.82, tt=g.y-20, tb=g.y+g.h-14; cx.strokeStyle=K('rl-ink'); cx.lineWidth=3; cx.fillStyle=K('rl-bg');
  cx.beginPath(); cx.roundRect(tx-6,tt,12,tb-tt,6); cx.fill(); cx.stroke();
  const ty=tb-(s.T-RP.MIN)/(110-RP.MIN)*(tb-tt-6); cx.fillStyle=K('rp-red'); cx.fillRect(tx-3,ty,6,tb-ty-3); }
  // 手
  if(rp.hand){ const {x,y,fist}=rp.hand, c=fist?K('rp-cold'):K('rp-hot'), R=Math.max(22,Math.min(W,H)*0.05);
    cx.lineWidth=4; cx.strokeStyle=c; cx.fillStyle=KA('rl-bg',.92); cx.beginPath(); cx.arc(x,y,R,0,6.28); cx.fill(); cx.stroke();
    cx.lineCap='round';
    if(fist){ cx.beginPath(); for(let k=0;k<3;k++){ const a=k*Math.PI/3; cx.moveTo(x+Math.cos(a)*R*0.6,y+Math.sin(a)*R*0.6); cx.lineTo(x-Math.cos(a)*R*0.6,y-Math.sin(a)*R*0.6); } cx.stroke(); }
    else { cx.beginPath(); cx.moveTo(x,y-R*0.6); cx.bezierCurveTo(x+R*0.6,y-R*0.1,x+R*0.5,y+R*0.55,x,y+R*0.55); cx.bezierCurveTo(x-R*0.5,y+R*0.55,x-R*0.6,y,x,y-R*0.6); cx.stroke(); }
    cx.fillStyle=c; cx.font='700 16px "BIZ UDPGothic",sans-serif'; cx.textAlign='center'; cx.textBaseline='top';
    if(Math.abs(rp.power)>0.02) cx.fillText(fist?'ひやす':'あたためる', x, y+R+4); }
  drawGraph(); show();
}
function drawGraph(){
  gx.clearRect(0,0,GW,GH);
  const L=50, R=8, T=10, B=26, ww=GW-L-R, hh=GH-T-B, yOf=v=>T+hh*(1-(v-RP.MIN)/(110-RP.MIN));
  gx.font='14px "BIZ UDPGothic",sans-serif'; gx.textAlign='right'; gx.textBaseline='middle'; gx.fillStyle=K('rp-sub');
  [[100,'100'],[0,'0']].forEach(([v,t])=>{ const y=yOf(v); gx.strokeStyle=K('rp-mute'); gx.lineWidth=1; gx.setLineDash([4,4]); gx.beginPath(); gx.moveTo(L,y); gx.lineTo(GW-R,y); gx.stroke(); gx.setLineDash([]); gx.fillText(t+'℃',L-4,y); });
  gx.strokeStyle=K('rl-ink'); gx.lineWidth=1.5; gx.beginPath(); gx.moveTo(L,T); gx.lineTo(L,GH-B); gx.stroke();
  gx.beginPath(); gx.moveTo(L,GH-B); gx.lineTo(GW-R,GH-B); gx.stroke(); gx.textAlign='right'; gx.textBaseline='bottom'; gx.fillText('時間 →',GW-R,GH-2);
  if(rp.hist.length>1){ gx.strokeStyle=K('rp-red'); gx.lineWidth=3; gx.beginPath();
    rp.hist.forEach((v,i)=>{ const x=L+ww*i/239, y=yOf(v); i?gx.lineTo(x,y):gx.moveTo(x,y); }); gx.stroke(); }
}
function show(){
  const s=rp.s, st=RP.state(s);
  const T=Math.round(s.T)+'℃'; if($('rpT').textContent!==T) $('rpT').textContent=T;
  const on={ice:['ice'],melt:['ice','water'],water:['water'],boil:['water','vapor'],gone:['vapor']}[st];
  document.querySelectorAll('#rpStates span').forEach(e=>{ const v=on.includes(e.dataset.s)?'1':''; if(e.dataset.on!==v) e.dataset.on=v; });
  const say={ice:'こおった（体積が ふえた）',melt:'0℃のまま とけていく',water:'水',boil:'ふっとう（100℃のまま）',gone:'水が 空気中へ 出ていった'}[st];
  const t = st==='melt' && rp.power<0 ? '0℃のまま こおっていく' : say;
  if($('rpSay').textContent!==t) $('rpSay').textContent=t;
}
let prevT=0;
function loopDraw(now){ requestAnimationFrame(loopDraw); if(!rp.src) return; const dt=Math.min(0.1,(now-(prevT||now))/1000); prevT=now; step(dt); draw(); }

$('rpReset').onclick=()=>{ rp.s={T:20,f:0,m:1}; rp.hist=[]; rp.bub=[]; draw(); };
fit(); show(); drawGraph();

function toStage(c){ if(!c) return null; const r=$('rpStage').getBoundingClientRect(), x=(c.x-r.left)/r.width, y=(c.y-r.top)/r.height;
  return (x>=0&&x<=1&&y>=0&&y<=1) ? {x,y} : null; }
// カメラの 手（0〜1・かがみの むき）
window.rpCam=(hs)=>{
  const h=(hs||[])[0]; if(!h){ RsTe.point(null); onHand([]); return; }
  const q=toStage(RsTe.point(h.x, h.y));
  if(q) onHand([{x:q.x, y:q.y, fist:h.fist}]); else { onHand([]); setMsg(''); }
};
// ゆびで（カメラなし）：［あたためる］［ひやす］を えらんで、ビーカーを ゆびで おさえる
let tapId=null, tapCold=false;
function startTap(){ $('rpStart').hidden=true; $('rpTapSel').hidden=false; rp.src='tap'; fit(); draw(); requestAnimationFrame(loopDraw); }
$('rpTap').onclick=startTap;
document.querySelectorAll('#rpTapSel button').forEach(b=>b.onclick=()=>{ tapCold=b.dataset.v==='cold';
  document.querySelectorAll('#rpTapSel button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false')); });
const tapXY=e=>{ const r=$('rpStage').getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height, fist:tapCold}; };
$('rpStage').addEventListener('pointerdown', e=>{ if(rp.src!=='tap') return; tapId=e.pointerId; $('rpStage').setPointerCapture?.(tapId); onHand([tapXY(e)]); });
$('rpStage').addEventListener('pointermove', e=>{ if(rp.src!=='tap'||e.pointerId!==tapId) return; onHand([tapXY(e)]); });
const tapUp=e=>{ if(e.pointerId!==tapId) return; tapId=null; onHand([]); setMsg(''); };
$('rpStage').addEventListener('pointerup', tapUp); $('rpStage').addEventListener('pointercancel', tapUp);
window.rpFeed=(pts,dt)=>{ onHand(pts); if(dt) step(dt); draw(); };
window.rpOnHands=onHand; window.rpDraw=draw; window.rpFit=fit; window.rpStep=step;
if(/[?&]test/.test(location.search)){
  $('rpGo').textContent='マウスで ためす';
  let down=false, lastE=null;
  $('rpGo').onclick=()=>{ $('rpStart').hidden=true; rp.src='mouse'; fit(); draw(); requestAnimationFrame(loopDraw); };
  const st=$('rpStage'), mv=e=>{ if(rp.src!=='mouse') return; lastE={clientX:e.clientX,clientY:e.clientY}; const r=st.getBoundingClientRect(); onHand([{x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height, fist:down}]); };
  st.addEventListener('pointerdown', e=>{ down=true; mv(e); });
  window.addEventListener('pointerup', ()=>{ down=false; if(lastE) mv(lastE); });
  st.addEventListener('pointermove', mv);
  st.addEventListener('pointerleave', ()=>{ if(rp.src==='mouse') onHand([]); });
}
</script>

<script type="module">
/* ===== カメラと 手の トラッキング＝ふたりで なぞろう と 同じ 作り（ここは 手1つ・グーか パーか） ===== */
const $ = id => document.getElementById(id);
const VER = '0.10.14';
const video = $('rpVideo');
let lm=null, lastT=-1, modelP=null;
async function loadModel(){
  const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
  const fs = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
  const opts = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d },
    runningMode:'VIDEO', numHands:1, minHandDetectionConfidence:0.5, minHandPresenceConfidence:0.5, minTrackingConfidence:0.5 });
  try{ return await vision.HandLandmarker.createFromOptions(fs, opts('GPU')); }
  catch(e){ return await vision.HandLandmarker.createFromOptions(fs, opts('CPU')); }
}
if(!/[?&]test/.test(location.search)){
  modelP = loadModel().catch(e=>{ modelP=null; throw e; }); modelP.catch(()=>{});
  $('rpGo').onclick = start;
}
async function start(){
  const err=$('rpErr'); err.hidden=true;
  $('rpGo').disabled=true; $('rpGo').textContent='じゅんびちゅう…';
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const e=new Error('nocam'); e.name='NoCamPage'; throw e; }
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    lm = await (modelP || (modelP = loadModel()));
    $('rpStart').hidden=true; window.rp.src='cam';
    requestAnimationFrame(()=>window.rpFit());
    loop(performance.now());
  }catch(e){
    $('rpGo').disabled=false; $('rpGo').textContent='もう いちど';
    err.hidden=false;
    err.textContent = (e && e.name==='NoCamPage') ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : (e && (e.name==='NotFoundError'||e.name==='NotReadableError')) ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : (e && e.name==='NotAllowedError') ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした（'+(e && (e.name||e.message)||'')+'）。インターネットに つながっているか みてね。';
  }
}
let prev=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,(now-(prev||now))/1000); prev=now;
  if(lm && video.readyState>=2 && video.currentTime!==lastT){
    lastT=video.currentTime;
    const res = lm.detectForVideo(video, now);
    const pts = (res.landmarks||[]).map(L=>{
      const d=(a,b)=>Math.hypot(L[a].x-L[b].x, L[a].y-L[b].y), palm=d(0,9)||1e-6;
      const tips=(d(8,0)+d(12,0)+d(16,0)+d(20,0))/4;
      return {x:1-L[9].x, y:L[9].y, fist: tips/palm<1.35};      // 指先が 手首に 近い＝グー
    });
    window.rpCam(pts);
  }
  window.rpStep(dt); window.rpDraw();
}
</script>
