<!doctype html>
<html lang="ja">
<head><script>window.RL_HOME_URL="../../energy.html";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>じしゃくの ふしぎ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 見本 v0.1（2026-11-07）3年 理科 じしゃくの ふしぎ（理科ラボ エネルギー）
   ［さがそう］手が じしゃくに なる。近づけると 鉄の ものだけ 寄ってくる → つく／つかない に 分ける
   ［きょく］手の じしゃくを 台車の じしゃくに 近づける。同じ きょくは しりぞけ合い、ちがう きょくは 引き合う
   ［クイズ］もの が 1つ 出る。手の じしゃくを 左（つく）か 右（つかない）に 1びょう とめて えらぶ → 本当に 近づけて たしかめる
   （3年の 部屋なので 漢字は 3年までに） */
:root{
  /* エネルギーの 部屋：ポップ・黄と 赤（4つの 部屋で 名前を そろえる 5つ） */
  --rl-bg:#ffffff; --rl-ink:#1f2937; --rl-accent:#f5b700; --rl-accent2:#e0442b; --rl-soft:#fff6d6;
  --rl-blue:#1d4ed8; --rl-copper:#f3d9b1; --rl-err:#b91c1c; --rl-glass:#dbeafe; --rl-gray:#e5e7eb; --rl-line:#e2cf8e; --rl-mute:#9ca3af; --rl-n:#e0442b; --rl-ok:#1b7f3b; --rl-rule:#f3e8c4; --rl-stage:#fffbeb; --rl-sub:#4b5563; --rl-veil:rgba(255,255,255,.92); --rl-veil2:rgba(255,255,255,.6); --rl-white2:#f9fafb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--rl-bg);color:var(--rl-ink);
  font-family:"BIZ UDPGothic",sans-serif;font-size:16px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.re-app{display:grid;grid-template-rows:auto 1fr;gap:8px;height:100vh;height:100dvh;padding:8px 12px 12px}
.re-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:52px}
.re-tabs{display:flex;border:1px solid var(--rl-line);border-radius:12px;overflow:hidden}
.re-tabs button{min-height:44px;padding:0 16px;border:0;background:var(--rl-bg);font-size:16px;display:flex;align-items:center;gap:6px}
.re-tabs button+button{border-left:1px solid var(--rl-line)}
.re-tabs button[aria-pressed="true"]{background:var(--rl-accent);color:var(--rl-ink);box-shadow:inset 0 0 0 2px var(--rl-ink);font-weight:700}
.re-tabs svg,.re-b svg{width:22px;height:22px;flex:none}
.re-b{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--rl-line);background:var(--rl-soft);border-radius:12px;
  font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.re-b[hidden]{display:none!important}
.re-sp{flex:1}
.re-main{display:grid;grid-template-columns:1fr 250px;gap:10px;min-height:0}
.re-stage{position:relative;border-radius:12px;overflow:hidden;background:var(--rl-stage);min-height:0;touch-action:none}
.re-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.re-veil{position:absolute;inset:0;background:var(--rl-veil2)}
.re-veil[hidden],.re-stage video[hidden]{display:none!important}
.re-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.re-msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:6px 16px;border-radius:20px;
  background:var(--rl-veil);font-size:18px;font-weight:700;white-space:nowrap;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.re-msg:empty{display:none}
.re-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--rl-bg);padding:16px;text-align:center}
.re-start[hidden]{display:none!important}
.re-start p{margin:0;font-size:18px;line-height:1.7}
.re-start svg{width:min(200px,36%);height:auto}
.re-big{min-height:56px;padding:0 36px;font-size:22px;font-weight:700;border-radius:28px;border:0;background:var(--rl-accent);color:var(--rl-ink);box-shadow:inset 0 0 0 2px var(--rl-ink)}
.re-big:disabled{opacity:.6}
.re-gos{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.re-big{display:inline-flex;align-items:center;gap:8px}.re-big .re-ic{width:28px;height:28px;flex:none}.re-big.re-sub{background:var(--rl-bg)}
.re-err{color:var(--rl-err);font-size:16px;max-width:90%}
.re-err[hidden]{display:none!important}
.re-side{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--rl-line);border-radius:12px;padding:8px;min-height:0;background:var(--rl-bg)}
.re-side[hidden]{display:none!important}
.re-col{display:flex;flex-direction:column;min-height:0}
.re-col h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:4px}
.re-col h2 svg{width:22px;height:22px}
.re-col ul{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;flex:1}
.re-col li{font-size:15px;padding:4px 2px;border-top:1px solid var(--rl-rule)}
.re-pole{display:flex;flex-direction:column;gap:8px;border:1px solid var(--rl-line);border-radius:12px;padding:8px;background:var(--rl-bg);min-height:0}
.re-pole[hidden]{display:none!important}
.re-lab{font-size:15px;color:var(--rl-sub)}
.re-mag{display:flex;height:40px;border:2px solid var(--rl-ink);border-radius:6px;overflow:hidden;font-size:20px;font-weight:700}
.re-mag span{flex:1;display:flex;align-items:center;justify-content:center;color:var(--rl-bg)}
.re-mag .re-mn{background:var(--rl-n)} .re-mag .re-ms{background:var(--rl-blue)}
.re-quiz{display:flex;flex-direction:column;gap:8px;border:1px solid var(--rl-line);border-radius:12px;padding:8px;background:var(--rl-bg);min-height:0}
.re-quiz[hidden]{display:none!important}
.re-qbtns{display:grid;grid-template-columns:1fr;gap:6px}
.re-qbtns .re-b{min-height:52px;font-size:18px;font-weight:700}
.re-qbtns .re-b:disabled{opacity:.5;cursor:default}
.re-qcols{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:0;flex:1}
</style>
</head>
<body>
<div class="re-app">
  <div class="re-top">
    <div class="re-tabs" role="group" aria-label="あそびかた">
      <button type="button" id="reFindTab" aria-pressed="true">
        <svg data-ic="find"></svg>さがそう</button>
      <button type="button" id="rePoleTab" aria-pressed="false">
        <svg data-ic="poles"></svg>N と S</button>
      <button type="button" id="reQuizTab" aria-pressed="false">
        <svg data-ic="test"></svg>クイズ</button>
    </div>
    <span class="re-sp"></span>
    <button class="re-b" type="button" id="reReset" title="はじめに もどす">
      <svg data-ic="reset"></svg>もどす</button>
  </div>
  <div class="re-main">
    <div class="re-stage" id="reStage">
      <video id="reVideo" playsinline muted hidden></video>
      <div class="re-veil" id="reVeil" hidden></div>
      <canvas id="reCanvas"></canvas>
      <div class="re-msg" id="reMsg"></div>
      <div class="re-start" id="reStart">
        <svg viewBox="0 0 200 140" fill="none" stroke-width="4" stroke-linecap="round" aria-hidden="true" style="stroke:var(--rl-ink)">
          <rect x="60" y="20" width="40" height="24" style="fill:var(--rl-n)"/><rect x="100" y="20" width="40" height="24" style="fill:var(--rl-blue)"/>
          <path d="M40 112l30-12M140 104l20 14" /><path d="M96 78q-4 22 8 30" stroke-dasharray="4 6"/><rect x="88" y="106" width="26" height="12" rx="6"/>
        </svg>
        <p>手（ゆび）が じしゃくに なるよ。<br>いろいろな ものに 近づけて みよう。</p>
        <div class="re-gos"><button class="re-big" id="reGo" type="button"><svg class="re-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>カメラで</button><button class="re-big re-sub" id="reTap" type="button"><svg class="re-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12V5.5a1.8 1.8 0 0 1 3.6 0V12l3.6.8a2 2 0 0 1 1.5 2.3L18 21h-8l-3.3-4.6a1.6 1.6 0 0 1 2.4-2.1L10 15"/><path d="M6.5 6.5a5.5 5.5 0 0 1 10.5-1"/></svg>ゆびで</button></div>
        <div class="re-err" id="reErr" hidden></div>
      </div>
    </div>
    <section class="re-side" id="reFindSide" aria-label="つく ものと つかない もの">
      <div class="re-col"><h2><svg data-ic="yes"></svg>つく</h2><ul id="reYes"></ul></div>
      <div class="re-col"><h2><svg data-ic="no"></svg>つかない</h2><ul id="reNo"></ul></div>
    </section>
    <section class="re-pole" id="rePoleSide" aria-label="手の じしゃく" hidden>
      <span class="re-lab">手の じしゃく</span>
      <div class="re-mag" id="reHandMag"><span class="re-mn">N</span><span class="re-ms">S</span></div>
      <button class="re-b" type="button" id="reFlip">
        <svg data-ic="flip"></svg>向きを かえる</button>
    </section>
    <section class="re-quiz" id="reQuizSide" aria-label="クイズ" hidden>
      <span class="re-lab" id="reQNum"></span>
      <div class="re-qbtns">
        <button class="re-b" type="button" id="reQYesBtn"><svg data-ic="yes"></svg>つく</button>
        <button class="re-b" type="button" id="reQNoBtn"><svg data-ic="no"></svg>つかない</button>
      </div>
      <div class="re-qcols">
        <div class="re-col"><h2><svg data-ic="yes"></svg>つく</h2><ul id="reQYes"></ul></div>
        <div class="re-col"><h2><svg data-ic="no"></svg>つかない</h2><ul id="reQNo"></ul></div>
      </div>
    </section>
  </div>
</div>

const RE_ICONS={"find": "<path d=\"M4 3h5v10a3 3 0 0 0 6 0V3h5v10a8 8 0 0 1-16 0zM4 8h5M15 8h5\"/>", "flip": "<path d=\"M3 8h17l-4-4M21 16H4l4 4\"/>", "no": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 8 8 8M16 8l-8 8\"/>", "poles": "<rect x=\"2\" y=\"6\" width=\"20\" height=\"12\" rx=\"2\"/><path d=\"M12 6v12M5 15V9l4 6V9M19 9h-4v3h4v3h-4\"/>", "reset": "<path d=\"M4 11a8 8 0 1 1 1 6M4 4v7h7\"/>", "test": "<path d=\"M2 13h5M17 13h5M10 3l2 2 2-2M12 5v3\"/><rect x=\"7\" y=\"10\" width=\"10\" height=\"9\" rx=\"2\"/>", "yes": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m7 12 3 3 7-7\"/>"};
const RE_ART={"nail":{"w":60,"h":150,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"60\" height=\"150\" viewBox=\"0 0 60 150\"><g stroke=\"{ink}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 13h30v9H34v102l-4 15-4-15V22H15z\" fill=\"{gray}\" stroke=\"{ink}\" stroke-width=\"3\"/></g></svg>","pts":{"head":[30,13],"tip":[30,139]}},"clip":{"w":76,"h":128,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"76\" height=\"128\" viewBox=\"0 0 76 128\"><g stroke=\"{ink}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M29 85V28a15 15 0 0 1 30 0v66a22 22 0 0 1-44 0V31M46 29v61a6 6 0 0 1-12 0V37\" fill=\"none\" stroke=\"{ink}\" stroke-width=\"4\"/></g></svg>","pts":{"top":[44,13],"bottom":[37,116],"contactA":[15,64],"contactB":[59,64]}},"steelCan":{"w":120,"h":146,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"120\" height=\"146\" viewBox=\"0 0 120 146\"><g stroke=\"{ink}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M25 25v98c0 17 70 17 70 0V25z\" fill=\"{gray}\" stroke=\"{ink}\" stroke-width=\"3\"/><ellipse cx=\"60\" cy=\"25\" rx=\"35\" ry=\"12\" fill=\"{soft}\"/><ellipse cx=\"60\" cy=\"25\" rx=\"15\" ry=\"6\" fill=\"{bg}\"/><path d=\"M25 117c12 10 58 10 70 0\" fill=\"none\" stroke=\"{ink}\" stroke-width=\"3\"/><rect x=\"30\" y=\"55\" width=\"60\" height=\"41\" rx=\"3\" fill=\"{accent}\"/><text x=\"60\" y=\"76\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"{ink}\" stroke=\"none\" stroke-width=\"2\" paint-order=\"stroke\" font-family=\"'BIZ UDPGothic',sans-serif\" font-weight=\"700\" font-size=\"18\">鉄</text></g></svg>","pts":{"top":[60,13],"contactA":[25,105],"contactB":[95,105]}},"aluminumCan":{"w":120,"h":146,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"120\" height=\"146\" viewBox=\"0 0 120 146\"><g stroke=\"{ink}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M25 25v98c0 17 70 17 70 0V25z\" fill=\"{bg}\" stroke=\"{ink}\" stroke-width=\"3\"/><ellipse cx=\"60\" cy=\"25\" rx=\"35\" ry=\"12\" fill=\"{soft}\"/><ellipse cx=\"60\" cy=\"25\" rx=\"15\" ry=\"6\" fill=\"{bg}\"/><path d=\"M25 117c12 10 58 10 70 0\" fill=\"none\" stroke=\"{ink}\" stroke-width=\"3\"/><rect x=\"30\" y=\"55\" width=\"60\" height=\"41\" rx=\"3\" fill=\"{soft}\"/><text x=\"60\" y=\"76\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"{ink}\" stroke=\"none\" stroke-width=\"2\" paint-order=\"stroke\" font-family=\"'BIZ UDPGothic',sans-serif\" font-weight=\"700\" font-size=\"18\">アルミ</text></g></svg>","pts":{"top":[60,13],"contactA":[25,105],"contactB":[95,105]}},"coin10":{"w":100,"h":100,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"><g stroke=\"{ink}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"50\" cy=\"50\" r=\"43\" fill=\"{soft}\"/><circle cx=\"50\" cy=\"50\" r=\"35\" fill=\"{soft}\"/><text x=\"50\" y=\"47\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"{ink}\" stroke=\"none\" stroke-width=\"2\" paint-order=\"stroke\" font-family=\"'BIZ UDPGothic',sans-serif\" font-weight=\"700\" font-size=\"30\">10</text><text x=\"50\" y=\"72\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"{ink}\" stroke=\"none\" stroke-width=\"2\" paint-order=\"stroke\" font-family=\"'BIZ UDPGothic',sans-serif\" font-weight=\"700\" font-size=\"14\">円</text></g></svg>","pts":{"center":[50,50],"contactA":[7,50],"contactB":[93,50]}},"coin1":{"w":100,"h":100,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"><g stroke=\"{ink}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"50\" cy=\"50\" r=\"43\" fill=\"{gray}\"/><circle cx=\"50\" cy=\"50\" r=\"35\" fill=\"{gray}\"/><text x=\"50\" y=\"47\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"{ink}\" stroke=\"none\" stroke-width=\"2\" paint-order=\"stroke\" font-family=\"'BIZ UDPGothic',sans-serif\" font-weight=\"700\" font-size=\"30\">1</text><text x=\"50\" y=\"72\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"{ink}\" stroke=\"none\" stroke-width=\"2\" paint-order=\"stroke\" font-family=\"'BIZ UDPGothic',sans-serif\" font-weight=\"700\" font-size=\"14\">円</text></g></svg>","pts":{"center":[50,50],"contactA":[7,50],"contactB":[93,50]}},"glassBall":{"w":100,"h":100,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"100\" viewBox=\"0 0 100 100\"><g stroke=\"{ink}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"50\" cy=\"50\" r=\"39\" fill=\"{bg}\"/><path d=\"M25 45a26 26 0 0 1 23-21M67 71l7-8\" fill=\"none\" stroke=\"{ink}\" stroke-width=\"3\"/></g></svg>","pts":{"center":[50,50],"contactA":[11,50],"contactB":[89,50]}},"paper":{"w":120,"h":140,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"120\" height=\"140\" viewBox=\"0 0 120 140\"><g stroke=\"{ink}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 12h53l23 23v93H22z\" fill=\"{bg}\" stroke=\"{ink}\" stroke-width=\"3\"/><path d=\"M75 12v23h23\" fill=\"none\" stroke=\"{ink}\" stroke-width=\"3\"/><path d=\"M34 108h24\" fill=\"none\" stroke=\"{ink}\" stroke-width=\"3\"/></g></svg>","pts":{"contactA":[22,70],"contactB":[98,70]}},"cart":{"w":180,"h":90,"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"180\" height=\"90\" viewBox=\"0 0 180 90\"><g stroke=\"{ink}\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"15\" y=\"28\" width=\"150\" height=\"24\" rx=\"6\" fill=\"{accent}\"/><path d=\"M22 20v8M158 20v8M39 52v12M141 52v12\" fill=\"none\" stroke=\"{ink}\" stroke-width=\"3\"/><circle cx=\"39\" cy=\"67\" r=\"13\" fill=\"{gray}\"/><circle cx=\"141\" cy=\"67\" r=\"13\" fill=\"{gray}\"/><circle cx=\"39\" cy=\"67\" r=\"4\" fill=\"{bg}\"/><circle cx=\"141\" cy=\"67\" r=\"4\" fill=\"{bg}\"/></g></svg>","pts":{"load":[90,28],"left":[15,40],"right":[165,40]}}};

document.querySelectorAll('svg[data-ic]').forEach(e=>{ e.outerHTML=reIc(e.dataset.ic); });
const reImg={};
function reArt(n){ if(reImg[n]) return reImg[n]; const a=RE_ART[n], im=new Image();
  im.onload=()=>{ if(typeof draw==='function' && typeof cx!=='undefined') try{ draw(); }catch(e){} };   // 絵が 来たら 描き直す
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(a.svg.replace(/\{(\w+)\}/g,(m,k)=>C[k])); return reImg[n]=im; }
document.addEventListener('DOMContentLoaded',()=>Object.keys(RE_ART).forEach(n=>{ try{ reArt(n); }catch(e){} }));   // 先に 読んで おく（C が できてから）
// 絵 n の 点 at（名前・[x,y]・なしは まん中）が (x,y) に 来るように s 倍で 描く。ang で 回す
function reDraw(n,x,y,s,at,ang){ const a=RE_ART[n], im=reArt(n); if(!im.complete||!im.naturalWidth) return false;
  const p=at?(Array.isArray(at)?at:a.pts[at]):[a.w/2,a.h/2];
  cx.save(); cx.translate(x,y); if(ang) cx.rotate(ang); cx.scale(s,s); cx.drawImage(im,-p[0],-p[1],a.w,a.h); cx.restore(); return true; }

function rePt(n,x,y,s,at,k){ const a=RE_ART[n], p=at?(Array.isArray(at)?at:a.pts[at]):[a.w/2,a.h/2], q=a.pts[k]; return [x+(q[0]-p[0])*s, y+(q[1]-p[1])*s]; }

<script>
/* 色は :root の --rl- から 読む（ここに 色を 書かない） */
const C = new Proxy({}, {get:(o,k)=>o[k]||(o[k]=getComputedStyle(document.documentElement).getPropertyValue('--rl-'+k).trim())});

/* ===== じしゃくの きまり（ここ 1か所） ===== */
const JK = {
  ITEMS:[  // iron＝鉄で できている（じしゃくに つく）
    {k:'kugi', name:'鉄の くぎ', iron:true, mat:'鉄'},
    {k:'clip', name:'鉄の クリップ', iron:true, mat:'鉄'},
    {k:'steel',name:'スチールかん', iron:true, mat:'鉄'},
    {k:'alumi',name:'アルミかん', iron:false, mat:'アルミ'},
    {k:'en10', name:'10円玉', iron:false, mat:'どう'},
    {k:'en1',  name:'1円玉', iron:false, mat:'アルミ'},
    {k:'glass',name:'ガラス玉', iron:false, mat:'ガラス'},
    {k:'paper',name:'紙', iron:false, mat:'紙'},
  ],
  // 2つの きょくの 力（＋は しりぞけ合う、－は 引き合う）
  pole(a,b){ return a===b ? 1 : -1; },
  // クイズの じゅん（はじめは やさしく、金ぞくでも つかない ものを 間に はさむ）
  QUIZ:['clip','alumi','steel','en10','paper','kugi','en1','glass'],
  DWELL:1.0,   // 手を とめて えらぶ びょう
  SHOW:3.4,    // たしかめを 見せる びょう
};
window.JK=JK;

/* ===== 画面 ===== */
const $ = id => document.getElementById(id);
const cv=$('reCanvas'), cx=cv.getContext('2d');
let W=0,H=0;
const S = { mode:'find', hand:null, src:'', items:[], yes:[], no:[], flip:false, cart:{x:0.5, v:0, stuck:false}, q:null };
window.jk={S};

function fit(){
  const r=$('reStage').getBoundingClientRect(), d=window.devicePixelRatio||1;
  W=r.width; H=r.height; cv.width=Math.round(W*d); cv.height=Math.round(H*d); cx.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize', fit);
function setMsg(t){ const el=$('reMsg'); if(el.textContent!==t) el.textContent=t; }
const U=()=>Math.min(W,H);

function home(i){ const col=i%4, row=Math.floor(i/4); return [0.16+col*0.23, 0.52+row*0.3]; }
function reset(){
  S.items=JK.ITEMS.map((it,i)=>({...it, x:home(i)[0], y:home(i)[1], stuck:null}));
  S.yes=[]; S.no=[]; renderLists();
  S.cart={x:0.5, v:0, stuck:false};
}
function renderLists(){
  $('reYes').innerHTML=S.yes.map(k=>`<li>${JK.ITEMS.find(i=>i.k===k).name}</li>`).join('');
  $('reNo').innerHTML=S.no.map(k=>`<li>${JK.ITEMS.find(i=>i.k===k).name}</li>`).join('');
}
function setMode(m){
  S.mode=m; $('reFindTab').setAttribute('aria-pressed',String(m==='find')); $('rePoleTab').setAttribute('aria-pressed',String(m==='pole'));
  $('reQuizTab').setAttribute('aria-pressed',String(m==='quiz'));
  $('reFindSide').hidden=m!=='find'; $('rePoleSide').hidden=m!=='pole'; $('reQuizSide').hidden=m!=='quiz';
  S.cart={x:0.5,v:0,stuck:false};
  if(m==='quiz' && !S.q) quizReset();
  setMsg('');
}
$('reFindTab').onclick=()=>setMode('find');
$('rePoleTab').onclick=()=>setMode('pole');
$('reQuizTab').onclick=()=>setMode('quiz');
$('reReset').onclick=()=>{ if(S.mode==='quiz') quizReset(); else reset(); setMsg(''); };

/* ----- クイズ ----- */
const ZL=0.28, ZR=0.72;   // 左（つく）・右（つかない）の 場所
const item=k=>JK.ITEMS.find(i=>i.k===k);
function quizReset(){ S.q={i:0, phase:'ask', armed:false, side:null, dw:0, t:0, ans:[], from:null}; quizSide(); }
function quizSide(){ const q=S.q; if(!q) return;
  $('reQNum').textContent = q.phase==='end' ? 'ぜんぶ おわり' : (q.i+1)+' もんめ ／ '+JK.QUIZ.length+' もん';
  const done=q.ans.map(a=>item(a.k));
  $('reQYes').innerHTML=done.filter(i=>i.iron).map(i=>`<li>${i.name}</li>`).join('');
  $('reQNo').innerHTML=done.filter(i=>!i.iron).map(i=>`<li>${i.name}</li>`).join('');
  $('reQYesBtn').disabled=$('reQNoBtn').disabled = q.phase!=='ask'; }
function answer(side){ const q=S.q; if(!q||q.phase!=='ask') return;
  const it=item(JK.QUIZ[q.i]), ok=(side==='yes')===it.iron;
  q.ans.push({k:it.k, side, ok}); q.phase='show'; q.t=0; q.side=side; q.dw=0;
  q.from = S.hand ? {...S.hand} : {x: side==='yes'?ZL/2:(1+ZR)/2, y:0.5};
  quizSide(); }
function quizNext(){ const q=S.q; q.i++; q.armed=false; q.side=null; q.dw=0; q.t=0;
  q.phase = q.i>=JK.QUIZ.length ? 'end' : 'ask'; quizSide(); }
$('reQYesBtn').onclick=()=>answer('yes');
$('reQNoBtn').onclick=()=>answer('no');
function quizStep(dt){ const q=S.q, h=S.hand; if(!q) return;
  if(q.phase==='ask'){
    const side = !h ? null : h.x<ZL ? 'yes' : h.x>ZR ? 'no' : 'mid';
    if(side==='mid'){ q.armed=true; q.side=null; q.dw=0; }
    else if(side && q.armed){ if(q.side!==side){ q.side=side; q.dw=0; } q.dw+=dt; if(q.dw>=JK.DWELL) answer(side); }
    else { q.side=null; q.dw=0; }
  } else if(q.phase==='show'){ q.t+=dt; if(q.t>=JK.SHOW) quizNext(); }
}
window.jk.answer=answer; window.jk.quizReset=quizReset;
$('reFlip').onclick=()=>{ S.flip=!S.flip; const m=$('reHandMag'); m.innerHTML = S.flip ? '<span class="re-ms">S</span><span class="re-mn">N</span>' : '<span class="re-mn">N</span><span class="re-ms">S</span>'; S.cart.stuck=false; };

/* ----- 動き ----- */
// 手の じしゃく：左の はしと 右の はし（flip で 入れかわる）
function handPoles(){ const h=S.hand; if(!h) return []; const hw=0.07*U()/W;
  return [{x:h.x-hw, y:h.y, p:S.flip?'S':'N'}, {x:h.x+hw, y:h.y, p:S.flip?'N':'S'}]; }
function cartGeo(){ const hw=0.09*U()/W; return {y:0.7, hw, poles:[{x:S.cart.x-hw,p:'S'},{x:S.cart.x+hw,p:'N'}]}; }
function advance(dt){
  const h=S.hand;
  if(S.mode==='quiz'){ quizStep(dt); return; }
  if(S.mode==='find'){
    const R=0.26*U(), near=0.06*U();
    for(const it of S.items){
      if(it.stuck){ if(h){ it.x=h.x+it.stuck[0]; it.y=h.y+it.stuck[1]; } continue; }
      if(!h) continue;
      const dx=(h.x-it.x)*W, dy=(h.y-it.y)*H, d=Math.hypot(dx,dy);
      if(it.iron){
        if(d<near){ it.stuck=[(it.x-h.x)*0.6,(it.y-h.y)*0.6+0.05]; if(!S.yes.includes(it.k)){ S.yes.push(it.k); renderLists(); } }
        else if(d<R){ const sp=Math.min(900, 60000/(d+20))*dt; it.x+=dx/d*sp/W; it.y+=dy/d*sp/H; }
      } else if(d<near*1.6 && !S.no.includes(it.k)){ S.no.push(it.k); renderLists(); }
    }
  } else {
    const c=cartGeo(); let F=0;
    if(h && !S.cart.stuck){
      for(const a of handPoles()) for(const b of c.poles){
        const dx=(b.x-a.x)*W, dy=(c.y-a.y)*H, d=Math.max(12,Math.hypot(dx,dy));
        F += JK.pole(a.p,b.p) * dx/d * 4e6/(d*d);
      }
      S.cart.v += F*dt; S.cart.v*=Math.pow(0.15,dt);
      S.cart.x += S.cart.v*dt/W;
      // 引き合って くっつく
      for(const a of handPoles()) for(const b of cartGeo().poles)
        if(JK.pole(a.p,b.p)<0 && Math.abs((b.x-a.x)*W)<0.03*U() && Math.abs((c.y-a.y)*H)<0.08*U()) S.cart.stuck={dx:S.cart.x-h.x};
    } else if(h && S.cart.stuck){ S.cart.x=h.x+S.cart.stuck.dx; S.cart.v=0;
      if(Math.abs((c.y-h.y)*H)>0.2*U()) S.cart.stuck=false; }
    else { S.cart.v*=Math.pow(0.15,dt); S.cart.x+=S.cart.v*dt/W; }
    const lo=c.hw+0.03, hi=1-c.hw-0.03; if(S.cart.x<lo){ S.cart.x=lo; S.cart.v=0; } if(S.cart.x>hi){ S.cart.x=hi; S.cart.v=0; }
  }
}
window.jk.advance=advance; window.jk.reset=reset; window.jk.setMode=setMode; window.jk.cartGeo=cartGeo; window.jk.handPoles=handPoles;

function onHand(p){ S.hand=p?{x:p.x,y:p.y}:null; if(!p && S.src==='cam') setMsg('手を 見せてね'); else setMsg(''); }

function label(t,x,y){ cx.fillStyle=C.ink; cx.font='700 14px "BIZ UDPGothic",sans-serif'; cx.textAlign='center'; cx.textBaseline='top'; cx.fillText(t,x,y); }
const ITEMART={kugi:'nail',clip:'clip',steel:'steelCan',alumi:'aluminumCan',en10:'coin10',en1:'coin1',glass:'glassBall',paper:'paper'};
function drawItem(it){
  const x=it.x*W, y=it.y*H, n=ITEMART[it.k], A=RE_ART[n], sz=Math.max(42,U()*0.13), k=sz/Math.max(A.w,A.h);
  reDraw(n, x, y, k);
  if(!it.stuck) label(it.name, x, y+sz/2+6);
}
function drawBar(x,y,hw,hh,left,right){
  for(const [p,x0] of [[left,x-hw],[right,x]]){
    cx.fillStyle= p==='N'?C.n:C.blue; cx.fillRect(x0,y-hh,hw,hh*2);
    cx.fillStyle=C.bg; cx.font=`700 ${Math.max(19,Math.round(hh*1.1))}px "BIZ UDPGothic",sans-serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(p,x0+hw/2,y+1);
  }
  cx.lineWidth=3; cx.strokeStyle=C.ink; cx.strokeRect(x-hw,y-hh,hw*2,hh*2);
}
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function text(t,x,y,px,col,al){ cx.fillStyle=col||C.ink; cx.font=`700 ${px}px "BIZ UDPGothic",sans-serif`; cx.textAlign=al||'center'; cx.textBaseline='middle'; cx.fillText(t,x,y); }
function mark(ok,x,y,r){ cx.lineWidth=Math.max(5,r*0.22); cx.lineCap='round'; cx.strokeStyle= ok?C.ok:C.err; cx.beginPath();
  if(ok) cx.arc(x,y,r,0,Math.PI*2); else { cx.moveTo(x-r,y-r); cx.lineTo(x+r,y+r); cx.moveTo(x+r,y-r); cx.lineTo(x-r,y+r); } cx.stroke(); }
function drawQuiz(){
  const q=S.q; if(!q) return; const u=U();
  if(q.phase==='end'){
    text('じしゃくに つく もの', W/2, H*0.12, Math.max(18,u*0.05));
    const row=(list,y)=>list.forEach((it,i)=>{ const n=ITEMART[it.k], A=RE_ART[n], sz=Math.max(40,u*0.13), k=sz/Math.max(A.w,A.h), x=W*(i+1)/(list.length+1);
      reDraw(n,x,y,k); label(it.name,x,y+sz/2+4); });
    row(JK.ITEMS.filter(i=>i.iron), H*0.3);
    text('つかない もの', W/2, H*0.5, Math.max(18,u*0.05));
    row(JK.ITEMS.filter(i=>!i.iron), H*0.68);
    text('つく ものは どれも 鉄で できているね', W/2, H*0.92, Math.max(17,u*0.045));
    return;
  }
  const it=item(JK.QUIZ[q.i]), qpx=Math.max(18,Math.min(28,u*0.06)), qy=Math.max(58,H*0.12), zy=qy+qpx*1.1;
  // 左右の 答えの 場所
  for(const [side,x0,x1,t] of [['yes',0.02,ZL,'つく'],['no',ZR,0.98,'つかない']]){
    if(q.phase==='show' && q.side!==side) continue;     // たしかめ中は えらんだ 方だけ
    const on = q.side===side, x=x0*W, w=(x1-x0)*W, y=zy, h=H*0.96-zy;
    cx.fillStyle= on?C.soft:C.veil; cx.beginPath(); cx.roundRect(x,y,w,h,16); cx.fill();
    cx.lineWidth= on?4:2; cx.strokeStyle= on?C.ink:C.line; cx.setLineDash(on?[]:[8,8]); cx.stroke(); cx.setLineDash([]);
    text(t, x+w/2, y+h/2, Math.max(22,Math.min(34,w*0.2)));
  }
  text('じしゃくに つく？ つかない？', W/2, qy, qpx);
  // もの
  const n=ITEMART[it.k], A=RE_ART[n], sz=Math.max(56,u*0.24), k=sz/Math.max(A.w,A.h);
  const hh=u*0.04, hw=0.07*u, iy0=Math.max(H*0.5, zy+hh*2+sz/2+12);
  let ix=W/2, iy=iy0;
  let mx=null,my=null;
  if(q.phase==='show'){
    const f=q.from, tx=ix, ty=iy-sz/2-hh-4, a=ease(q.t/1.0);
    mx=f.x*W+(tx-f.x*W)*a; my=f.y*H+(ty-f.y*H)*a;
    my = Math.max(Math.min(my, zy+hh+4), my-ease((q.t-1.3)/0.6)*u*0.12);   // じしゃくを 持ち上げる（問いに かからない）
    if(it.iron && q.t>=1.0) iy = my+hh+sz/2+4;
    else if(q.t<1.0 || !it.iron) iy = iy0;        // 鉄は いっしょに 持ち上がる
  }
  reDraw(n, ix, iy, k);
  if(q.phase==='ask') label(it.name, ix, iy+sz/2+6);
  if(mx!==null) drawBar(mx,my,hw,hh,S.flip?'S':'N',S.flip?'N':'S');
  if(q.phase==='show' && q.t>1.3){
    const a=q.ans[q.ans.length-1], r=Math.max(18,u*0.06);
    mark(a.ok, ix+sz*0.75, iy0-sz*0.25, r);
    const px=Math.max(17,Math.min(24,u*0.05)), two=!it.name.includes(it.mat);
    const l1=(a.ok?'○ そのとおり。':'× ちがうよ。')+it.name+'は じしゃくに '+(it.iron?'つく':'つかない'), l2=it.name+'は '+it.mat+'で できているよ';
    cx.font=`700 ${px}px "BIZ UDPGothic",sans-serif`; const bw=Math.min(W-16, cx.measureText(l1).width+32), bh=px*(two?3.2:1.9);
    const ty=Math.min(H-bh-8, iy0+sz/2+14);
    cx.fillStyle=C.veil; cx.strokeStyle=C.line; cx.lineWidth=2; cx.beginPath(); cx.roundRect(W/2-bw/2, ty, bw, bh, 12); cx.fill(); cx.stroke();
    text(l1, W/2, ty+px*0.95, px);
    if(two) text(l2, W/2, ty+px*2.3, Math.max(16,px*0.85), C.sub);
  }
  // えらんでいる 間の わっか
  if(q.phase==='ask' && S.hand && q.side && q.dw>0){
    const x=S.hand.x*W, y=S.hand.y*H; cx.lineWidth=7; cx.strokeStyle=C.accent2; cx.lineCap='round';
    cx.beginPath(); cx.arc(x,y,u*0.11,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,q.dw/JK.DWELL)); cx.stroke();
  }
  if(q.phase==='ask' && S.hand && !q.armed) text('手を まん中に もどしてね', W/2, H*0.92, 17, C.sub);
}
function draw(){
  cx.clearRect(0,0,W,H);
  if(S.mode==='quiz'){ drawQuiz(); if(S.hand && S.q && S.q.phase==='ask') drawHand(); return; }
  if(S.mode==='find'){
    for(const it of S.items) if(!it.stuck) drawItem(it);
  } else {
    // 台車の じしゃく（S｜N）と レール
    const c=cartGeo(), y=c.y*H, hw=c.hw*W, hh=U()*0.045;
    const ck=hw*2.5/180, rail=y+hh+(90-28)*ck;
    cx.strokeStyle=C.mute; cx.lineWidth=4; cx.beginPath(); cx.moveTo(16,rail+2); cx.lineTo(W-16,rail+2); cx.stroke();
    reDraw('cart', S.cart.x*W, y+hh, ck, 'load');
    drawBar(S.cart.x*W, y, hw, hh, 'S','N');
  }
  if(S.hand){ drawHand(); if(S.mode==='find') for(const it of S.items) if(it.stuck) drawItem(it); }
}
// 手の じしゃく
function drawHand(){ {
    const x=S.hand.x*W, y=S.hand.y*H, hw=0.07*U(), hh=U()*0.04;
    drawBar(x,y,hw,hh, S.flip?'S':'N', S.flip?'N':'S');
    const ly=y-hh-18; cx.lineWidth=3; cx.strokeStyle=C.accent2; cx.fillStyle=C.veil; cx.beginPath(); cx.arc(x,ly,13,0,Math.PI*2); cx.fill(); cx.stroke();
    cx.fillStyle=C.ink; cx.font='700 14px "BIZ UDPGothic",sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('手',x,ly+1);
  }
}

<script type="module">
/* ===== カメラと 手の トラッキング（人さし指の 先を 読む・しるしは RsTe） ===== */
const $ = id => document.getElementById(id);
const VER = '0.10.14';
const video = $('reVideo');
let lm=null, lastT=-1, modelP=null;
async function loadModel(){
  const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`);
  const fs = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`);
  const opts = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d },
    runningMode:'VIDEO', numHands:1, minHandDetectionConfidence:0.5, minHandPresenceConfidence:0.5, minTrackingConfidence:0.5 });
  try{ return await vision.HandLandmarker.createFromOptions(fs, opts('GPU')); }
  catch(e){ return await vision.HandLandmarker.createFromOptions(fs, opts('CPU')); }
}
if(!/[?&]test/.test(location.search)){
  modelP = loadModel().catch(e=>{ modelP=null; throw e; }); modelP.catch(()=>{});
  $('reGo').onclick = start;
}
async function start(){
  const err=$('reErr'); err.hidden=true;
  $('reGo').disabled=true; $('reGo').textContent='じゅんびちゅう…';
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const e=new Error('nocam'); e.name='NoCamPage'; throw e; }
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    lm = await (modelP || (modelP = loadModel()));
    window.jk.S.src='cam'; $('reStart').hidden=true; video.hidden=false; $('reVeil').hidden=false;
    loop();
  }catch(e){
    $('reGo').disabled=false; $('reGo').textContent='もう いちど';
    err.hidden=false;
    err.textContent = (e && e.name==='NoCamPage') ? 'この ひらきかたでは カメラが つかえません。Chrome で ひらいてね。'
      : (e && (e.name==='NotFoundError'||e.name==='NotReadableError')) ? 'カメラが みつかりません。ほかの アプリで つかっていないか みてね。'
      : (e && e.name==='NotAllowedError') ? 'カメラが つかえません。先生に カメラを ゆるして もらってね。'
      : 'じゅんびが できませんでした（'+(e && (e.name||e.message)||'')+'）。インターネットに つながっているか みてね。';
  }
}
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  if(!lm || video.readyState<2 || video.currentTime===lastT) return;
  lastT=video.currentTime;
  const res = lm.detectForVideo(video, now);
  const L = (res.landmarks||[])[0];
  if(!L){ if(window.RsTe) RsTe.point(null); window.jk.camHand(null); return; }
  // しるしは 人さし指の 先（画面 ぜんたい。ボタンの 上で とめると おせる）。ふるえは RsTe が へらす
  const c = window.RsTe ? RsTe.point(1-L[8].x, L[8].y) : null;
  if(c) window.jk.camHand(c);
}
</script>
