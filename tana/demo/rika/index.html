<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理科ラボ</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* mock/tools/make_rika_heya.py で 作ったもの。ここは 直さず、作る道具を 直して 流す */
:root{--rl-bg:#ffffff;--rl-ink:#1f2937;--rl-sub:#4b5563;--rh-line:#d1d5db}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--rl-bg);color:var(--rl-ink);font-family:"BIZ UDPGothic",sans-serif;font-size:16px}
.rh-app{max-width:1180px;margin:0 auto;padding:12px 16px 14px}
.rh-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rh-h{margin:0;font-size:28px;display:flex;align-items:baseline;gap:10px;letter-spacing:.03em}
.rh-h small{font-size:16px;color:var(--rl-sub);font-weight:400}
.rh-tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.rh-tab{display:flex;align-items:center;gap:4px;min-height:44px;min-width:44px;justify-content:center;padding:0 14px;border:1px solid var(--rh-line);border-radius:22px;
  color:var(--rl-ink);text-decoration:none;font-size:16px}
.rh-tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rh-tab[aria-current]{border:2px solid var(--rl-ink);font-weight:700}
.rh-pic{display:block;background:#fff;min-height:0;min-width:0}
.rh-pic img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion:reduce){.rh-c,.rk-c{transition:none!important}}
.rh-app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.rk-grid{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:14px;flex:1;min-height:0}
.rk-c{display:grid;grid-template-columns:1fr 170px;grid-template-rows:1fr auto auto 1fr;min-height:0;border-radius:18px;overflow:hidden;
  background:var(--c-soft);border:1px solid var(--c-line);color:var(--c-ink);text-decoration:none;transition:transform .15s}
.rk-c:hover,.rk-c:focus-visible{transform:translateY(-3px);outline:2px solid var(--rl-ink);outline-offset:2px}
.rk-c .rh-pic{grid-row:1/5;height:100%}
.rk-n{grid-row:2;padding:0 16px 4px;font-size:24px;font-weight:700;white-space:nowrap}
.rk-s{grid-row:3;padding:0 16px;font-size:16px;color:var(--c-sub)}
@media (max-width:760px){.rh-app{height:auto}.rk-grid{grid-template-columns:1fr;grid-template-rows:none}
  .rk-c{grid-template-columns:1fr;grid-template-rows:auto auto auto}.rk-c .rh-pic{grid-row:auto;aspect-ratio:3/2;height:auto}.rk-s{padding-bottom:14px}.rk-n{padding-top:10px}}
</style>
</head>
<body>
<div class="rh-app">
  <div class="rh-top">
    <h1 class="rh-h">理科ラボ</h1>

  </div>
  <div class="rk-grid"><a class="rk-c" href="energy.html" style="--c-soft:#fff6d6;--c-ink:#1f2937;--c-sub:#4b5563;--c-line:#e5c76b"><span class="rh-pic"><img src="img/C/energy_720.webp" alt=""></span><span class="rk-n">でんきや力</span><span class="rk-s">7つの へや</span></a><a class="rk-c" href="ryushi.html" style="--c-soft:#e6f6fc;--c-ink:#1f2937;--c-sub:#4b5563;--c-line:#9fd3ea"><span class="rh-pic"><img src="img/C/ryushi_720.webp" alt=""></span><span class="rk-n">もののつくり</span><span class="rk-s">5つの へや</span></a><a class="rk-c" href="seimei.html" style="--c-soft:#eaf6ec;--c-ink:#1f2937;--c-sub:#4b5563;--c-line:#a9d3b4"><span class="rh-pic"><img src="img/C/seimei_720.webp" alt=""></span><span class="rk-n">いきもの</span><span class="rk-s">6つの へや</span></a><a class="rk-c" href="chikyu.html" style="--c-soft:#1b2a55;--c-ink:#f3f5ff;--c-sub:#c3cbe8;--c-line:#3a4c86"><span class="rh-pic"><img src="img/C/chikyu_720.webp" alt=""></span><span class="rk-n">そらと大地</span><span class="rk-s">7つの へや</span></a></div>
</div>
</body>
</html>
