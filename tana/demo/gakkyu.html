/* ===== 🗣 終末の助言メモ(会の終わりの先生の話をこの記録から言えるようにする) =====
   記録した「どんなことを言ったか」「行動の価値」を児童ごとに並べて出す。
   ＋を押すと、その具体が 良かった点/課題点 に入る(掲示・振り返りにそのまま残る)。 */
function openKatari() {
  var gid = App.kaigi ? App.kaigi.議題ID : (App._kaigiReview || {}).gidaiId;
  if (!gid) return;
  var el0 = el('<div class="overlay" id="overlay" onclick="if(event.target===this)closeKatari()">' +
    '<div class="sheet sheet--katari"><button class="btn sheet__close" onclick="closeKatari()">閉じる</button>' +
    '<div class="sheet__title">' + mtIco('chat') + ' 終末の助言メモ</div>' +
    '<div id="katari-body"><div class="panel__lead">読み込み中…</div></div></div></div>');
  document.body.appendChild(el0);
  callServer('getKaigiKatari', gid).then(function (k) { App._katari = k; paintKatari(); })
    .catch(function (e) { var h = document.getElementById('katari-body'); if (h) h.innerHTML = '<div class="err">' + escapeHtml((e && e.message) || e) + '</div>'; });
}
function closeKatari() { var o = document.getElementById('overlay'); if (o) o.remove(); }
function paintKatari() {
  var k = App._katari, host = document.getElementById('katari-body'); if (!k || !host) return;
  var g = k['議題'] || {}, c = k['件数'] || {};
  var pend = (App.queue && App.queue.length) ? '<div class="katari-pend">未保存 ' + App.queue.length + '件を送信中です。少し待つとここに出ます。</div>' : '';
  var cards = (k['語り'] || []).map(function (b, bi) {
    var items = b['具体'].map(function (it, ii) {
      return '<div class="kt-item"><span class="kt-tag kt-tag--' + (it['種別'] === 'よさ' ? 'yosa' : 'speech') + '">' +
        (it['種別'] === 'よさ' ? 'よさ ' : '') + escapeHtml(it['ラベル']) + '</span>' +
        '<span class="kt-text">「' + escapeHtml(it['記述']) + '」</span>' +
        (it['時刻'] ? '<span class="kt-time">' + escapeHtml(it['時刻']) + '</span>' : '') +
        '<button type="button" class="kt-add" title="良かった点に入れる" onclick="katariInsert(' + bi + ',' + ii + ',\'good\')">＋よかった</button>' +
        '<button type="button" class="kt-add kt-add--issue" title="課題点に入れる" onclick="katariInsert(' + bi + ',' + ii + ',\'issue\')">＋次は</button>' +
      '</div>';
    }).join('');
    return '<div class="kt-card"><div class="kt-name">' + escapeHtml(b['表示名']) +
      '<span class="kt-cnt">発言' + b['発言数'] + '・よさ' + b['よさ数'] + '</span></div>' + items + '</div>';
  }).join('');
  var quiet = (k['記述なし'] || []).length
    ? '<div class="kt-sub"><b>発言はあったが具体を書いていない子</b><div class="namelist">' +
      k['記述なし'].map(function (x) { return '<span>' + escapeHtml(x['表示名']) + '(' + x['発言数'] + ')</span>'; }).join('') + '</div></div>' : '';
  var zero = (k['発言ゼロ'] || []).length
    ? '<div class="kt-sub"><b>まだ発言のない子</b><div class="namelist">' +
      k['発言ゼロ'].map(function (x) { return '<span>' + escapeHtml(x['表示名']) + '</span>'; }).join('') + '</div>' +
      '<div class="sheet__label">聴く姿のよさを押す・意図的指名の材料に。</div></div>' : '';
  host.innerHTML =
    '<div class="sheet__label">' + (g['回'] ? '第' + g['回'] + '回 ' : '') + escapeHtml(g['議題名'] || '') +
      (g['めあて'] ? ' ・ めあて: ' + escapeHtml(g['めあて']) : '') + '</div>' +
    pend +
    '<p class="sheet__label" style="margin:6px 0 12px">記録した具体を読み上げれば、そのまま終わりの話になります。' +
      '＋を押すと下の欄に入り、振り返り・掲示に残ります(掲示に名前は出ないよう、記述だけが入ります)。</p>' +
    (cards || '<div class="panel__lead">まだ具体の記述がありません。発言やよさを押したときに出る欄に一言書くとここに並びます。' + (c['具体'] === 0 ? '' : '') + '</div>') +
    quiet + zero +
    '<div class="memo3" style="margin-top:14px">' +
      '<div class="mbox"><label>良かった点 <span class="badge badge--pub">' + mtIco('display') + ' 掲示に載ります</span></label>' +
        '<textarea id="kt-good" onchange="katariSaveMemo()"></textarea></div>' +
      '<div class="mbox"><label>課題点 <span class="badge badge--pub">' + mtIco('display') + ' 掲示に載ります</span></label>' +
        '<textarea id="kt-issue" onchange="katariSaveMemo()"></textarea></div>' +
    '</div>';
  // 既に書いてある振り返りメモを必ず読み込んでから編集する(空で上書きしないため)
  var memo = k['メモ'] || { '良かった点': g['良かった点'] || '', '課題点': g['課題点'] || '' };
  var good = document.getElementById('kt-good'), issue = document.getElementById('kt-issue');
  if (good) good.value = memo['良かった点'] || '';
  if (issue) issue.value = memo['課題点'] || '';
}
function katariInsert(bi, ii, target) {
  var k = App._katari; if (!k) return;

/* 子どものつながり図(ソシオグラム)。相手に向く発言のつなぎ先を円周に並べ、向き付きの線でつなぐ。
   ノード=関わった子・線の太さ=回数。※SVGはCSS変数不可なので色は直値。 */
function tsunagariSectionHtml(r) {
  var tg = r['つながり'] || { 'ノード': [], 'エッジ': [] };
  var nodes = tg['ノード'] || [], edges = tg['エッジ'] || [];
  if (!edges.length) {
    return '<div class="st-section"><h3>' + mtIco('link') + ' 子どものつながり</h3>' +
      '<div style="color:var(--ink-sub)">まだ「相手に向く発言(賛成・反対・質問・心配・まとめ・付け足し)」のつなぎ先が記録されていません。<br>' +
      'ライブ画面でこれらの発言を選んで発言者→相手をタップすると、だれの意見をだれが受けたかがここに見えます。</div></div>';
  }
  var n = nodes.length, cx = 240, cy = 175, R = 125;
  var pos = {};
  nodes.forEach(function (nd, i) {
    var a = -Math.PI / 2 + (2 * Math.PI * i / n);
    pos[nd['児童ID']] = { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
  });
  var maxCount = edges.reduce(function (m, e) { return Math.max(m, e.count); }, 1);
  var lines = edges.map(function (e) {
    var p = pos[e.from], q = pos[e.to]; if (!p || !q) return '';
    var w = 1.5 + 4 * (e.count / maxCount);
    return '<line x1="' + p.x.toFixed(1) + '" y1="' + p.y.toFixed(1) + '" x2="' + q.x.toFixed(1) + '" y2="' + q.y.toFixed(1) +
      '" stroke="#7c5cd6" stroke-width="' + w.toFixed(1) + '" stroke-linecap="round" opacity="0.5" marker-end="url(#tg-arrow)"/>';
  }).join('');
  var dots = nodes.map(function (nd) {
    var p = pos[nd['児童ID']]; var sz = 5 + Math.min(10, (nd['入計'] || 0) * 2);
    var anchor = (p.x < cx - 6) ? 'end' : (p.x > cx + 6 ? 'start' : 'middle');
    var lx = p.x + (anchor === 'end' ? -8 : anchor === 'start' ? 8 : 0);
    return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + sz + '" fill="#6D4FC4" opacity="0.85"/>' +
      '<text x="' + lx.toFixed(1) + '" y="' + (p.y + 4).toFixed(1) + '" font-size="12" text-anchor="' + anchor + '" fill="#1A1D21">' + escapeHtml(nd['表示名']) + '</text>';
  }).join('');
  var svg = '<svg viewBox="0 0 480 350" style="width:100%;max-width:480px;height:auto">' +
    '<defs><marker id="tg-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" fill="#7c5cd6"/></marker></defs>' +
    lines + dots + '</svg>';
  function rank(key) {
    return nodes.slice().sort(function (a, b) { return (b[key] || 0) - (a[key] || 0); })
      .filter(function (x) { return (x[key] || 0) > 0; }).slice(0, 5)
      .map(function (x) { return '<span class="tg-chip">' + escapeHtml(x['表示名']) + ' <b>' + x[key] + '</b></span>'; }).join('') || '—';
  }
  return '<div class="st-section"><h3>' + mtIco('link') + ' 子どものつながり <span style="font-weight:600;font-size:14px;color:var(--ink-sub)">相手に向く発言のつなぎ先(矢印=向き・太さ=回数)</span></h3>' +
    '<div class="tg-wrap">' + svg +
      '<div class="tg-side">' +
        '<div class="sheet__label">よくつないだ子(→ 相手へ)</div><div class="tg-chips">' + rank('出計') + '</div>' +
        '<div class="sheet__label" style="margin-top:12px">よく取り上げられた子(← 相手から)</div><div class="tg-chips">' + rank('入計') + '</div>' +
        '<div class="sheet__label" style="margin-top:12px;color:var(--ink-sub)">円周=関わった子 / 円の大きさ=受けた回数</div>' +
      '</div>' +
    '</div></div>';
}

/* =======================================================================
   見取り設計書 v1.0 §2/§7 — 事後の欄(話し合いの途中では押さない)
   -----------------------------------------------------------------------
   ゆずる  : 決まったあと。自分の案が通らなくても決定を引き受けた瞬間＝合意形成そのもの。
             学級会は集団で決めるので、途中では押す機会が構造的にない。
   自己実現: 実践期間中、日をまたいで数人ぶんずつ足していく。
             学級活動(1)の本時にはほぼ写らない。写るのは議題提案と出し合い(§7)。
   記録先は よさ記録 で途中のものと同じ(追記専用・取り消しは打消し行)。
   ======================================================================= */
function atoSectionHtml(r) {
  var a = r['事後'];
  if (!a || !a['有効'] || !(a['スタンプ'] || []).length) return '';
  return '<div class="st-section" id="st-ato"><h3>決まったあとの見取り</h3>' +
    '<div class="kp-note kp-note--lead">' +
      'ここは<b>話し合いの途中では押さないボタン</b>です。会の最中のパレットには出しません。<br>' +
      '「自己実現」は実践期間のあいだ、日をまたいで数人ぶんずつ足していけます。あとから何度でも開けます。' +
    '</div>' +
    '<div id="ato-body">' + atoBodyHtml(r) + '</div></div>';
}
function atoBodyHtml(r) {
  var a = r['事後'], recs = a['記録'] || [], kids = a['児童'] || [];
  // スタンプ -> 児童ID -> [記録(新しい順)]
  var idx = {};
  recs.forEach(function (rec) {
    var st = rec['スタンプ'], sid = rec['児童ID'];
    ((idx[st] = idx[st] || {})[sid] = idx[st][sid] || []).push(rec);
  });
  return (a['スタンプ'] || []).map(function (st) {
    var name = st['スタンプ'], mine = idx[name] || {};
    var chips = kids.map(function (k) {
      var got = (mine[k['児童ID']] || []).length;
      return '<button type="button" class="mkato__chip' + (got ? ' on' : '') + '" ' +
        'title="' + escapeAttr(got ? 'もう一度押すと、いちばん新しい1件を取り消します' : '押すと1件記録します') + '" ' +
        'onclick="tapAto(\'' + escapeAttr(name) + '\',\'' + escapeAttr(k['児童ID']) + '\')">' +
        escapeHtml(k['表示名']) + (got > 1 ? '<span class="n">×' + got + '</span>' : '') + '</button>';
    }).join('');
    var list = recs.filter(function (x) { return x['スタンプ'] === name; })
      .sort(function (x, y) { return String(y['日時']).localeCompare(String(x['日時'])); })
      .map(function (x) {
        return '<div class="mkato__item">' +
          '<div class="who">' + escapeHtml(x['表示名']) + '</div>' +
          '<textarea placeholder="どんな場面だったか(書かなくてもよい)" ' +
            'onchange="saveAtoMemo(\'' + escapeAttr(x['記録ID']) + '\', this.value)">' + escapeHtml(x['メモ'] || '') + '</textarea>' +
          '<button type="button" class="undo" onclick="undoAto(\'' + escapeAttr(x['記録ID']) + '\')">↩ 取り消す</button>' +
        '</div>';
      }).join('');
    return '<div class="mkato__stamp">' +
      '<div class="mkato__head">' + escapeHtml(name) + '</div>' +
      (st['押す条件'] ? '<div class="mkato__cond">' + escapeHtml(st['押す条件']) + '</div>' : '') +
      '<div class="mkato__chips">' + chips + '</div>' +
      (list ? '<div class="mkato__list">' + list + '</div>' : '') +
    '</div>';
  }).join('');
}
function repaintAto() {
  var R = App._kaigiReview, host = document.getElementById('ato-body');
  if (R && host) host.innerHTML = atoBodyHtml(R.data);
}
/** 事後スタンプのタップ。未記録なら1件追記 / 記録済みならいちばん新しい1件を取り消す(トグル)。 */
function tapAto(stamp, sid) {
  var R = App._kaigiReview; if (!R) return;
  var a = R.data['事後'], recs = a['記録'] || [];
  var mine = recs.filter(function (x) { return x['スタンプ'] === stamp && x['児童ID'] === sid; })
    .sort(function (x, y) { return String(y['日時']).localeCompare(String(x['日時'])); });
  if (mine.length) { undoAto(mine[0]['記録ID']); return; }
  var kid = (a['児童'] || []).filter(function (k) { return k['児童ID'] === sid; })[0] || {};
  var rec = { '記録ID': uuid(), '日時': nowLocal(), 'モード': '学級会', '文脈ID': R.gidaiId,
    '児童ID': sid, 'スタンプ': stamp, 'メモ': '', 'つながり先児童ID': '' };
  a['記録'].push({ '記録ID': rec['記録ID'], '日時': rec['日時'], '児童ID': sid, 'スタンプ': stamp,
    'メモ': '', 'つながり先児童ID': '', '表示名': kid['表示名'] || sid });
  repaintAto();
  callServer('appendYosa', rec).catch(alertErr);
}
/** 事後の記録を取り消す(打消し行を追記。行は消さない)。 */
function undoAto(recId) {
  var R = App._kaigiReview; if (!R) return;
  var a = R.data['事後'];
  var hit = (a['記録'] || []).filter(function (x) { return x['記録ID'] === recId; })[0];
  if (!hit) return;
  a['記録'] = a['記録'].filter(function (x) { return x['記録ID'] !== recId; });
  repaintAto();
  callServer('cancelYosa', { '取消対象ID': recId, 'モード': '学級会', '文脈ID': R.gidaiId, '児童ID': hit['児童ID'] }).catch(alertErr);
}
/** 事後の記録に一言メモを足す(旧を取消して新しい記録IDで追記=追記専用の作法)。 */
function saveAtoMemo(recId, memo) {
  var R = App._kaigiReview; if (!R) return;
  var a = R.data['事後'];
  var hit = (a['記録'] || []).filter(function (x) { return x['記録ID'] === recId; })[0];
  if (!hit || String(hit['メモ'] || '') === String(memo || '')) return;
  var newId = uuid();
  var rec = { '記録ID': newId, '取消記録ID': recId, '日時': nowLocal(), 'モード': '学級会', '文脈ID': R.gidaiId,
    '児童ID': hit['児童ID'], 'スタンプ': hit['スタンプ'], 'メモ': memo || '', 'つながり先児童ID': hit['つながり先児童ID'] || '' };
  hit['記録ID'] = newId; hit['メモ'] = memo || ''; hit['日時'] = rec['日時'];
  callServer('updateYosaMemo', rec).catch(alertErr);
}

/* ===== 特別活動の評価(会の記録から自動・設計18) =====
   ライブ中は◎○△を打たない。会が終わった時点で記録から自動で付き、ここで直せる。 */
function renderKaigiHyokaSection(gidaiId) {
  var host = document.getElementById('st-hyoka'); if (!host) return;
  host.innerHTML = '<div class="st-section"><h3>特別活動の評価</h3><div class="sheet__label">計算中…</div></div>';
  callServer('getKaigiHyoka', gidaiId).then(function (h) {
    App._kaigiHyoka = { gidaiId: gidaiId, data: h };
    paintKaigiHyoka();
  }).catch(function (e) {
    host.innerHTML = '<div class="st-section"><h3>特別活動の評価</h3><div class="err">' + escapeHtml((e && e.message) || e) + '</div></div>';
  });
}
function hyokaCellHtml(row, kan, syms) {
  var cur = row['保存'][kan] || '';
  var auto = row['評価'][kan] || '';
  var btns = syms.map(function (sym) {
    var on = (cur === sym);
    return '<button type="button" class="hy-sym' + (on ? ' on' : '') + ' ' + kaigiSymClass(sym, syms) + '" ' +
      'title="' + escapeAttr(sym + 'にする(もう一度押すと消す)') + '" ' +
      'onclick="tapReviewHyoka(\'' + escapeAttr(row['児童ID']) + '\',\'' + escapeAttr(kan) + '\',\'' + escapeAttr(sym) + '\')">' + escapeHtml(sym) + '</button>';
  }).join('');
  var note = row['根拠'][kan] ? '<div class="hy-why" title="' + escapeAttr(row['根拠'][kan]) + '">' + escapeHtml(row['根拠'][kan]) + '</div>' : '';
  var tag = row['手直し'][kan] ? '<span class="hy-tag">手直し</span>' : (cur && cur === auto ? '<span class="hy-tag hy-tag--auto">自動</span>' : '');
  return '<td class="hy-cell"><div class="hy-syms">' + btns + tag + '</div>' + note + '</td>';
}
function paintKaigiHyoka() {
  var H = App._kaigiHyoka; if (!H) return;
  var host = document.getElementById('st-hyoka'); if (!host) return;
  var h = H.data, kans = h['観点'], syms = h['記号'], th = h['閾値'] || {};
  var withRec = h['行'].filter(function (r) { return !r['記録なし']; });
  var noRec = h['行'].filter(function (r) { return r['記録なし']; });
  function table(rows, cls) {
    return '<table class="hm ltable hy-table' + (cls || '') + '"><tr><th>児童</th>' +
      kans.map(function (k) { return '<th>' + escapeHtml(k) + '</th>'; }).join('') + '</tr>' +
      rows.map(function (row) {
        return '<tr><td class="hm-name">' + escapeHtml(row['表示名']) +
          (row['役割'] ? '<span class="hy-role">' + escapeHtml(row['役割']) + '</span>' : '') + '</td>' +
          kans.map(function (k) { return hyokaCellHtml(row, k, syms); }).join('') + '</tr>';
      }).join('') + '</table>';
  }
  var ran = App._autoHyokaJustRan;
  var banner = (ran && ran['追記'] != null)
    ? '<div class="hy-banner">' + mtIco('check') + ' 会の記録から自動で付けました(' + ran['追記'] + '件・' + (ran['評価人数'] || 0) + '人)。' +
      (ran['手直し温存'] ? '先生が直した ' + ran['手直し温存'] + '件はそのままです。' : '') + '</div>'
    : '';
  App._autoHyokaJustRan = null;   // 表示は1回だけ
  var offNote = h['自動評価'] ? '' : '<div class="hy-banner hy-banner--off">設定「自動評価」がOFFです。下の記号をタップすると手で付けられます。</div>';
  // 記録から出る見立てと、いま保存されている値がずれている(=会を終えたあとに記録が届いた等)
  var stale = 0;
  h['行'].forEach(function (row) {
    kans.forEach(function (k) {
      if (row['手直し'][k]) return;
      if ((row['評価'][k] || '') !== (row['保存'][k] || '')) stale++;
    });
  });
  var staleNote = (h['自動評価'] && stale)
    ? '<div class="hy-banner hy-banner--off">' + mtIco('alert') + ' 記録から出る見立てと、いま入っている評価が ' + stale + 'か所ちがいます' +
      (App._autoHyokaQueueLeft ? '(会を終えたあとに届いた記録があります)' : '') +
      '。[' + mtIco('flip') + ' 記録から付け直す]で合わせられます(先生が直した値はそのままです)。</div>'
    : '';
  App._autoHyokaQueueLeft = 0;
  host.innerHTML =
    '<div class="st-section"><h3>特別活動の評価 <span style="font-weight:600;font-size:14px;color:var(--ink-sub)">会の記録から自動</span>' +
      '<button class="btn" style="float:right" onclick="rerunAutoHyoka()">' + mtIco('flip') + ' 記録から付け直す</button></h3>' +
    banner + offNote + staleNote +
    '<p class="sheet__label" style="margin:-2px 0 10px">発言・よさ・役割を点にして、' + (th['◎点'] || 3) + '点以上=' + escapeHtml(syms[0]) +
      ' / ' + (th['○点'] || 1) + '点以上=' + escapeHtml(syms[1]) + '。<b>記録が無い子には付けません</b>。' +
      '直すときは記号をタップ(同じ記号をもう一度押すと消えます)。欠席の子は出ません。</p>' +
    (withRec.length ? table(withRec) : '<div class="sheet__label">この会で記録がついた子はいません。</div>') +
    (noRec.length
      ? '<div class="sheet__label" style="margin-top:14px">記録が無かった子(' + noRec.length + '人) — 必要なら手で付けてください</div>' + table(noRec, ' hy-table--quiet')
      : '') +
    '</div>';
}
function tapReviewHyoka(sid, kan, sym) {
  var H = App._kaigiHyoka; if (!H) return;
  var row = H.data['行'].filter(function (r) { return r['児童ID'] === sid; })[0]; if (!row) return;
  var next = (row['保存'][kan] === sym) ? '' : sym;   // 同じ記号をもう一度=消す
  row['保存'][kan] = next;
  row['手直し'][kan] = (next !== '');
  paintKaigiHyoka();
  callServer('saveKaigiHyoka', H.gidaiId, sid, kan, next).catch(alertErr);
}
function rerunAutoHyoka() {
  var H = App._kaigiHyoka; if (!H) return;
  callServer('runAutoHyoka', H.gidaiId).then(function (r) {
    App._autoHyokaJustRan = r;
    renderKaigiHyokaSection(H.gidaiId);
  }).catch(alertErr);
}

// 歩みセクション本体(振り返り画面=先生用。掲示版は forKeiji=true で名称主役・大きめ)

/* 質指標の推移=折れ線グラフ(インラインSVG・テーマ対応)。系列は色+マーカー+末尾ラベルで区別。 */
function ayumiTrendChartHtml(tr, forKeiji) {
  var series = (tr['系列'] || []).filter(function (s) { return s['値'].some(function (v) { return v != null; }); });
  var labels = tr['ラベル'] || [];
  if (!series.length || labels.length < 1) return '<div class="sheet__label">推移を出せる記録がまだありません。</div>';
  var one = labels.length === 1; // 1会だけのときは点で表示
  var W = 720, H = forKeiji ? 340 : 260, padL = 40, padR = forKeiji ? 190 : 150, padT = 16, padB = 34;
  var iw = W - padL - padR, ih = H - padT - padB;
  var n = labels.length;
  function x(i) { return padL + (n === 1 ? iw / 2 : iw * i / (n - 1)); }
  function y(v) { return padT + ih * (1 - v / 100); }
  var grid = '';
  [0, 25, 50, 75, 100].forEach(function (g) {
    var yy = y(g);
    grid += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (padL + iw) + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (padL - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-sub)">' + g + '</text>';
  });
  var xlab = labels.map(function (lb, i) {
    return '<text x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="' + (forKeiji ? 14 : 11) + '" fill="var(--ink-sub)">' + escapeHtml(lb) + '</text>';
  }).join('');
  var lines = series.map(function (s) {
    var col = AYUMI_SERIES_COLORS[s['キー']] || 'var(--violet-600)';
    var pts = [], marks = '', lastX = null, lastY = null;
    s['値'].forEach(function (v, i) {
      if (v == null) return;
      var px = x(i), py = y(v);
      pts.push(px + ',' + py);
      marks += '<circle cx="' + px + '" cy="' + py + '" r="' + (forKeiji ? 4.5 : 3.5) + '" fill="' + col + '"/>';
      lastX = px; lastY = py;
    });
    var path = pts.length > 1 ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + col + '" stroke-width="' + (forKeiji ? 3 : 2.2) + '" stroke-linejoin="round" stroke-linecap="round"/>' : '';
    // 末尾に直近値+名称(直接ラベリング=凡例いらず・色覚担保)
    var endLabel = (lastX != null)
      ? '<text x="' + (lastX + 8) + '" y="' + (lastY + 4) + '" font-size="' + (forKeiji ? 14 : 12) + '" font-weight="700" fill="' + col + '">' + s['直近'] + '% ' + escapeHtml(s['名称']) + '</text>'
      : '';
    return path + marks + endLabel;
  }).join('');
  return '<div class="ayumi-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="質指標の推移グラフ">' +
    grid + xlab + lines + '</svg></div>';
}
/* 良かった点/課題点/重点の積み上げタイムライン。新しい会を上に。 */
function ayumiTimelineHtml(ayumi, forKeiji) {
  if (!ayumi.length) return '';
  var rows = ayumi.slice().reverse().map(function (m) {
    var head = (m['回'] ? '第' + m['回'] + '回' : '') + (m['議題名'] ? '「' + escapeHtml(m['議題名']) + '」' : '') + (m['実施日'] ? ' <small>' + escapeHtml(m['実施日']) + '</small>' : '');
    var goods = (m['良かった点list'] || []).map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join('');
    var issues = (m['課題点list'] || []).map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join('');
    var juten = (m['重点'] || '').trim() ? '<div class="ay-juten">' + mtIco('target') + ' 次への重点: ' + escapeHtml(m['重点']) + '</div>' : '';
    var cols =
      '<div class="ay-col ay-col--good"><h5>よかった</h5>' + (goods ? '<ul>' + goods + '</ul>' : '<div class="ay-empty">—</div>') + '</div>' +
      '<div class="ay-col ay-col--next"><h5>次は</h5>' + (issues ? '<ul>' + issues + '</ul>' : '<div class="ay-empty">—</div>') + '</div>';
    return '<div class="ay-row"><div class="ay-head">' + head + '</div><div class="ay-cols">' + cols + '</div>' + juten + '</div>';
  }).join('');
  return '<div class="ayumi-timeline' + (forKeiji ? ' ayumi-timeline--keiji' : '') + '">' + rows + '</div>';
}

      }).join(' <span class="ar">→</span> ')   // ★前後の空白が改行の切れ目になる(無いと1行で切れる)
    : '<span class="none">発言の記録なし</span>';

  var types = d['種類'] || [];
  var head = '<tr><th>番号</th>' + types.map(function (t) { return '<th>' + escapeHtml(t) + '</th>'; }).join('') + '<th>計</th></tr>';
  var rows = (d['行'] || []).map(function (row) {
    return '<tr' + (row['計'] ? '' : ' class="z"') + '><td>' + escapeHtml(row['表示名']) + '</td>' +
      types.map(function (t) { return '<td>' + (row['内訳'][t] || '') + '</td>'; }).join('') +
      '<td><b>' + row['計'] + '</b></td></tr>';
  }).join('');

  // 協調／獲得(層を混ぜない)
  var L = b['層'] || {}, act = L['行動'] || { '協調': 0, '獲得': 0 }, yos = L['よさ'] || { '協調': 0, '獲得': 0 };
  function bar(name, sub, x) {
    var tot = (x['協調'] || 0) + (x['獲得'] || 0);
    var inner = tot === 0 ? '<div class="seg none">記録なし</div>'
      : '<div class="seg kyo" style="flex:' + x['協調'] + '">' + (x['協調'] ? '協調 ' + x['協調'] : '') + '</div>' +

  function nm(a) { return a.length ? a.map(function (o) { return escapeHtml(o['表示名']); }).join('、') : 'なし'; }

    ? (y['行'] || []).map(function (row) {

          escapeHtml(Object.keys(row['内訳']).map(function (k) { return k + '×' + row['内訳'][k]; }).join(' / ')) + '</li>';
      }).join('')
    : '<li class="none">記録なし</li>';
  var epi = (y['エピソード'] || []).slice(0, 8).map(function (e) {
    return '<li>' + escapeHtml(e['表示名']) + '(' + escapeHtml(e['スタンプ']) + '): ' + escapeHtml(e['メモ']) + '</li>';
  }).join('');

  var paper =
    '<div class="paper kenpaper">' +
      '<h1>学級会の記録（研究用）— ' + escapeHtml(ken['クラス'] || '') + '</h1>' +
      '<div class="sub">' + escapeHtml(g['実施日'] || todayISO()) + ' ・ ' + (ken['人数'] || 0) + '人 ・ ' +
        '議題「' + escapeHtml((g['議題名'] && g['議題名'] !== '(未設定)') ? g['議題名'] : '(未記入)') + '」' +
        (g['めあて'] ? ' ・ めあて: ' + escapeHtml(g['めあて']) : '') + '</div>' +
      '<div class="warn"><b>この用紙は評価ではありません。</b>' +
        '協調が多い／獲得が多いことに良し悪しはありません。見るのは多い少ないではなく<b>偏り</b>です。' +
        '氏名は記録していません（番号と、その場で打った呼び名だけ）。</div>' +

      '<div class="sec"><h2>話合いの流れ</h2><div class="kenflow">' + flow + '</div></div>' +

      '<div class="sec"><h2>協調／獲得の偏り（層は混ぜない）</h2>' +
        bar('行動の記録', '数えた（低推論）', act) +
        bar('よさの記録', '解釈した（高推論）', yos) +
        '<p class="q">押されなかったことも記録です。' +
          '獲得が1回も立たなかった子（' + z['獲得'].length + '人）: ' + nm(z['獲得']) + ' ／ ' +
          '協調が1回も立たなかった子（' + z['協調'].length + '人）: ' + nm(z['協調']) + ' ／ ' +
          'どちらも0回（' + z['両方'].length + '人）: ' + nm(z['両方']) + '</p>' +
        '<p class="q small">※ゼロは「その行動がなかった」のか「見ていなかった」のか区別できません。</p>' +
      '</div>' +

      '<div class="sec"><h2>発言の分布（総 ' + (d['総発言数'] || 0) + '）</h2>' +
        '<table class="t">' + head + rows + '</table>' +
        '<p class="q">発言0回の子: ' + ((d['発言ゼロ'] || []).length
          ? (d['発言ゼロ'] || []).map(function (o) { return escapeHtml(o['表示名']); }).join('、')
          : 'なし') + '</p></div>' +

      '<div class="sec"><h2>よさの記録</h2><ul class="l">' + yosaRows + '</ul>' +
        (epi ? '<div class="lbl">エピソード</div><ul class="l">' + epi + '</ul>' : '') + '</div>' +

      (g['決まったこと'] ? '<div class="sec"><h2>決まったこと</h2><p class="q">' + escapeHtml(g['決まったこと']) + '</p></div>' : '') +
      '<div class="sec"><h2>参観して気づいたこと（手書き）</h2><div class="memo-box"></div></div>' +
      printBrand() +
    '</div>';
  openPrintDesk([paper], function () { renderKaigiReview(R.gidaiId, R.data); },
    '研究用の記録(A4縦)。氏名は載りません。⌘P で印刷、白黒でも読めます。');
}

/* Nodeの単体テスト用(ブラウザでは無視される)。コの字の組み立ては純関数なので tests/ で確かめる。
   ★席の配置は2度こわしている(2026-08-27: 座席表の列欠け / 保存データが使えず全員が正面=一斉型)。

<script>
/* js_hajime.html — はじめの設定(docs/30 §2・§4)。学級 → 名簿 → 席 の3つ。
   見た目は 学級会ホームの見本(docs/学級会アプリ_見本/ホーム_見本.html・藍)にそろえる。クラス名は頭に hj- を付ける。
   名簿の読み取りはサーバ(previewRosterPaste → いつもの previewRosterImport)。画面では同じ決まりを書かない。 */

function goHajime(state) {
  App.screen = 'hajime';
  setBodyMode('hajime');   // 右上の時計は出さない(すすみ方の札と重なるため)
  App.hj = { st: state || {}, step: (state && state['学級']) ? 1 : 0, pv: null, text: '' };
  renderHajime();
}

function hjSteps_(now) {
  return '<ol class="hj-steps" aria-label="すすみ方">' + ['学級', '名簿', '席'].map(function (t, i) {
    var cls = i < now ? 'done' : i === now ? 'now' : '';
    return '<li class="' + cls + '">' + (i < now ? '✓ ' : (i + 1) + ' ') + t + '</li>';
  }).join('') + '</ol>';
}

function renderHajime() {
  var H = App.hj, st = H.st || {}, body = '';
  if (H.step === 0) {
    var cls = String(st['学級'] || '').split('-');
    body =
      '<section class="hj-card"><h2>あなたの学級</h2>' +
        '<p class="hj-lead">学級会アプリは、この学級だけで使います。</p>' +
        '<div class="hj-row">' +
          '<label class="hj-field"><span>学年</span><input id="hj-nen" type="text" inputmode="numeric" value="' + escapeHtml(cls[0] || '6') + '"></label>' +
          '<label class="hj-field"><span>組</span><input id="hj-kumi" type="text" value="' + escapeHtml(cls[1] || '') + '" placeholder="3"></label>' +
        '</div>' +
        '<p class="hj-err" id="hj-err" role="alert"></p>' +
      '</section>';
  } else if (H.step === 1) {
    body =
      (st['名簿のわけ'] ? '<section class="hj-card" role="alert"><h2>たよす建設の名簿</h2><p class="hj-lead">' + escapeHtml(st['名簿のわけ']) + '</p>' +
        '<button type="button" class="hj-ghost" onclick="hjWorld()">たよす建設の名簿から 読みなおす</button></section>' : '') +
      '<section class="hj-card"><h2>名簿を貼りつける</h2>' +
        '<p class="hj-lead">Excel や校務の名簿から、<b>番号・名字・名前・子どものアカウント</b>の列をコピーして貼ります。' +
          '見出しはあってもなくてもかまいません。名前だけの行なら、上から1番・2番…と付きます。</p>' +
        '<textarea class="hj-ta" id="hj-text" oninput="hjOnInput()" aria-label="名簿を貼る所" placeholder="1&#9;青木&#9;あおい&#9;aoki@…&#10;2&#9;石田&#9;はると&#9;ishida@…">' + escapeHtml(H.text || '') + '</textarea>' +
        '<p class="hj-note">子どものアカウントを入れた子は、会のあいだ、自分の Chromebook で記録係になれます。名前はこの学級のスプレッドシートの中だけに入ります。</p>' +
        '<p class="hj-err" id="hj-err" role="alert"></p>' +
      '</section>' + hjPreviewHtml_();
  } else {
    body =
      '<section class="hj-card"><h2>席</h2>' +
        '<p class="hj-lead">' + escapeHtml(String(st['人数'] || 0)) + '人が入りました。席は、はじめての会を始めたときに<b>コの字</b>か<b>円</b>から配って、ドラッグで実際の机の場所へ動かせます。</p>' +
        '<p class="hj-note">席がえのときも、会の画面の［席を直す］から同じように直せます。</p>' +
      '</section>';
  }
  var next = H.step === 0 ? '<button type="button" class="hj-go" onclick="hjSaveClass()">学級を決めて 次へ</button>'
    : H.step === 1 ? (H.pv && !(H.pv['エラー'] || []).length && (H.pv['新規'] || []).concat(H.pv['変更'] || []).length
        ? '<button type="button" class="hj-go" id="hj-commit" onclick="hjCommit()">' + ((H.pv['新規'] || []).length + (H.pv['変更'] || []).length) + '人を入れて 次へ</button>'
        : '<button type="button" class="hj-go" onclick="hjPreview()">読み取って たしかめる</button>')
    : '<button type="button" class="hj-go" onclick="goKaigi()">学級会のホームへ</button>';
  document.getElementById('app').innerHTML =
    '<div class="hj">' +
      '<header class="hj-top"><span class="hj-logo">学級会アプリ</span><span class="hj-meta">はじめの設定</span>' + hjSteps_(H.step) + '</header>' +
      '<main class="hj-main">' + body + '</main>' +
      '<footer class="hj-foot">' +
        (H.step > 0 && H.step < 2 ? '<button type="button" class="hj-ghost" onclick="App.hj.step--;renderHajime()">もどる</button>' : '<span></span>') +
        next +
      '</footer>' +
    '</div>';
}

function hjPreviewHtml_() {
  var pv = App.hj.pv; if (!pv) return '';
  var rows = (pv['新規'] || []).map(function (r) { return [r['番号'], r['名字'], r['下の名前'], r['Googleアカウント'], '新しく入れる']; })
    .concat((pv['変更'] || []).map(function (c) { return [c.rec['番号'], c.rec['名字'], c.rec['下の名前'], c.rec['Googleアカウント'], '書きかえる']; }));
  var errs = (pv['エラー'] || []).map(function (e) { return '<li>' + escapeHtml(e['行']) + '行め：' + escapeHtml(e['理由']) + '</li>'; }).join('');
  return '<section class="hj-card"><h2>入れる前のたしかめ（' + rows.length + '人）</h2>' +
    (errs ? '<ul class="hj-errs">' + errs + '</ul>' : '') +
    '<div class="hj-tblwrap"><table class="hj-tbl"><thead><tr><th>番号</th><th>名字</th><th>名前</th><th>アカウント</th><th></th></tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr><td class="n">' + escapeHtml(r[0]) + '</td><td>' + escapeHtml(r[1]) + '</td><td>' + escapeHtml(r[2]) + '</td><td>' +
        (r[3] ? escapeHtml(r[3]) : '<span class="hj-dim">（なし）</span>') + '</td><td class="hj-dim">' + r[4] + '</td></tr>';
    }).join('') + '</tbody></table></div></section>';
}

/* 貼り直したら、前のたしかめは使わない(たしかめた中身と入れる中身を同じにする) */
function hjOnInput() {
  if (!App.hj.pv) return;
  App.hj.pv = null;
  var b = document.getElementById('hj-commit');
  if (b) { b.id = ''; b.textContent = '読み取って たしかめる'; b.onclick = hjPreview; }
}

/** 学校の名簿から読みなおす。読めたら はじめの設定は済む。 */
function hjWorld() {
  callServer('syncRosterFromWorld', true).then(function () { return callServer('getSetupState'); })
    .then(function (st) { App.hj.st = st; if (st['済']) { goKaigi(); return; } renderHajime(); })
    .catch(function (e) { hjErr_(e && e.message ? e.message : String(e)); });
}

function hjErr_(msg) { var e = document.getElementById('hj-err'); if (e) e.textContent = msg || ''; }

function hjSaveClass() {
  var nen = document.getElementById('hj-nen').value, kumi = document.getElementById('hj-kumi').value;
  if (String(nen).trim() === '' || String(kumi).trim() === '') { hjErr_('学年と組を入れてください'); return; }
  callServer('saveMyClass', nen, kumi).then(function (st) { App.hj.st = st; App.hj.step = 1; renderHajime(); })
    .catch(function (e) { hjErr_(e && e.message ? e.message : String(e)); });
}

function hjPreview() {
  var t = document.getElementById('hj-text').value;
  App.hj.text = t;
  if (String(t).trim() === '') { hjErr_('名簿を貼ってください'); return; }
  callServer('previewRosterPaste', t).then(function (pv) { App.hj.pv = pv; renderHajime(); })
    .catch(function (e) { hjErr_(e && e.message ? e.message : String(e)); });
}

function hjCommit() {
  var b = document.getElementById('hj-commit'); if (b) { b.disabled = true; b.textContent = '入れています…'; }
  callServer('commitRosterPaste', App.hj.text, {}).then(function () { return callServer('getSetupState'); })
    .then(function (st) { App.hj.st = st; App.hj.step = 2; App.hj.pv = null; renderHajime(); })
    .catch(function (e) { if (b) { b.disabled = false; b.textContent = 'もう一度入れる'; } hjErr_(e && e.message ? e.message : String(e)); });
}
</script>

<script>
/* js_kiroku.html — 記録係の画面(子どもの Chromebook・docs/30 §7.2・§7.3)。先生の画面からも同じものを開く。
   ねらい: すぐ記録できる・直感的・みんなで協力しやすい。
     ① 席をタップ(その時刻が「押した時刻」になる) → ② 言ったことを短く書く(書かなくてもよい) → ③ 記録する
     「名前だけ記録」で、書く時間がないときも取りこぼさない。
     たんとう(ぜんぶ／左がわ／右がわ)で、何人かで分けて記録できる。
     席は自分の画面の中だけで動かせる(先生の席は変えない)。
   ★このファイルだけで動く(先生用の js_core などに頼らない)。名前は KR の中に置く。
   ★保存は待たない。送れなかった分は自動で送りなおし、赤い帯で見せる(黙って捨てない)。 */
var KR = (function () {
  var S = { boot: null, sel: '', pressed: '', text: '', q: [], sending: false, mine: [], tanto: 'all', moving: false, flip: false, pos: {}, opts: {}, stage: '', seats: false, role: '', dirty: false, saving: false, multi: {}, peers: {} };

  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function p2(n) { return ('0' + n).slice(-2); }
  function stamp(d) { d = d || new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()) + '.' + ('00' + d.getMilliseconds()).slice(-3); }
  function hm(s) { return String(s || '').slice(11, 16); }
  function uid() { return 'K' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, ng) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ng);
      r[fn].apply(r, args);
    });
  }
  var TEACHER = 'TEACHER';   // 先生の発言(黒板の横の「先生」の席)。サーバの TEACHER_ID と同じ
  function kid(id) {
    if (id === TEACHER) return { '児童ID': TEACHER, '番号': '', '表示名': '先生' };
    return (S.boot['児童'] || []).filter(function (k) { return k['児童ID'] === id; })[0] || {};
  }

  /* ---- 送る(待たない・順番に・失敗は送りなおす) ---- */
  function push(job) { S.q.push(job); drawBand(); flush(); }
  function flush() {
    if (S.sending || !S.q.length) return;
    var job = S.q[0]; S.sending = true;
    call.apply(null, [job.fn].concat(job.args)).then(function (res) {
      S.q.shift(); S.sending = false; job.done && job.done(res); drawBand(); flush();
    }).catch(function (e) {
      S.sending = false; job.tries = (job.tries || 0) + 1; job.err = e && e.message ? e.message : String(e);
      drawBand();
      if (/いまは学級会をしていません|記録できません|名簿にない|自分の記録だけ/.test(job.err)) { S.q.shift(); job.fail && job.fail(job.err); drawBand(); flush(); return; }
      setTimeout(flush, Math.min(15000, 600 * Math.pow(2, job.tries)));
    });
  }
  window.addEventListener('beforeunload', function (e) { if (S.q.length) { e.preventDefault(); e.returnValue = ''; } });

  /* ---- 開く ---- */
  function open(opts) {
    S.opts = opts || {};
    S.host = S.opts.host || document.getElementById('app');
    S.host.innerHTML = '<div class="kr-wait">よみこみ中…</div>';
    S.seats = !!S.opts.seats; S.dirty = false; S.role = '';
    call('getKirokuBoot', S.seats ? { seats: true } : null).then(function (b) {
      S.boot = b;
      if (S.seats && !b['席モード']) S.seats = false;
      S.moving = S.seats;
      if (!b['入れる']) return drawStop(b['理由']);
      S.mine = (b['さっきの記録'] || []).slice().reverse().map(function (r) { return { id: r['ログID'], sid: r['児童ID'], memo: r['メモ'], at: r['押した時刻'], sent: true }; });
      S.pos = layout(b['児童']);
      draw();
      startPing();
    }).catch(function (e) { drawStop('よみこめませんでした。（' + esc(e && e.message ? e.message : e) + '）'); });
  }
  function drawStop(why) {
    S.host.innerHTML = '<div class="kr-root" style="display:block"><div class="kr-stop"><h1>学級会 記録係</h1><p>' + esc(why) + '</p>' +
      '<button type="button" class="kr-go" style="padding:0 28px" onclick="KR.open(KR._opts())">もう一度 ひらく</button>' +
      (S.opts.onBack ? ' <button type="button" class="kr-tbtn" onclick="KR._back()">もどる</button>' : '') + '</div></div>';
  }

  /* 先生の席(行・列)があればそれ。無ければ番号順に6列で並べる */
  function layout(kids) {
    var pos = {}, has = kids.some(function (k) { return k['行'] > 0 && k['列'] > 0; });
    var sh = kids.filter(function (k) { return k['役割']; }), rest = kids.filter(function (k) { return !k['役割']; });
    if (!has) {   // 先生の席が無いとき: 司会グループは黒板の前(1行目)、ほかは3行目から番号順に6人ずつ
      sh.forEach(function (k, i) { pos[k['児童ID']] = { r: 1, c: 7 - sh.length + i * 2 }; });
      rest.forEach(function (k, i) { pos[k['児童ID']] = { r: 3 + Math.floor(i / 6), c: 1 + (i % 6) * 2 }; });
      return pos;
    }
    kids.forEach(function (k) { if (k['行'] > 0) pos[k['児童ID']] = { r: k['行'], c: k['列'] }; });
    // 席の無い子は、いちばん下の行に足す
    if (has) {
      var maxR = 0; kids.forEach(function (k) { if (k['行'] > 0) maxR = Math.max(maxR, k['行']); });
      var j = 0; kids.forEach(function (k) { if (!(k['行'] > 0)) { pos[k['児童ID']] = { r: maxR + 2, c: 1 + (j % 12) * 2 }; j++; } });
    }
    return pos;
  }

  /* ---- 描く ---- */
  function draw() {
    var b = S.boot, T = !!b['先生'];
    var stageBtns = '';   // 段(出し合う・くらべ合う・まとめる)のボタンは出さない(2026-10-22 先生「不要」)
    if (S.seats) return drawSeats();
    S.host.innerHTML =
      '<div class="kr-root">' +
        '<header class="kr-top">' +
          '<span class="kr-logo">' + (T ? '学級会 記録' : '学級会 記録係') + '</span>' +
          '<span class="kr-kai">' + (b['回'] ? '第' + esc(b['回']) + '回' : '') + '</span>' +
          '<span class="kr-gidai">' + esc(b['議題名'] || '') + '</span>' +
          stageBtns +
          '<span class="kr-live"><i></i>記録中</span>' +
          (T ? (b['議題ID'] ? '<button type="button" class="kr-tbtn end" onclick="KR.end()">会を終える</button>' : '') + (S.opts.onBack ? '<button type="button" class="kr-tbtn" onclick="KR._back()">ホーム</button>' : '')
             : '<span class="kr-me">' + esc(kid(b['自分'])['表示名'] || '') + '</span>') +
        '</header>' +
        '<div class="kr-main">' +
          '<div class="kr-hall' + (S.moving ? ' moving' : '') + '" id="kr-hall" aria-label="席"></div>' +
          '<aside class="kr-side" id="kr-side"></aside>' +
        '</div>' +
      '</div>';
    drawHall(); drawSide();
  }

  /* 先生の「席・司会グループ」(記録係と同じ席の画面・2026-10-22)。動かす／役をつける → 保存する */
  function drawSeats() {
    var b = S.boot;
    S.host.innerHTML =
      '<div class="kr-root">' +
        '<header class="kr-top">' +
          '<span class="kr-logo">席・司会グループ</span>' +
          '<span class="kr-kai">' + (b['回'] ? '第' + esc(b['回']) + '回' : '') + '</span>' +
          '<span class="kr-gidai">' + esc(b['議題名'] && b['議題名'] !== '(未設定)' ? b['議題名'] : '') + '</span>' +
          '<span class="kr-sp"></span>' +
          (S.opts.onBack ? '<button type="button" class="kr-tbtn" onclick="KR.leave()">もどる</button>' : '') +
        '</header>' +
        '<div class="kr-main">' +
          '<div class="kr-hall' + (S.moving ? ' moving' : '') + '" id="kr-hall" aria-label="席"></div>' +
          '<aside class="kr-side" id="kr-side"></aside>' +
        '</div>' +
      '</div>';
    drawHall(); drawSide();
  }
  function drawSeatsSide(side) {
    var b = S.boot, cands = b['役割候補'] || [], gid = b['議題ID'];
    var picked = (b['児童'] || []).filter(function (k) { return k['役割']; });

    var hall = e.target.closest && e.target.closest('#kr-hall');   // えらんだ席を、空いた升へ
    if (hall && S.moveSel) { var br = hall.getBoundingClientRect(); putAt(S.moveSel, cellAt(e.clientX - br.left, e.clientY - br.top)); return; }
    if (hall) { e.preventDefault(); startLasso(e, hall); }   // 空いた所からなぞる → 囲んだ席をまとめてえらぶ
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('.kr-seat'); if (!el || S.moving) return;
    pick(el.getAttribute('data-id'));
  });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (S.boot && S.boot['入れる']) drawHall(); }, 120); });

  /* ほかの記録係がいま選んでいる子を3秒ごとに聞く(枠を光らせる)。見えていないときは聞かない */
  var pingT = null, pinging = false;
  function startPing() {
    if (pingT) clearInterval(pingT);
    pingT = setInterval(function () {
      if (pinging || !S.boot || !S.boot['入れる'] || S.seats || !S.boot['議題ID']) return;
      if (document.visibilityState && document.visibilityState !== 'visible') return;
      pinging = true;
      call('kirokuPing', S.boot['議題ID'], S.sel || '').then(function (r) {
        pinging = false;
        var p = {}; ((r && r['ほか']) || []).forEach(function (x) { p[x['児童ID']] = true; });
        if (Object.keys(p).sort().join() !== Object.keys(S.peers).sort().join()) { S.peers = p; drawHall(); }
      }).catch(function () { pinging = false; });
    }, 3000);
  }

  /* 先生だけ: 段の切りかえ・会を終える(先生の画面から開いたとき) */
  function stage(s) {
    S.stage = s; draw();
    push({ fn: 'setKaigiStage', args: [S.boot['議題ID'], s, uid(), stamp().slice(0, 19)], fail: alertBand });
  }
  function end() {
    if (!window.confirm || !confirm('会を終えますか。終えると記録係の人は記録できなくなります。')) return;
    waitAll().then(function () { return call('endKaigi', S.boot['議題ID'], ''); }).then(function () { back(); }).catch(function (e) { alertBand(e && e.message ? e.message : String(e)); });
  }
  function waitAll() { return new Promise(function (ok) { (function t() { if (!S.q.length && !S.sending) return ok(); flush(); setTimeout(t, 200); })(); }); }
  function back() { if (S.opts.onBack) S.opts.onBack(); }

  return {
    seatTool: seatTool, seatRole: seatRole, seatSave: seatSave, leave: leave,
    pickT: function () { pick(TEACHER); },
    open: open, save: save, cancel: cancel, unsel: unsel, stage: stage, end: end,
    tanto: function (t) { S.tanto = t; drawHall(); drawSide(); },
    move: function () { S.moving = !S.moving; S.sel = ''; S.moveSel = ''; S.multi = {}; draw(); },
    _moveGroup: moveGroup, _inRect: inRect,
    flip: function () { S.flip = !S.flip; drawHall(); drawSide(); },
    _opts: function () { return S.opts; }, _back: back, _state: function () { return S; },
  };
})();
</script>

<script>
/* js_gkhome.html — 学級会アプリのホーム(docs/30 §9・見本 docs/学級会アプリ_見本/ホーム_見本.html が正・藍)。
   上のタブは ホーム／会話分析／ダッシュボード／設定 の4つ(ダッシュボードの上のバーと同じ並び)。
   データは getKaigiBoot の1回だけ(議題一覧・会のまとめ・次の回)。★子どもごとの数は出さない。 */

var GK_LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1F4E8C"/><path d="M12 18h26a6 6 0 0 1 6 6v10a6 6 0 0 1-6 6H24l-7 6v-6h-5a6 6 0 0 1-6-6V24a6 6 0 0 1 6-6z" fill="#fff"/><path d="M30 30h22a6 6 0 0 1 6 6v8a6 6 0 0 1-6 6h-3v5l-6-5H30a6 6 0 0 1-6-6v-8a6 6 0 0 1 6-6z" fill="#F08A5D"/></svg>';   // アイコンB「話す吹き出し」(2026-10-22 先生がえらんだ)
var GK_DAN_COLORS = ['var(--gk-d1)', 'var(--gk-d2)', 'var(--gk-d3)'];

function gkTop(active) {
  var b = App.kaigiBoot || {}, cls = String(b['クラス'] || '').split('-');
  var tabs = [['home', 'ホーム'], ['kaiwa', '会話分析'], ['kata', '分析'], ['dash', 'ダッシュボード'], ['settings', '設定']];
  return '<header class="gk-top"><span class="gk-logo">' + GK_LOGO + '学級会アプリ</span>' +
    '<span class="gk-meta">' + (cls.length === 2 ? escapeHtml(cls[0]) + '年' + escapeHtml(cls[1]) + '組' : '') + '</span>' +
    '<nav class="gk-tabs" role="tablist" aria-label="画面">' + tabs.map(function (t) {
      return '<button type="button" role="tab" aria-selected="' + (active === t[0]) + '" onclick="gkNav(\'' + t[0] + '\')">' + t[1] + '</button>';
    }).join('') + '</nav></header>';
}

/** 前からある画面(振り返り・つぎの一手・設定)の頭。上のタブ＋画面の名前の行(2026-10-22 全画面を藍にそろえる)。 */
function gkPageHead(active, title, ctxHtml, actionsHtml) {
  return '<div class="gk gk-hd">' + gkTop(active) +
    '<div class="gk-phead"><h1>' + escapeHtml(title) + '</h1>' + (ctxHtml ? '<span class="gk-pctx">' + ctxHtml + '</span>' : '') +
    '<span class="gk-psp"></span>' + (actionsHtml || '') + '</div></div>';
}

/** 上のタブから行く先。ダッシュボードは別の会話が作った GkDashboard を開く(onNav で戻ってくる)。 */
/** ダッシュボード(重なりの画面)が開いていたら閉じる。ほかの画面へ行くときに呼ぶ。 */
function gkCloseDash_() { if (typeof GkDashboard !== 'undefined' && GkDashboard.close) GkDashboard.close(); }

function gkNav(k) {
  if (k !== 'dash') gkCloseDash_();
  if (k === 'home') return goKaigi();
  if (k === 'kaiwa') return goBunseki('');
  if (k === 'kata') return goKata('');   // 会の分析(docs/31)。いちばん新しい会を開く
  if (k === 'settings') return goMaster();
  if (k === 'dash') {
    App.screen = 'dashboard';
    if (typeof GkDashboard !== 'undefined') GkDashboard.open({ onNav: function (to) { gkNav(to === 'kaiwa' ? 'kaiwa' : to === 'kata' ? 'kata' : to === 'settings' ? 'settings' : 'home'); } });
  }
}

function gkLiveGidai_() {
  return ((App.kaigiBoot || {})['議題一覧'] || []).filter(function (g) { return g['状態'] !== '実施済'; })[0] || null;
}

function renderGkHome() {
  gkCloseDash_();
  App.screen = 'kaigi_home';
  setBodyMode('gk');
  var b = App.kaigiBoot, all = b['議題一覧'] || [], sum = b['会のまとめ'] || {};
  var live = gkLiveGidai_();
  var done = all.filter(function (g) { return g['状態'] === '実施済'; });
  var last = done[0] || null;
  var nextKai = live ? live['回'] : b['次の回'];

  // 今日の会で先生がすること(前の会の「次への重点」・1行に1つ)
  var todo = last && last['重点'] ? String(last['重点']).split(/\n|。(?=.)/).map(function (s) { return s.trim(); }).filter(function (s) { return s !== ''; }) : [];
  App._gkTodo = App._gkTodo || {};
  var todoHtml = todo.length ? '<ul class="gk-todo">' + todo.map(function (t, i) {
    var on = !!App._gkTodo[t];
    return '<li><button type="button" class="gk-chk" aria-pressed="' + on + '" aria-label="済んだ" onclick="gkTodo(' + i + ')">' + (on ? '✓' : '') + '</button><b style="font-weight:600">' + escapeHtml(t) + '</b><span class="gk-src">第' + escapeHtml(last['回']) + '回の振り返りから</span></li>';
  }).join('') + '</ul>' : '<p class="gk-note">前の会の振り返りで「次への重点」を書くと、ここに出ます。</p>';
  App._gkTodoList = todo;

  // 学級のいま
  var withSpeech = all.filter(function (g) { return (sum[g['議題ID']] || {})['発言'] > 0; });
  var analysed = withSpeech.filter(function (g) { var s = sum[g['議題ID']]; return s['見取った'] >= s['発言']; });
  var total = withSpeech.reduce(function (a, g) { return a + sum[g['議題ID']]['発言']; }, 0);

  document.getElementById('app').innerHTML =
    '<div class="gk">' + gkTop('home') +
    '<main class="gk-main"><div class="gk-wrap">' +
      '<section class="gk-next" aria-labelledby="gk-h-next">' +
        '<div class="gk-eyebrow">' + (live ? '会の途中です' : '次の会') + '</div>' +
        '<h1 id="gk-h-next">' + (nextKai ? '第' + escapeHtml(nextKai) + '回' +
          '<span class="gk-kaiadj"><button type="button" aria-label="回を1つ減らす" onclick="gkKai(-1)">−</button><button type="button" aria-label="回を1つ増やす" onclick="gkKai(1)">＋</button></span>' : '学級会') + '<span class="gk-num">' + escapeHtml(live && live['議題名'] !== '(未設定)' ? live['議題名'] : todayJa_()) + '</span></h1>' +
        '<p>' + (live ? '記録の続きを開きます。記録係の子は、自分の Chromebook で同じアプリを開くと記録できます。' : '押すとすぐ記録が始まります。議題はあとから書けます。') + '</p>' +
        '<div class="gk-sub">' +
          (live ? '<button type="button" class="gk-ghost" onclick="openGidaiSheet(\'' + live['議題ID'] + '\')">議題・めあて</button>' : '') +
          '<button type="button" class="gk-ghost" onclick="gkSeats()">' + (live ? '席・司会グループ' : '席を直す') + '</button>' +
        '</div>' +
        '<button type="button" class="gk-go" onclick="gkStart()"><svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path d="M4 2.5v13l11-6.5z" fill="currentColor"/></svg>' + (live ? '記録の続きへ' : '会を始める') + '</button>' +
      '</section>' +
      '<section class="gk-sec" style="grid-row:span 2" aria-labelledby="gk-h-now">' +
        '<div class="gk-sh"><h2 id="gk-h-now">学級のいま</h2><p>' + (done.length ? '第' + escapeHtml(done[done.length - 1]['回']) + '回〜第' + escapeHtml(done[0]['回']) + '回' : 'まだ記録がありません') + '</p><span class="sp"></span><button type="button" class="gk-link" onclick="gkNav(\'dash\')">ダッシュボード ›</button></div>' +
        '<div class="gk-kpis">' +
          '<div><small>記録した会</small><b>' + done.length + '</b> <span>回</span></div>' +
          '<div><small>発言の記録</small><b>' + total + '</b> <span>件</span></div>' +
          '<div><small>会話分析</small><b>' + analysed.length + '</b> <span>/ ' + withSpeech.length + ' 回</span><div class="gk-meter"><i style="width:' + (withSpeech.length ? Math.round(analysed.length / withSpeech.length * 100) : 0) + '%"></i></div></div>' +
        '</div>' +
        '<div id="gk-chart"></div>' +
        '<div class="gk-legend"><span><i style="background:var(--gk-a)"></i>見取りを付けた発言</span><span><i style="background:#B7CCE6"></i>まだ</span></div>' +
        '<p class="gk-note">発言の数は、話合いのよしあしではありません。</p>' +
      '</section>' +
      '<section class="gk-sec" aria-labelledby="gk-h-todo">' +
        '<div class="gk-sh"><h2 id="gk-h-todo">今日の会で先生がすること</h2></div>' + todoHtml +
      '</section>' +
      '<section class="gk-sec gk-row" aria-labelledby="gk-h-kai">' +
        '<div class="gk-sh"><h2 id="gk-h-kai">これまでの会</h2><p>上の帯は、段の長さ</p><span class="sp"></span>' +
          '<span class="gk-legend">' + ((b['段階'] || []).map(function (s, i) { return '<span><i style="background:' + GK_DAN_COLORS[i % 3] + '"></i>' + escapeHtml(s) + '</span>'; }).join('')) + '</span></div>' +
        (all.length ? '<div class="gk-kais">' + all.map(function (g) { return gkKaiCard_(g, sum[g['議題ID']] || {}, g === live); }).join('') + '</div>'
                    : '<div class="gk-empty">まだ会がありません。［会を始める］を押すと、第1回の記録が始まります。</div>') +
      '</section>' +
    '</div></main></div>';
  gkChart_(withSpeech.slice(0, 8).reverse(), sum);
}

function todayJa_() { var d = new Date(); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'.charAt(d.getDay()) + '）'; }

function gkKaiCard_(g, s, isLive) {
  var stages = (App.kaigiBoot['段階'] || []);
  var dan = (s['段'] || []), tot = dan.reduce(function (a, x) { return a + (x['分'] || 0); }, 0);
  var bar = '<div class="gk-dan" role="img" aria-label="' + escapeHtml(dan.map(function (x) { return x['段階'] + x['分'] + '分'; }).join('・') || '段の記録なし') + '">' +
    (tot ? dan.map(function (x) { var i = Math.max(0, stages.indexOf(x['段階'])); return '<i style="width:' + (x['分'] / tot * 100) + '%;background:' + GK_DAN_COLORS[i % 3] + '"></i>'; }).join('') : '') + '</div>';
  var hasSp = (s['発言'] || 0) > 0, ok = hasSp && s['見取った'] >= s['発言'];
  var st = isLive ? '<span class="gk-pill g">記録中</span>'
    : !hasSp ? '<span class="gk-pill g">発言の記録なし</span>'
    : ok ? '<span class="gk-pill ok">✓ 会話分析ずみ</span>'
    : '<button type="button" class="gk-pill wait gk-pillbtn" onclick="event.stopPropagation();goBunseki(\'' + g['議題ID'] + '\')">会話分析 まだ ' + (s['発言'] - s['見取った']) + '件 ›</button>';
  return '<article class="gk-kai' + (isLive ? ' now' : '') + '" tabindex="0" role="button" aria-label="第' + escapeHtml(g['回']) + '回を開く" onclick="' + (isLive ? 'gkStart()' : 'openKaigiReview(\'' + g['議題ID'] + '\')') + '">' + bar +
    '<div class="gk-kh"><b>第' + escapeHtml(g['回']) + '回</b><span class="gk-num">' + escapeHtml(String(g['実施日'] || '').slice(5).replace('-', '/')) + (tot ? ' · ' + tot + '分' : '') + '</span></div>' +
    '<h3>' + escapeHtml(g['議題名'] && g['議題名'] !== '(未設定)' ? g['議題名'] : '（議題はあとから）') + '</h3>' +
    '<div class="gk-st">' + st + (hasSp ? '<span class="gk-pill g">発言 ' + s['発言'] + '</span>' : '') + '</div></article>';
}

/** 会ごとの発言の数(見取った/まだ を濃い・うすいで)。 */
function gkChart_(list, sum) {
  var host = document.getElementById('gk-chart'); if (!host) return;
  if (!list.length) { host.innerHTML = '<p class="gk-note">会を記録すると、ここに会ごとの発言の数が出ます。</p>'; return; }
  var W = Math.max(280, host.clientWidth || 360), H = 118, L = 4, R = 4, T = 22, B = 24;
  var max = Math.max.apply(null, list.map(function (g) { return sum[g['議題ID']]['発言']; }).concat([1]));
  var cw = (W - L - R) / list.length, bw = Math.min(30, cw - 12);
  var s = '<svg class="gk-ch" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="会ごとの発言の記録の数"><text x="0" y="14" style="font-weight:700;fill:#121417">会ごとの発言の記録</text>';
  list.forEach(function (g, i) {
    var v = sum[g['議題ID']], x = L + i * cw + (cw - bw) / 2, base = H - B, hAll = (H - T - B) * v['発言'] / max, hSeen = (H - T - B) * Math.min(v['見取った'], v['発言']) / max;
    s += '<rect x="' + x + '" y="' + (base - hAll) + '" width="' + bw + '" height="' + hAll + '" rx="3" fill="#B7CCE6"><title>第' + g['回'] + '回 発言' + v['発言'] + '（見取り ' + v['見取った'] + '）</title></rect>';
    if (hSeen > 0) s += '<rect x="' + x + '" y="' + (base - hSeen) + '" width="' + bw + '" height="' + hSeen + '" rx="3" fill="#1F4E8C"></rect>';
    s += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + escapeHtml(g['回']) + '回</text>';
    if (i === list.length - 1) s += '<text x="' + (x + bw / 2) + '" y="' + (base - hAll - 6) + '" text-anchor="middle" style="fill:#121417;font-weight:600">' + v['発言'] + '</text>';
  });
  host.innerHTML = s + '</svg>';
}

function gkTodo(i) { var t = (App._gkTodoList || [])[i]; if (!t) return; App._gkTodo[t] = !App._gkTodo[t]; renderGkHome(); }

/** 第何回を −／＋ で直す(2026-10-22)。会の途中ならその会の番号、まだならつぎに始める会の番号。待たずに画面を変える。 */
function gkKai(d) {
  var b = App.kaigiBoot, live = gkLiveGidai_();
  var cur = Number(live ? live['回'] : b['次の回']) || 1, n = Math.max(1, cur + d);
  if (n === cur) return;
  if (live) live['回'] = n; else b['次の回'] = n;
  renderGkHome();
  (live ? callServer('setKaiOfGidai', live['議題ID'], n) : callServer('setNextKai', n)).catch(alertErr);
}

/** 会を始める(または続き)。先生も記録係の子と同じ記録の画面で記録する(docs/30 §8.9)。 */
function gkStart() {
  var live = gkLiveGidai_();
  var go = function () { App.screen = 'kiroku'; setBodyMode('gk'); KR.open({ host: document.getElementById('app'), onBack: goKaigi }); };
  if (live) return go();
  callServer('createGidai', {}).then(go).catch(alertErr);
}

/** 席・司会グループは、記録係と同じ席の画面で直す(2026-10-22 先生「児童と同じ仕組みに」)。 */
function gkSeats() {
  App.screen = 'kiroku'; setBodyMode('gk');
  KR.open({ host: document.getElementById('app'), seats: true, onBack: goKaigi });
}
</script>

<script>
/* js_bunseki.html — 会話分析(docs/30 §8.9)。会のあとに、発言1つずつへ 機能・宛先・よさ を付ける。
   ・何人かの記録はサーバ(getBunseki)が1つの発言にまとめて返す。画面ではまとめ直さない。
   ・案(言葉の手がかりから)は点線の枠と「案」で見せるだけ。決めるのは先生。［案をうけとる］で、まだの発言にまとめて入れられる。
   ・保存は待たない(js_core の順番待ち: mitori / yosa / yosaCancel)。 */

function goBunseki(gidaiId) {
  gkCloseDash_();
  App.screen = 'bunseki';
  setBodyMode('gk');
  App.bn = { gid: gidaiId || '', data: null, only: false };
  if (!gidaiId) return renderBunsekiPick_();
  document.getElementById('app').innerHTML = '<div class="gk">' + gkTop('kaiwa') + '<main class="gk-main"><p class="gk-note">よみこみ中…</p></main></div>';
  callServer('getBunseki', gidaiId).then(function (d) { App.bn.data = d; renderBunseki(); }).catch(alertErr);
}

/** どの会を分析するか(まだの会が先)。 */
function renderBunsekiPick_() {
  var b = App.kaigiBoot || {}, sum = b['会のまとめ'] || {};
  var list = (b['議題一覧'] || []).filter(function (g) { return g['状態'] === '実施済' && (sum[g['議題ID']] || {})['発言'] > 0; });
  list.sort(function (a, c) { var sa = sum[a['議題ID']], sc = sum[c['議題ID']]; return ((sa['見取った'] >= sa['発言']) - (sc['見取った'] >= sc['発言'])) || 0; });
  document.getElementById('app').innerHTML = '<div class="gk">' + gkTop('kaiwa') + '<main class="gk-main"><div class="gk-bn">' +
    '<div class="gk-sh"><h2>会話分析</h2><p>会のあとに、発言へ 機能・宛先・よさ を付けます。まだの会が上です。</p></div>' +
    (list.length ? '<div class="gk-kais" style="grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(236px,1fr))">' + list.map(function (g) {
      return gkKaiCard_(g, sum[g['議題ID']], false).replace(/onclick="openKaigiReview\('([^']+)'\)"/, 'onclick="goBunseki(\'$1\')"');
    }).join('') + '</div>' : '<div class="gk-empty">会話分析ができる会は、まだありません。会を記録して終えると、ここに出ます。</div>') +
    '</div></main></div>';
}

function bnMmss_(sec) { if (sec === '' || sec === null || sec === undefined) return ''; var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + ('0' + s).slice(-2); }
function bnName_(id) { var k = ((App.bn.data || {})['児童'] || []).filter(function (x) { return x['児童ID'] === id; })[0]; return k ? k['表示名'] : ''; }

function renderBunseki() {
  var d = App.bn.data, g = d['議題'], list = d['発言'] || [];
  var seen = list.filter(function (s) { return s['見取り']; }).length;
  var rows = list.filter(function (s) { return !App.bn.only || !s['見取り']; });
  document.getElementById('app').innerHTML = '<div class="gk">' + gkTop('kaiwa') + '<main class="gk-main">' +
    '<div class="gk-bn-head"><h1>第' + escapeHtml(g['回']) + '回　' + escapeHtml(g['議題名'] && g['議題名'] !== '(未設定)' ? g['議題名'] : '') + '</h1>' +
      '<span class="gk-prog">見取った <b class="gk-num">' + seen + '</b> / ' + list.length + '<span class="gk-meter"><i style="width:' + (list.length ? Math.round(seen / list.length * 100) : 0) + '%"></i></span></span>' +
      '<span class="sp"></span>' +
      '<span class="gk-seg" role="group" aria-label="見せる発言"><button type="button" aria-pressed="' + !App.bn.only + '" onclick="App.bn.only=false;renderBunseki()">ぜんぶ</button><button type="button" aria-pressed="' + App.bn.only + '" onclick="App.bn.only=true;renderBunseki()">まだだけ</button></span>' +
      '<button type="button" class="gk-ghost" onclick="bnTakeAll()">案をうけとる（まだの発言）</button>' +
      '<button type="button" class="gk-ghost" onclick="openKaigiReview(\'' + g['議題ID'] + '\')">振り返りへ</button>' +
    '</div>' +
    '<div id="bn-band"></div>' +
    '<div class="gk-bn">' + (rows.length ? rows.map(bnRow_).join('') : '<div class="gk-empty">' + (App.bn.only ? 'まだの発言はありません。' : 'この会には発言の記録がありません。') + '</div>') + '</div>' +
    '<p class="gk-note gk-bn">見取りを付けた発言だけで、関わり・4象限・見取りの鏡を数えます。記録がないことは、話していないこととは限りません。</p>' +
    '</main></div>';
}

function bnRow_(s) {
  var d = App.bn.data, m = s['見取り'] || {}, an = s['案'] || {};
  var idx = d['発言'].indexOf(s);
  var kino = (d['機能'] || []).concat(['はずす']).map(function (k) {
    var on = m['機能'] === k, isAn = !s['見取り'] && an['機能'] === k;
    return '<button type="button" class="' + (isAn ? 'an' : '') + '" aria-pressed="' + on + '" onclick="bnSet(' + idx + ',\'' + escapeAttr(k) + '\')">' + escapeHtml(k) + '</button>';
  }).join('');
  var to = String(m['つながり先児童ID'] || '').split(',').filter(Boolean);
  var self = to.indexOf(s['児童ID']) >= 0, others = to.filter(function (x) { return x !== s['児童ID']; });
  var anFriend = !s['見取り'] && an['宛先'] === '友だち';
  var opts = '<option value="">友だち：だれへ？</option>' + (d['児童'] || []).filter(function (k) { return k['児童ID'] !== s['児童ID']; }).map(function (k) {
    var sel = others.indexOf(k['児童ID']) >= 0 || (anFriend && (an['宛先児童ID'] || [])[0] === k['児童ID'] && !others.length);
    return '<option value="' + escapeAttr(k['児童ID']) + '"' + (sel ? ' selected' : '') + '>' + escapeHtml(k['表示名']) + '</option>';
  }).join('');
  var yosa = (d['よさ'] || []).map(function (y) {
    var on = (s['よさ'] || []).some(function (x) { return x['スタンプ'] === y; });
    return '<button type="button" aria-pressed="' + on + '" onclick="bnYosa(' + idx + ',\'' + escapeAttr(y) + '\')">' + escapeHtml(y) + '</button>';
  }).join('');
  var rec = (s['記録'] || []).map(function (r) { return '<div><small>' + escapeHtml(r['だれ']) + '</small>' + (r['メモ'] ? escapeHtml(r['メモ']) : '<span style="color:var(--gk-ink3)">（名前だけ）</span>') + '</div>'; }).join('');
  return '<div class="gk-bn-row' + (s['見取り'] ? ' done' : '') + '">' +
    '<div class="gk-bn-t"><b>' + escapeHtml(bnMmss_(s['経過秒'])) + '</b>' + escapeHtml(s['段階'] || '') + '</div>' +
    '<div class="gk-bn-who">' + escapeHtml(bnName_(s['児童ID'])) + '<div>' + (s['記録した人数'] >= 2 ? '<span class="gk-pill ok">' + s['記録した人数'] + '人が記録</span>' : '<span class="gk-pill wait">1人だけが記録</span>') + (s['見取り'] && s['見取り']['付けた人'] === '案（自動）' ? ' <span class="gk-pill g" title="要点の字から自動で入れた印。直すと先生の印になります">自動</span>' : '') + '</div></div>' +
    '<div class="gk-bn-rec">' + rec + (an['手がかり'] && an['手がかり'].length && !s['見取り'] ? '<div><small>手がかり</small>' + escapeHtml(an['手がかり'].join('・')) + '</div>' : '') + '</div>' +
    '<div class="gk-bn-ctl">' +
      '<div class="gk-seg" role="group" aria-label="機能">' + kino + '</div>' +
      '<div class="gk-bn-line"><span>宛先</span>' +
        '<span class="gk-seg" role="group" aria-label="宛先"><button type="button" aria-pressed="' + self + '" onclick="bnSelf(' + idx + ')">じぶん</button></span>' +
        '<select class="gk-sel" aria-label="友だち" onchange="bnFriend(' + idx + ',this.value)">' + opts + '</select></div>' +
      (yosa ? '<div class="gk-yosa" role="group" aria-label="よさ">' + yosa + '</div>' : '') +
    '</div></div>';
}

/** 見取りを送る(待たない)。機能も宛先も空なら「見取っていない」にもどる。 */
function bnSave_(s) {
  var m = s['見取り'] || { '機能': '', 'つながり先児童ID': '' };
  m['付けた人'] = '先生';   // 先生が押したら、自動の札をはずす(サーバも 付けた人=先生 の行が勝つ)
  if (m['機能'] === '' && m['つながり先児童ID'] === '') s['見取り'] = null;
  enqueue('mitori', { '代表ログID': s['代表ログID'], 'ログID': s['ログID'], '機能': m['機能'], 'つながり先児童ID': m['つながり先児童ID'] });
  renderBunseki();
}
function bnCur_(s) { if (!s['見取り']) s['見取り'] = { '機能': '', 'つながり先児童ID': '' }; return s['見取り']; }
function bnSet(i, k) {
  var s = App.bn.data['発言'][i], m = bnCur_(s);
  m['機能'] = m['機能'] === k ? '' : k;
  if (m['機能'] === 'はずす') m['つながり先児童ID'] = '';
  bnSave_(s);
}
function bnSelf(i) {
  var s = App.bn.data['発言'][i], m = bnCur_(s), to = String(m['つながり先児童ID'] || '').split(',').filter(Boolean);
  to = to.indexOf(s['児童ID']) >= 0 ? to.filter(function (x) { return x !== s['児童ID']; }) : [s['児童ID']];   // じぶん と 友だち は どちらか1つ
  m['つながり先児童ID'] = to.join(',');
  bnSave_(s);
}
function bnFriend(i, id) {
  var s = App.bn.data['発言'][i], m = bnCur_(s);
  m['つながり先児童ID'] = id || '';
  bnSave_(s);
}
/** まだの発言に、案をまとめて入れる(案が無い発言はそのまま)。 */
function bnTakeAll() {
  var n = 0;
  (App.bn.data['発言'] || []).forEach(function (s) {
    if (s['見取り']) return;
    var an = s['案'] || {};
    if (!an['機能'] && an['宛先'] !== '友だち') return;
    s['見取り'] = { '機能': an['機能'] || '', 'つながり先児童ID': an['宛先'] === '友だち' ? (an['宛先児童ID'] || []).slice(0, 1).join(',') : '' };
    if (s['見取り']['機能'] === '' && s['見取り']['つながり先児童ID'] === '') { s['見取り'] = null; return; }
    enqueue('mitori', { '代表ログID': s['代表ログID'], 'ログID': s['ログID'], '機能': s['見取り']['機能'], 'つながり先児童ID': s['見取り']['つながり先児童ID'] });
    n++;
  });
  renderBunseki();
  var band = document.getElementById('bn-band');
  if (band) band.innerHTML = '<div class="gk-pill ok" style="margin:0 auto 8px;display:flex;max-width:1240px">' + n + '件に案を入れました。ちがう所は押して直せます。</div>';
}
/** よさ(よさ記録へ。メモに発言のログID)。 */
function bnYosa(i, stamp) {
  var s = App.bn.data['発言'][i], gid = App.bn.data['議題']['議題ID'];
  var cur = (s['よさ'] || []).filter(function (x) { return x['スタンプ'] === stamp; })[0];
  if (cur) {
    s['よさ'] = s['よさ'].filter(function (x) { return x !== cur; });
    enqueue('yosaCancel', { '取消対象ID': cur['記録ID'], '文脈ID': gid, '児童ID': s['児童ID'] });
  } else {
    var id = 'Y' + uuid();
    (s['よさ'] = s['よさ'] || []).push({ '記録ID': id, 'スタンプ': stamp });
    enqueue('yosa', { '記録ID': id, '日時': nowLocal(), 'モード': '学級会', '文脈ID': gid, '児童ID': s['児童ID'], 'スタンプ': stamp, 'メモ': s['代表ログID'], 'つながり先児童ID': '' });
  }
  renderBunseki();
}
</script>

<!-- js_kata.html — 会の分析(docs/31 分析の型カタログ v0.2 §7 段1)。1回の会について、いまの記録で出せる型を1画面に並べる。
     ・入口は上のタブの［分析］(2026-10-22 先生 A)。開くと、いちばん新しい会が出る。会は上の選びで変える。
     ・計算は書かない。サーバ(getKata → calc_kata.js の kataKai)が組んだものを並べるだけ。
     ・限界の一文はサーバから(KATA_GENKAI の1か所)。画面で書きかえない。
     ・子どもをくらべない。数に良し悪しの色を付けない。並びは番号順。名前は先生の画面だけ。
     ・見やすさ(2026-10-22 先生「スクロール多すぎる・色味」): 中でスクロールする欄を作らない。濃い紺・枠の箱を使わない。
     ・クラス名は gkt- の中だけ。 -->
<style>
.gkt-main { display:flex; flex-direction:column; }
.gkt { flex:1; width:100%; max-width:1400px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); grid-template-rows:auto 1fr auto; gap:8px 12px; }
.gkt-head { grid-column:1/-1; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.gkt-head .gk-sel { min-height:44px; font-size:16px; font-weight:700; max-width:100%; }
.gkt-head .sp { flex:1; }
.gkt-sec { min-width:0; display:flex; flex-direction:column; border:1px solid var(--gk-line); border-radius:12px; padding:6px 12px 8px; background:#fff; }
.gkt-sec h2 { margin:0 0 2px; font-size:15px; font-weight:700; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.gkt-sec h2 small { font-size:14px; font-weight:400; color:var(--gk-ink3); }
.gkt-lim { margin:auto 0 0; padding-top:4px; font-size:14px; line-height:1.5; color:var(--gk-ink3); }
.gkt-row3 { grid-column:1/-1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.35fr); gap:8px 12px; }
.gkt-cv { flex:1 1 auto; min-height:84px; position:relative; margin-top:4px; }
.gkt-chart { position:absolute; inset:0; width:100%; height:100%; display:block; }
.gkt-bar { fill:#5B8BD0; }
.gkt-bar.on { fill:#1F4E8C; }
.gkt-hit { fill:transparent; cursor:pointer; }
.gkt-hit:focus-visible { outline:none; stroke:#0066CC; stroke-width:3; }
.gkt-t { fill:#4F555D; }
.gkt-gap { fill:#F6F7F9; }
.gkt-axis { stroke:#E3E5E8; stroke-width:1; }
.gkt-lbl { font-size:13px; fill:#6E747C; }
.gkt-pick { margin:6px 0 0; padding:6px 10px; list-style:none; font-size:14px; background:var(--gk-tint); border-radius:8px; }
.gkt-pick li { padding:1px 0; }
.gkt-pick b { font-variant-numeric:tabular-nums; font-weight:600; color:var(--gk-ink2); margin-right:8px; }
.gkt-stats { display:grid; grid-template-columns:auto 1fr; gap:0 14px; margin:0; font-size:15px; align-items:baseline; line-height:1.45; }
.gkt-stats .gkt-mini { margin:-6px 0; }
.gkt-stats dt { color:var(--gk-ink2); font-size:14px; }
.gkt-stats dd { margin:0; font-variant-numeric:tabular-nums; }
.gkt-stats dd b { font-size:18px; font-weight:700; margin-right:4px; }
.gkt-stats dd span { font-size:14px; color:var(--gk-ink2); }
.gkt-nums { display:flex; gap:4px 16px; flex-wrap:wrap; margin:2px 0 0; }
.gkt-nums div { font-size:14px; color:var(--gk-ink2); }
.gkt-nums b { display:block; font-size:22px; font-weight:700; color:var(--gk-ink); font-variant-numeric:tabular-nums; line-height:1.2; }
.gkt-nums div { line-height:1.4; }
.gkt-sub { margin:2px 0 0; font-size:14px; color:var(--gk-ink2); }
.gkt-sub b { color:var(--gk-ink); font-weight:600; }
.gkt-mini { min-height:44px; padding:0 12px; }
.gkt-nm { white-space:nowrap; }
.gkt-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:end; }
.gkt-warn { font-size:14px; color:var(--gk-wait); background:var(--gk-wait-soft); border-radius:8px; padding:4px 10px; }
@media (max-width:760px) { .gkt, .gkt-row3 { grid-template-columns:minmax(0,1fr); } .gkt { grid-template-rows:none; } .gkt-cv { min-height:150px; } }
</style>
<script>
/* 会の分析(docs/31)。上のタブ［分析］から。gidaiId が空なら、いちばん新しい会。 */
function ktKais_() {
  var b = App.kaigiBoot || {}, sum = b['会のまとめ'] || {};
  return (b['議題一覧'] || []).filter(function (g) { return !g['研究'] && ((sum[g['議題ID']] || {})['発言'] || 0) > 0; })
    .slice().sort(function (a, c) { return (Number(c['回']) || 0) - (Number(a['回']) || 0) || String(c['実施日'] || '').localeCompare(String(a['実施日'] || '')); });
}
function goKata(gidaiId) {
  gkCloseDash_();
  App.screen = 'kata';
  setBodyMode('gk');
  var gid = gidaiId || ((ktKais_()[0] || {})['議題ID'] || '');
  App.kt = { gid: gid, data: null, box: -1, names: false, koe: '' };
  if (!gid) {
    document.getElementById('app').innerHTML = '<div class="gk">' + gkTop('kata') + '<main class="gk-main"><div class="gk-empty">分析できる会は、まだありません。会を記録すると、ここに出ます。</div></main></div>';
    return;
  }
  document.getElementById('app').innerHTML = '<div class="gk">' + gkTop('kata') + '<main class="gk-main"><p class="gk-note">よみこみ中…</p></main></div>';
  callServer('getKata', gid).then(function (d) { if (App.kt && App.kt.gid === gid) { App.kt.data = d; renderKata(); } }).catch(alertErr);
}

function ktName_(id) {
  if (id === 'TEACHER') return '先生';
  var k = ((App.kt.data || {})['児童'] || []).filter(function (x) { return x['児童ID'] === id; })[0];
  return k ? k['表示名'] : '';
}
function ktMmss_(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + ('0' + s).slice(-2); }
function ktGen_(id) { return '<p class="gkt-lim">' + escapeHtml(((App.kt.data || {})['限界'] || {})[id] || '') + '</p>'; }
function ktKataName_(id) { var k = (((App.kt.data || {})['型']) || []).filter(function (x) { return x.id === id; })[0]; return k ? k.n : id; }
function ktH2_(id, sub) { return '<h2>' + escapeHtml(ktKataName_(id)) + (sub ? '<small>' + sub + '</small>' : '') + '</h2>'; }
function ktNoKodomo_(id) { return ktH2_(id) + '<div class="gk-empty">この回のツムゴロウの記録は、まだありません。</div>'; }

function renderKata() {
  var d = App.kt.data, g = d['議題'];
  var kais = ktKais_();
  if (!kais.some(function (x) { return x['議題ID'] === g['議題ID']; })) kais.unshift({ '議題ID': g['議題ID'], '回': g['回'], '議題名': g['議題名'] });
  var sel = '<select class="gk-sel" aria-label="会をえらぶ" onchange="goKata(this.value)">' + kais.map(function (k) {
    var nm = k['議題名'] && k['議題名'] !== '(未設定)' ? k['議題名'] : '';
    return '<option value="' + escapeAttr(k['議題ID']) + '"' + (k['議題ID'] === g['議題ID'] ? ' selected' : '') + '>第' + escapeHtml(k['回']) + '回　' + escapeHtml(nm) + '</option>';
  }).join('') + '</select>';
  var warn = d['読み込み'] && d['読み込み'].ok === false
    ? '<div class="gkt-warn">ツムゴロウの記録を読めませんでした（' + escapeHtml(d['読み込み']['わけ']) + '）。発言の記録の分だけ出しています。</div>' : '';
  document.getElementById('app').innerHTML = '<div class="gk">' + gkTop('kata') + '<main class="gk-main gkt-main"><div class="gkt">' +
    '<div class="gkt-head">' + sel + warn + '<span class="sp"></span>' +
      '<button type="button" class="gk-ghost" onclick="goBunseki(\'' + escapeAttr(g['議題ID']) + '\')">この会の会話分析</button></div>' +
    '<section class="gkt-sec" id="kt-k01">' + ktFlow_() + '</section>' +
    '<section class="gkt-sec">' + ktKakushika_() + '</section>' +
    '<div class="gkt-row3">' +
      '<section class="gkt-sec">' + ktTachiba_() + '</section>' +
      '<section class="gkt-sec">' + ktOmoi_() + '</section>' +
      '<section class="gkt-sec" id="kt-k09">' + ktKoe_() + '</section>' +
    '</div></div></main></div>';
  ktFit_();
}

/* K01 会の流れ: 2分ごとの棒(子ども)・先生の発言は ▲(形で分ける)・記録のない時間は うすい帯と字。棒を押すと要点 */
function ktFlow_() {
  var f = App.kt.data.K01, box = f['箱'] || [];
  if (!box.length) return ktH2_('K01') + '<div class="gk-empty">この会には発言の記録がありません。</div>' + ktGen_('K01');
  var W = 600, H = App.kt.H || 124, L = 22, R = 4, T = 6, B = 34, n = box.length, bw = (W - L - R) / n;
  var max = 4; box.forEach(function (b) { if (b['子ども'] > max) max = b['子ども']; });
  var y = function (v) { return T + (H - T - B) * (1 - v / max); };
  var s = '<svg class="gkt-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="2分ごとの発言の数。棒を押すと要点が出ます">';
  (f['記録のない時間'] || []).forEach(function (gp) {
    var x0 = L + gp['から'] / 2 * bw, x1 = L + gp['まで'] / 2 * bw;
    s += '<rect class="gkt-gap" x="' + x0 + '" y="' + T + '" width="' + (x1 - x0) + '" height="' + (H - T - B) + '"></rect>' +
      '<text class="gkt-lbl" x="' + ((x0 + x1) / 2) + '" y="' + (T + 16) + '" text-anchor="middle">記録なし</text>';
  });
  [Math.round(max / 2), max].forEach(function (v) { s += '<line class="gkt-axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"></line>'; });
  s += '<line class="gkt-axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '"></line>';
  [0, Math.round(max / 2), max].forEach(function (v) { s += '<text class="gkt-lbl" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
  box.forEach(function (b, i) {
    var x = L + i * bw, h = (H - T - B) - (y(b['子ども']) - T), cx = x + bw / 2;
    if (b['子ども'] > 0) s += '<rect class="gkt-bar' + (App.kt.box === i ? ' on' : '') + '" x="' + (x + bw * 0.18) + '" y="' + y(b['子ども']) + '" width="' + (bw * 0.64) + '" height="' + h + '" rx="2"></rect>';
    if (b['先生'] > 0) s += '<path class="gkt-t" d="M' + (cx - 6) + ' ' + (H - B + 15) + 'L' + cx + ' ' + (H - B + 5) + 'L' + (cx + 6) + ' ' + (H - B + 15) + 'Z"></path>';
    if (i % 2 === 0) s += '<text class="gkt-lbl" x="' + x + '" y="' + (H - 3) + '" text-anchor="' + (i ? 'middle' : 'start') + '">' + b['から'] + '分</text>';
    s += '<rect class="gkt-hit" tabindex="0" role="button" aria-label="' + b['から'] + '分から' + b['まで'] + '分の要点" x="' + x + '" y="0" width="' + bw + '" height="' + H + '" onclick="ktPick(' + i + ')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();ktPick(' + i + ')}"></rect>';
  });
  s += '</svg>';
  var pick = '';
  if (App.kt.box >= 0 && box[App.kt.box]) {
    var b0 = box[App.kt.box];
    var pts = (f['点'] || []).filter(function (p) { return p['経過秒'] >= b0['から'] * 60 && p['経過秒'] < b0['まで'] * 60; });
    pick = '<ul class="gkt-pick" aria-live="polite">' + (pts.length ? pts.map(function (p) {
      return '<li><b>' + ktMmss_(p['経過秒']) + '</b>' + escapeHtml(ktName_(p['児童ID'])) + (p['要点'] ? '「' + escapeHtml(p['要点']) + '」' : '') + '</li>';
    }).join('') : '<li>この2分の記録はありません。</li>') + '</ul>';
  }
  var tn = (f['先生の発言'] || []).length;

}

/* 図の高さを、枠の空いた高さに合わせる(下に余白を残さない・字はゆがめない)。幅600の目もりで高さを決め直して描き直す */
