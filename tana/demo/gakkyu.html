<script>
/* js_seatin.html — 座席表を入れる(研究用の会・2026-10-06 先生)。
   「座席表を入れたら、そのまま席が入る」ための読み取り。入れ方は3つ:
     ① 写真 … 丸(席)の位置だけをこの端末の中で見つける。★写真は外へ送らない(CLAUDE.md 絶対ルール3)。字は読まない
     ② Excel(.xlsx)・CSV … マス目に名前を書いた座席表。セルの位置がそのまま席の位置
     ③ 貼る … スプレッドシートからコピーしたマス目(タブ区切り)／「番号:行,列 名前 役割」／名前だけの一覧
   ★名前は研究用の会の行(議題マスタ.研究_呼び名)にだけ入る。名簿・座席表には書かない(docs/26)。
   ★ここから下の si* のうち「純関数」と書いたものは DOM を触らない(tests/seat_import.test.js)。 */

var SI_LABEL = /^(黒板|こくばん|教卓|きょうたく|前|まえ|後ろ|うしろ|窓|まど|窓側|廊下|ろうか|廊下側|入口|出口|ドア|とびら|テレビ|TV)$/;
var SI_MAX = { w: 18, h: 8 };   // 1画面に収まる大きさ(1366×768 で実測・docs/29 §6)

/* ---------- 純関数: 写真から丸(席)を見つける ---------- */
/**
 * 灰色の画素(0〜255)から、ペンで描いた丸(リング)の中心を見つける。
 *   ① まわりより暗い画素を「線」とみなす(影・紙のむらに強いように、近所の平均と比べる)
 *   ② つながった線のかたまりごとに外枠と画素数を数える
 *   ③ 大きさがそろっていて、中が空いている(画素が外枠の半分より少ない)かたまり＝丸
 * 丸の中の字は、丸より小さいので落ちる。丸と字がくっついても外枠は丸の大きさのまま。
 * @param {Uint8Array|number[]} g 灰色 w*h
 * @return {{x:number,y:number,s:number}[]} 中心と大きさ(画素)
 */
function siDetectRings(g, w, h) {
  var n = w * h, I = new Float64Array((w + 1) * (h + 1)), x, y;
  for (y = 0; y < h; y++) { var row = 0; for (x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * (w + 1) + x + 1] = I[y * (w + 1) + x + 1] + row; } }
  var R = Math.max(4, Math.round(Math.min(w, h) / 24)), dark = new Uint8Array(n);
  for (y = 0; y < h; y++) {
    var y0 = Math.max(0, y - R), y1 = Math.min(h, y + R + 1);
    for (x = 0; x < w; x++) {
      var x0 = Math.max(0, x - R), x1 = Math.min(w, x + R + 1);
      var sum = I[y1 * (w + 1) + x1] - I[y0 * (w + 1) + x1] - I[y1 * (w + 1) + x0] + I[y0 * (w + 1) + x0];
      var mean = sum / ((x1 - x0) * (y1 - y0));
      if (g[y * w + x] < mean - 18 && g[y * w + x] < 170) dark[y * w + x] = 1;
    }
  }
  // つながったかたまり(8近傍)
  var lab = new Int32Array(n), comps = [], stack = [];
  for (var i = 0; i < n; i++) {
    if (!dark[i] || lab[i]) continue;
    var id = comps.length + 1, c = { x0: w, y0: h, x1: 0, y1: 0, cnt: 0 };
    lab[i] = id; stack.push(i);
    while (stack.length) {
      var p = stack.pop(), px = p % w, py = (p - px) / w;
      c.cnt++; if (px < c.x0) c.x0 = px; if (px > c.x1) c.x1 = px; if (py < c.y0) c.y0 = py; if (py > c.y1) c.y1 = py;
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
        var qx = px + dx, qy = py + dy; if (qx < 0 || qy < 0 || qx >= w || qy >= h) continue;
        var q = qy * w + qx; if (dark[q] && !lab[q]) { lab[q] = id; stack.push(q); }
      }
    }
    comps.push(c);
  }
  // ★輪らしさ: 線の画素が、外枠に内接するだ円の「ふち」のあたりにどれだけ集まっているか。
  //   丸はほぼ全部がふちにあり、字は外枠の中に散らばる。大きさだけで選ぶと、字の数が多い写真で字のほうが勝つ
  //   (2026-10-06 実測: 横向きの写真で丸31個が字59個に負けた)
  var edge = new Int32Array(comps.length + 1);
  for (var pi = 0; pi < n; pi++) {
    var L = lab[pi]; if (!L) continue;
    var cc = comps[L - 1], ex = pi % w, ey = (pi - ex) / w;
    var rx = (cc.x1 - cc.x0 + 1) / 2, ry = (cc.y1 - cc.y0 + 1) / 2;
    var u = (ex - (cc.x0 + cc.x1) / 2) / rx, v = (ey - (cc.y0 + cc.y1) / 2) / ry, rho = u * u + v * v;
    if (rho > 0.5 && rho < 1.35) edge[L]++;
  }
  var minS = Math.max(8, Math.min(w, h) / 60);
  var cand = comps.map(function (c, k) {
    var bw = c.x1 - c.x0 + 1, bh = c.y1 - c.y0 + 1;
    return { x: (c.x0 + c.x1) / 2, y: (c.y0 + c.y1) / 2, s: (bw + bh) / 2, ar: bw / bh, fill: c.cnt / (bw * bh), ring: edge[k + 1] / c.cnt };
  }).filter(function (c) { return c.s >= minS && c.ar > 0.45 && c.ar < 2.2 && c.fill < 0.5 && c.ring >= 0.6; });
  if (!cand.length) return [];
  // 中に何か(名前の字)を囲んでいるか。座席表の丸はふつう名前を囲む。「の」のような丸い字は何も囲まない
  var centers = comps.map(function (c) { return { x: (c.x0 + c.x1) / 2, y: (c.y0 + c.y1) / 2, s: ((c.x1 - c.x0) + (c.y1 - c.y0)) / 2 + 1 }; });
  cand.forEach(function (a) {
    var rx = a.s / 2 * 0.75;
    a.encl = centers.some(function (c) { return c.s < a.s * 0.6 && Math.abs(c.x - a.x) < rx && Math.abs(c.y - a.y) < rx * 0.9; });
  });
  // 大きさがそろっている群のうち、いちばん「名前を囲んだ丸」らしい群(数が多く・大きく・中に字がある)
  var best = null;
  cand.forEach(function (a) {
    var score = 0;
    cand.forEach(function (b) { if (b.s >= a.s * 0.72 && b.s <= a.s * 1.38) score += (b.encl ? 1 : 0.25); });
    score *= Math.sqrt(a.s);
    if (!best || score > best.score) best = { s: a.s, score: score };
  });
  return cand.filter(function (b) { return b.s >= best.s * 0.72 && b.s <= best.s * 1.38; })
    .map(function (b) { return { x: b.x, y: b.y, s: b.s }; });
}

/* ---------- 純関数: 位置(画素やセル)→ 升目 ---------- */
/**
 * 点の集まりを、升目(横24×縦16)の席に置きかえる。点どうしのいちばん近い間かくを1升とし、
 * 1画面に収まる大きさ(SI_MAX)より大きいときは縮める。重なったら、いちばん近い空き升へ。
 * @param {{x:number,y:number}[]} pts
 * @return {{r:number,c:number}[]} pts と同じ順(1始まり・升目の中)
 */
function siPointsToGrid(pts, max) {
  max = max || SI_MAX;
  if (!pts.length) return [];
  var xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
  var xmin = Math.min.apply(null, xs), ymin = Math.min.apply(null, ys);
  var nn = pts.map(function (p, i) {
    var m = Infinity;
    pts.forEach(function (q, j) { if (i !== j) m = Math.min(m, Math.hypot(p.x - q.x, p.y - q.y)); });
    return m;
  }).filter(function (v) { return isFinite(v) && v > 0; }).sort(function (a, b) { return a - b; });
  var d = nn.length ? nn[Math.floor(nn.length / 2)] : 1;
  var W = (Math.max.apply(null, xs) - xmin) / d, H = (Math.max.apply(null, ys) - ymin) / d;
  var sx = W > max.w - 1 ? (max.w - 1) / W : 1, sy = H > max.h - 1 ? (max.h - 1) / H : 1;
  var fl = pts.map(function (p) { return { fc: (p.x - xmin) / d * sx, fr: (p.y - ymin) / d * sy }; });
  var cw = Math.round(Math.max.apply(null, fl.map(function (f) { return f.fc; }))) + 1;
  var off = Math.max(0, Math.floor((24 - cw) / 2));
  var used = {}, out = [];
  // 位置のはっきりしたもの(升の真ん中に近いもの)から先に置く
  var order = fl.map(function (f, i) { return i; }).sort(function (a, b) {
    var ea = Math.abs(fl[a].fc - Math.round(fl[a].fc)) + Math.abs(fl[a].fr - Math.round(fl[a].fr));
    var eb = Math.abs(fl[b].fc - Math.round(fl[b].fc)) + Math.abs(fl[b].fr - Math.round(fl[b].fr));
    return ea - eb;
  });
  order.forEach(function (i) {
    var f = fl[i], bestRC = null, bestD = Infinity;
    for (var r = 0; r < 16; r++) for (var c = 0; c < 24 - off; c++) {
      if (used[r + ',' + c]) continue;
      var dd = (r - f.fr) * (r - f.fr) + (c - f.fc) * (c - f.fc);
      if (dd < bestD) { bestD = dd; bestRC = [r, c]; }
    }
    if (!bestRC) return;
    used[bestRC[0] + ',' + bestRC[1]] = true;
    out[i] = { r: bestRC[0] + 1, c: Math.min(24, bestRC[1] + off + 1) };
  });
  return out;
}

/**
 * 番号の順。輪(まん中が空いている)なら、黒板側のまん中から時計回り。そうでなければ 前の列から左→右。
 * @param {{r:number,c:number}[]} cells
 * @return {number[]} cells の添字を番号順に並べたもの
 */
function siOrder(cells) {
  var idx = cells.map(function (c, i) { return i; }).filter(function (i) { return cells[i]; });
  if (idx.length < 4) return idx.sort(function (a, b) { return cells[a].r - cells[b].r || cells[a].c - cells[b].c; });
  var cr = 0, cc = 0; idx.forEach(function (i) { cr += cells[i].r; cc += cells[i].c; }); cr /= idx.length; cc /= idx.length;
  var dist = idx.map(function (i) { return Math.hypot(cells[i].r - cr, cells[i].c - cc); });
  var mean = dist.reduce(function (a, b) { return a + b; }, 0) / dist.length;
  var ring = dist.every(function (v) { return v > mean * 0.5; });
  // ★机のあいだの通路(1列ぶん)でまん中が空いた「ふつうの並び」を輪とまちがえない:
  //   輪なら、上と下の行をのぞいた行の多くで、左右の席のあいだが 横はばの半分より広く空いている
  if (ring) {
    var byR = {}, cmin = Infinity, cmax = -Infinity;
    idx.forEach(function (i) { (byR[cells[i].r] = byR[cells[i].r] || []).push(cells[i].c); cmin = Math.min(cmin, cells[i].c); cmax = Math.max(cmax, cells[i].c); });
    var rkeys = Object.keys(byR).map(Number).sort(function (a, b) { return a - b; }).slice(1, -1);
    var wide = rkeys.filter(function (r) {
      var cs = byR[r].slice().sort(function (a, b) { return a - b; }), g = 0;
      for (var k = 1; k < cs.length; k++) g = Math.max(g, cs[k] - cs[k - 1]);
      return cs.length >= 2 && g >= (cmax - cmin) * 0.55;
    }).length;
    ring = rkeys.length >= 2 && wide >= rkeys.length * 0.6;
  }
  if (!ring) return idx.sort(function (a, b) { return cells[a].r - cells[b].r || cells[a].c - cells[b].c; });
  function ang(i) { var a = Math.atan2(cells[i].c - cc, -(cells[i].r - cr)); return a < -1e-9 ? a + 2 * Math.PI : a; }
  return idx.sort(function (a, b) { return ang(a) - ang(b); });
}

/* ---------- 純関数: 表(マス目)の文字 → 席 ---------- */
/** "名前(司会)" / "名前 司会" → {name, role}。 */
function siSplitRole(cell) {
  var s = String(cell == null ? '' : cell).replace(/　/g, ' ').trim();
  var m = /^(.+?)\s*[（(]\s*(.+?)\s*[)）]$/.exec(s);
  if (m) return { name: m[1].trim(), role: m[2].trim() };
  var w = s.split(/\s+/);
  return { name: w[0] || '', role: w.slice(1).join(' ') };
}
/** CSVの1行(ダブルクォートつきも)。 */
function siCsvRow(line) {
  var out = [], cur = '', q = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
/**
 * マス目(2次元の文字)→ 席。空のセル・「黒板」などの札は席にしない。
 * 「黒板」が下半分にあれば上下を入れかえる(黒板をいつも上にする)。
 * @param {string[][]} grid
 * @return {{x:number,y:number,name:string,role:string}[]}
 */
function siGridToPoints(grid) {
  var pts = [], board = null, rows = grid.length;
  grid.forEach(function (row, r) {
    (row || []).forEach(function (cell, c) {
      var t = String(cell == null ? '' : cell).replace(/　/g, ' ').trim();
      if (!t) return;
      if (SI_LABEL.test(t.replace(/\s/g, ''))) { if (/黒板|こくばん/.test(t)) board = r; return; }
      var nr = siSplitRole(t);
      pts.push({ x: c, y: r, name: nr.name.replace(/[,、，]/g, ''), role: nr.role });
    });
  });
  if (board != null && board > (rows - 1) / 2) pts.forEach(function (p) { p.y = rows - 1 - p.y; p.x = -p.x; });
  return pts;
}

/**
 * 貼った文字・CSVの中身を読む(どの形かは中身から決める)。
 * @return {{kind:string, n:number, names:string[], seats:Object[], roles:Object[], errors:string[]}}
 *   kind: 'seatcode'(番号:行,列) / 'grid'(マス目) / 'names'(名前の一覧) / ''(空)
 */
function siReadText(text) {
  var t = String(text == null ? '' : text).replace(/\r\n?/g, '\n');
  var lines = t.split('\n').filter(function (l) { return l.trim() !== ''; });
  var empty = { kind: '', n: 0, names: [], seats: [], roles: [], errors: [] };
  if (!lines.length) return empty;
  var codeLines = lines.filter(function (l) { return /^\s*[0-9０-９]+\s*[:：]\s*[0-9０-９]+\s*[,，、]\s*[0-9０-９]+/.test(l); }).length;
  if (codeLines >= Math.max(1, lines.length * 0.6)) {
    var r = kgParseSeatPaste(t); r.kind = 'seatcode'; return r;
  }
  var grid = null;
  if (t.indexOf('\t') >= 0) grid = t.split('\n').map(function (l) { return l.split('\t'); });
  else if (lines.some(function (l) { return siCsvRow(l).length >= 3; })) grid = t.split('\n').map(siCsvRow);
  if (grid) return siFromPoints(siGridToPoints(grid), 'grid');
  // 名前だけの一覧(1行に1人・番号順)。席は型から
  var res = { kind: 'names', n: 0, names: [], seats: [], roles: [], errors: [] };
  lines.forEach(function (l) {
    var nr = siSplitRole(l.replace(/^\s*[0-9０-９]+[.．、)）:：\s]\s*/, ''));
    res.names.push(nr.name.replace(/[,、，]/g, ''));
    if (nr.role) res.roles.push({ '番号': res.names.length, '役割': nr.role });
  });
  res.n = res.names.length;
  if (res.n > 60) { res.errors.push('60人までです(いま ' + res.n + '行)'); }
  return res;
}
/** 点(位置・名前・役割)→ 番号つきの席。番号は siOrder の順。 */
function siFromPoints(pts, kind) {
  var res = { kind: kind, n: 0, names: [], seats: [], roles: [], errors: [] };
  if (!pts.length) { res.errors.push('席が見つかりませんでした'); return res; }
  if (pts.length > 60) { res.errors.push('席が ' + pts.length + ' 個あります(60まで)。多すぎる分は置き場に入ります'); }
  var cells = siPointsToGrid(pts);
  var order = siOrder(cells).slice(0, 60);
  order.forEach(function (i, k) {
    var no = k + 1, p = pts[i];
    res.names.push(p.name || '');
    if (p.role) res.roles.push({ '番号': no, '役割': p.role });
    if (cells[i]) res.seats.push({ '番号': no, '行': cells[i].r, '列': cells[i].c });
  });
  res.n = order.length;
  return res;
}

/* ---------- 純関数: 確かめ用の小さな見取り図(SVG) ---------- */
function siMiniMapSvg(res) {
  if (!res || !res.seats.length) return '';
  var rs = res.seats.map(function (s) { return s['行']; }), cs = res.seats.map(function (s) { return s['列']; });
  var r0 = Math.min.apply(null, rs), r1 = Math.max.apply(null, rs), c0 = Math.min.apply(null, cs), c1 = Math.max.apply(null, cs);
  var U = 34, W = (c1 - c0 + 1) * U, H = (r1 - r0 + 2) * U;
  var role = {}; res.roles.forEach(function (x) { role[x['番号']] = x['役割']; });
  var body = '<rect x="0" y="0" width="' + W + '" height="' + (U * 0.6) + '" rx="4" class="si-board"/>' +
    '<text x="' + (W / 2) + '" y="' + (U * 0.42) + '" class="si-board-t">黒板</text>' +
    res.seats.map(function (s) {
      var x = (s['列'] - c0) * U, y = (s['行'] - r0 + 1) * U, no = s['番号'], nm = res.names[no - 1] || '';
      return '<g><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="' + (U - 4) + '" height="' + (U - 4) + '" rx="5" class="si-seat' + (role[no] ? ' si-seat--sh' : '') + '"/>' +
        '<text x="' + (x + U / 2) + '" y="' + (y + U * 0.42) + '" class="si-no">' + no + '</text>' +
        (nm ? '<text x="' + (x + U / 2) + '" y="' + (y + U * 0.78) + '" class="si-nm">' + escapeHtml(nm.slice(0, 3)) + '</text>' : '') + '</g>';
    }).join('');
  return '<svg class="si-map" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="入れた座席の見取り図(' + res.n + '席)">' + body + '</svg>';
}

/* ---------- ファイルを読む(ブラウザ) ---------- */
/** 写真 → 灰色の画素 → 丸。★この端末の中だけで読む(外へ送らない)。rot: 0/90/180/270 */
function siReadImage(file, rot) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 900 / Math.max(img.width, img.height));
      var w0 = Math.round(img.width * k), h0 = Math.round(img.height * k);
      var side = (rot === 90 || rot === 270), cv = document.createElement('canvas');
      cv.width = side ? h0 : w0; cv.height = side ? w0 : h0;
      var ctx = cv.getContext('2d');
      ctx.translate(cv.width / 2, cv.height / 2); ctx.rotate((rot || 0) * Math.PI / 180);
      ctx.drawImage(img, -w0 / 2, -h0 / 2, w0, h0);
      URL.revokeObjectURL(url);
      var d = ctx.getImageData(0, 0, cv.width, cv.height).data, g = new Uint8Array(cv.width * cv.height);
      for (var i = 0; i < g.length; i++) g[i] = (d[i * 4] * 299 + d[i * 4 + 1] * 587 + d[i * 4 + 2] * 114) / 1000;
      var rings = siDetectRings(g, cv.width, cv.height);
      resolve({ rings: rings, canvas: cv });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('写真を開けませんでした')); };
    img.src = url;
  });
}
/** CSV(UTF-8 / Excelが書く Shift_JIS)を文字に。 */
function siReadTextFile(file) {
  return file.arrayBuffer().then(function (buf) {
    var t = new TextDecoder('utf-8').decode(buf);
    if (t.indexOf('\uFFFD') >= 0) { try { t = new TextDecoder('shift_jis').decode(buf); } catch (e) {} }
    return t.replace(/^﻿/, '');
  });
}
/** Excel(.xlsx)の最初のシートを 2次元の文字に。zipの中身はブラウザの DecompressionStream で開く(ライブラリなし)。 */
function siReadXlsx(file) {
  return file.arrayBuffer().then(function (buf) {
    var u8 = new Uint8Array(buf), dv = new DataView(buf), files = {};
    var e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('Excelのファイルとして読めませんでした');
    var cnt = dv.getUint16(e + 10, true), p = dv.getUint32(e + 16, true);
    for (var i = 0; i < cnt; i++) {
      var method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      var nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
      var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
      files[name] = { method: method, csize: csize, off: off };
      p += 46 + nlen + xlen + clen;
    }
    function read(name) {
      var f = files[name]; if (!f) return Promise.resolve('');
      var lnl = dv.getUint16(f.off + 26, true), lxl = dv.getUint16(f.off + 28, true), st = f.off + 30 + lnl + lxl;
      var data = u8.subarray(st, st + f.csize);
      if (f.method === 0) return Promise.resolve(new TextDecoder().decode(data));
      var ds = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Response(ds).text();
    }
    var sheet = Object.keys(files).filter(function (n) { return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); }).sort()[0];
    if (!sheet) throw new Error('シートが見つかりませんでした');
    return Promise.all([read('xl/sharedStrings.xml'), read(sheet)]).then(function (xs) {
      var P = new DOMParser(), ss = [];
      if (xs[0]) Array.prototype.forEach.call(P.parseFromString(xs[0], 'application/xml').getElementsByTagName('si'), function (si) {
        ss.push(Array.prototype.map.call(si.getElementsByTagName('t'), function (t) { return t.textContent; }).join(''));
      });
      var grid = [];
      Array.prototype.forEach.call(P.parseFromString(xs[1], 'application/xml').getElementsByTagName('c'), function (c) {
        var ref = c.getAttribute('r') || '', m = /^([A-Z]+)(\d+)$/.exec(ref); if (!m) return;
        var col = 0; for (var k = 0; k < m[1].length; k++) col = col * 26 + (m[1].charCodeAt(k) - 64);
        var row = Number(m[2]) - 1, type = c.getAttribute('t'), v = c.getElementsByTagName('v')[0], val = '';
        if (type === 's' && v) val = ss[Number(v.textContent)] || '';
        else if (type === 'inlineStr') val = Array.prototype.map.call(c.getElementsByTagName('t'), function (t) { return t.textContent; }).join('');
        else if (v) val = v.textContent;
        (grid[row] = grid[row] || [])[col - 1] = val;
      });
      for (var r = 0; r < grid.length; r++) grid[r] = grid[r] || [];
      return grid;
    });
  });
}

/* ---------- 写真の名前を読む(端末の中だけ・2026-10-06 先生「送らない」を選択) ----------
   文字の読み取りは Tesseract(無料・オープンソース)をこの端末の中で動かす。
   ★ネットから取ってくるのは「読み取りのプログラムと日本語の辞書(約2MB)」だけ。写真はどこへも送らない。
   ★手書きは読みまちがいが出る。読んだ名前は始める前に一覧で直せるようにする(そのまま信じない)。
   ★授業中に要らない機能なので、使うときだけ読み込む(CDNが止まっていても、席の位置は入る)。 */
var SI_OCR_SRC = '';   // 体験版：外から 読みこまない
var _siOcrWorker = null;
function siLoadOcr() {
  if (_siOcrWorker) return _siOcrWorker;
  _siOcrWorker = new Promise(function (resolve, reject) {
    return reject(new Error('体験版なので、写真の文字の読み取りは使えません(席の位置は入ります)'));
    var sc = document.createElement('script');
    sc.src = SI_OCR_SRC; sc.async = true;
    sc.onload = function () { resolve(window.Tesseract); };
    sc.onerror = function () { reject(new Error('文字の読み取りの準備ができませんでした(ネットにつながっていないかもしれません)')); };
    document.head.appendChild(sc);
  }).then(function (T) {
    return T.createWorker('jpn', 1, {}).then(function (wk) {
      return wk.setParameters({ tessedit_pageseg_mode: '7', preserve_interword_spaces: '0' }).then(function () { return wk; });
    });
  });
  _siOcrWorker.catch(function () { _siOcrWorker = null; });
  return _siOcrWorker;
}
/** 丸の中だけを切りぬいて、大きく・白黒くっきりにする(丸のふちは白で消す)。 */
function siCropRing(cv, ring) {
  var r = ring.s / 2, x0 = Math.max(0, Math.round(ring.x - r)), y0 = Math.max(0, Math.round(ring.y - r * 0.85));
  var w = Math.min(cv.width - x0, Math.round(r * 2)), h = Math.min(cv.height - y0, Math.round(r * 1.7));
  var src = cv.getContext('2d').getImageData(x0, y0, w, h).data;
  var k = Math.max(2, Math.round(110 / h)), out = document.createElement('canvas');
  out.width = w * k; out.height = h * k;
  var oc = out.getContext('2d'), od = oc.createImageData(out.width, out.height);
  var hist = new Array(256).fill(0), gray = new Uint8Array(w * h);
  for (var i = 0; i < w * h; i++) { var gv = (src[i * 4] * 299 + src[i * 4 + 1] * 587 + src[i * 4 + 2] * 114) / 1000 | 0; gray[i] = gv; hist[gv]++; }
  // 大津のしきい値(紙と字を分ける)
  var tot = w * h, sum = 0, sB = 0, wB = 0, best = 0, th = 128;
  for (var t = 0; t < 256; t++) sum += t * hist[t];
  for (t = 0; t < 256; t++) { wB += hist[t]; if (!wB) continue; var wF = tot - wB; if (!wF) break; sB += t * hist[t];
    var mB = sB / wB, mF = (sum - sB) / wF, between = wB * wF * (mB - mF) * (mB - mF); if (between > best) { best = between; th = t; } }
  for (var yy = 0; yy < out.height; yy++) for (var xx = 0; xx < out.width; xx++) {
    var sx = (xx / k) | 0, sy = (yy / k) | 0, u = (x0 + sx - ring.x) / r, v = (y0 + sy - ring.y) / (r * 0.85);
    var ink = gray[sy * w + sx] < th && (u * u * 0.85 + v * v) < 0.72;   // ふち(丸の線)は字にしない。横長の名前のはしは切らない
    var o = (yy * out.width + xx) * 4, c = ink ? 0 : 255;
    od.data[o] = od.data[o + 1] = od.data[o + 2] = c; od.data[o + 3] = 255;
  }
  oc.putImageData(od, 0, 0);
  return out;
}
/** 読んだ文字を名前らしく整える(空白・記号・ふちの線のなごりを落とす)。 */
function siCleanName(t) {
  return String(t || '').replace(/[\s|｜!！'"`_\-—–~〜()（）\[\]{}<>.,、。・:;「」『』【】]/g, '')
    .replace(/[A-Za-z0-9]/g, '').slice(0, 8);
}
/**
 * 丸ごとに名前を読む。onStep(i, n) で進みぐあいを知らせる。
 * @return {Promise<string[]>} rings と同じ順(読めなければ '')
 */
function siOcrNames(cv, rings, onStep) {
  return siLoadOcr().then(function (wk) {
    var names = [], i = 0;
    function next() {
      if (i >= rings.length) return Promise.resolve(names);
      var crop = siCropRing(cv, rings[i]);
      return wk.recognize(crop).then(function (res) {
        var conf = (res && res.data && res.data.confidence) || 0;
        names.push(conf >= 20 ? siCleanName(res.data.text) : '');
        i++; if (onStep) onStep(i, rings.length);
        return next();
      });
    }
    return next();
  });
}

/* ---------- 研究用の会を始める画面とのつなぎ ---------- */
/** ファイルを選んだ: 写真なら丸を探す・Excel/CSVならマス目を読む。 */
function siHandleFile(file) {
  if (!file) return;
  var name = (file.name || '').toLowerCase(), out = document.getElementById('kk-si-out');
  if (out) out.innerHTML = '<div class="fx-help">読んでいます…</div>';
  App._siFile = file;
  var isImg = /\.(jpe?g|png|webp|heic)$/.test(name) || String(file.type || '').indexOf('image') === 0;
  var job = isImg ? siReadImage(file, App._siRot || 0).then(function (r) {
        var res = siFromPoints(r.rings.map(function (g) { return { x: g.x, y: g.y }; }), 'photo');
        res.found = r.rings.length;
        App._siPhoto = r;   // 名前を読むときに使う(この端末の中だけ)
        return res;
      })
    : /\.xlsx$/.test(name) ? siReadXlsx(file).then(function (grid) { return siFromPoints(siGridToPoints(grid), 'grid'); })
    : siReadTextFile(file).then(siReadText);
  job.then(function (res) { App._seatIn = res; siShowResult(); if (isImg && res.n) siReadNames(); })
    .catch(function (e) { App._seatIn = null; if (out) out.innerHTML = '<div class="fx-help fx-err">' + escapeHtml((e && e.message) || e) + '</div>'; });
}
/** 写真の丸の中の名前を読む(端末の中)。読んだ名前は一覧で直してから始める。 */
function siReadNames() {
  var P = App._siPhoto, R = App._seatIn; if (!P || !R) return;
  var token = App._siTok = (App._siTok || 0) + 1;
  var st = document.getElementById('si-ocr-state');
  function say(t) { var e = document.getElementById('si-ocr-state'); if (e) e.innerHTML = t; }
  say('名前を読んでいます…（この端末の中で読みます・はじめは準備に少しかかります）');
  siOcrNames(P.canvas, P.rings, function (i, n) { if (App._siTok === token) say('名前を読んでいます… ' + i + ' / ' + n); })
    .then(function (names) {
      if (App._siTok !== token || App._seatIn !== R) return;   // 回した・選び直したあとに届いた古い結果は使わない
      var res = siFromPoints(P.rings.map(function (g, i) { return { x: g.x, y: g.y, name: names[i] }; }), 'photo');
      res.found = R.found; res.ocr = true;
      App._seatIn = res; siShowResult();
    })
    .catch(function (e) { if (App._siTok === token) say('<span class="fx-err">' + escapeHtml((e && e.message) || e) + '</span>　席の位置は入っています。名前は下の一覧か、始めたあと ✎ で入れられます。'); });
}
/** 一覧で名前を直す(読みまちがいを直す・空のままでもよい)。 */
function siEditName(no, v) {
  var R = App._seatIn; if (!R) return;
  R.names[no - 1] = String(v || '').replace(/[,、，]/g, '').trim();
  var m = document.getElementById('si-map'); if (m) m.outerHTML = siMiniMapSvg(R).replace('<svg ', '<svg id="si-map" ');
}
/** 写真の向きを変えて読み直す(黒板が上になるように)。 */
function siRotate(d) {
  App._siRot = ((App._siRot || 0) + d + 360) % 360;
  if (App._siFile) siHandleFile(App._siFile);
}
/** 読めた中身を、見取り図と1行で見せる。人数も合わせる。 */
function siShowResult() {
  var out = document.getElementById('kk-si-out'), r = App._seatIn; if (!out) return;
  if (!r || !r.n) { out.innerHTML = (r && r.errors.length) ? '<div class="fx-help fx-err">' + r.errors.map(escapeHtml).join(' ／ ') + '</div>' : ''; return; }
  var e = document.getElementById('kk-n'); if (e) { e.value = r.n; kkCount(); }
  var kind = { photo: '写真から', grid: '表から', seatcode: '貼った席表から', names: '名前の一覧から' }[r.kind] || '';
  var nNames = r.names.filter(Boolean).length;
  out.innerHTML =
    '<div class="si-result">' +
      '<div class="si-result__head"><b>' + kind + ' ' + r.n + '人</b>' +
        '<span>席 ' + r.seats.length + ' ・ 呼び名 ' + nNames + ' ・ 役割 ' + r.roles.length + '</span>' +
        (r.kind === 'photo' ? '<span class="spacer"></span><button type="button" class="fx-btn si-rot" onclick="siRotate(-90)" aria-label="写真を左に回す">左に回す</button>' +
          '<button type="button" class="fx-btn si-rot" onclick="siRotate(90)" aria-label="写真を右に回す">右に回す</button>' : '') +
      '</div>' +
      (r.seats.length ? siMiniMapSvg(r).replace('<svg ', '<svg id="si-map" ') : '<div class="fx-help">席の位置は入っていません（型から並べます。あとでドラッグで直せます）。</div>') +
      (r.kind === 'photo' ? '<div class="fx-help" id="si-ocr-state">' + (r.ocr ? '名前を読みました。<b>手書きは読みまちがいが多いので、下の一覧で直してください</b>（印刷した座席表はよく読めます）。' : '') + '</div>' : '') +
      '<details class="si-names"' + (r.ocr ? ' open' : '') + '><summary>名前の一覧（' + r.n + '人・ここで直せます）</summary><div class="si-names__grid">' +
        r.names.map(function (nm, i) {
          return '<label class="si-name"><span>' + (i + 1) + '</span><input value="' + escapeHtml(nm || '') + '" placeholder="' + (i + 1) + '番" ' +
            'aria-label="' + (i + 1) + '番の名前" oninput="siEditName(' + (i + 1) + ',this.value)"></label>';
        }).join('') + '</div></details>' +
      '<div class="fx-help">' + (r.kind === 'photo'
        ? '黒板が上になっていなければ「回す」。数えまちがいは、始めたあと「席を直す」でドラッグして直せます。名前は席の ✎ で入れられます。'
        : '違うところは、始めたあと「席を直す」でドラッグして直せます。') + '</div>' +
      (r.errors.length ? '<div class="fx-help fx-err">' + r.errors.map(escapeHtml).join(' ／ ') + '</div>' : '') +
    '</div>';
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { siDetectRings: siDetectRings, siPointsToGrid: siPointsToGrid, siOrder: siOrder, siSplitRole: siSplitRole,
    siCsvRow: siCsvRow, siGridToPoints: siGridToPoints, siCleanName: siCleanName, siReadText: siReadText, siFromPoints: siFromPoints, siMiniMapSvg: siMiniMapSvg };
}
</script>

<script>

}

function itteChildOf(sid) {
  var d = App.itte && App.itte.data; if (!d) return null;
  return (d['児童'] || []).filter(function (x) { return x['児童ID'] === sid; })[0] || null;
}
function itteSelect(sid) { App.itte.sel = sid; renderItte(); }
function itteNext() {
  var A = App.itte, order = (A.data['順'] || []);
  var i = order.indexOf(A.sel);
  A.sel = order[(i + 1) % Math.max(1, order.length)] || null;
  renderItte();
}

function renderItte() {
  var A = App.itte, d = A.data, g = d['議題'] || {}, ag = d['集計'] || {};
  var title = (g['回'] ? '第' + g['回'] + '回' : '') +
    ((g['議題名'] && g['議題名'] !== '(未設定)') ? '「' + g['議題名'] + '」' : '') +
    (g['実施日'] ? ' ' + g['実施日'] : '');

  document.getElementById('app').innerHTML =
    gkPageHead('home', 'つぎの一手', escapeHtml(title) + (g['研究'] ? ' <span class="kbadge-ken">研究</span>' : ''),
      '<button class="btn" onclick="openKaigiReview(\'' + A.gidaiId + '\')">' + mtIco('chart') + ' 振り返りを見る</button>') +
    '<main class="itte">' +
      itteTopHtml(ag) +
      '<div class="itte-body">' +
        '<div class="itte-left" id="itte-hall"></div>' +
        '<div class="itte-right" id="itte-one">' + itteOneHtml() + '</div>' +
      '</div>' +
    '</main>';
  renderItteHall();
}

/* ===== 上帯(★25 §4.1)。数字ではなく文字で。まだ書いていない子は名前で出す。 ===== */
function itteTopHtml(ag) {
  var q = ag['象限人数'] || {};
  var mada = (ag['まだ書いていない子'] || []).map(function (o) {
    return '<span class="itte-nm" onclick="itteSelect(\'' + o['児童ID'] + '\')">' +
      (o['番号'] || '') + ' ' + escapeHtml(o['表示名']) + '</span>';
  }).join('');
  return '<div class="itte-top">' +
    '<div class="itte-top__line">' +
      '<b>②' + ITTE_Q_NAME['②'] + '</b> ' + (q['②'] || 0) + '人' +
      '　／　<b>③' + ITTE_Q_NAME['③'] + '</b> ' + (q['③'] || 0) + '人' +
      '　／　めあて未 ' + (ag['めあて未'] || []).length + '人' +
      '　／　2択未 ' + (ag['2択未'] || []).length + '人' +
      '　／　対象 ' + (ag['対象人数'] || 0) + '人' +
      ((ag['欠席人数'] || 0) ? '(欠席' + ag['欠席人数'] + '人を除く)' : '') +
    '</div>' +
    (mada ? '<div class="itte-top__mada">まだ書いていない子：<span class="namelist">' + mada + '</span></div>' : '') +
  '</div>';
}

/* ===== 左(座席)。記録係と同じ席の画面(2026-10-22 先生「揃えて」)。頭に it-。
   席は記録係と同じ升目(kgFromSaved)。面の大きさに合わせて升を決め、はみ出さない。
   象限は文字①〜④と枠の線種だけ(色に意味を持たせない・赤を付けない)。 ===== */
function renderItteHall() {
  var A = App.itte, d = A.data;
  var host = document.getElementById('itte-hall'); if (!host) return;
  var students = (d['児童'] || []).map(function (x) {
    return { '児童ID': x['児童ID'], '番号': x['番号'], '表示名': x['表示名'] };
  });
  var roles = {}; (d['役割'] || []).forEach(function (r) { roles[r['児童ID']] = r['役割']; });
  // ★App.kaigi の状態には触らない。保存された席(自由配置・古いコの字)を記録係と同じ升目にする
  var pos = kgFromSaved(students, d['座席'] || {}, Object.keys(roles));
  var ids = students.map(function (x) { return x['児童ID']; });
  var placed = ids.filter(function (id) { return pos[id]; }), tray = ids.filter(function (id) { return !pos[id]; });
  // 見るだけの面なので、空いた列・行が続くところは1つにつめる(席の並びはそのまま・保存した席は変えない)
  function squeeze(vals) {
    var u = vals.filter(function (x, i) { return vals.indexOf(x) === i; }).sort(function (a, b) { return a - b; }), m = {}, k = 0;
    u.forEach(function (x, i) { if (i && x - u[i - 1] > 1) k++; m[x] = k++; });
    return { m: m, n: k };
  }
  var sr = squeeze([1].concat(placed.map(function (id) { return pos[id].r; }))), sc = squeeze(placed.map(function (id) { return pos[id].c; }));
  var nr = sr.n, nc = Math.max(1, sc.n);
  var top0 = 40, aw = Math.max(200, host.clientWidth - 16);
  var ah = Math.max(260, window.innerHeight - host.getBoundingClientRect().top - 24 - (tray.length ? 70 : 0)) - top0;
  // 字が重ならない大きさより小さくしない(せまいときは横に送って見る)
  var hasRole = Object.keys(roles).length > 0;
  var cw = Math.max(64, Math.min(120, Math.floor(aw / nc))), ch = Math.max(hasRole ? 70 : 54, Math.min(80, Math.floor(ah / nr)));
  var left = 8 + Math.max(0, Math.floor((aw - cw * nc) / 2));

  function seat(sid, style) {
    var c = itteChildOf(sid) || { '表示名': sid, '幅': 0, '問': {} }, q = c['象限'], role = roles[sid] || '';
    var tq = c['問'] || {}, marks = ITTE_KAKAWARI.map(function (m, i) { return tq[String(i + 1)] ? '<b class="on">' + m[0] + '</b>' : '<b>・</b>'; }).join('');
    var said = ITTE_KAKAWARI.filter(function (m, i) { return tq[String(i + 1)]; }).map(function (m) { return m[1]; }).join('・') || 'なし';
    return '<button type="button" class="it-seat' + (q ? ' it-q' + (ITTE_Q_ORDER.indexOf(q) + 1) : '') + (A.sel === sid ? ' sel' : '') + (c['欠席'] ? ' off' : '') +  + '"' +
      ' style="' + style + '" onclick="itteSelect(\'' + sid + '\')" aria-pressed="' + (A.sel === sid) + '"' +
      ' aria-label="' + escapeHtml((c['番号'] || '') + '番 ' + c['表示名'] + (q ? ' 象限' + q : '') + ' 関わり ' + said) + '">' +
      (role ? '<span class="it-role">' + escapeHtml(role) + '</span>' : '') +
      '<span class="it-nm">' + escapeHtml(c['表示名']) + '</span>' +
      '<span class="it-mk"><small>' + escapeHtml(c['番号'] || '') + '</small>' + (q ? '<b>' + q + '</b>' : '') + '<span class="it-k">' + marks + '</span></span></button>';
  }
  var gap = 6;
  var seats = placed.map(function (sid) {
    var p = pos[sid];
    return seat(sid, 'left:' + (left + sc.m[p.c] * cw + gap / 2) + 'px;top:' + (top0 + sr.m[p.r] * ch + gap / 2) + 'px;width:' + (cw - gap) + 'px;height:' + (ch - gap) + 'px');
  }).join('');
  host.innerHTML =
    '<div class="it-scroll"><div class="it-hall" style="height:' + (top0 + nr * ch + 8) + 'px;min-width:' + (left + nc * cw + 8) + 'px"><div class="it-board">黒板</div>' + seats + '</div></div>' +
    (tray.length ? '<div class="it-tray"><span>席のない子</span>' + tray.map(function (sid) { return seat(sid, 'position:relative;width:110px;height:56px'); }).join('') + '</div>' : '') +
    '<p class="it-legend">関わり　言＝言った・届＝届いた・自＝自分から。印の数に上下はありません。象限は子どもの優劣ではなく、③は「私の見取り」の情報です。</p>';
}
var ittRz; window.addEventListener('resize', function () { clearTimeout(ittRz); ittRz = setTimeout(function () { if (App.screen === 'itte') renderItteHall(); }, 150); });
var ITTE_Q_ORDER = ['①', '②', '③', '④'];

/* ===== 右(ひとり)。⑴めあて ⑵記録 ⑶本人の2択 ⑷象限と既定文 ⑸一言 ⑹つぎの子 ===== */
function itteOneHtml() {
  var A = App.itte, c = itteChildOf(A.sel);
  if (!c) return '<div class="apanel"><div class="anote">左の席をタップすると、その子の記録が出ます。</div></div>';
  var uchiwake = Object.keys(c['内訳'] || {}).map(function (k) {
    return escapeHtml(k) + ' ' + c['内訳'][k];
  }).join('・') || '—';

  // ⑴ めあて
  var g = c['めあて'];
  var goalHtml = g
    ? '<div class="itte-goal"><span class="itte-tag">' + escapeHtml(g['型']) + '</span>' +
      '<span>' + (escapeHtml(g['文']) || '<span class="anote">（文は未記入）</span>') + '</span></div>'
    : '<div class="itte-未">未記入</div>' + itteInputGoalHtml(c);

  // ⑶ 本人の2択
  var d2 = c['自己評価'];
  var quote = (d2 && d2['文']) ? '<div class="itte-quote">' + escapeHtml(d2['文']) + '</div>' : '';
  var selfHtml = (d2 && d2['2択'])
    ? '<div class="itte-self"><b>' + escapeHtml(d2['2択']) + '</b>' + quote + '</div>'
    // ★ふりかえりの文だけ届いている(2択が無い/旧い◎○△)ときは、文は出しつつ2択を入れてもらう
    : '<div class="itte-未">2択が未記入' + (d2 && d2['生の値'] ? '（届いた値: ' + escapeHtml(d2['生の値']) + '）' : '') + '</div>' +
      quote + itteInputDoneHtml(c);

  // ⑷ 象限。型が「じぶんで」で見取り未なら、先生が1タップ(★25 §3.1)
  var q = c['象限'];
  var needMitori = g && g['型'] === 'じぶんで' && c['記録あり'] === null;
  var qHtml = needMitori
    ? '<div class="itte-q0">めあてを自分で書いた子です。<b>記録はありましたか？</b>' +
      '<div class="row" style="margin-top:6px">' +
        '<button class="btn" onclick="itteMitori(\'あった\')">あった</button>' +
        '<button class="btn" onclick="itteMitori(\'見えなかった\')">見えなかった</button></div></div>'
    : q
      ? '<div class="itte-qbox itte-qbox--' + (ITTE_Q_ORDER.indexOf(q) + 1) + '">' +
        '<b>象限 ' + q + '：' + ITTE_Q_NAME[q] + '</b>' +
        '<div class="anote" style="margin-top:4px">' + escapeHtml(itteHintOf(q)) + '</div></div>'
      : '<div class="itte-q0">めあてか2択がまだなので、象限は出しません。</div>';

  var draft = c['一言'] || (q ? (c['表示名'] + 'さん、' + ITTE_DEFAULT[q]) : '');

  return '<div class="apanel itte-one">' +
    '<div class="itte-head"><b>' + (c['番号'] || '') + '番 ' + escapeHtml(c['表示名']) + '</b>' +
      (c['欠席'] ? '<span class="itte-tag">欠席</span>' : '') +
      '<span class="spacer"></span>' +
      '<button class="btn" onclick="itteNext()">つぎの子 ▶</button></div>' +

    '<div class="itte-sec"><div class="itte-lab">' + mtIco('target') + ' めあて</div>' + goalHtml + '</div>' +

    '<div class="itte-sec"><div class="itte-lab">関わり</div>' +
      '<div class="itte-kiroku">' + uchiwake + '</div>' +
      '<div class="itte-kiroku anote">受け取られ ' + c['受け取られ'] + ' ／ 相手の異なり ' + c['相手の異なり'] +
        ' ／ じぶんから ' + c['宛先じぶん'] + ' ／ よさ ' + c['よさ数'] + '</div>' +
      '<div class="itte-toi">' + ITTE_KAKAWARI.map(function (m) { return m[1]; }).map(function (t, i) {
        var on = c['問'][String(i + 1)];
        return '<span class="' + (on ? 'on' : '') + '">' + t + (on ? ' ✓' : ' —') + '</span>';
      }).join('') + '</div>' +
    '</div>' +

    '<div class="itte-sec"><div class="itte-lab">本人</div>' + selfHtml + '</div>' +

    qHtml +

    '<div class="itte-sec"><div class="itte-lab">一言を返す<span class="anote">（既定文はそのまま送らず、必ず直してください）</span></div>' +
      '<textarea class="memo-input" id="itte-kotoba" style="min-height:84px">' + escapeHtml(draft) + '</textarea>' +
      '<div class="row" style="margin-top:8px">' +
        '<button class="btn btn--primary" id="itte-save" onclick="itteSave(false)">この一言を残す</button>' +
        '<button class="btn" id="itte-send" onclick="itteSave(true)">残して、子どもに返す</button>' +
        '<span class="anote" id="itte-msg">' + (c['送信'] ? '送信: ' + escapeHtml(c['送信']) : '') + '</span>' +
      '</div>' +
      '<div class="anote">一言は<b>必ずミトリに残ります</b>（ツムゴロウへ送れなくても消えません）。</div>' +
    '</div>' +
  '</div>';
}
function itteHintOf(q) {
  return q === '①' ? '場面を名指しで価値づける → 次のめあてを一段ずらす。'
    : q === '②' ? 'ここが最も効く。記録の場面を具体で返す。'
    : q === '③' ? '子どもには問いで返す。次回はその子を最初から見ると決める。'
    : '場の保障（指名計画・柱の立て方）＋めあての立て直しを一緒に。';
}

/* ===== ツムゴロウの行が無い子の手入力(★25 §4.7 紙の道) ===== */
function itteInputGoalHtml(c) {
  return '<div class="itte-in">' +
    '<div class="row">' + ITTE_GOAL_TYPES.map(function (t) {
      return '<button class="cond" onclick="itteSetGoalType(this,\'' + t + '\')">' + t + '</button>';
    }).join('') + '</div>' +
    '<input id="itte-goal-text" class="kp-input" placeholder="めあての文（学級会ノートから写す）" style="width:100%;margin-top:6px">' +
    '<div class="row" style="margin-top:6px"><button class="btn" onclick="itteSaveGoal()">めあてを入れる</button>' +
    '<span class="anote">ツムゴロウから届いていない子は、ここで入れます（紙で書いた子も同じ）。</span></div>' +
  '</div>';
}
function itteSetGoalType(btn, t) {
  App.itte._goalType = t;
  var p = btn.parentElement;
  [].slice.call(p.querySelectorAll('.cond')).forEach(function (b) { b.classList.toggle('on', b === btn); });
}
function itteSaveGoal() {
  var A = App.itte, t = A._goalType || '';
  if (!t) { alert('めあての型を選んでください。'); return; }
  var e = document.getElementById('itte-goal-text');
  callServer('saveKodomoKiroku', A.gidaiId, A.sel,
    { '種別': '個人めあて', '内容': e ? e.value.trim() : '', 'カテゴリ': t })
    .then(function () { A._goalType = null; goItte(A.gidaiId); }).catch(alertErr);
}
function itteInputDoneHtml(c) {
  return '<div class="itte-in">' +
    '<div class="row">' +
      '<button class="btn" onclick="itteSaveDone(\'できた\')">できた</button>' +
      '<button class="btn" onclick="itteSaveDone(\'できなかった\')">できなかった</button>' +
      '<input id="itte-done-text" class="kp-input" placeholder="本人の言葉（あれば）" style="flex:1;min-width:140px">' +
    '</div></div>';
}
function itteSaveDone(v) {
  var A = App.itte, e = document.getElementById('itte-done-text');
  callServer('saveKodomoKiroku', A.gidaiId, A.sel,
    { '種別': '振り返り(話し合い)', '内容': e ? e.value.trim() : '', '達成度': v })
    .then(function () { goItte(A.gidaiId); }).catch(alertErr);
}

/* ===== 先生の記録 ===== */
function itteMitori(v) {
  var A = App.itte, c = itteChildOf(A.sel); if (!c) return;
  callServer('saveTsugiNoItte', A.gidaiId, A.sel, { '象限': '', '見取り': v, '一言': '', '送る': false })
    .then(function () { goItte(A.gidaiId); }).catch(alertErr);
}
function itteSave(send) {
  var A = App.itte, c = itteChildOf(A.sel); if (!c || A.busy) return;
  var e = document.getElementById('itte-kotoba');
  var text = e ? e.value.trim() : '';
  if (!text) { alert('一言を書いてください。'); return; }
  A.busy = true;
  var b1 = document.getElementById('itte-save'), b2 = document.getElementById('itte-send');
  if (b1) b1.disabled = true; if (b2) b2.disabled = true;
  var msg = document.getElementById('itte-msg'); if (msg) msg.textContent = '保存中…';
  callServer('saveTsugiNoItte', A.gidaiId, A.sel,
    { '象限': c['象限'] || '', '見取り': c['見取り'] || '', '一言': text, '送る': !!send })
    .then(function (r) {
      A.busy = false;
      if (msg) msg.textContent = (r['送信'] === '済') ? '子どもに返しました'
        : (r['送信'] === '失敗') ? ('ミトリに残しました（返せませんでした：' + (r['why'] || '') + '）')
        : 'ミトリに残しました';
      // 記録が増えたので読み直す。選んでいる子は保つ。
      var keep = A.sel;
      callServer('getTsugiNoItte', A.gidaiId).then(function (d) {
        A.data = d; A.sel = keep; renderItte();
        var m2 = document.getElementById('itte-msg'); if (m2 && msg) m2.textContent = msg.textContent;
      });
    })
    .catch(function (err) {
      A.busy = false;
      if (b1) b1.disabled = false; if (b2) b2.disabled = false;
      if (msg) msg.textContent = '';
      alertErr(err);
    });
}
</script>

<!-- js_dashboard.html — 先生のダッシュボード(docs/30 §8.8(4)・見本 docs/学級会アプリ_見本/先生のダッシュボード_見本.html が正)。
     4つの面: 学級の歩み・ひとり・変容の一覧・評価の案。サーバは getDashboard / readBridge の2つだけ(api_dashboard.gs)。
     ★計算は書かない。calc_henyo.js がサーバで組んだものを並べるだけ。外への通信は0(google.script.run だけ)。
     ★グラフの色は見本の検査ずみの色(めあての型=4色/決まったことへの思い=3色/関わり方の幅=青の濃淡)。
       明るい色(水・黄・桃)は面との差が3:1未満 → 直接ラベル＋「表で見る」を必ず付ける。色だけで伝えない。
     ★数・順位・よしあしの色を出さない。子どもの並びはいつも番号順。
     ★クラス名・色の名前は gkd- の中だけ(先客とぶつけない)。 -->
<style>

  --o1:#008300;--o2:#eda100;--o3:#e87ba4;
  --w0:#86b6ef;--w1:#3987e5;--w2:#1c5cab;--w3:#0d366b;
  --hm0:#F3F6FB;--hm1:#cde2fb;--hm2:#9ec5f4;--hm3:#5598e7;--hm4:#256abf;
  --none:#D9D8D3;--mark:#FFF1C2;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Meiryo",system-ui,sans-serif;
  position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;font-feature-settings:"palt" 1;color-scheme:light;
}

.gkd-top{display:flex;align-items:center;gap:16px;height:56px;border-bottom:1px solid var(--line);flex:none;min-width:0}

.gkd-tabs{display:flex;gap:2px;flex:none}
.gkd-tabs button{min-height:44px;padding:0 14px;border:0;background:none;font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.gkd-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.gkd-bar{display:flex;align-items:center;gap:12px;height:48px;border-bottom:1px solid var(--line);flex:none;font-size:14px;color:var(--ink-2);min-width:0;overflow:hidden}
.gkd-bar b{color:var(--ink);font-weight:700;white-space:nowrap}
.gkd-ctl{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.gkd-ctl > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gkd-lead{max-width:1240px;margin:0 auto 8px;font-size:14px;color:var(--ink-3)}
/* 先生のPC(1000×570)では、4つの数字を1行にして4つのグラフを1画面に収める */
.gkd-sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 18px;white-space:nowrap}
.gkd-sum span{color:var(--ink-2)}
.gkd-sum b{color:var(--ink);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin:0 2px}
.gkd-sp{flex:1}
.gkd-pill{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.gkd-pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gkd-pill:disabled{color:var(--ink-3);cursor:default}
.gkd-alert{flex:none;display:flex;align-items:center;gap:12px;min-height:44px;font-size:14px;border-bottom:1px solid var(--line);background:var(--warn-soft);color:var(--warn)}
.gkd-alert b{font-weight:700}

.gkd-main{flex:1;min-height:0;overflow:auto;padding-block:14px}
.gkd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;max-width:1240px;margin:0 auto}
.gkd-grid.w3{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.gkd-sec{min-width:0;border-top:1px solid var(--ink);padding-top:8px}
.gkd-sec.span{grid-column:1/-1}
.gkd-sh{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.gkd-sh h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.gkd-shk{align-items:center;margin-bottom:2px}
.gkd-shk .gkd-legend{margin:0;gap:0 10px;min-width:0}
.gkd-shk .gkd-legend > span{white-space:nowrap}
.gkd-sh p{margin:0;font-size:14px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gkd-tv{min-height:44px;padding:0 4px;border:0;background:none;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.gkd-note{margin:6px 0 0;font-size:14px;color:var(--ink-3)}
.gkd-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--ink-2);margin:0 0 4px}
.gkd-legend span{display:inline-flex;align-items:center;gap:6px}
.gkd-sw{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}

svg.gkd-chart{display:block;width:100%;height:auto;overflow:visible}
svg.gkd-chart text{font-family:var(--font);font-size:14px;fill:var(--ink-2)}
svg.gkd-chart .ax{stroke:var(--line);stroke-width:1}
svg.gkd-chart .base{stroke:var(--line-2);stroke-width:1}
svg.gkd-chart .hit{fill:transparent;cursor:default}
svg.gkd-chart .lbl{fill:var(--ink);font-weight:600}

.gkd-tbl{width:100%;border-collapse:collapse;font-size:14px}
.gkd-tbl th{font-weight:600;color:var(--ink-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;position:sticky;top:0;background:var(--bg)}
.gkd-tbl td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.gkd-tbl td.n,.gkd-tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.gkd-tbl td.wrap{white-space:normal;min-width:180px}
.gkd-tbl tr.click{cursor:pointer}
.gkd-tbl tr.click:hover td{background:var(--panel)}
.gkd-arrow{color:var(--ink-3);padding:0 6px}
.gkd-tag{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:0 7px;border-radius:5px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--ink);white-space:nowrap}
.gkd-tag .gkd-sw{width:8px;height:8px}
.gkd-dim{color:var(--ink-3)}

.gkd-strip{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:1240px;margin:0 auto 14px}
.gkd-strip div{flex:1;min-width:150px;padding:8px 14px;border-left:1px solid var(--line)}
.gkd-strip div:first-child{border-left:0}
.gkd-strip small{display:block;font-size:14px;color:var(--ink-3)}
.gkd-strip b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.gkd-strip span{font-size:14px;color:var(--ink-3)}

.gkd-voice{background:var(--panel);border-radius:10px;padding:10px 14px;font-size:15px;line-height:1.8;min-width:0;overflow-wrap:anywhere}
.gkd-voice .h{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink-3);margin-bottom:2px}
.gkd-voice mark{background:var(--mark);color:inherit;box-shadow:inset 0 -2px 0 var(--ink);padding:0 1px}
.gkd-twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gkd-clues{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gkd-facts{max-height:236px;overflow:auto}
.gkd-fact{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.gkd-fact time{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.gkd-fact small{display:block;font-size:14px;color:var(--ink-3)}
.gkd-tb{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.gkd-tb time{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.gkd-tb .gkd-tbflow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.gkd-tb small{display:block;font-size:14px;color:var(--ink-3)}
.gkd-tboxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:4px 0}
.gkd-tbox{border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;min-width:0}
.gkd-tbox b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gkd-tbox span{display:block;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.gkd-empty{max-width:640px;margin:40px auto;text-align:center;color:var(--ink-2)}

.gkd-dlg{position:fixed;inset:0;z-index:96;background:rgba(20,20,19,.28);display:flex;align-items:center;justify-content:center;padding:16px}
.gkd-dlg > div{background:var(--bg);border-radius:12px;max-width:760px;width:100%;max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.gkd-dlg header{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line)}
.gkd-dlg header h2{margin:0;font-size:16px}
.gkd-dlg .body{overflow:auto;padding:8px 16px 14px}

#gkd-tip{white-space:pre-line;position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:14px;line-height:1.5;padding:6px 10px;border-radius:6px;max-width:260px;z-index:97;box-shadow:0 4px 14px rgba(0,0,0,.18)}

@media (max-width:820px){
  .gkd-top{flex-wrap:wrap;height:auto;padding-block:6px}
  .gkd-apptabs{margin-left:0;flex-wrap:wrap}
  .gkd-tabs{flex-wrap:wrap}
  .gkd-ctl{margin-left:0;flex-wrap:wrap}
  .gkd-bar{flex-wrap:wrap;height:auto;padding-block:6px}
  .gkd-grid,.gkd-grid.w3,.gkd-twin{grid-template-columns:1fr}
}
</style>

<div class="gkd" id="gkd-root" hidden>

      <svg class="gkd-mark" viewBox="0 0 26 26" aria-hidden="true"><circle cx="10" cy="13" r="7.5" style="fill:none;stroke:var(--accent);stroke-width:2.4"/><circle cx="16" cy="13" r="7.5" style="fill:none;stroke:var(--k2);stroke-width:2.4"/></svg>
      <h1>学級会アプリ</h1>
    </div>
    <span class="gkd-meta" id="gkd-meta"></span>

    <nav class="gkd-tabs" role="tablist" aria-label="ダッシュボードの面">

      <button type="button" role="tab" data-gkd-tab="hitori" aria-selected="false">ひとり</button>
      <button type="button" role="tab" data-gkd-tab="ichiran" aria-selected="false">変容の一覧</button>

    <div class="gkd-ctl" id="gkd-ctl"></div>

  <main class="gkd-main gkd-pad" id="gkd-main"></main>
  <div id="gkd-tip" role="status" hidden></div>
  <div class="gkd-dlg" id="gkd-dlg" hidden></div>
</div>

<script>
(function () {
  var COLORS = { kata: ['--k1', '--k2', '--k3', '--k4'], omoi: ['--o1', '--o2', '--o3'], haba: ['--w0', '--w1', '--w2', '--w3'] };
  var ST = { tab: 'gakkyu', idx: 0, tv: {}, hide: false, data: null, loading: false, onNav: null };
  var root, GW = 470, FW = 900, GH = 190;

  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function col(v) { return 'var(' + v + ')'; }
  function D() { return ST.data && ST.data['変容']; }
  function cats(field) {
    var list = (D() && D().cats[field]) || [];
    return list.map(function (c, i) { return { k: c.k, n: c.n, c: COLORS[field][i] || '--ink-3' }; });
  }
  function catOf(field, k) { return cats(field).filter(function (c) { return String(c.k) === String(k); })[0]; }
  function kaiNos() { return (D() ? D().kai : []).map(function (k) { return k['回']; }); }
  function md(s) { var m = String(s || '').match(/^[0-9]{4}-([0-9]{2})-([0-9]{2})/); return m ? (+m[1]) + '/' + (+m[2]) : ''; }
  /* 会の型(ふつう/プロジェクト型)の札。型によしあしは付けない */
  function kataOf(no) { var k = (D().kai || []).filter(function (x) { return x['回'] === no; })[0]; return k && k['会の型'] ? k['会の型'] : ''; }
  function kaiLabel(no) { var t = kataOf(no); return '第' + no + '回' + (t ? '（' + t + '）' : ''); }
  function dateOf(no) { var k = (D().kai || []).filter(function (x) { return x['回'] === no; })[0]; return k ? md(k['実施日']) : ''; }
  function kids() { return D() ? D().children : []; }
  function nameOf(ch) { return ST.hide ? '' : (ch['表示名'] || ''); }
  function rec(ch, k) { var c = ch.per[k]; return c && c.has ? c : null; }
  function vals(ch, field) { return kaiNos().map(function (k) { return ch.per[k] ? ch.per[k][field] : null; }).filter(function (v) { return v != null; }); }

  /* ===== グラフの部品(SVG・1単位＝だいたい1px)。色は style で渡す(SVGの属性に var() は効かない端末がある) ===== */
  function legend(cs) { return '<div class="gkd-legend">' + cs.map(function (c) { return '<span><span class="gkd-sw" style="background:' + col(c.c) + '"></span>' + esc(c.n) + '</span>'; }).join('') + '</div>'; }
  function stackCols(field, unitLabel) {
    var cs = cats(field), ks = kaiNos(), dist = D().dist[field];
    var W = GW, H = GH, L = 40, R = 110, T = 6, B = 26, cw = (W - L - R) / Math.max(1, ks.length), bw = Math.max(8, Math.min(34, cw - 14));
    var s = '<svg class="gkd-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(unitLabel) + 'の回ごとの分かれ方">';
    [0, 50, 100].forEach(function (p) { var y = T + (H - T - B) * (1 - p / 100); s += '<line class="ax" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 5) + '" text-anchor="end">' + p + '%</text>'; });
    ks.forEach(function (k, i) {
      var d = dist[k], x = L + i * cw + (cw - bw) / 2, y = H - B, last = i === ks.length - 1;
      if (d.n) cs.forEach(function (c, ci) {
        var v = d.o[c.k], h = (H - T - B) * v / d.n; if (!v) return;
        var top = y - h;
        s += '<rect x="' + x + '" y="' + (top + 1) + '" width="' + bw + '" height="' + Math.max(0, h - 2) + '" rx="' + (ci === cs.length - 1 || top < T + 1 ? 3 : 1) + '" style="fill:' + col(c.c) + '"/>';
        s += '<rect class="hit" x="' + (x - 4) + '" y="' + top + '" width="' + (bw + 8) + '" height="' + h + '" data-tip="' + esc(kaiLabel(k)) + ' · ' + esc(c.n) + '&#10;' + v + '人（' + Math.round(v / d.n * 100) + '%）"/>';
        if (last && h > 15) s += '<text class="lbl" x="' + (x + bw + 8) + '" y="' + (top + h / 2 + 5) + '">' + esc(c.n.slice(0, 6)) + ' ' + v + '</text>';
        y = top;
      });
      else s += '<text x="' + (x + bw / 2) + '" y="' + (H - B - 8) + '" text-anchor="middle" style="fill:var(--ink-3)">—</text>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">第' + k + '回</text>';
    });
    return s + '</svg>';
  }
  function stackTable(field) {
    var cs = cats(field), ks = kaiNos(), dist = D().dist[field];
    var h = '<div style="overflow:auto"><table class="gkd-tbl"><thead><tr><th></th>' + ks.map(function (k) { return '<th class="n">第' + k + '回</th>'; }).join('') + '</tr></thead><tbody>';
    cs.forEach(function (c) { h += '<tr><td>' + esc(c.n) + '</td>' + ks.map(function (k) { return '<td class="n">' + dist[k].o[c.k] + '</td>'; }).join('') + '</tr>'; });
    return h + '<tr><td>記録のある子</td>' + ks.map(function (k) { return '<td class="n">' + dist[k].n + '</td>'; }).join('') + '</tr></tbody></table></div>';
  }
  function clueMultiples() {
    var names = D().clues, ks = kaiNos(), N = Math.max(1, kids().length);
    if (!names.length) return '<p class="gkd-note">設定に「手がかりの語」がまだありません。語を入れると、ここに出ます。</p>';
    var W = GW, H = Math.max(120, Math.round(GH * 0.8)), cell = W / names.length, s = '<svg class="gkd-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ことばの手がかりが出た子の数の移り">';
    names.forEach(function (nm, ci) {
      var x0 = ci * cell + 8, x1 = (ci + 1) * cell - 10, y0 = 34, y1 = H - 26, pts = [];
      s += '<text x="' + x0 + '" y="16" class="lbl">' + esc(nm.slice(0, 7)) + '</text>';
      s += '<line class="base" x1="' + x0 + '" x2="' + x1 + '" y1="' + y1 + '" y2="' + y1 + '"/>';
      ks.forEach(function (k, i) {
        var n = D().clueSeries[nm][k] || 0;
        pts.push([ks.length > 1 ? x0 + (x1 - x0) * i / (ks.length - 1) : (x0 + x1) / 2, y1 - (y1 - y0) * n / N, n, k]);
      });
      s += '<polyline points="' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ') + '" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>';
      pts.forEach(function (p, i) {
        if (i === pts.length - 1) s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" style="fill:var(--accent);stroke:#fff;stroke-width:2"/><text x="' + p[0] + '" y="' + (p[1] - 9) + '" text-anchor="end" class="lbl">' + p[2] + '人</text>';
        s += '<rect class="hit" x="' + (p[0] - 9) + '" y="' + y0 + '" width="18" height="' + (y1 - y0) + '" data-tip="' + esc(nm) + ' · 第' + p[3] + '回&#10;' + p[2] + '人の振り返りに出た"/>';
      });
      if (ks.length) s += '<text x="' + x0 + '" y="' + (H - 6) + '">第' + ks[0] + '回</text><text x="' + x1 + '" y="' + (H - 6) + '" text-anchor="end">第' + ks[ks.length - 1] + '回</text>';
    });
    return s + '</svg>';
  }
  function clueTable() {
    var names = D().clues, ks = kaiNos();
    if (!names.length) return '';
    var h = '<div style="overflow:auto"><table class="gkd-tbl"><thead><tr><th></th>' + ks.map(function (k) { return '<th class="n">第' + k + '回</th>'; }).join('') + '</tr></thead><tbody>';
    names.forEach(function (nm) { h += '<tr><td>' + esc(nm) + '</td>' + ks.map(function (k) { return '<td class="n">' + (D().clueSeries[nm][k] || 0) + '</td>'; }).join('') + '</tr>'; });
    return h + '</tbody></table></div>';
  }
  function band100(parts, cs) {
    var tot = parts.reduce(function (a, b) { return a + b; }, 0) || 1, x = 0, s = '<svg class="gkd-chart" viewBox="0 0 300 18" preserveAspectRatio="none" style="height:14px" aria-hidden="true">';
    parts.forEach(function (v, i) { var w = 300 * v / tot; if (v) s += '<rect x="' + (x + 1) + '" y="0" width="' + Math.max(0, w - 2) + '" height="18" rx="2" style="fill:' + col(cs[i].c) + '"/>'; x += w; });
    return s + '</svg>';
  }
  function matrix(field, title) {
    var cs = cats(field), m = D().trans[field].m;
    var max = Math.max.apply(null, [1].concat(m.map(function (r) { return Math.max.apply(null, r); })));
    var cs2 = 52, L = 92, T = 40, W = L + cs2 * cs.length + 4, H = T + cs2 * cs.length + 6;
    var s = '<svg class="gkd-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(title) + '" style="max-width:' + W + 'px">';
    s += '<text x="' + (L + cs2 * cs.length / 2) + '" y="13" text-anchor="middle">今（いちばん新しい回）→</text>';
    cs.forEach(function (c, j) { s += '<text x="' + (L + j * cs2 + cs2 / 2) + '" y="' + (T - 8) + '" text-anchor="middle">' + esc(c.n.slice(0, 4)) + '</text>'; });
    cs.forEach(function (c, i) {
      s += '<text x="' + (L - 8) + '" y="' + (T + i * cs2 + cs2 / 2 + 5) + '" text-anchor="end">' + esc(c.n.slice(0, 5)) + '</text>';
      cs.forEach(function (c2, j) {
        var v = m[i][j], lv = v === 0 ? 0 : Math.min(4, 1 + Math.floor(v / max * 3.99)), dark = lv >= 3;
        s += '<rect x="' + (L + j * cs2 + 1) + '" y="' + (T + i * cs2 + 1) + '" width="' + (cs2 - 2) + '" height="' + (cs2 - 2) + '" rx="4" style="fill:var(--hm' + lv + ')"/>';
        s += '<text x="' + (L + j * cs2 + cs2 / 2) + '" y="' + (T + i * cs2 + cs2 / 2 + 5) + '" text-anchor="middle" style="fill:' + (dark ? '#fff' : 'var(--ink)') + ';font-weight:600">' + v + '</text>';
        s += '<rect class="hit" x="' + (L + j * cs2) + '" y="' + (T + i * cs2) + '" width="' + cs2 + '" height="' + cs2 + '" data-tip="はじめ ' + esc(c.n) + ' → 今 ' + esc(c2.n) + '&#10;' + v + '人"/>';
      });
    });
    s += '<text x="6" y="' + (T + cs2 * cs.length / 2) + '" transform="rotate(-90 12 ' + (T + cs2 * cs.length / 2) + ')" text-anchor="middle">はじめ</text>';
    return s + '</svg>';
  }
  function lanes(ch) {
    var ks = kaiNos(), W = FW, L = 150, R = 16, T = 28, rowH = 46, rows = ['めあての型', '関わり', '宛先', '決まったことへの思い', 'よさ'], H = T + rowH * rows.length + 4;
    var cw = (W - L - R) / Math.max(1, ks.length);

      return '<span>' + label + '：<span class="gkd-tag">' + esc(x.name) + '</span></span>' + (x.wake ? '<small>' + wakeLabel + '：' + esc(x.wake) + '</small>' : '');
    }
    var anyVote = items.some(function (it) { return it.t.tohyo && it.t.tohyo.length; });
    return '<section class="gkd-sec span"><div class="gkd-sh"><h2>' + (anyVote ? '投票と立場のうつりかわり' : '立場のうつりかわり') + '</h2><p>ツムゴロウで出したもの（' + (anyVote ? '投票 → ' : '') + 'じぜん → 話し合い）</p></div>' +
      items.map(function (it) {
        var t = it.t, h = t.hanashiai;
        var vote = t.tohyo && t.tohyo.length ? '<span>投票：' + t.tohyo.map(function (p) { return '<span class="gkd-tag">' + esc(p.name) + '</span>'; }).join(' ') + '</span><span class="gkd-arrow">→</span>' : '';
        var kae = h && h.kaeta === true ? 'かえた' : h && h.kaeta === false ? 'かえなかった' : '';
        return '<div class="gkd-tb"><time>第' + it.k + '回' + (kataOf(it.k) ? '<small>' + esc(kataOf(it.k)) + '</small>' : '') + '<small>' + esc(t.title) + '</small></time><div>' +
          '<div class="gkd-tbflow">' + vote + part('じぜん', t.jizen, 'わけ') + '<span class="gkd-arrow">→</span>' + part('話し合い', h, kae ? kae + 'わけ' : 'わけ') + (kae && !(h && h.wake) ? '<span class="gkd-dim">（' + kae + '）</span>' : '') + '</div>' +
          (t.yoi ? '<small>ほかの案のよい所：' + esc(t.yoi) + '</small>' : '') + '</div></div>';
      }).join('') +
      '<p class="gkd-note">' + (anyVote ? '投票は、よい案をえらべたかを見るものではありません。' : '') + '立場をかえたことに、よい・わるいはありません。かえなかったことも、その子の大事な考えです。</p></section>';
  }
  function emptyView(msg) { return '<div class="gkd-empty"><p>' + esc(msg) + '</p></div>'; }

  /* ===== 読みこみ・知らせ ===== */
  function showAlert() {
    var el = $('gkd-alert'), info = ST.data && ST.data['読み込み'];
    var h = '';
    if (info && info.ok === false && info['わけ']) {
      el.className = 'gkd-alert gkd-pad';
      h = '<b>ツムゴロウの記録を読めませんでした。</b><span>' + esc(info['わけ']) + '</span>';
    }
    el.innerHTML = h; el.hidden = !h;
  }
  function openUnlinked() {
    var un = D().unlinked, dlg = $('gkd-dlg');
    dlg.innerHTML = '<div role="dialog" aria-modal="true" aria-label="つなげなかった記録"><header><h2>つなげなかった記録</h2><span class="gkd-sp"></span><button type="button" class="gkd-pill" data-gkd-close>閉じる</button></header><div class="body">' +
      '<p class="gkd-note">名簿に組・番号を入れる、または議題マスタに回を入れると、次に開いたときに結ばれます。</p>' +
      '<table class="gkd-tbl"><thead><tr><th class="n">組</th><th class="n">番号</th><th class="n">回</th><th>種類</th><th>わけ</th><th>中身（はじめの字）</th></tr></thead><tbody>' +
      un.map(function (u) { return '<tr><td class="n">' + esc(u['組']) + '</td><td class="n">' + esc(u['番号']) + '</td><td class="n">' + esc(u['回']) + '</td><td>' + esc(u['種類']) + '</td><td>' + esc(u['わけ']) + '</td><td class="wrap">' + esc(String(u['本文'] || '').slice(0, 40)) + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
    dlg.hidden = false;
    var b = dlg.querySelector('[data-gkd-close]'); if (b) b.focus();
  }
  function load(fn) {
    ST.loading = true; if (ST.data) draw();
    else { $('gkd-ctl').innerHTML = '<span>読んでいます…</span>'; $('gkd-main').innerHTML = ''; }
    var run = window.google && google.script && google.script.run;
    if (!run) { ST.loading = false; fail({ message: 'サーバにつながりません。' }); return; }
    run.withSuccessHandler(function (d) {
      ST.loading = false;
      if (!d || !d['変容']) { fail({ message: '返事が空でした。もう一度開いてください。' }); return; }
      ST.data = d; draw();
    }).withFailureHandler(function (e) { ST.loading = false; fail(e); })[fn]();
  }
  function fail(e) {
    var el = $('gkd-alert');
    el.className = 'gkd-alert gkd-pad';
    el.innerHTML = '<b>読みこめませんでした。</b><span>' + esc(e && e.message || e) + '</span><span class="gkd-sp"></span><button type="button" class="gkd-pill" data-gkd-retry>もう一度</button>';
    el.hidden = false;
    if (ST.data) draw(true);
  }

  /* ===== 描く ===== */
  function measure() {
    var m = $('gkd-main'), cs = getComputedStyle(m);
    var inner = Math.min(1240, m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
    FW = Math.max(300, Math.floor(inner));
    var narrow = innerWidth <= 820;
    GW = narrow ? FW : Math.max(300, Math.floor((inner - 20) / 2));
    // 学級の歩み:2段のグラフが main の高さに収まるように棒の高さを決める(PCでスクロールさせない)。
    // 高さが足りない画面(先生のPC 約1000×570)は、4つの数字を1行にし、ことわりの文も1行にする(ST.compact)
    ST.compact = !narrow && m.clientHeight < 720;
    var avail = ST.compact
      ? m.clientHeight - 28 - 34 - 14 - 2 * (9 + 46 + 28)
      : m.clientHeight - 28 - 30 - 74 - 14 - 2 * (44 + 26 + 30);
    GH = narrow ? 190 : Math.max(ST.compact ? 100 : 140, Math.min(190, Math.floor(avail / 2)));
  }
  function draw(keepAlert) {
    if (!ST.data) return;
    if (tip) tip.hidden = true;
    measure();
    var ks = kaiNos(), meta = ST.data['学級'] || '';
    if (ks.length) meta += (meta ? ' · ' : '') + '第' + ks[0] + '回〜第' + ks[ks.length - 1] + '回';
    $('gkd-meta').textContent = meta;
    root.querySelectorAll('[data-gkd-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-gkd-tab') === ST.tab)); });
    if (!keepAlert) showAlert();
    if (!ks.length && ST.tab !== 'hyoka') {
      $('gkd-ctl').innerHTML = readBtn();
      $('gkd-main').innerHTML = emptyView('議題マスタに「回」のある会ができると、ここに出ます。');
      return;
    }
    $('gkd-main').innerHTML = VIEW[ST.tab]();
    // 学級の歩み(PC):描いてから測り、はみ出した分だけグラフを低くして1回だけ描き直す
    if (ST.tab === 'gakkyu' && innerWidth > 820) {
      var m = $('gkd-main'), secs = m.querySelectorAll('.gkd-grid > .gkd-sec'), floor = ST.compact ? 90 : 120;
      if (secs.length >= 4) {
        var over = secs[3].getBoundingClientRect().bottom - (m.getBoundingClientRect().bottom - 8);
        if (over > 0 && GH > floor) { GH = Math.max(floor, GH - Math.ceil(over / 2)); m.innerHTML = VIEW[ST.tab](); }
      }
    }
  }

  /* ===== 押す ===== */
  function onClick(e) {
    var t = e.target.closest ? e.target : e.target.parentNode;
    var b;
    if ((b = t.closest('[data-gkd-tab]'))) { ST.tab = b.getAttribute('data-gkd-tab'); $('gkd-main').scrollTop = 0; draw(); return; }
    if ((b = t.closest('[data-gkd-tv]'))) { var id = b.getAttribute('data-gkd-tv'); ST.tv[id] = !ST.tv[id]; draw(); return; }
    if ((b = t.closest('[data-gkd-nav]'))) { var n = kids().length; ST.idx = (ST.idx + (+b.getAttribute('data-gkd-nav')) + n) % n; draw(); return; }
    if ((b = t.closest('tr[data-gkd-idx]'))) { ST.idx = +b.getAttribute('data-gkd-idx'); ST.tab = 'hitori'; $('gkd-main').scrollTop = 0; draw(); return; }
    if (t.closest('[data-gkd-hide]')) { ST.hide = !ST.hide; draw(); return; }
    if (t.closest('[data-gkd-read]')) { if (!ST.loading) load('readBridge'); return; }
    if (t.closest('[data-gkd-retry]')) { load(ST.data ? 'readBridge' : 'getDashboard'); return; }
    if (t.closest('[data-gkd-unlinked]')) { openUnlinked(); return; }
    if (t.closest('[data-gkd-close]') || t.id === 'gkd-dlg') { $('gkd-dlg').hidden = true; return; }
    if ((b = t.closest('[data-gkd-app]'))) { var k = b.getAttribute('data-gkd-app'); if (k !== 'dashboard' && ST.onNav) { close(); ST.onNav(k); } return; }
  }
  var tip;
  function showTip(e) {
    var h = e.target.closest && e.target.closest('[data-tip]');
    if (!h || !root.contains(h)) { tip.hidden = true; return; }
    tip.textContent = h.getAttribute('data-tip'); tip.hidden = false;
    var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, hh = tip.offsetHeight;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y + hh > innerHeight - 8) y = e.clientY - hh - 14;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  }

  var wired = false, rz;
  function wire() {
    if (wired) return; wired = true;
    root = $('gkd-root'); tip = $('gkd-tip');
    root.addEventListener('click', onClick);
    root.addEventListener('pointermove', showTip);
    root.addEventListener('pointerdown', showTip);
    root.addEventListener('pointerleave', function () { tip.hidden = true; });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('gkd-dlg').hidden) $('gkd-dlg').hidden = true; });
    addEventListener('resize', function () { if (root.hidden) return; clearTimeout(rz); rz = setTimeout(function () { draw(true); }, 150); });
  }
  function open(opts) {
    opts = opts || {};
    wire();
    ST.onNav = opts.onNav || null;
    if (opts.tab) ST.tab = opts.tab;
    root.hidden = false;
    load('getDashboard');
  }
  function close() { if (root) root.hidden = true; }

  /**
   * 振り返りの画面の「この会の子どもたち」(2026-10-22 先生「ダッシュボードに合わせて」)。
   * 学級の歩みと同じ分け方・同じ色・同じ名前で、その1回だけを出す。何人のうちかを必ず書く。
   */
  function kaiHtml(data, gidaiId) {
    var keep = ST.data; ST.data = data;
    try {
      var d = D(); if (!d) return '<p class="gkd-note">まだ記録がありません。</p>';
      var kk = (d.kai || []).filter(function (k) { return k['議題ID'] === gidaiId; })[0];
      if (!kk) return '<p class="gkd-note">この会の子どもの記録は、まだ届いていません。</p>';
      var no = kk['回'], N = kids().length;
      var rows = [['kata', 'めあての型', 'ツムゴロウでめあてをえらんだ子'], ['haba', '関わり', '会話分析で見取った発言のある子'], ['omoi', '決まったことへの思い', '会のあとに答えた子']].map(function (f) {
        var x = d.dist[f[0]][no] || { o: {}, n: 0 }, cs = cats(f[0]);
        return '<div class="gkd-kai"><div class="gkd-kai-h"><b>' + f[1] + '</b><span>' + f[2] + ' <b class="gkd-num">' + x.n + '</b>人のうち（' + N + '人中）</span></div>' +
          (x.n ? band100(cs.map(function (c) { return x.o[c.k] || 0; }), cs) : '<div class="gkd-dim">記録がありません</div>') +
          '<div class="gkd-legend">' + cs.map(function (c) { return '<span><span class="gkd-sw" style="background:' + col(c.c) + '"></span>' + esc(c.n) + ' <b class="gkd-num">' + (x.o[c.k] || 0) + '</b>人</span>'; }).join('') + '</div></div>';
      }).join('');
      var mada = (d.dist.mada[no] || []).length;
      return '<div class="gkd gkd-inline">' + rows +
        '<p class="gkd-note">振り返りがまだの子 <b class="gkd-num">' + mada + '</b>人。型・関わり・思いに上下はありません。</p></div>';
    } finally { ST.data = keep; }
  }

  window.GkDashboard = { open: open, close: close, kaiHtml: kaiHtml };
})();
</script>

<script>
/* js_core.html — 起動・状態・ルーティング・google.script.run ラッパ・再送キューの土台。
   localStorageは使わない(仕様4)。状態はすべてメモリ内。
   画面の描画本体は js_kaigi が担う(学級会アプリは学級会だけ)。 */

var App = {
  screen: 'boot',             // 'boot' | 'home' | 'lesson'
  home: null,                 // getHomeBoot の結果
  boot: null,                 // getLessonBoot の結果(授業中の参照データ)
  ctx: {},                    // { className, unitId, lessonNo, 本時ID }
  mode: 'individual',         // 'individual' | 'batch:◎' | 'batch:○' | 'batch:△'
  activeKanten: null,         // 重点観点が2つのとき、今入力中の観点
  view: 'num',                // 'num' | 'seat'
  onlyUnrated: false,
  sel: 0,                     // キーボード選択中の児童index
  eval: {},                   // { 児童ID: { 観点: {評価,記録ID,記録日時,メモ} } } 楽観的に即更新
  queue: [],                  // 未確定の送信 [{op, payload, tries, nextAt}]
  sending: false,
};

/* --- 基盤プリミティブ --- */

function $(sel, root) { return (root || document).querySelector(sel); }
function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// RFC4122風UUID(記録IDに使う。再送の冪等キー)。
function uuid() {
  if (window.crypto && crypto.getRandomValues) {
    var b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); });
    return h.slice(0, 4).join('') + '-' + h.slice(4, 6).join('') + '-' +
           h.slice(6, 8).join('') + '-' + h.slice(8, 10).join('') + '-' + h.slice(10, 16).join('');
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16);
  });
}

// タップ時刻を 'YYYY-MM-DD HH:mm:ss'(ローカル)で。記録日時の権威(設計05 §4/§5)。
function nowLocal() {
  var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
         p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

// google.script.run を Promise 化した薄いラッパ。
function callServer(fnName /*, ...args */) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        // ★読み込み(get…)の答えが空(null)= サーバの戻り値に Date などが混じって google.script.run が捨てた(2026-10-07 南陽小)。
        //   get… の関数は null を返さないので、ここで分かる言葉にして知らせる(「読み込めない」だけにしない)。
        if (r === null && /^get/.test(fnName)) {
          reject(new Error('サーバからデータを受け取れませんでした(' + fnName + ')。スプレッドシートの日付のセルが原因のことがあります。もう一度開いても同じなら、この文を伝えてください。'));
          return;
        }
        resolve(r);
      })
      .withFailureHandler(function (e) { reject(e); })
      [fnName].apply(null, args);
  });
}

// CSV文字列をファイルとしてダウンロード(UTF-8 BOM付きでExcel文字化け回避)。
function downloadCsv(filename, text) {
  var blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

// 任意テキストをファイルとしてダウンロード(BOMなし。JSON等の機械読み取り用)。
function downloadText(filename, text, mime) {
  var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

// クリップボードへコピー(execCommandフォールバック付き)。成功時 true。
function copyTextToClipboard(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

// 記号→CSSクラス接尾辞。◎good ○ok △need。
function symClass(sym) {
  var syms = (App.boot && App.boot['設定']['記号']) || ['◎', '○', '△'];
  if (sym === syms[0]) return 'good';
  if (sym === syms[1]) return 'ok';
  if (sym === syms[2]) return 'need';
  return '';
}

/* --- 再送キュー(設計05 §4 評価保存の非同期・失敗時再送) --- */

function enqueue(op, payload) {
  App.queue.push({ op: op, payload: payload, tries: 0, nextAt: 0 });
  renderQueueBadge();
  flushQueue();
}

function flushQueue() {
  if (App.sending || App.queue.length === 0) return;
  var job = App.queue[0];
  if (Date.now() < job.nextAt) { setTimeout(flushQueue, job.nextAt - Date.now()); return; }
  App.sending = true;
  var FN = { append: 'appendRecord', cancel: 'cancelRecord', speech: 'appendSpeech', speechCancel: 'cancelSpeech', speechMemo: 'updateSpeechMemo', yosa: 'appendYosa', yosaMemo: 'updateYosaMemo', yosaCancel: 'cancelYosa', mitori: 'saveMitori' };
  var fn = FN[job.op] || 'appendRecord';
  callServer(fn, job.payload).then(function () {
    App.queue.shift();
    App.sending = false;
    renderQueueBadge();
    flushQueue();
  }).catch(function () {
    job.tries++;
    job.nextAt = Date.now() + Math.min(15000, 500 * Math.pow(2, job.tries)); // 指数バックオフ上限15s
    App.sending = false;
    renderQueueBadge();
    setTimeout(flushQueue, Math.max(0, job.nextAt - Date.now()));
  });
}

/* 未送信の記録がすべてサーバに届くまで待つ。
   [会を終える]→自動評価のように「記録が全部入ってから走らせたい」処理の前に使う。
   maxMs を過ぎても残っていたら false で返す(授業を止めないので待ち続けない)。 */
function waitForQueue(maxMs) {
  var deadline = Date.now() + (maxMs || 8000);
  return new Promise(function (resolve) {
    (function tick() {
      if (App.queue.length === 0 && !App.sending) return resolve(true);
      if (Date.now() > deadline) return resolve(false);
      flushQueue();
      setTimeout(tick, 150);
    })();
  });
}

function renderQueueBadge() {
  // ライブ画面は実況バーにも「！未送信 n件」を出す(20 §10 / 21 §7 3モード共通)
  if (App.screen === 'kaigi_live' && typeof renderLastRec === 'function') renderLastRec();
  var el0 = document.getElementById('queue-badge');
  if (!el0) return;
  if (App.queue.length > 0) {
    App._hadQueue = true;
    el0.classList.remove('hidden', 'queue-badge--saved');
    el0.textContent = '未保存 ' + App.queue.length + '件 — 自動で再送します';
    return;
  }
  // 空: 直前まで滞留があった場合のみ「すべて保存済み」を2秒
  if (App._hadQueue) {
    App._hadQueue = false;
    el0.classList.remove('hidden'); el0.classList.add('queue-badge--saved');
    el0.textContent = 'すべて保存済み';
    clearTimeout(App._savedTimer);
    App._savedTimer = setTimeout(function () { el0.classList.add('hidden'); }, 2000);
  } else {
    el0.classList.add('hidden');
  }
}

// 現在モードを body[data-mode] に反映(§7 アクセント色切替)。
function setBodyMode(m) { document.body.setAttribute('data-mode', m || ''); }

/* --- 共通ナビ部品(§4.11)。全作業画面のヘッダー左端に置く ⌂ホームピル。
   無ラベル「←」は使わない。label省略時は「ホーム」。 --- */
function homePillHtml(onclick, label) {
  return '<button class="homebtn" title="' + escapeHtml(label || 'ホーム') + 'へ(H)" onclick="' + onclick + '">' +
    '<span class="ic">⌂</span>' + escapeHtml(label || 'ホーム') + '<span class="key">H</span></button>';
}

/* --- 印刷ビュー(08 §10 / docs/印刷モック.html)。紙をデスクに並べ、⌘P で印刷。
   papersHtml = 「.paper …」の配列。returnFn = 「閉じる」で戻る画面の再描画関数。 --- */
function openPrintDesk(papersHtml, returnFn, hint) {
  App._printReturn = returnFn;
  document.getElementById('app').innerHTML =
    '<div class="print-toolbar no-print">' +
      '<button class="pbtn-print" onclick="window.print()">印刷する</button>' +
      '<button class="pbtn-close" onclick="closePrintDesk()">閉じる</button>' +
      '<span>' + escapeHtml(hint || '⌘P / Ctrl+P で印刷プレビュー。白黒コピーでも読めます。') + '</span>' +
    '</div>' +
    '<div class="desk">' + papersHtml.join('') + '</div>';
}
function closePrintDesk() { var f = App._printReturn; App._printReturn = null; if (typeof f === 'function') f(); else goHome(); }
// ミトリの小ワードマーク(印刷右下)。日付を必ず入れる。
function printBrand(dateStr) {
  return '<span class="brand">出力: <b>学級会アプリ</b> ' + escapeHtml(dateStr || todayISO()) + '</span>';
}
function todayISO() { var d = new Date(), p = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }

// 未送信があるまま離脱しようとしたら警告(仕様4)。
window.addEventListener('beforeunload', function (e) {
  if (App.queue.length > 0) { e.preventDefault(); e.returnValue = ''; }
});

/* --- ルーティング --- */

/* 学級会アプリは学級会だけ。ホーム＝学級会のホーム(js_kaigi の goKaigi)。
   ほかの画面から「ホームへ」「タイトルへ」と呼ばれても、ここへ来る。 */
function goHome() { goKaigi(); }
function goTitle() { goKaigi(); }
/* 重ね画面(シート)を閉じる。js_lesson から移した(学級会の画面も使う) */
function closeOverlay() { var o = document.getElementById('overlay'); if (o) o.remove(); }

function setSplash(msg) {
  document.getElementById('app').innerHTML =
    '<div class="splash"><div class="splash__logo">学級会アプリ</div><div class="splash__msg">' +
    escapeHtml(msg) + '</div></div>';
}

function showBootError(e) {
  var msg = (e && e.message) ? e.message : '読み込みに失敗しました。';
  document.getElementById('app').innerHTML =
    '<div class="splash"><div class="splash__logo">学級会アプリ</div>' +
    '<div class="splash__msg">' + escapeHtml(msg) + '</div>' +
    '<button class="btn btn--primary" onclick="goHome()">再読み込み</button></div>';
}

/* --- 右上の時計(常時表示) ---
   授業中に「いま何時何分何秒か」をいつでも見られるように、画面によらず右上に固定で出す。
   秒まで出すのは、発言の記録時刻と黒板の時計を突き合わせるため。印刷・掲示には出さない。 */
function startClock() {
  var el0 = document.getElementById('clock');
  if (!el0) {
    el0 = document.createElement('div');
    el0.id = 'clock';
    el0.className = 'clock';
    el0.title = 'いまの時刻';
    document.body.appendChild(el0);
  }
  function tick() {
    var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
    el0.innerHTML = '<span class="clock__hm">' + p(d.getHours()) + ':' + p(d.getMinutes()) + '</span>' +
      '<span class="clock__s">:' + p(d.getSeconds()) + '</span>';
  }
  tick();
  if (App._clockTimer) clearInterval(App._clockTimer);
  App._clockTimer = setInterval(tick, 1000);
}

/* --- 起動 --- */
document.addEventListener('DOMContentLoaded', function () {
  startClock();
  goTitle();
});
</script>
