.resume { display:flex; align-items:center; gap:14px; background:var(--accent); color:#fff; border-radius:var(--r-xl); padding:14px 22px; font-weight:800; font-size:clamp(17px,1.9vw,21px); box-shadow:var(--shadow-1); transition:filter 120ms, transform 120ms; animation:rise 400ms 380ms cubic-bezier(.2,.7,.3,1) both; }
.resume:hover { filter:brightness(1.07); } .resume:active { transform:scale(.98); }
.resume__play { font-size:15px; background:rgba(255,255,255,.18); border-radius:var(--r-pill); padding:6px 12px; }
.resume__ctx { font-weight:600; font-size:.82em; opacity:.92; }

.doors { display:grid; grid-template-columns:repeat(4, minmax(150px, 210px)); gap:14px; width:min(96vw, 1120px); }
.door { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-2xl); padding:26px 22px 20px; text-align:left; box-shadow:var(--shadow-1); overflow:hidden; transition:transform 140ms, box-shadow 140ms, border-color 140ms; animation:rise 400ms cubic-bezier(.2,.7,.3,1) both; }
.door:nth-child(1){ animation-delay:440ms; } .door:nth-child(2){ animation-delay:500ms; } .door:nth-child(3){ animation-delay:560ms; } .door:nth-child(4){ animation-delay:620ms; }
.door::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--door-c, var(--gray-600)); }
.door:hover { transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:var(--door-c); }
.door:active { transform:translateY(-1px) scale(.99); }
.door--kokugo { --door-c:var(--blue-600); } .door--tokkatsu { --door-c:var(--violet-600); } .door--doutoku { --door-c:var(--rose-600); } .door--setting { --door-c:var(--gray-600); }
.door__key { position:absolute; top:12px; right:14px; font-size:12px; color:var(--ink-sub); border:1px solid var(--line); border-radius:6px; padding:1px 7px; background:var(--bg); }
.door__label { font-size:clamp(24px,2.8vw,30px); font-weight:800; letter-spacing:.06em; }
.door__label small { display:block; font-size:13px; font-weight:700; letter-spacing:.12em; color:var(--door-c); margin-bottom:6px; }
.door__desc { color:var(--ink-sub); font-size:14px; margin-top:8px; line-height:1.55; min-height:44px; }
.door__go { margin-top:10px; font-weight:800; color:var(--door-c); }
.foot { position:absolute; bottom:14px; width:100%; text-align:center; color:var(--ink-sub); font-size:12.5px; letter-spacing:.06em; }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation:none !important; transition:none !important; } }
@media (max-width:1080px) { .doors { grid-template-columns:repeat(2,1fr); width:min(94vw,560px); } }
@media (max-width:680px) { .doors { grid-template-columns:1fr 1fr; width:min(92vw,480px); } }
@media (max-width:460px) { .doors { grid-template-columns:1fr; width:min(92vw,420px); } .door__desc{ min-height:0; } }

/* ===== 学級会ホームの主導線(いますぐ始める / 続きを見取る) ===== */
.kstart { display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:var(--violet-50); border-color:var(--violet-100); }
.kstart__go { font-size:19px; padding:16px 30px; border-radius:var(--r-xl); }
.kstart__note { flex:1; min-width:240px; color:var(--ink-sub); line-height:1.7; font-size:14.5px; }

/* ============================================================
   学級会ライブ画面 UD再設計(設計19)。全画面レイヤ .kglive 配下に閉じる。
   トークンは08準拠・新設色なし。名前20px死守・タップ44px・0回バッジ無し。
   ============================================================ */
:root { --gray-700:#434A55; --tap:44px; }
.kglive { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); font-size:16px; }
.kglive .mode-line { height:4px; background:var(--violet-600); flex:0 0 auto; }
/* ① ヘッダー */
/* ★右端は固定時計(.clock = 幅99px + right12px)のぶんを必ず空ける。ここで padding をまとめて上書きすると
   基本形 .lhead の padding-right:110px が消えて、時計が『会の経過』や ⋯ に重なる(2026-08-27 修正)。 */
.kglive .lhead { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:4px 12px; padding-right:118px; background:var(--panel); border-bottom:1px solid var(--line); }
.kglive .ctx { color:var(--ink-sub); font-size:14px; white-space:nowrap; }
.kglive .unitname { height:var(--tap); padding:0 12px; border:1px dashed var(--violet-400); border-radius:var(--r-md); background:var(--violet-50); color:var(--violet-700); font-weight:700; font-size:16px; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kglive .spacer { flex:1; }
.kglive .stages { display:flex; gap:3px; background:var(--gray-100); padding:2px; border-radius:var(--r-pill); }
.kglive .stg { height:var(--tap); padding:0 14px; border-radius:var(--r-pill); font-weight:700; font-size:15px; color:var(--gray-700); display:flex; align-items:center; gap:5px; white-space:nowrap; }
.kglive .stg .num { font-size:13px; opacity:.8; }
.kglive .stg.done { color:var(--violet-700); }
.kglive .stg.done::after { content:"✓"; font-size:13px; }
.kglive .stg.on { background:var(--violet-600); color:#fff; box-shadow:var(--shadow-1); }
/* 会の経過(ヘッダー内)。★右上の固定時計 .clock とは別物。名前を .clock にすると
   .clock の position:fixed/top/right まで効いて、時計の真下に飛んで重なる。 */
.kglive .lclock { display:flex; flex-direction:column; align-items:flex-end; line-height:1.1; padding-left:8px; border-left:1px solid var(--line); min-width:80px; }
.kglive .lclock b { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
.kglive .lclock span { font-size:11px; color:var(--ink-sub); }
.kglive .iconbtn { width:44px; height:44px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--panel); font-size:19px; display:flex; align-items:center; justify-content:center; }
/* ② 実況バー */
.kglive .stagebar { flex:0 0 auto; display:flex; align-items:stretch; background:#2F3542; color:#fff; border-bottom:1px solid var(--line); min-height:54px; }
.kglive .sb-board { flex:0 0 auto; display:flex; align-items:center; padding:0 14px; font-size:13px; letter-spacing:.28em; color:#C6CCD8; border-right:1px solid #454C5C; }
.kglive .sb-now { flex:1; display:flex; align-items:center; gap:12px; padding:4px 14px; min-width:0; }
.kglive .sb-step { flex:0 0 auto; width:30px; height:30px; border-radius:var(--r-pill); background:#fff; color:#2F3542; font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; }
.kglive .sb-text { min-width:0; line-height:1.25; }
.kglive .sb-text b { display:block; font-size:21px; font-weight:800; letter-spacing:.02em; }
.kglive .sb-text small { display:block; font-size:13px; color:#C6CCD8; font-weight:400; }
.kglive .sb-chip { flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:var(--r-pill); background:#fff; color:var(--violet-700); font-weight:800; font-size:16px; }
.kglive .sb-chip.yosa { color:var(--teal-700); }
.kglive .sb-last { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:6px 12px; border-left:1px solid #454C5C; max-width:330px; }
.kglive .sb-last .txt { font-size:13.5px; line-height:1.3; color:#E4E8F0; min-width:0; }
.kglive .sb-last .txt b { color:#fff; font-size:15px; }
.kglive .sb-last .undo { height:38px; padding:0 12px; border:1px solid #7A8296; border-radius:var(--r-md); color:#fff; font-size:14px; font-weight:700; white-space:nowrap; }
.kglive .sb-last.empty .txt { color:#9AA3B4; }
/* ③ 本体 */
.kglive .body { flex:1; display:flex; gap:8px; padding:5px 8px; min-height:0; }
.kglive .hall { --seat-w:112px; --seat-h:74px; --seat-gap:6px; --side-cols:2;
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-xl); padding:7px;
  display:grid; gap:6px; min-width:0; min-height:0; overflow:hidden;
  grid-template-columns:max-content minmax(0,1fr) max-content; grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"shikai shikai shikai" "left mid right"; }
/* 向き「先生から見る」= ホールごと180°回し、【文字のあるものは全部】起こし直す。
   ★2026-08-27: .seat しか起こしていなかったので、司会帯の見出し(司会グループ／まだつながっていない○人)と
   めあての行だけが上下逆さまに出ていた。文字を持つ子要素は漏れなくここに並べる。 */
.kglive .hall--flip { transform:rotate(180deg); }
.kglive .hall--flip .seat,
.kglive .hall--flip .shikai-band .lab,
.kglive .hall--flip .meate,
.kglive .hall--flip .kzone-empty { transform:rotate(180deg); }
.kglive .zone-shikai { grid-area:shikai; }
.kglive .zone-left { grid-area:left; min-height:0; }
.kglive .zone-right { grid-area:right; min-height:0; }
/* 真ん中の列 = めあて(あれば上) + 正面(いつも下)。
   ★2026-08-27: justify-content:space-between だけに頼っていたので、めあてが無い会
   (＝1タップで始めて議題をあとから書く いまの主導線・docs/16)では子が1つになり、
   正面が上に張り付いて【コの字が崩れて】いた。正面に flex:1 を与えて必ず下端に置く。 */
.kglive .zone-mid { grid-area:mid; min-height:0; display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
.kglive .shikai-band { border:1px solid var(--violet-100); background:var(--violet-50); border-radius:var(--r-lg); padding:4px 8px 6px; }
.kglive .shikai-band .lab { font-size:12px; font-weight:700; color:var(--violet-700); display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.kglive .shikai-band .lab-sub { font-weight:400; color:var(--ink-sub); }
/* 司会も他の子と同じ形の縦カード。横ピルにすると回数バッジで名前が折り返す(名前20pxの縮小禁止が優先・20 §3) */
.kglive .shikai-seats { display:flex; gap:6px; flex-wrap:nowrap; justify-content:center; }
.kglive .shikai-seats .seat--sh { width:var(--seat-w); }
.kglive .shikai-seats .seat--sh .nm { white-space:nowrap; }
.kglive .sidecols { display:grid; grid-template-columns:repeat(var(--side-cols,2),max-content); gap:var(--seat-gap); align-content:start; }
.kglive .frontrows { flex:1 1 auto; display:flex; flex-wrap:wrap; gap:var(--seat-gap);
  align-items:flex-end; justify-content:center; align-content:flex-end; }
/* めあては1行固定(高さを座席サイズに依存させない=20 §2 の前提) */
.kglive .meate { text-align:center; color:var(--ink-sub); font-size:13.5px; padding:5px 8px;
  border:1px dashed var(--line); border-radius:var(--r-lg); margin:0 8px 6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.5; }
.kglive .meate b { color:var(--violet-700); }
/* 児童カード */
.kglive .seat { position:relative; width:var(--seat-w); min-height:var(--seat-h); border:2px solid var(--line); border-radius:var(--r-lg); background:var(--panel);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:5px 4px 4px;
  /* ★transition は「見た目だけ」に限る。all にすると min-height:var(--seat-h) がトランジションに巻き込まれ、
     fitHall が決めた座席の高さが当たらないまま既定の74pxで居座る(=1画面に収まらない)。20 §2 */
  transition:border-color 120ms ease-out, background-color 120ms ease-out, box-shadow 120ms ease-out; }
.kglive .seat .nm { font-size:20px; line-height:1.15; font-weight:700; letter-spacing:.01em; }
.kglive .seat .role { font-size:11.5px; font-weight:700; color:#fff; background:var(--violet-700); border-radius:var(--r-pill); padding:1px 8px; margin-bottom:2px; }
.kglive .seat .cnt { display:flex; gap:5px; margin-top:2px; }
.kglive .seat .b { font-size:12px; font-weight:800; border-radius:var(--r-pill); padding:0 7px; font-variant-numeric:tabular-nums; line-height:17px; }
.kglive .b--sp { background:var(--panel); color:var(--violet-700); box-shadow:inset 0 0 0 1.5px var(--violet-400); }
.kglive .b--yo { background:var(--panel); color:var(--teal-700); box-shadow:inset 0 0 0 1.5px var(--teal-600); }
.kglive .seat:hover { border-color:var(--violet-400); box-shadow:var(--shadow-1); }
.kglive .seat.hit { animation:kseatpop 140ms ease-out; }
@keyframes kseatpop { 0%{transform:scale(.97)} 100%{transform:scale(1)} }
/* 色=「発言(紫)か、よさ(深緑)か」/ 🔗=「つながり」。
   起点は地を塗り、相手は白地に枠だけ。色の濃淡だけでなく「塗りか枠か」でも分かる(白黒でも判別可・20 §6.2) */
.kglive .seat.speaker { border-width:3px; border-color:var(--violet-700); background:var(--violet-100); }
.kglive .seat.speaker--yo { border-color:var(--teal-700); background:var(--teal-100); }
.kglive .seat.target { border-width:3px; border-color:var(--violet-400); background:var(--panel); }
.kglive .seat.target--yo { border-color:var(--teal-600); background:var(--panel); }
.kglive .seat.sel { border-color:var(--violet-400); }
.kglive .seat .flag { position:absolute; top:-11px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:800; color:#fff; background:var(--violet-600); border-radius:var(--r-pill); padding:1px 8px; white-space:nowrap; }
.kglive .seat.speaker .flag { background:var(--violet-700); }
.kglive .seat.target .flag { background:var(--panel); color:var(--violet-700); box-shadow:inset 0 0 0 2px var(--violet-400); }
.kglive .seat.speaker--yo .flag { background:var(--teal-700); color:#fff; box-shadow:none; }
.kglive .seat.target--yo .flag { background:var(--panel); color:var(--teal-700); box-shadow:inset 0 0 0 2px var(--teal-600); }
/* ★囲みの反転(20 §7.1): 結びのある子を囲むと会の後半に全員が囲まれて意味を失う。
   逆に「まだ結びのない子」を点線にする。会が進むほど点線が減り、残った席が浮かび上がる。 */
.kglive .seat.nolink { border-style:dashed; border-color:var(--line); }
.kglive .seat.absent { opacity:.45; }
.kglive .seat.absent .flag { background:var(--gray-600); }
.kglive .seat.movable { cursor:grab; }
.kglive .kzone-empty { color:var(--ink-sub); font-size:12px; border:1px dashed var(--line); border-radius:var(--r-md); padding:8px; text-align:center; }
/* 席の保存を知らせる帯(記録の画面にもどってから数秒だけ出る・2026-08-27) */
.kglive .kp-saved { margin:6px 0 0; padding:8px 10px; border-radius:var(--r-md); background:var(--teal-100);
  color:var(--teal-700); font-size:13px; font-weight:700; line-height:1.5; }
.seat--ghost { position:fixed; z-index:60; pointer-events:none; opacity:.9; border:2px solid var(--violet-600); border-radius:var(--r-lg); background:var(--panel); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-2); font-weight:700; }
.kglive .seat--dragging { opacity:.35; }
.kglive .drop-hi { outline:3px solid var(--violet-400); outline-offset:1px; }
/* つながり線は座席の下に敷く(名前と回数バッジを隠さない) */
.kglive .link-svg { position:absolute; left:0; top:0; pointer-events:none; z-index:1; }
.kglive .seat { z-index:2; }
/* 司会帯の見出しの右: まだ結びのない子の人数 */
.kglive .shikai-band .lab .spacer { flex:1; }
.kglive .yet { font-size:12.5px; color:var(--ink-sub); white-space:nowrap; font-weight:400; }
.kglive .yet b { font-size:15px; font-weight:800; color:var(--ink); }
/* ===== 席の自由配置(docs/29 §2)。教室の升目に席を置く。コの字の帯・辺・正面の箱は使わない ===== */
.kglive .hall.hall--grid { display:flex; flex-direction:column; gap:6px; grid-template-areas:none; }
.kglive .kg-info { flex:0 0 auto; display:flex; align-items:center; gap:10px; min-width:0; }
.kglive .kg-info .meate { flex:1 1 auto; margin:0; text-align:left; }
.kglive .kg-board { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; }
.kglive .kg-board--scroll { overflow:auto; }
.kglive .kg-board .seat { position:absolute; min-height:0; padding:3px 3px 2px; overflow:visible; }   /* 札(.flag)は席の上にはみ出して見せる */
.kglive .kg-board .seat .nm { max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* 升目の線は席を直すときだけ(ふだんは出さない=見るものを増やさない) */
.kglive .kg-lines { position:absolute; pointer-events:none; z-index:0; }
.kglive .hall--edit .kg-lines { border:1px dashed var(--line);
  background-image:linear-gradient(to right, var(--line) 1px, transparent 1px), linear-gradient(to bottom, var(--line) 1px, transparent 1px); opacity:.7; }
/* ★席を直すあいだはタッチの指をブラウザのスクロールに取られないようにする(これが無いとタッチパネルでドラッグが効かない) */
.kglive .hall--edit .seat { touch-action:none; user-select:none; -webkit-user-select:none; }
.kglive .hall--edit .kg-board, .kglive .hall--edit .kg-tray { cursor:pointer; }
/* タップで「動かす子」にした席(太い実線＋名札。色だけに頼らない) */
.kglive .seat.seat--moving { border-style:solid; border-width:3px; border-color:var(--violet-700); box-shadow:0 0 0 3px var(--violet-100); z-index:3; }
/* 札は席の上の縁にのせる。小さい席でも字が切れない */
.kglive .kg-board .seat .flag { z-index:4; max-width:none; }
.kglive .seat.seat--multi { border-style:solid; border-width:3px; border-color:var(--violet-600); background:var(--violet-50); }
/* なぞって囲む四角 */
.kglive .kg-band { position:absolute; z-index:5; pointer-events:none; border:2px dashed var(--violet-600); background:rgba(109,79,196,.08); border-radius:4px; }
.kglive .kg-hi--more { border-style:dotted; }
.seat--ghost .ghost-n { position:absolute; right:-8px; top:-10px; background:var(--violet-700); color:#fff; font-size:12px; font-weight:800; border-radius:999px; padding:1px 8px; }
/* ✎(選んだ席の右上の角。押すとその席の上に名前の入力が開く) */
.kglive .kg-pen { position:absolute; z-index:6; padding:0; border:2px solid var(--violet-700); border-radius:999px;
  background:var(--panel); color:var(--violet-700); font-size:15px; font-weight:800; line-height:1; cursor:pointer; box-shadow:var(--shadow-1); }
.kglive .kg-pen:hover { background:var(--violet-50); }
.kglive .kg-namein { position:absolute; z-index:7; box-sizing:border-box; border:3px solid var(--violet-700); border-radius:var(--r-lg);
  font-size:18px; font-weight:700; text-align:center; padding:0 6px; background:#fff; color:var(--ink); }
/* コの字の「司会の席」(まだだれもいない黒板の前の行) */
.kglive .kg-shslot { position:absolute; z-index:0; display:flex; align-items:center; justify-content:center; gap:8px;
  border:2px dashed var(--violet-400); border-radius:var(--r-lg); background:var(--violet-50); color:var(--violet-700); font-weight:800; font-size:14px; }
.kglive .kg-shslot small { font-weight:400; color:var(--ink-sub); font-size:12px; }
.kglive .kg-shslot--tap { cursor:pointer; z-index:1; }
.kglive .kg-shslot--tap:hover { border-color:var(--violet-600); border-style:solid; }
.kglive .kg-hi { position:absolute; z-index:1; pointer-events:none; border:3px dashed var(--violet-600); border-radius:var(--r-md); background:var(--violet-50); }
/* 置き場(まだ席がない子)。席を直すときはいつも、ふだんは置き場に子がいるときだけ出す */
.kglive .kg-tray { flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 8px;
  border:1px dashed var(--line); border-radius:var(--r-lg); background:var(--gray-50, #f6f7f9); max-height:34%; overflow:auto; }
.kglive .kg-tray__lab { font-size:12.5px; font-weight:800; color:var(--ink-sub); display:flex; gap:6px; align-items:center; margin-right:4px; }
.kglive .kg-tray__lab b { color:var(--ink); }
.kglive .kg-tray__empty { font-size:12.5px; color:var(--ink-sub); }
.kglive .kg-tray__all { height:36px; padding:0 12px; border:1px solid var(--violet-600); border-radius:999px; background:var(--panel);
  color:var(--violet-700); font-size:13px; font-weight:800; cursor:pointer; margin-right:4px; }
.kglive .kg-tray .seat { width:96px; min-height:52px; }
.kglive .kg-tray .seat .nm { font-size:16px; }
/* ふだん(記録中)の置き場は細く。盤の高さを取りすぎない */
.kglive .hall:not(.hall--edit) .kg-tray { padding:3px 8px; }
.kglive .hall:not(.hall--edit) .kg-tray .seat { min-height:44px; padding:2px 4px; }
/* 司会グループ = 二重線の枠＋役割の名札(色だけに頼らない・docs/29 §3) */
.kglive .seat.seat--sh { border-style:double; border-width:4px; border-color:var(--violet-600); }
.kglive .seat.seat--sh.nolink { border-style:double; border-color:var(--violet-400); }
.kglive .hall--pick .seat:not(.seat--sh) { border-style:solid; }
/* 席が小さいとき(自動採寸の結果)。名前は残し、名札・回数を詰める */
.kglive .hall.kg-s .kg-board .seat .nm { font-size:16px; }
.kglive .hall.kg-s .kg-board .seat .role { font-size:10px; padding:0 5px; margin-bottom:1px; }
.kglive .hall.kg-s .kg-board .seat .b { font-size:11px; padding:0 4px; line-height:15px; }
.kglive .hall.kg-xs .kg-board .seat .nm { font-size:14px; }
.kglive .hall.kg-xs .kg-board .seat .cnt { gap:2px; margin-top:0; }
.kglive .hall.kg-xs .kg-board .seat .flag { font-size:10px; top:-9px; padding:0 5px; }
/* 席を直す: 型のボタン */
.kglive .kg-types { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:6px; }
.kglive .kg-type { display:flex; flex-direction:column; align-items:center; gap:2px; min-height:52px; padding:6px 4px;
  border:1px solid var(--line); border-radius:var(--r-md); background:var(--panel); font-size:13px; font-weight:700; cursor:pointer; }
.kglive .kg-type:hover { border-color:var(--violet-400); }
.kglive .kg-type.on { border:2px solid var(--violet-600); background:var(--violet-50); color:var(--violet-700); }
.kglive .kg-type__ic { font-size:18px; line-height:1; }
/* 司会グループの一覧(右パネル) */
.kglive .kg-shrow { display:flex; align-items:center; gap:6px; padding:4px 0; border-bottom:1px solid var(--line); }
.kglive .kg-shrow.on .kg-shrow__nm { color:var(--violet-700); }
.kglive .kg-shrow__nm { flex:0 0 auto; min-width:4.5em; font-weight:800; font-size:15px; }
.kglive .kg-shrow__sel { flex:1 1 auto; min-width:0; margin:0; }
.kglive .kg-shrow__x { flex:0 0 auto; width:44px; height:44px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--panel); font-size:15px; cursor:pointer; }
.kglive .yet--zero { color:var(--teal-700); font-weight:700; }
/* 右パネル(2タブ) */
.kglive .side-grip { flex:0 0 12px; align-self:stretch; cursor:col-resize; touch-action:none; border-radius:6px; position:relative; margin:0 -4px; }
.kglive .side-grip::after { content:""; position:absolute; left:50%; top:50%; width:4px; height:48px; transform:translate(-50%,-50%); border-radius:2px; background:var(--line); }
.kglive .side-grip:hover::after, .kglive .side-grip.on::after, .kglive .side-grip:focus-visible::after { background:var(--violet-600); height:72px; }
.kglive .side-grip:focus-visible { outline:2px solid var(--violet-600); }
/* 右パネルは既定で広め(書く欄を広く)。つまみで 260px〜画面の55% まで変えられる */
.kglive .side { flex:0 0 clamp(300px,30vw,460px); background:var(--panel); border:1px solid var(--line); border-radius:var(--r-xl); display:flex; flex-direction:column; min-height:0; }
.kglive .tabs { display:flex; padding:6px; gap:4px; border-bottom:1px solid var(--line); }
.kglive .tab { flex:1; height:var(--tap); border-radius:var(--r-md); font-weight:700; font-size:15px; color:var(--ink-sub); display:flex; align-items:center; justify-content:center; gap:5px; }
.kglive .tab.on { background:var(--violet-50); color:var(--violet-700); box-shadow:inset 0 0 0 2px var(--violet-400); }
.kglive .tabbody { flex:1; overflow:auto; padding:8px 10px; font-size:14px; min-height:0; }
/* 保存はスクロールの外。書いたあと必ず目に入る場所に置く(20 §8.1) */
.kglive .sidefoot { flex:0 0 auto; padding:7px 10px 8px; border-top:1px solid var(--line); background:var(--panel); border-radius:0 0 var(--r-xl) var(--r-xl); }
.kglive .sidefoot:empty { display:none; }
.kglive .savebtn { width:100%; min-height:var(--tap); border-radius:var(--r-md); background:var(--violet-600); color:#fff; border:2px solid var(--violet-700); font-size:16px; font-weight:800; }
.kglive .savebtn--done { background:var(--teal-700); border-color:var(--teal-700); color:#fff; }
.kglive .savebtn--off { background:var(--panel); color:var(--ink-sub); border:1.5px solid var(--line); font-weight:700; }
.kglive .savehint { font-size:12px; color:var(--ink-sub); margin-top:5px; text-align:center; line-height:1.4; }
/* 流れ: 書いたことをそのまま出す(読むために右パネルを切り替えなくていい・20 §8.2) */
.kglive .flowitem { position:relative; border-left:3px solid var(--gray-100); border-radius:0 var(--r-sm) var(--r-sm) 0; margin-bottom:7px; }
.kglive .flowitem.linked { border-left-color:var(--violet-600); }
.kglive .flowitem.linked-yo { border-left-color:var(--teal-600); }
.kglive .flowitem--tch { opacity:.75; }
.kglive .fbody { display:block; width:100%; text-align:left; background:none; border:none; padding:4px 8px 4px 8px; cursor:pointer; font-family:inherit; }
.kglive .flowitem--tch .fbody { cursor:default; }
.kglive .flowitem .t { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:12px; color:var(--ink-sub); font-variant-numeric:tabular-nums; }
/* 見た目は小さなピルのまま、押せる範囲は44px(08 §2.3)。枠は内側の <i> に持たせる */
.kglive .fdel { display:inline-flex; align-items:center; min-height:var(--tap); padding:0 2px; margin:-10px 0; opacity:0; transition:opacity 120ms; cursor:pointer; }
.kglive .fdel i { font-style:normal; font-size:11.5px; font-weight:700; color:var(--ink-sub); border:1px solid var(--line); border-radius:var(--r-pill); padding:2px 8px; background:var(--panel); }
.kglive .flowitem:hover .fdel, .kglive .flowitem.cur .fdel { opacity:1; }
.kglive .flowitem:hover { background:var(--bg); }
.kglive .flowitem.cur { background:var(--bg); box-shadow:inset 0 0 0 1px var(--line); }
.kglive .flowitem.justsaved { animation:kjsv 2200ms ease-out; }
@keyframes kjsv { 0%{background:var(--teal-100)} 100%{background:transparent} }
.kglive .flowitem .n { font-size:16px; font-weight:700; color:var(--ink); }
.kglive .flowitem .k { font-size:12.5px; color:var(--violet-700); font-weight:700; }
.kglive .flowitem .k--yo { color:var(--teal-700); }
.kglive .to-sp { color:var(--violet-700); }
.kglive .to-yo { color:var(--teal-700); }
.kglive .flowitem .memo { font-size:13px; line-height:1.5; color:var(--ink); margin-top:2px; }
.kglive .flowitem .nomemo { font-size:12px; color:var(--ink-sub); margin-top:2px; }
/* ④ 道具バー */
.kglive .tools { flex:0 0 auto; background:var(--bg); border-top:1px solid var(--line); padding:4px 10px 2px; }
.kglive .trow { display:flex; align-items:center; gap:8px; margin-bottom:3px; flex-wrap:wrap; }
.kglive .rowlab { font-size:12px; font-weight:800; color:var(--ink-sub); width:56px; flex:0 0 auto; text-align:right; }
.kglive .yosa-wrap { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.kglive .group { display:flex; align-items:center; gap:5px; padding:4px 8px 4px 6px; border:1px solid var(--line); border-radius:var(--r-lg); background:var(--panel); }
.kglive .group > .glab { font-size:11.5px; font-weight:800; color:var(--ink-sub); padding:0 2px; text-align:center; line-height:1.15; white-space:nowrap; }
.kglive .group--link { border:2px solid var(--violet-400); background:var(--panel); }
.kglive .group--link > .glab { color:var(--violet-700); }
/* よさの島は深緑。上(発言)と下(よさ)で同じ作り・色だけが違う(20 §6.1) */
.kglive .group--yosa { border-color:var(--teal-600); }
.kglive .group--yosa > .glab { color:var(--teal-700); }
.kglive .group--tch { border-style:dashed; position:relative; }
/* 教師ミニパレットは道具バーに入りきらないので「先生 ▾」に畳む(20 §7.3)。児童パレットの幅は削らない */
.kglive .tchtog { min-width:0; padding:0 10px; }
.kglive .tchpop { position:absolute; left:0; bottom:calc(100% + 6px); z-index:30; display:flex; flex-wrap:wrap; gap:5px; width:max-content; max-width:420px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:8px; box-shadow:var(--shadow-2); }
.kglive .tchpop.hidden { display:none; }
.kglive .tchpop__lab { flex-basis:100%; font-size:11.5px; font-weight:800; color:var(--ink-sub); }
.kglive .pbtn { min-height:var(--tap); min-width:64px; padding:0 12px; border:1.5px solid var(--line); border-radius:var(--r-md); background:var(--panel); font-size:16px; font-weight:700; display:inline-flex; align-items:center; gap:5px; transition:120ms ease-out; }
.kglive .pbtn:hover { border-color:var(--violet-400); }
.kglive .pbtn.on { background:var(--violet-600); color:#fff; border-color:var(--violet-700); box-shadow:var(--shadow-1); }
.kglive .pbtn.on::before { content:"✓"; font-size:14px; font-weight:800; }
.kglive .pbtn--yosa.on { background:var(--teal-700); border-color:var(--teal-700); }
.kglive .pbtn--sel.on { background:var(--gray-600); border-color:var(--gray-700); }
.kglive .pbtn--tch { background:#fff; border-style:dashed; color:var(--gray-700); font-size:15px; min-width:0; }
.kglive .aux { min-height:var(--tap); padding:0 12px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--panel); font-size:14px; font-weight:700; color:var(--ink-sub); }
.kglive .aux.on { background:var(--violet-50); color:var(--violet-700); border-color:var(--violet-400); }
/* 確定帯(つなぎ中) */
/* 行の高さは通常のパレット行と同じにする(差し替えても画面が跳ねない・19 §4.1) */
.kglive .linkbar { display:flex; align-items:center; gap:10px; width:100%; background:var(--violet-50); border:2px solid var(--violet-400); border-radius:var(--r-lg); padding:4px 8px 4px 12px; }
.kglive .linkbar .who { font-size:15px; line-height:1.2; min-width:0; color:var(--ink); }
.kglive .linkbar .who b { font-size:18px; font-weight:800; color:var(--violet-700); }
.kglive .linkbar .who small { display:block; font-size:12.5px; color:var(--ink-sub); }
.kglive .linkbar .step { flex:0 0 auto; width:30px; height:30px; border-radius:var(--r-pill); background:var(--violet-600); color:#fff; font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; }
.kglive .gobtn { min-height:var(--tap); padding:0 20px; border-radius:var(--r-md); background:var(--violet-600); color:#fff; border:2px solid var(--violet-700); font-size:17px; font-weight:800; box-shadow:var(--shadow-1); }
.kglive .cancelbtn { min-height:var(--tap); padding:0 16px; border-radius:var(--r-md); background:var(--panel); color:var(--ink-sub); border:1.5px solid var(--line); font-size:15px; font-weight:700; }
/* よさのつなぎ中は確定帯も深緑に(色=発言かよさか・20 §6.2) */
.kglive .linkbar--yosa { background:var(--teal-100); border-color:var(--teal-600); }
.kglive .linkbar--yosa .who b { color:var(--teal-700); }
.kglive .linkbar--yosa .step { background:var(--teal-700); }
.kglive .linkbar--yosa .gobtn { background:var(--teal-700); border-color:var(--teal-700); }
/* 🙋 じぶんから(★25 §2.3)。宛先＝じぶん＝獲得。確定ボタンと見分けがつくよう地は白・枠を太く。 */
.kglive .selfbtn { min-height:var(--tap); padding:0 16px; border-radius:var(--r-md); background:var(--panel);
  color:var(--violet-700); border:2px solid var(--violet-600); font-size:16px; font-weight:800; margin-right:8px; }
.kglive .selfbtn:hover { background:var(--violet-50); }
/* 結びが生まれる道具は、選んでいなくても囲む(🔗=つながり。色とは独立した符号) */
.kglive .pbtn--link { border:2px solid var(--violet-400); color:var(--violet-700); background:var(--panel); }
.kglive .pbtn--link:hover { border-color:var(--violet-600); }
.kglive .pbtn--yosa.pbtn--link { border-color:var(--teal-600); color:var(--teal-700); }
.kglive .pbtn--yosa.pbtn--link:hover { border-color:var(--teal-700); }
.kglive .pbtn--link.on { background:var(--violet-600); border-color:var(--violet-700); color:#fff; }
.kglive .pbtn--yosa.on, .kglive .pbtn--yosa.pbtn--link.on { background:var(--teal-700); border-color:var(--teal-700); color:#fff; }
/* 未送信(アラートは出さず、直前の記録の下に小さく) */
.kglive .sb-last .unsent { display:inline-block; margin-top:3px; font-size:12px; font-weight:800; color:#fff; background:var(--orange-700); border-radius:var(--r-pill); padding:1px 9px; }
/* 自動下書きが入ったことの注記 */
.kglive .kp-auto-tag { font-size:11.5px; font-weight:700; color:var(--violet-700); }
.kglive .kp-auto-tag--yo { color:var(--teal-700); }
/* ⑤ 最下段 */
.kglive .footbar { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:4px 10px; background:var(--violet-50); border-top:1px solid var(--violet-100); }
.kglive .lock { font-size:12px; font-weight:800; color:var(--violet-700); line-height:1.15; white-space:nowrap; }
.kglive .lock small { display:block; font-weight:400; color:var(--ink-sub); font-size:11px; }
.kglive .taisetsu-in { flex:1; min-height:42px; padding:8px 12px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--panel); font-size:15px; font-family:inherit; resize:none; }
.kglive .save { font-size:12px; color:var(--ink-sub); width:64px; text-align:center; }
.kglive .endbtn { height:44px; padding:0 18px; border-radius:var(--r-md); border:2px solid var(--violet-600); background:var(--panel); color:var(--violet-700); font-weight:800; font-size:15px; white-space:nowrap; }
/* 自動下書きの合図(フォーカスは奪わない) */
.kglive .kp-flash { box-shadow:0 0 0 3px var(--violet-400); border-color:var(--violet-600)!important; animation:kkpf 900ms ease-out; }
@keyframes kkpf { 0%{background:var(--violet-50)} 100%{background:var(--panel)} }
/* ⋯メニュー(オーバーレイ内) */
.sheet--menu { max-width:520px; }
.menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
.menu-item { display:flex; align-items:center; gap:10px; min-height:52px; padding:0 14px; border:1px solid var(--line); border-radius:var(--r-lg); background:var(--panel); font-size:16px; font-weight:700; text-align:left; }
.menu-item:hover { border-color:var(--violet-400); background:var(--violet-50); }
.menu-ic { font-size:20px; display:inline-flex; color:var(--accent); }
.menu-ic .ico { width:22px; height:22px; }
/* 「🔗 つなぎ方」ヘルプ(⋯メニュー)。種類・スタンプはマスタから出す */
.help-chip { display:inline-block; border-radius:var(--r-pill); padding:3px 12px; font-weight:700; font-size:14px;
  background:var(--panel); color:var(--ink-sub); border:1px solid var(--line); }
.help-chip--sp { background:var(--violet-50); color:var(--violet-700); border:2px solid var(--violet-400); }
.help-chip--sp::before, .help-chip--yo::before { content:none; }   /* 絵文字は使わない(2026-10-06) */
.help-chip--yo { background:var(--panel); color:var(--teal-700); border:2px solid var(--teal-600); }
.help-step { flex:1; min-width:150px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
.help-step__t { font-weight:800; color:var(--violet-700); }
.help-step__b { margin-top:6px; color:var(--ink-sub); font-size:14px; }
/* タップ目標44pxを割らない(08 §2.3)。共有部品はライブ画面の中でだけ底上げする */
.kglive .homebtn { min-height:var(--tap); }
.kglive .taisetsu-in { min-height:var(--tap); }
/* 席の長押しパネル(欠席にする/出席に戻す・20 §7.3)。座席のすぐ上に出す */
.seatpop { position:fixed; z-index:70; display:flex; flex-direction:column; gap:6px; min-width:170px;
  background:var(--panel); border:2px solid var(--violet-400); border-radius:var(--r-lg); padding:10px; box-shadow:var(--shadow-2); }
.seatpop__nm { font-size:15px; font-weight:800; text-align:center; }
.seatpop__btn { min-height:var(--tap); border-radius:var(--r-md); border:2px solid var(--violet-700); background:var(--violet-600); color:#fff; font-size:15px; font-weight:800; }
.seatpop__btn--quiet { background:var(--panel); color:var(--ink-sub); border:1.5px solid var(--line); font-weight:700; }
@media (prefers-reduced-motion: reduce) { .kglive *, .seat--ghost, .seatpop { animation:none!important; transition:none!important; } }

/* ============================================================
   見取りUI 共通(設計21)。学級会(.kglive)の骨格を 道徳(.dtlive)・国語(.kklive)でも使う。
   ★共通化するのは「仕組み」であって「色の割当」ではない(21 §6)。
     色はモードごとに --lv-* を差し替えるだけにする。
   ============================================================ */
.kglive { --lv-c:var(--violet-600); --lv-cs:var(--violet-700); --lv-c1:var(--violet-100); --lv-c0:var(--violet-50); --lv-c4:var(--violet-400); }
.dtlive { --lv-c:var(--rose-600); --lv-cs:var(--rose-700); --lv-c1:#F4D9E9; --lv-c0:var(--rose-50); --lv-c4:#D96BA8; }
.kklive { --lv-c:var(--blue-600); --lv-cs:var(--blue-700); --lv-c1:#D6E4FA; --lv-c0:var(--blue-50); --lv-c4:#7FA9E8; }
.dtlive .mode-line, .kklive .mode-line { background:var(--lv-c); }
.dtlive .unitname, .kklive .unitname { border-color:var(--lv-c4); background:var(--lv-c0); color:var(--lv-cs); }
.dtlive .sb-chip, .kklive .sb-chip { color:var(--lv-cs); }
.dtlive .tab.on, .kklive .tab.on { background:var(--lv-c0); color:var(--lv-cs); box-shadow:inset 0 0 0 2px var(--lv-c4); }
.dtlive .savebtn, .kklive .savebtn { background:var(--lv-c); border-color:var(--lv-cs); }
.dtlive .savebtn--off, .kklive .savebtn--off { background:var(--panel); color:var(--ink-sub); border:1.5px solid var(--line); }
.dtlive .seat.speaker, .kklive .seat.speaker { border-color:var(--lv-cs); background:var(--lv-c1); }
.dtlive .seat.target, .kklive .seat.target { border-color:var(--lv-c4); background:var(--panel); }
.dtlive .seat.sel, .kklive .seat.sel { border-color:var(--lv-c4); }
.dtlive .seat .flag, .kklive .seat .flag { background:var(--lv-c); }
.dtlive .seat.speaker .flag, .kklive .seat.speaker .flag { background:var(--lv-cs); }
.dtlive .seat.target .flag, .kklive .seat.target .flag { background:var(--panel); color:var(--lv-cs); box-shadow:inset 0 0 0 2px var(--lv-c4); }
.dtlive .seat:hover, .kklive .seat:hover { border-color:var(--lv-c4); }
.dtlive .flowitem.linked, .kklive .flowitem.linked { border-left-color:var(--lv-c); }
.dtlive .pbtn.on, .kklive .pbtn.on { background:var(--lv-c); border-color:var(--lv-cs); color:#fff; }
.dtlive .group--link, .kklive .group--link { border-color:var(--lv-c4); background:var(--lv-c0); }
.dtlive .pbtn--link, .kklive .pbtn--link { box-shadow:inset 0 0 0 2px var(--lv-c4); }
.dtlive .linkbar, .kklive .linkbar { border-color:var(--lv-cs); background:var(--lv-c0); }
.dtlive .gobtn, .kklive .gobtn { background:var(--lv-c); border-color:var(--lv-cs); }
.dtlive .kp-flash, .kklive .kp-flash { box-shadow:0 0 0 3px var(--lv-c4); }
.dtlive .help-step__t { color:var(--lv-cs); }

/* 実況バー: 黒板の札を持たないモード(道徳・国語)。左端の内側余白だけそろえる */
.kglive .stagebar--plain .sb-now { padding-left:16px; }

/* 素のグリッド版のホール(道徳・国語)。コの字のグリッド領域指定を上書きする。
   ★縦は overflow-y:auto。採寸が決まれば動かないが、どうしても収まらない学級規模で
     子どもが画面から消える(=見取りから漏れる)ことだけは避ける。 */
.kglive .hall--grid { display:flex; flex-direction:column; gap:6px; grid-template-columns:none; grid-template-rows:none; grid-template-areas:none; overflow-y:auto; }
.kglive .hall--grid .gridhead { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:3px 6px 5px;
  border-bottom:1px dashed var(--line); font-size:12.5px; font-weight:700; color:var(--lv-cs); }
.kglive .hall--grid .gridhead .spacer { flex:1; }
.kglive .hall--grid .seatgrid { flex:1; display:grid; gap:var(--seat-gap); align-content:start; justify-content:center; min-height:0; }
/* 座席表ビューは机の並び(行×列)が正。番号順ビューは幅から折り返す(列数は mtFitGrid が決める) */
.kglive .hall--grid .seatgrid--seat { align-content:start; }
.kglive .hall--grid .seat { width:auto; }
.kglive .seat .seatno { position:absolute; top:2px; left:5px; font-size:10.5px; color:var(--ink-sub); font-variant-numeric:tabular-nums; }

/* ヘッダーの表示切替(座席表/番号順) */
.kglive .seg--view { display:flex; gap:2px; background:var(--gray-100); padding:2px; border-radius:var(--r-pill); }
.kglive .seg--view button { min-height:38px; padding:0 12px; border-radius:var(--r-pill); font-size:14px; font-weight:700; color:var(--gray-700); }
.kglive .seg--view button.on { background:var(--panel); color:var(--lv-cs); box-shadow:var(--shadow-1); }

/* 道徳の記録バッジ・タグボタン(◎○△は出さないので「件数」だけ) */
.dtlive .b--dt { background:var(--panel); color:var(--rose-700); box-shadow:inset 0 0 0 1.5px #D96BA8; }
.dtlive .pbtn--dt.on { background:var(--rose-600); border-color:var(--rose-700); color:#fff; }
.dtlive .kp-auto-tag--dt { color:var(--rose-700); }
.help-chip--dt { background:var(--rose-50); color:var(--rose-700); border:2px solid #D96BA8; }
.help-chip--dt::before { content:none; }

/* 国語の🔗(話合いの本時だけ出る島)。★深緑は◎の色なので国語では🔗に使わない(21 §4.3) */
.kklive .b--sp { background:var(--panel); color:var(--blue-700); box-shadow:inset 0 0 0 1.5px #7FA9E8; }
.help-chip--kk { background:var(--blue-50); color:var(--blue-700); border:2px solid #7FA9E8; }
.help-chip--kk::before { content:none; }

/* 国語ライブ(.kklive): 既存の .scard(記号/─/番号/📝)をそのまま座席グリッドに載せる。
   ★「─」も記号も同じ大きさのカードに収める(21 §4.1: 未評価の見せ方は「─」のままにする) */
.kklive .hall--grid .seatgrid .scard { position:relative; width:var(--seat-w); min-height:var(--seat-h); margin:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
.kklive .scard__name { font-size:20px; line-height:1.15; font-weight:700; }
.kklive .scard__sym { font-size:22px; line-height:1.05; font-weight:800; }
.kklive .scard__no { position:absolute; top:2px; left:5px; font-size:10.5px; color:var(--ink-sub); }
.kklive .scard__memo { position:absolute; top:2px; right:4px; font-size:11px; }
.kklive .scard__sp { position:absolute; bottom:2px; right:5px; font-size:11px; font-weight:800; color:var(--blue-700); }
.kklive .scard.speaker { border-width:3px; border-color:var(--lv-cs); background:var(--lv-c1); }
.kklive .scard.target { border-width:3px; border-color:var(--lv-c4); background:var(--panel); }
.kklive .scard .flag { position:absolute; top:-11px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:800;
  color:#fff; background:var(--lv-c); border-radius:var(--r-pill); padding:1px 8px; white-space:nowrap; z-index:3; }
.kklive .scard.target .flag { background:var(--panel); color:var(--lv-cs); box-shadow:inset 0 0 0 2px var(--lv-c4); }
/* 座席の上の帯: 入力状況 + 未評価だけ表示 + まだ○人 */
.kklive .hall--grid .gridhead { color:var(--ink-sub); font-weight:400; gap:14px; }
.kklive .gridhead .lab { font-weight:700; color:var(--ink); }
.kklive .gridhead .lab b { font-size:15px; font-variant-numeric:tabular-nums; }
.kklive .gridhead .sub { font-weight:400; color:var(--ink-sub); margin-left:6px; }
.kklive .gridhead .lfoot__filter { display:inline-flex; align-items:center; gap:5px; min-height:var(--tap); cursor:pointer; }
/* 右パネルの記号ボタン(パレットからも入れられるが、選んだ子からも直せる) */
.kglive .kp-syms { display:flex; gap:6px; margin:6px 0 8px; }
.kglive .kp-sym { flex:1; min-height:var(--tap); border:2px solid var(--line); border-radius:var(--r-md);
  background:var(--panel); font-size:20px; font-weight:800; }
.kglive .kp-sym.on { box-shadow:inset 0 0 0 3px currentColor; }
/* つながり線SVGは gridwrap を基準にする(.kglive .hall と同じ) */
.kklive .hall--grid { position:relative; }

/* ヘッダーは1行に畳む(2行になると座席の高さを54px奪う)。★縮んでよいのは「めあて」と単元名だけ。
   他のボタンは flex-shrink:0 + nowrap にしないと「ホ/ー/ム」のように縦に潰れる。 */
.kklive .lhead { flex-wrap:nowrap; overflow:hidden; gap:7px; }
.kklive .lhead > * { flex:0 0 auto; white-space:nowrap; }
.kklive .lhead .me { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.kklive .lhead .unitname { flex:0 1 auto; min-width:96px; }
.kklive .lhead .spacer { flex:0 0 8px; }
/* 道具バーの1行目も1行に畳む(はみ出す道具は2行目へ回す) */
.kglive .trow { flex-wrap:nowrap; }
.kglive .trow--wrap { flex-wrap:wrap; }
/* 座席の上の帯は44pxのタップ目標を保ちつつ詰める */
.kklive .hall--grid .gridhead { padding:0 6px 3px; }
.kklive .gridhead .lfoot__filter { min-height:38px; }

/* ===== 見取り設計書 v1.0 §5: 道具バーを押す頻度で上下2段 =====
   上段=よく押すボタンを大きく / 下段=残りを小さく。
   優先するのは見た目の整合ではなく押しやすさ(先生は45分間、司会と板書も見ている)。
   ★下段でも --tap(44px) は割らない。小さくするのは幅と字だけ。 */
.kglive .trow--big .pbtn { min-height:58px; min-width:92px; font-size:19px; padding:0 16px; }
.kglive .trow--big .glab { font-size:12.5px; }
.kglive .trow--big .rowlab { font-size:13px; }
/* 「👆選ぶだけ」「先生▾」は主役ではないので上段でも大きくしない */
.kglive .trow--big .pbtn--sel,
.kglive .trow--big .pbtn--tch { min-height:var(--tap); min-width:0; font-size:15px; padding:0 12px; }
.kglive .trow--small .pbtn { min-height:var(--tap); min-width:56px; font-size:14.5px; padding:0 10px; }
.kglive .trow--small .glab { font-size:11px; }
/* 確定帯は上段に差し替わる。帯そのものの寸法は自前で持っているので、上段の拡大を効かせない */
.kglive .trow--big .linkbar .gobtn,
.kglive .trow--big .linkbar .cancelbtn { min-height:var(--tap); font-size:16px; }

/* ===== つぎの一手(★25 v1.2 §4) — 形成的評価の面 =====
   ★★ 象限は子どもの優劣ではない(★22 §4)。だから【色で良し悪しを作らない】。
      区別は枠の線種だけ: ①実線 ②二重線 ③破線 ④点線。色は1色(accent)。
      とくに③は子どもではなく「私の見取り」の情報なので、赤を使わない。 */
.itte { padding: 14px 20px 28px; }
.itte-top { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 10px 14px; font-size: 14px; line-height: 1.7; }
.itte-top__line b { color: var(--accent-strong); }
.itte-top__mada { margin-top: 6px; font-size: 13px; color: var(--ink-sub); }
.itte-nm { padding: 3px 9px; border-radius: var(--r-pill); background: var(--accent-soft);
  color: var(--accent-strong); font-weight: 700; cursor: pointer; }
.itte-nm:hover { background: var(--accent); color: #fff; }
.itte-body { display: grid; grid-template-columns: minmax(0,1fr) 420px; gap: 16px; margin-top: 14px; align-items: start; }
.itte-left { min-width: 0; }
.itte-right { position: sticky; top: 12px; }

.itte-hall { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; }
.itte-z { border: 1px dashed var(--line); border-radius: var(--r-md); padding: 6px 8px; }
.itte-zlab { font-size: 11.5px; color: var(--ink-sub); font-weight: 800; letter-spacing: .1em; margin-bottom: 4px; }
.itte-seats { display: flex; flex-wrap: wrap; gap: 6px; }
.itte-seats--col { flex-direction: column; }
.itte-mid { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 8px; margin-top: 8px; align-items: start; }
.itte-z--shikai { background: var(--violet-50); border-color: var(--violet-200); }
.itte-legend { margin-top: 10px; font-size: 12.5px; color: var(--ink-sub); line-height: 1.7; }
.itte-gridwrap { overflow-x: auto; }
.itte-grid { position: relative; margin: 0 auto; }
.itte .itte-grid .seat.itte-seat { position: absolute; min-height: 0; }

/* 席。ライブの .seat を土台にして、大きさだけ固定にする(自動採寸は使わない・★25 §4.8) */
.itte .seat.itte-seat { width: 108px; min-height: 58px; font-size: 13px; }
.itte .seat.itte-seat .cnt { white-space: nowrap; }
.itte .seat.itte-seat .nm { font-size: 16px; }
.itte .seat.itte-seat .flag { background: var(--accent); }
.itte .seat.itte-seat .b.itte-w { background: var(--gray-100); color: var(--ink); font-weight: 800; }
.itte .seat.itte-seat.sel { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.itte .seat.itte-q0 { border-style: solid; border-color: var(--accent); }
.itte .seat.itte-q1 { border-style: double; border-width: 3px; border-color: var(--accent); }
.itte .seat.itte-q2 { border-style: dashed; border-color: var(--accent); }
.itte .seat.itte-q3 { border-style: dotted; border-color: var(--accent); }

.itte-one { margin-top: 0; }
.itte-head { display: flex; align-items: center; gap: 10px; font-size: 18px; margin-bottom: 10px; }
.itte-sec { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.itte-lab { font-size: 12.5px; font-weight: 800; color: var(--ink-sub); margin-bottom: 4px; }
.itte-tag { display: inline-block; padding: 2px 9px; border-radius: var(--r-pill);
  background: var(--accent-soft); color: var(--accent-strong); font-size: 12px; font-weight: 800; margin-right: 6px; }
.itte-goal { font-size: 14.5px; line-height: 1.7; }
.itte-未 { color: var(--orange-700); font-weight: 800; font-size: 14px; }
.itte-kiroku { font-size: 14px; line-height: 1.7; }
.itte-w2 { color: var(--accent-strong); }
.itte-toi { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; }
.itte-toi span { padding: 3px 9px; border-radius: var(--r-pill); background: var(--gray-100); color: var(--ink-sub); }
.itte-toi span.on { background: var(--accent-soft); color: var(--accent-strong); font-weight: 800; }
.itte-self { font-size: 15px; }
.itte-quote { border-left: 3px solid var(--line); padding-left: 10px; margin-top: 4px;
  font-size: 14px; color: var(--ink-sub); line-height: 1.7; }
.itte-qbox { border: 1px solid var(--accent); border-radius: var(--r-md); padding: 10px 12px; margin-top: 10px;
  background: var(--accent-soft); font-size: 14px; line-height: 1.7; }
.itte-qbox--2 { border-width: 3px; border-style: double; }
.itte-qbox--3 { border-style: dashed; }
.itte-qbox--4 { border-style: dotted; }
.itte-q0 { border: 1px dashed var(--line); border-radius: var(--r-md); padding: 10px 12px; margin-top: 10px;
  font-size: 13.5px; color: var(--ink-sub); line-height: 1.7; }
.itte-in { margin-top: 6px; }
@media (max-width: 1100px) { .itte-body { grid-template-columns: minmax(0,1fr); } .itte-right { position: static; } }

/* ===== 研究用モード(2026-09-09) — 他クラスの研究授業で学級会を見取る ===== */
.kp-pen { border:1px solid var(--line); background:var(--panel); border-radius:var(--r-sm);
  font-size:13px; padding:1px 7px; margin-left:6px; vertical-align:2px; }
.kp-pen:hover { border-color:var(--violet-600); color:var(--violet-700); }
.kbadge-ken { display:inline-block; padding:2px 9px; border-radius:var(--r-pill); font-size:12px; font-weight:800;
  background:var(--violet-100); color:var(--violet-700); border:1px solid var(--violet-400); vertical-align:1px; }

/* 研究用A4の記録用紙(印刷). 白黒コピーでも読めるよう、色ではなく濃淡と線で分ける。 */
.kenpaper h1 { font-size:15pt; margin:0 0 1mm; }
.kenpaper .sub { font-size:9.5pt; color:#444; margin-bottom:3mm; }
.kenpaper .warn { border:1.2pt solid #333; padding:2mm 3mm; font-size:9pt; line-height:1.6; margin-bottom:4mm; }
.kenpaper .sec { margin-bottom:4mm; }
.kenpaper .sec h2 { font-size:10.5pt; margin:0 0 1.5mm; padding-bottom:0.8mm; border-bottom:0.8pt solid #333; }
/* ★クラス名は kenflow。.flow はライブ画面の流れパネル(display:flex; flex-wrap:nowrap)が
   すでに使っていて、同じ名前にすると1行のまま横にはみ出す(2026-09-09)。 */
.kenpaper .kenflow { display:block; font-size:8.5pt; line-height:1.9; overflow-wrap:anywhere; }
.kenpaper .kenflow .kf { white-space:nowrap; }
.kenpaper .kenflow .kf small { color:#666; margin-left:1mm; }
.kenpaper .kenflow .ar { margin:0 1.5mm; color:#888; }
.kenpaper .kenflow .none, .kenpaper .l .none { color:#777; }
.kenpaper .mk { display:flex; align-items:center; gap:3mm; margin-bottom:1.5mm; }
.kenpaper .mk-name { flex:0 0 34mm; font-size:9pt; font-weight:800; }
.kenpaper .mk-name small { display:block; font-weight:600; font-size:7.5pt; color:#555; }
.kenpaper .mk-bar { flex:1; display:flex; height:6mm; border:0.8pt solid #333; }
.kenpaper .mk-bar .seg { display:flex; align-items:center; justify-content:center; font-size:8pt; font-weight:800; overflow:hidden; }
.kenpaper .mk-bar .seg.kyo { background:#D9D9D9; color:#000; }
.kenpaper .mk-bar .seg.kaku { background:#000; color:#fff; }
.kenpaper .mk-bar .seg.none { flex:1; color:#777; font-weight:600; }
.kenpaper .t { border-collapse:collapse; width:100%; font-size:8.5pt; }
.kenpaper .t th, .kenpaper .t td { border:0.5pt solid #999; padding:0.6mm 1mm; text-align:center; }
.kenpaper .t th { background:#EEE; }
.kenpaper .t td:first-child { text-align:left; white-space:nowrap; }
.kenpaper .t tr.z td { color:#777; background:#FAFAFA; }
.kenpaper .l { margin:0; padding-left:5mm; font-size:9pt; line-height:1.7; }
.kenpaper .lbl { font-size:8.5pt; font-weight:800; margin-top:1.5mm; }
.kenpaper .q { font-size:9pt; line-height:1.7; margin:1.5mm 0 0; }
.kenpaper .q.small { font-size:8pt; color:#555; }
.kenpaper .memo-box { border:0.8pt solid #333; height:26mm; }

/* ===== 見取りの鏡(設計23 / 見取り設計書 v1.0 §9) =====
   ★この面だけは分析の対象が児童ではなく【教師自身の見取り】。
   ★色に良し悪しを持たせない。出どころの4色は同じ青の濃淡(白黒でも順に読める)。
     teal/orange は 協調/獲得 に予約済みなので、ここでは使わない。 */
.mr-thesis { border-left:4px solid var(--accent); background:var(--accent-soft);
  padding:12px 14px; border-radius:var(--r-md); font-size:14px; line-height:1.75; }
.mr-thesis b { color:var(--accent-strong); }
.mr-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-top:12px; }
.mr-kpi { border:1px solid var(--line); border-radius:var(--r-lg); padding:12px 14px; background:var(--panel); }
.mr-kpi .k { font-size:12.5px; font-weight:800; color:var(--ink-sub); }
.mr-kpi .n { font-size:30px; font-weight:800; color:var(--accent-strong); line-height:1.2; font-variant-numeric:tabular-nums; }
.mr-kpi .n small { font-size:14px; font-weight:700; color:var(--ink); margin-left:3px; }
.mr-kpi .s { font-size:12px; color:var(--ink-sub); margin-top:3px; line-height:1.55; }
.mr-rank { display:flex; flex-direction:column; gap:4px; max-height:520px; overflow:auto; padding-right:4px; }
.mr-row { display:grid; grid-template-columns:118px 1fr 44px; gap:9px; align-items:center; font-size:13.5px; }
.mr-row .nm { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.mr-row .nm:hover { color:var(--accent); text-decoration:underline; }
.mr-row .n { text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
.mr-row.zero .nm, .mr-row.zero .n { color:var(--orange-700); }
.mr-bar { display:flex; height:17px; border-radius:var(--r-pill); overflow:hidden; background:var(--gray-100); }
.mr-bar i { display:block; height:100%; flex:none; }
.mr-bar.zero { background:repeating-linear-gradient(45deg,#F3F6FA,#F3F6FA 6px,#E3E8EF 6px,#E3E8EF 12px); }
.mr-tallys { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
.mr-tally h4 { margin:0 0 2px; font-size:13.5px; font-weight:800; }
.mr-tally .sub { font-size:12px; color:var(--ink-sub); line-height:1.55; margin-bottom:6px; }
.mr-lb { display:grid; grid-template-columns:96px 1fr 64px; gap:8px; align-items:center; font-size:13px; margin-top:5px; }
.mr-lb .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
.mr-lb .b { height:15px; background:var(--gray-100); border-radius:var(--r-pill); overflow:hidden; }
.mr-lb .b i { display:block; height:100%; background:var(--accent); }
.mr-lb .v { text-align:right; color:var(--ink-sub); font-variant-numeric:tabular-nums; }
.mr-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-sub); margin-top:10px; }
.mr-legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-1px; }

/* ===== 見取り設計書 v1.0 §3/§4: 協調／獲得のバランス(振り返り画面) =====
   ★色は「良い/悪い」ではない。協調=teal / 獲得=orange。どちらも強い色にして優劣を作らない。
   ★§4 の注記(評価尺度ではない)は必ず数字の【上】に置く。下に置くと読まれない。 */

<script>
/**
 * calc_records.js — 評価記録の集計(純関数)。副作用なし・Nodeでテスト可能。
 *
 * 中核は calcLatestValid: 追記専用ログから「同じ児童×本時×観点の最新有効値」を解く。
 * 追記のみ・取消は打消し行・再送で記録IDが重複しうる、という前提を吸収する(設計05 §5/§7)。
 */

/** 集計キー(児童ID×単元ID×本時ID×観点)。
 *  国語は 本時ID→単元ID が1対1なので従来と同じ結果になる。
 *  学級会は本時IDを持たない(単元ID列に議題ID)ため、単元IDを含めないと会をまたいで潰れてしまう。 */
function recordKey(r) {
  return r['児童ID'] + '|' + (r['単元ID'] == null ? '' : r['単元ID']) + '|' + r['本時ID'] + '|' + r['観点'];
}

/**
 * 最新有効値を解く。
 * @param {Object[]} rows 評価記録行(ヘッダー名キーのオブジェクト配列)
 * @return {Object} { key -> row } 採用された行のマップ(keyは recordKey)
 *
 * アルゴリズム:
 *  1) 取消行(状態='取消')の 取消対象ID を集めて「無効化された記録ID集合」を作る。
 *  2) 状態='有効' かつ 記録IDが無効化集合に無い行だけを候補にする。
 *  3) キー毎に 記録日時 が最大の行を採用(同時刻は入力の後勝ち=後から追記された方)。
 *     記録日時は 'YYYY-MM-DD HH:mm:ss' 文字列で辞書順=時刻順。
 */
function calcLatestValid(rows) {
  var cancelled = {};
  var i, r;
  for (i = 0; i < rows.length; i++) {
    r = rows[i];
    if (r['状態'] === '取消') {
      var target = r['取消対象ID'];
      if (target !== undefined && target !== null && String(target) !== '') {
        cancelled[String(target)] = true;
      }
    }
  }

  var best = {};      // key -> row
  var bestIdx = {};   // key -> 採用行の入力index(同時刻の後勝ち判定用)
  for (i = 0; i < rows.length; i++) {
    r = rows[i];
    if (r['状態'] !== '有効') continue;
    if (cancelled[String(r['記録ID'])]) continue;
    var k = recordKey(r);
    if (!(k in best)) { best[k] = r; bestIdx[k] = i; continue; }
    var cur = best[k];
    var a = String(r['記録日時']);
    var b = String(cur['記録日時']);
    // 新しい方を採用。同時刻なら後から現れた行(index大)を採用。
    if (a > b || (a === b && i > bestIdx[k])) { best[k] = r; bestIdx[k] = i; }
  }
  return best;
}

/**
 * ある本時スコープの「児童ID -> 観点 -> {評価,記録ID,記録日時,メモ}」に整形。
 * getLessonBoot の「既存評価」用(設計05 §3.1)。
 * @param {Object[]} rows 評価記録行(全件でも可。本時IDで絞る)
 * @param {string} lessonId 本時ID
 */
function calcLatestValidForLesson(rows, lessonId) {
  var scoped = rows.filter(function (r) { return r['本時ID'] === lessonId; });
  var best = calcLatestValid(scoped);
  var out = {};
  Object.keys(best).forEach(function (k) {
    var r = best[k];
    var sid = r['児童ID'], kanten = r['観点'];
    if (!out[sid]) out[sid] = {};
    out[sid][kanten] = {
      '評価': r['評価'], '記録ID': r['記録ID'],
      '記録日時': r['記録日時'], 'メモ': r['メモ'] || '',
    };
  });
  return out;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    recordKey: recordKey,
    calcLatestValid: calcLatestValid,
    calcLatestValidForLesson: calcLatestValidForLesson,
  };
}

</script>
<script>
/**
 * calc_analytics.js — 分析系の集計(純関数)。副作用なし・Nodeでテスト可能。
 *
 * 最新有効値の解決は calc_records.js の calcLatestValid を使う。
 * GASでは同ファイルが同一グローバルに読み込まれ、Nodeでは require で取り込む。
 */
var _CR = (typeof calcLatestValid === 'function')
  ? { calcLatestValid: calcLatestValid, recordKey: recordKey }
  : (typeof require !== 'undefined' ? require('./calc_records.js') : null);
function _latest(rows) { return _CR.calcLatestValid(rows); }

var SYM = ['◎', '○', '△'];         // 既定記号(good, ok, need)
var SCORE = { good: 3, ok: 2, need: 1 };

/** best マップを 児童ID -> 本時ID -> 観点 -> row に索引化。 */
function _indexBest(best) {
  var idx = {};
  Object.keys(best).forEach(function (k) {
    var r = best[k];
    var sid = r['児童ID'], lid = r['本時ID'], kn = r['観点'];
    ((idx[sid] = idx[sid] || {})[lid] = idx[sid][lid] || {})[kn] = r;
  });
  return idx;
}

/** (児童,本時)の代表評価行を選ぶ。観点指定があればその観点、無ければ記録日時が最新。 */
function _pickCell(idxSL, opts) {
  if (!idxSL) return null;
  if (opts && opts['観点']) return idxSL[opts['観点']] || null;
  var best = null;
  Object.keys(idxSL).forEach(function (kn) {
    var r = idxSL[kn];
    if (!best || String(r['記録日時']) > String(best['記録日時'])) best = r;
  });
  return best;
}

/**
 * ヒートマップ行列。縦=児童、横=本時。セル=評価記号 or null。
 * @param {Object[]} records 評価記録(単元で絞ってから渡すのが望ましい)
 * @param {Object[]} students [{児童ID,番号,表示名}] 表示順
 * @param {Object[]} lessons  [{本時ID,第何時}] 列順
 * @param {Object} opts { 観点? }
 * @return {Object} { 列:[{本時ID,第何時}], 行:[{児童ID,番号,表示名,セル:[記号|null]}] }
 */
function calcHeatmapMatrix(records, students, lessons, opts) {
  opts = opts || {};
  var idx = _indexBest(_latest(records));
  var 行 = students.map(function (s) {
    var sid = s['児童ID'];
    var cells = lessons.map(function (l) {
      var cell = _pickCell(idx[sid] && idx[sid][l['本時ID']], opts);
      return cell ? cell['評価'] : null;
    });
    return { '児童ID': sid, '番号': s['番号'], '表示名': s['表示名'], 'セル': cells };
  });
  return { '列': lessons.map(function (l) { return { '本時ID': l['本時ID'], '第何時': l['第何時'] }; }), '行': 行 };
}

/**
 * 抽出リスト。条件に該当する児童とその理由を返す。
 * @param {Object} cond { 未評価:bool, 連続△:number|null, ◎ゼロ観点:bool, 観点?, 記号? }
 * @return {Object[]} [{児童ID,表示名,理由:[string]}]
 */
function calcExtraction(records, students, lessons, cond) {
  cond = cond || {};
  var sym = (cond['記号'] && cond['記号'].length === 3) ? cond['記号'] : SYM;
  var need = sym[2], good = sym[0];
  var idx = _indexBest(_latest(records));
  var lessonOrder = lessons.slice().sort(function (a, b) { return (a['第何時'] || 0) - (b['第何時'] || 0); });
  var kantens = _unitKantens(records);

  var out = [];
  students.forEach(function (s) {
    var sid = s['児童ID'], reasons = [];
    var sIdx = idx[sid] || {};
    var anyEval = Object.keys(sIdx).length > 0;

    if (cond['未評価'] && !anyEval) reasons.push('この単元で未評価');

    if (cond['連続△'] && anyEval) {
      kantens.forEach(function (kn) {
        var seq = lessonOrder.map(function (l) {
          var c = sIdx[l['本時ID']] && sIdx[l['本時ID']][kn];
          return c ? c['評価'] : null;
        }).filter(function (v) { return v !== null; });
        var run = 0, maxRun = 0;
        seq.forEach(function (v) { run = (v === need) ? run + 1 : 0; maxRun = Math.max(maxRun, run); });
        if (maxRun >= cond['連続△']) reasons.push(need + 'が' + maxRun + '回連続(' + kn + ')');
      });
    }

    if (cond['◎ゼロ観点'] && anyEval) {
      kantens.forEach(function (kn) {
        var evals = lessonOrder.map(function (l) { return sIdx[l['本時ID']] && sIdx[l['本時ID']][kn]; }).filter(Boolean);
        if (evals.length && !evals.some(function (r) { return r['評価'] === good; })) {
          reasons.push(good + 'が一度もない観点: ' + kn);
        }
      });
    }

    if (reasons.length) out.push({ '児童ID': sid, '表示名': s['表示名'], '理由': reasons });
  });
  return out;
}

/** 記録に現れる観点の一覧(知・思・主の順で安定化)。 */
function _unitKantens(records) {
  var set = {};
  records.forEach(function (r) { if (normStrLite(r['観点']) !== '') set[r['観点']] = true; });
  return ['知', '思', '主'].filter(function (k) { return set[k]; })
    .concat(Object.keys(set).filter(function (k) { return ['知', '思', '主'].indexOf(k) === -1; }));
}
function normStrLite(v) { return v == null ? '' : String(v).trim(); }

/** 記号→スコア(◎3/○2/△1)。設定で係数変更可(mapping渡し)。 */
function symToScore(sym, symbols, mapping) {
  var S = symbols || SYM, M = mapping || SCORE;
  if (sym === S[0]) return M.good;
  if (sym === S[1]) return M.ok;
  if (sym === S[2]) return M.need;
  return null;
}

/**
 * 児童ごとの形成的評価スコア(0..1に正規化した平均)。
 * @return {Object} { 児童ID: {平均:0..1, 件数} }
 */
function calcFormativeScore(records, students, symbols, mapping) {
  var best = _latest(records);
  var acc = {};
  Object.keys(best).forEach(function (k) {
    var r = best[k], v = symToScore(r['評価'], symbols, mapping);
    if (v == null) return;
    var sid = r['児童ID'];
    (acc[sid] = acc[sid] || { sum: 0, n: 0 });
    acc[sid].sum += v; acc[sid].n += 1;
  });
  var out = {};
  var maxV = (mapping || SCORE).good;
  students.forEach(function (s) {
    var a = acc[s['児童ID']];
    out[s['児童ID']] = a ? { '平均': +(a.sum / a.n / maxV).toFixed(3), '件数': a.n } : { '平均': null, '件数': 0 };
  });
  return out;
}

/**
 * 形成的評価×テストの相関用データ。
 * @param {Object} formative calcFormativeScore の結果
 * @param {Object[]} tests テスト点数行 [{児童ID,点_知識技能,満点_知識技能,点_思考判断表現,満点_思考判断表現}]
 * @return {Object[]} [{児童ID,形成的,テスト率,ずれ}] (両方揃う児童のみ)
 */
function calcCorrelation(formative, tests) {
  var byId = {};
  tests.forEach(function (t) {
    var got = (num_(t['点_知識技能']) || 0) + (num_(t['点_思考判断表現']) || 0);
    var full = (num_(t['満点_知識技能']) || 0) + (num_(t['満点_思考判断表現']) || 0);
    if (full > 0) byId[normStrLite(t['児童ID'])] = got / full;
  });
  var out = [];
  Object.keys(formative).forEach(function (sid) {
    var f = formative[sid]['平均'];
    var tr = byId[sid];
    if (f == null || tr == null) return;
    out.push({ '児童ID': sid, '形成的': f, 'テスト率': +tr.toFixed(3), 'ずれ': +(f - tr).toFixed(3) });
  });
  return out;
}
function num_(v) { var n = Number(v); return isNaN(n) ? null : n; }

/**
 * 所見用整理(ルールベース)。児童1人分の要約を作る。
 * @return {Object} { 観点別:{観点:{◎,○,△}}, ◎エピソード:[{日時,めあて,メモ}], △が続いた:[string], 変容:string }
 */
function calcShokenForStudent(records, sid, lessons, symbols) {
  var S = symbols || SYM;
  var mine = records.filter(function (r) { return normStrLite(r['児童ID']) === normStrLite(sid); });
  var best = _latest(mine);
  var lessonMe = {}; lessons.forEach(function (l) { lessonMe[l['本時ID']] = l; });

  var 観点別 = {};
  var episodes = [];
  Object.keys(best).forEach(function (k) {
    var r = best[k], kn = r['観点'], ev = r['評価'];
    var b = (観点別[kn] = 観点別[kn] || { '◎': 0, '○': 0, '△': 0 });
    if (ev === S[0]) b['◎']++; else if (ev === S[1]) b['○']++; else if (ev === S[2]) b['△']++;
    if (ev === S[0] && normStrLite(r['メモ']) !== '') {
      var lm = lessonMe[r['本時ID']];
      episodes.push({ '日時': r['記録日時'], 'めあて': lm ? lm['本時のめあて'] || lm['めあて'] || '' : '', 'メモ': r['メモ'] });
    }
  });
  episodes.sort(function (a, b) { return String(b['日時']).localeCompare(String(a['日時'])); });

  // △が続いた観点(3回以上連続)
  var lessonOrder = lessons.slice().sort(function (a, b) { return (a['第何時'] || 0) - (b['第何時'] || 0); });
  var idx = _indexBest(best);
  var 続いた = [];
  _unitKantens(mine).forEach(function (kn) {
    var seq = lessonOrder.map(function (l) { var c = idx[sid] && idx[sid][l['本時ID']] && idx[sid][l['本時ID']][kn]; return c ? c['評価'] : null; }).filter(function (v) { return v !== null; });
    var run = 0, maxRun = 0; seq.forEach(function (v) { run = (v === S[2]) ? run + 1 : 0; maxRun = Math.max(maxRun, run); });
    if (maxRun >= 3) 続いた.push(kn + 'で' + S[2] + 'が' + maxRun + '回続いた');
  });

  return { '観点別': 観点別, '◎エピソード': episodes.slice(0, 5), '△が続いた': 続いた };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    calcHeatmapMatrix: calcHeatmapMatrix, calcExtraction: calcExtraction,
    calcFormativeScore: calcFormativeScore, calcCorrelation: calcCorrelation,
    calcShokenForStudent: calcShokenForStudent, symToScore: symToScore,
  };
}

</script>
<script>
