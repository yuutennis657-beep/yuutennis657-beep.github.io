  // 教師発言(児童ID=TEACHER)は児童集計から除外(教師ログOFF時はそもそも存在しないので従来と一致・11 §4.1)
  var valid = logs.filter(function (r) {
    return r['状態'] === '有効' && !cancelled[String(r['ログID'])] && r['発言種類'] !== STAGE_MARK && String(r['児童ID']) !== KAIGI_TEACHER_ID;
  });
  var byStudent = {};
  valid.forEach(function (r) {
    var sid = r['児童ID'], t = r['発言種類'] || '発言';
    var b = (byStudent[sid] = byStudent[sid] || { 計: 0, 内訳: {} });
    b.内訳[t] = (b.内訳[t] || 0) + 1; b.計 += 1;
  });
  var 行 = students.map(function (s) {
    var b = byStudent[s['児童ID']] || { 計: 0, 内訳: {} };
    return { '児童ID': s['児童ID'], '表示名': s['表示名'], '内訳': b.内訳, '計': b.計 };
  });
  // 発言0回の子から欠席児童を除外(欠席指定なしなら従来と一致)
  var ゼロ = 行.filter(function (r) { return r['計'] === 0 && !absent[String(r['児童ID'])]; }).map(function (r) { return { '児童ID': r['児童ID'], '表示名': r['表示名'] }; });
  return { '種類': types, '行': 行, '発言ゼロ': ゼロ, '総発言数': valid.length };
}

/**
 * よさスタンプ集計(児童別内訳)+ メモつきエピソード。
 * @param {Object[]} records よさ記録行(文脈で絞ってから渡す)
 * @param {Object[]} students
 * @param {string[]} stamps スタンプの並び
 */
function calcYosaSummary(records, students, stamps) {
  var cancelled = _cancelledIds(records, '記録ID');
  var valid = records.filter(function (r) { return r['状態'] === '有効' && !cancelled[String(r['記録ID'])]; });
  var byStudent = {};
  var episodes = [];
  valid.forEach(function (r) {
    var sid = r['児童ID'];
    var b = (byStudent[sid] = byStudent[sid] || {});
    b[r['スタンプ']] = (b[r['スタンプ']] || 0) + 1;
    if (r['メモ'] && String(r['メモ']).trim() !== '') episodes.push({ '児童ID': sid, 'スタンプ': r['スタンプ'], 'メモ': r['メモ'], '日時': r['日時'] });
  });
  var 行 = students.map(function (s) { return { '児童ID': s['児童ID'], '表示名': s['表示名'], '内訳': byStudent[s['児童ID']] || {} }; })
    .filter(function (r) { return Object.keys(r['内訳']).length > 0; });
  return { 'スタンプ': stamps, '行': 行, 'エピソード': episodes, '総数': valid.length };
}

/**
 * 話合いの流れ(時系列)。段階マーカーで区切った発言の並びを返す。
 * @return {Object[]} [{日時,段階,児童ID,発言種類,メモ}] 日時昇順(発言のみ)
 */
function calcFlow(logs) {
  var cancelled = _cancelledIds(logs, 'ログID');
  return logs.filter(function (r) {
    return r['状態'] === '有効' && !cancelled[String(r['ログID'])] && r['発言種類'] !== STAGE_MARK && String(r['児童ID']) !== KAIGI_TEACHER_ID;
  }).slice().sort(function (a, b) { return String(a['日時']).localeCompare(String(b['日時'])); })
    .map(function (r) { return { 'ログID': r['ログID'], '日時': r['日時'], '段階': r['段階'], '児童ID': r['児童ID'], '発言種類': r['発言種類'], 'メモ': r['メモ'] || '', 'つながり先児童ID': r['つながり先児童ID'] || '' }; });
}

/**
 * よさ記録の流れ(時系列・有効なものだけ)。ライブ画面の「流れ」に発言と混ぜて出す(設計20 §8.2)。
 * @return {Object[]} [{記録ID,日時,児童ID,スタンプ,メモ,つながり先児童ID}] 日時昇順
 */
function calcYosaFlow(records) {
  var cancelled = _cancelledIds(records || [], '記録ID');
  return (records || []).filter(function (r) {
    return r['状態'] === '有効' && !cancelled[String(r['記録ID'])];
  }).slice().sort(function (a, b) { return String(a['日時']).localeCompare(String(b['日時'])); })
    .map(function (r) {
      return { '記録ID': r['記録ID'], '日時': r['日時'], '児童ID': r['児童ID'], 'スタンプ': r['スタンプ'],
        'メモ': r['メモ'] || '', 'つながり先児童ID': r['つながり先児童ID'] || '' };
    });
}

/** 'a,b, ,c' → ['a','b','c'](空・前後空白を落とす)。つながり先児童IDの分解に使う。 */
function _splitIds(v) {
  return String(v == null ? '' : v).split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s !== ''; });
}

/**
 * 子ども同士の「つながり」を集計(設計05 §2 拡張・相手に向く発言のつなぎ先)。
 * 発言ログの『つながり先児童ID』(カンマ区切り)を、from(発言者)→to(相手) の有向エッジに畳む。
 * 取消・段階マーカー・教師は除外。自分→自分は無視。
 * @param {Object[]} logs 発言ログ行(取消行含む生ログ)。よさ記録にも使える(opts.idCol='記録ID')。
 * @param {Object} [opts] { idCol:'ログID'|'記録ID' } 追記ログのID列。よさ記録は '記録ID'(設計20 §5)
 * @return {{エッジ:Array<{from:string,to:string,count:number}>, 児童:Object}}
 *   児童[sid] = { out:[{児童ID,count}]desc, in:[{児童ID,count}]desc, 出計, 入計 }
 */
function calcTsunagari(logs, opts) {
  var idCol = (opts && opts['idCol']) || 'ログID';
  var cancelled = _cancelledIds(logs || [], idCol);
  var edgeMap = {}, out = {}, inc = {};
  (logs || []).forEach(function (r) {
    if (r['状態'] !== '有効' || cancelled[String(r[idCol])] || r['発言種類'] === STAGE_MARK) return;
    var from = String(r['児童ID'] == null ? '' : r['児童ID']);
    if (from === '' || from === KAIGI_TEACHER_ID) return;
    _splitIds(r['つながり先児童ID']).forEach(function (to) {
      if (to === '' || to === from) return;
      edgeMap[from + '|' + to] = (edgeMap[from + '|' + to] || 0) + 1;
      (out[from] = out[from] || {})[to] = (out[from][to] || 0) + 1;
      (inc[to] = inc[to] || {})[from] = (inc[to][from] || 0) + 1;
    });
  });
  var エッジ = Object.keys(edgeMap).map(function (k) {
    var p = k.split('|'); return { from: p[0], to: p[1], count: edgeMap[k] };
  }).sort(function (a, b) { return b.count - a.count; });
  function toList(m) {
    return Object.keys(m || {}).map(function (sid) { return { '児童ID': sid, 'count': m[sid] }; })
      .sort(function (a, b) { return b.count - a.count; });
  }
  var allSids = {}, 児童 = {};
  Object.keys(out).forEach(function (s) { allSids[s] = true; });
  Object.keys(inc).forEach(function (s) { allSids[s] = true; });
  Object.keys(allSids).forEach(function (sid) {
    var ol = toList(out[sid]), il = toList(inc[sid]);
    var sum = function (a, x) { return a + x.count; };
    児童[sid] = { 'out': ol, 'in': il, '出計': ol.reduce(sum, 0), '入計': il.reduce(sum, 0) };
  });
  return { 'エッジ': エッジ, '児童': 児童 };
}

/**
 * 児童1人の特別活動まとめ(所見・児童別ページ用)。M4b。
 * @param {Object[]} logs 発言ログ(全件)
 * @param {Object[]} yosa よさ記録(全件・国語/学級会両方でよい)
 * @param {Object[]} roleRows 学級会役割 行
 * @param {string} childId
 * @return {Object} { 役割:[{役割,回数}], 発言:{種類:n}, 発言計, よさ:{スタンプ:n}, よさエピソード:[{スタンプ,メモ,日時}] }
 */
function calcTokkatsuForStudent(logs, yosa, roleRows, childId) {
  var lc = _cancelledIds(logs, 'ログID');
  var myLogs = logs.filter(function (r) {
    return String(r['児童ID']) === String(childId) && r['状態'] === '有効' && !lc[String(r['ログID'])] && r['発言種類'] !== STAGE_MARK;
  });
  var 発言 = {}, 発言計 = 0;
  myLogs.forEach(function (r) { var t = r['発言種類'] || '発言'; 発言[t] = (発言[t] || 0) + 1; 発言計++; });

  var yc = _cancelledIds(yosa, '記録ID');
  var myYosa = yosa.filter(function (r) { return String(r['児童ID']) === String(childId) && r['状態'] === '有効' && !yc[String(r['記録ID'])]; });
  var よさ = {}, epi = [];
  myYosa.forEach(function (r) { よさ[r['スタンプ']] = (よさ[r['スタンプ']] || 0) + 1; if (r['メモ'] && String(r['メモ']).trim() !== '') epi.push({ 'スタンプ': r['スタンプ'], 'メモ': r['メモ'], '日時': r['日時'] }); });

  var roleCount = {};
  (roleRows || []).forEach(function (r) { if (String(r['児童ID']) === String(childId)) { var rl = r['役割']; roleCount[rl] = (roleCount[rl] || 0) + 1; } });
  var 役割 = Object.keys(roleCount).map(function (k) { return { '役割': k, '回数': roleCount[k] }; });

  return { '役割': 役割, '発言': 発言, '発言計': 発言計, 'よさ': よさ, 'よさエピソード': epi };
}

/* ============ M4c: 話合いの質(担任の見取り・設計11 §4) ============ */

/** 発言種類マスタ → 種類ごとの {視点,種別,スルー}。視点空=個人的思考・種別空=児童(防御的)。 */
function _typeMap(typeMaster) {
  var m = {};
  (typeMaster || []).forEach(function (t) {
    var name = String(t['種類'] == null ? '' : t['種類']);
    var v = String(t['質の視点'] == null ? '' : t['質の視点']);
    m[name] = {
      視点: v === '' ? '個人的思考' : v,
      種別: String(t['種別'] == null || t['種別'] === '' ? '児童' : t['種別']),
      スルー: String(t['スルー対象'] == null ? '' : t['スルー対象']) === '○',
    };
  });
  return m;
}
function _viewOf(m, kind) { var d = m[String(kind == null ? '' : kind)]; return d ? d.視点 : '個人的思考'; }

/**
 * 話合いの質の指標(設計11 §2/§4.1)。◎○△を使わない・分母0はnull。
 * @param logs 発言ログ(対象議題で絞済み・取消行含む生ログ)
 * @param yosa よさ記録(同上)
 * @param students 在籍 [{児童ID,表示名}]
 * @param typeMaster 発言種類マスタ行(質の視点・種別・スルー対象)
 * @param stampMaster よさスタンプマスタ行(共生集計)
 * @param opts { 欠席児童ID:[], スルー除外ログID:[], 教師ログ:boolean }
 */
function calcShitsu(logs, yosa, students, typeMaster, stampMaster, opts) {
  opts = opts || {};
  var teacherOn = !!opts['教師ログ'];
  var absent = {}; (opts['欠席児童ID'] || []).forEach(function (id) { absent[String(id)] = true; });
  var exclude = {}; (opts['スルー除外ログID'] || []).forEach(function (id) { exclude[String(id)] = true; });
  var tmap = _typeMap(typeMaster);
  var kyoseiStamp = {};
  (stampMaster || []).forEach(function (s) { if (String(s['共生集計']) === '○') kyoseiStamp[String(s['スタンプ'])] = true; });

  var cancelled = _cancelledIds(logs, 'ログID');
  var valid = (logs || []).filter(function (r) { return r['状態'] === '有効' && !cancelled[String(r['ログID'])] && r['発言種類'] !== STAGE_MARK; });
  var childLogs = valid.filter(function (r) { return String(r['児童ID']) !== KAIGI_TEACHER_ID; });
  var teacherLogs = valid.filter(function (r) { return String(r['児童ID']) === KAIGI_TEACHER_ID; });

  var 出席数 = (students || []).filter(function (s) { return !absent[String(s['児童ID'])]; }).length;
  var speakerSet = {};
  childLogs.forEach(function (r) { if (!absent[String(r['児童ID'])]) speakerSet[String(r['児童ID'])] = true; });
  var 発言者数 = Object.keys(speakerSet).length;

  // 児童発言(率用: 視点≠対象外。進行を除く)
  var rateLogs = childLogs.filter(function (r) { return _viewOf(tmap, r['発言種類']) !== '対象外'; });
  var 児童発言数 = rateLogs.length;       // rateBase
  var 児童発言計 = childLogs.length;       // 進行含む(発言比用)

  var cnt = { 'つながり': 0, '質的改善': 0, '共生的思考': 0, '個人的思考': 0 };
  rateLogs.forEach(function (r) { var v = _viewOf(tmap, r['発言種類']); if (cnt[v] === undefined) v = '個人的思考'; cnt[v]++; });

  var yc = _cancelledIds(yosa, '記録ID');
  var validYosa = (yosa || []).filter(function (r) { return r['状態'] === '有効' && !yc[String(r['記録ID'])]; });
  var 対象よさ数 = validYosa.filter(function (r) { return kyoseiStamp[String(r['スタンプ'])]; }).length;

  // よりよい人間関係形成(設計20 §9.1): つながり先のあるよさ記録に関わった実人数 ÷ 出席児童数。
  // した子と相手の【両方】を数える(人間関係は2人以上で成り立つ。片方だけでは「広がり」が見えない)。
  // 同じ子は1回だけ。相手なしのよさ記録は数えない。0件なら null(画面は「—」。0%とは出さない)。
  var 関係者 = {}, つながりよさ数 = 0;
  validYosa.forEach(function (r) {
    var from = String(r['児童ID'] == null ? '' : r['児童ID']);
    var tos = _splitIds(r['つながり先児童ID']).filter(function (t) { return t !== from; });
    if (from === '' || !tos.length) return;
    つながりよさ数++;
    if (!absent[from]) 関係者[from] = true;
    tos.forEach(function (t) { if (!absent[t]) 関係者[t] = true; });
  });
  var 人間関係人数 = Object.keys(関係者).length;

  // ノースルー(自動近似 §4.2): 対象(スルー対象=○)ごとに、次の対象までに反応系(つながり/質的改善)があるか
  var targets = childLogs.filter(function (r) { var d = tmap[String(r['発言種類'])]; return d && d.スルー; })
    .slice().sort(function (a, b) { return String(a['日時']).localeCompare(String(b['日時'])); });
  var reactTimes = rateLogs.filter(function (r) { var v = _viewOf(tmap, r['発言種類']); return v === 'つながり' || v === '質的改善'; })
    .map(function (r) { return String(r['日時']); }).sort();
  var 触れた = 0, 候補 = [];
  targets.forEach(function (t, i) {
    var t0 = String(t['日時']);
    var next = (i + 1 < targets.length) ? String(targets[i + 1]['日時']) : null;
    var reacted = reactTimes.some(function (rt) { return rt > t0 && (next === null || rt <= next); });
    if (reacted) { 触れた++; return; }  // 自動判定で反応あり → 候補にしない
    // 自動判定では反応なし → スルー候補。先生が除外(反応あり扱い)したものは触れた扱い+除外済フラグで一覧に残す
    var isExcl = !!exclude[String(t['ログID'])];
    if (isExcl) 触れた++;
    候補.push({ 'ログID': String(t['ログID']), '児童ID': String(t['児童ID']), '発言種類': String(t['発言種類']), '日時': t0, '段階': String(t['段階'] || ''), '除外済': isExcl });
  });
  var 対象数 = targets.length;

  function rate(num, den) { return den > 0 ? num / den : null; }
  var 指標 = {
    '発言参加率': rate(発言者数, 出席数),
    'つながり率': rate(cnt['つながり'], 児童発言数),
    '質的改善率': rate(cnt['質的改善'], 児童発言数),
    'ノースルー率': rate(触れた, 対象数),
    '共生的思考率': rate(cnt['共生的思考'] + 対象よさ数, 児童発言数 + 対象よさ数),
    // 6つ目(設計20 §9)。つながりのあるよさ記録が0件なら null(0%にしない)
    '人間関係形成率': つながりよさ数 > 0 ? rate(人間関係人数, 出席数) : null,
    '児童発言比': teacherOn ? rate(児童発言計, 児童発言計 + teacherLogs.length) : null,
  };
  var 分母分子 = {
    '発言参加率': { '分子': 発言者数, '分母': 出席数 },
    'つながり率': { '分子': cnt['つながり'], '分母': 児童発言数 },
    '質的改善率': { '分子': cnt['質的改善'], '分母': 児童発言数 },
    'ノースルー率': { '分子': 触れた, '分母': 対象数 },
    '共生的思考率': { '分子': cnt['共生的思考'] + 対象よさ数, '分母': 児童発言数 + 対象よさ数 },
    '人間関係形成率': { '分子': 人間関係人数, '分母': 出席数 },
    '児童発言比': { '分子': 児童発言計, '分母': 児童発言計 + teacherLogs.length },
  };
  // 視点構成(排他分類・率合計=1・児童発言>0のとき)
  var 視点構成 = ['つながり', '質的改善', '共生的思考', '個人的思考'].map(function (v) {
    return { '視点': v, '件数': cnt[v], '率': 児童発言数 > 0 ? cnt[v] / 児童発言数 : null };
  });
  // 教師内訳(教師ログONのみ・マスタ順)
  var 教師内訳 = null;
  if (teacherOn) {
    var byKind = {};
    teacherLogs.forEach(function (r) { var k = String(r['発言種類'] || '発言'); byKind[k] = (byKind[k] || 0) + 1; });
    var order = (typeMaster || []).filter(function (t) { return String(t['種別']) === '教師'; }).map(function (t) { return String(t['種類']); });
    var seen = {};
    教師内訳 = order.map(function (k) { seen[k] = true; return { '種類': k, '件数': byKind[k] || 0, '率': teacherLogs.length > 0 ? (byKind[k] || 0) / teacherLogs.length : null }; });
    Object.keys(byKind).forEach(function (k) { if (!seen[k]) 教師内訳.push({ '種類': k, '件数': byKind[k], '率': teacherLogs.length > 0 ? byKind[k] / teacherLogs.length : null }); });
  }

  return {
    '指標': 指標, '分母分子': 分母分子, '視点構成': 視点構成, 'スルー候補': 候補, '教師内訳': 教師内訳,
    '発言者数': 発言者数, '出席数': 出席数, '児童発言数': 児童発言数, '児童発言計': 児童発言計,
    '教師発言数': teacherLogs.length, '対象よさ数': 対象よさ数,
    '人間関係人数': 人間関係人数, 'つながりよさ数': つながりよさ数,
  };
}

/**
 * 前回比較(設計11 §2.2/§4.3)。+5pt以上=↑ / −5pt以下=↓ / それ以外=→。片側nullは矢印null。
 * @param prev,cur calcShitsu().指標 相当のオブジェクト(または null)
 */
function calcShitsuTrend(prev, cur) {
  var keys = ['発言参加率', 'つながり率', '質的改善率', 'ノースルー率', '共生的思考率', '人間関係形成率'];
  var out = {};
  keys.forEach(function (k) {
    var p = prev ? prev[k] : null, c = cur ? cur[k] : null;
    if (p == null || c == null) { out[k] = { '前回値': (p == null ? null : p), '今回値': (c == null ? null : c), '差': null, '矢印': null }; return; }
    // 差は表示と同じ0.1pt丸めで判定(浮動小数点誤差で 0.25-0.20 が4.999...になるのを防ぐ)
    var 差 = Math.round((c - p) * 1000) / 10;
    var arrow = 差 >= 5 ? '↑' : (差 <= -5 ? '↓' : '→');
    out[k] = { '前回値': p, '今回値': c, '差': 差, '矢印': arrow };
  });
  return out;
}

/**
 * 終末の助言メモ(会の終わりに担任が話す材料)。設計05 §2 操作設計。
 * 「どんなことを言ったか(発言メモ)」と「行動の価値(よさの記述)」だけを児童ごとに束ねる。
 * 数値ではなく“具体の言葉”を並べるのが目的なので、記述のある子を上に出す。
 * @param {Object[]} logs 発言ログ(その議題のみ)
 * @param {Object[]} yosa よさ記録(その議題のみ)
 * @param {Object[]} students [{児童ID,番号,表示名}]
 * @param {Object} opts {欠席児童ID:[]}
 * @return {Object} { 語り:[{児童ID,表示名,発言数,よさ数,具体:[{種別,ラベル,記述,時刻,段階}]}],
 *                    記述なし:[{児童ID,表示名,発言数}], 発言ゼロ:[{児童ID,表示名}],
 *                    件数:{具体,発言メモ,よさ記述} }
 */
function calcKatari(logs, yosa, students, opts) {
  opts = opts || {};
  var absent = {}; (opts['欠席児童ID'] || []).forEach(function (id) { absent[String(id)] = true; });
  var order = {}, nameById = {};
  students.forEach(function (s, i) { order[s['児童ID']] = i; nameById[s['児童ID']] = s['表示名']; });
  var lc = _cancelledIds(logs, 'ログID'), yc = _cancelledIds(yosa, '記録ID');
  var by = {};
  function slot(sid) {
    return by[sid] || (by[sid] = { '児童ID': sid, '表示名': nameById[sid] || sid, '発言数': 0, 'よさ数': 0, '具体': [] });
  }
  function hhmm(dt) { var m = String(dt == null ? '' : dt).match(/(\d{1,2}):(\d{2})/); return m ? (m[1] + ':' + m[2]) : ''; }
  var 発言メモ数 = 0, よさ記述数 = 0;

  logs.filter(function (r) {
    return r['状態'] === '有効' && !lc[String(r['ログID'])] && r['発言種類'] !== STAGE_MARK &&
      String(r['児童ID']) !== KAIGI_TEACHER_ID && nameById[r['児童ID']] !== undefined;
  }).slice().sort(function (a, b) { return String(a['日時']).localeCompare(String(b['日時'])); })
    .forEach(function (r) {
      var b = slot(r['児童ID']); b['発言数'] += 1;
      var memo = String(r['メモ'] == null ? '' : r['メモ']).trim();
      if (memo) {
        発言メモ数 += 1;
        b['具体'].push({ '種別': '発言', 'ラベル': r['発言種類'] || '発言', '記述': memo, '時刻': hhmm(r['日時']), '段階': r['段階'] || '' });
      }
    });

  yosa.filter(function (r) {
    return r['状態'] === '有効' && !yc[String(r['記録ID'])] && nameById[r['児童ID']] !== undefined;
  }).slice().sort(function (a, b) { return String(a['日時']).localeCompare(String(b['日時'])); })
    .forEach(function (r) {
      var b = slot(r['児童ID']); b['よさ数'] += 1;
      var memo = String(r['メモ'] == null ? '' : r['メモ']).trim();
      if (memo) {
        よさ記述数 += 1;
        b['具体'].push({ '種別': 'よさ', 'ラベル': r['スタンプ'] || 'よさ', '記述': memo, '時刻': hhmm(r['日時']), '段階': '' });
      }
    });

  var all = Object.keys(by).map(function (sid) { return by[sid]; })
    .filter(function (b) { return !absent[String(b['児童ID'])]; });
  var 語り = all.filter(function (b) { return b['具体'].length > 0; })
    .sort(function (a, b) {
      if (b['具体'].length !== a['具体'].length) return b['具体'].length - a['具体'].length;
      return (order[a['児童ID']] || 0) - (order[b['児童ID']] || 0);
    });
  var 記述なし = all.filter(function (b) { return b['具体'].length === 0; })
    .sort(function (a, b) { return (order[a['児童ID']] || 0) - (order[b['児童ID']] || 0); })
    .map(function (b) { return { '児童ID': b['児童ID'], '表示名': b['表示名'], '発言数': b['発言数'] }; });
  var ゼロ = students.filter(function (s) {
    return !absent[String(s['児童ID'])] && !(by[s['児童ID']] && by[s['児童ID']]['発言数'] > 0);
  }).map(function (s) { return { '児童ID': s['児童ID'], '表示名': s['表示名'] }; });

  return {
    '語り': 語り, '記述なし': 記述なし, '発言ゼロ': ゼロ,
    '件数': { '具体': 発言メモ数 + よさ記述数, '発言メモ': 発言メモ数, 'よさ記述': よさ記述数 },
  };
}

/* ===================================================================
 * 学級会の歩み(蓄積・可視化)。設計17。すべて純関数(副作用なし・Nodeテスト可)。
 * 「良かった点/課題点/重点」を会をまたいで積み上げ、一連の学習過程を可視化する。
 * =================================================================== */

/** 自由記述を箇条に割る(先頭の「・-」空白を除去・空行捨て)。掲示/歩みの箇条書き化に使う。 */
function kaigiNoteList(text) {
  return String(text == null ? '' : text).split(/\n/)
    .map(function (s) { return s.replace(/^[・\-\s]+/, '').trim(); })
    .filter(function (s) { return s !== ''; });
}

/**
 * 学級会の歩み(タイムライン)を組む。設計17 §2。
 * 実施済の会を古い順に並べ、各会の良かった点/課題点を箇条化し、
 * 「前回の重点」を各会にひもづける(重点→次回に持ち越して意識するため)。
 * @param {Array<{議題ID,回,実施日,議題名,良かった点,課題点,重点,決まったこと}>} meetings 同一クラスの実施済の会(順不同)
 * @return {Array<{...同項目, 良かった点list:[], 課題点list:[], 前回重点:string, 前回議題名:string}>} 古い→新しい順
 */
function buildAyumiTimeline(meetings) {
  var arr = (meetings || []).slice().sort(function (a, b) {
    var da = String(a['実施日'] || ''), db = String(b['実施日'] || '');
    if (da !== db) return da.localeCompare(db);
    return String(a['議題ID'] || '').localeCompare(String(b['議題ID'] || ''));
  });
  return arr.map(function (m, i) {
    var prev = i > 0 ? arr[i - 1] : null;
    return {
      '議題ID': m['議題ID'], '回': (m['回'] === '' || m['回'] == null) ? null : m['回'],
      '実施日': m['実施日'] || '', '議題名': m['議題名'] || '',
      '決まったこと': m['決まったこと'] || '',
      '良かった点': m['良かった点'] || '', '課題点': m['課題点'] || '', '重点': m['重点'] || '',
      '良かった点list': kaigiNoteList(m['良かった点']),
      '課題点list': kaigiNoteList(m['課題点']),
      '前回重点': prev ? String(prev['重点'] || '') : '',
      '前回議題名': prev ? String(prev['議題名'] || '') : '',
    };
  });
}

/**
 * 質指標の推移をグラフ用に整形。設計17 §3。
 * @param {Array<{回,実施日,議題名,指標:{キー:0..1|null}}>} points 会ごとの指標(古い→新しい順で渡す)
 * @param {Array<[key,名称]>} keySpec 出す指標と表示名(掲示名称)。[['発言参加率','多くの人の意見を聞く'],...]
 * @return {{ラベル:[], 点:[{回,実施日,議題名}], 系列:[{キー,名称,値:[0..100|null], 直近:number|null}]}}
 *   値は%(0..100・四捨五入)。分母0はnull(線を切る)。
 */
function buildTrendSeries(points, keySpec) {
  points = points || [];
  var labels = points.map(function (p) { return (p['回'] === '' || p['回'] == null) ? String(p['実施日'] || '') : ('第' + p['回'] + '回'); });
  var 系列 = (keySpec || []).map(function (ks) {
    var key = ks[0], name = ks[1] || key;
    var vals = points.map(function (p) {
      var v = (p['指標'] || {})[key];
      return (v == null) ? null : Math.round(v * 100);
    });
    var last = null;
    for (var i = vals.length - 1; i >= 0; i--) { if (vals[i] != null) { last = vals[i]; break; } }
    return { 'キー': key, '名称': name, '値': vals, '直近': last };
  });
  return {
    'ラベル': labels,
    '点': points.map(function (p) { return { '回': (p['回'] === '' || p['回'] == null) ? null : p['回'], '実施日': p['実施日'] || '', '議題名': p['議題名'] || '' }; }),
    '系列': 系列,
  };
}

/* ============ M4f: 特別活動3観点の自動評価(設計18) ============ */

/** マスタ行 → {名前: 観点}。観点が空の行は入れない(=その記録は観点に紐づかない=参加としてだけ数える)。 */
function _kantenMap(rows, keyCol) {
  var m = {};
  (rows || []).forEach(function (r) {
    var name = String(r[keyCol] == null ? '' : r[keyCol]).trim();
    var kan = String(r['観点'] == null ? '' : r['観点']).trim();
    if (name !== '' && kan !== '') m[name] = kan;
  });
  return m;
}

/**
 * 会の記録(発言ログ・よさ記録・役割)から特別活動の3観点を自動で見立てる(設計18 §3)。
 *
 * 点の積み方(すべて opts で変えられる。観点の対応は発言種類マスタ/よさスタンプマスタの『観点』列が正):
 *   - 発言1件 = その種類の観点に1点(例: 賛成→特思・進行→特知)
 *   - よさ1件 = そのスタンプの観点に1点(例: 聴く→特主・折り合い→特思)
 *   - 司会グループの役割を担った = 役割観点(既定 特知)に 役割点(既定2)
 *   - 発言したこと自体 = 参加観点(既定 特主)に 発言数(参加上限=既定2 まで)
 * ◎=◎点以上 / ○=○点以上 / それ未満(=0点)は **評価をつけない**(空欄)。
 * ★根拠のない△を自動で残さない(先生決定 2026-08-25)。△は先生が振り返り画面でタップして付ける。
 * ★欠席の子は行に含めない。
 *
 * @return {Object} { 観点, 記号, 閾値, 行:[{児童ID,表示名,評価:{観点:記号},点:{},根拠:{},記録なし}], 評価人数, 記録なし人数 }
 */
function calcAutoHyoka(logs, yosa, students, typeMaster, stampMaster, roleRows, opts) {
  opts = opts || {};
  var syms = opts['記号'] && opts['記号'].length >= 2 ? opts['記号'] : ['◎', '○', '△'];
  var kans = opts['観点'] && opts['観点'].length ? opts['観点'] : ['特知', '特思', '特主'];
  var thHigh = _num(opts['◎点'], 3), thMid = _num(opts['○点'], 1);
  var rolePt = _num(opts['役割点'], 2), joinCap = _num(opts['参加上限'], 2);
  var roleKan = opts['役割観点'] || kans[0];
  var joinKan = opts['参加観点'] || kans[kans.length - 1];
  var absent = {}; (opts['欠席児童ID'] || []).forEach(function (id) { absent[String(id)] = true; });

  var typeKan = _kantenMap(typeMaster, '種類');
  var stampKan = _kantenMap(stampMaster, 'スタンプ');
  var lc = _cancelledIds(logs, 'ログID'), yc = _cancelledIds(yosa, '記録ID');

  var roleOf = {};
  (roleRows || []).forEach(function (r) {
    var v = String(r['役割'] == null ? '' : r['役割']).trim();
    if (v !== '') roleOf[String(r['児童ID'])] = v;
  });

  // sid → { 発言数, 件数:{観点:{ラベル:n}} }
  var acc = {};
  function bucket(sid) {
    if (!acc[sid]) { acc[sid] = { 発言数: 0, 件数: {} }; kans.forEach(function (k) { acc[sid].件数[k] = {}; }); }
    return acc[sid];
  }
  function add(sid, kan, label) {
    if (kans.indexOf(kan) < 0) return;               // マスタに知らない観点が入っていても壊れない
    var c = bucket(sid).件数[kan];
    c[label] = (c[label] || 0) + 1;
  }
  (logs || []).forEach(function (r) {
    if (r['状態'] !== '有効' || lc[String(r['ログID'])]) return;
    if (r['発言種類'] === STAGE_MARK) return;
    var sid = String(r['児童ID']);
    if (sid === '' || sid === KAIGI_TEACHER_ID || absent[sid]) return;
    var kind = String(r['発言種類'] == null || r['発言種類'] === '' ? '発言' : r['発言種類']);
    bucket(sid).発言数 += 1;
    if (typeKan[kind]) add(sid, typeKan[kind], kind);
  });
  (yosa || []).forEach(function (r) {
    if (r['状態'] !== '有効' || yc[String(r['記録ID'])]) return;
    var sid = String(r['児童ID']);
    if (sid === '' || absent[sid]) return;
    var st = String(r['スタンプ'] == null ? '' : r['スタンプ']);
    bucket(sid);
    if (stampKan[st]) add(sid, stampKan[st], st);
  });

  var 行 = [], 評価人数 = 0, 記録なし人数 = 0;
  (students || []).forEach(function (s) {
    var sid = String(s['児童ID']);
    if (absent[sid]) return;                          // 欠席は評価しない
    var b = acc[sid] || { 発言数: 0, 件数: {} };
    var 評価 = {}, 点 = {}, 根拠 = {}, any = false;
    kans.forEach(function (k) {
      var parts = [], p = 0;
      var c = b.件数[k] || {};
      Object.keys(c).forEach(function (label) { p += c[label]; parts.push(label + (c[label] > 1 ? '×' + c[label] : '')); });
      if (k === roleKan && roleOf[sid]) { p += rolePt; parts.unshift(roleOf[sid] + '(役割)'); }
      if (k === joinKan && b.発言数 > 0) {
        var jp = Math.min(b.発言数, joinCap);
        p += jp; parts.push('発言' + b.発言数 + '回');
      }
      点[k] = p;
      評価[k] = p >= thHigh ? syms[0] : (p >= thMid ? syms[1] : '');
      根拠[k] = parts.join('・');
      if (p > 0) any = true;
    });
    if (any) 評価人数++; else 記録なし人数++;
    行.push({ '児童ID': sid, '表示名': s['表示名'] || sid, '評価': 評価, '点': 点, '根拠': 根拠, '記録なし': !any, '発言数': b.発言数, '役割': roleOf[sid] || '' });
  });

  return { '観点': kans, '記号': syms, '閾値': { '◎点': thHigh, '○点': thMid, '役割点': rolePt, '参加上限': joinCap },
    '行': 行, '評価人数': 評価人数, '記録なし人数': 記録なし人数 };
}
/* ============================================================
   見取り設計書 v1.0 (2026-08-27) — 協調／獲得のバランス
   ------------------------------------------------------------
   ★★ これは評価尺度ではない(設計書 §4)。
      「獲得が多いほど良い」ではない。そう作ると自己主張の回数を稼ぐ授業になる。
      見たいのは多寡ではなく偏り。片側にしか立たないクラスは、どちらに寄っていても健全ではない。
   ★★ 層を混ぜない(設計書 §1)。
      行動の記録(低推論・数える・発言ログ)と よさの記録(高推論・解釈する・よさ記録)は
      別の推論の高さで取っている。混ぜた数字だけを返すと、査読で根拠を示せない。
      だから『層』別を必ず返し、『全体』は参考として添えるだけにする。
   ============================================================ */

/** ボタン名 -> ウェルビーイングの向き(協調/獲得)。マスタから作る(コードに直書きしない)。 */
function _mukiMap(rows, keyCol) {
  var m = {};
  (rows || []).forEach(function (r) {
    var name = String(r[keyCol] == null ? '' : r[keyCol]).trim();
    var v = String(r['ウェルビーイング'] == null ? '' : r['ウェルビーイング']).trim();
    if (name !== '' && (v === '協調' || v === '獲得')) m[name] = v;
  });
  return m;
}
/** ボタン名 -> 記録の場(途中/事後)。空は『途中』とみなす(移行前のシートでも動く)。 */
function _bamenMap(rows, keyCol) {
  var m = {};
  (rows || []).forEach(function (r) {
    var name = String(r[keyCol] == null ? '' : r[keyCol]).trim();
    if (name !== '') m[name] = String(r['記録の場'] == null ? '' : r['記録の場']).trim() || '途中';
  });
  return m;
}

/**
 * 協調／獲得のバランス(設計書 v1.0 §3・§4・§6)。
 * @param {Object[]} logs 発言ログ(その議題ぶん・取消行を含む生ログ)
 * @param {Object[]} yosa よさ記録(同上)
 * @param {Object[]} students 在籍 [{児童ID,表示名}]
 * @param {Object[]} typeMaster 発言種類マスタ行(ウェルビーイング・記録の場)
 * @param {Object[]} stampMaster よさスタンプマスタ行(同上)
 * @param {Object} [opts] { 欠席児童ID:[] }
 * @return {Object} {層:{行動,よさ}, 全体, 行:[], ゼロ:{}, ボタン別:[], 対象人数, 欠席人数}
 */
function calcMukiBalance(logs, yosa, students, typeMaster, stampMaster, opts) {
  opts = opts || {};
  var absent = {}; (opts['欠席児童ID'] || []).forEach(function (id) { absent[String(id)] = true; });
  var tMuki = _mukiMap(typeMaster, '種類'), sMuki = _mukiMap(stampMaster, 'スタンプ');
  var tBamen = _bamenMap(typeMaster, '種類'), sBamen = _bamenMap(stampMaster, 'スタンプ');

  var lCancel = _cancelledIds(logs || [], 'ログID');
  var yCancel = _cancelledIds(yosa || [], '記録ID');
  var vLogs = (logs || []).filter(function (r) {
    return r['状態'] === '有効' && !lCancel[String(r['ログID'])] &&
      r['発言種類'] !== STAGE_MARK && String(r['児童ID']) !== KAIGI_TEACHER_ID;
  });
  var vYosa = (yosa || []).filter(function (r) { return r['状態'] === '有効' && !yCancel[String(r['記録ID'])]; });

  // 集計の器。押した子(sid) -> {行動:{協調,獲得}, よさ:{協調,獲得}}
  var per = {};
  function cell(sid) {
    return (per[sid] = per[sid] || { '行動': { '協調': 0, '獲得': 0 }, 'よさ': { '協調': 0, '獲得': 0 } });
  }
  // ボタン別(§6 押されなかったことをデータにする)
  var btn = {};   // name -> {ボタン,層,向き,場,回数,押した児童:{}}
  function btnCell(name, layer, muki, bamen) {
    return (btn[name] = btn[name] || { 'ボタン': name, '層': layer, '向き': muki, '記録の場': bamen, '回数': 0, '人数': 0, '_who': {} });
  }
  // マスタにある「向きを持つボタン」は、1回も押されていなくても行を立てる(ゼロが所見になる)
  Object.keys(tMuki).forEach(function (n) { btnCell(n, '行動', tMuki[n], tBamen[n] || '途中'); });
  Object.keys(sMuki).forEach(function (n) { btnCell(n, 'よさ', sMuki[n], sBamen[n] || '途中'); });

  vLogs.forEach(function (r) {
    var kind = String(r['発言種類'] == null ? '' : r['発言種類']).trim();
    var sid = String(r['児童ID']);
    // ★25 §2.3: 宛先＝じぶん の発言は【機能を問わず】獲得として数える。
    //   『自分の願い』ボタンを廃して🔗じぶんにしたので、ここで拾わないと獲得が痩せ、
    //   ★22 §9 の主張(獲得的な行動が見取られていない)が測れなくなる。
    var self = _splitIds(r['つながり先児童ID']).indexOf(sid) >= 0;
    var muki = self ? '獲得' : tMuki[kind];
    if (!muki) return;                                   // 向きを持たないボタン(進行など)は数えない
    cell(sid)['行動'][muki]++;
    var b = btnCell(self ? (kind + '(じぶんから)') : kind, '行動', muki, tBamen[kind] || '途中');
    b['回数']++; b['_who'][sid] = true;
  });
  vYosa.forEach(function (r) {
    var st = String(r['スタンプ'] == null ? '' : r['スタンプ']).trim(), muki = sMuki[st];
    if (!muki) return;
    var sid = String(r['児童ID']);
    cell(sid)['よさ'][muki]++;
    var b = btnCell(st, 'よさ', muki, sBamen[st] || '途中');
    b['回数']++; b['_who'][sid] = true;
  });

  var target = (students || []).filter(function (s) { return !absent[String(s['児童ID'])]; });
  function ratio(kyo, kaku) { var d = kyo + kaku; return d > 0 ? kyo / d : null; }

  var sum = { '行動': { '協調': 0, '獲得': 0 }, 'よさ': { '協調': 0, '獲得': 0 } };
  var 行 = target.map(function (s) {
    var sid = String(s['児童ID']), c = per[sid] || { '行動': { '協調': 0, '獲得': 0 }, 'よさ': { '協調': 0, '獲得': 0 } };
    ['行動', 'よさ'].forEach(function (L) { sum[L]['協調'] += c[L]['協調']; sum[L]['獲得'] += c[L]['獲得']; });
    var kyo = c['行動']['協調'] + c['よさ']['協調'], kaku = c['行動']['獲得'] + c['よさ']['獲得'];
    return { '児童ID': sid, '表示名': s['表示名'] || sid,
      '行動': { '協調': c['行動']['協調'], '獲得': c['行動']['獲得'] },
      'よさ': { '協調': c['よさ']['協調'], '獲得': c['よさ']['獲得'] },
      '協調': kyo, '獲得': kaku, '計': kyo + kaku, '協調割合': ratio(kyo, kaku) };
  });

  function layer(L) {
    return { '協調': sum[L]['協調'], '獲得': sum[L]['獲得'], '計': sum[L]['協調'] + sum[L]['獲得'],
      '協調割合': ratio(sum[L]['協調'], sum[L]['獲得']) };
  }
  var 全体協調 = sum['行動']['協調'] + sum['よさ']['協調'];
  var 全体獲得 = sum['行動']['獲得'] + sum['よさ']['獲得'];

  // §6 ゼロもデータ。ただし「行動が無かった」のか「教師が見ていなかった」のかは区別できない。
  var ゼロ = { '協調': [], '獲得': [], '両方': [] };
  行.forEach(function (r) {
    var o = { '児童ID': r['児童ID'], '表示名': r['表示名'] };
    if (r['協調'] === 0 && r['獲得'] === 0) { ゼロ['両方'].push(o); return; }
    if (r['協調'] === 0) ゼロ['協調'].push(o);
    if (r['獲得'] === 0) ゼロ['獲得'].push(o);
  });

  var ボタン別 = Object.keys(btn).map(function (n) {
    var b = btn[n];
    var who = Object.keys(b['_who']).filter(function (sid) { return !absent[sid]; });
    return { 'ボタン': n, '層': b['層'], '向き': b['向き'], '記録の場': b['記録の場'],
      '回数': b['回数'], '人数': who.length, 'ゼロ人数': Math.max(0, target.length - who.length) };
  }).sort(function (a, b2) {
    if (a['層'] !== b2['層']) return a['層'] === '行動' ? -1 : 1;
    if (a['向き'] !== b2['向き']) return a['向き'] === '協調' ? -1 : 1;
    return b2['回数'] - a['回数'];
  });

  return {
    '層': { '行動': layer('行動'), 'よさ': layer('よさ') },
    '全体': { '協調': 全体協調, '獲得': 全体獲得, '計': 全体協調 + 全体獲得, '協調割合': ratio(全体協調, 全体獲得) },
    '行': 行, 'ゼロ': ゼロ, 'ボタン別': ボタン別,
    '対象人数': target.length, '欠席人数': (students || []).length - target.length,
  };
}

/* ===== 研究用の会の席(docs/29 §2.2) =====
   議題マスタ.研究_座席 に「番号:行,列」をセミコロン区切りで持つ(例 1:3,5;2:3,6)。
   ★名簿・座席表には書かない(26 の約束)。番号だけを持ち、児童IDは R-{議題ID}-{番号} で毎回組み直す。 */

/**
 * [{番号,行,列}] → 文字列。行・列が1未満の子(置き場)と番号の重複は書かない。番号順。
 * @param {Object[]} list
 * @return {string}
 */
function encodeKenkyuSeats(list) {
  var seen = {}, out = [];
  (list || []).forEach(function (p) {
    var no = Math.floor(Number(p && p['番号'])), r = Math.floor(Number(p && p['行'])), c = Math.floor(Number(p && p['列']));
    if (!(no >= 1) || !(r >= 1) || !(c >= 1) || seen[no]) return;
    seen[no] = true;
    out.push({ no: no, r: r, c: c });
  });
  out.sort(function (a, b) { return a.no - b.no; });
  return out.map(function (x) { return x.no + ':' + x.r + ',' + x.c; }).join(';');
}

/**
 * 文字列 → [{番号,行,列}]。先生がスプシを手で直しても壊れないように、読めない区切りは黙って飛ばす。
 * 全角の数字・コロン・カンマ、空白も許す。同じ番号が2度あれば後ろを採る。
 * @param {string} str
 * @return {Object[]}
 */
function decodeKenkyuSeats(str) {
  var s = String(str == null ? '' : str)
    .replace(/[０-９]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 0xFEE0); })
    .replace(/[：]/g, ':').replace(/[，、]/g, ',').replace(/[；]/g, ';').replace(/\s+/g, '');
  var byNo = {};
  s.split(';').forEach(function (part) {
    var m = /^(\d+):(\d+),(\d+)$/.exec(part);
    if (!m) return;
    var no = Number(m[1]), r = Number(m[2]), c = Number(m[3]);
    if (no >= 1 && r >= 1 && c >= 1) byNo[no] = { '番号': no, '行': r, '列': c };
  });
  return Object.keys(byNo).map(function (k) { return byNo[k]; }).sort(function (a, b) { return a['番号'] - b['番号']; });
}

function _num(v, def) { var n = Number(v); return (v === '' || v == null || isNaN(n)) ? def : n; }

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    calcSpeechDistribution: calcSpeechDistribution, calcYosaSummary: calcYosaSummary, calcFlow: calcFlow,
    calcYosaFlow: calcYosaFlow, calcTsunagari: calcTsunagari,
    calcTokkatsuForStudent: calcTokkatsuForStudent, STAGE_MARK: STAGE_MARK,
    calcShitsu: calcShitsu, calcShitsuTrend: calcShitsuTrend, KAIGI_TEACHER_ID: KAIGI_TEACHER_ID,
    calcKatari: calcKatari, calcAutoHyoka: calcAutoHyoka, calcMukiBalance: calcMukiBalance,
    kaigiNoteList: kaigiNoteList, buildAyumiTimeline: buildAyumiTimeline, buildTrendSeries: buildTrendSeries,
    encodeKenkyuSeats: encodeKenkyuSeats, decodeKenkyuSeats: decodeKenkyuSeats,
    cancelledIds: _cancelledIds,   // calc_mirror.js が使う(追記ログの取消行を落とす共通処理)
  };
}

<script>
/**
 * calc_mirror.js — 「見取りの鏡」の集計(純関数・副作用なし・Nodeでテスト可能)。
 *
 * ★このファイルだけ、分析の対象が児童ではない。【教師自身の見取り】である。
 *   見取り設計書 v1.0 §9:
 *     「協調的な行動ばかりが見取られ、獲得的な行動が見取られていないのではないか。
 *       原因は子どもではなく、教師が持っている見取りの枠のほうにある。」
 *   ヒートマップ・抽出・相関が「この子はどうか」を答えるのに対し、
 *   ここは「私の見取りはどうか」を答える。1年目=測る(§9 2年計画)の道具そのもの。
 *
 * ★数字はすべて「多い/少ない」ではなく【偏り】を見るためのもの(§4)。
 *   良し悪しの色をつけない。ゼロには必ず限界の一文を添える(§6)。
 *
 * 4つのレンズ:
 *   1. だれを見たか  … 児童ごとの記録件数の偏り(ジニ・上位/下位・半分占有・0件の子)
 *   2. 何で・いつ・どの観点で見たか … 評価方法/出どころ・授業開始からの経過・観点
 *   3. 協調／獲得    … 3モード(国語・道徳・学級会)を横断した向きの偏り(§3)
 *   4. 数えた／解釈した … 記録の二層構造(§1)を国語・道徳にも通す
 */
var _CK = (typeof calcMukiBalance === 'function')
  ? { calcMukiBalance: calcMukiBalance, cancelledIds: _cancelledIds,
      STAGE_MARK: STAGE_MARK, KAIGI_TEACHER_ID: KAIGI_TEACHER_ID }
  : (typeof require !== 'undefined' ? require('./calc_kaigi.js') : null);

/** 記録の出どころ(層の判定にも使う)。名前は画面にそのまま出る。 */
var MIRROR_SRC = { 評価: '評価(◎○△)', 発言: '発言', よさ: 'よさ', 道徳: '道徳' };
/** 授業開始からの経過を入れる帯。上限(分)と名前。 */
var MIRROR_BINS = [
  { 'max': 5, '名': '開始〜5分' }, { 'max': 15, '名': '5〜15分' }, { 'max': 25, '名': '15〜25分' },
  { 'max': 35, '名': '25〜35分' }, { 'max': Infinity, '名': '35分〜' },
];

function _mStr(v) { return v == null ? '' : String(v).trim(); }
function _mPct(a, b) { return b > 0 ? +(a / b).toFixed(4) : null; }

/** 'YYYY-MM-DD HH:MM:SS' → {日:'YYYY-MM-DD', 分:0..1439}。読めなければ null。 */
function mirrorTimeParts(dt) {
  var s = _mStr(dt);
  var m = s.match(/^(\d{4}-\d{2}-\d{2})[ T](\d{1,2}):(\d{2})/);
  if (!m) return null;
  return { '日': m[1], '分': Number(m[2]) * 60 + Number(m[3]) };
}

/**
 * ジニ係数(0=全員同じ件数, 1=1人に集中)。件数の配列を渡す。
 * ★「不平等の指標」だが、ここでは良し悪しではなく偏りの大きさを1つの数で言うために使う。
 */
function mirrorGini(counts) {
  var n = counts.length; if (!n) return null;
  var a = counts.slice().sort(function (x, y) { return x - y; });
  var sum = 0, acc = 0;
  a.forEach(function (v) { sum += v; });
  if (sum <= 0) return null;
  a.forEach(function (v, i) { acc += (i + 1) * v; });
  return +((2 * acc) / (n * sum) - (n + 1) / n).toFixed(3);
}

/** 記録の半分(50%)を占めるのは上位何人か。 */
function _halfCount(sorted) {
  var sum = 0; sorted.forEach(function (v) { sum += v; });
  if (sum <= 0) return 0;
  var acc = 0, k = 0;
  for (var i = 0; i < sorted.length; i++) { acc += sorted[i]; k++; if (acc * 2 >= sum) break; }
  return k;
}

/** 上位1/4・下位1/4の平均(人数が4人未満のときは全体平均で代用)。 */
function _quartiles(sorted) {
  var n = sorted.length; if (!n) return { '上位平均': null, '下位平均': null };
  var q = Math.max(1, Math.floor(n / 4));
  function avg(arr) { var s = 0; arr.forEach(function (v) { s += v; }); return +(s / arr.length).toFixed(2); }
  return { '上位平均': avg(sorted.slice(0, q)), '下位平均': avg(sorted.slice(n - q)) };
}

/** 取消行を除いた有効行だけを返す(追記専用ログの共通処理)。 */
function _valid(rows, idCol) {
  var cancelled = _CK.cancelledIds(rows || [], idCol);
  return (rows || []).filter(function (r) {
    return _mStr(r['状態']) === '有効' && !cancelled[_mStr(r[idCol])];
  });
}

/** [{名,件数,割合}] を件数の多い順で返す。 */
function _tally(map, total, order) {
  var keys = Object.keys(map);
  if (order) keys.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
  else keys.sort(function (a, b) { return map[b] - map[a]; });
  return keys.map(function (k) { return { '名': k, '件数': map[k], '割合': _mPct(map[k], total) }; });
}

/**
 * 見取りの鏡。
 * @param {Object} input {
 *   students:[{児童ID,番号,表示名}], records:[評価記録], speeches:[発言ログ],
 *   yosa:[よさ記録], doutoku:[道徳記録], typeMaster:[発言種類マスタ], stampMaster:[よさスタンプマスタ] }
 * @param {Object} [opts] { 教師ID }
 * @return {Object} 範囲/だれ/なにで/いつ/観点/二層/むき
 */
function calcMitoriMirror(input, opts) {
  input = input || {}; opts = opts || {};
  var students = input.students || [];
  var teacherId = opts['教師ID'] || _CK.KAIGI_TEACHER_ID || 'TEACHER';
  var inClass = {}; students.forEach(function (s) { inClass[_mStr(s['児童ID'])] = true; });
  function mine(rows, idCol) {
    return _valid(rows, idCol).filter(function (r) { return inClass[_mStr(r['児童ID'])]; });
  }

  var recs = mine(input.records, '記録ID');
  var speeches = mine(input.speeches, 'ログID').filter(function (r) {
    return _mStr(r['発言種類']) !== (_CK.STAGE_MARK || '段階切替') && _mStr(r['児童ID']) !== teacherId;
  });
  var yosa = mine(input.yosa, '記録ID');
  var dou = mine(input.doutoku, '記録ID');

  /* ---- 1. だれを見たか(見取りの偏り) ---------------------------------- */
  var per = {};
  function bump(sid, key) {
    var c = (per[sid] = per[sid] || { '評価': 0, '発言': 0, 'よさ': 0, '道徳': 0, '計': 0 });
    c[key]++; c['計']++;
  }
  recs.forEach(function (r) { bump(_mStr(r['児童ID']), '評価'); });
  speeches.forEach(function (r) { bump(_mStr(r['児童ID']), '発言'); });
  yosa.forEach(function (r) { bump(_mStr(r['児童ID']), 'よさ'); });
  dou.forEach(function (r) { bump(_mStr(r['児童ID']), '道徳'); });

  var 行 = students.map(function (s) {
    var sid = _mStr(s['児童ID']);
    var c = per[sid] || { '評価': 0, '発言': 0, 'よさ': 0, '道徳': 0, '計': 0 };
    return { '児童ID': sid, '番号': s['番号'], '表示名': s['表示名'] || sid,
      '計': c['計'], '内訳': { '評価': c['評価'], '発言': c['発言'], 'よさ': c['よさ'], '道徳': c['道徳'] } };
  }).sort(function (a, b) {
    if (b['計'] !== a['計']) return b['計'] - a['計'];
    return (a['番号'] || 0) - (b['番号'] || 0);
  });

  var counts = 行.map(function (r) { return r['計']; });
  var total = counts.reduce(function (a, b) { return a + b; }, 0);
  var q = _quartiles(counts);
  var ゼロ = 行.filter(function (r) { return r['計'] === 0; })
    .map(function (r) { return { '児童ID': r['児童ID'], '表示名': r['表示名'] }; });

  var 偏り = {
    'ジニ': mirrorGini(counts),
    '上位平均': q['上位平均'], '下位平均': q['下位平均'],
    '倍': (q['下位平均'] > 0) ? +(q['上位平均'] / q['下位平均']).toFixed(1) : null,
    '半分人数': _halfCount(counts),
    '最多': counts.length ? counts[0] : 0,
    '最少': counts.length ? counts[counts.length - 1] : 0,
    '平均': counts.length ? +(total / counts.length).toFixed(1) : 0,
    '0件人数': ゼロ.length,
  };

  /* ---- 2-a. 何で見たか ------------------------------------------------- */
  var 方法 = {};
  recs.forEach(function (r) {
    var m = _mStr(r['評価方法']) || '(未記入)';
    方法[m] = (方法[m] || 0) + 1;
  });
  var 出どころ = {};
  出どころ[MIRROR_SRC.評価] = recs.length;
  出どころ[MIRROR_SRC.発言] = speeches.length;
  出どころ[MIRROR_SRC.よさ] = yosa.length;
  出どころ[MIRROR_SRC.道徳] = dou.length;

  /* ---- 2-b. いつ見たか(授業開始からの経過) ----------------------------- */
  // 「文脈(本時・議題・教材)ごと、その日の最初の記録」を0分とみなす。
  // ★授業の開始時刻はどこにも記録されていないので、これは近似である。
  //   前半に記録が寄る/終末に寄る、という自分の癖を見るためだけに使う。
  var stamps = [];
  function stamp(dt, ctx) {
    var t = mirrorTimeParts(dt); if (!t) return;
    stamps.push({ 'key': _mStr(ctx) + '@' + t['日'], '分': t['分'], '日': t['日'] });
  }
  recs.forEach(function (r) { stamp(r['記録日時'], _mStr(r['本時ID']) || _mStr(r['単元ID'])); });
  speeches.forEach(function (r) { stamp(r['日時'], _mStr(r['文脈ID']) || _mStr(r['議題ID'])); });
  yosa.forEach(function (r) { stamp(r['日時'], _mStr(r['文脈ID'])); });
  dou.forEach(function (r) { stamp(r['日時'], _mStr(r['教材ID'])); });

  var base = {};
  stamps.forEach(function (s) {
    if (base[s['key']] == null || s['分'] < base[s['key']]) base[s['key']] = s['分'];
  });
  var binCount = {}; MIRROR_BINS.forEach(function (b) { binCount[b['名']] = 0; });
  stamps.forEach(function (s) {
    var d = s['分'] - base[s['key']];
    for (var i = 0; i < MIRROR_BINS.length; i++) {
      if (d < MIRROR_BINS[i]['max']) { binCount[MIRROR_BINS[i]['名']]++; return; }
    }
  });
  var 帯 = MIRROR_BINS.map(function (b) {
    return { '名': b['名'], '件数': binCount[b['名']], '割合': _mPct(binCount[b['名']], stamps.length) };
  });

  var 日付 = {}; stamps.forEach(function (s) { 日付[s['日']] = true; });
  var 日一覧 = Object.keys(日付).sort();

  /* ---- 2-c. どの観点で見たか ------------------------------------------- */
  var kan = {};
  recs.forEach(function (r) {
    var k = _mStr(r['観点']) || '(なし)';
    kan[k] = (kan[k] || 0) + 1;
  });

  /* ---- 3. 数えた／解釈した(§1 の二層を国語・道徳にも通す) --------------- */
  // 低推論=数えた(発言があったか) / 高推論=解釈した(その行動の意味を教師が読む)。
  // ◎○△ は「その姿をどう読んだか」なので解釈した側に入る。
  var 数えた = speeches.length;
  var 解釈した = recs.length + yosa.length + dou.length;
  var 二層 = {
    '数えた': { '件数': 数えた, '内訳': [{ '名': MIRROR_SRC.発言, '件数': speeches.length }] },
    '解釈した': { '件数': 解釈した, '内訳': [
      { '名': MIRROR_SRC.評価, '件数': recs.length },
      { '名': MIRROR_SRC.よさ, '件数': yosa.length },
      { '名': MIRROR_SRC.道徳, '件数': dou.length },
    ] },
    '計': 数えた + 解釈した,
    '数えた割合': _mPct(数えた, 数えた + 解釈した),
  };

  /* ---- 4. 協調／獲得(3モード横断・§3) ---------------------------------- */
  // 学級会の振り返り画面と同じ純関数を使う(数字が食い違わないように)。
  var tm = input.typeMaster || [], sm = input.stampMaster || [];
  var 全体 = _CK.calcMukiBalance(speeches, yosa, students, tm, sm, {});
  var modes = {};
  speeches.forEach(function (r) { modes[_mStr(r['モード']) || '学級会'] = true; });
  yosa.forEach(function (r) { modes[_mStr(r['モード']) || '学級会'] = true; });
  var モード別 = ['国語', '道徳', '学級会'].filter(function (m) { return modes[m]; }).map(function (m) {
    function byMode(rows) { return rows.filter(function (r) { return (_mStr(r['モード']) || '学級会') === m; }); }
    return { 'モード': m, '結果': _CK.calcMukiBalance(byMode(speeches), byMode(yosa), students, tm, sm, {}) };
  });

  /* ---- まとめ ----------------------------------------------------------- */
  var 日時列 = stamps.map(function (s) { return s['日']; }).sort();
  return {
    '範囲': {
      '対象人数': students.length, '記録総数': total,
      '開始': 日時列[0] || '', '終了': 日時列[日時列.length - 1] || '', '日数': 日一覧.length,
    },
    'だれ': { '行': 行, 'ゼロ': ゼロ, '偏り': 偏り },
    'なにで': {
      '評価方法': _tally(方法, recs.length),
      '出どころ': _tally(出どころ, total, [MIRROR_SRC.評価, MIRROR_SRC.発言, MIRROR_SRC.よさ, MIRROR_SRC.道徳]),
    },
    'いつ': { '帯': 帯, '対象件数': stamps.length },
    '観点': _tally(kan, recs.length, ['知', '思', '主', '(なし)']),
    '二層': 二層,
    'むき': { '全体': 全体, 'モード別': モード別 },
  };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    calcMitoriMirror: calcMitoriMirror, mirrorGini: mirrorGini,
    mirrorTimeParts: mirrorTimeParts, MIRROR_SRC: MIRROR_SRC, MIRROR_BINS: MIRROR_BINS,
  };
}

<script>
/**
 * calc_itte.js — 「つぎの一手」の判定(純関数・副作用なし・Nodeでテスト可能)。
 *
 * ★25 v1.2 §4.3。**教師は象限を判定しない。機械が判定し、教師は一言を返すだけ。**
 *
 * 3つの問い(★25 §2)がこのファイルの唯一の骨:
 *   ① だれが場にいたか   … 発言が1件以上あったか
 *   ② 意見はだれかに届いたか … 他者に宛てた / 受け取られた / よさ
 *   ③ 自分から出発したか   … 宛先＝じぶん
 * この3つのうちいくつ立ったかが「関わり方の幅 0〜3」。
 *
 * ★★ 幅は上下ではない(★25 §10-4)。3が偉いのではなく、その子の関わり方の【形】である。

/* ============================================================
   橋の行 → シート「子どもの記録」の行

function _hStudentIndex(students) {

}
function _hGidaiIndex(gidai) {

/**
 * 橋の行のうち「通し番号」が since より後ろのものを、子どもの記録の行にする(追記する行だけを返す)。
 * - 書き直し(同じ外部ID)は 版 を1つ上げた新しい行にする(前の版の行は消さない)。
 * - 消した知らせ(種類 delete)も 状態=消した の新しい版として残す。
 * - ホンネーの書き直し(iken＋saikouchiku)とホメホメ(hyoka)は読まない。
 * - 結べない行(名簿にない番号・議題にない回)は 状態=つなげなかった で写し、unlinked でも返す。
 * - 一斉ブロック(keikaku＋{block:{on,at}})は blocks で返す。形がちがっても止まらない。

 * @param {Object[]} rows 橋の行(見出し名の箱)
 * @param {Object} ctx { since, students, gidai, versions:{外部ID:いままでの最大の版}, now }

 */
function henyoBridgeToRecords(rows, ctx) {

  var ver = {}; Object.keys(ctx.versions || {}).forEach(function (k) { ver[k] = Number(ctx.versions[k]) || 0; });
  var list = (rows || []).filter(function (r) {
    var n = Number(_hStr(r['通し番号']));

  list.forEach(function (r) {

    var bamen = _hStr(r['場面']), shurui = _hStr(r['種類']);

      var kt = hoka.kata;
      if (kt && typeof kt === 'object' && !Array.isArray(kt) && _hStr(kt.kata) !== '') {

        ver[kg] = (ver[kg] || 0) + 1;
        records.push({ '取込日時': ctx.now || '', '児童ID': '', '議題ID': gIdx[kk] || '', '回': kk, '種類': HENYO_KIND.会の型,
          '本文': '', '型': _hStr(kt.kata), 'できた': '', '決まったこと': '', '外部ID': kg, '版': ver[kg], '橋の通し番号': seq,
          '状態': HENYO_STATE.有効, 'とくめい': '', '組': _hKumi(r['組']), '番号': _hNo(r['番号']), 'その他': '' });
      }

        var bk = _hNo(bu.no) || _hNo(r['回']), bg = 'bunrui-' + bk + '-' + _hStr(bu.secId);

          '本文': JSON.stringify({ secId: _hStr(bu.secId), secTitle: _hStr(bu.secTitle),

    else if (bamen === 'iken' && shurui !== 'add' && shurui !== 'delete') return;   // ホンネーの書き直しは読まない

    var kumi = _hKumi(r['組']), no = _hNo(r['番号']);
    if (bamen === 'kiroku') {                    // PC記録は「言った人」(あて先 組-番号)の記録
      var ate = _hStr(r['あて先']);

/**
 * なかまわけの zones をそろえる。order の小さい順に並べる。案の名前は title(橋に出る名前)。
 * どの箱にも an が無い前の形のときだけ、order の順に A・B・C… と付ける(ツムゴロウと同じ約束・2026-10-22)。

    .map(function (z, i) { return { id: _hStr(z.id), an: _hStr(z.an), title: _hStr(z.title), order: Number(z.order) || 0, i: i }; })
    .sort(function (a, b) { return a.order - b.order || a.i - b.i; });
  var old = list.every(function (z) { return z.an === ''; });
  return list.map(function (z, i) {
    return { id: z.id, an: old ? (i < 26 ? String.fromCharCode(65 + i) : String(i + 1)) : z.an, title: z.title, order: z.order };
  });
}

/** 立場・投票の外部ID(組-番号-回-話し合うこと-tachiba|tohyo)から 話し合うこと を取り出す。 */
function _hWakuOf(gaibu) {
  var p = _hStr(gaibu).split('-');
  return (p.length >= 5 && (p[p.length - 1] === 'tachiba' || p[p.length - 1] === 'tohyo')) ? p.slice(3, -1).join('-') : '';
}

function _hUnlinked(rec, why) {

    '橋の通し番号': rec['橋の通し番号'], 'わけ': why };

/**
 * 写したときに結べなかった行を、いまの名簿・議題でもう一度結ぶ(読むときだけ・シートは書きかえない)。

function henyoResolve(records, students, gidai) {

    if (_hStr(r['児童ID']) !== '' && _hStr(r['議題ID']) !== '') return r;
    var x = {}; Object.keys(r).forEach(function (k) { x[k] = r[k]; });

/**
 * 外部IDごとに新しい版を正にする。前の版は「前の版」に残し、書き直したと分かるようにする。

    g[id].push(r);

  var out = [];
  order.forEach(function (id) {
    var vs = g[id].slice().sort(function (a, b) {
      return (Number(a['版']) || 0) - (Number(b['版']) || 0) || (Number(a['橋の通し番号']) || 0) - (Number(b['橋の通し番号']) || 0);
    });

    var prev = vs.slice(0, -1).filter(function (v) { return _hStr(v['状態']) !== HENYO_STATE.消した; });
    var x = {}; Object.keys(top).forEach(function (k) { x[k] = top[k]; });
    x['書き直した'] = prev.length > 0;
    x['前の版'] = prev;
    out.push(x);
  });
  out.sort(function (a, b) { return (Number(a['橋の通し番号']) || 0) - (Number(b['橋の通し番号']) || 0); });

}

/**

 * - 見取り済み でない有効な発言は返さない(ゼロとして数えない)。per に子ごとの 全部/見取った を返す。
 * - よさはここでは扱わない(置き場は シート「よさ記録」の1か所・会話分析の面も appendYosa で書く)。
 * @param {Object[]} logs 1つの会の発言ログ(見取りが重なったもの)
 * @param {Object} [opts] { 教師ID, 段階マーク }
 * @return {{logs:Object[], per:Object, all:number, seen:number}}
 */
function henyoSeenLogs(logs, opts) {

  var cancelled = {};
  (logs || []).forEach(function (r) { if (_hStr(r['状態']) === '取消' && _hStr(r['取消対象ID']) !== '') cancelled[_hStr(r['取消対象ID'])] = true; });
  var out = [], per = {}, all = 0, seen = 0;
  (logs || []).forEach(function (r) {
    var sid = _hStr(r['児童ID']);
    if (_hStr(r['状態']) !== '有効' || cancelled[_hStr(r['ログID'])] || _hStr(r['発言種類']) === stage || sid === '' || sid === teacher) return;
    per[sid] = per[sid] || { all: 0, seen: 0 };

/**

  var ks = (kaiList || []).filter(function (k) { return pred((per || {})[k]); });

function _hEmpty() {

    haba: null, mada: 0, tachiba: [], ate: '', hatsu: 0, yosa: [], hitokoto: '', rewritten: false, tokumei: false, kinds: [] };

/**
 * ダッシュボードの中身を全部組む。
 * @param {Object} input {
 *   students:[{児童ID,組,番号,表示名}], gidai:[{議題ID,回,実施日}], records: 子どもの記録の行,
 *   kaigi: {議題ID:{児童ID:{幅,宛先他者,宛先じぶん,発言数}}}  ← calcTsugiNoItte の答え(会ごと),
 *   yosa: {議題ID:{児童ID:[スタンプ名]}}, itte: {議題ID:{児童ID:一言}}, clueText: 設定.手がかりの語 }

  input = input || {};

  var kai = (input.gidai || []).filter(function (g) { return _hNo(g['回']) !== '' && isFinite(Number(g['回'])); })
    .map(function (g) { return { '議題ID': _hStr(g['議題ID']), '回': Number(g['回']), '実施日': _hStr(g['実施日']) }; })
    .sort(function (a, b) { return a['回'] - b['回']; });
  var kaiList = kai.map(function (k) { return k['回']; });
  var kaiOfGid = {}; kai.forEach(function (k) { kaiOfGid[k['議題ID']] = k['回']; });

  var res = henyoResolve(input.records, input.students, input.gidai);
  var latest = henyoLatest(res.records.filter(function (r) {
    return _hStr(r['児童ID']) !== '' && kaiOfGid[_hStr(r['議題ID'])] != null;
  }));

  // 案の名前(なかまわけ)。回＋話し合うことのID でも 名前 でも引けるようにする
  var bunrui = {};
  henyoLatest(res.records.filter(function (r) { return _hStr(r['種類']) === HENYO_KIND.なかまわけ; })).forEach(function (r) {
    var b = _hJson(r['本文']), k = _hNo(r['回']);
    if (_hStr(b.secId) !== '') bunrui[k + '|' + b.secId] = b;
    if (_hStr(b.secTitle) !== '') bunrui[k + '|' + b.secTitle] = b;
  });
  var kataOf = {};
  henyoLatest(res.records.filter(function (r) { return _hStr(r['種類']) === HENYO_KIND.会の型; })).forEach(function (r) {
    var nm = ''; HENYO_KAI_KATA.forEach(function (c) { if (c.k === _hStr(r['型'])) nm = c.n; });
    kataOf[_hNo(r['回'])] = nm;
  });
  kai.forEach(function (K) { K['会の型'] = kataOf[String(K['回'])] || ''; });
  var tbRaw = {};   // 児童ID → 回 → [立場・投票の記録(いちばん新しい版・前の版つき)]

  var students = (input.students || []).slice().sort(function (a, b) { return (Number(a['番号']) || 0) - (Number(b['番号']) || 0); });
  var per = {};
  students.forEach(function (s) {
    var p = {}; kaiList.forEach(function (k) { p[k] = _hEmpty(); });
    per[_hStr(s['児童ID'])] = p;
  });

  latest.forEach(function (r) {
    var p = per[_hStr(r['児童ID'])]; if (!p) return;
    var c = p[kaiOfGid[_hStr(r['議題ID'])]];
    var kind = _hStr(r['種類']);
    c.has = true;
    if (r['書き直した']) c.rewritten = true;
    if (_hStr(r['とくめい']) !== '') c.tokumei = true;
    if (kind === HENYO_BAMEN.meate) {
      c.kata = _hHas(HENYO_KATA, _hStr(r['型'])) ? _hStr(r['型']) : null;
      c.meate = _hStr(r['本文']);
    } else if (kind === HENYO_BAMEN.furikaeri) {
      if (_hStr(r['型']) === 'practice') c.practice = _hStr(r['本文']);
      else {
        c.furi = _hStr(r['本文']);
        var d = _hStr(r['できた']);
        c.deki = d === '' ? c.deki : Number(d);
        if (_hHas(HENYO_OMOI, _hStr(r['決まったこと']))) c.omoi = _hStr(r['決まったこと']);
      }
    } else if (kind === HENYO_BAMEN.iken) {
      c.iken.push(_hStr(r['本文']));
    } else if (kind === HENYO_BAMEN.kiroku) {
      c.kiroku++;
    } else if (kind === HENYO_KIND.立場 || kind === HENYO_KIND.投票) {
      var k0 = kaiOfGid[_hStr(r['議題ID'])], sid0 = _hStr(r['児童ID']);
      ((tbRaw[sid0] = tbRaw[sid0] || {})[k0] = tbRaw[sid0][k0] || []).push(r);
    }
  });
  Object.keys(tbRaw).forEach(function (sid) {
    Object.keys(tbRaw[sid]).forEach(function (k) {

      .forEach(function (row) {

          ['議題', '補完', '評価', '振り返り', 'クラス振り返り', 'めあて', '意見送信', 'スキップ', '不一致'].forEach(function (k) { sum[k] += (added[k] || 0); });

  // ★区切りは行ごとに見る(見出しはカンマ・データはタブ、という混ざった貼り方が実際に来る)。
  var MOCK_DELIM = 'カンマ';
  function csvGrid(text) {
    var s0 = String(text).replace(/^\ufeff/, '').replace(/\r\n?/g, '\n');
    var kinds = [];
    function mark(k) { if (kinds.indexOf(k) < 0) kinds.push(k); }
    var grid = s0.split('\n').map(function (line) {
      var t = line.replace(/^[ \u3000]+/, '').replace(/[ \u3000]+$/, '');
      if (t === '') return null;
      var cells;
      if (t.indexOf('\t') >= 0) { mark('タブ'); cells = t.split('\t'); }
      else if (t.indexOf(',') >= 0) { mark('カンマ'); cells = t.split(','); }
      else if (t.indexOf('，') >= 0) { mark('全角カンマ'); cells = t.split('，'); }
      else if (/[ \u3000]{2,}/.test(t)) { mark('そろえた空白'); cells = t.split(/[ \u3000]{2,}/); }
      else cells = [t];
      return cells.map(function (c) { return String(c).replace(/^[ \u3000]+/, '').replace(/[ \u3000]+$/, ''); });
    }).filter(function (r) { return r; });
    MOCK_DELIM = kinds.length === 0 ? 'カンマ区切り' : kinds.length === 1 ? kinds[0] + '区切り' : kinds.join('と') + 'が混ざっています';
    return grid;
  }

function mtLastRec(host, rec, opts) {

}

/**

 */
function mtSeatCardHtml(o) {

/* ============================================================
   ④ 自動採寸 — 名前20pxを死守しつつ、座席の大きさを「式」で解く(設計21 §1⑥/§7)
   ============================================================ */

var MT_SEAT = { hMax: 74, hMin: 46, wMax: 112, wMin: 88, gap: 6, rowH: 57, cntH: 21, bandChrome: 34, meateH: 42 };

/**
 * ★純関数。座席の幅・高さ(と、コの字なら辺の列数)を解く。
 * 実測してから決めると循環する(司会帯の高さは座席の高さに依存し、めあての高さは座席の幅に依存する)ので、
 * 座席サイズに依存する高さは式の中だけで解く。=> 同じ spec なら何度呼んでも同じ答え(冪等・設計21 §7)。
 *
 * @param {Object} spec {
 *   layout:'konoji'|'grid', availW, availH, gap, rowContentH,
 *   maxCols,                                    // コの字の辺の列数の上限(先生が決めた値。省略時3)
 *   wMax,wMin,hMax,hMin,                       // 省略時は MT_SEAT
 *   sideN, frontN, bandChrome, meateH,         // konoji
 *   n, headH, fixedCols, fixedRows             // grid(児童数・グリッドより上に積む固定高・座席表の行列)
 * }
 * @return {Object} {c, sw, sh, cols, rows, tight}
 */
function mtSolveFit(spec) {
  var s = spec || {};
  var gap = s.gap == null ? MT_SEAT.gap : s.gap;
  var wMax = s.wMax || MT_SEAT.wMax, wMin = s.wMin || MT_SEAT.wMin;
  var hMax = s.hMax || MT_SEAT.hMax, hMin = s.hMin || MT_SEAT.hMin;
  var rowContentH = s.rowContentH || MT_SEAT.rowH;
  var availW = s.availW, availH = s.availH;
  var konoji = (s.layout !== 'grid');
  var sideN = Math.max(1, s.sideN || 1), frontN = Math.max(1, s.frontN || 1);
  var bandChrome = s.bandChrome == null ? MT_SEAT.bandChrome : s.bandChrome;
  var meateH = s.meateH || 0;
  var n = Math.max(1, s.n || 1), headH = s.headH || 0;
  var fixedCols = s.fixedCols || 0, fixedRows = s.fixedRows || 0;   // 座席表ビュー(机の並びが正)
  // 辺の列数の上限。★先生が[左右の辺 N列]で決めた値を超えて勝手に増やさない(2026-08-27)。
  //   増やすと辺が太って真ん中(正面)が痩せ、コの字が「一斉のグリッド」に見える。
  //   減らすのは許す(画面が狭ければ折り返しを減らして高さで吸収する)。
  var maxCols = Math.max(1, Math.min(3, s.maxCols || 3));

  // (c, sw, sh) で必要になる高さ。横に入らなければ null。
  function need(c, sw, sh) {
    var rowH = Math.max(sh, rowContentH);     // 指定より中身が高ければ、実際の行はそちらになる
    if (konoji) {
      var sideRows = Math.ceil(sideN / c);
      var sideW = c * sw + (c - 1) * gap;
      var midW = availW - 2 * sideW - 2 * gap;
      var fCols = Math.floor((midW + gap - 2) / (sw + gap));
      if (fCols < 1) return null;
      var fRows = Math.ceil(frontN / fCols);
      var body = Math.max(sideRows * rowH + (sideRows - 1) * gap,
                          meateH + fRows * rowH + (fRows - 1) * gap);
      return bandChrome + rowH + gap + body;
    }
    // 座席表ビューは列数が決まっている(机の並びが正)。番号順ビューは幅から折り返す。
    var cols = fixedCols || Math.floor((availW + gap) / (sw + gap));
    if (cols < 1) return null;
    if (cols * sw + (cols - 1) * gap > availW) return null;
    var rows = fixedRows || Math.ceil(n / cols);
    return headH + rows * rowH + (rows - 1) * gap;
  }

  // (cMax まで) いちばん大きく描ける組を探す。best=1画面に収まる組 / nearest=収まらないときの最善。
  function search(cTop) {
    var best = null, nearest = null;
    for (var c = 1; c <= cTop; c++) {
      for (var sw = wMax; sw >= wMin; sw -= 4) {
        for (var sh = hMax; sh >= hMin; sh -= 2) {
          var h = need(c, sw, sh);
          if (h == null) continue;
          if (h <= availH) {
            var score = sh * 1000 + sw * 10 - c;
            if (!best || score > best.score) best = { score: score, c: c, sw: sw, sh: sh };
            break;                    // この (c,sw) で最大の sh が決まったら次へ
          }
          // 収まらないときのために「はみ出しがいちばん小さい組」も覚えておく
          if (!nearest || h < nearest.h || (h === nearest.h && sh > nearest.sh)) nearest = { h: h, c: c, sw: sw, sh: sh };
        }
      }
    }
    return { best: best, nearest: nearest };
  }
  // ★まず先生が決めた列数(maxCols)の中で探す。そこで1画面に収まるなら、それを使う。
  //   収まらないときだけ列を増やして探し直す(1画面に収めるほうが優先・設計19 §6/20 §2)。
  var r = search(konoji ? maxCols : 1);
  if (!r.best && konoji && maxCols < 3) {
    var wide = search(3);
    if (wide.best) r = wide;
    else if (wide.nearest && (!r.nearest || wide.nearest.h < r.nearest.h)) r.nearest = wide.nearest;
  }
  var best = r.best, nearest = r.nearest;
  if (!best) {
    best = nearest ? { c: nearest.c, sw: nearest.sw, sh: nearest.sh, tight: true }
                   : { c: konoji ? maxCols : 1, sw: wMin, sh: hMin, tight: true };
  }
  var out = { c: best.c, sw: best.sw, sh: best.sh, tight: !!best.tight };
  if (!konoji) {
    out.cols = fixedCols || Math.max(1, Math.floor((availW + gap) / (out.sw + gap)));
    out.rows = fixedRows || Math.ceil(n / out.cols);
  }
  return out;
}

/** 縦の合計に効く「その要素の高さ+上下マージン」。 */
function mtOuterH(el0) {
  if (!el0) return 0;
  var cs = getComputedStyle(el0);
  return el0.offsetHeight + parseFloat(cs.marginTop || 0) + parseFloat(cs.marginBottom || 0);
}

/**
 * 児童カード1行の実寸(内側余白+枠+名前+回数バッジ)。--seat-h より中身が高ければ、行はこちらになる。
 * ★回数バッジの有無で変わらないように、バッジ行は「いつも1行ぶん」数える。
 *   0回の子はバッジを出さないが、その子のために行を縮めると、1件記録したとたんに座席がいっせいに縮む。
 */
function mtRowContentH(host, o) {
  o = o || {};
  var seat = (o.seatSel ? host.querySelector(o.seatSel) : null) || host.querySelector('.seat');
  if (!seat) return MT_SEAT.rowH;
  var cs = getComputedStyle(seat);
  var h = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) +
          parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth) +
          mtOuterH(seat.querySelector(o.nameSel || '.nm'));
  var cnt = seat.querySelector(o.cntSel || '.cnt') || host.querySelector(o.cntSel || '.cnt');
  return h + (cnt ? mtOuterH(cnt) : MT_SEAT.cntH);
}

/**
 * 児童カードの自動採寸(設計21 §2 mtFitGrid)。実測 → mtSolveFit → CSS変数。
 * @param {Element|string} host 座席の入れ物(.hall / .gridwrap)
 * @param {Object} opts {layout:'konoji'|'grid', sideN, frontN, n, headH, fixedCols, fixedRows,
 *                          seatSel, nameSel, cntSel(カードの測り方。国語は .scard/.scard__name)}
 * @return {Object|null} mtSolveFit の答え
 */
function mtFitGrid(host, opts) {
  var el0 = mtEl_(host); if (!el0) return null;
  opts = opts || {};
  var cs = getComputedStyle(el0);
  var availW = el0.clientWidth - (parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight));
  // 縦は「切り取られない高さ」まで使う。overflow:hidden が切るのは padding box なので、
  // 下の内側余白ぶんは(見た目が詰まるだけで)はみ出して見えない余地として使ってよい。
  var availH = el0.clientHeight - parseFloat(cs.paddingTop);
  if (availW <= 20 || availH <= 20) return null;

  var spec = {
    layout: opts.layout || 'grid', availW: availW, availH: availH,
    rowContentH: mtRowContentH(el0, opts),
    sideN: opts.sideN, frontN: opts.frontN, n: opts.n, headH: opts.headH || 0,
    fixedCols: opts.fixedCols, fixedRows: opts.fixedRows,
    meateH: opts.meateH || 0,
    bandChrome: opts.bandChrome,
    maxCols: opts.maxCols,
  };
  var best = mtSolveFit(spec);
  el0.style.setProperty('--seat-gap', MT_SEAT.gap + 'px');
  el0.style.setProperty('--seat-w', best.sw + 'px');
  el0.style.setProperty('--seat-h', best.sh + 'px');
  if (spec.layout === 'konoji') el0.style.setProperty('--side-cols', best.c);
  else el0.style.setProperty('--grid-cols', best.cols);
  el0.dataset.fit = best.sw + 'x' + best.sh +
    (spec.layout === 'konoji' ? ' / 辺' + best.c + '列' : ' / ' + best.cols + '列') +
    (best.tight ? ' ※収まりません' : '');
  return best;
}

/* ============================================================
   ⑤ つながり — 画面じゅうでルールは1つ: ①その子 → ②相手(相手なしでもOK)
   ============================================================ */

/**
 * つなぎ文(マスタの つなぎ文 の {相手} を名前に置換)。相手0なら空文字=下書きしない(設計21 §2)。
 * @param {string} tmpl マスタの つなぎ文(空なら fallback)
 * @param {string[]} names 相手の表示名
 * @param {string} [fallback] マスタが空のときの既定
 */
function mtTsunagiText(tmpl, names, fallback) {
  if (!names || !names.length) return '';
  var t = String(tmpl == null ? '' : tmpl).trim() || String(fallback || '').trim();
  if (!t) return '';
  return t.replace('{相手}', names.map(function (n) { return n + 'さん'; }).join('・'));
}

/**
 * つなぎ中(②のあいだ)に道具バーの行へ出す確定帯。使えないボタンは常設しない(設計21 §1②)。
 * @param {Object} o {doerName, kind, targetNames:[], yosa:true, onCommit:'commitLinking()', onCancel:'cancelLinking()',
 *                      onSelf:'commitLinkingSelf()'} onSelf を渡すと「🙋 じぶんから」を出す(★25 §2.3)
 */
function mtLinkbarHtml(o) {
  var names = (o.targetNames || []).map(mtEsc_).join('・');
  var n = (o.targetNames || []).length;
  var label = n ? '✓ ' + names + ' とつないで記録' : '✓ 相手なしで記録';
  var sub = n ? '相手：' + names + '(席をもう一度タップで外せます)'
              : mtEsc_(o.doerName) + ' さんをもう一度タップ＝相手なしで記録';
  return '<div class="linkbar' + (o.yosa ? ' linkbar--yosa' : '') + '"><span class="step">2</span>' +
    '<span class="who"><b>' + mtEsc_(o.doerName) + '</b> さんの「' + mtEsc_(o.kind) + '」を記録します' +
      '<small>' + sub + '</small></span>' +
    '<span class="spacer"></span>' +
    (o.onSelf ? '<button type="button" class="selfbtn" title="自分の願い・自分の経験から言った(★25 §2.3)" onclick="' + o.onSelf + '">' + mtIco('user') + ' じぶんから</button>' : '') +
    '<button type="button" class="gobtn" onclick="' + o.onCommit + '">' + label + '</button>' +
    '<button type="button" class="cancelbtn" onclick="' + o.onCancel + '">やめる</button></div>';
}

/**
 * 座席の下につながり線を引く(設計21 §1③)。3つの決めごと:
 *  ①いま結ぼうとしている線は【記録する前から】出す。押す前に目で確かめられる。
 *  ②記録済みの線は【選んだ子のぶんだけ】。全体を出すと後半に座席が読めない。
 *  ③向き(その子→相手)を矢印で示す。
 * ※SVGはCSS変数を参照できないので色は直値で渡す(08 §2 を変えたら呼び出し側も直す)。
 * @param {Element|string} host 座席の入れ物(position:relative)
 * @param {Object} o {live:{from, to:[], color, weight}, saved:[{from,to,color,weight,dash}], colors:[色…]}
 */
function mtDrawLinks(host, o) {
  var el0 = mtEl_(host); if (!el0) return;
  var old = el0.querySelector('#link-svg'); if (old) old.remove();
  o = o || {};
  var live = o.live, saved = o.saved || [];
  if (!(live && live.to && live.to.length) && !saved.length) return;

  var hb = el0.getBoundingClientRect();
  function box(sid) {
    var c = el0.querySelector('.seat[data-sid="' + sid + '"]'); if (!c) return null;
    var r = c.getBoundingClientRect();
    return { x: r.left - hb.left + r.width / 2, y: r.top - hb.top + r.height / 2, w: r.width / 2, h: r.height / 2 };
  }
  // 席の枠のところで止める(矢印が席の下に隠れないように)
  function clip(a, b, pad) {
    var dx = b.x - a.x, dy = b.y - a.y; if (!dx && !dy) return { x: b.x, y: b.y };
    var t = Math.min((b.w + pad) / Math.abs(dx || 1e-6), (b.h + pad) / Math.abs(dy || 1e-6));
    if (t > 1) t = 1;
    return { x: b.x - dx * t, y: b.y - dy * t };
  }
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('id', 'link-svg'); svg.setAttribute('class', 'link-svg');
  svg.setAttribute('width', el0.clientWidth); svg.setAttribute('height', el0.clientHeight);

  // 矢印(色ごとに1つ)。id は色から作る。
  var defs = document.createElementNS(NS, 'defs'), made = {};
  function marker(color) {
    var id = 'ah-' + String(color).replace('#', '');
    if (made[id]) return id;
    made[id] = true;
    var mk = document.createElementNS(NS, 'marker');
    mk.setAttribute('id', id); mk.setAttribute('viewBox', '0 0 10 10');
    mk.setAttribute('refX', '9'); mk.setAttribute('refY', '5');
    mk.setAttribute('markerWidth', '5'); mk.setAttribute('markerHeight', '5');
    mk.setAttribute('orient', 'auto-start-reverse');
    var pth = document.createElementNS(NS, 'path');
    pth.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z'); pth.setAttribute('fill', color);
    mk.appendChild(pth); defs.appendChild(mk);
    return id;
  }
  svg.appendChild(defs);

  function put(from, to, color, weight, opacity, dash) {
    var a = box(from), b = box(to); if (!a || !b) return;
    var st = clip(b, a, 2), e = clip(a, b, 3);
    var ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', st.x); ln.setAttribute('y1', st.y);
    ln.setAttribute('x2', e.x); ln.setAttribute('y2', e.y);
    ln.setAttribute('stroke', color);
    ln.setAttribute('stroke-width', weight);
    ln.setAttribute('stroke-linecap', 'round');
    ln.setAttribute('opacity', opacity);
    ln.setAttribute('marker-end', 'url(#' + marker(color) + ')');
    if (dash) ln.setAttribute('stroke-dasharray', dash);
    svg.appendChild(ln);
  }
  if (live && live.to) live.to.forEach(function (t) { put(live.from, t, live.color, live.weight || 3.5, 0.95, live.dash); });
  saved.forEach(function (l) { put(l.from, l.to, l.color, l.weight || 3, 0.5, l.dash); });
  el0.appendChild(svg);
}

/* ============================================================
   ⑥ 流れ — 書いたことは、書いた場所の外からも読めて、そこから直せる(設計21 §1⑤)
   ============================================================ */

/**
 * 記録の流れ(新しい順)。メモは「」つき。未記入は「✎ 書き足せます」。行タップで編集・行から取り消し。
 * @param {Object[]} items [{時刻, 表示名, ラベル, 相手:[表示名], メモ, yosa:true, teacher:true, editable:true}]
 * @param {Object} opts {onPick:'pickLog(%i)', onDel:'delLog(%i)', cur:index, justSaved:index, empty:'…'}
 */
function mtFlowListHtml(items, opts) {
  opts = opts || {};
  items = items || [];
  if (!items.length) {
    return '<div class="kp-empty">' + (opts.empty ||
      'ここに記録が新しい順にたまります。<br>タップすると、その記録に書き足せます。<br>書いたことは、この一覧にそのまま出ます。') + '</div>';
  }
  return items.map(function (f, i) {
    var yo = !!f.yosa;
    var to = (f.相手 && f.相手.length)
      ? '<span class="' + (yo ? 'to-yo' : 'to-sp') + '"> → ' + f.相手.map(mtEsc_).join('・') + '</span>' : '';
    var memo = (f.メモ && String(f.メモ).trim())
      ? '<div class="memo">「' + mtEsc_(String(f.メモ).trim()) + '」</div>'
      : '<div class="nomemo">✎ 書き足せます</div>';
    var body = '<div class="n">' + mtEsc_(f.表示名) + '</div>' +
      '<div class="k' + (yo ? ' k--yo' : '') + '">' + mtEsc_(f.ラベル) + to + '</div>' + memo;
    if (f.teacher || f.editable === false) {
      return '<div class="flowitem flowitem--tch"><div class="fbody">' +
        '<div class="t">' + mtEsc_(f.時刻 || '') + '</div>' + body + '</div></div>';
    }
    var cls = 'flowitem' + ((f.相手 && f.相手.length) ? (yo ? ' linked linked-yo' : ' linked') : '') +
      (opts.cur === i ? ' cur' : '') + (opts.justSaved === i ? ' justsaved' : '');
    var del = opts.onDel
      ? '<span class="fdel" title="この記録を取り消す" onclick="event.stopPropagation();' +
          opts.onDel.replace('%i', i) + '"><i>↩ 取り消す</i></span>' : '';
    return '<div class="' + cls + '">' +
      '<button type="button" class="fbody" title="この記録に書き足す/直す" onclick="' +
        (opts.onPick || '').replace('%i', i) + '">' +
        '<div class="t">' + mtEsc_(f.時刻 || '') + del + '</div>' + body +
      '</button></div>';
  }).join('');
}

/* ============================================================
   ⑦ 保存 — ［✓ 書いたことを残す］1つだけ。押す前に「残すもの：…」が読める(設計21 §7)
   ============================================================ */

/**
 * 右パネルのフッタ。スクロールの外に固定して使う。★focus() は呼ばない
 * (タッチ端末でキーボードが出て座席が隠れる)。
 * @param {Object} o {done:true, parts:['発言メモ'], onSave:'savePanel()', doneHint:'…', offHint:'…'}
 */
function mtSaveFootHtml(o) {
  o = o || {};
  if (o.done) {
    return '<button type="button" class="savebtn savebtn--done" disabled>✓ 残しました</button>' +
      '<div class="savehint">' + mtEsc_(o.doneHint || 'あとから直せます(流れからその記録をタップ)') + '</div>';
  }
  var parts = o.parts || [];
  var on = parts.length > 0;
  return '<button type="button" class="savebtn' + (on ? '' : ' savebtn--off') + '"' + (on ? '' : ' disabled') +
    ' onclick="' + (o.onSave || '') + '">✓ 書いたことを残す</button>' +
    '<div class="savehint">' + (on ? '残すもの：' + parts.map(mtEsc_).join(' ＋ ')
      : mtEsc_(o.offHint || '上の欄に書くと、ここで まとめて残せます')) + '</div>';
}

/** 自動下書きの合図。★focus() は呼ばない(設計20 §8.1)。枠を光らせ、その欄まで送るだけ。 */
function mtFlashInput(id) {
  var el0 = document.getElementById(id); if (!el0) return;
  el0.classList.add('kp-flash');
  if (el0.scrollIntoView) el0.scrollIntoView({ block: 'nearest' });
  setTimeout(function () { el0.classList.remove('kp-flash'); }, 900);
}

/* ============================================================
   ⑧ マスタから島を作る(コードに直書きしない・設計21 §2)
   ============================================================ */

/**
 * その道具が🔗(相手を選ぶ)か。マスタの『相手を選ぶ』が正。
 * 空欄のときだけ『質の視点』から補う(移行前のシートでも🔗が効くように)。
 * @param {Object} row マスタ1行 {相手を選ぶ, 質の視点}
 */
function mtIsLinkTool(row) {
  if (!row) return false;
  var v = String(row['相手を選ぶ'] == null ? '' : row['相手を選ぶ']).trim();
  if (v === '○') return true;
  if (v === '×') return false;
  var view = String(row['質の視点'] == null ? '' : row['質の視点']).trim();
  return view === 'つながり' || view === '質的改善';
}

/**
 * マスタ行の配列を「島」に分ける。島の順・見出しは呼び出し側が spec で渡す(コードに種類名を書かない)。
 * @param {Object[]} rows マスタ行
 * @param {Object[]} spec [{key:'link', label:'🔗 つなぐ<br>だれに？も残せる', cls:'group--link', test:function(row){}}]
 *   test を省いた島は「どの島にも入らなかった残り」を受ける(1つだけ置ける)。
 * @return {Object[]} [{spec, rows}] 空の島は落とす
 */
function mtIslands(rows, spec) {
  var rest = [], buckets = spec.map(function () { return []; });
  (rows || []).forEach(function (r) {
    for (var i = 0; i < spec.length; i++) {
      if (spec[i].test && spec[i].test(r)) { buckets[i].push(r); return; }
    }
    rest.push(r);
  });
  spec.forEach(function (sp, i) { if (!sp.test) buckets[i] = rest; });
  return spec.map(function (sp, i) { return { spec: sp, rows: buckets[i] }; })
    .filter(function (b) { return b.rows.length > 0; });
}

/** 島1つぶんのHTML(見出し + ボタン)。btnHtml は行 -> ボタンHTML。 */
function mtIslandHtml(island, btnHtml) {
  var sp = island.spec;
  return '<div class="group' + (sp.cls ? ' ' + sp.cls : '') + '">' +
    (sp.label ? '<span class="glab">' + sp.label + '</span>' : '') +
    island.rows.map(btnHtml).join('') + '</div>';
}

/* =======================================================================
   見取り設計書 v1.0 §3/§4 — 協調／獲得のバランス
   -----------------------------------------------------------------------
   ★★ 評価尺度ではない。獲得が多いほど良い、という設計にはしない(§4)。
      そう作ると「自己主張の回数を稼ぐ授業」になる。見たいのは多寡ではなく偏り。
      片側にしか立たないクラスは、どちらに寄っていても健全ではない。
      だから注記は必ず数字の【上】に置く。下に置くと読まれない。
   ★★ 層を混ぜない(§1)。行動の記録(数えた)と よさの記録(解釈した)は別の行で出す。
   ======================================================================= */
var MK_WARN_HTML =
  '<div class="mkwarn">' +
    '<b>これは評価の物差しではありません。</b>　' +
    '獲得が多いほど良い、ではありません。そう読むと「自己主張の回数を稼ぐ授業」になります。<br>' +
    '見たいのは多い少ないではなく<b>偏り</b>です。片側にしか立たない学級は、どちらに寄っていても健全ではありません。' +
  '</div>';
var MK_ZERO_NOTE =
  'ゼロは「その行動がなかった」のか「先生が見ていなかった」のか<b>区別できません</b>。' +
  '次の会で意図的に見に行く子を決めるために使ってください。';

function mkPct(v) { return (v == null) ? '—' : Math.round(v * 100) + '%'; }
/** 協調／獲得の1本の帯。0件のときは帯を出さず「まだ記録がありません」にする。 */
function mkBarHtml(name, sub, d) {
  var kyo = d['協調'], kaku = d['獲得'], tot = kyo + kaku;
  var bar = tot === 0
    ? '<div class="mkbal__empty">まだ記録がありません</div>'
    : '<div class="mkbal__seg mkbal__seg--kyo" style="flex:' + kyo + '">' + (kyo ? '協調 ' + kyo : '') + '</div>' +
      '<div class="mkbal__seg mkbal__seg--kaku" style="flex:' + kaku + '">' + (kaku ? '獲得 ' + kaku : '') + '</div>';
  return '<div class="mkbal__row">' +
    '<div class="mkbal__name">' + escapeHtml(name) + '<small>' + escapeHtml(sub) + '</small></div>' +
    '<div class="mkbal__bar">' + bar + '</div></div>';
}

/* ============================================================
   小物
   ============================================================ */
function mtEl_(x) { return (typeof x === 'string') ? document.getElementById(x) : x; }
function mtEsc_(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/** 属性値の中に入れる文字列(onclick="fn('…')" の '…' 用)。 */
function mtAttr_(s) { return String(s == null ? '' : s).replace(/'/g, '\\\''); }
/** カンマ区切りの児童IDを配列に。 */
function mtIds(v) {
  return String(v == null ? '' : v).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
}

/* Nodeの単体テスト用(ブラウザでは無視される)。mtSolveFit の冪等性・純粋性を tests/ で確かめる。 */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { mtSolveFit: mtSolveFit, mtTsunagiText: mtTsunagiText, mtIsLinkTool: mtIsLinkTool, mtIslands: mtIslands, MT_SEAT: MT_SEAT };
}

<script>
/* js_master.html — 設定(旧マスタ管理・03画面設計 §6 / docs/設定画面モック.html を正)。

// 設定内の各ビューの表示名・パンくず・戻り先(パンくずは 設定 › X)
var SET_VIEWS = {
  hub:      { label: '',            crumb: '' },

  seat:     { label: '座席表',      crumb: '座席表' },
  unit:     { label: '単元設定',    crumb: '単元設定' },

  phrases:  { label: '定型句',      crumb: '定型句' },
  customize:{ label: 'カスタマイズ', crumb: 'カスタマイズ' },
  test:     { label: 'テスト入力',  crumb: 'テスト入力' },
};

function goMaster() {

}
