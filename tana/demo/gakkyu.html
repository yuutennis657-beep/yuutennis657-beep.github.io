/* ===== タイマー(会の経過時間) ===== */
function startKaigiTimer() {
  if (App._kaigiTimer) { clearInterval(App._kaigiTimer); App._kaigiTimer = null; }
  if (!App.kaigi.startAt) App.kaigi.startAt = Date.now();
  function tick() {
    var el0 = document.getElementById('kaigi-timer'); if (!el0) { clearInterval(App._kaigiTimer); App._kaigiTimer = null; return; }
    var sec = Math.floor((Date.now() - App.kaigi.startAt) / 1000);
    var m = Math.floor(sec / 60), s = sec % 60;
    el0.textContent = m + ':' + ('0' + s).slice(-2);
  }
  tick();
  App._kaigiTimer = setInterval(tick, 1000);
}
function stopKaigiTimer() { if (App._kaigiTimer) { clearInterval(App._kaigiTimer); App._kaigiTimer = null; } }

/* ===== 道具バー: 押す頻度で上下2段(見取り設計書 v1.0 §5) =====
   ・上段(toolrow1)=『段』が「上」のボタンを大きく / 下段(toolrow2)=「下」を小さく
   ・どちらの段にも 行動の記録(紫) と よさの記録(緑) が入りうる。層は色と島の見出しで分ける(§1)
   ・島分け・段分けは必ずマスタから作る(コードに種類名を書かない・設計19 §5 / 21 §2)
   ・『記録の場=事後』のボタン(ゆずる・自己実現)はサーバ側で除いてある。押すのは振り返り画面(§2/§7) */
function refreshTools() { renderToolRows(); renderNowBar(); renderSide(); }
/** 道具バー全体(上段+下段)を描き直す。選んだ道具の✓は上下どちらの段にも立ちうる。 */
function renderToolRows() { renderPalettes(); renderYosa(); }

/** マスタ行の『段』。空欄は「下」(移行前のシートでも壊れない)。 */
function danOf(row) { return (row && String(row['段'] == null ? '' : row['段']).trim() === '上') ? '上' : '下'; }
/** ボタンのtitle: マスタの『押す条件(外形)』をそのまま出す(見取り設計書 §2)。 */
function oshuJoken(row, fallback) {
  var v = row ? String(row['押す条件'] == null ? '' : row['押す条件']).trim() : '';
  return v || fallback || '';
}
/** 行動の記録(発言)のボタン。 */
function palBtnHtml(t) {
  var K = App.kaigi, kind = t['種類'], on = (K.tool.kind === 'speech' && K.tool.value === kind);
  // 🔗の道具は、選んでいなくても囲む(色=発言か よさか / 🔗=つながり。2つの符号を独立させる・20 §6.2)
  var lk = mtIsLinkTool(t) ? ' pbtn--link' : '';
  var tip = oshuJoken(t, mtIsLinkTool(t) ? '話した子 → 相手 の順にタップ' : '話した子をタップするだけ');
  return '<button type="button" class="pbtn' + lk + (on ? ' on' : '') + '" title="' + escapeAttr(tip) + '" ' +
    'onclick="setTool(\'speech\',\'' + escapeAttr(kind) + '\')">' + escapeHtml(kind) + '</button>';
}
/** よさの記録のボタン。絵文字はライブ画面では出さない(上下で読み方をそろえる・20 §6.1)。 */
function yosaBtnHtml(st) {
  var K = App.kaigi, name = st['スタンプ'], on = (K.tool.kind === 'yosa' && K.tool.value === name);
  var rel = isRelationalStamp(name), lk = rel ? ' pbtn--link' : '';
  var tip = oshuJoken(st, rel ? 'よさを見つけた子 → 相手 の順にタップ' : '見つけた子をタップするだけ');
  return '<button type="button" class="pbtn pbtn--yosa' + lk + (on ? ' on' : '') + '" title="' + escapeAttr(tip) + '" ' +
    'onclick="setTool(\'yosa\',\'' + escapeAttr(name) + '\')">' + escapeHtml(name) + '</button>';
}
/**
 * 1段ぶんの島HTML。行動(発言)の島 → よさの島 の順に並べる。
 * 層(行動/よさ)を島の見出しで必ず分ける = 数えたものと解釈したものを混ぜない(見取り設計書 §1)。
 */
function toolIslandsHtml(dan) {
  var b = App.kaigiBoot;
  var types = (b['発言種類'] || []).filter(function (t) { return t['種別'] !== '教師' && danOf(t) === dan; });
  var stamps = (b['よさスタンプ'] || []).filter(function (st) { return danOf(st) === dan; });
  var acts = mtIslands(types, [
    { key: 'a1', label: '発言<br>1タップ', test: function (t) { return !mtIsLinkTool(t); } },
    { key: 'aL', label: mtIco('link') + ' 発言<br>だれに？も残せる', cls: 'group--link' },
  ]);
  var yos = mtIslands(stamps, [
    { key: 'y1', label: 'よさ<br>1タップ', cls: 'group--yosa', test: function (st) { return !isRelationalStamp(st['スタンプ']); } },
    { key: 'yL', label: mtIco('link') + ' よさ<br>だれに？も残せる', cls: 'group--link group--yosa' },
  ]);
  return acts.map(function (g) { return mtIslandHtml(g, palBtnHtml); }).join('') +
    yos.map(function (g) { return mtIslandHtml(g, yosaBtnHtml); }).join('');
}

/** 上段(よく押す4つ・大きく)。つなぎ中は確定帯に差し替える(§4.1・指の位置に確定ボタン)。 */
function renderPalettes() {
  var K = App.kaigi, row = document.getElementById('toolrow1'); if (!row) return;
  var L = K.linking;
  if (L && L.doerSid) { row.innerHTML = linkbarHtml(L); return; }
  var teacherTypes = (App.kaigiBoot['発言種類'] || []).filter(function (t) { return t['種別'] === '教師'; });
  // 教師パレットは道具バー1行目に入りきらない(実測で残り40px・必要420px)ので「先生 ▾」に畳む(20 §7.3)
  var teacher = (K.teacherOn && teacherTypes.length)
    ? '<div class="group group--tch"><button type="button" class="pbtn pbtn--tch tchtog" onclick="toggleTeacherPalette()">先生 ▾</button>' +
        '<div class="tchpop' + (K.teacherPalette ? '' : ' hidden') + '" id="tchpop">' +
          '<div class="tchpop__lab">押すと即記録</div>' +
          teacherTypes.map(function (t) { return '<button type="button" class="pbtn pbtn--tch" onclick="tapTeacher(\'' + escapeAttr(t['種類']) + '\')">' + escapeHtml(t['種類']) + '</button>'; }).join('') +
        '</div></div>'
    : '';
  var selOn = (K.tool.kind === 'select');
  row.innerHTML =
    '<span class="rowlab">よく<br>押す</span>' +
    toolIslandsHtml('上') +
    teacher +
    '<span class="spacer"></span>' +
    '<button type="button" class="pbtn pbtn--sel' + (selOn ? ' on' : '') + '" title="記録せずに、その子を右パネルで選ぶ" onclick="setTool(\'select\',\'\')">選ぶだけ</button>';
}
/** 確定帯(②のあいだだけ上段に出る)。発言=紫 / よさ=深緑(20 §6.2)。共通部品(21 §2)。 */
function linkbarHtml(L) {
  return mtLinkbarHtml({ doerName: nameOf(L.doerSid), kind: L.kind,
    targetNames: L.targets.map(nameOf), yosa: (L.mode === 'yosa'),
    onCommit: 'commitLinking()', onCancel: 'cancelLinking()',
    // ★25 §2.3: 宛先＝じぶん。『自分の願い』ボタンを廃したので、獲得はここで拾う。
    //   相手の席ではなく「じぶん」を宛先にして記録する(座席図に線は描かない・★25 §9)
    onSelf: (L.mode === 'yosa' || L.targets.length) ? '' : 'commitLinkingSelf()' });
}
/** 宛先を「じぶん」にして確定する(★25 §2.3)。幅③=自分から出発した、の唯一の入口。 */
function commitLinkingSelf() {
  var K = App.kaigi, L = K.linking; if (!L || !L.doerSid) return;
  L.targets = [L.doerSid];
  commitLinking();
}
/** 先生ミニパレットの開閉(道具バーの幅を児童パレットから1pxも奪わない・20 §7.3)。 */
function toggleTeacherPalette() { App.kaigi.teacherPalette = !App.kaigi.teacherPalette; renderPalettes(); }
/** 下段(残りを小さく)。関数名は呼び出し元をそのままにするため renderYosa を残す。 */
function renderYosa() {
  var host = document.getElementById('gLower'); if (!host) return;
  host.innerHTML = toolIslandsHtml('下');
}
// 道具を選ぶ。🔗の道具(発言/よさとも)を選んだら つなぎモードのstep1(起点待ち)に入る。同じ道具の再選択で解除。
function setTool(kind, value) {
  var K = App.kaigi;
  if (K.pickShikai) finishPickShikai();   // 道具を選んだら記録を始める合図(司会選びに閉じこめない)
  if (K.linking) cancelLinking(true);   // 途中のつなぎは記録せず破棄
  if (K.tool.kind === kind && K.tool.value === value) { K.tool = { kind: null, value: '' }; refreshTools(); return; }
  K.tool = { kind: kind, value: value };
  // 🔗のルールは画面じゅうで1つだけ: ①その子 → ②相手(相手なしでもOK)。発言でも よさ でも同じ(20 §5)
  if (isRelationalTool(kind, value)) K.linking = { mode: kind, kind: value, doerSid: null, targets: [], logId: null, when: null };
  refreshTools();
}
// 先生ミニパレット: 1タップ=即1件記録(児童タップ不要)
function tapTeacher(kind) {
  var K = App.kaigi;
  var log = { 'ログID': uuid(), '日時': nowLocal(), '議題ID': K.議題ID, '段階': K.stage, '発言種類': kind };
  callServer('appendTeacherSpeech', log).catch(alertErr);
  K.flow.unshift({ 表示名: '先生', 発言種類: kind, 時刻: nowLocal().slice(11, 16), teacher: true });
  if (K.flow.length > 8) K.flow.pop();
  renderKFlow();
}

/* ===== これまでのコの字(ゾーン→児童IDの配列) =====
   ★2026-10-05 から席は升目の自由配置(下の kg*・docs/29)。この節は「保存済みのコの字を読んで升目に変換する」
   ためだけに残す(座席表の古い行は捨てない)。画面はもうコの字の型では描かない。 */
var KZ_KONOJI = ['司会', '左辺', '正面', '右辺'];

function studentOf(sid) { return App.kaigi.students.filter(function (x) { return x['児童ID'] === sid; })[0]; }
function zoneList(K) { return KZ_KONOJI.filter(function (z) { return K.layout && K.layout[z]; }); }

/**
 * コの字の自動配分。左右の辺の列数(1〜3)と正面の段数(1〜3)で形が変わる。
 * 席数は「辺の列数 : 正面(2列ぶん相当)」の比で配る。例) 1列なら 7/15/7、2列なら 10/9/10(29人)。
 */
function autoKonoji(ids, sideCols) {
  var n = ids.length, cols = Math.max(1, Math.min(3, sideCols || 1));
  var sideN = Math.round(n * cols / (2 * cols + 2));
  if (n - sideN * 2 < 4) sideN = Math.max(0, Math.floor((n - 4) / 2));   // 正面が痩せすぎないように
  if (sideN < 0) sideN = 0;
  return {
    '左辺': ids.slice(0, sideN),
    '正面': ids.slice(sideN, n - sideN),
    '右辺': ids.slice(n - sideN).reverse(),   // 右辺は下から上へ(席順が一周する)
  };
}

/** 番号順に配り直す(司会グループはそのまま)。 */
function presetLayout(K) {
  var ids = K.students.map(function (s) { return s['児童ID']; });
  var known = {}; ids.forEach(function (id) { known[id] = true; });
  var shikai = ((K.layout && K.layout['司会']) || ids.filter(function (id) { return K.roles[id]; }))
    .filter(function (id) { return known[id]; });
  var rest = ids.filter(function (id) { return shikai.indexOf(id) < 0; });
  var L = { '司会': shikai }, k = autoKonoji(rest, K.sideCols);
  KZ_KONOJI.slice(1).forEach(function (z) { L[z] = k[z]; });
  return L;
}

/** 保存済み座席(boot['座席'])から並びを作る。無ければコの字に自動配分。 */
function buildKaigiLayout(K, saved) {
  var ids = K.students.map(function (s) { return s['児童ID']; });
  if (!saved || !saved.length) return presetLayout(K);
  // 保存した 行×列 から、辺の列数と正面の段数を戻す
  var sideCols = 1, frontRows = 1;
  saved.forEach(function (p) {
    if (p['ゾーン'] === '左辺' || p['ゾーン'] === '右辺') sideCols = Math.max(sideCols, p['列'] || 1);
    if (p['ゾーン'] === '正面') frontRows = Math.max(frontRows, p['行'] || 1);
  });
  K.sideCols = Math.max(1, Math.min(3, sideCols));
  K.frontRows = Math.max(1, Math.min(3, frontRows));
  var L = {}; KZ_KONOJI.forEach(function (z) { L[z] = []; });
  var known = {}, placed = {}, fromSaved = 0;
  ids.forEach(function (id) { known[id] = true; });
  saved.slice().sort(function (a, b) { return (a['順'] || 0) - (b['順'] || 0); }).forEach(function (p) {
    var z = p['ゾーン'], id = p['児童ID'];
    if (L[z] && known[id] && !placed[id]) { L[z].push(id); placed[id] = true; fromSaved++; }
  });
  // ★保存データからほとんど置けなかったときは、番号順の自動配分に戻す(2026-08-27)。
  //   ゾーンが空・別クラスの児童IDなど保存データが使えないとき、下の「正面の末尾へ」で
  //   全員が正面に積み上がり、コの字ではなく【一斉型のグリッド】に見えてしまう。
  //   ★先生が意図して全員を正面に置いた場合は fromSaved が人数ぶん立つので、ここには来ない。
  if (fromSaved < ids.length / 2) return presetLayout(K);
  ids.forEach(function (id) { if (!placed[id]) L['正面'].push(id); });   // 保存後に入った子は正面の末尾へ
  return L;
}

/** 保存用。行×列に実際の位置を入れる(次に開くとき 辺の列数・正面の段数 を復元できる)。 */
function layoutPlacements(K) {
  var out = [], sc = K.sideCols || 1, fr = K.frontRows || 2;
  var frontCols = Math.max(1, Math.ceil((K.layout['正面'] || []).length / fr));
  zoneList(K).forEach(function (z) {
    (K.layout[z] || []).forEach(function (sid, i) {
      var row = i + 1, col = 1;
      if (z === '左辺' || z === '右辺') { row = Math.floor(i / sc) + 1; col = (i % sc) + 1; }
      else if (z === '正面') { row = Math.floor(i / frontCols) + 1; col = (i % frontCols) + 1; }
      out.push({ '児童ID': sid, 'ゾーン': z, '順': i + 1, '行': row, '列': col });
    });
  });
  return out;
}
/* ===== 席の自由配置(docs/29 §2) =====
   教室を升目(横24×縦16)にして、席はどの升にも置ける。並びは K.pos(児童ID→{r,c}・1始まり)が正。
   K.pos に無い子は「置き場」(画面の下)。型(コの字/班/向かい合い/前向き/円)から始めて、ドラッグで直す。
   ★ここから下の kg* は DOM も App も触らない純関数(tests/kaigi_grid.test.js で確かめる)。 */
var KG_GRID = { cols: 24, rows: 16 };   // 升目の細かさ(docs/29 §7①。使って粗ければここだけ変える)
var KG_TYPES = ['コの字', '円'];   // 学級会の型はこの2つ(2026-10-06 先生。班・向かい合い・前向きは使わない)

function kgClamp_(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function kgInGrid(r, c) { return r >= 1 && r <= KG_GRID.rows && c >= 1 && c <= KG_GRID.cols; }
/** (r,c) にいる子(except を除く)。いなければ null。 */
function kgOccupant(pos, r, c, except) {
  for (var sid in pos) { if (sid !== except && pos[sid] && pos[sid].r === r && pos[sid].c === c) return sid; }
  return null;
}
function kgCopy_(pos) { var o = {}; for (var k in pos) o[k] = { r: pos[k].r, c: pos[k].c }; return o; }

/**
 * 司会グループの行(黒板の前・上の端に中央寄せ)+ 本体(型の升目)を、24×16 の升目に置く。
 * 本体は左右中央。升目からはみ出す子は置かない(=置き場に出る)。
 * @param {string[]} shikai 司会グループの児童ID
 * @param {string[]} main 本体の児童ID(cells と同じ順)
 * @param {number[][]} cells 本体の位置 [行,列](0始まり・型の中の位置)
 * @param {number} w 本体の横幅(升)
 */
function kgCompose(shikai, main, cells, w, reserve) {
  var G = KG_GRID, pos = {}, top = reserve ? 3 : 1;   // reserve=司会の席(上の行)を、司会0人でも空けておく
  if (shikai.length) {
    var per = G.cols, rows = Math.ceil(shikai.length / per);
    shikai.forEach(function (sid, i) {
      var row = Math.floor(i / per), inRow = Math.min(per, shikai.length - row * per);
      pos[sid] = { r: 1 + row, c: Math.floor((G.cols - inRow) / 2) + 1 + (i % per) };
    });
    top = rows + 2;   // 司会の行と本体のあいだに1升あける
  }
  var off = Math.floor((G.cols - w) / 2) + 1;
  main.forEach(function (sid, i) {
    var cell = cells[i]; if (!cell) return;
    var r = top + cell[0], c = off + cell[1];
    if (kgInGrid(r, c) && !kgOccupant(pos, r, c)) pos[sid] = { r: r, c: c };
  });
  return pos;
}

/** コの字の升目。左辺 nL・正面 nF・右辺 nR、辺は sc 列・正面は fr 段。正面は辺の下端にそろえる。 */
function kgKonojiCells(nL, nF, nR, sc, fr) {
  sc = kgClamp_(sc || 2, 1, 3); fr = kgClamp_(fr || 2, 1, 3);
  var fc = Math.max(1, Math.ceil(nF / fr));
  fc = Math.min(fc, KG_GRID.cols - 2 * sc - 2);
  var frows = nF ? Math.ceil(nF / fc) : 0;
  var sideRows = Math.ceil(Math.max(nL, nR) / sc);
  var H = Math.max(sideRows, frows), w = sc + 1 + fc + 1 + sc, cells = [], i;
  for (i = 0; i < nL; i++) cells.push([Math.floor(i / sc), i % sc]);
  for (i = 0; i < nF; i++) cells.push([H - frows + Math.floor(i / fc), sc + 1 + (i % fc)]);
  for (i = 0; i < nR; i++) cells.push([Math.floor(i / sc), w - sc + (i % sc)]);
  return { cells: cells, w: w };
}
/**
 * 円。四すみを落とした長方形の輪(八角形)に、上のまん中から時計回りに番号順で並べる。
 * ★本当のだ円にすると、まん中と外側に空き升が多く盤が大きくなりすぎて1画面に入らない(2026-10-06 実測 23×15升)。
 *   輪は席が切れ目なく続くので、35人で 14×8升 ほど(コの字と同じくらい)に収まる。
 */
function kgEnCells(n) {
  // 横長の輪(画面が横長なので、縦を低くして1画面に収める。35人で 16×6升)
  var W = 6, H = 4, maxH = KG_GRID.rows - 3;   // 上の2行は司会の席
  for (W = 6; W <= KG_GRID.cols; W++) {
    H = Math.max(4, Math.min(maxH, Math.round(W * 0.38)));
    if (2 * W + 2 * H - 8 >= n) break;
  }
  W = Math.min(W, KG_GRID.cols);
  while (2 * W + 2 * H - 8 < n && H < maxH) H++;   // 横がいっぱいなら縦をのばす(60人など)
  var ring = [], c, r;
  for (c = 1; c <= W - 2; c++) ring.push([0, c]);            // 上(左→右)
  for (r = 1; r <= H - 2; r++) ring.push([r, W - 1]);        // 右(上→下)
  for (c = W - 2; c >= 1; c--) ring.push([H - 1, c]);        // 下(右→左)
  for (r = H - 2; r >= 1; r--) ring.push([r, 0]);            // 左(下→上)
  // 上のまん中から始める(黒板の前の正面が1番)
  var start = Math.floor((W - 2) / 2);
  ring = ring.slice(start).concat(ring.slice(0, start));
  var cells = [], cap = ring.length;
  for (var i = 0; i < Math.min(n, cap); i++) cells.push(ring[Math.floor(i * cap / n)]);   // 余りは輪じゅうに散らす
  return { cells: cells, w: W };
}

/**
 * 型から番号順に配る(docs/29 §2.1)。司会グループは黒板の前の行へ。
 * @param {string} type KG_TYPES のどれか(知らない名前はコの字)
 * @param {string[]} ids 全員の児童ID(番号順)
 * @param {string[]} shikai 司会グループの児童ID
 * @return {Object} pos
 */
function kgTemplate(type, ids, shikai) {
  var sh = (shikai || []).filter(function (id) { return ids.indexOf(id) >= 0; });
  var main = ids.filter(function (id) { return sh.indexOf(id) < 0; }), r;
  if (type === '円') {
    r = kgEnCells(main.length);
    // ★円も黒板の前に「司会の席」を空けておく(司会0人でも。ドラッグ・タップで司会グループにできる行)
    return kgCompose(sh, main, r.cells, r.w, true);
  }
  else {
    var k = autoKonoji(main, 2);
    main = k['左辺'].concat(k['正面'], k['右辺']);
    r = kgKonojiCells(k['左辺'].length, k['正面'].length, k['右辺'].length, 2, 2);
    // ★コの字は黒板の前に「司会の席」をいつも空けておく(司会0人でも)。選ぶとそこに並ぶ
    return kgCompose(sh, main, r.cells, r.w, true);
  }
  return kgCompose(sh, main, r.cells, r.w);
}
/**
 * 司会グループを黒板の前(いちばん上の行)へ並べる。保存した並び(手で直した並び)用:
 * ほかの子は動かさず、上に2行の空きが無ければ全体を下へずらしてから、外枠の中央に横一列で置く。
 * @return {Object} 新しい pos
 */
function kgShikaiToFront(pos, shikai) {
  var G = KG_GRID, out = kgCopy_(pos), sh = (shikai || []).slice();
  sh.forEach(function (sid) { delete out[sid]; });
  if (!sh.length) return out;
  var b = kgBounds(out) || { r0: 3, r1: 3, c0: 1, c1: G.cols };
  var need = Math.ceil(sh.length / G.cols) + 1;           // 司会の行 + 1行あける
  var shift = Math.max(0, Math.min(need + 1 - b.r0, G.rows - b.r1));
  if (shift) for (var k in out) out[k] = { r: out[k].r + shift, c: out[k].c };
  var row = Math.max(1, b.r0 + shift - need), mid = Math.floor((b.c0 + b.c1) / 2);
  var c = Math.max(1, Math.min(G.cols - Math.min(sh.length, G.cols) + 1, mid - Math.floor((sh.length - 1) / 2)));
  sh.forEach(function (sid) {
    while (kgOccupant(out, row, c)) { c++; if (c > G.cols) { c = 1; row++; } }
    if (kgInGrid(row, c)) { out[sid] = { r: row, c: c }; c++; if (c > G.cols) { c = 1; row++; } }
  });
  return out;
}
/**
 * まとめて動かす量を、升目からはみ出さない範囲に縮める(はしに寄せて置けるように)。
 * @return {{dr:number, dc:number}}
 */
function kgFitDelta(pos, ids, dr, dc) {
  var b = kgBounds((ids || []).reduce(function (o, id) { if (pos[id]) o[id] = pos[id]; return o; }, {}));
  if (!b) return { dr: 0, dc: 0 };
  return { dr: kgClamp_(dr, 1 - b.r0, KG_GRID.rows - b.r1), dc: kgClamp_(dc, 1 - b.c0, KG_GRID.cols - b.c1) };
}
/**
 * 置き場の子をまとめて置く。(r,c) から右へ、空いた升に番号順で1人ずつ。行のはしまで行ったら次の行の c から。
 * 升目が足りなければ、置けなかった子は置き場のまま。
 * @return {Object} 新しい pos
 */
function kgPlaceMany(pos, ids, r, c) {
  var out = kgCopy_(pos), G = KG_GRID, rr = r, cc = c;
  (ids || []).forEach(function (sid) {
    if (out[sid]) return;
    while (rr <= G.rows && kgOccupant(out, rr, cc)) { cc++; if (cc > G.cols) { cc = c; rr++; } }
    if (rr > G.rows) return;
    out[sid] = { r: rr, c: cc };
    cc++; if (cc > G.cols) { cc = c; rr++; }
  });
  return out;
}
/**
 * 何人かを まとめて (dr,dc) だけ動かす(一括ドラッグ・docs/29 §2.1 の拡張)。
 * 行き先にグループ外の子がいれば、その子はグループが空けた升へ入れ替わる。升目からはみ出すなら null(動かさない)。
 * @return {Object|null}
 */
function kgMoveGroup(pos, ids, dr, dc) {
  var grp = (ids || []).filter(function (sid) { return pos[sid]; });
  if (!grp.length || (!dr && !dc)) return pos;
  var inG = {}; grp.forEach(function (sid) { inG[sid] = true; });
  var target = {}, i;
  for (i = 0; i < grp.length; i++) {
    var p = pos[grp[i]], r = p.r + dr, c = p.c + dc;
    if (!kgInGrid(r, c)) return null;
    target[grp[i]] = { r: r, c: c };
  }
  var tKey = {}; grp.forEach(function (sid) { tKey[target[sid].r + ',' + target[sid].c] = true; });
  // グループが空ける升(行き先に含まれない元の升)を、押し出される子の行き先にする(上から・左から)
  var vacated = grp.map(function (sid) { return pos[sid]; })
    .filter(function (p) { return !tKey[p.r + ',' + p.c]; })
    .sort(function (a, b) { return a.r - b.r || a.c - b.c; });
  var out = kgCopy_(pos), bumped = [];
  for (var sid in pos) {
    if (inG[sid]) continue;
    if (tKey[pos[sid].r + ',' + pos[sid].c]) bumped.push(sid);
  }
  bumped.sort(function (a, b) { return pos[a].r - pos[b].r || pos[a].c - pos[b].c; });
  bumped.forEach(function (sid, k) { out[sid] = { r: vacated[k].r, c: vacated[k].c }; });
  grp.forEach(function (sid) { out[sid] = target[sid]; });
  return out;
}
/** これまでのコの字(ゾーン→児童IDの並び)を升目に変換する(docs/29 §2.2「捨てない・変換して開く」)。 */
function kgFromKonoji(L, sideCols, frontRows) {
  var l = L['左辺'] || [], f = L['正面'] || [], rr = L['右辺'] || [];
  var r = kgKonojiCells(l.length, f.length, rr.length, sideCols, frontRows);
  return kgCompose(L['司会'] || [], l.concat(f, rr), r.cells, r.w);
}
/**
 * 保存された席から K.pos を作る。
 * @param {Object[]} students [{児童ID}](番号順)
 * @param {Object} seating boot['座席'] = { 形:'自由'|'コの字'|'', 席:[...] }
 * @param {string[]} shikai いまの司会グループ(保存が無いときの型に使う)
 */
function kgFromSaved(students, seating, shikai) {
  var ids = (students || []).map(function (s) { return s['児童ID']; });
  var sv = seating || {}, list = sv['席'] || [];
  if (sv['形'] === '自由') {
    var known = {}, pos = {};
    ids.forEach(function (id) { known[id] = true; });
    list.forEach(function (p) {
      var sid = p['児童ID'], r = Number(p['行']), c = Number(p['列']);
      if (known[sid] && !pos[sid] && kgInGrid(r, c) && !kgOccupant(pos, r, c)) pos[sid] = { r: r, c: c };
    });
    // ★1人も置けない保存データ(別クラスのID・壊れた行)なら、型から配り直す(2026-08-27 の教訓)。
    //   一部だけ置けたときは、そのまま。置けなかった子(転入・人数を増やした)は置き場に出る。
    if (Object.keys(pos).length) return pos;
  } else if (sv['形'] === 'コの字' && list.length) {
    var K = { students: students, roles: {}, sideCols: 2, frontRows: 2, layout: null };
    var L = buildKaigiLayout(K, list);
    return kgFromKonoji(L, K.sideCols, K.frontRows);
  }
  return kgTemplate('コの字', ids, shikai || []);
}
/**
 * sid を (r,c) に置く。置いた先に席があれば入れ替え(相手は sid のもとの升へ。sid が置き場から来たなら相手が置き場へ)。
 * @return {Object} 新しい pos(元の pos は変えない)
 */
function kgPlace(pos, sid, r, c) {
  if (!kgInGrid(r, c)) return pos;
  var out = kgCopy_(pos), from = out[sid] || null, occ = kgOccupant(out, r, c, sid);
  if (occ) { if (from) out[occ] = { r: from.r, c: from.c }; else delete out[occ]; }
  out[sid] = { r: r, c: c };
  return out;
}
/** sid を置き場へ。 */
function kgUnplace(pos, sid) { var out = kgCopy_(pos); delete out[sid]; return out; }
/** 置いた席の外枠。1つも無ければ null。 */
function kgBounds(pos) {
  var b = null;
  for (var sid in pos) {
    var p = pos[sid];
    if (!b) b = { r0: p.r, r1: p.r, c0: p.c, c1: p.c };
    else { b.r0 = Math.min(b.r0, p.r); b.r1 = Math.max(b.r1, p.r); b.c0 = Math.min(b.c0, p.c); b.c1 = Math.max(b.c1, p.c); }
  }
  return b;
}
/**
 * 画面に出す範囲。ふだんは外枠ぴったり(自動で拡大)。
 * 席を直すときは、黒板の前(1行目)まで・下2升・左右3升(そこへ自由に動かせる)。
 * ★2026-10-22「座席が動かしにくい・司会の黒板前が反応しない」: 上を外枠-1升にしていたので、
 *   黒板の前の行(司会の席)へドラッグしても升の外になり、落とせなかった。
 */
function kgView(pos, edit) {
  var b = kgBounds(pos) || { r0: 1, r1: 4, c0: 9, c1: 16 }, m = edit ? 3 : 0;
  return { r0: edit ? 1 : b.r0, r1: Math.min(KG_GRID.rows, b.r1 + (edit ? 2 : 0)),
           c0: Math.max(1, b.c0 - m), c1: Math.min(KG_GRID.cols, b.c1 + m) };
}
/**
 * 画面の点 → 升。geo = { left, top, cw, ch, r0, r1, c0, c1, flip }(fitHall が決める)。範囲の外は null。
 * flip(先生から見る)は上下左右を入れ替えて描くので、ここでも戻す。
 */
function kgCellAt(x, y, geo) {
  var i = Math.floor((y - geo.top) / geo.ch), j = Math.floor((x - geo.left) / geo.cw);
  var nr = geo.r1 - geo.r0 + 1, nc = geo.c1 - geo.c0 + 1;
  if (i < 0 || j < 0 || i >= nr || j >= nc) return null;
  return geo.flip ? { r: geo.r1 - i, c: geo.c1 - j } : { r: geo.r0 + i, c: geo.c0 + j };
}
/**
 * 「席表をまとめて貼る」(研究用の会)の読み取り。1行に1人:  番号:行,列 呼び名 役割
 *   例) 2:1,11 Aさん 司会   ／  行・列や役割は省いてよい(「5 Bさん」なら呼び名だけ)
 *   全角の数字・コロン・カンマ・空白も読む。読めない行は errors に入れて、ほかの行は使う。
 * ★呼び名はこの会の中だけ(議題マスタ.研究_呼び名)。コードやファイルには残さない(26)。
 * @return {{n:number, names:string[], seats:Object[], roles:Object[], errors:string[]}}
 */
function kgParseSeatPaste(text) {
  var out = { n: 0, names: [], seats: [], roles: [], errors: [] }, seen = {};
  String(text == null ? '' : text).split(/\r?\n/).forEach(function (raw, li) {
    var line = raw.replace(/[０-９]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 0xFEE0); })
      .replace(/[：]/g, ':').replace(/[，、]/g, ',').replace(/\u3000/g, ' ').trim();
    if (!line) return;
    var m = /^(\d+)\s*(?::\s*(\d+)\s*,\s*(\d+))?\s*(.*)$/.exec(line);
    if (!m) { out.errors.push((li + 1) + '行目: 番号が読めません'); return; }
    var no = Number(m[1]); if (!(no >= 1 && no <= 60)) { out.errors.push((li + 1) + '行目: 番号は1〜60'); return; }
    if (seen[no]) { out.errors.push((li + 1) + '行目: ' + no + '番が2回あります'); return; }
    seen[no] = true;
    var words = (m[4] || '').split(/\s+/).filter(Boolean);
    out.names[no - 1] = (words[0] || '').replace(/[,、，]/g, '');   // 区切りに使う記号は落とす(録音くん側は 、 でも区切る)
    if (words.length > 1) out.roles.push({ '番号': no, '役割': words.slice(1).join(' ') });
    if (m[2]) {
      var r = Number(m[2]), c = Number(m[3]);
      if (kgInGrid(r, c)) out.seats.push({ '番号': no, '行': r, '列': c });
      else out.errors.push((li + 1) + '行目: 席の位置が升目の外です(行1〜' + KG_GRID.rows + '・列1〜' + KG_GRID.cols + ')');
    }
    out.n = Math.max(out.n, no);
  });
  for (var i = 0; i < out.n; i++) if (out.names[i] == null) out.names[i] = '';
  // 同じ升に2人いたら、あとの子は置き場(席を作らない)
  var used = {};
  out.seats = out.seats.filter(function (p) { var k = p['行'] + ',' + p['列']; if (used[k]) { out.errors.push(p['番号'] + '番: ' + used[k] + '番と同じ升です'); return false; } used[k] = p['番号']; return true; });
  return out;
}
/** 保存用。全員ぶん(置き場の子は 行・列 = 0)。 */
function kgPlacements(pos, ids) {
  return (ids || []).map(function (sid) {
    var p = pos[sid];
    return { '児童ID': sid, '行': p ? p.r : 0, '列': p ? p.c : 0 };
  });
}

/* ===== 描画(座席ホール・自由配置。設計19 §6 / 21 §2 の自動採寸の考え方を引き継ぐ) ===== */
function shikaiIdsOf(K) { return (K.students || []).map(function (s) { return s['児童ID']; }).filter(function (id) { return K.roles[id]; }); }
function kaigiIds(K) { return (K.students || []).map(function (s) { return s['児童ID']; }); }

/**
 * 「司会の席」の行(docs/29 §3 の拡張: 座席の升で司会グループを決める)。
 *   司会がいれば その子たちのいちばん上の行。いなければ 本体の2行上(空いていれば)。無ければ null。
 *   ふだん(記録中)は、司会がいる行に帯は出さない(席がそこにあるので分かる)。コの字の型のまま0人のときだけ出す。
 */
function shikaiRowOf_(K) {
  if (!K || !K.pos) return null;
  if (!K.editSeats && !K.pickShikai && !showShikaiSlot_(K)) return null;
  var ids = kaigiIds(K).filter(function (id) { return K.pos[id]; });
  var sh = ids.filter(function (id) { return K.roles[id]; });
  var others = ids.filter(function (id) { return !K.roles[id]; });
  if (sh.length) {
    // ★司会の子だけが座っている行に限る(教室のまん中にいる司会の行を「司会の席」にすると、
    //   そこへ動かしたほかの子まで司会グループになってしまう)
    var r = Math.min.apply(null, sh.map(function (id) { return K.pos[id].r; }));
    if (!others.some(function (id) { return K.pos[id].r === r; })) return r;
  }
  var b = kgBounds(others.reduce(function (o, id) { o[id] = K.pos[id]; return o; }, {}));
  return (b && b.r0 >= 3) ? b.r0 - 2 : null;
}
/** 司会の席の行で、いちばん真ん中に近い空いた升。 */
function nearestFreeInRow_(pos, row, cMid) {
  for (var d = 0; d < KG_GRID.cols; d++) {
    var cs = d ? [cMid - d, cMid + d] : [cMid];
    for (var i = 0; i < cs.length; i++) if (kgInGrid(row, cs[i]) && !kgOccupant(pos, row, cs[i])) return cs[i];
  }
  return null;
}
/** 司会の席を押した: 選んでいる子(まとめて選んだ子)を司会の席へ置き、司会グループにする。 */
function shikaiSlotTap(ev) {
  if (ev) ev.stopPropagation();
  var K = App.kaigi, row = shikaiRowOf_(K); if (!row) return;
  var ids = multiIds_().length ? multiIds_() : (K.sel ? [K.sel] : []);
  if (!ids.length) { flashMsg_(K.pickShikai ? '司会グループにする子の席をタップしてください' : '先に席をタップして子をえらび、それから「司会の席」を押してください'); return; }
  var b = kgBounds(kaigiIds(K).filter(function (id) { return K.pos[id] && !K.roles[id]; }).reduce(function (o, id) { o[id] = K.pos[id]; return o; }, {}));
  var mid = b ? Math.round((b.c0 + b.c1) / 2) : 12, assigns = [];
  ids.forEach(function (sid) {
    if (K.pos[sid] && K.pos[sid].r === row) return;
    var pos = kgUnplace(K.pos, sid), c = nearestFreeInRow_(pos, row, mid);
    if (c == null) return;
    pos[sid] = { r: row, c: c }; K.pos = pos;
    if (!K.roles[sid]) { K.roles[sid] = KAIGI_SHIKAI_NONAME; assigns.push({ '児童ID': sid, '役割': KAIGI_SHIKAI_NONAME }); }
  });
  if (assigns.length && !K.pickShikai) callServer('assignRoles', K.議題ID, assigns).catch(alertErr);   // 選び中は［これで決める］でまとめて書く
  K.multi = {};
  markHandMoved_();
  renderHall(); renderKPanel(); renderNowBar();
  flashMsg_('✔ ' + ids.length + '人を司会グループにしました(役割は右で選べます)');
}
/**
 * 升へ動かしたあと: 司会の席の行に入った子=司会グループ、司会の席の行から出た子=司会グループから外す。
 * @param {string[]} ids 動かした子 / @param {number|null} row 動かす前の司会の席の行
 */
function syncShikaiByRow_(ids, row) {
  var K = App.kaigi; if (!row || !K.editSeats) return;
  var assigns = [];
  ids.forEach(function (sid) {
    var p = K.pos[sid], inRow = !!(p && p.r === row);
    if (inRow && !K.roles[sid]) { K.roles[sid] = KAIGI_SHIKAI_NONAME; assigns.push({ '児童ID': sid, '役割': KAIGI_SHIKAI_NONAME }); }
    else if (!inRow && K.roles[sid]) { delete K.roles[sid]; assigns.push({ '児童ID': sid, '役割': '' }); }
  });
  if (assigns.length) callServer('assignRoles', K.議題ID, assigns).catch(alertErr);
}
/** コの字の型のまま(手で直していない)で、司会がまだ0人なら、上の行に「司会の席」を見せる。 */
function showShikaiSlot_(K) {
  return (K.gridType === 'コの字' || K.gridType === '円') && K.layoutAuto && !K.handMoved && !shikaiIdsOf(K).length;
}
/** 司会グループが変わったとき、型のままの並びなら型から配り直す(司会は黒板の前の席へ)。 */
function reflowShikai_() {
  var K = App.kaigi;
  if (!(K.layoutAuto && !K.handMoved && K.gridType)) return false;
  K.pos = kgTemplate(K.gridType, kaigiIds(K), shikaiIdsOf(K));
  K.seatsDirty = true;
  return true;
}
function renderHall() {
  var K = App.kaigi, host = document.getElementById('hall'); if (!host) return;

    : '<b>ドラッグ</b>でも<b>タップ</b>でも動かせます(席をタップ→置きたい升をタップ)。空いたところから<b>なぞって囲む</b>と、まとめて動かせます');

  }

  // 「まだつながっていない ○人」は司会帯が無くなったので、上の帯(めあての行)へ(docs/29 §3)
  var yetHtml = (K.editSeats || K.pickShikai) ? ''
    : mtYetHtml(notLinkedCount(), { yet: 'まだつながっていない', zero: '全員がだれかとつながりました' });
  var ids = kaigiIds(K);
  var placed = ids.filter(function (id) { return K.pos[id]; });

  host.innerHTML =
    ((info.length || yetHtml) ? '<div class="kg-info"><span class="meate">' + info.join('　/　') + '</span>' + yetHtml + '</div>' : '') +
    '<div class="kg-board" id="kg-board"' + (K.editSeats ? ' onclick="boardTap(event)" onpointerdown="boardPressStart(event)"' : '') + '>' +
      '<div class="kg-lines" id="kg-lines"></div><div class="kg-hi" id="kg-hi" hidden></div>' +
      (shikaiRowOf_(K) ? '<div class="kg-shslot' + ((K.editSeats || K.pickShikai) ? ' kg-shslot--tap' : '') + '" id="kg-shslot"' +
          ((K.editSeats || K.pickShikai) ? ' onclick="shikaiSlotTap(event)"' : '') + '>' + mtIco('mic') + ' 司会の席<small>' +
          (K.editSeats ? '(子をえらんで ここを押す／ここへドラッグ＝司会グループ)' : '(司会グループを選ぶと、ここに並びます)') + '</small></div>' : '') +
      placed.map(chairHtml).join('') +
      // 升の上で名前を直す(席を直すとき・1人を選んでいるとき)
      ((K.editSeats && K.sel && K.pos[K.sel] && !multiIds_().length)
        ? '<button type="button" class="kg-pen" id="kg-pen" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();startInlineName()" title="この席の上で名前を直す" aria-label="名前を直す">✎</button>' : '') +
    '</div>' +
    ((K.editSeats || tray.length)
      ? '<div class="kg-tray" id="kg-tray"' + (K.editSeats ? ' onclick="trayTap(event)"' : '') + '><span class="kg-tray__lab">置き場' + (tray.length ? '<b>' + tray.length + '人</b>' : '') + '</span>' +
          ((K.editSeats && tray.length > 1) ? '<button type="button" class="kg-tray__all" onclick="event.stopPropagation();pickTrayAll()">まとめて選ぶ</button>' : '') +
          (tray.map(chairHtml).join('') || '<span class="kg-tray__empty">ここに落とすと席から外れます</span>') + '</div>'
      : '');
  fitHall();          // 冪等(20 §2)。中で drawLinkLines() まで呼ぶので二度呼びは不要
}

/** その子に結び(発言 or よさ のつながり)が1本でもあるか。K.links から数えるので、取り消せば戻る(20 §7.1)。 */
function linkedSet() {
  var K = App.kaigi, set = {};
  (K.links || []).forEach(function (l) { set[l.from] = true; set[l.to] = true; });
  return set;
}
/** まだ結びのない子(欠席は数えない=指名の候補ではない)。上の帯に出す。 */
function notLinkedCount() {
  var K = App.kaigi, set = linkedSet(), n = 0;
  (K.students || []).forEach(function (s) {
    var sid = s['児童ID'];
    if (!K.absent[sid] && !set[sid]) n++;
  });
  return n;
}
/** 児童カード。名前20px固定・0回はバッジを出さない・発言=●紫/よさ=★緑(色と形で区別・設計19 §6.3)。
   ★囲みは反転(20 §7.1): 結びのある子ではなく「まだ結びのない子」を点線にする。
   ★司会グループは 二重線の枠＋役割の名札 で分かるようにする(色だけに頼らない・docs/29 §3)。 */
function chairHtml(sid) {
  var K = App.kaigi, s = studentOf(sid); if (!s) return '';
  var absent = !!K.absent[sid], role = K.roles[sid];
  var c = K.count[sid] || 0, y = K.yosaCount[sid] || 0;
  var linked = K._linkedSet || (K._linkedSet = linkedSet());
  // 追加クラスだけを積む(基本の seat / absent / nolink は mtSeatCardHtml が付ける)
  var extra = [];
  if (role) extra.push('seat--sh');
  if (K.sel === sid) extra.push('sel');
  if (K.editSeats) extra.push('movable');
  var flagText = '';
  var L = K.linking, yo = (L && L.mode === 'yosa'), inLink = false;
  if (L && L.doerSid === sid) { inLink = true; extra.push('speaker'); if (yo) extra.push('speaker--yo'); flagText = (yo ? 'よさの子' : '話した子'); }
  else if (L && L.targets.indexOf(sid) >= 0) { inLink = true; extra.push('target'); if (yo) extra.push('target--yo'); flagText = '→ 相手' + (L.targets.indexOf(sid) + 1); }
  else if (K.editSeats && K.multi && K.multi[sid]) { flagText = '✓'; extra.push('seat--moving', 'seat--multi'); }
  else if (K.editSeats && K.sel === sid) { flagText = '動かす子'; extra.push('seat--moving'); }
  else if (absent) { flagText = '欠席'; }
  // まだ結びのない子だけ点線(20 §7.1 / 21 §1④)。いま選んでいる起点・相手の太枠は消さない。
  // 司会グループを選んでいるあいだ・席を直すあいだは点線にしない(二重線の枠を見せるため)
  var dashed = (!inLink && !linked[sid] && !K.pickShikai && !K.editSeats);
  var badges = [];
  if (!absent) { if (c) badges.push({ cls: 'b--sp', text: '●' + c }); if (y) badges.push({ cls: 'b--yo', text: '★' + y }); }
  var handlers = K.editSeats
    ? 'onpointerdown="seatDragStart(event,\'' + sid + '\')"'
    : 'onclick="tapChild(\'' + sid + '\')" onmousedown="chairPressStart(\'' + sid + '\')" onmouseup="chairPressEnd()" onmouseleave="chairPressEnd()" ontouchstart="chairPressStart(\'' + sid + '\')" ontouchend="chairPressEnd()"';
  // つなぎ中の起点・相手は、役割バッジの代わりに「話した子 / → 相手n」を出す(司会カードで重ならないように)
  return mtSeatCardHtml({ sid: sid, name: s['表示名'], role: (role && !inLink) ? role : '',
    badges: badges, flag: flagText, absent: absent, dashed: dashed,
    extraCls: extra.join(' '), handlers: handlers });
}

/** ホール自動採寸(docs/29 §2.1 / 設計19 §6.1 / 21 §2)。
   置いた席の外枠(kgView)を、盤の広さに合わせて拡大・縮小する。升の大きさは下限(押せる大きさ)より小さくしない。
   下限でも入らないときだけ盤をスクロールさせる(名前が読めない席を作らない)。
   ★冪等: 同じ盤の広さ・同じ並びなら何度呼んでも同じ位置になる(測るのは盤の広さだけ)。 */
var KG_CELL = { wMax: 120, hMax: 82, wMin: 54, hMin: 44, gap: 6,   // hMin 44 = 押せる大きさの下限(升。席はgapぶん小さい)
  editWMin: 44, editHMin: 38 };   // 席を直すあいだは、まわり2升ぶん広く見せるので少しだけ小さくてよい(押すのではなく動かすだけ)
function fitHall() {
  var K = App.kaigi, board = document.getElementById('kg-board'); if (!board || !K || !K.pos) return;
  var v = kgView(K.pos, K.editSeats), edit = !!K.editSeats;
  var slot = shikaiRowOf_(K);
  if (slot) v.r0 = Math.min(v.r0, slot);   // 「司会の席」の行(まだだれもいなくても)を画面に入れる
  // ★席を直すあいだは画面の範囲を「広がるだけ・縮まない」にする。1人動かすたびに盤が寄り直すと、
  //   次にタップしたい席が指の下から逃げる(タップ→タップで動かすとき特に)。
  if (edit) {
    var e0 = K._editView;
    if (e0) v = { r0: Math.min(e0.r0, v.r0), r1: Math.max(e0.r1, v.r1), c0: Math.min(e0.c0, v.c0), c1: Math.max(e0.c1, v.c1) };
    K._editView = v;
  } else K._editView = null;
  var PAD_TOP = 12;   // いちばん上の席の札(動かす子・話した子 など)が切れないように、上に少しあける
  var aw = board.clientWidth, ah = board.clientHeight - PAD_TOP;
  if (aw < 20 || ah < 20) return;
  // ★ふだんは、だれもいない行・列(通路・島のあいだ)を 0.4升に詰める。席の大きさを通路に取られないように。
  //   席を直すあいだは詰めない(どの升にも同じ大きさで落とせるように・kgCellAt は等間隔が前提)。
  var rowW = kgLaneWeights_(K.pos, v.r0, v.r1, 'r', edit, slot || 0), colW = kgLaneWeights_(K.pos, v.c0, v.c1, 'c', edit);
  var sumR = rowW.sum, sumC = colW.sum;
  var cw = kgClamp_(Math.floor(aw / sumC), edit ? KG_CELL.editWMin : KG_CELL.wMin, KG_CELL.wMax);
  var ch = kgClamp_(Math.floor(ah / sumR), edit ? KG_CELL.editHMin : KG_CELL.hMin, KG_CELL.hMax);
  var W = Math.round(cw * sumC), H = Math.round(ch * sumR), g = KG_CELL.gap;
  var left = Math.max(0, Math.floor((aw - W) / 2)), top = PAD_TOP + Math.max(0, Math.floor((ah - H) / 2));
  // 画面上の位置(向き=先生から見る は上下左右を入れ替えて描く)
  var rowOff = kgLaneOffsets_(rowW, v.r0, v.r1, ch, K.flip), colOff = kgLaneOffsets_(colW, v.c0, v.c1, cw, K.flip);
  board.querySelectorAll('.seat[data-sid]').forEach(function (e) {
    var p = K.pos[e.getAttribute('data-sid')]; if (!p) return;
    e.style.left = (left + colOff[p.c] + g / 2) + 'px'; e.style.top = (top + rowOff[p.r] + g / 2) + 'px';
    e.style.width = (cw - g) + 'px'; e.style.height = (ch - g) + 'px';
  });
  var shs = document.getElementById('kg-shslot');
  if (shs && slot) {   // 司会の席: 本体の外枠の幅で、司会の行に(席は上にのる)
    var bb = kgBounds(K.pos) || v;
    shs.style.left = (left + Math.min(colOff[bb.c0], colOff[bb.c1]) + g / 2) + 'px';
    shs.style.top = (top + rowOff[slot] + g / 2) + 'px';
    shs.style.width = (Math.abs(colOff[bb.c1] - colOff[bb.c0]) + cw - g) + 'px';
    shs.style.height = (ch - g) + 'px';
  }
  var pen = document.getElementById('kg-pen'), ps = K.sel && K.pos[K.sel];
  if (pen && ps) {   // ✎ は選んだ席の右上の角にのせる(名前を隠さない・となりの席もほとんど隠さない)
    var penS = 28;
    pen.style.width = pen.style.height = penS + 'px';
    pen.style.left = (left + colOff[ps.c] + cw - g / 2 - penS / 2 - 2) + 'px';
    pen.style.top = (top + rowOff[ps.r] + g / 2 - penS / 2 + 2) + 'px';
  }
  var lines = document.getElementById('kg-lines');
  if (lines) {
    lines.style.left = left + 'px'; lines.style.top = top + 'px';
    lines.style.width = W + 'px'; lines.style.height = H + 'px';
    lines.style.backgroundSize = cw + 'px ' + ch + 'px';
  }
  board.classList.toggle('kg-board--scroll', W > aw + 1 || H > ah + 1);
  // 席が小さいときは字を詰める(名前は残す。回数バッジ・名札を小さく)
  var hall = document.getElementById('hall');
  if (hall) { hall.classList.toggle('kg-s', cw - g < 92); hall.classList.toggle('kg-xs', cw - g < 70 || ch - g < 52); }
  K._geo = { left: left, top: top, cw: cw, ch: ch, r0: v.r0, r1: v.r1, c0: v.c0, c1: v.c1, flip: !!K.flip,
    rowOff: rowOff, colOff: colOff };
  board.dataset.fit = (cw - g) + 'x' + (ch - g) + ' / ' + (v.c1 - v.c0 + 1) + '×' + (v.r1 - v.r0 + 1) + '升' +
    (board.classList.contains('kg-board--scroll') ? ' ※収まりません' : '');
  drawLinkLines();                  // 座席の大きさが確定してから線を引き直す
}
/** 行(または列)ごとの重み。席のある行=1・だれもいない行=0.4(詰めないときは全部1)。 */
function kgLaneWeights_(pos, a, b, key, uniform, alsoUsed) {
  var used = {}, w = {}, sum = 0;
  for (var sid in pos) used[pos[sid][key]] = true;
  if (alsoUsed) used[alsoUsed] = true;
  for (var i = a; i <= b; i++) { w[i] = (uniform || used[i]) ? 1 : 0.4; sum += w[i]; }
  return { w: w, sum: sum };
}
/** 行(列)番号 → 画面上の始まりの位置(px)。flip なら逆から積む。 */
function kgLaneOffsets_(lw, a, b, size, flip) {
  var off = {}, acc = 0, i;
  if (!flip) for (i = a; i <= b; i++) { off[i] = Math.round(acc * size); acc += lw.w[i]; }
  else for (i = b; i >= a; i--) { off[i] = Math.round(acc * size); acc += lw.w[i]; }
  return off;
}
var _kaigiFitRt;
function scheduleFitHall() { clearTimeout(_kaigiFitRt); _kaigiFitRt = setTimeout(function () { if (App.screen === 'kaigi_live') fitHall(); }, 120); }
/**
 * ホールの箱が変わったら測り直す(リサイズ/右パネル・道具バーの高さ変化)。renderKaigiLive のたびに呼ぶ。
 * ★トップレベルで App を触らない: js_kaigi は js_core(App の定義元)より先に読み込まれるので、
 *   ここで App を参照すると読込時に落ち、以降の var(SHITSU_KEYS など)が未定義のままになる。
 */
function observeHall() {
  if (!App._kaigiResizeBound) {
    App._kaigiResizeBound = true;
    addEventListener('resize', scheduleFitHall);
    if (window.ResizeObserver) { App._kaigiRO = new ResizeObserver(scheduleFitHall); App._kaigiROTarget = null; }
  }
  if (!App._kaigiRO) return;
  var hall = document.getElementById('hall'); if (!hall || App._kaigiROTarget === hall) return;
  App._kaigiRO.disconnect(); App._kaigiRO.observe(hall); App._kaigiROTarget = hall;
}
/** 向き(先生から見る/子どもから見る)。座席全体を180°回し、カードの文字は起こしたまま。 */
function toggleFlip() {
  var K = App.kaigi;
  K.flip = !K.flip;
  callServer('saveSetting', '学級会の向き', K.flip ? '先生から' : '黒板が上').catch(function () {});
  renderHall();
}

/* 長押し(500ms)→「欠席にする／出席に戻す」の浮きパネル(12 §3.8 / 20 §7.3)。長押し後の click は記録しない。
   発言参加率・人間関係形成率の分母が出席児童数なので、会の初めに欠席を入れる導線を授業中の手元に置く。 */
function chairPressStart(sid) {
  if (App.kaigi.editSeats) return;
  App._longFired = false;
  clearTimeout(App._chairPress);
  App._chairPress = setTimeout(function () { App._longFired = true; openSeatMenu(sid); }, 500);
}
function chairPressEnd() { clearTimeout(App._chairPress); }
/** 席の浮きパネル。座席のすぐ上に出す(指の位置から動かさない)。 */
function openSeatMenu(sid) {
  closeSeatMenu();
  var K = App.kaigi, seat = document.querySelector('.seat[data-sid="' + sid + '"]'); if (!seat) return;
  var absent = !!K.absent[sid];
  var pop = el('<div class="seatpop" id="seatpop">' +
    '<div class="seatpop__nm">' + escapeHtml(nameOf(sid)) + '</div>' +
    '<button type="button" class="seatpop__btn" onclick="closeSeatMenu();toggleAbsent(\'' + sid + '\')">' +
      (absent ? '出席に戻す' : '欠席にする') + '</button>' +
    '<button type="button" class="seatpop__btn seatpop__btn--quiet" onclick="closeSeatMenu()">とじる</button></div>');
  document.body.appendChild(pop);
  var r = seat.getBoundingClientRect(), pr = pop.getBoundingClientRect();
  pop.style.left = Math.max(6, Math.min(window.innerWidth - pr.width - 6, r.left + r.width / 2 - pr.width / 2)) + 'px';
  pop.style.top = Math.max(6, r.top - pr.height - 6) + 'px';
  App._seatPopAway = function (ev) { if (!pop.contains(ev.target)) closeSeatMenu(); };
  setTimeout(function () { document.addEventListener('pointerdown', App._seatPopAway); }, 0);
}
function closeSeatMenu() {
  var p = document.getElementById('seatpop'); if (p) p.remove();
  if (App._seatPopAway) { document.removeEventListener('pointerdown', App._seatPopAway); App._seatPopAway = null; }
}
function toggleAbsent(sid) {
  var K = App.kaigi;
  K.absent[sid] = !K.absent[sid];
  var ids = Object.keys(K.absent).filter(function (id) { return K.absent[id]; });
  callServer('saveKesseki', K.議題ID, ids).catch(function () {});
  renderHall(); renderKPanel();
}

/* 席タップ = その子を右パネルで選ぶ + (道具が発言/よさなら)その場で1件記録。
   つなぐ道具は つなぎモード: ①その子をタップ → ②相手をタップ → 確定帯で記録(設計19 §4 / 20 §5)。
   ★同じ子をもう一度タップ＝相手なしで確定。発言でも よさ でも同じ(画面全体の共通ルール)。 */
function tapChild(sid) {
  var K = App.kaigi;
  if (App._longFired) { App._longFired = false; return; }
  if (K.pickShikai) { togglePickShikai(sid); return; }   // 司会グループを選んでいるあいだは記録しない
  var L = K.linking;
  if (L) {
    if (!L.doerSid) {                        // ① 起点(話した子 / よさの子)を決める
      if (K.absent[sid]) { K.tab = 'rec'; selectChild(sid); return; }
      L.doerSid = sid; L.logId = uuid(); L.when = nowLocal();
      K.sel = sid;                            // 右パネルの文脈用(タブは変えない)
      flashChair(sid); renderHall(); renderToolRows(); renderNowBar();
      return;
    }
    if (sid === L.doerSid) { commitLinking(); return; }  // ② 起点を再タップ=相手なしで確定
    if (K.absent[sid]) return;                            // 欠席は相手にしない
    var pos = L.targets.indexOf(sid);
    if (pos >= 0) L.targets.splice(pos, 1); else L.targets.push(sid);
    flashChair(sid); renderHall(); renderToolRows(); renderNowBar();
    return;
  }
  if (K.absent[sid]) { K.tab = 'rec'; selectChild(sid); return; }
  if (K.tool.kind === 'speech') {
    recordSpeech(sid, K.tool.value, [], uuid(), nowLocal());
    flashChair(sid);
  } else if (K.tool.kind === 'yosa') {
    recordYosa(sid, K.tool.value, [], uuid(), nowLocal());
    flashChair(sid);
  } else {
    K.tab = 'rec'; selectChild(sid);
  }
}

/* ===== 記録の追記(発言 / よさ)。つなぎ先の有無にかかわらずここを通す ===== */
/** 発言1件。流れ・回数・つながりの本数・直前の記録をまとめて更新する。 */
function recordSpeech(sid, kind, targets, logId, when) {
  var K = App.kaigi, joined = targets.join(',');
  var memo0 = K.kaigiMemoOnCreate || '';   // 右パネルで先に書いた「言ったこと」(発言の記録が無い子)
  enqueue('speech', { 'ログID': logId, '日時': when, '議題ID': K.議題ID, '段階': K.stage, '児童ID': sid,
    '発言種類': kind, 'メモ': memo0, 'つながり先児童ID': joined });
  K.count[sid] = (K.count[sid] || 0) + 1;
  targets.forEach(function (t) { K.links.push({ from: sid, to: t, mode: 'speech' }); });
  var item = { '種別': '発言', 児童ID: sid, 発言種類: kind, 表示名: nameOf(sid), 段階: K.stage,
    時刻: when.slice(11, 16), 'ログID': logId, '日時': when, 'メモ': memo0, 'つながり先児童ID': joined };
  K.flow.unshift(item);
  K.lastRec = { type: 'speech', who: sid, kind: kind, targets: targets.slice(), item: item };
  K.tab = 'rec';
  selectChild(sid, item);
  renderHall(); renderNowBar(); renderLastRec(); renderSide();
  return item;
}
/** よさ1件(つなぎ先つき)。よさ記録も流れに出す(どちらも同じ行から書き足し・取り消しできる・20 §8.2)。 */
function recordYosa(sid, stamp, targets, recId, when) {
  var K = App.kaigi, joined = targets.join(',');
  enqueue('yosa', { '記録ID': recId, '日時': when, 'モード': '学級会', '文脈ID': K.議題ID, '児童ID': sid,
    'スタンプ': stamp, 'メモ': '', 'つながり先児童ID': joined });
  K.yosaCount[sid] = (K.yosaCount[sid] || 0) + 1;
  targets.forEach(function (t) { K.links.push({ from: sid, to: t, mode: 'yosa' }); });
  var item = { '種別': 'よさ', 児童ID: sid, 発言種類: stamp, 表示名: nameOf(sid), 段階: '',
    時刻: when.slice(11, 16), '記録ID': recId, '日時': when, 'メモ': '', 'つながり先児童ID': joined };
  K.flow.unshift(item);
  K.lastRec = { type: 'yosa', who: sid, kind: stamp, targets: targets.slice(), recId: recId, item: item };
  K.tab = 'rec';
  selectChild(sid, item);
  renderHall(); renderNowBar(); renderLastRec(); renderSide();
  return item;
}
function nameOf(sid) { var s = studentOf(sid); return s ? s['表示名'] : sid; }
function roleOf(sid) { return App.kaigi.roles[sid]; }
function flashChair(sid) { var c = document.querySelector('.seat[data-sid="' + sid + '"]'); if (c) { c.classList.add('hit'); setTimeout(function () { c.classList.remove('hit'); }, 220); } }

/* ===== つながり(🔗の道具=「だれに向けて」も残せる道具) =====
   発言側は 発言種類マスタ.質の視点、よさ側は よさスタンプマスタ.相手を選ぶ で決まる。ハードコードしない。 */
// 発言種類の「質の視点」。つながり(賛成・反対・質問・心配)/質的改善(まとめ・付け足し)= 相手に向く発言。
function kindViewpoint(kind) {
  var t = (App.kaigiBoot['発言種類'] || []).filter(function (x) { return x['種類'] === kind; })[0];
  return t ? t['質の視点'] : '';
}
function speechTypeOf(kind) {
  return (App.kaigiBoot['発言種類'] || []).filter(function (x) { return x['種類'] === kind; })[0] || null;
}
function isRelationalKind(kind) { return mtIsLinkTool(speechTypeOf(kind)); }
/** よさスタンプ1件のマスタ行。 */
function yosaStampOf(stamp) {
  return (App.kaigiBoot['よさスタンプ'] || []).filter(function (x) { return x['スタンプ'] === stamp; })[0] || null;
}
/** よさスタンプが相手を選べるか(よさスタンプマスタ.相手を選ぶ=○)。👂聴くは×=1タップで即記録。 */
function isRelationalStamp(stamp) {
  var s = yosaStampOf(stamp);
  // よさは『相手を選ぶ』だけで決める(質の視点を持たないので、空欄は×=1タップ)
  return !!s && String(s['相手を選ぶ'] == null ? '' : s['相手を選ぶ']).trim() === '○';
}
/** いま選んだ道具が🔗か(発言/よさ共通の入口)。 */
function isRelationalTool(kind, value) {
  if (kind === 'speech') return isRelationalKind(value);
  if (kind === 'yosa') return isRelationalStamp(value);
  return false;
}
// つなぎ文(マスタの つなぎ文 の {相手} を置換・設計19 §4.2 / 20 §5)。相手0なら空(下書きしない)。
function tsunagariMemo(mode, kind, targetIds) {
  var names = (targetIds || []).map(nameOf);
  if (mode === 'yosa') {
    var st = yosaStampOf(kind);
    return mtTsunagiText(st && st['つなぎ文'], names, '{相手}に向けて、');
  }
  var t = (App.kaigiBoot['発言種類'] || []).filter(function (x) { return x['種類'] === kind; })[0];
  return mtTsunagiText(t && t['つなぎ文'], names, '{相手}の意見を受けて、');
}
/** 流れの1件 → 自動下書き(その記録のつながり先からつなぎ文を作る)。 */
function tsunagariMemoPrefix(item) {
  if (!item) return '';
  var ids = String(item['つながり先児童ID'] || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  return tsunagariMemo(flowMode(item), item['発言種類'], ids);
}
/** 流れの1件が 発言 か よさ か。 */
function flowMode(item) { return (item && item['種別'] === 'よさ') ? 'yosa' : 'speech'; }
// [記録する] or 起点の再タップ: つなぎ先込みで1件記録(相手0でも記録=単なる相手向きの発言/よさ)。
function commitLinking() {
  var K = App.kaigi, L = K.linking; if (!L || !L.doerSid) return;
  var targets = L.targets.slice();
  var id = L.logId || uuid(), when = L.when || nowLocal();
  var item = (L.mode === 'yosa') ? recordYosa(L.doerSid, L.kind, targets, id, when)
                                 : recordSpeech(L.doerSid, L.kind, targets, id, when);
  // つないだ相手から「○○さんの意見に付け足して、」を右パネルに自動下書き(相手0なら下書きしない・§4.2)
  var draft = tsunagariMemo(L.mode, L.kind, targets);
  K.draft = { speech: '', yosa: '', stamp: '' };
  if (L.mode === 'yosa') { K.draft.yosa = draft; K.draft.stamp = L.kind; } else { K.draft.speech = draft; }
  if (draft) K.tab = 'rec';
  // 同じ種類のまま ① に戻る(同じ討論が続く前提・§4)
  K.linking = { mode: L.mode, kind: L.kind, doerSid: null, targets: [], logId: null, when: null };
  renderHall(); renderToolRows(); renderNowBar(); renderLastRec(); renderSide();
  if (draft) focusPanelInput(L.mode === 'yosa' ? 'kp-yosa' : 'kp-speech');   // 枠を光らせ、その欄まで送るだけ
}
// つなぎ中止。quiet=道具の切替に伴う破棄(道具は保つ) / 通常=道具も解除。
function cancelLinking(quiet) {
  var K = App.kaigi; K.linking = null;
  if (!quiet) K.tool = { kind: null, value: '' };
  renderHall(); renderToolRows(); renderNowBar();
}
// 直前の記録を取り消す(発言/よさ)。追記ログの取消行を送り、数・つながりも戻す(設計19 §3.2)。
function undoLastRec() {
  var K = App.kaigi, r = K.lastRec; if (!r) return;
  cancelRecord(r.item || null);
}
/**
 * 記録1件を取り消す(流れのどの行からでも・20 §8.2)。追記ログの作法どおり取消行を追記し、
 * 発言数・よさ数・つながりの本数・流れの行を同時に戻す。
 */
function cancelRecord(item) {
  var K = App.kaigi; if (!item) return;
  var yosa = (flowMode(item) === 'yosa');
  var who = item['児童ID'];
  var targets = String(item['つながり先児童ID'] || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  if (yosa) {
    if (!item['記録ID']) return;
    enqueue('yosaCancel', { '文脈ID': K.議題ID, '児童ID': who, '取消対象ID': item['記録ID'], 'モード': '学級会' });
    K.yosaCount[who] = Math.max(0, (K.yosaCount[who] || 0) - 1);
  } else {
    if (!item['ログID']) return;
    enqueue('speechCancel', { 'ログID': uuid(), '日時': nowLocal(), '議題ID': K.議題ID, '児童ID': who, '取消対象ID': item['ログID'] });
    K.count[who] = Math.max(0, (K.count[who] || 0) - 1);
  }
  var mode = yosa ? 'yosa' : 'speech';
  targets.forEach(function (t) {
    for (var i = 0; i < K.links.length; i++) {
      if (K.links[i].from === who && K.links[i].to === t && (K.links[i].mode || 'speech') === mode) { K.links.splice(i, 1); break; }
    }
  });
  var idx = K.flow.indexOf(item); if (idx >= 0) K.flow.splice(idx, 1);
  if (K.selItem === item) { K.selItem = null; K.draft = { speech: '', yosa: '', stamp: '' }; }
  if (K.lastRec && K.lastRec.item === item) K.lastRec = null;
  renderHall(); renderNowBar(); renderLastRec(); renderSide();
}

/**
 * 座席の下につながり線を引く(20 §7.2 / 21 §2)。描画そのものは共通部品 mtDrawLinks。
 * ここで決めるのは「学級会の色」だけ: 発言=紫(実線) / よさ=深緑(破線)。
 * ①いま結ぼうとしている線は【記録する前から】出す(ON/OFFに関係なく)。押す前に目で確かめられる。
 * ②記録済みの線は【選んだ子のぶんだけ】。全体を出すと会の後半に座席が読めない(学級全体は振り返り画面)。
 * ※SVGはCSS変数を参照できないので色は直値。08 §2 を変えたらここも直す。
 */
var KAIGI_LINK_COLOR = { speech: '#6D4FC4', yosa: '#0E9488' };
function drawLinkLines() {
  var host = document.getElementById('hall'); if (!host) return;
  var K = App.kaigi; if (!K) { mtDrawLinks(host, {}); return; }
  var L = K.linking;
  var live = (L && L.doerSid && L.targets.length)
    ? { from: L.doerSid, to: L.targets.slice(), color: KAIGI_LINK_COLOR[L.mode] || KAIGI_LINK_COLOR.speech,
        dash: L.mode === 'yosa' ? '7 5' : '' }
    : null;
  // 記録済み(選んだ子のぶんだけ・同じ向きは太さに畳む)
  var mine = (K.showLinks && K.sel)
    ? (K.links || []).filter(function (l) { return l.from === K.sel || l.to === K.sel; })
    : [];
  var agg = {};
  mine.forEach(function (l) { var k = l.from + '|' + l.to + '|' + (l.mode || 'speech'); agg[k] = (agg[k] || 0) + 1; });
  var saved = Object.keys(agg).map(function (k) {
    var p = k.split('|'), mode = p[2];
    return { from: p[0], to: p[1], color: KAIGI_LINK_COLOR[mode] || KAIGI_LINK_COLOR.speech,
      weight: Math.min(7, 2 + agg[k]), dash: mode === 'yosa' ? '7 5' : '' };
  });
  mtDrawLinks(host, { live: live, saved: saved });
}

function memoSpeechKind(K) {
  if (K.tool && K.tool.kind === 'speech' && K.tool.value) return K.tool.value;

function savePanelSpeechMemo() {
  var K = App.kaigi, it = speechTargetOf(K);
  var memo = String(K.draft.speech || '').trim();
  if (!it) {
    // 発言の記録がまだ無い: 書いた中身つきで発言を1件記録する(席タップでの記録と同じ道を通る)
    var kind = memoSpeechKind(K);
    if (!memo || !kind || !K.sel) return null;
    var logId = uuid(), when = nowLocal();
    K.kaigiMemoOnCreate = memo;
    it = recordSpeech(K.sel, kind, [], logId, when);
    K.kaigiMemoOnCreate = null;
    return it;
  }
  if (memo === String(it['メモ'] || '')) return it;
  var next = { '取消ログID': it['ログID'], 'ログID': uuid(), '日時': it['日時'], '議題ID': K.議題ID,
    '段階': it['段階'] || '', '児童ID': it['児童ID'], '発言種類': it['発言種類'], 'メモ': memo,
    'つながり先児童ID': it['つながり先児童ID'] || '' };   // メモを直してもつなぎ先を消さない
  enqueue('speechMemo', next);
  it['ログID'] = next['ログID']; it['メモ'] = memo;
  K.draft.speech = memo;

      ? '<div class="kp-note"><b>' + mN + '人</b>を選んでいます。どれか1人をドラッグすると全員がいっしょに動きます。空いた升をタップしても動きます(左上の子がその升へ)。置き場をタップ＝全員を外す。</div>' +
        '<div class="kp-row"><button type="button" class="btn kp-btn" onclick="clearMulti()">まとめて選ぶのをやめる</button></div>'
      : '<div class="kp-note">盤の<b>空いたところから指でなぞって囲む</b>と、その中の席をまとめて選べます(班ごと・列ごとに動かすとき)。</div>' +
        '<div class="kp-row"><button type="button" class="btn kp-btn" onclick="startMultiAll()">全員をまとめて選ぶ</button></div>') +
    '</div>';
  var body;

    body = '';
  } else if (!s) {
    body = '<div class="kp-empty">直したい席をタップしてください(名前・役割・出欠)。名前は、選んだ席の右上の「✎」からも、その席の上で直せます。</div>';
  } else {
    var role = K.roles[sid] || '', p = K.pos[sid];
    body = '<div class="kp-box"><label class="kp-label">出欠</label>' +
        '<div class="kp-note">欠席の子は 発言参加率・人間関係形成率 の分母から外れます(会の初めに入れてください)。</div>' +

          (K.absent[sid] ? '出席に戻す' : '欠席にする') + '</button>' +
          '<b>' + (K.absent[sid] ? 'いま: 欠席' : 'いま: 出席') + '</b></div>' +
      '</div>' +
      '<div class="kp-box"><label class="kp-label">' + (isKenkyuNow() ? '呼び名(この会の中だけ)' : '名前(表示名)') + '</label>' +
        '<div class="kp-note">' + (isKenkyuNow() ? '名簿には書きません。' : '名簿の表示名を直します。番号・IDは変わりません。') + '</div>' +
        '<input id="kp-name" class="kp-input" value="' + escapeAttr(s['表示名']) + '" onkeydown="if(event.key===\'Enter\')savePanelName()">' +
        '<div class="kp-row"><button type="button" class="btn btn--primary kp-btn" onclick="savePanelName()">名前を直す</button></div>' +
      '</div>' +
      '<div class="kp-box"><label class="kp-label">司会グループの役割</label>' +
        '<select id="kp-role" class="kp-input" onchange="savePanelRole()">' + roleOptionsHtml(role, true) + '</select>' +
        '<div class="kp-note" style="margin:6px 0 0">いまの席: ' + (p ? p.r + '行 ' + p.c + '列' : '置き場(まだ席がありません)') + '</div>' +
        (p ? '<div class="kp-row"><button type="button" class="btn kp-btn" onclick="unplaceSel()">置き場へ外す</button></div>' : '') +
      '</div>';
  }
  // 保存の状態は3つとも見せる(未保存 / 保存中 / 保存できた)。押したあと何も変わらないのが一番こわい。
  var where = isKenkyuNow() ? 'この研究用の会の中だけに残ります(名簿・座席表には書きません)' : 'この並びは次の会でも使われます';
  var state = K.seatsSaving ? '保存中…'
    : K.seatsDirty ? mtIco('alert') + ' 未保存の並びがあります。押すと保存して記録の画面にもどります'
    : '押すと保存して記録の画面にもどります(' + where + ')';
  var foot = '<div class="kp-box"><div class="kp-row">' +
    '<button type="button" class="btn btn--primary kp-btn"' + (K.seatsSaving ? ' disabled' : '') + ' onclick="saveSeats(true)">この配置を保存</button></div>' +
    '<div class="kp-note" style="margin:8px 0 0">' + state + '</div></div>';
  return head + typeBox + multiBox + body + foot;
}
/** 役割の選択肢。候補は 設定 の 司会役割(★コードに役割名を書かない・docs/29 §3)。 */
function roleOptionsHtml(role, withNone) {
  var cands = roleCands(), list = cands.slice();
  if (role && role !== KAIGI_SHIKAI_NONAME && list.indexOf(role) < 0) list.push(role);   // 候補から消えた役割も、付いていれば出す

    '<option value="' + KAIGI_SHIKAI_NONAME + '"' + (role === KAIGI_SHIKAI_NONAME ? ' selected' : '') + '>' + KAIGI_SHIKAI_NONAME + '(役割なし)</option>' +

// 役割を付けない司会グループの子の呼び方(docs/29 §3)。役割の候補ではなく「グループにいる」ことの名前。
var KAIGI_SHIKAI_NONAME = '司会グループ';
function roleCands() { return ((App.kaigiBoot || {})['役割候補'] || []).filter(function (r) { return r && r !== KAIGI_SHIKAI_NONAME; }); }

/** 型を選ぶ = 番号順に配り直す。手で直した並びが消えるので、そのときだけ聞く。 */
function applySeatType(t) {

  K.pos = kgTemplate(t, kaigiIds(K), shikaiIdsOf(K));

/** 正面の段数などの旧い操作は無くなった(型＋ドラッグに置きかえ・docs/29 §2)。 */
function savePanelName() {

}
/** 名前を直す(右パネル・升の上の両方から)。研究用の会は空にすると「◯番」に戻る。 */
function saveNameFor(sid, v) {
  var K = App.kaigi, s = studentOf(sid); if (!s) return;
  if (!v && !isKenkyuNow()) return;
  v = v || (s['番号'] + '番');

  renderHall(); renderKFlow(); renderKPanel();
  // ★研究用の会は名簿に書かない。その会の中だけ(議題マスタの 研究_呼び名)に残す。

function savePanelRole() {

function markSeatsDirty() { App.kaigi.seatsDirty = true; renderKPanel(); }
/**
 * いまの並びを保存する。自分の学級=座席表(学級会_自由)・研究用の会=議題マスタ.研究_座席(docs/29 §2.2)。
 * ★保存できたかを必ず目に見える形にする(2026-08-27)。
 *   サーバは 保存席数 と 読み戻し席数 を返す。数が合わなければ、その場で知らせる。
 * @param {boolean} [backToRecord] true なら保存できた時点で記録の画面にもどる([この配置を保存]から)。
 *   失敗したときは席を直すモードのまま残す(直して押し直せるように)。
 */
function saveSeats(backToRecord) {
  var K = App.kaigi, b = App.kaigiBoot, pl = kgPlacements(K.pos, kaigiIds(K));
  var placedN = pl.filter(function (p) { return p['行'] > 0; }).length;
  var kenkyu = isKenkyuNow();
  K.seatsSaving = true; renderKPanel();
  var call = kenkyu ? callServer('saveKenkyuSeats', K.議題ID, pl) : callServer('saveKaigiSeating', b['クラス'], pl);
  call.then(function (r) {
    r = r || {};
    K.seatsSaving = false;
    var back = r['読み戻し席数'];
    if (back != null && back < placedN) {
      K.seatsDirty = true; renderKPanel();
      alert('席を ' + placedN + '人ぶん送りましたが、読み戻せたのは ' + back + '人ぶんでした。\n' +
            (kenkyu ? 'スプレッドシートの『議題マスタ』シートに「研究_座席」の列があるか確かめてください。'
                    : 'スプレッドシートの『座席表』シートを開いて、1行目に「レイアウト」「ゾーン」の列があるか確かめてください。'));
      return;
    }
    K.seatsDirty = false;
    // 次に開いたとき同じ並びが出るよう、手元の控えも更新
    b['座席'] = { '形': '自由', '席': pl.filter(function (p) { return p['行'] > 0; }) };
    K.seatsSavedAt = Date.now();
    if (backToRecord && K.editSeats) {
      K.editSeats = false;                       // 保存できたら、そのまま記録の画面にもどす
      renderHall(); renderKPanel(); renderToolRows(); renderNowBar();
      setTimeout(function () { if (App.screen === 'kaigi_live') renderKPanel(); }, 6200);   // 「保存しました」を消す
    } else {
      renderKPanel();
    }
    // 会のはじめ(席を作る → 司会グループを選ぶ・docs/29 §1)
    if (K.setup === 'seats' && !K.editSeats) { K.setup = null; startPickShikai(); }
  }).catch(function (e) {
    K.seatsSaving = false; K.seatsDirty = true; renderKPanel();
    alertErr(e);
  });
}

/* ===== ドラッグ(マウス・タッチ共通) =====
   1人: 升に落とす=そこへ置く(席があれば入れ替え)、置き場に落とす=席から外す。
   まとめて(K.multi に入っている子をつかんだとき): 全員を同じだけ動かす。行き先の子は空いた側へ入れ替わる。 */
function multiIds_() { var K = App.kaigi; return kaigiIds(K).filter(function (id) { return K.multi && K.multi[id]; }); }
function seatDragStart(ev, sid) {
  var K = App.kaigi; if (!K.editSeats) return;
  ev.preventDefault();
  ev.stopPropagation();   // 盤の「なぞって選ぶ」を始めない
  var card = document.querySelector('.seat[data-sid="' + sid + '"]'); if (!card) return;
  var group = (K.multi && K.multi[sid] && K.pos[sid]) ? multiIds_().filter(function (id) { return K.pos[id]; }) : null;
  if (group && group.length < 2) group = null;
  var trayN = (K.multi && K.multi[sid] && !K.pos[sid]) ? multiIds_().filter(function (id) { return !K.pos[id]; }).length : 0;
  var r = card.getBoundingClientRect();
  var ghost = card.cloneNode(true);
  ghost.className = 'seat seat--ghost';
  ghost.style.left = ''; ghost.style.top = '';
  ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
  if (group || trayN > 1) ghost.insertAdjacentHTML('beforeend', '<span class="ghost-n">' + (group ? group.length : trayN) + '人</span>');
  document.body.appendChild(ghost);
  App._drag = { sid: sid, group: group, ghost: ghost, dx: r.width / 2, dy: r.height / 2, moved: false, x0: ev.clientX, y0: ev.clientY };
  (group || [sid]).forEach(function (id) { var c = document.querySelector('.seat[data-sid="' + id + '"]'); if (c) c.classList.add('seat--dragging'); });
  moveGhost(ev);
  document.addEventListener('pointermove', onSeatDragMove);
  document.addEventListener('pointerup', onSeatDragEnd);
  document.addEventListener('pointercancel', onSeatDragEnd);
}
function moveGhost(ev) {
  var D = App._drag; if (!D) return;
  D.ghost.style.left = (ev.clientX - D.dx) + 'px';
  D.ghost.style.top = (ev.clientY - D.dy) + 'px';
}
function clearHi_() {
  document.querySelectorAll('.drop-hi').forEach(function (e) { e.classList.remove('drop-hi'); });
  document.querySelectorAll('.kg-hi--more').forEach(function (e) { e.remove(); });
  var hi = document.getElementById('kg-hi'); if (hi) hi.hidden = true;
}
function onSeatDragMove(ev) {
  var D = App._drag; if (!D) return;
  if (Math.abs(ev.clientX - D.x0) + Math.abs(ev.clientY - D.y0) > 4) D.moved = true;   // 指のぶれはタップ扱い
  ev.preventDefault();
  moveGhost(ev);
  clearHi_();
  if (!D.moved) return;
  var t = seatDropTarget(ev.clientX, ev.clientY, D.group ? null : D.sid);
  if (!t) t = seatDropTarget.apply(null, clampToBoard_(ev.clientX, ev.clientY).concat([D.group ? null : D.sid]));   // 盤の外でも、置かれる はし の升を見せる
  if (!t) return;
  if (t.kind === 'tray') { if (t.el) t.el.classList.add('drop-hi'); return; }
  if (!D.group) { showCellHi(t.r, t.c); return; }
  // まとめて: 行き先の升を全部うすく示す。はみ出すなら出さない(=落としても動かない)
  var K = App.kaigi, p = K.pos[D.sid]; if (!p) return;
  var fd = kgFitDelta(K.pos, D.group, t.r - p.r, t.c - p.c);
  var moved = kgMoveGroup(K.pos, D.group, fd.dr, fd.dc);
  if (!moved) return;
  D.group.forEach(function (id, i) { showCellHi(moved[id].r, moved[id].c, i > 0); });
}
/** いま落とす升を薄く示す(席が無い升にも出す。どこに置かれるかを指を離す前に見せる)。more=まとめての2つめ以降 */
function showCellHi(r, c, more) {
  var K = App.kaigi, G = K._geo, hi = document.getElementById('kg-hi'); if (!G || !hi) return;
  if (more) { hi = hi.cloneNode(false); hi.removeAttribute('id'); hi.className = 'kg-hi kg-hi--more'; hi.hidden = false; document.getElementById('kg-board').appendChild(hi); }
  var rr = G.rowOff ? G.rowOff[r] : (G.flip ? G.r1 - r : r - G.r0) * G.ch;
  var cc = G.colOff ? G.colOff[c] : (G.flip ? G.c1 - c : c - G.c0) * G.cw;
  hi.style.left = (G.left + cc) + 'px'; hi.style.top = (G.top + rr) + 'px';
  hi.style.width = G.cw + 'px'; hi.style.height = G.ch + 'px';
  hi.hidden = false;
}
function onSeatDragEnd(ev) {
  var D = App._drag; if (!D) return;
  document.removeEventListener('pointermove', onSeatDragMove);
  document.removeEventListener('pointerup', onSeatDragEnd);
  document.removeEventListener('pointercancel', onSeatDragEnd);
  if (D.ghost && D.ghost.parentNode) D.ghost.parentNode.removeChild(D.ghost);
  clearHi_();
  document.querySelectorAll('.seat--dragging').forEach(function (c) { c.classList.remove('seat--dragging'); });
  App._drag = null;
  App._seatUp = { t: Date.now(), x: ev.clientX, y: ev.clientY };   // この指離しのあとに来る click を盤・置き場で二重に受けない
  if (!D.moved) { seatTapInEdit(D.sid); return; }   // 動かさずに離した＝タップ
  if (ev.type === 'pointercancel') return;
  var t = seatDropTarget(ev.clientX, ev.clientY, D.group ? null : D.sid);
  // ★盤の外(右のパネル・道具バーの上など)で離したら、盤のいちばん近い はし の升に置く。
  //   「置けずに何も起きない」「タップとして選択が外れる」を作らない(一括で置くとき特に)。
  if (!t) t = seatDropTarget.apply(null, clampToBoard_(ev.clientX, ev.clientY).concat([D.group ? null : D.sid]));
  if (!t) return;
  var K = App.kaigi;
  if (D.group) {
    if (t.kind === 'tray') { K.pos = D.group.reduce(function (pos, id) { return kgUnplace(pos, id); }, K.pos); placedMulti_(D.group.length, '置き場へ外しました'); return; }
    var p = K.pos[D.sid];
    if (!p) return;
    placeGroupAt_(t.r - p.r, t.c - p.c, t.r, t.c);
    return;
  }
  if (!K.pos[D.sid] && K.multi && K.multi[D.sid] && t.kind === 'cell') {   // 置き場の子をまとめてつかんだ
    placeGroupAt_(0, 0, t.r, t.c);
    return;
  }
  var row0 = shikaiRowOf_(K), before = Object.assign({}, K.pos);
  K.pos = (t.kind === 'tray') ? kgUnplace(K.pos, D.sid) : kgPlace(K.pos, D.sid, t.r, t.c);
  syncShikaiByRow_(movedIds_(before, K.pos), row0);   // 司会の席の行に入れた=司会グループ／出した=外す
  markHandMoved_();
  selectChild(D.sid);   // 盤と右パネルを描き直す(動かした子を選んだままにする)
}
/** pos が変わった子(入れ替えで押し出された子も含む)。 */
function movedIds_(a, b) {
  var out = [];
  kaigiIds(App.kaigi).forEach(function (id) {
    var p = a[id], q = b[id];
    if (!p !== !q || (p && (p.r !== q.r || p.c !== q.c))) out.push(id);
  });
  return out;
}
function markHandMoved_() { var K = App.kaigi; K.seatsDirty = true; K.handMoved = true; K.layoutAuto = false; }
function flashMsg_(t) { var n = document.getElementById('sb-now'); if (n) { var d = n.querySelector('.main, b') || n; d.textContent = t; } }

/* ===== タップで動かす(ドラッグが苦手な指・タッチパネルでも動かせるように) =====
   ① 席をタップ = その子を「動かす子」にする(右に名前・役割も出る)
   ② 空いた升をタップ = そこへ / 別の席をタップ = 入れ替え / 置き場をタップ = 席から外す
   ★動かしたあとも「動かす子」はそのまま(続けて少しずつ直せる)。同じ子をもう一度タップでやめる。
   まとめて選んでいるとき(K.multi): 席のタップ=選ぶ/外す、空いた升のタップ=まとめてそこへ(左上の子がその升に来る)。 */
function seatTapInEdit(sid) {
  var K = App.kaigi, cur = K.sel;
  if (multiIds_().length) {
    if (K.multi[sid]) delete K.multi[sid]; else K.multi[sid] = true;
    renderHall(); renderKPanel(); renderNowBar();
    return;
  }
  if (cur === sid) { K.sel = null; renderHall(); renderKPanel(); renderNowBar(); return; }
  if (cur && studentOf(cur)) {
    var p = K.pos[sid];
    var row0 = shikaiRowOf_(K), before = Object.assign({}, K.pos);
    if (p) K.pos = kgPlace(K.pos, cur, p.r, p.c);          // 盤の席と入れ替え(cur が置き場なら相手が置き場へ)
    else if (K.pos[cur]) { var q = K.pos[cur]; K.pos = kgPlace(K.pos, sid, q.r, q.c); }   // 置き場の子と入れ替え
    else { selectChild(sid); renderNowBar(); return; }        // 置き場どうしは入れ替えない=えらび直し
    syncShikaiByRow_(movedIds_(before, K.pos), row0);
    markHandMoved_();
    renderHall(); renderKPanel(); renderNowBar();
    return;
  }
  selectChild(sid); renderNowBar();
}
/** 盤の空いた升をタップ。動かす子(またはまとめて選んだ子)がいればそこへ。 */
function boardTap(ev) {
  var K = App.kaigi; if (!K.editSeats || !K._geo) return;
  if (isGhostClick_(ev)) return;            // 席を離した直後・なぞり終わりの同じ場所の click
  if (ev.target.closest && ev.target.closest('.seat, .kg-pen, .kg-namein')) return;
  var board = document.getElementById('kg-board'), br = board.getBoundingClientRect();
  var cell = kgCellAt(ev.clientX - br.left + board.scrollLeft, ev.clientY - br.top + board.scrollTop, K._geo);
  if (!cell) return;
  var grp = multiIds_().filter(function (id) { return K.pos[id]; });
  if (multiIds_().length) {
    var b = grp.length ? kgBounds(grp.reduce(function (o, id) { o[id] = K.pos[id]; return o; }, {})) : null;
    placeGroupAt_(b ? cell.r - b.r0 : 0, b ? cell.c - b.c0 : 0, cell.r, cell.c);
    return;
  } else if (K.sel) {
    var row0 = shikaiRowOf_(K), before = Object.assign({}, K.pos);
    K.pos = kgPlace(K.pos, K.sel, cell.r, cell.c);
    syncShikaiByRow_(movedIds_(before, K.pos), row0);
  } else return;
  markHandMoved_();
  renderHall(); renderKPanel(); renderNowBar();
}
/**
 * まとめて置く(docs/29 §2.1 の拡張)。盤の上の子は (dr,dc) だけ動かし(はみ出す分ははしに寄せる)、
 * 選んだ置き場の子は (r,c) から右へ順に並べる。★置いたら選択を外す=「置き終わり」。
 */
function placeGroupAt_(dr, dc, r, c) {
  var K = App.kaigi, ids = multiIds_(), row0 = shikaiRowOf_(K), before = Object.assign({}, K.pos);
  var onBoard = ids.filter(function (id) { return K.pos[id]; }), inTray = ids.filter(function (id) { return !K.pos[id]; });
  if (onBoard.length) {
    var fd = kgFitDelta(K.pos, onBoard, dr, dc);
    K.pos = kgMoveGroup(K.pos, onBoard, fd.dr, fd.dc) || K.pos;
    if (inTray.length) {   // いっしょに選んだ置き場の子は、動かしたかたまりのすぐ下の行から
      var b = kgBounds(onBoard.reduce(function (o, id) { o[id] = K.pos[id]; return o; }, {}));
      K.pos = kgPlaceMany(K.pos, inTray, Math.min(KG_GRID.rows, b.r1 + 1), b.c0);
    }
  } else {
    K.pos = kgPlaceMany(K.pos, inTray, r, c);
  }
  var left = ids.filter(function (id) { return !K.pos[id]; }).length;
  syncShikaiByRow_(movedIds_(before, K.pos), row0);
  placedMulti_(ids.length - left, left ? '置きました(升目が足りず ' + left + '人は置き場のまま)' : '置きました');
}
function placedMulti_(n, what) {
  var K = App.kaigi;
  K.multi = {};
  markHandMoved_();
  renderHall(); renderKPanel(); renderNowBar();
  flashMsg_('✔ ' + n + '人を' + what);
}
/** 置き場の子をまとめて選ぶ(転入・人数を増やしたあとに一気に置くとき)。 */
function pickTrayAll() {
  var K = App.kaigi; K.multi = {}; K.sel = null;
  kaigiIds(K).forEach(function (id) { if (!K.pos[id]) K.multi[id] = true; });
  renderHall(); renderKPanel(); renderNowBar();
}
/** 席の指離し(・なぞり終わり)と同じ場所・直後の click か(続けて別の升をすばやくタップしたのは通す)。 */
function isGhostClick_(ev) {
  var u = App._seatUp; if (!u) return false;
  return Date.now() - u.t < 500 && Math.abs(ev.clientX - u.x) < 12 && Math.abs(ev.clientY - u.y) < 12;
}
/** 置き場の空いたところをタップ。動かす子(まとめて選んだ子)を席から外す。 */
function trayTap(ev) {
  var K = App.kaigi; if (!K.editSeats) return;
  if (isGhostClick_(ev)) return;
  if (ev.target.closest && ev.target.closest('.seat')) return;
  var grp = multiIds_().filter(function (id) { return K.pos[id]; });
  var row0 = shikaiRowOf_(K), before = Object.assign({}, K.pos);
  if (grp.length) K.pos = grp.reduce(function (pos, id) { return kgUnplace(pos, id); }, K.pos);
  else if (K.sel && K.pos[K.sel]) K.pos = kgUnplace(K.pos, K.sel);
  else return;
  syncShikaiByRow_(movedIds_(before, K.pos), row0);
  markHandMoved_();
  renderHall(); renderKPanel(); renderNowBar();
}

/* ===== まとめて選ぶ(盤の空いたところから なぞって四角で囲む) ===== */
function boardPressStart(ev) {
  var K = App.kaigi; if (!K.editSeats) return;
  if (ev.target.closest && ev.target.closest('.seat, .kg-pen, .kg-namein')) return;
  var board = document.getElementById('kg-board'), br = board.getBoundingClientRect();
  App._band = { x0: ev.clientX, y0: ev.clientY, moved: false, br: br, el: null };
  document.addEventListener('pointermove', onBandMove);
  document.addEventListener('pointerup', onBandEnd);
  document.addEventListener('pointercancel', onBandEnd);
}
function onBandMove(ev) {
  var B = App._band; if (!B) return;
  if (!B.moved && Math.abs(ev.clientX - B.x0) + Math.abs(ev.clientY - B.y0) < 8) return;   // 小さい動きはタップ
  B.moved = true;
  ev.preventDefault();
  var board = document.getElementById('kg-board'); if (!board) return;
  if (!B.el) { B.el = document.createElement('div'); B.el.className = 'kg-band'; board.appendChild(B.el); }
  var x1 = Math.min(B.x0, ev.clientX), y1 = Math.min(B.y0, ev.clientY);
  B.el.style.left = (x1 - B.br.left + board.scrollLeft) + 'px'; B.el.style.top = (y1 - B.br.top + board.scrollTop) + 'px';
  B.el.style.width = Math.abs(ev.clientX - B.x0) + 'px'; B.el.style.height = Math.abs(ev.clientY - B.y0) + 'px';
}
function onBandEnd(ev) {
  var B = App._band; if (!B) return;
  document.removeEventListener('pointermove', onBandMove);
  document.removeEventListener('pointerup', onBandEnd);
  document.removeEventListener('pointercancel', onBandEnd);
  App._band = null;
  if (B.el) B.el.remove();
  if (!B.moved || ev.type === 'pointercancel') return;     // タップは boardTap(click)が受ける
  App._seatUp = { t: Date.now(), x: ev.clientX, y: ev.clientY };   // なぞり終わりの click を「升へ置く」にしない
  var x1 = Math.min(B.x0, ev.clientX), x2 = Math.max(B.x0, ev.clientX);
  var y1 = Math.min(B.y0, ev.clientY), y2 = Math.max(B.y0, ev.clientY);
  var K = App.kaigi, picked = {};
  document.querySelectorAll('#kg-board .seat[data-sid]').forEach(function (e) {
    var r = e.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (cx >= x1 && cx <= x2 && cy >= y1 && cy <= y2) picked[e.getAttribute('data-sid')] = true;
  });
  K.multi = picked; K.sel = null;
  renderHall(); renderKPanel(); renderNowBar();
}
function clearMulti() { var K = App.kaigi; K.multi = {}; renderHall(); renderKPanel(); renderNowBar(); }
function startMultiAll() {   // 全員をまとめて選ぶ(全体を少しずらしたいとき)
  var K = App.kaigi; K.multi = {}; kaigiIds(K).forEach(function (id) { if (K.pos[id]) K.multi[id] = true; }); K.sel = null;
  renderHall(); renderKPanel(); renderNowBar();
}

/* ===== 升の上で名前を直す(席を直すとき・選んだ席の ✎ から) ===== */
function startInlineName(sid) {
  var K = App.kaigi; sid = sid || K.sel; if (!sid) return;
  var seat = document.querySelector('#kg-board .seat[data-sid="' + sid + '"]'); if (!seat) return;
  var s = studentOf(sid); if (!s) return;
  var cur = (isKenkyuNow() && s['表示名'] === (s['番号'] + '番')) ? '' : s['表示名'];
  var old = document.getElementById('kg-namein'); if (old) old.remove();
  var inp = document.createElement('input');
  inp.id = 'kg-namein'; inp.className = 'kg-namein'; inp.value = cur;
  inp.placeholder = isKenkyuNow() ? (s['番号'] + '番(呼び名)') : '名前';
  inp.setAttribute('aria-label', '名前を直す');
  inp.style.left = seat.style.left; inp.style.top = seat.style.top;
  inp.style.width = Math.max(110, parseFloat(seat.style.width)) + 'px'; inp.style.height = seat.style.height;
  var done = false;
  function commit(save) {
    if (done) return; done = true;
    var v = inp.value.trim(); inp.remove();
    if (save && v !== cur) saveNameFor(sid, v);
  }
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    else if (e.key === 'Escape') commit(false);
  });
  inp.addEventListener('blur', function () { commit(true); });
  inp.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  document.getElementById('kg-board').appendChild(inp);
  inp.focus(); inp.select();
}

/** 画面の点を、盤の中(升のある範囲)へ寄せる。 */
function clampToBoard_(x, y) {
  var K = App.kaigi, board = document.getElementById('kg-board'), G = K._geo;
  if (!board || !G) return [x, y];
  var br = board.getBoundingClientRect();
  var W = (G.colOff ? Math.max.apply(null, Object.keys(G.colOff).map(function (k) { return G.colOff[k]; })) + G.cw : (G.c1 - G.c0 + 1) * G.cw);
  var H = (G.rowOff ? Math.max.apply(null, Object.keys(G.rowOff).map(function (k) { return G.rowOff[k]; })) + G.ch : (G.r1 - G.r0 + 1) * G.ch);
  var x0 = br.left + G.left - board.scrollLeft, y0 = br.top + G.top - board.scrollTop;
  return [Math.max(x0 + 2, Math.min(x0 + W - 2, x)), Math.max(y0 + 2, Math.min(y0 + H - 2, y))];
}
/** 指を離した場所 → {kind:'cell', r, c} / {kind:'tray'} / null(盤の外)。 */
function seatDropTarget(x, y, selfSid) {
  var K = App.kaigi, el0 = document.elementFromPoint(x, y);
  var tray = document.getElementById('kg-tray');
  if (el0 && el0.closest) {
    if (tray && el0.closest('#kg-tray')) return { kind: 'tray', el: tray };
    var card = el0.closest('#kg-board .seat[data-sid]');
    // まとめて動かすときは、つかんだ子たちの上に落ちても「その升」として扱う(selfSid=null)
    if (card && (selfSid ? !card.classList.contains('seat--dragging') : true)) {
      var p = K.pos[card.getAttribute('data-sid')];
      if (p) return { kind: 'cell', r: p.r, c: p.c };
    }
  }
  var board = document.getElementById('kg-board'); if (!board || !K._geo) return null;
  var br = board.getBoundingClientRect();
  if (x < br.left || x > br.right || y < br.top || y > br.bottom) return null;
  var cell = kgCellAt(x - br.left + board.scrollLeft, y - br.top + board.scrollTop, K._geo);
  return cell ? { kind: 'cell', r: cell.r, c: cell.c } : null;
}

/* ===== 司会グループ(docs/29 §3) =====
   人数は0人〜何人でも。会を始めるときに席をタップして選ぶ(自動で6人を選ばない)。
   役割は 設定 の 司会役割 から選ぶ・その場で［＋役割を足す］。役割を付けない子は「司会グループ」。
   会の途中でも ⋯ →［司会グループを変える］。保存は 学級会役割(議題ID×児童ID)。 */
function startPickShikai() {
  var K = App.kaigi; if (!K) return;
  if (K.editSeats) { K.editSeats = false; if (K.seatsDirty) saveSeats(); }
  if (K.linking) cancelLinking(true);
  K.pickShikai = true;
  K._rolesBefore = Object.assign({}, K.roles);
  K.sel = null;
  renderHall(); renderSide(); renderToolRows(); renderNowBar();
}
function togglePickShikai(sid) {
  var K = App.kaigi;
  if (K.roles[sid]) delete K.roles[sid]; else K.roles[sid] = KAIGI_SHIKAI_NONAME;
  K.sel = K.roles[sid] ? sid : null;
  reflowShikai_();
  flashChair(sid); renderHall(); renderSide();
}
function setShikaiRole(sid, v) {
  var K = App.kaigi, was = !!K.roles[sid];
  if (v) K.roles[sid] = v; else delete K.roles[sid];
  if (was !== !!v) reflowShikai_();
  renderHall(); renderSide();
}
/** 前回と同じ(自分の学級のみ)。いま開いている会ではない、いちばん新しい会の役割を写す。 */
function lastShikaiOf(K) {
  return ((App.kaigiBoot || {})['前回の役割'] || []).filter(function (g) { return g['議題ID'] !== K.議題ID; })[0] || null;
}
function useLastShikai() {
  var K = App.kaigi, prev = lastShikaiOf(K); if (!prev) return;
  var known = {}; kaigiIds(K).forEach(function (id) { known[id] = true; });
  K.roles = {};
  (prev['役割'] || []).forEach(function (r) { if (known[r['児童ID']]) K.roles[r['児童ID']] = r['役割']; });
  reflowShikai_();
  renderHall(); renderSide();
}
/** ［＋役割を足す］。候補に足して 設定 の 司会役割 にも残す(次の会でも選べる)。いま選んでいる子がいれば、その子に付ける。 */
function addShikaiRole() {
  var inp = document.getElementById('kp-newrole');
  var v = ((inp || {}).value || '').replace(/[,、，]/g, ' ').trim();
  if (!v) { if (inp) inp.focus(); return; }
  var b = App.kaigiBoot, K = App.kaigi;
  b['役割候補'] = b['役割候補'] || [];
  if (b['役割候補'].indexOf(v) < 0 && v !== KAIGI_SHIKAI_NONAME) {
    b['役割候補'].push(v);
    callServer('saveSetting', '司会役割', b['役割候補'].join(',')).catch(function () {});
  }
  if (K.sel && K.roles[K.sel]) K.roles[K.sel] = v;
  renderHall(); renderSide();
}
/** 手で直した並びのとき: 司会グループだけを黒板の前の行へ。 */
function shikaiToFront() {
  var K = App.kaigi;
  K.pos = kgShikaiToFront(K.pos, shikaiIdsOf(K));
  K.seatsDirty = true;
  renderHall(); renderSide();
}
/** これで決める。変わったところだけ 学級会役割 に書く(外した子は 役割='' で上書き=getGidaiDetail が返さない)。 */
function finishPickShikai() {
  var K = App.kaigi; if (!K || !K.pickShikai) return;
  var before = K._rolesBefore || {}, seen = {}, assigns = [];
  Object.keys(before).concat(Object.keys(K.roles)).forEach(function (sid) {
    if (seen[sid]) return; seen[sid] = true;
    var a = before[sid] || '', b2 = K.roles[sid] || '';
    if (a !== b2) assigns.push({ '児童ID': sid, '役割': b2 });
  });
  if (assigns.length) callServer('assignRoles', K.議題ID, assigns).catch(alertErr);
  if (K.seatsDirty && !K.editSeats) saveSeats(false);   // 司会を黒板の前へ並べ直したら、その並びも残す
  K.pickShikai = false; K._rolesBefore = null; K.sel = null;
  renderHall(); renderSide(); renderToolRows(); renderNowBar();
}
function kpShikaiHtml(K) {
  var head = kpHeadHtml(K, mtIco('mic') + ' 司会グループ', '✔ これで決める', 'finishPickShikai()');
  var chosen = kaigiIds(K).filter(function (id) { return K.roles[id]; });
  var prev = isKenkyuNow() ? null : lastShikaiOf(K);
  var lead = '<div class="kp-note">席をタップして選びます(もう一度タップで外す)。<b>0人でもかまいません</b>。' +
    '役割を付けない子は「' + KAIGI_SHIKAI_NONAME + '」になります。</div>';
  var prevBtn = prev
    ? '<div class="kp-row"><button type="button" class="btn kp-btn" onclick="useLastShikai()">前回と同じ(' +
        escapeHtml(String(prev['実施日'] || '').slice(5).replace('-', '/')) + '・' + (prev['役割'] || []).length + '人)</button></div>'
    : '';
  var list = chosen.length
    ? chosen.map(function (sid) {
        return '<div class="kg-shrow' + (K.sel === sid ? ' on' : '') + '">' +
          '<span class="kg-shrow__nm">' + escapeHtml(nameOf(sid)) + '</span>' +
          '<select class="kp-input kg-shrow__sel" onfocus="App.kaigi.sel=\'' + sid + '\'" onchange="setShikaiRole(\'' + sid + '\',this.value)">' + roleOptionsHtml(K.roles[sid], false) + '</select>' +
          '<button type="button" class="kg-shrow__x" title="司会グループから外す" aria-label="' + escapeAttr(nameOf(sid)) + 'さんを外す" onclick="setShikaiRole(\'' + sid + '\',\'\')">✕</button></div>';
      }).join('')

    '<button type="button" class="btn kp-btn" onclick="addShikaiRole()">＋役割を足す</button></div>' +
    '<div class="kp-note" style="margin:4px 0 0">同じ役割を何人に付けてもかまいません。選んでいる子がいれば、その子に付きます。</div></div>';
  var foot = '<div class="kp-box"><div class="kp-row">' +
    '<button type="button" class="btn btn--primary kp-btn" onclick="finishPickShikai()">✔ これで決める(' + chosen.length + '人)</button></div>' +
    '<div class="kp-note" style="margin:6px 0 0">会の途中でも ⋯ →「司会グループを変える」で直せます。</div></div>';
  var frontBtn = (chosen.length && !(K.layoutAuto && !K.handMoved))
    ? '<div class="kp-row"><button type="button" class="btn kp-btn" onclick="shikaiToFront()">' + mtIco('mic') + ' 黒板の前に並べる</button></div>' +
      '<div class="kp-note" style="margin:4px 0 0">選んだ子を いちばん上の行へ動かします(ほかの子は動きません)。</div>'
    : (chosen.length ? '<div class="kp-note" style="margin:4px 0 0">選んだ子は黒板の前の「司会の席」に並びます。</div>' : '');
  return head + '<div class="kp-box">' + lead + prevBtn + frontBtn + '</div>' +
    '<div class="kp-box"><label class="kp-label">選んだ子 ' + chosen.length + '人</label>' + list + '</div>' + add + foot;
