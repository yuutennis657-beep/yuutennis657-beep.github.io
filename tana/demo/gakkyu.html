<script>
/* 体験版のしかけ（作品棚）。どこにも つながず、この ページの 中の 作り物の データで 動かす。 */
(function () {
  var last = 0;
  function note(msg) {
    var now = Date.now();
    if (now - last < 6000) return;
    last = now;
    function show() {
      var d = document.createElement('div');
      d.setAttribute('role', 'status');
      d.textContent = msg;
      d.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147483647;' +
        'background:#fff;color:#333;border:1px solid #bbb;border-radius:8px;padding:6px 12px;' +
        'font:14px/1.5 sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:none;max-width:90vw;text-align:center';
      document.body.appendChild(d);
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 3500);
    }
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  }
  window.__DEMO_NOTE = note;
  var realFetch = window.fetch;
  if (realFetch) window.fetch = function (u) {
    var s = String((u && u.url) || u || '');
    if (/^https?:/i.test(s) && s.indexOf(location.origin) !== 0) return Promise.reject(new TypeError('体験版なので外へはつなぎません'));
    return realFetch.apply(this, arguments);
  };
  note('体験版です。名前と記録はすべて作り物で、どこにも送りません');
})();
</script>
<title>学級会アプリ(ローカルプレビュー)</title>
<style>
/* css.html — 全CSSをインライン(CDN依存なし: 授業中の外部障害を避ける)。
   方針(03画面設計): 大きく・少なく・迷わない。色+記号の二重符号化。 */

/* デザイントークン(08_デザイン設計書 §2 の正・モード色) */
:root {
  --blue-50:#EBF2FA; --blue-600:#2B6CB0; --blue-700:#1D5CA8; --blue-800:#174A87;
  --teal-100:#D9F2EE; --teal-600:#0E9488; --teal-700:#0B7A70;
  --gray-100:#E8EBEF; --gray-600:#5B6472;
  --orange-100:#FDEDD9; --orange-600:#DD6B20; --orange-700:#B45309;
  --violet-50:#F0EBFA; --violet-100:#E6DFF7; --violet-200:#CDC0EC; --violet-400:#9A83D9; --violet-600:#6D4FC4; --violet-700:#5A3EA8;
  --rose-50:#FAEBF4; --rose-600:#B83280; --rose-700:#97266D;
  --shadow-1:0 1px 3px rgba(20,30,50,.08); --shadow-2:0 4px 14px rgba(20,30,50,.14);
  --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-2xl:16px; --r-pill:999px;
  --font-mono: ui-monospace, Menlo, monospace;
  /* タイプスケール(08 §2.2) */
  --text-xs:13px; --text-sm:14px; --text-base:16px; --text-lg:19px; --text-name:20px;
  --text-xl:22px; --text-sym:26px; --text-title:26px; --text-hero:32px;
}

/* セマンティックトークン(08 §2.1)。コンポーネントはこの層のみ参照する。 */
:root {
  --bg: #F2F5F9;
  --panel: #FFFFFF;
  --ink: #1A1D21;
  --ink-sub: #525C68;
  --line: #D6DCE4;
  --accent: var(--blue-600);          /* モードで切替(§7) */
  --accent-strong: var(--blue-700);
  --accent-soft: var(--blue-50);
  --accent-ink: #ffffff;
  /* 評価記号3色(色覚多様性配慮・全画面共通。§3) */
  --sym-good: var(--teal-600);   --sym-good-bg: var(--teal-100);   --sym-good-ink: var(--teal-700);
  --sym-ok:   var(--gray-600);   --sym-ok-bg: var(--gray-100);
  --sym-need: var(--orange-600); --sym-need-bg: var(--orange-100); --sym-need-ink: var(--orange-700);
  --sym-none: #B8C0CA;
  --danger: #C53030;
  --font: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --shadow: var(--shadow-2);          /* 旧名の別名(既存コンポーネント互換) */
}
/* モード識別: アクセントのみ差し替える(§7)。背景・文字・記号3色は共通。 */
body[data-mode="tokkatsu"] { --accent: var(--violet-600); --accent-strong: var(--violet-700); --accent-soft: var(--violet-50); }
body[data-mode="doutoku"]  { --accent: var(--rose-600);   --accent-strong: var(--rose-700);   --accent-soft: var(--rose-50); }
body[data-mode="setting"]  { --accent: var(--gray-600);   --accent-strong: #434b57;           --accent-soft: var(--gray-100); }

/* ===== 共通ナビ部品(08 §4.11 / タイトルDNA) ===== */
.mode-line { height:4px; background:var(--accent); }
.wordmark { font-weight:900; letter-spacing:.06em; font-size:18px; cursor:pointer; white-space:nowrap; }
.wordmark .c1{color:var(--teal-600);} .wordmark .c2{color:var(--ink);} .wordmark .c3{color:var(--orange-600);}
.homepill { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--r-pill);
  border:1px solid var(--line); background:var(--panel); color:var(--accent); font-weight:800; }
.homepill:hover { background:var(--accent-soft); border-color:var(--accent); }
.homepill .k { font-size:11px; color:var(--ink-sub); border:1px solid var(--line); border-radius:5px; padding:0 5px; margin-left:2px; }
@keyframes rise { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
.rise { animation:rise 320ms cubic-bezier(.2,.7,.3,1) both; }
@media (prefers-reduced-motion:reduce){ .rise{animation:none;} }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;              /* 授業中画面は16px以上 */
  -webkit-font-smoothing: antialiased;
}
#app { height: 100%; }

.hidden { display: none !important; }
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* 起動スプラッシュ */
.splash {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; gap: 12px;
}
.splash__logo { font-size: 40px; font-weight: 700; letter-spacing: 0.15em; color: var(--accent); }
.splash__msg { color: var(--ink-sub); }

/* 汎用ボタン */
.btn { padding: 10px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; }
.btn:hover { background: #f3f6fa; }
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn--primary:hover { filter: brightness(1.06); }
.btn--big { padding: 18px 28px; font-size: 22px; border-radius: 14px; }
.btn--ghost { background: transparent; border: 1px solid transparent; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
.chip--on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ============ ホーム(docs/ホーム画面モック.html を正として流用) ============ */
/* アプリバー: 3色ワードマーク(→タイトル)+モードタブ+年度 */
/* 右上の時計(全画面共通・常時表示)。ヘッダーの右端はこのぶんだけ空ける。 */
.clock { position: fixed; top: 7px; right: 12px; z-index: 85; display: flex; align-items: baseline; gap: 1px;
  background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 3px 12px; box-shadow: var(--shadow-1); font-variant-numeric: tabular-nums; pointer-events: none; }
.clock__hm { font-size: 16px; font-weight: 800; letter-spacing: .02em; }
.clock__s { font-size: 12px; font-weight: 700; color: var(--ink-sub); }
@media print { .clock { display: none; } }

.appbar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 24px; padding-right: 110px; display: flex; align-items: center; gap: 18px; }
.appbar .wordmark { font-size: 21px; font-weight: 900; letter-spacing: .06em; text-decoration: none; line-height: 1; }
.appbar .wordmark small { display: block; font-size: 9px; font-weight: 700; letter-spacing: .28em; color: var(--ink-sub); margin-top: 2px; }
.modetabs { display: flex; gap: 6px; }
.mtab { padding: 8px 18px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--panel); font-weight: 700; transition: 120ms ease-out; }
.mtab:hover { background: var(--accent-soft); }
.mtab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.appbar .spacer { flex: 1; }
.appbar .year { color: var(--ink-sub); font-size: 13.5px; font-weight: 600; letter-spacing: .06em; }

/* 背景モチーフ(巨大◎△を4〜5%で・ホームまで) */
.stagewrap { position: relative; overflow: hidden; min-height: calc(100vh - 66px); }
.motif { position: absolute; inset: 0; pointer-events: none; }
.motif .maru2 { position: absolute; top: -18vh; right: -8vw; width: 52vh; height: 52vh; border-radius: 50%; border: 5vh solid var(--teal-600); opacity: .05; }
.motif .maru2::after { content: ""; position: absolute; inset: 6.5vh; border-radius: 50%; border: 2vh solid var(--teal-600); }
.motif .sankaku { position: absolute; bottom: -8vh; left: -5vw; width: 0; height: 0; border-left: 22vh solid transparent; border-right: 22vh solid transparent; border-bottom: 38vh solid var(--orange-600); opacity: .045; transform: rotate(12deg); }

.home { position: relative; max-width: 1010px; margin: 0 auto; padding: 36px 24px 64px; }
.home__greet { color: var(--ink-sub); font-weight: 600; font-size: 14.5px; letter-spacing: .04em; margin: 0 0 14px; animation: rise 360ms cubic-bezier(.2,.7,.3,1) both; }

/* ヒーロー(タイトルの「続きから」と同族・ホームでは最大サイズ) */
.hero { width: 100%; display: flex; align-items: center; gap: 22px; text-align: left; background: var(--accent); color: #fff; border-radius: var(--r-2xl); padding: 24px 28px; box-shadow: var(--shadow-1); transition: filter 120ms ease-out, transform 120ms ease-out; animation: rise 400ms 60ms cubic-bezier(.2,.7,.3,1) both; }
.hero:hover { filter: brightness(1.07); }
.hero:active { transform: scale(.99); }
.hero--empty { background: var(--gray-600); }
.hero__play { flex: none; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.hero__label { font-size: clamp(22px, 3vw, 30px); font-weight: 800; line-height: 1.25; }
.hero__ctx { font-size: 15px; font-weight: 600; opacity: .92; margin-top: 4px; }
.hero__arrow { margin-left: auto; font-size: 30px; opacity: .9; }

/* クラスタブ */
.classtabs { display: flex; gap: 8px; margin: 22px 0 14px; flex-wrap: wrap; animation: rise 400ms 140ms cubic-bezier(.2,.7,.3,1) both; }
.classtabs .chip { padding: 9px 20px; font-weight: 800; font-size: 16px; }
.classtabs .chip:hover { background: var(--accent-soft); }

/* 単元カード = タイトルの「扉カード」と同族(左アクセントバー+浮上hover) */
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; animation: rise 400ms 200ms cubic-bezier(.2,.7,.3,1) both; }
.ucard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-2xl); padding: 20px 20px 16px 24px; box-shadow: var(--shadow-1); overflow: hidden; text-align: left; transition: transform 140ms ease-out, box-shadow 140ms ease-out, border-color 140ms ease-out; }
.ucard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--u-c, var(--accent)); }
.ucard:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: var(--u-c, var(--accent)); }
.ucard--sub { --u-c: #8CA3BC; }
.ucard__kind { font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--u-c, var(--accent)); }
.ucard__name { font-size: 20px; font-weight: 800; line-height: 1.3; margin-top: 4px; }
.ucard__meta { display: flex; align-items: center; gap: 14px; margin-top: 10px; color: var(--ink-sub); font-size: 14px; font-weight: 600; }
.ucard__meta b.unrated { color: var(--orange-700); font-size: 15px; }
.pbar { display: block; height: 6px; max-height: 6px; border-radius: var(--r-pill); background: var(--bg); overflow: hidden; margin-top: 12px; }
.pbar i { display: block; height: 6px; background: var(--u-c, var(--accent)); border-radius: var(--r-pill); }
.ucard__go { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-weight: 800; color: var(--u-c, var(--accent)); }

/* 下部ナビ = 扉カードのミニ版 */
.subnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 26px; animation: rise 400ms 260ms cubic-bezier(.2,.7,.3,1) both; }
.door-mini { position: relative; display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 14px 16px 14px 20px; box-shadow: var(--shadow-1); overflow: hidden; text-align: left; font-weight: 800; font-size: 16.5px; transition: transform 140ms ease-out, box-shadow 140ms ease-out, border-color 140ms ease-out; }
.door-mini::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--d-c, var(--gray-600)); }
.door-mini:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--d-c, var(--gray-600)); }
.door-mini small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--d-c, var(--gray-600)); }
.door-mini .arr { margin-left: auto; color: var(--d-c, var(--gray-600)); }
.door-mini--ana { --d-c: var(--accent); }

/* ============ 授業中画面(docs/入力画面モック.html を正として流用) ============ */
.lesson { display: flex; flex-direction: column; height: 100vh; }

/* --- ヘッダー(§4.11 ナビ / §4.9 単元スイッチャー) --- */
.lhead { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; padding-right: 110px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
/* ⌂ ホームへ戻るピル(全作業画面共通・ヘッダー左端固定。無ラベル「←」は使わない) */
.homebtn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px 8px 13px;
  border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--panel);
  font-weight: 800; font-size: 15px; color: var(--ink); transition: 120ms ease-out; }
.homebtn .ic { font-size: 17px; line-height: 1; color: var(--accent); display:inline-flex; }
.homebtn:hover { background: var(--accent-soft); border-color: var(--accent); }
.homebtn .key { font-size: 11px; color: var(--ink-sub); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-left: 2px; background: var(--bg); }
.ctx { font-size: 14px; color: var(--ink-sub); font-weight: 600; }
/* 単元名 = §4.9 クイックスイッチャーの入口(「▾」を常時表示) */
.unitname { font-size: 19px; font-weight: 800; display: inline-flex; align-items: center; }
.unitname .caret { color: var(--accent); font-size: 14px; margin-left: 2px; }
.unitname:hover { color: var(--accent-strong); }
.unitname.flash { animation: unitflash 800ms ease-out; }
@keyframes unitflash { 0% { color: var(--accent); } 100% { color: var(--ink); } }
@media (prefers-reduced-motion: reduce) { .unitname.flash { animation: none; } }
.me { font-size: 17px; font-weight: 700; }
.lhead__spacer, .lhead .spacer { flex: 1; }
.navbtns { display: flex; gap: 6px; align-items: center; }
.hbtn { padding: 7px 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 14px; }
.hbtn:hover { background: var(--accent-soft); border-color: var(--accent); }

.tag { padding: 4px 10px; border-radius: var(--r-sm); font-weight: 700; font-size: 14px; background: var(--gray-100); }
.tag--on { background: var(--accent); color: #fff; }
/* 観点タグ: ON=アクセント塗り / OFF=枠つき50%(無効ではなく「今日は重点でない」) */
.tag--kanten { background: var(--panel); color: var(--accent-strong); border: 1.5px solid var(--accent); opacity: .5; cursor: pointer; }
.tag--kanten.on { background: var(--accent); color: #fff; opacity: 1; }
.tag--kanten.off { opacity: .5; cursor: pointer; }
/* 道徳ヘッダーの内容項目バッジ */
.item-badge { background: var(--accent-soft); color: var(--accent-strong); border: 1px solid var(--accent);
  border-radius: var(--r-pill); padding: 4px 12px; font-weight: 800; font-size: 14px; }

/* --- 単元クイックスイッチャー ポップ(§4.9) --- */
.uswitch { position: absolute; z-index: 50; min-width: 320px; max-width: 92vw; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-2); padding: 8px; }
.uswitch__title { font-size: 13px; font-weight: 800; color: var(--ink-sub); padding: 4px 8px 8px; }
.uswitch__row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: var(--r-md); text-align: left; }
.uswitch__row:hover { background: var(--accent-soft); }
.uswitch__dot { color: var(--sym-none); font-size: 12px; }
.uswitch__row.on .uswitch__dot { color: var(--accent); }
.uswitch__name { font-weight: 700; flex: 1; }
.uswitch__prog { font-size: 13px; color: var(--ink-sub); white-space: nowrap; }
.uswitch__now { font-size: 12px; font-weight: 800; color: var(--accent-strong); white-space: nowrap; }
.uswitch__area { font-size: 12px; color: var(--ink-sub); background: var(--gray-100); border-radius: var(--r-pill); padding: 1px 8px; }
.uswitch__sep { height: 1px; background: var(--line); margin: 6px 4px; }
.uswitch__more { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: var(--r-md); font-weight: 700; color: var(--accent-strong); }
.uswitch__more:hover { background: var(--accent-soft); }

/* --- ツールバー(3ゾーン: 表示 | 入力モード | よさスタンプ) --- */
.ltool { display: flex; align-items: center; gap: 0; padding: 8px 16px; background: #F7F9FC; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tgroup { display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.tgroup:first-child { padding-left: 0; }
.tgroup--main { border-left: 1px solid var(--line); }
.tgroup--sub { border-left: 1px solid var(--line); margin-left: auto; }
.label-s { color: var(--ink-sub); font-size: 13px; font-weight: 600; margin-right: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--panel); }
.seg button { padding: 7px 14px; font-weight: 700; font-size: 14px; }
.seg button.on { background: var(--accent); color: #fff; }
/* 入力モードボタン。連続◎○△の記号は常時記号色(ONで白に反転) */
.mode-btn { padding: 7px 13px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); font-weight: 800; font-size: 14px; }
.mode-btn.on { color: #fff; box-shadow: inset 0 2px 3px rgba(0,0,0,.15); }
.ms { font-weight: 800; margin-right: 4px; font-size: 16px; }
.ms-g { color: var(--sym-good); } .ms-o { color: var(--sym-ok); } .ms-n { color: var(--sym-need); }
.mode-btn.on .ms { color: #fff; }
.mode-btn[data-sym="◎"].on { background: var(--sym-good); border-color: var(--sym-good); }
.mode-btn[data-sym="○"].on { background: var(--sym-ok); border-color: var(--sym-ok); }
.mode-btn[data-sym="△"].on { background: var(--sym-need); border-color: var(--sym-need); }
.mode-btn[data-mode="individual"].on { background: var(--accent); border-color: var(--accent); color: #fff; }
/* よさスタンプ(副ゾーン) */
.yosa { padding: 7px 12px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 13.5px; }
.yosa.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: inset 0 2px 3px rgba(0,0,0,.18); }
.yosa:hover { border-color: var(--accent); }

/* グリッド */
.gridwrap { flex: 1; overflow: auto; padding: 16px; position: relative; }
.grid { display: grid; gap: 10px; }
.grid--num { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
.grid--seat { /* 座席は inline style で列数指定 */ }

.scard { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px 8px 8px; min-height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
.scard:hover { border-color: #9db4cc; }
.scard.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.scard__no { position: absolute; top: 4px; left: 7px; font-size: 12px; color: var(--ink-sub); }
.scard__name { font-size: 20px; font-weight: 700; margin-top: 8px; text-align: center; line-height: 1.15; }
.scard__sym { font-size: 26px; font-weight: 800; line-height: 1; margin-top: 2px; }
.scard__memo { position: absolute; top: 4px; right: 7px; font-size: 13px; }
.scard--good { background: var(--sym-good-bg); border-color: var(--sym-good); }
.scard--good .scard__sym { color: var(--sym-good); }
.scard--ok { background: var(--sym-ok-bg); border-color: var(--sym-ok); }
.scard--ok .scard__sym { color: var(--sym-ok); }
.scard--need { background: var(--sym-need-bg); border-color: var(--sym-need); }
.scard--need .scard__sym { color: var(--sym-need); }
.scard__sym--none { color: #b8c0ca; }

/* 記号ポップ(個別モード) */
.pop { position: absolute; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; display: flex; gap: 6px; align-items: center; }
.pop__sym { width: 52px; height: 52px; border-radius: 12px; font-size: 26px; font-weight: 800; border: 2px solid var(--line); background: var(--panel); }
.pop__sym[data-sym="◎"] { color: var(--sym-good); }
.pop__sym[data-sym="○"] { color: var(--sym-ok); }
.pop__sym[data-sym="△"] { color: var(--sym-need); }
.pop__sym:hover { transform: translateY(-1px); }
.pop__memo { width: 52px; height: 52px; border-radius: 12px; font-size: 22px; border: 2px solid var(--line); }
.pop__clear { height: 52px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--line); color: var(--danger); font-weight: 700; }

/* フッター */
.lfoot { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.lfoot__stat { font-weight: 700; }
.lfoot__filter { display: flex; align-items: center; gap: 6px; color: var(--ink-sub); }
.lfoot__spacer { flex: 1; }

/* 保存状態バッジ(08 §4.8: 未保存=橙・保存済み=青緑。赤・点滅は使わない) */
.queue-badge { position: fixed; right: 14px; bottom: 70px; z-index: 60; background: var(--orange-600); color: #fff; padding: 8px 14px; border-radius: var(--r-pill); font-weight: 700; box-shadow: var(--shadow-2); }
.queue-badge--saved { background: var(--teal-600); }

/* オーバーレイ(Bの姿・今日のまとめ・メモ) */
.overlay { position: fixed; inset: 0; background: rgba(15,22,35,.42); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 20px; }
.sheet { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); max-width: 720px; width: 100%; max-height: 86vh; overflow: auto; padding: 22px 24px; }
.sheet__title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
.sheet__row { margin: 10px 0; }
.sheet__label { color: var(--ink-sub); font-size: 14px; }
.sheet__big { font-size: 22px; font-weight: 700; line-height: 1.4; }
.sheet__close { position: sticky; top: 0; float: right; }

/* Bの姿オーバーレイは大きめ */
.bsheet .sheet__big { font-size: 24px; }

/* メモ編集 */
.memo-tmpl { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.memo-tmpl button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: #f4f7fb; }
.memo-input { width: 100%; min-height: 84px; font-family: inherit; font-size: 17px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }

/* 今日のまとめ 分布バー */
.dist { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.dist__row { display: flex; align-items: center; gap: 10px; }
.dist__k { width: 30px; font-size: 22px; font-weight: 800; text-align: center; }
.dist__bar { flex: 1; height: 26px; background: #eef1f5; border-radius: 8px; overflow: hidden; }
.dist__fill { height: 100%; }
.dist__n { width: 56px; text-align: right; font-weight: 700; }
.namelist { display: flex; flex-wrap: wrap; gap: 6px; }
.namelist span { padding: 5px 10px; border-radius: 8px; background: #eef2f7; }

/* ============ 設定(旧マスタ管理・docs/設定画面モック.html を正) ============ */
/* 設定はモード非依存の部屋 → アクセントは灰(body[data-mode="setting"])。UIに「マスタ」の語は出さない(§6) */
.master { max-width: 1060px; margin: 0 auto; padding: 28px 24px 64px; }
.mhead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; padding-right: 96px; }
.mhead__title { font-size: 22px; font-weight: 700; }
/* 設定のアプリバー内: タイトル+パンくず */
.appbar .title { font-size: 19px; font-weight: 800; }
.crumb { color: var(--ink-sub); font-weight: 600; font-size: 14px; }
.crumb b { color: var(--ink); }
.crumb__link { color: var(--ink-sub); cursor: pointer; font-weight: 600; }
.crumb__link:hover { color: var(--accent-strong); text-decoration: underline; }

/* ハブ: 6つの部屋(扉カード同族) */
.set-lead { color: var(--ink-sub); font-weight: 600; margin: 0 0 18px; }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.room { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-2xl); padding: 20px 20px 16px 24px; box-shadow: var(--shadow-1); overflow: hidden; text-align: left; transition: transform 140ms ease-out, box-shadow 140ms ease-out, border-color 140ms ease-out; }
.room::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--rc, var(--gray-600)); }
.room:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: var(--rc, var(--gray-600)); }
.room__en { font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--rc, var(--gray-600)); }
.room__name { font-size: 21px; font-weight: 800; margin-top: 4px; display: block; }
.room__desc { color: var(--ink-sub); font-size: 14px; line-height: 1.55; margin-top: 8px; min-height: 44px; }
.room__stat { display: block; font-size: 13px; font-weight: 700; color: var(--ink-sub); margin-top: 10px; }
.room__stat b { color: var(--ink); }
.room__stat .warn { color: var(--orange-700); }
.room__go { display: inline-block; margin-top: 10px; font-weight: 800; color: var(--rc, var(--gray-600)); }

/* 単元設定: 教科タブ(各モード色) */
.subject-tabs { display: flex; gap: 6px; margin: 0 0 16px; flex-wrap: wrap; }
.stab { padding: 9px 22px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--panel); font-weight: 800; font-size: 15px; }
.stab:hover { border-color: var(--sc); color: var(--sc); }
.stab.on { background: var(--sc); border-color: var(--sc); color: #fff; }
.stab--kokugo { --sc: var(--blue-600); } .stab--tokkatsu { --sc: var(--violet-600); }
.stab--doutoku { --sc: var(--rose-600); }

/* 単元一覧(状態ピル+進捗) */
.ulist { display: flex; flex-direction: column; gap: 8px; }
.urow { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); transition: 120ms ease-out; }
.urow:hover { border-color: var(--blue-600); box-shadow: var(--shadow-1); }
.urow__name { font-weight: 800; font-size: 16.5px; }
.urow__name small { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-sub); margin-top: 2px; }
.pill { padding: 4px 12px; border-radius: var(--r-pill); font-size: 13px; font-weight: 800; }
.pill--now { background: var(--teal-100); color: var(--teal-700); }
.pill--prep { background: var(--gray-100); color: var(--ink-sub); }
.pill--done { background: var(--blue-50); color: var(--blue-700); }
.urow__meta { font-size: 13.5px; font-weight: 700; color: var(--ink-sub); }
.urow__open { color: var(--blue-600); font-weight: 800; }
/* 本時テーブル(セル直接編集) */
.ht { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.ht th, .ht td { border: 1px solid #EAEFF4; padding: 9px 10px; text-align: left; vertical-align: top; }
.ht th { background: #F3F6FA; font-size: 13px; color: var(--ink-sub); white-space: nowrap; }
.ht td[contenteditable]:hover { background: var(--blue-50); }
.ht td[contenteditable]:focus { outline: 2px solid var(--blue-600); outline-offset: -2px; background: var(--panel); }
.ht .num { text-align: center; font-weight: 800; width: 52px; }
.ktag { display: inline-block; padding: 2px 9px; border-radius: var(--r-sm); background: var(--blue-50); color: var(--blue-700); font-weight: 800; font-size: 13px; margin-right: 4px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.panel__lead { color: var(--ink-sub); margin: 8px 0; }
.row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
.ta { width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.err { color: var(--danger); font-weight: 600; padding: 8px 0; }

.diffgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.diffcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.diffcard b { display: block; margin-bottom: 8px; }
.diffcard--new { background: #e7f6ec; border-color: #a6d9b8; }
.diffcard--chg { background: #fdf6e3; border-color: #ecd9a0; }
.diffcard--miss { background: #fdecec; border-color: #edbcbc; }
.diffcard--err { background: #fdecec; border-color: var(--danger); margin-top: 12px; }

/* 座席D&D */
.seat-tray { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: #f4f7fb; border: 1px dashed var(--line); border-radius: 12px; margin: 12px 0; min-height: 56px; }
.tray-label { width: 100%; color: var(--ink-sub); font-size: 13px; }
.seat-grid { display: grid; gap: 8px; }
.seat-cell { min-height: 60px; border: 1px dashed #c4ccd6; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #fbfcfe; }
.seat-chip { background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; padding: 8px 10px; font-weight: 700; cursor: grab; position: relative; font-size: 15px; }
.seat-chip__no { color: var(--ink-sub); font-size: 11px; margin-right: 4px; }
.seat-teacher { text-align: center; color: var(--ink-sub); background: #e9edf3; border-radius: 8px; padding: 6px; margin-top: 4px; font-weight: 600; }

/* 単元テーブル */
.unitcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
.unitcard__head { font-size: 17px; }
.ltable { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
.ltable th, .ltable td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.ltable th { background: #f3f6fa; white-space: nowrap; }

/* ============ 分析ダッシュボード(docs/分析画面モック.html を正・資料トーン) ============ */
.analytics { max-width: 1200px; margin: 0 auto; padding: 16px 24px 64px; }
/* アプリバー内の絞り込みセレクト */
.appbar .sel { font-family: inherit; font-size: 15px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); font-weight: 600; }
/* タブ(ピル) */
.atabs { display: flex; gap: 6px; margin: 4px 0 8px; flex-wrap: wrap; }
.atab { padding: 9px 20px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--panel); font-weight: 800; font-size: 15px; transition: 120ms ease-out; }
.atab:hover { background: var(--accent-soft); }
.atab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.apanel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-2xl); box-shadow: var(--shadow-1); padding: 20px 22px; margin-top: 14px; }
.apanel h3 { margin: 0 0 12px; font-size: 15px; font-weight: 800; letter-spacing: .08em; color: var(--accent-strong); }
.anote { font-size: 13px; color: var(--ink-sub); margin-top: 10px; }

/* ヒートマップ(色+記号の二重符号化) */
.hm-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
.hm { border-collapse: collapse; width: 100%; }
.hm th, .hm td { border: 1px solid #EAEFF4; text-align: center; }
.hm thead th { position: sticky; top: 0; background: #F3F6FA; padding: 9px 6px; font-size: 13px; color: var(--ink-sub); font-weight: 700; z-index: 2; }
.hm .name, .hm .hm-name { position: sticky; left: 0; background: var(--panel); text-align: left; padding: 6px 14px; white-space: nowrap; font-size: 14.5px; font-weight: 700; cursor: pointer; min-width: 110px; z-index: 1; }
.hm .name:hover, .hm .hm-name:hover { color: var(--accent); text-decoration: underline; }
.hm-cell { width: 46px; height: 42px; font-size: 20px; font-weight: 800; cursor: pointer; transition: 80ms ease-out; }
.hm-cell.good { background: var(--teal-100); color: var(--teal-600); }
.hm-cell.ok { background: var(--gray-100); color: var(--gray-600); }
.hm-cell.need { background: var(--orange-100); color: var(--orange-600); }
.hm-cell.none { color: #C6CDD6; }
.hm-cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }

/* 抽出(条件チップ+行) */
.conds { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.cond { padding: 8px 16px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 14px; }
.cond.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.ex-list { display: flex; flex-direction: column; gap: 8px; }
.ex-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); transition: 120ms ease-out; }
.ex-row:hover { border-color: var(--accent); box-shadow: var(--shadow-1); }
.ex-row .nm, .ex-row__name { font-weight: 800; font-size: 16.5px; min-width: 110px; cursor: pointer; }
.ex-row .nm:hover, .ex-row__name:hover { color: var(--accent); text-decoration: underline; }
.ex-row .why, .ex-row__reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-row .why span, .ex-row__reasons span { background: var(--orange-100); color: var(--orange-700); padding: 4px 11px; border-radius: var(--r-pill); font-size: 13px; font-weight: 700; }
.ex-row .go { margin-left: auto; color: var(--accent); font-weight: 800; }

/* 相関散布図(単一系列=アクセント / ずれ大=白塗り+橙輪郭+名前ラベル) */
.scatter { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.scatter svg { background: var(--panel); border-radius: var(--r-md); max-width: 100%; height: auto; }
.scatter .pt { cursor: pointer; }
.scatter .pt:hover circle { stroke: var(--accent); stroke-width: 2; }
.sc-legend { font-size: 13.5px; color: var(--ink-sub); line-height: 1.9; min-width: 220px; }
.sc-legend b { color: var(--ink); }
.dot-demo { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); vertical-align: -1px; }
.dot-demo--hl { background: var(--panel); border: 2.5px solid var(--orange-600); }

/* 児童別ページ(分析タブ内) */
.st-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.st-name { font-size: 26px; font-weight: 800; }
.st-sub { color: var(--ink-sub); font-weight: 600; }
.st-section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-2xl); box-shadow: var(--shadow-1); padding: 18px 20px; margin-top: 14px; }
.st-section h3 { margin: 0 0 10px; font-size: 15px; font-weight: 800; letter-spacing: .08em; color: var(--accent-strong); }
.kbadges, .kanten-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.kbadge { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 16px; background: var(--panel); }
.kbadge .k { font-size: 13px; font-weight: 800; color: var(--accent-strong); }
.kbadge .v { font-size: 16px; font-weight: 800; margin-top: 2px; }
.kbadge .v .g { color: var(--teal-600); } .kbadge .v .o { color: var(--gray-600); } .kbadge .v .n { color: var(--orange-600); }
.filters { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.tl { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 150px 44px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bg); align-items: baseline; }
.tl-date { color: var(--ink-sub); font-size: 13px; font-weight: 600; }
.tl-sym { font-size: 22px; font-weight: 800; text-align: center; }
.tl-sym.good { color: var(--teal-600); } .tl-sym.ok { color: var(--gray-600); } .tl-sym.need { color: var(--orange-600); }
.tl-me { color: var(--ink-sub); font-size: 13px; }
.tl-memo { font-weight: 700; }

/* 面談モード(全画面・他児童への切替UIなし) */
.mendan { position: fixed; inset: 0; background: var(--panel); z-index: 100; display: none; flex-direction: column; padding: 40px 6vw; overflow: auto; }
.mendan.show { display: flex; animation: rise 240ms cubic-bezier(.2,.7,.3,1); }
.mendan__bar { display: flex; align-items: center; gap: 16px; }
.mendan__name { font-size: 34px; font-weight: 900; }
.mendan__tag { background: var(--accent); color: #fff; font-weight: 800; padding: 6px 16px; border-radius: var(--r-pill); font-size: 15px; }
.mendan__close { margin-left: auto; font-size: 17px; font-weight: 800; padding: 10px 20px; border: 1px solid var(--line); border-radius: var(--r-pill); }
.mendan__body { font-size: 118%; margin-top: 24px; max-width: 900px; }
.mendan .tl-item { grid-template-columns: 170px 50px 1fr; }

/* AI提案プレビュー */
.ai-pre { background: #0f1720; color: #d7e0ea; padding: 14px; border-radius: 10px; overflow: auto; max-height: 360px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }

/* ============ 今日のまとめ(docs/まとめ画面モック.html を正) ============ */
.summary { max-width: 860px; margin: 0 auto; padding: 28px 24px 64px; }
.sum-head { animation: rise 360ms cubic-bezier(.2,.7,.3,1) both; }
.sum-head h1 { font-size: 26px; font-weight: 800; margin: 0; }
.sum-head h1 small { font-size: 15px; font-weight: 700; color: var(--ink-sub); margin-left: 12px; }
.sum-head .me { color: var(--ink-sub); font-weight: 600; margin-top: 4px; }
.scard-c { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-2xl); box-shadow: var(--shadow-1); padding: 22px 24px; margin-top: 18px; overflow: hidden; }
.scard-c::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c-bar, var(--accent)); }
.scard-c h2 { font-size: 15px; font-weight: 800; letter-spacing: .1em; color: var(--c-bar, var(--accent)); margin: 0 0 14px; }
.scard-c--warn { --c-bar: var(--orange-600); }
/* 分布バー */
.sdist { display: flex; flex-direction: column; gap: 10px; }
.sdist__row { display: grid; grid-template-columns: 132px 1fr 96px; align-items: center; gap: 12px; }
.sdist__k { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.sdist__k .sym { font-size: 22px; width: 26px; text-align: center; }
.sdist__k .sym.g { color: var(--teal-600); } .sdist__k .sym.o { color: var(--gray-600); } .sdist__k .sym.n { color: var(--orange-600); }
.sdist__k .lbl { font-size: 13px; color: var(--ink-sub); font-weight: 700; }
.sdist__bar { height: 26px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.sdist__fill { display: block; height: 100%; border-radius: 4px 0 0 4px; }
.sdist__n { font-weight: 800; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
.sdist__n small { color: var(--ink-sub); font-weight: 600; }
/* 名前チップ */
.nchips { display: flex; flex-wrap: wrap; gap: 8px; }
.nchip { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 15px; transition: 120ms ease-out; }
.nchip:hover { border-color: var(--accent); background: var(--accent-soft); }
.nchip .m { font-weight: 800; }
.nchip small { color: var(--ink-sub); font-weight: 600; }
.nchip--none .m { color: #B8C0CA; }
.nchip--need { background: var(--orange-100); border-color: var(--orange-600); }
.nchip--need .m { color: var(--orange-600); }
.chiplabel { font-size: 13.5px; font-weight: 700; color: var(--ink-sub); margin: 0 0 8px; }
.nchips + .chiplabel { margin-top: 16px; }
.sum-hint { font-size: 13px; color: var(--ink-sub); margin-top: 10px; }
/* 次時への一言 */
.reflect textarea { width: 100%; min-height: 88px; font-family: inherit; font-size: 17px; line-height: 1.6; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); resize: vertical; }
.reflect textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.reflect .tmpl { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 0; }
.reflect .tmpl button { font-size: 13.5px; padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--r-pill); background: #F4F7FB; font-weight: 600; }
.reflect .tmpl button:hover { border-color: var(--accent); }
.sum-cta { display: flex; gap: 12px; margin-top: 24px; align-items: center; animation: rise 400ms 240ms cubic-bezier(.2,.7,.3,1) both; }
.sum-cta .btn { padding: 12px 22px; font-weight: 800; }
.sum-cta .btn--primary { font-size: 17px; }

/* ============ 評価の総括(docs/総括画面モック.html を正・§6) ============ */
/* 評価一覧マトリクス */
.sm-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r-lg); }
.sm { border-collapse: collapse; width: 100%; }
.sm th, .sm td { border: 1px solid #EAEFF4; padding: 0; }
.sm thead th { background: #F3F6FA; padding: 10px 8px; font-size: 13.5px; color: var(--ink-sub); font-weight: 700; }
.sm .name { position: sticky; left: 0; background: var(--panel); text-align: left; padding: 8px 14px; white-space: nowrap; font-size: 14.5px; font-weight: 700; z-index: 1; }
.smcell { display: flex; gap: 2px; padding: 6px; cursor: pointer; justify-content: center; }
.smcell:hover { background: var(--accent-soft); }
.g3 { display: flex; flex-direction: column; align-items: center; border-radius: 6px; padding: 3px 8px; min-width: 44px; position: relative; }
.g3 small { font-size: 10.5px; color: var(--ink-sub); font-weight: 700; letter-spacing: .06em; }
.g3 b { font-size: 16px; font-weight: 800; }
.g3 b.A { color: var(--teal-700); } .g3 b.B { color: var(--ink); } .g3 b.C { color: var(--orange-700); }
.g3--sou { background: var(--bg); }
.g3.ow::after { content: "✏"; position: absolute; top: 1px; right: 3px; font-size: 10px; }
/* 根拠ポップ */
.evi { position: absolute; z-index: 50; width: 340px; max-width: 92vw; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-2); padding: 16px 18px; }
.evi h4 { margin: 0 0 10px; font-size: 14.5px; font-weight: 800; }
.evi .row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 5px 0; border-bottom: 1px solid var(--bg); }
.evi .row .sym-g { color: var(--teal-600); } .evi .row .sym-o { color: var(--gray-600); } .evi .row .sym-n { color: var(--orange-600); }
.evi .ovr { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.evi .ovr .lbl { font-size: 13px; font-weight: 700; color: var(--ink-sub); }
.abc { width: 44px; height: 40px; border-radius: var(--r-md); border: 2px solid var(--line); font-weight: 800; font-size: 17px; background: var(--panel); }
.abc.on { border-color: var(--accent); background: var(--accent); color: #fff; }
.evi input { flex: 1; min-width: 120px; font-family: inherit; font-size: 13.5px; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r-sm); }
/* テスト入力(即時判定) */
.ti { border-collapse: collapse; width: 100%; margin-top: 10px; }
.ti th, .ti td { border: 1px solid #EAEFF4; padding: 8px 10px; text-align: center; font-size: 15px; }
.ti thead th { background: #F3F6FA; font-size: 13.5px; color: var(--ink-sub); }
.ti .nm { text-align: left; font-weight: 700; white-space: nowrap; }
.ti input { width: 74px; font-family: var(--font-mono); font-size: 16px; font-weight: 600; text-align: right; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r-sm); }
.ti input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
.ti tr.cur { background: var(--blue-50); }
.ti .jd { font-weight: 800; font-size: 16.5px; width: 52px; }
.ti .jd.A { color: var(--teal-700); } .ti .jd.B { color: var(--ink); } .ti .jd.C { color: var(--orange-700); }
.ti input.err { border-color: var(--danger); box-shadow: 0 0 0 1.5px var(--danger); }
.errmsg { color: var(--danger); font-size: 12.5px; font-weight: 700; display: block; margin-top: 3px; }
.tifoot { display: flex; align-items: center; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
.mini-dist { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
.mini-dist .c { padding: 3px 10px; border-radius: var(--r-pill); }
.mini-dist .cA { background: var(--teal-100); color: var(--teal-700); }
.mini-dist .cB { background: var(--gray-100); color: var(--ink); }
.mini-dist .cC { background: var(--orange-100); color: var(--orange-700); }
.crit { font-size: 13.5px; color: var(--ink-sub); font-weight: 600; }
.crit b { color: var(--ink); }

/* ============ 印刷(docs/印刷モック.html を正・08 §10) ============ */
/* 白黒コピーでも読める(情報は色に頼らない)。A4・余白15mm・ワードマークは小さく右下。 */
.print-toolbar { position: sticky; top: 0; z-index: 10; background: #1A1D21; color: #fff; padding: 10px 20px; display: flex; gap: 14px; align-items: center; font-size: 14px; }
.print-toolbar button { font-family: inherit; border-radius: 8px; padding: 8px 16px; font-weight: 700; }
.print-toolbar .pbtn-print { background: var(--blue-600); color: #fff; }
.print-toolbar .pbtn-close { background: #3a4150; color: #fff; }
.desk { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 16px; background: #5C6570; min-height: 100vh; }
.paper { width: 210mm; min-height: 297mm; background: #fff; color: #1A1D21; box-shadow: 0 6px 24px rgba(0,0,0,.35); padding: 15mm; position: relative; font-size: 10.5pt; }
.paper--yoko { width: 297mm; min-height: 210mm; }
.paper h1 { font-size: 14pt; margin: 0 0 2mm; letter-spacing: .05em; }
.paper .sub { font-size: 9pt; color: var(--ink-sub); margin-bottom: 5mm; }
.paper .sec { margin-top: 5mm; }
.paper .sec h2 { font-size: 10.5pt; margin: 0 0 2mm; padding: 1.2mm 3mm; background: #F0F3F7; border-left: 1.2mm solid #1A1D21; }
.paper table { border-collapse: collapse; width: 100%; font-size: 9.5pt; }
.paper th, .paper td { border: .4mm solid #C9D1DA; padding: 1.6mm 2.5mm; text-align: left; vertical-align: top; }
.paper th { background: #F5F7FA; font-weight: 700; white-space: nowrap; }
.paper .sym-g { color: var(--teal-600); font-weight: 800; } .paper .sym-o { color: var(--gray-600); font-weight: 800; } .paper .sym-n { color: var(--orange-600); font-weight: 800; }
.paper .quote { font-size: 9.5pt; line-height: 1.7; margin: 0; padding-left: 5mm; }
.paper .quote li { margin-bottom: 1.2mm; }
.paper .quote .d { color: var(--ink-sub); font-size: 8.5pt; margin-right: 2mm; }
.paper .memo-box { border: .4mm solid #C9D1DA; min-height: 22mm; padding: 2mm 3mm; font-size: 9.5pt; color: var(--ink-sub); }
.paper .brand { position: absolute; bottom: 8mm; right: 15mm; font-size: 8pt; color: var(--ink-sub); }
.paper .brand .c1 { color: var(--teal-600); } .paper .brand .c3 { color: var(--orange-600); }
.k-head { display: flex; align-items: baseline; gap: 8mm; border-bottom: 1mm solid #1A1D21; padding-bottom: 3mm; flex-wrap: wrap; }
.k-head .no { font-size: 22pt; font-weight: 900; } .k-head .gidai { font-size: 16pt; font-weight: 800; } .k-head .date { margin-left: auto; font-size: 11pt; color: var(--ink-sub); }
.k-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; margin-top: 6mm; }
.k-item { border: .5mm solid #C9D1DA; border-radius: 3mm; padding: 4mm 5mm; }
.k-item .name { font-size: 13pt; font-weight: 800; } .k-item .val { font-size: 26pt; font-weight: 900; margin-top: 1mm; }
.k-item .bar { height: 5mm; background: #EEF1F5; border-radius: 2mm; margin-top: 2mm; overflow: hidden; }
.k-item .bar i { display: block; height: 100%; background: #1A1D21; border-radius: 2mm; }
.k-note { font-size: 10.5pt; line-height: 1.8; margin-top: 5mm; }
.k-note b { background: #F0F3F7; padding: 0 2mm; }
@media print {
  body { background: #fff; }
  .no-print, .print-toolbar { display: none !important; }
  .desk { padding: 0; gap: 0; background: #fff; min-height: 0; }
  .paper { box-shadow: none; page-break-after: always; margin: 0; }
  @page { size: A4; margin: 0; }
}

/* ============ 学級会ライブ(docs/入力画面モック.html の学級会セクションを正) ============ */
/* ヘッダーの段階ボタン(①出し合う→②くらべ合う→③まとめる)+タイマー */
.stage-btns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stg { padding: 7px 14px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 14px; }
.stg.done { color: var(--ink-sub); } .stg.done::before { content: "✓ "; color: var(--teal-600); }
.stg.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.timer { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }

/* コの字ホール */
/* ライブ画面: 左=座席ホール / 中=記録パネル / 右=話合いの流れ(上下スクロール) */
.kaigi { flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: row; gap: 12px; min-height: 0; }
.hall { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.kpanel { flex: 0 0 300px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; overflow-x: hidden; padding-right: 2px; }
.kflowpanel { flex: 0 0 236px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.kflow-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
.kf-count { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-sub); }
.kf-item { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-family: inherit; cursor: pointer; }
.kf-item:hover { border-color: var(--accent); }
.kf-item--on { border-color: var(--accent); background: var(--accent-soft); }
.kf-item--tch { background: #f5f6f8; cursor: default; }
.kf-time { font-size: 11px; color: var(--ink-sub); font-variant-numeric: tabular-nums; margin-right: 6px; }
.kf-name { font-size: 14px; font-weight: 800; }
.kf-name small { font-weight: 700; color: var(--ink-sub); font-size: 11px; }
.kf-kind { font-size: 11px; font-weight: 800; color: var(--accent-strong); background: var(--accent-soft); border-radius: var(--r-pill); padding: 1px 8px; margin-left: 6px; }
.kf-memo { font-size: 13px; margin-top: 3px; line-height: 1.45; }
.kf-memo--empty { color: var(--ink-sub); font-size: 12px; }
@media (max-width: 1240px) { .kpanel { flex-basis: 264px; } .kflowpanel { flex-basis: 190px; } }
@media (max-width: 1040px) { .kflowpanel { display: none; } }
/* 黒板の上の向き切り替え */
.bb-flip { float: right; font-size: 11px; font-weight: 700; letter-spacing: 0; background: rgba(255,255,255,.16); color: #E8EDF2; border: 1px solid rgba(255,255,255,.35); border-radius: var(--r-pill); padding: 1px 10px; cursor: pointer; }
.bb-flip:hover { background: rgba(255,255,255,.3); }
/* 向き: 先生から見る = ホールを180°回し、カードの文字だけ起こす */
.hall--flip { transform: rotate(180deg); }
.hall--flip .scard, .hall--flip .blackboard, .hall--flip .kfloor, .hall--flip .kzone-empty { transform: rotate(180deg); }
.kp-head { display: flex; align-items: center; gap: 8px; }
.kp-title { font-weight: 800; font-size: 15px; }
.kp-tab { margin-left: auto; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-pill); padding: 5px 12px; cursor: pointer; }
.kp-tab:hover { border-color: var(--accent); color: var(--accent-strong); }
.kp-empty { color: var(--ink-sub); font-size: 14px; line-height: 1.7; background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; }
.kp-sel { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; }
.kp-name { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.kp-role { font-size: 11px; font-weight: 800; background: var(--accent); color: #fff; border-radius: var(--r-pill); padding: 2px 9px; }
.kp-cnt { font-size: 13px; color: var(--ink-sub); font-weight: 700; margin-top: 2px; }
.kp-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kp-label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 4px; }
.kp-note { font-size: 12px; color: var(--ink-sub); line-height: 1.5; margin-bottom: 6px; }
.kp-note--lead { margin-bottom: 10px; }
.kp-ta { width: 100%; font-family: inherit; font-size: 15px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; resize: vertical; }
.kp-ta:disabled { background: #f4f6f9; color: var(--ink-sub); }
.kp-input { width: 100%; font-family: inherit; font-size: 16px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; }
.kp-flash { animation: kpFlash .7s; }
@keyframes kpFlash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: none; } }
.kp-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.kp-btn { font-size: 14px; padding: 8px 14px; }
.kp-stamps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.kp-stamp { font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-pill); padding: 5px 10px; cursor: pointer; }
.kp-stamp.on { background: var(--violet-600); border-color: var(--violet-600); color: #fff; }
.kp-tmpl { margin: 8px 0 0; }
.kp-tmpl button { font-size: 12px; padding: 4px 9px; }
/* 右パネル末尾の案内(◎○△はライブでは打たない・設計18) */
.kp-auto { font-size: 12.5px; line-height: 1.6; color: var(--ink-sub); background: var(--violet-50); border: 1px solid var(--violet-100); border-radius: 12px; padding: 9px 12px; }

/* 特別活動の評価(振り返り画面・会の記録から自動・設計18) */
.hy-banner { background: var(--teal-50, #E6F4F1); border: 1px solid var(--teal-600); color: var(--teal-700); border-radius: var(--r-md); padding: 8px 12px; font-weight: 700; font-size: 14px; margin-bottom: 10px; }
.hy-banner--off { background: var(--orange-100); border-color: var(--orange-600); color: var(--orange-700); }
.hy-table td, .hy-table th { vertical-align: middle; }
.hy-table--quiet { opacity: .75; }
.hy-cell { min-width: 138px; }
.hy-syms { display: flex; align-items: center; gap: 4px; }
.hy-sym { font-size: 15px; font-weight: 800; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 9px; cursor: pointer; color: var(--ink-sub); }
.hy-sym--g.on { background: var(--sym-good-bg); border-color: var(--sym-good); color: var(--sym-good); }
.hy-sym--o.on { background: var(--sym-ok-bg); border-color: var(--sym-ok); color: var(--sym-ok); }
.hy-sym--n.on { background: var(--sym-need-bg); border-color: var(--sym-need); color: var(--sym-need); }
.hy-tag { font-size: 10.5px; font-weight: 800; color: var(--ink-sub); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 1px 6px; margin-left: 2px; }
.hy-tag--auto { color: var(--violet-700); border-color: var(--violet-200); background: var(--violet-50); }
.hy-why { font-size: 11.5px; color: var(--ink-sub); margin-top: 3px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hy-role { font-size: 11px; font-weight: 800; color: var(--violet-700); background: var(--violet-50); border-radius: var(--r-pill); padding: 1px 7px; margin-left: 6px; }
/* つながり(相手に向く発言のつなぎ先) */
.hall { position: relative; }                 /* つながり線SVGの基準 */
.link-svg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; }
.scard--doer { outline: 3px solid var(--violet-600); outline-offset: 1px; box-shadow: 0 0 0 4px var(--violet-100); }
.scard--target { outline: 3px dashed var(--violet-400); outline-offset: 1px; }
.kf-to { font-size: 11px; font-weight: 700; color: var(--violet-700); margin-left: 6px; }
.link-banner { position: sticky; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
  background: var(--violet-50); border: 2px solid var(--violet-400); border-radius: 12px; padding: 10px 16px; margin-top: 8px; box-shadow: var(--shadow-1); }
.link-banner .lb-main { font-size: 15px; color: var(--ink); }
.link-banner .lb-main b { color: var(--violet-700); }
.link-banner .lb-step { color: var(--violet-700); font-weight: 700; }
.link-banner .lb-targets { font-size: 14px; min-width: 120px; }
.link-banner .lb-btns { display: flex; gap: 8px; margin-left: auto; }
.link-banner .lb-note { flex-basis: 100%; font-size: 12px; color: var(--ink-sub); }
/* 相手に向く発言(🔗)と操作ヒント */
.pbtn--link { background: var(--violet-50); border-color: var(--violet-400); color: var(--violet-700); }
.pbtn--link.on { background: var(--violet-600); border-color: var(--violet-600); color: #fff; }
.btn[disabled] { opacity: .4; cursor: default; }
.plegend { font-size: 12px; color: var(--violet-700); background: var(--violet-50); border: 1px solid var(--violet-200); border-radius: var(--r-pill); padding: 2px 10px; align-self: center; }
.prow.phint { color: var(--ink-sub); font-size: 13px; padding-top: 2px; }
.prow.phint b { color: var(--ink); }
.tg-wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.tg-side { flex: 1; min-width: 200px; }
.tg-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tg-chip { font-size: 13px; background: var(--violet-50); border: 1px solid var(--violet-200); color: var(--violet-700); border-radius: var(--r-pill); padding: 2px 10px; }
/* 席を直すモード */
.scard--sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.scard--movable { cursor: grab; touch-action: none; }
.scard--dragging { opacity: .35; }
.scard--ghost { position: fixed; z-index: 90; pointer-events: none; opacity: .92; box-shadow: var(--shadow); transform: rotate(-1.5deg); }
.drop-hi { outline: 3px dashed var(--violet-600); outline-offset: 2px; }
.kzone-empty { font-size: 12px; color: var(--ink-sub); border: 2px dashed var(--line); border-radius: 10px; padding: 8px 14px; }
.pbtn--sel { font-size: 13px; padding: 6px 12px; }
.kp-step { font-size: 15px; font-weight: 800; width: 30px; height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer; }
.kp-stepname { font-size: 13px; font-weight: 700; color: var(--ink-sub); width: 62px; }
.blackboard { text-align: center; background: #3E4A56; color: #E8EDF2; border-radius: var(--r-sm); padding: 5px; font-size: 13px; letter-spacing: .3em; font-weight: 700; }
.shikai { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
/* コの字: 左辺(1列)・内側の空間・右辺(1列)・正面(下の2段)。人数が増えても席が縦横に伸びるだけで
   「コ」の形が崩れないよう、席は残りの高さ/幅を等分する(スクロールさせない)。 */
.konoji { display: grid; grid-template-columns: minmax(84px, 120px) 1fr minmax(84px, 120px); gap: 8px; flex: 1; min-height: 0; }
.kside { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
/* 左右の辺(1列)は壁に沿った机=横長の席にする(縦に何人並んでも名前が読める) */
.kside .scard { flex: 1 1 0; min-height: 34px; max-height: 64px; flex-direction: row; align-items: center; justify-content: center; gap: 6px; padding: 4px 6px; }
.kside .scard__name { margin-top: 0; flex: 1 1 auto; min-width: 2.4em; max-width: none; text-align: left; }
.kside .cnt { margin-top: 0; flex: 0 0 auto; font-size: 11px; padding: 1px 6px; }
/* 左右の辺を2列以上(二重のコの字)にしたとき: 縦カードのグリッドに切り替える */
.kside--multi { display: grid; grid-auto-rows: minmax(42px, 1fr); align-content: stretch; gap: 5px; }
.kside--multi .scard { flex-direction: column; justify-content: space-between; min-height: 42px; max-height: none; padding: 4px 3px; gap: 0; }
.kside--multi .scard__name { margin-top: 3px; flex: 0 0 auto; text-align: center; min-width: 0; font-size: 14px; }
.kside--multi .cnt { margin-top: 2px; }
.kcenter { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; min-height: 0; min-width: 0; }
.kbottom { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; min-width: 0; }
.kbottom .scard { min-height: 46px; }
/* コの字の内側(空間)。めあて・柱を薄く置いて、司会と黒板の間の余白を意味のある面にする。 */
.kfloor { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  text-align: center; color: var(--ink-sub); font-size: 15px; font-weight: 700; letter-spacing: .02em;
  border: 2px dashed var(--line); border-radius: 18px; padding: 10px 18px; min-height: 0; overflow: hidden; }
.kfloor:empty { border-color: transparent; }
.kfloor__sep { margin: 0 8px; opacity: .5; }
/* 役割バッジ(司会・副司会・記録係) */
.role { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 800; background: var(--accent); color: #fff; border-radius: var(--r-pill); padding: 1px 8px; white-space: nowrap; }
/* 発言カウントチップ(小さめカード) */
.scard--small { min-height: 50px; padding: 5px 4px 4px; }
.scard--small .scard__name { font-size: 15px; margin-top: 5px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cnt { font-size: 12px; font-weight: 800; color: var(--accent-strong); background: var(--accent-soft); border-radius: var(--r-pill); padding: 1px 8px; margin-top: 4px; }
.cnt--zero { background: var(--orange-100); color: var(--orange-700); }
.cnt--yosa { background: var(--violet-50); color: var(--violet-700); }
.scard.flash { animation: kflash .4s; }
@keyframes kflash { 0% { background: #d6f2ee; box-shadow: 0 0 0 4px var(--teal-100); } 100% { box-shadow: none; } }

/* パレット(発言・よさ)+フッター行 */
.palettes { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }

/* 大切なこと(この会・自分用): 画面最下部に常時。誰を選んでいても・席を直していても書ける(05 §記録パネル) */
.taisetsu { flex: 0 0 auto; display: flex; align-items: flex-start; gap: 10px; background: var(--accent-soft); border-top: 2px solid var(--accent); padding: 8px 16px; }
.tst-label { flex: 0 0 auto; font-size: 13px; font-weight: 800; color: var(--accent-strong); line-height: 1.25; padding-top: 5px; }
.tst-label small { display: block; font-size: 11px; font-weight: 700; color: var(--ink-sub); }
.tst-ta { flex: 1 1 auto; min-height: 36px; max-height: 92px; font-family: inherit; font-size: 15px; line-height: 1.5; padding: 7px 10px; border: 1px solid var(--accent); border-radius: 10px; background: var(--panel); resize: none; overflow-y: auto; }
.tst-ta:focus { outline: none; box-shadow: 0 0 0 3px var(--violet-100); }
.tst-state { flex: 0 0 auto; min-width: 56px; font-size: 12px; font-weight: 700; color: var(--ink-sub); padding-top: 9px; text-align: right; }
.tst-btn { flex: 0 0 auto; font-size: 13px; padding: 8px 12px; }
@media (max-width: 1040px) { .tst-label small { display: none; } .tst-btn { display: none; } }
.prow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.prow .plabel { font-size: 13px; font-weight: 700; color: var(--ink-sub); width: 86px; }
.pbtn { padding: 8px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 14px; }
.pbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: inset 0 2px 3px rgba(0,0,0,.18); }
.pbtn:hover { border-color: var(--accent); }
.prow .spacer { flex: 1; }
.flow { font-size: 13px; color: var(--ink-sub); padding: 2px 0; display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; overflow-x: auto; }
.flow b { color: var(--ink); }
.kflow__lead { flex: 0 0 auto; }
.kflow__i { flex: 0 0 auto; font-size: 13px; color: var(--ink-sub); background: none; border: 1px solid transparent; border-radius: var(--r-pill); padding: 3px 8px; white-space: nowrap; font-family: inherit; }
.kflow__i--edit { cursor: pointer; }
.kflow__i--edit:hover { border-color: var(--accent); background: var(--accent-soft); }
.kflow__memo { color: var(--ink); margin-left: 4px; }
.kflow__pen { opacity: .45; }
.kflow__arrow { flex: 0 0 auto; opacity: .5; }

/* 振り返り画面の流れ表示(据え置き) */
.kflow { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 16px; font-size: 14px; overflow-x: auto; white-space: nowrap; }

/* ============ 話合いの質(M4c / docs/12・学級会振り返りモック) ============ */
/* 指標カード(5枚) */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px 14px; background: var(--panel); box-shadow: var(--shadow-1); }
.kpi__name { font-size: 16px; font-weight: 700; line-height: 1.3; }
.kpi__formal { font-size: 12.5px; color: var(--ink-sub); margin-top: 2px; }
.kpi__valrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; margin-top: 8px; }
.kpi__val { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.kpi__val small { font-size: 17px; font-weight: 800; margin-left: 2px; }
.kpi__val--none { color: var(--sym-none); }
.kpi__bar { height: 6px; border-radius: var(--r-pill); background: var(--violet-100); margin-top: 10px; overflow: hidden; }
.kpi__bar i { display: block; height: 6px; background: var(--accent); border-radius: var(--r-pill); }
.kpi__note { font-size: 12px; color: var(--ink-sub); margin-top: 6px; }
.trend { flex: none; display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: var(--r-pill); font-size: 13px; font-weight: 800; white-space: nowrap; }
.trend--up { background: var(--teal-100); color: var(--teal-700); }
.trend--flat { background: var(--gray-100); color: var(--gray-600); }
.trend--down { background: var(--orange-100); color: var(--orange-700); }
.trend--first { background: var(--gray-100); color: var(--gray-600); font-weight: 700; }
/* 視点構成バー */
.stack { display: flex; height: 18px; border-radius: var(--r-pill); overflow: hidden; gap: 2px; background: #fff; margin-top: 6px; }
.stack i { display: block; height: 18px; }
.vlegend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
.vlegend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.vlegend b { font-variant-numeric: tabular-nums; }
/* スルー候補 */
.sr { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-bottom: 1px solid var(--line); }
.sr:last-child { border-bottom: none; }
.sr input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.sr .t { font-size: 13px; color: var(--ink-sub); font-variant-numeric: tabular-nums; width: 44px; }
.sr .nm { font-size: 16px; font-weight: 700; }
.sr .chip { padding: 3px 10px; border-radius: var(--r-sm); background: var(--violet-50); color: var(--violet-700); font-weight: 700; font-size: 13.5px; }
.sr .stg { font-size: 13px; color: var(--ink-sub); }
.sr--done { background: var(--gray-100); border-radius: var(--r-sm); }
.sr--done .nm, .sr--done .t { color: var(--ink-sub); }
.sr .done-note { font-size: 13px; font-weight: 700; color: var(--gray-600); margin-left: auto; }
/* 教師の関わり */
.duo { display: flex; height: 16px; border-radius: var(--r-pill); overflow: hidden; gap: 2px; max-width: 520px; }
.duo i { height: 16px; }
.tchrow { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.tchrow .nm { width: 86px; font-size: 14px; font-weight: 700; }
.tchrow .bar { height: 12px; background: var(--gray-100); border-radius: var(--r-pill); flex: 0 0 260px; max-width: 40vw; overflow: hidden; }
.tchrow .bar i { display: block; height: 12px; background: var(--gray-600); border-radius: var(--r-pill); }
.tchrow .n { font-size: 14px; color: var(--ink-sub); font-variant-numeric: tabular-nums; }
.mutetag { display: inline-block; padding: 2px 10px; border-radius: var(--r-pill); background: var(--gray-100); color: var(--gray-600); font-size: 12.5px; font-weight: 700; margin-left: 8px; vertical-align: 2px; }
/* メモ3欄 */
.memo3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
@media (max-width: 900px) { .memo3 { grid-template-columns: 1fr; } }
.mbox label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); }
.badge--pub { background: var(--violet-50); color: var(--violet-700); }
.badge--priv { background: var(--gray-100); color: var(--ink-sub); }
.mbox textarea { width: 100%; min-height: 92px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; font: inherit; font-size: 15px; resize: vertical; }
.mbox textarea:focus { outline: none; border: 2px solid var(--accent); }
.mtmpl { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.mtmpl button { font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--panel); color: var(--ink-sub); }
.mtmpl button:hover { border-color: var(--accent); color: var(--accent-strong); }
.qhint { font-size: 13px; color: var(--orange-700); font-weight: 700; }
/* 先生ミニパレット(ライブ) */
.pbtn--tch { border-color: var(--line); background: var(--panel); color: var(--ink); font-size: 13.5px; }
.pbtn--tch:active { background: var(--gray-100); }
.pdivider { width: 1px; align-self: stretch; background: var(--line); margin: 0 6px; }
/* 欠席カード */
.scard--absent { opacity: .45; }
.scard .abadge { position: absolute; top: 5px; right: 6px; background: var(--gray-600); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: var(--r-pill); }
/* 掲示用表示(全画面・プロジェクタ) */
.keiji { position: fixed; inset: 0; background: var(--panel); z-index: 100; display: none; flex-direction: column; overflow: auto; }
.keiji.show { display: flex; }
.keiji__close { position: fixed; top: 14px; right: 18px; padding: 9px 16px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--panel); font-weight: 700; box-shadow: var(--shadow-1); z-index: 5; }
.keiji__head { display: flex; align-items: baseline; gap: 18px; padding: 26px 40px 6px; flex-wrap: wrap; }
.keiji__no { font-size: clamp(20px, 2.6vw, 30px); font-weight: 800; color: var(--accent-strong); }
.keiji__gidai { font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: .02em; }
.keiji__date { font-size: clamp(16px, 2vw, 22px); color: var(--ink-sub); font-weight: 700; margin-left: auto; }
.krows { padding: 10px 40px; display: flex; flex-direction: column; gap: 6px; }
.krow { display: grid; grid-template-columns: minmax(260px, 1.2fr) auto 1fr auto; align-items: center; gap: 22px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.krow:last-child { border-bottom: none; }
.krow .knm { font-size: clamp(22px, 3vw, 34px); font-weight: 700; line-height: 1.25; }
.krow .kval { font-size: clamp(40px, 6vw, 72px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.krow .kval small { font-size: .42em; font-weight: 800; }
.krow .kbar { height: 14px; background: var(--violet-100); border-radius: var(--r-pill); overflow: hidden; }
.krow .kbar i { display: block; height: 14px; background: var(--accent); border-radius: var(--r-pill); }
.krow .trend { font-size: clamp(16px, 1.8vw, 24px); padding: 6px 16px; }
.knotes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 14px 40px 8px; }
@media (max-width: 760px) { .knotes { grid-template-columns: 1fr; } .krow { grid-template-columns: 1fr auto; } .krow .kbar, .krow .trend { display: none; } }
.kcard { border: 1px solid var(--line); border-radius: var(--r-xl); padding: 14px 18px 14px 22px; position: relative; box-shadow: var(--shadow-1); }
.kcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: var(--r-xl) 0 0 var(--r-xl); }
.kcard--good::before { background: var(--teal-600); }
.kcard--next::before { background: var(--orange-600); }
.kcard h4 { margin: 0 0 8px; font-size: clamp(18px, 2.2vw, 24px); }
.kcard ul { margin: 0; padding-left: 1.3em; font-size: clamp(16px, 2vw, 21px); line-height: 1.7; }
.keiji__foot { padding: 12px 40px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.kimatta { font-size: clamp(16px, 2vw, 21px); font-weight: 700; }
.kimatta span { color: var(--ink-sub); font-weight: 600; margin-right: 8px; font-size: .85em; }

/* ============ 学級会の歩み(蓄積・可視化・設計17) ============ */
/* 次への重点(振り返りメモの持ち越し欄) */
.mbox--juten { margin-top: 12px; border: 1px dashed var(--violet-400); border-radius: var(--r-md); padding: 10px 12px; background: var(--violet-50); }
.mbox--juten textarea { min-height: 40px; background: var(--panel); }
/* 前回の重点(持ち越し)バナー */
.carry { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--violet-50); border: 1px solid var(--violet-100); border-left: 5px solid var(--violet-600); border-radius: var(--r-md); padding: 10px 14px; margin-bottom: 14px; }
.carry__tag { font-weight: 800; color: var(--violet-700); white-space: nowrap; }
.carry__text { font-weight: 700; }
.carry__ask { color: var(--ink-sub); font-size: 13px; margin-left: auto; }
/* 推移グラフ */
.ayumi-chart { width: 100%; overflow-x: auto; margin: 6px 0 14px; }
.ayumi-chart svg { min-width: 520px; }
/* 積み上げタイムライン */
.ayumi-timeline { display: flex; flex-direction: column; gap: 10px; }
.ay-row { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 14px; background: var(--panel); }
.ay-head { font-weight: 800; font-size: 15.5px; margin-bottom: 6px; }
.ay-head small { color: var(--ink-sub); font-weight: 600; font-size: 13px; }
.ay-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 680px) { .ay-cols { grid-template-columns: 1fr; } }
.ay-col { border-radius: var(--r-md); padding: 8px 10px; }
.ay-col--good { background: var(--teal-100); }
.ay-col--next { background: var(--orange-100); }
.ay-col h5 { margin: 0 0 4px; font-size: 13.5px; font-weight: 800; }
.ay-col--good h5 { color: var(--teal-700); }
.ay-col--next h5 { color: var(--orange-700); }
.ay-col ul { margin: 0; padding-left: 18px; }
.ay-col li { margin: 2px 0; line-height: 1.5; }
.ay-empty { color: var(--ink-sub); }
.ay-juten { margin-top: 8px; font-weight: 700; color: var(--violet-700); background: var(--violet-50); border-radius: var(--r-md); padding: 6px 10px; }
/* 掲示版(全画面・大きめ) */
.keiji-ayumi__body { padding: 8px 40px 20px; overflow: auto; }
.keiji--ayumi .carry { font-size: clamp(18px, 2.4vw, 26px); }
.keiji--ayumi .carry__ask { display: none; }
.keiji--ayumi .ayumi-chart svg { min-width: 640px; }
.ayumi-timeline--keiji .ay-head { font-size: clamp(17px, 2vw, 22px); }
.ayumi-timeline--keiji .ay-col li, .ayumi-timeline--keiji .ay-col h5 { font-size: clamp(15px, 1.7vw, 19px); }

/* ============ 道徳モード(docs/入力画面モックの道徳セクション・設計09) ============ */
/* 記録ドット(◎○△は使わない・カード下部に本時の記録数) */
.dots { display: flex; gap: 4px; margin-top: 8px; min-height: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.dots .more { font-size: 12px; font-weight: 800; color: var(--accent-strong); font-style: normal; }
/* 記述ポップ(タグ記録直後の任意一言・3秒) */
.notepop { position: absolute; z-index: 40; width: 260px; max-width: 92vw; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-2); padding: 10px; text-align: left; }
.notepop .np-title { font-size: 12px; font-weight: 800; color: var(--accent-strong); margin-bottom: 6px; }
.notepop .np-tmpl { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.notepop .np-tmpl button { font-size: 12px; padding: 4px 9px; border: 1px solid var(--line); border-radius: var(--r-pill); background: #F4F7FB; }
.notepop input { width: 100%; font-family: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); }
/* 教材ナビ(年間計画・内容項目マップ) */
.dnav-row { display: grid; grid-template-columns: 84px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); margin-top: 6px; }
.dnav-row.warn { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.dnav-row .m-jiki { font-size: 13px; color: var(--ink-sub); font-weight: 700; }
.dnav-row .m-name { font-weight: 800; }
.dnav-row .m-name small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-sub); }
.dnav-row .m-open { color: var(--accent); font-weight: 800; cursor: pointer; }
.pill--done { background: var(--teal-100); color: var(--teal-700); }
.imap { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.icell { border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; background: var(--panel); }
.icell.zero { border-color: var(--accent); background: var(--accent-soft); }
.icell .ic-code { font-size: 12px; font-weight: 800; color: var(--accent-strong); }
.icell .ic-name { font-weight: 700; font-size: 14px; margin-top: 2px; }
.icell .ic-n { font-size: 12px; color: var(--ink-sub); font-weight: 700; margin-top: 4px; }
.icell.zero .ic-n { color: var(--accent-strong); }
.kflow__label { color: var(--ink-sub); margin-right: 8px; }
.kflow__item { display: inline-block; padding: 2px 8px; background: #eef2f7; border-radius: 8px; }

.yosa-pop { position: fixed; right: 16px; bottom: 80px; z-index: 70; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; width: 340px; max-width: 92vw; }
.yosa-pop__head { font-weight: 700; margin-bottom: 8px; }

/* ===== 終末の助言メモ(具体の記録を児童ごとに並べる) ===== */
.sheet--katari { max-width: 860px; }
.katari-pend { font-size: 13px; font-weight: 700; color: var(--orange-700); background: var(--orange-100); border-radius: 10px; padding: 6px 12px; margin-bottom: 10px; }
.kt-card { border: 1px solid var(--line); border-left: 5px solid var(--violet-400); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); }
.kt-name { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.kt-cnt { font-size: 12px; font-weight: 700; color: var(--ink-sub); }
.kt-item { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 4px 0; border-top: 1px dashed var(--line); }
.kt-item:first-of-type { border-top: none; }
.kt-tag { font-size: 12px; font-weight: 800; border-radius: var(--r-pill); padding: 2px 9px; white-space: nowrap; }
.kt-tag--speech { color: var(--accent-strong); background: var(--accent-soft); }
.kt-tag--yosa { color: var(--violet-700); background: var(--violet-50); }
.kt-text { flex: 1; min-width: 200px; font-size: 15px; }
.kt-time { font-size: 12px; color: var(--ink-sub); font-variant-numeric: tabular-nums; }
.kt-add { font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-pill); padding: 3px 10px; cursor: pointer; color: var(--teal-700); }
.kt-add:hover { border-color: var(--accent); background: var(--accent-soft); }
.kt-add--issue { color: var(--orange-700); }
.kt-sub { margin-top: 12px; }
.kt-sub b { font-size: 14px; }
.kt-sub .namelist { margin-top: 6px; }

/* ============ タイトル画面(docs/タイトル画面モック.html を正として流用) ============ */
.stage { position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(24px,4.5vh,44px); padding:24px; }
.motif { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.motif .maru2 { position:absolute; top:-14vh; right:-10vw; width:56vh; height:56vh; border-radius:50%; border:5.5vh solid var(--teal-600); opacity:.07; }
.motif .maru2::after { content:""; position:absolute; inset:7vh; border-radius:50%; border:2.2vh solid var(--teal-600); }
.motif .maru1 { position:absolute; bottom:-18vh; right:22vw; width:44vh; height:44vh; border-radius:50%; border:4.5vh solid var(--gray-600); opacity:.06; }
.motif .sankaku { position:absolute; bottom:-6vh; left:-6vw; width:0; height:0; border-left:26vh solid transparent; border-right:26vh solid transparent; border-bottom:44vh solid var(--orange-600); opacity:.06; transform:rotate(14deg); }

.brand { position:relative; text-align:center; }
.brand__mark { font-size:clamp(72px, 15vw, 190px); font-weight:900; line-height:1; letter-spacing:.04em; margin:0; color:var(--ink); animation:rise 500ms cubic-bezier(.2,.7,.3,1) both; }
.brand__mark .c1 { color:var(--teal-600); } .brand__mark .c2 { color:var(--ink); } .brand__mark .c3 { color:var(--orange-600); }
.brand__syms { display:flex; justify-content:center; gap:18px; font-size:clamp(20px,2.6vw,30px); font-weight:800; margin-top:6px; }
.brand__syms span { animation:rise 400ms cubic-bezier(.2,.7,.3,1) both; }
.brand__syms .g { color:var(--teal-600); animation-delay:120ms; } .brand__syms .o { color:var(--gray-600); animation-delay:200ms; } .brand__syms .n { color:var(--orange-600); animation-delay:280ms; }
.brand__tagline { color:var(--ink-sub); font-size:clamp(15px,1.6vw,18px); font-weight:600; letter-spacing:.14em; margin-top:14px; animation:rise 400ms 320ms cubic-bezier(.2,.7,.3,1) both; }
@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
