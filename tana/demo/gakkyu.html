/* ============ その場で名前を打つ(研究授業むけ・2026-09-09) ============
   他の学級を見取るとき、CSVを作っている時間はない。年と組を1回入れて、名前を
   1行に1人ずつ打つ(貼る)と、ここで CSV を組み立てて【いつもの差分確認 → 反映】に流す。
   取り込みの本体(previewRosterImport / commitRosterImport)は一切触らない。入口を1つ増やしただけ。
   組み立てた CSV は下の欄にそのまま出るので、何が作られたかは目で見える。 */
var QR_INP_STYLE = 'font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px';

function renderQuickRosterPanel_() {
  return '<div class="panel" style="margin-bottom:14px"><h3>その場で名前を打つ</h3>' +
    '<div class="panel__lead">研究授業などで、よその学級をその場で登録するとき。' +
      '年と組を入れて、名前を1行に1人ずつ。番号は上から 1, 2, 3… と付きます。</div>' +
    '<div class="row">' +
      '<label>年 <input id="q-nen" type="text" inputmode="numeric" value="6" style="width:4em;' + QR_INP_STYLE + '"></label>' +
      '<label>組 <input id="q-kumi" type="text" value="" placeholder="1" style="width:5em;' + QR_INP_STYLE + '"></label>' +
    '</div>' +
    '<textarea class="ta" id="q-names" placeholder="佐藤 大翔&#10;鈴木 陽菜&#10;高橋 悠人&#10;&#10;姓と名は空白かカンマで区切ります(区切りが無ければ全部が名字)。&#10;番号を自分で決めるなら「1 佐藤 大翔」のように行の頭に。&#10;メールがあれば名前のうしろに続けて書けます。"></textarea>' +
    '<div class="row">' +
      '<button class="btn btn--primary" onclick="quickRosterToCsv()">この名前で読み込む</button>' +
      '<span id="q-note" style="color:var(--ink-sub)"></span>' +
    '</div>' +
    '<div class="panel__lead">※ ほかのクラスは「欠落」に出ますが、' +
      '「欠落した子を『転出』にする」にチェックを入れなければ、そのまま残ります。</div>' +
  '</div>';
}

/** 打った名前 → CSV を組み立てて、いつもの差分確認へ流す。 */
function quickRosterToCsv() {
  var note = document.getElementById('q-note');
  var nen = qrTrim_(document.getElementById('q-nen').value);
  var kumi = qrTrim_(document.getElementById('q-kumi').value);
  if (nen === '' || kumi === '') { note.textContent = '年と組を入れてください'; return; }

  var lines = String(document.getElementById('q-names').value || '').split('\n');
  var out = ['年,組,番号,名字,下の名前,Googleアカウント'];
  var tobashita = 0;
  lines.forEach(function (line) {
    var s = qrTrim_(line);
    if (s === '') return;
    var num = '';
    var m = s.match(/^(\d{1,3})[\s.、,:：]+(.+)$/);   // 行の頭の番号は、書いてあれば使う
    if (m) { num = m[1]; s = qrTrim_(m[2]); }
    var mail = '';
    var parts = s.split(/[\s\t,、]+/).filter(function (x) { return x !== ''; });   // 空白でもカンマでも切れる
    parts = parts.filter(function (x) {
      if (mail === '' && x.indexOf('@') > 0) { mail = x; return false; }
      return true;
    });
    if (!parts.length) { tobashita++; return; }
    if (num === '') num = String(out.length);          // 見出し1行ぶんで ちょうど 1 から始まる
    out.push([nen, kumi, num, qrCsv_(parts[0]), qrCsv_(parts.slice(1).join(' ')), qrCsv_(mail)].join(','));
  });

  if (out.length < 2) { note.textContent = '名前が1つも読めませんでした'; return; }
  document.getElementById('csvtext').value = out.join('\n') + '\n';
  note.textContent = (out.length - 1) + '人を組み立てました' + (tobashita ? '(' + tobashita + '行はとばしました)' : '');
  previewRoster();
}

/** 前後の空白を落とす(全角の空白も半角に揃えてから)。 */
function qrTrim_(v) {
  return String(v === null || v === undefined ? '' : v).replace(/\u3000/g, ' ').replace(/^\s+|\s+$/g, '');
}

/** CSVの1マス分に整える(カンマ・引用符・改行があれば囲む)。 */
function qrCsv_(v) {
  var s = String(v === null || v === undefined ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function pickCsvFile() {
  var el = document.getElementById('csvfile');
  if (el) { el.value = ''; el.click(); }   // 同じファイルを選び直しても onchange が動くように空にする
}
function onCsvFile(e) {
  var f = e.target.files[0]; if (!f) return;
  // ★Excelの「CSV(カンマ区切り)」は Shift-JIS で保存される。UTF-8 で読むと全部 □ になり、
  //   見出しが読めず「0人」になる。文字化けを見つけたら Shift-JIS で読み直す(2026-09-09)。
  readCsvAs_(f, 'UTF-8', function (text) {
    if (text.indexOf('\uFFFD') >= 0) {
      readCsvAs_(f, 'Shift_JIS', function (t2) { applyCsvFile_(f, t2, 'Shift-JIS'); });
    } else {
      applyCsvFile_(f, text, 'UTF-8');
    }
  });
}
function readCsvAs_(file, enc, cb) {
  var rd = new FileReader();
  rd.onload = function () { cb(String(rd.result === null || rd.result === undefined ? '' : rd.result)); };
  rd.onerror = function () { alert('ファイルを読めませんでした: ' + file.name); };
  rd.readAsText(file, enc);
}
function applyCsvFile_(file, text, enc) {
  document.getElementById('csvtext').value = text;
  var el = document.getElementById('csvfile-name');
  if (el) el.textContent = '読み込み: ' + file.name + '(文字コード ' + enc + ')';
  previewRoster();
}
function previewRoster() {
  var csv = document.getElementById('csvtext').value;
  if (!csv.trim()) { alert('CSVを入力してください'); return; }
  var box = document.getElementById('roster-diff');
  box.innerHTML = '<div class="panel__lead">確認中…</div>';
  callServer('previewRosterImport', csv).then(function (d) { renderRosterDiff(d, csv); })
    .catch(function (e) { box.innerHTML = '<div class="err">' + escapeHtml(e.message || e) + '</div>'; });
}
function renderRosterDiff(d, csv) {
  App._rosterCsv = csv;
  function names(list, key) {
    if (!list.length) return '<span style="color:var(--ink-sub)">なし</span>';
    return '<div class="namelist">' + list.map(function (x) {
      var label = key === 'chg' ? (x['表示名'] + '(' + x['差分'].map(function (df) { return df['列']; }).join(',') + ')')
        : key === 'new' ? (x['名字'] + x['下の名前'] + ' [' + x['年'] + '-' + x['組'] + '#' + x['番号'] + ']')
        : (x['表示名'] + ' [' + x['クラス'] + '#' + x['番号'] + ']');
      return '<span>' + escapeHtml(label) + '</span>';
    }).join('') + '</div>';
  }
  var errHtml = d['エラー'].length
    ? '<div class="diffcard diffcard--err"><b>エラー ' + d['エラー'].length + '</b>' +
      '<div class="namelist">' + d['エラー'].map(function (x) { return '<span>行' + x['行'] + ': ' + escapeHtml(x['理由']) + '</span>'; }).join('') + '</div></div>'
    : '';

  // ★「何を読んだか」を必ず出す。0人ばかり並んだときに、貼り付けが悪いのか
  //   すでに同じ内容なのかが、この行を見れば分かる(2026-09-09)。
  var ri = d['読み取り'] || {};
  var atari = (ri['列の対応'] || {});
  var taiou = Object.keys(atari).filter(function (k) { return k !== '__氏名'; })
    .map(function (k) { return atari[k] === k ? k : (atari[k] + '→' + k); }).join(' / ');
  var readHtml =
    '<div class="panel__lead" style="margin-top:12px">' +
      '読み取り: <b>' + escapeHtml(ri['区切り'] || 'カンマ区切り') + '</b>' +
      ' ・ 見出し【' + escapeHtml((ri['見出し'] || []).join(' / ') || '(なし)') + '】' +
      ' ・ データ <b>' + (ri['データ行数'] == null ? '—' : ri['データ行数']) + '行</b>' +
      (ri['読めた行数'] != null ? '(うち読めたのは ' + ri['読めた行数'] + '人)' : '') +
      (taiou ? '<br>列の対応: ' + escapeHtml(taiou) : '') +
      (ri['氏名を分割'] ? '<br>※氏名の列を空白で姓と名に分けました' : '') +
    '</div>';

  var total = d['新規'].length + d['変更'].length + d['欠落'].length;
  var sameHtml = (!total && !d['エラー'].length && d['総数'] > 0)
    ? '<div class="diffcard diffcard--miss" style="margin-top:12px"><b>反映するものはありません</b>' +
      '<div class="panel__lead" style="margin-top:4px">貼り付けた' + d['総数'] + '人は、すでに名簿にある内容とまったく同じでした。' +
      '(名字・下の名前・Googleアカウントのどれも違いなし)。名簿を入れ替えたいのに0人と出るときは、' +
      '上の「読み取り」の見出しと行数を確かめてください。</div></div>'
    : '';

  (document.getElementById('roster-diff') || {}).innerHTML =
    readHtml + sameHtml +
    '<div class="diffgrid">' +
      '<div class="diffcard diffcard--new"><b>新規 ' + d['新規'].length + '</b>' + names(d['新規'], 'new') + '</div>' +
      '<div class="diffcard diffcard--chg"><b>変更 ' + d['変更'].length + '</b>' + names(d['変更'], 'chg') + '</div>' +
      '<div class="diffcard diffcard--miss"><b>欠落(在籍だがCSVに無い) ' + d['欠落'].length + '</b>' + names(d['欠落'], 'miss') + '</div>' +
    '</div>' + errHtml +
    '<div class="row" style="margin-top:14px">' +
      '<label class="lfoot__filter"><input type="checkbox" id="mark-missing"> 欠落した子を「転出」にする</label>' +
      '<button class="btn btn--primary" id="roster-commit" ' +
        ((d['エラー'].length || !total) ? 'disabled title="' + (d['エラー'].length ? 'エラーを解消してください' : '反映するものがありません') + '"' : '') +
        ' onclick="commitRoster()">この内容で反映</button>' +
      '<span id="roster-commit-note" class="panel__lead" style="margin:0"></span>' +
    '</div>';
}
function commitRoster() {
  var mark = document.getElementById('mark-missing').checked;
  // ★押しても何も起きないように見えるのが一番こわい。押した瞬間に止めて、待っていることを出す。
  var btn = document.getElementById('roster-commit');
  var note = document.getElementById('roster-commit-note');
  if (btn) { btn.disabled = true; btn.textContent = '反映中…'; }
  if (note) note.textContent = '名簿シートに書き込んでいます。画面を閉じずにお待ちください。';
  callServer('commitRosterImport', App._rosterCsv, { markMissingAsTransferred: mark }).then(function (r) {
    alert('反映しました。追加 ' + r['追加'] + ' / 更新 ' + r['更新'] + ' / 転出 ' + r['転出'] +
      (r['エラー件数'] ? ' / エラー ' + r['エラー件数'] : ''));
    App.home = null; // ホーム再取得のため
    renderRosterTab();
  }).catch(function (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'この内容で反映'; }
    if (note) note.textContent = '';
    alert('反映に失敗: ' + (e.message || e));
  });
}

/* ============ 座席表 D&D ============ */
function renderSeatTab() {
  var classes = (App.home && App.home['クラス一覧']) || ['6-1', '6-2'];
  App.seatClass = App.seatClass || classes[0];
  var opts = classes.map(function (c) { return '<button class="chip ' + (c === App.seatClass ? 'chip--on' : '') + '" onclick="selectSeatClass(\'' + c + '\')">' + c + '</button>'; }).join('');
  (document.getElementById('mbody') || {}).innerHTML =
    '<div class="panel">' +
      '<div class="row"><span>クラス:</span>' + opts +
        '<span style="margin-left:20px">列数:</span>' +
        '<button class="btn" onclick="seatCols(-1)">−</button><span id="seat-cols">6</span><button class="btn" onclick="seatCols(1)">＋</button>' +
        '<div class="lfoot__spacer" style="flex:1"></div>' +
        '<button class="btn btn--primary" onclick="saveSeat()">席替えを保存</button>' +
      '</div>' +
      '<div class="row" style="gap:6px">かんたん整列:' +
        '<button class="btn" onclick="seatByNumber()">番号順に並べる</button>' +
        '<button class="btn" onclick="seatFlipLR()">左右反転</button>' +
        '<button class="btn" onclick="seatFlipFB()">前後反転</button>' +
        '<button class="btn" onclick="seatShuffle()">シャッフル</button>' +
        '<span style="color:var(--ink-sub);font-size:13px">整列後に個別のドラッグで微調整できます。</span></div>' +
      '<div class="panel__lead">名前を空きマスへドラッグ。教卓は下側(行1が最前列)。トレイに戻すと未配置。整列・変更後は「席替えを保存」を押してください。</div>' +
      '<div class="seat-tray" id="seat-tray"></div>' +
      '<div class="seat-grid" id="seat-grid"></div>' +
    '</div>';
  loadSeating();
}
function selectSeatClass(c) { App.seatClass = c; renderSeatTab(); }
function loadSeating() {
  callServer('getSeating', App.seatClass).then(function (s) {
    App.seat = { className: s['クラス'], students: s['児童'], cols: s['最大列'] || 6, place: {} };
    s['児童'].forEach(function (st) { if (st['行'] && st['列']) App.seat.place[st['児童ID']] = { 行: st['行'], 列: st['列'] }; });
    renderSeatGrid();
  }).catch(function (e) { (document.getElementById('seat-grid') || {}).innerHTML = '<div class="err">' + escapeHtml(e.message || e) + '</div>'; });
}
function seatCols(d) { if (!App.seat) return; App.seat.cols = Math.max(1, Math.min(12, App.seat.cols + d)); document.getElementById('seat-cols').textContent = App.seat.cols; renderSeatGrid(); }
function renderSeatGrid() {
  var S = App.seat, cols = S.cols;
  var byId = {}; S.students.forEach(function (st) { byId[st['児童ID']] = st; });
  var placedIds = Object.keys(S.place);
  var usedRows = placedIds.map(function (id) { return S.place[id].行; });
  var rows = Math.max(Math.ceil(S.students.length / cols), usedRows.length ? Math.max.apply(null, usedRows) : 0) + 1;

  // トレイ(未配置)
  var tray = S.students.filter(function (st) { return !S.place[st['児童ID']]; });
  (document.getElementById('seat-tray') || {}).innerHTML = '<div class="tray-label">未配置 ' + tray.length + '人</div>' +
    tray.map(function (st) { return seatChip(st); }).join('');

  // グリッド
  var occ = {}; placedIds.forEach(function (id) { occ[S.place[id].行 + ',' + S.place[id].列] = id; });
  var cells = '';
  for (var r = rows; r >= 1; r--) {          // 行1(最前列)を下に置く
    for (var c = 1; c <= cols; c++) {
      var id = occ[r + ',' + c];
      cells += '<div class="seat-cell" data-r="' + r + '" data-c="' + c + '" ' +
        'ondragover="event.preventDefault()" ondrop="onSeatDrop(event,' + r + ',' + c + ')">' +
        (id ? seatChip(byId[id]) : '') + '</div>';
    }
  }
  var grid = document.getElementById('seat-grid');
  grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  grid.innerHTML = cells + '<div class="seat-teacher" style="grid-column:1/' + (cols + 1) + '">教卓 / 前</div>';
}
function seatChip(st) {
  return '<div class="seat-chip" draggable="true" data-sid="' + st['児童ID'] + '" ' +
    'ondragstart="event.dataTransfer.setData(\'text/sid\', \'' + st['児童ID'] + '\')">' +
    '<span class="seat-chip__no">' + (st['番号'] || '') + '</span>' + escapeHtml(st['表示名']) + '</div>';
}
function onSeatDrop(e, r, c) {
  e.preventDefault();
  var sid = e.dataTransfer.getData('text/sid'); if (!sid) return;
  var S = App.seat;
  // 移動先が埋まっていたら入れ替え
  var occId = null; Object.keys(S.place).forEach(function (id) { if (S.place[id].行 === r && S.place[id].列 === c) occId = id; });
  var from = S.place[sid];
  if (occId && occId !== sid) { if (from) S.place[occId] = { 行: from.行, 列: from.列 }; else delete S.place[occId]; }
  S.place[sid] = { 行: r, 列: c };
  renderSeatGrid();
}
// トレイへドロップで未配置化
document.addEventListener('drop', function (e) {
  var tray = document.getElementById('seat-tray');
  if (tray && tray.contains(e.target) && App.seat) {
    var sid = e.dataTransfer.getData('text/sid');
    if (sid) { delete App.seat.place[sid]; renderSeatGrid(); }
  }
});
document.addEventListener('dragover', function (e) {
  var tray = document.getElementById('seat-tray');
  if (tray && tray.contains(e.target)) e.preventDefault();
});
function saveSeat() {
  var S = App.seat;
  var placements = Object.keys(S.place).map(function (id) { return { '児童ID': id, '行': S.place[id].行, '列': S.place[id].列 }; });
  if (!placements.length) { alert('配置がありません'); return; }
  callServer('saveSeating', S.className, placements, '').then(function (r) {
    alert('席替えを保存しました(' + r['保存席数'] + '席 / 有効開始日 ' + r['有効開始日'] + ')');
  }).catch(function (e) { alert('保存に失敗: ' + (e.message || e)); });
}

/* かんたん整列(クライアント側で App.seat.place を組み替え、保存で確定) */
function seatByNumber() {
  var S = App.seat, cols = S.cols;
  var list = S.students.slice().sort(function (a, b) { return (a['番号'] || 0) - (b['番号'] || 0); });
  S.place = {};
  list.forEach(function (st, i) { S.place[st['児童ID']] = { 行: Math.floor(i / cols) + 1, 列: (i % cols) + 1 }; });
  renderSeatGrid();
}
function seatUsedMax(dim) { var mx = 1; Object.keys(App.seat.place).forEach(function (id) { mx = Math.max(mx, App.seat.place[id][dim]); }); return mx; }
function seatFlipLR() { var c = App.seat.cols; Object.keys(App.seat.place).forEach(function (id) { App.seat.place[id]['列'] = c + 1 - App.seat.place[id]['列']; }); renderSeatGrid(); }
function seatFlipFB() { var r = seatUsedMax('行'); Object.keys(App.seat.place).forEach(function (id) { App.seat.place[id]['行'] = r + 1 - App.seat.place[id]['行']; }); renderSeatGrid(); }
function seatShuffle() {
  var S = App.seat, cols = S.cols, ids = S.students.map(function (s) { return s['児童ID']; });
  for (var i = ids.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = ids[i]; ids[i] = ids[j]; ids[j] = t; }
  S.place = {};
  ids.forEach(function (id, i) { S.place[id] = { 行: Math.floor(i / cols) + 1, 列: (i % cols) + 1 }; });
  renderSeatGrid();
}

        '<textarea class="ta" id="mastercsv" placeholder="種別,単元ID,第何時,教科,学年,単元名,…"></textarea>' +
        '<div class="row"><button class="btn btn--primary" onclick="doImportMaster()">投入</button></div>' +

  });

function setSubjectTab(t) { App.subjectTab = t; renderUnitTab(); }
function toggleMasterCsv() { document.getElementById('master-csv').classList.toggle('hidden'); }
function doImportMaster() {
  var csv = document.getElementById('mastercsv').value;
  if (!csv.trim()) { alert('CSVを入力してください'); return; }
  callServer('importMasterCsv', csv).then(function (r) {
    alert('投入: 単元 ' + r['単元'] + ' / 本時 ' + r['本時'] + (r['エラー'].length ? ' / エラー ' + r['エラー'].length : ''));
    renderUnitTab();
  }).catch(function (e) { alert('投入に失敗: ' + (e.message || e)); });
}

  var c = st === '実施中' ? 'now' : st === '完了' ? 'done' : 'prep';
  return '<span class="pill pill--' + c + '">' + escapeHtml(st || '準備中') + '</span>';
}
function renderUnitList(units) {
  App._unitsFull = units;
  if (!units.length) { (document.getElementById('unit-list') || {}).innerHTML = '<div class="panel__lead">単元がありません。CSVで投入してください。</div>'; return; }
  (document.getElementById('unit-list') || {}).innerHTML =
    '<div class="ulist">' + units.map(function (u, i) {
      var m = (u['本時'] || []).length || (u['配当時数'] || 0);
      var hasLessons = (u['本時'] || []).length > 0;
      var kihan = (u['規準_知識技能'] || u['知'] || u['単元の目標']) ? '規準 ✓' : '規準 下書き';
      return '<div class="urow">' +
        '<span class="urow__name">' + escapeHtml(u['単元名']) +

        statePill(u['状態']) +

        (hasLessons ? '<button class="urow__open" onclick="showHonji(' + i + ')">開く →</button>' : '<span class="urow__meta">本時未登録</span>') +
      '</div>';

// 単元→本時のドリルダウン(本時のめあて等を一覧表示)

  var u = (App._unitsFull || [])[idx];

  App.masterView = 'unit';   // ビューは単元設定のまま、パンくずに単元名を追記
  var crumbEl = document.querySelector('.appbar .crumb');
  if (crumbEl) crumbEl.innerHTML = '<span class="crumb__link" onclick="settingsHub()">設定</span> › ' +
    '<span class="crumb__link" onclick="setMasterView(\'unit\')">単元設定</span> › <b>' + escapeHtml(u['単元名']) + '</b>';
  var rows = (u['本時'] || []).map(function (l) {
    var kt = String(l['重点観点'] || '').split(/[・,]/).filter(Boolean).map(function (k) { return '<span class="ktag">' + escapeHtml(k) + '</span>'; }).join('');
    return '<tr><td class="num">' + l['第何時'] + '</td>' +

      '<td>' + escapeHtml(l['本時規準(Bの姿)'] || l['Bの姿'] || '') + '</td></tr>';

  (document.getElementById('mbody') || {}).innerHTML =
    '<div class="panel">' +
      '<h3>' + escapeHtml(u['単元名']) + ' — 本時の一覧</h3>' +

        '<tbody>' + rows + '</tbody></table>' +

      '</div>' +

  (document.getElementById('mbody') || {}).innerHTML =

      '<div id="test-grid"></div>' +
      '<div class="row"><button class="btn btn--primary" onclick="saveTest()">テスト点数を保存</button></div>' +
    '</div>';
  callServer('getUnitsFull').then(function (units) {
    App._units = units;
    (document.getElementById('test-unit') || {}).innerHTML = units.map(function (u) { return '<option value="' + escapeHtml(u['単元ID']) + '">' + escapeHtml(u['単元名']) + '</option>'; }).join('');
    loadTestGrid();
  });
}
function setTestClass(c) { App.testClass = c; loadTestGrid(); }
function loadTestGrid() {
  var sel = document.getElementById('test-unit'), box = document.getElementById('test-grid');
  if (!sel || !box) return;   // 読み込みのあいだに別の画面へ移った(単元一覧が後から届いた)
  var unitId = sel.value;
  box.innerHTML = '<div class="panel__lead">読み込み中…</div>';
  callServer('getTestGrid', unitId, App.testClass).then(function (g) {
    if (g['満点_知識技能']) { }
    var rows = g['児童'].map(function (s, i) {
      return '<tr><td>' + (s['番号'] || '') + '</td><td>' + escapeHtml(s['表示名']) + '</td>' +
        '<td><input type="number" class="tk" data-sid="' + s['児童ID'] + '" value="' + (s['点_知識技能'] == null ? '' : s['点_知識技能']) + '" style="width:70px"></td>' +
        '<td><input type="number" class="ts" data-sid="' + s['児童ID'] + '" value="' + (s['点_思考判断表現'] == null ? '' : s['点_思考判断表現']) + '" style="width:70px"></td></tr>';
    }).join('');
    box.innerHTML = '<table class="ltable"><tr><th>番号</th><th>氏名</th><th>知識・技能</th><th>思考・判断・表現</th></tr>' + rows + '</table>';
  }).catch(function (e) { box.innerHTML = '<div class="err">' + escapeHtml(e.message || e) + '</div>'; });
}
function saveTest() {
  var unitId = document.getElementById('test-unit').value;
  var mk = document.getElementById('mk').value, ms = document.getElementById('ms').value, td = document.getElementById('tdate').value;
  var tks = {}, tss = {};
  Array.prototype.forEach.call(document.querySelectorAll('.tk'), function (i) { tks[i.getAttribute('data-sid')] = i.value; });
  Array.prototype.forEach.call(document.querySelectorAll('.ts'), function (i) { tss[i.getAttribute('data-sid')] = i.value; });
  var rows = Object.keys(tks).map(function (sid) { return { '児童ID': sid, '点_知識技能': tks[sid], '点_思考判断表現': tss[sid] }; });
  callServer('saveTestScores', unitId, rows, mk, ms, td).then(function (r) { alert('保存しました(' + r['保存数'] + '人分)'); }).catch(function (e) { alert('保存に失敗: ' + (e.message || e)); });
}

/* =======================================================================
   見取りの鏡(設計23 / 見取り設計書 v1.0 §9)
   -----------------------------------------------------------------------
   ★★ この面だけ、分析の対象が児童ではない。【教師自身の見取り】である。

// 記録の出どころ(内訳キー・表示名・色)。同じ青の濃淡=白黒でも順に読める。

var MR_SRC = [['評価', '評価(◎○△)', '#174A87'], ['発言', '発言', '#2B6CB0'],
              ['よさ', 'よさ', '#7FA9E8'], ['道徳', '道徳', '#C3D3EA']];

function anSetMrScope(s) { App.an.mrScope = s; renderMirror(); }

    .then(function (r) { App.an.mr = r; body.innerHTML = mirrorHtml(r); })
    .catch(function (e) { body.innerHTML = '<div class="apanel"><div class="err">' + escapeHtml(e.message || e) + '</div></div>'; });
}

function mrPct(v) { return (v == null) ? '—' : Math.round(v * 100) + '%'; }
function mrNum(v, unit) { return '<span class="n">' + (v == null ? '—' : v) + (unit ? '<small>' + unit + '</small>' : '') + '</span>'; }
/** 1本ぶんの横棒(名前・棒・右の数字)。max に対する割合で伸ばす。 */
function mrLbHtml(name, val, max, right) {
  var w = (max > 0) ? Math.round(val / max * 100) : 0;
  return '<div class="mr-lb"><span class="t">' + escapeHtml(name) + '</span>' +
    '<span class="b"><i style="width:' + w + '%"></i></span>' +
    '<span class="v">' + escapeHtml(right) + '</span></div>';
}
/** [{名,件数,割合}] を横棒の並びに。 */
function mrTallyHtml(title, sub, rows) {
  var max = 0; rows.forEach(function (x) { max = Math.max(max, x['件数']); });
  var bars = rows.length
    ? rows.map(function (x) { return mrLbHtml(x['名'], x['件数'], max, x['件数'] + '件 ' + mrPct(x['割合'])); }).join('')

    '<div class="sub">' + sub + '</div>' + bars + '</div>';
}

function mirrorHtml(r) {
  var sc = r['範囲'] || {}, dare = r['だれ'] || {}, hen = dare['偏り'] || {};
  var scopeBtn = function (key, label) {
    return '<button class="cond ' + (App.an.mrScope === key ? 'on' : '') + '" onclick="anSetMrScope(\'' + key + '\')">' + label + '</button>';
  };

  /* --- ヘッダ(この面が何を写すのか) --- */
  var head =
    '<div class="apanel">' +
      '<h3>見取りの鏡 — 写すのは子どもではなく、私の見取り</h3>' +
      '<div class="mr-thesis">' +
        'ヒートマップ・抽出・相関が答えるのは<b>「この子はどうか」</b>。この面が答えるのは<b>「私の見取りはどうか」</b>です。<br>' +
        '協調的な行動ばかりが見取られ、獲得的な行動が見取られていないのではないか。' +
        'その原因は子どもではなく、<b>教師が持っている見取りの枠</b>のほうにあるのではないか。' +

        '<span class="anote" style="margin:0">' + escapeHtml(sc['クラス'] || '') +
        (App.an.mrScope === '単元' ? ' ・ ' + escapeHtml(sc['単元名'] || '') : ' ・ これまでの会をまとめて') +
        ' ・ 記録 ' + (sc['記録総数'] || 0) + '件 / ' + (sc['日数'] || 0) + '日分 / 対象 ' + (sc['対象人数'] || 0) + '人' +

  /* --- ③ 数えた／解釈した(§1 の二層を国語・道徳にも通す) --- */
  var ni = r['二層'] || {}, kaz = ni['数えた'] || { '件数': 0, '内訳': [] }, kai = ni['解釈した'] || { '件数': 0, '内訳': [] };

      '<div class="anote" style="margin:2px 0 0 104px">' + uchi(kaz['内訳']) + '</div>' +
      mrLbHtml('解釈した', kai['件数'], niMax, kai['件数'] + '件') +
      '<div class="anote" style="margin:2px 0 0 104px">' + uchi(kai['内訳']) + '</div>' +
      '<div class="kp-note" style="margin-top:12px">' +
        '解釈した記録ばかりなら、「そのタップの根拠は何か」と問われたときに答えるものがありません。' +
        '数えた記録ばかりなら、姿の意味が残りません。どちらが多いのが正解、ではありません。' +
      '</div>' +
    '</div>';

  /* --- ④ 協調／獲得(3モード横断) --- */
  return head + darePanel + wakuPanel + nisouPanel + mrMukiPanelHtml(r['むき'] || {});
}

/** 協調／獲得を3モード横断で。帯は共通部品(js_mitori_ui)を使い、学級会の振り返りと同じ物差しにする。 */
function mrMukiPanelHtml(muki) {
  var all = muki['全体']; if (!all) return '';
  var L = all['層'] || {}, act = L['行動'] || { '協調': 0, '獲得': 0 }, yos = L['よさ'] || { '協調': 0, '獲得': 0 };
  var modes = muki['モード別'] || [];

  // 凡例はマスタから作る(★コードにボタン名を書かない・CLAUDE.md)
  var names = { '協調': [], '獲得': [] };
  (all['ボタン別'] || []).forEach(function (b) { if (names[b['向き']]) names[b['向き']].push(b['ボタン']); });

  var modeBars = modes.map(function (m) {
    var ml = (m['結果'] || {})['層'] || {};
    return mkBarHtml(m['モード'] + '・行動', '数えた', ml['行動'] || { '協調': 0, '獲得': 0 }) +
      mkBarHtml(m['モード'] + '・よさ', '解釈した', ml['よさ'] || { '協調': 0, '獲得': 0 });
  }).join('');

  var btnRows = (all['ボタン別'] || []).map(function (x) {
    return '<tr><td style="text-align:left;padding:5px 10px">' + escapeHtml(x['ボタン']) + '</td>' +
      '<td>' + escapeHtml(x['層']) + '</td>' +
      '<td><span class="mkleg" style="margin:0"><i style="background:' + (x['向き'] === '協調' ? 'var(--teal-600)' : 'var(--orange-600)') + '"></i>' + escapeHtml(x['向き']) + '</span></td>' +
      '<td style="text-align:right;padding-right:10px">' + x['回数'] + '</td>' +
      '<td style="text-align:right;padding-right:10px">' + x['人数'] + '</td>' +
      '<td style="text-align:right;padding-right:10px">' + x['ゼロ人数'] + '</td></tr>';
  }).join('');
  var z = all['ゼロ'] || { '協調': [], '獲得': [], '両方': [] };
  function nameList(arr) { return arr.length ? arr.map(function (o) { return escapeHtml(o['表示名']); }).join('、') : 'なし'; }

  return '<div class="apanel">' +
    '<h3>④ 協調／獲得はどちらに寄っているか</h3>' +
    MK_WARN_HTML +
    '<div class="anote" style="margin:0 0 10px">' +
      '学級会の振り返り画面と同じ集計です。' +
      '<b>1回の会ではなく、この期間ぜんぶ</b>で見ます。枠の癖は1時間では見えません。' +
    '</div>' +
    '<div class="mkbal">' +
      mkBarHtml('行動の記録', '数えた(低推論)', act) +
      mkBarHtml('よさの記録', '解釈した(高推論)', yos) +
      (modes.length > 1 ? '<div class="sheet__label" style="margin-top:6px">モード別(枠の癖はモードで変わるか)</div>' + modeBars : '') +
    '</div>' +
    '<div class="mkleg" style="margin-top:8px">' +
      '<span><i style="background:var(--teal-600)"></i>協調寄り＝' + escapeHtml(names['協調'].join('・') || '—') + '</span>' +
      '<span><i style="background:var(--orange-600)"></i>獲得寄り＝' + escapeHtml(names['獲得'].join('・') || '—') + '</span>' +
    '</div>' +
    '<div class="kp-note" style="margin-top:10px">協調の割合：行動 ' + mkPct(act['協調割合']) + '／よさ ' + mkPct(yos['協調割合']) +
      '。層(数えたもの／解釈したもの)は混ぜていません。</div>' +
    '<div class="sheet__label" style="margin-top:14px">ボタンごと(対象 ' + all['対象人数'] + '人)</div>' +
    '<div class="hm-wrap"><table class="hm ltable">' +
      '<tr><th style="text-align:left;padding-left:10px">ボタン</th><th>層</th><th>向き</th><th>回数</th><th>押された人数</th><th>0回の人数</th></tr>' + btnRows +
    '</table></div>' +
    '<div class="sheet__label" style="margin-top:14px">押されなかったことも記録です</div>' +
    '<div class="mkzero">' +
      '<div>獲得寄りが<b>1回も</b>立たなかった子（' + z['獲得'].length + '人）：' + nameList(z['獲得']) + '</div>' +
      '<div>協調寄りが<b>1回も</b>立たなかった子（' + z['協調'].length + '人）：' + nameList(z['協調']) + '</div>' +
      '<div>どちらも<b>0回</b>だった子（' + z['両方'].length + '人）：' + nameList(z['両方']) + '</div>' +
    '</div>' +
    '<div class="kp-note" style="margin-top:8px">' + MK_ZERO_NOTE + '</div>' +
  '</div>';
}

/* ===== ヒートマップ ===== */
function renderHeatmap() {
  var body = document.getElementById('an-body');
  body.innerHTML = '<div class="apanel"><div class="anote">読み込み中…</div></div>';
  var opts = App.an.kanten ? { '観点': App.an.kanten } : {};
  callServer('getHeatmap', App.an.className, App.an.unitId, opts).then(function (m) {
    var syms = m['記号'];
    if (!m['行'].length || !m['列'].length) {
      body.innerHTML = '<div class="apanel"><h3>ヒートマップ</h3><div class="anote">データがありません(単元・在籍・記録を確認)。</div></div>'; return;
    }
    var head = '<tr><th class="name" style="cursor:default">児童 \\ 本時</th>' + m['列'].map(function (c) { return '<th>第' + c['第何時'] + '時</th>'; }).join('') + '</tr>';
    var rows = m['行'].map(function (r) {
      var cells = r['セル'].map(function (v) {
        var cls = v ? symCls(v, syms) : 'none';
        return '<td class="hm-cell ' + cls + '" title="' + escapeHtml(r['表示名']) + ': ' + (v || '─') + '">' + (v || '─') + '</td>';
      }).join('');
      return '<tr><td class="name" onclick="goStudent(\'' + r['児童ID'] + '\')">' + (r['番号'] || '') + ' ' + escapeHtml(r['表示名']) + '</td>' + cells + '</tr>';
    }).join('');
    body.innerHTML =
      '<div class="apanel"><h3>本時×児童(セルにカーソルで記録、名前クリックで児童別ページ)</h3>' +
        '<div class="hm-wrap"><table class="hm"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="anote">セル=' + syms.join('/') + '(色+記号)。─=未評価。列に△が並ぶ=全体への手立て、行に△が並ぶ=個への支援のサイン。</p>' +
      '</div>';
  }).catch(function (e) { body.innerHTML = '<div class="apanel"><div class="err">' + escapeHtml(e.message || e) + '</div></div>'; });
}

/* ===== 抽出リスト ===== */
function renderExtract() {
  var body = document.getElementById('an-body');
  App.an.cond = App.an.cond || { '未評価': true, '連続△': 2, '◎ゼロ観点': false, 'メモ0件': false };
  var c = App.an.cond;
  function cond(key, on, label) {
    return '<button class="cond ' + (on ? 'on' : '') + '" onclick="exToggle(\'' + key + '\')">' + label + '</button>';
  }
  body.innerHTML =
    '<div class="apanel"><h3>条件で自動抽出(複数ON可・条件は設定で調整)</h3>' +
      '<div class="conds">' +
        cond('未評価', c['未評価'], 'この単元で未評価') +
        cond('連続△', c['連続△'], '△が' + (c['連続△'] || 2) + '回以上連続') +
        cond('◎ゼロ観点', c['◎ゼロ観点'], '◎が一度もない観点がある') +
        cond('メモ0件', c['メモ0件'], 'メモが1件もない') +
      '</div>' +
      '<div id="ex-result"><div class="anote">抽出中…</div></div>' +
    '</div>';
  runExtract();
}
function exToggle(key) {
  if (key === '連続△') App.an.cond['連続△'] = App.an.cond['連続△'] ? 0 : 2;
  else App.an.cond[key] = !App.an.cond[key];
  renderExtract();
}
function runExtract() {
  var box = document.getElementById('ex-result');
  box.innerHTML = '<div class="anote">抽出中…</div>';
  callServer('getExtraction', App.an.className, App.an.unitId, App.an.cond).then(function (list) {
    if (!list.length) { box.innerHTML = '<div style="color:var(--teal-700);font-weight:800;padding:10px 0">該当なし</div>'; return; }
    box.innerHTML = '<div class="ex-list">' + list.map(function (x) {
      return '<div class="ex-row"><span class="nm" onclick="goStudent(\'' + x['児童ID'] + '\')">' + escapeHtml(x['表示名']) + '</span>' +
        '<span class="why">' + x['理由'].map(function (r) { return '<span>' + escapeHtml(r) + '</span>'; }).join('') + '</span>' +
        '<span class="go" onclick="goStudent(\'' + x['児童ID'] + '\')" style="cursor:pointer">児童別へ →</span></div>';
    }).join('') + '</div>';
  }).catch(function (e) { box.innerHTML = '<div class="err">' + escapeHtml(e.message || e) + '</div>'; });
}

/* ===== テスト相関(散布図) ===== */
function renderCorr() {
  var body = document.getElementById('an-body');
  body.innerHTML = '<div class="apanel"><div class="anote">読み込み中…</div></div>';
  callServer('getCorrelation', App.an.className, App.an.unitId).then(function (res) {
    var pts = res['点'];
    if (!pts.length) {
      body.innerHTML = '<div class="apanel"><h3>私の見取り × テスト(妥当性の点検)</h3><div class="anote">相関を出すには、授業中評価とテスト点数の両方が必要です。設定 → テスト入力から入力してください。</div></div>'; return;
    }
    var big = pts.filter(function (p) { return Math.abs(p['ずれ']) >= 0.25; });
    var legend = big.map(function (p) {
      // ★ずれは「この子の問題」ではなく、まず【私の見取り方】を疑うための材料(設計23 §5)。
      var msg = p['ずれ'] > 0 ? '授業で◎を多く付けたがテストは伸びない → 私は何を見て◎と判断したか' : 'テストは高いが授業は△ → 発言以外の見取り方法を私が持っていないのでは';
      return '<p><b>' + escapeHtml(p['表示名']) + '</b>: ' + msg + '</p>';
    }).join('');
    body.innerHTML =
      '<div class="apanel"><h3>私の見取り × テスト(妥当性の点検) — ' + escapeHtml(unitName()) + '</h3>' +
        '<div class="mr-thesis" style="margin-bottom:12px">ずれた子を見つける面ではありません。' +
        '<b>ずれは、私の見取りとテストのどちらかが、その子の学びを取りこぼしているという合図</b>です。' +
        'まず疑うのは子どもではなく私の見取り方(設計23)。</div>' +
        '<div class="scatter">' + scatterSvg(pts) +
          '<div class="sc-legend">' +
            '<p><span class="dot-demo"></span> 児童(クリックで児童別ページ)</p>' +
            '<p><span class="dot-demo dot-demo--hl"></span> <b>ずれが大きい子</b>(輪郭+名前で強調)</p>' +
            (legend || '<p>大きなずれのある子はいません。</p>') +
          '</div>' +
        '</div>' +
        '<p class="anote">横=授業中の形成的評価(◎=2 ○=1 △=0 の平均)、縦=テスト得点率。対角線から離れた子ほど、私の見取りとテストの言っていることが食い違っている。</p>' +
      '</div>';
  }).catch(function (e) { body.innerHTML = '<div class="apanel"><div class="err">' + escapeHtml(e.message || e) + '</div></div>'; });
}
function unitName() {
  var u = (App.an.boot['単元一覧'] || []).filter(function (x) { return x['単元ID'] === App.an.unitId; })[0];
  return u ? u['単元名'] : '';
}
function scatterSvg(pts) {
  var W = 560, H = 420, padL = 70, padR = 30, padT = 40, padB = 60;
  var w = W - padL - padR, h = H - padT - padB;
  function X(v) { return padL + (v / 2) * w; }          // 形成的スコアは 0〜2
  function Y(v) { return padT + (1 - v) * h; }          // テスト率 0〜1
  var grid = '<g stroke="#EAEFF4" stroke-width="1">';
  [0, 0.5, 1, 1.5, 2].forEach(function (gx) { grid += '<line x1="' + X(gx) + '" y1="' + Y(0) + '" x2="' + X(gx) + '" y2="' + Y(1) + '"/>'; });
  [0, 0.25, 0.5, 0.75, 1].forEach(function (gy) { grid += '<line x1="' + X(0) + '" y1="' + Y(gy) + '" x2="' + X(2) + '" y2="' + Y(gy) + '"/>'; });
  grid += '</g>';
  var axis = '<g fill="#525C68" font-size="12.5" font-family="inherit">' +
    '<text x="' + (padL + w / 2) + '" y="' + (H - 18) + '" text-anchor="middle">授業中評価スコア(◎=2 ○=1 △=0 の平均)→</text>' +
    '<text x="22" y="' + (padT + h / 2) + '" text-anchor="middle" transform="rotate(-90 22 ' + (padT + h / 2) + ')">テスト得点率 →</text>' +
    '<text x="' + (X(0) - 6) + '" y="' + (Y(0) + 4) + '" text-anchor="end">0%</text>' +
    '<text x="' + (X(0) - 6) + '" y="' + (Y(0.6) + 4) + '" text-anchor="end">60%</text>' +
    '<text x="' + (X(0) - 6) + '" y="' + (Y(1) + 4) + '" text-anchor="end">100%</text>' +
    '<text x="' + X(0) + '" y="' + (Y(0) + 20) + '" text-anchor="middle">0</text>' +
    '<text x="' + X(1) + '" y="' + (Y(0) + 20) + '" text-anchor="middle">1.0</text>' +
    '<text x="' + X(2) + '" y="' + (Y(0) + 20) + '" text-anchor="middle">2.0</text></g>';
  // 通常点(単一系列=アクセント青)。※SVG属性ではCSS変数が効かないため具体色。
  var normal = '<g fill="#2B6CB0" fill-opacity=".82">' + pts.filter(function (p) { return Math.abs(p['ずれ']) < 0.25; }).map(function (p) {
    return '<g class="pt" onclick="goStudent(\'' + p['児童ID'] + '\')"><circle cx="' + X(p['形成的'] * 2) + '" cy="' + Y(p['テスト率']) + '" r="5.5"/>' +
      '<title>' + escapeHtml(p['表示名']) + '</title></g>';
  }).join('') + '</g>';
  // ずれ大(白塗り+橙輪郭+名前・色覚対応)
  var outliers = '<g>' + pts.filter(function (p) { return Math.abs(p['ずれ']) >= 0.25; }).map(function (p) {
    var x = X(p['形成的'] * 2), y = Y(p['テスト率']);
    return '<g class="pt" onclick="goStudent(\'' + p['児童ID'] + '\')">' +
      '<circle cx="' + x + '" cy="' + y + '" r="7" fill="#FFFFFF" stroke="#DD6B20" stroke-width="3"/>' +
      '<text x="' + x + '" y="' + (y - 13) + '" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D21">' + escapeHtml(p['表示名']) + '</text>' +
      '<title>' + escapeHtml(p['表示名']) + '</title></g>';
  }).join('') + '</g>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="散布図: 横=授業中評価スコア、縦=テスト得点率">' +
    grid + axis + normal + outliers + '</svg>';
}

function renderStudentTab() {

  if (!p) {
    body.innerHTML = '<div class="apanel"><h3>児童別ページ</h3><div class="anote">ヒートマップや抽出リストで児童名をクリックすると、その子の記録を時系列で見られます。</div></div>';

        (hasTg ? '<div class="st-tsunagari" style="margin-top:6px">' +

          '</div>' : '') +
      '</div>'
    : '';
  var tests = (p['テスト'] || []).length ? '<table class="hm" style="width:auto"><tr><th class="name" style="position:static;cursor:default">単元</th><th>知識・技能</th><th>思考・判断・表現</th><th>実施日</th></tr>' +
    p['テスト'].map(function (t) {

    '</div>' +

    tokkatsuSection +

    '</div>' +

  // 道徳タブ相当(設計09 §3.6): エピソードと2視点の件数。棒グラフにはしない(多寡の競争にしない)。
}
// タイムラインHTML(フィルタ適用)。big=面談用に大きめ表示は CSS 側で。
function timelineHtml(p, syms, forMendan) {
  var items = (p['タイムライン'] || []).filter(function (r) {
    if (App.an.tlMemoOnly && !r['メモ']) return false;
    if (!App.an.tlOther && r['種別'] !== '評価') return false;
    return true;
  });
  if (!items.length) return '<div class="anote">該当する記録がありません</div>';
  return items.map(function (r) {
    var mark, cls = '', head;
    if (r['種別'] === '発言') { mark = mtIco('chat'); head = escapeHtml(r['文脈']) + ' ・ ' + escapeHtml(r['めあて']) + ' [' + escapeHtml(r['発言種類']) + ']'; }
    else if (r['種別'] === 'よさ') { mark = 'よさ'; head = escapeHtml(r['文脈']) + '(よさ: ' + escapeHtml(r['スタンプ']) + ')'; }
    else if (r['種別'] === '連携') {
      var sub = r['連携種別'] || '';
      // 印は種別ごと。意見(考えたこと)と立場(みんなの意見を見て決めたこと)は
      // 形成的評価でいちばん見たいので、ひと目で分かるようにする(docs/16 §7)。
      mark = /意見送信/.test(sub) ? mtIco('send') : /立場/.test(sub) ? mtIco('flag') : /意見/.test(sub) ? mtIco('chat')
        : /めあて/.test(sub) ? mtIco('target') : mtIco('chat');
      var extra = [];
      if (r['カテゴリ']) extra.push(escapeHtml(r['カテゴリ']));
      // 一言メモ: 振り返りの「めあて一言」、意見の見出し、立場の「話し合うこと」が入る。
      if (r['一言']) extra.push(escapeHtml(r['一言']));
      if (r['めあて']) extra.push('達成度: ' + escapeHtml(r['めあて']));
      head = escapeHtml(r['文脈']) + ' ・ ' + escapeHtml(sub) + (extra.length ? ' [' + extra.join(' / ') + ']' : '');
    }
    else { mark = escapeHtml(r['評価']); cls = symCls(r['評価'], syms); head = escapeHtml(r['文脈']) + ' ・ ' + escapeHtml(r['めあて']) + ' [' + escapeHtml(r['観点']) + ']'; }
    return '<div class="tl-item"><span class="tl-date">' + escapeHtml(String(r['日時']).slice(0, 16)) + '</span>' +
      '<span class="tl-sym ' + cls + '">' + mark + '</span>' +
      '<div><div class="tl-me">' + head + '</div>' +
      (r['メモ'] ? '<div class="tl-memo">' + mtIco('note') + ' ' + escapeHtml(r['メモ']) + '</div>' : '') + '</div></div>';
  }).join('');
}
function tlReset() { App.an.tlMemoOnly = false; App.an.tlOther = true; refreshTl(); }
function tlToggle(k) { if (k === 'memo') App.an.tlMemoOnly = !App.an.tlMemoOnly; else App.an.tlOther = !App.an.tlOther; refreshTl(); }
function refreshTl() { if (App.an.tab === 'student') renderStudentTab(); }

function fmtScore(pt, full) { if (pt == null) return '—'; return pt + (full ? ' / ' + full : ''); }
function copyDraft() {
  var ta = document.getElementById('shoken-draft'); if (!ta) return;
  ta.select();
  try { document.execCommand('copy'); alert('所見文の下書きをコピーしました'); } catch (e) { alert('コピーできませんでした。手動で選択してください。'); }
}

/* ===== 面談モード(全画面・他児童への切替UIなし §5) ===== */
function openMendan() {
  var p = App.an.studentData; if (!p) return;
  var syms = (App.an && App.an.boot['記号']) || ['◎', '○', '△'];
  // 面談は氏名(フルネーム)を出す。メモ中心の落ち着いた時系列。
  var old = document.getElementById('mendan'); if (old) old.remove();
  var body = (p['タイムライン'] || []).map(function (r) {
    var mark, cls = '', head;
    if (r['種別'] === 'よさ') { mark = 'よさ'; head = escapeHtml(r['文脈']) + '(よさ: ' + escapeHtml(r['スタンプ']) + ')'; }
    else if (r['種別'] === '発言') { mark = mtIco('chat'); head = escapeHtml(r['文脈']) + ' [' + escapeHtml(r['発言種類']) + ']'; }
    else if (r['種別'] === '連携') { mark = mtIco('flip'); head = escapeHtml(r['文脈']); }
    else { mark = escapeHtml(r['評価']); cls = symCls(r['評価'], syms); head = escapeHtml(r['文脈']) + ' [' + escapeHtml(r['観点']) + ']'; }
    return '<div class="tl-item"><span class="tl-date">' + escapeHtml(String(r['日時']).slice(0, 10)) + '</span>' +
      '<span class="tl-sym ' + cls + '">' + mark + '</span>' +
      '<div><div class="tl-me">' + head + '</div>' +
      (r['メモ'] ? '<div class="tl-memo">' + escapeHtml(r['メモ']) + '</div>' : '') + '</div></div>';
  }).join('');
  var m = el('<div class="mendan show" id="mendan">' +
    '<div class="mendan__bar">' +
      '<span class="mendan__name">' + escapeHtml(p['プロフィール']['氏名'] || p['プロフィール']['表示名']) + '</span>' +
      '<span class="mendan__tag">面談モード</span>' +

    '</div>' +
    '<div class="mendan__body"><div class="tl">' + body + '</div></div>' +
  '</div>');
  document.body.appendChild(m);
}
function closeMendan() { var m = document.getElementById('mendan'); if (m) m.remove(); }

/* ===== 印刷: 所見用整理シート(児童1人・A4縦。08 §10 / 印刷モック) ===== */
function printShoken() {
  var p = App.an.studentData; if (!p) return;
  var syms = (App.an && App.an.boot['記号']) || ['◎', '○', '△'];
  var prof = p['プロフィール'] || {};
  // 観点別のあゆみ(全体の◎○△ + 観点別テスト得点率平均)
  var testRatio = { '知': [], '思': [] };
  (p['テスト'] || []).forEach(function (t) {
    if (t['知技'] != null && t['知技満']) testRatio['知'].push(t['知技'] / t['知技満']);
    if (t['思判表'] != null && t['思判表満']) testRatio['思'].push(t['思判表'] / t['思判表満']);
  });
  function avgPct(arr) { if (!arr.length) return '—'; return Math.round(arr.reduce(function (a, b) { return a + b; }, 0) / arr.length * 100) + '%'; }
  var testByKanten = { '知識・技能': avgPct(testRatio['知']), '思考・判断・表現': avgPct(testRatio['思']), '主体的に取り組む態度': '—' };
  var kantenRows = Object.keys(p['所見']['観点別']).map(function (k) {
    var b = p['所見']['観点別'][k];
    var cell = (b['◎'] ? '<span class="sym-g">' + syms[0] + b['◎'] + '</span> ' : '') +
      (b['○'] ? '<span class="sym-o">' + syms[1] + b['○'] + '</span> ' : '') +
      (b['△'] ? '<span class="sym-n">' + syms[2] + b['△'] + '</span>' : '');
    return '<tr><td>' + escapeHtml(k) + '</td><td>' + (cell || '—') + '</td><td>' + (testByKanten[k] || '—') + '</td></tr>';
  }).join('') || '<tr><td colspan="3">記録なし</td></tr>';

  var epi = (p['所見']['◎エピソード'] || []).map(function (e) {
    return '<li><span class="d">' + escapeHtml(String(e['日時']).slice(0, 10)) + ' ' + escapeHtml(e['めあて'] || '') + '</span><span class="sym-g">' + syms[0] + '</span> ' + escapeHtml(e['メモ']) + '</li>';
  }).join('');
  var henyo = (p['所見']['△が続いた'] || []).length
    ? '<p class="quote">△が続いた場面: ' + p['所見']['△が続いた'].map(function (s) { return escapeHtml(s); }).join(' / ') + '</p>'
    : '<p class="quote">単元をまたいだ大きなつまずきの連続はありません。</p>';

  // 教科外(学級会・道徳): メモ付きの よさ/発言/連携
  var others = (p['タイムライン'] || []).filter(function (r) { return r['種別'] !== '評価' && r['メモ']; }).slice(0, 8).map(function (r) {
    var head = r['種別'] === 'よさ' ? ('★ ' + escapeHtml(r['スタンプ'] || '')) : r['種別'] === '発言' ? (mtIco('chat') + ' ' + escapeHtml(r['発言種類'] || '')) : mtIco('flip');
    return '<li><span class="d">' + escapeHtml(String(r['日時']).slice(0, 10)) + ' ' + escapeHtml(r['文脈'] || '') + '</span>' + head + ' — ' + escapeHtml(r['メモ']) + '</li>';
  }).join('');

  var paper =
    '<div class="paper">' +
      '<h1>所見用整理シート — ' + escapeHtml(prof['氏名'] || prof['表示名'] || '') + '(' + escapeHtml(prof['クラス'] || '') + ' ' + (prof['番号'] || '') + '番)</h1>' +
      '<div class="sub">出力日 ' + escapeHtml(todayISO()) + ' ・ ミトリの記録から自動整理(文章は先生が作成)</div>' +
      '<div class="sec"><h2>観点別のあゆみ</h2><table>' +
        '<tr><th>観点</th><th>◎○△の記録</th><th>テスト得点率(平均)</th></tr>' + kantenRows + '</table></div>' +
      '<div class="sec"><h2>具体エピソード(◎+メモの引用)</h2>' + (epi ? '<ul class="quote">' + epi + '</ul>' : '<p class="quote">◎+メモの記録なし</p>') + '</div>' +
      '<div class="sec"><h2>単元をまたいだ変容(自動抽出)</h2>' + henyo + '</div>' +
      '<div class="sec"><h2>教科外の姿(学級会・道徳)</h2>' + (others ? '<ul class="quote">' + others + '</ul>' : '<p class="quote">メモつきの記録なし</p>') + '</div>' +
      '<div class="sec"><h2>所見メモ(手書き・下書き用)</h2><div class="memo-box">(この欄に先生が所見の下書きを書く。ミトリは文章を自動生成しない)</div></div>' +
      printBrand() +
    '</div>';
  openPrintDesk([paper], renderStudentTabFromPrint, '所見用整理(A4縦)。⌘P で印刷、白黒でも読めます。');
}
// 印刷から児童別へ戻る(分析画面を再構築してから児童別タブを描画)
function renderStudentTabFromPrint() { App.screen = 'analytics'; renderAnalytics(); }

</script>

<script>
/* js_kaigi.html — 学級会モード(M4a)。設計05 §2/§3。
   ライブ見取り画面(コの字座席・発言ログ・よさスタンプ・段階)+ 話合いの振り返り。 */

function goKaigi() {
  App.screen = 'kaigi_home';
  setBodyMode('gk');
  callServer('getKaigiBoot', null).then(function (b) {
    App.kaigiBoot = b;
    if (App.screen !== 'kaigi_home') return;   // 読みこむあいだに別の画面へ進んだ(速い切りかえ)ときは上書きしない
    var st = b['はじめの設定'];
    if (st && !st['済']) { goHajime(st); return; }   // 学級か名簿がまだ → はじめの設定(docs/30 §2)

  }).catch(showBootError);

/* ===== 学級会ホーム =====
   他アプリとの連携はしない(2026-08 方針)。この画面ですることは2つだけ:
   ①いますぐ始める(または続きを見取る) ②過去の会の振り返りを開く。
   議題名・めあて・柱・決まったことは「あとから」書ける(ライブ画面/振り返り画面の ✎ から)。 */
function renderKaigiHome() {
  var b = App.kaigiBoot;

  var live = all.filter(function (g) { return g['状態'] !== '実施済'; })[0] || null;   // 実施日の新しい順の先頭
  var past = all.filter(function (g) { return g !== live; });

  var startPanel = live

        '<div class="kstart__note"><b>' + escapeHtml(gidaiLabel(live)) + '</b><br>会の途中です。人数や発言のカウントはそのまま続きます。</div>' +

    : '<div class="panel kstart">' +
        '<button class="btn btn--primary kstart__go" onclick="quickStartKaigi()">▶ いますぐ始める' + (b['次の回'] ? '(第' + b['次の回'] + '回)' : '') + '</button>' +
        '<div class="kstart__note">押すとすぐ見取り画面が開きます。<b>議題名・めあて・決まったことは後から</b>(画面上の ✎ から)書けます。</div>' +

  // ②過去の会

      '<div class="ucard__meta">' + escapeHtml(g['実施日'] || '') + ' ・ ' + escapeHtml(g['状態'] || '') +
        (g['めあて'] ? ' ・ ' + escapeHtml(g['めあて']) : '') + '</div>' +
      '<div class="row" style="margin-top:8px">' +
        '<button class="btn' + (done ? '' : ' btn--primary') + '" onclick="openKaigiReview(\'' + g['議題ID'] + '\')">振り返りを見る</button>' +
        '<button class="btn" onclick="goItte(\'' + g['議題ID'] + '\')">' + mtIco('seat') + ' つぎの一手</button>' +
        (done ? '' : '<button class="btn" onclick="startKaigi(\'' + g['議題ID'] + '\',\'' + escapeAttr(g['議題名']) + '\',true)">見取りを続ける</button>') +
      '</div></div>';
  }).join('');

  document.getElementById('app').innerHTML =
    '<div class="mode-line"></div>' +
    '<div class="home rise">' +
      '<div class="mhead">' + homePillHtml('goMaster()', '設定') +
        '<div class="mhead__title">学級会 ・ ' + escapeHtml(b['クラス']) + '</div></div>' +
      startPanel +
      (list ? '<div class="sheet__label" style="margin:18px 0 6px">これまでの会</div><div class="cards">' + list + '</div>'
            : '<div class="panel__lead" style="margin-top:18px">これまでの会はまだありません。</div>') +
      kenkyuPanelHtml(b) +

/* ===== 研究用モード(2026-09-09) =====
   他クラスの研究授業で学級会を見取るための面。
   ★名簿を使わない(仮の児童=1番〜n番)。他クラスの氏名を持たない。
   ★◎○△はつけない。記録だけを残して、A4の記録用紙で持ち帰る。 */

      (list ? '<div class="cards" style="margin-top:12px">' + list + '</div>' : '') +

/** 貼った文字を読んで(js_seatin の siReadText)、見取り図で見せる。 */
function kkPastePreview() {
  var t = document.getElementById('kk-paste'); if (!t) return;

  App._siFile = null;
  siShowResult();
}
/** 人数の −／＋。 */
function kkStep(d) {
  var e = document.getElementById('kk-n'); if (!e) return;
  var v = parseInt(e.value, 10) || 0;
  e.value = Math.max(1, Math.min(60, v + d));
  kkCount();
}
/** 始めるボタンに人数を出す(押す前に何人で始まるか読めるように)。 */
function kkCount() {
  var e = document.getElementById('kk-n'), b = document.getElementById('kk-go'); if (!e || !b || b.disabled) return;
  var v = parseInt(e.value, 10);
  b.textContent = (v >= 1 && v <= 60) ? v + '人で始める' : '人数を1〜60で';
}
/** 席の並び: 「前の会の並び」を選んだときだけ、どの会かを選ぶ欄を出す。 */
function kkSeatMode() {
  var r = document.querySelector('input[name="kk-seatmode"]:checked'), s = document.getElementById('kk-seat');
  if (s) s.hidden = !(r && r.value === 'prev');
}
function submitKenkyuStart(day) {
  function v(id) { var e = document.getElementById(id); return e ? String(e.value).trim() : ''; }
  var n = parseInt(v('kk-n'), 10);
  if (!(n >= 1 && n <= 60)) { alert('人数を1〜60で入れてください。'); return; }
  var mode = document.querySelector('input[name="kk-seatmode"]:checked');
  var from = (mode && mode.value === 'prev') ? v('kk-seat') : '';
  var paste = (App._seatIn && App._seatIn.n) ? App._seatIn : null;   // 座席表を入れた(写真・ファイル・貼り付け)
  if (paste && paste.errors.length && !confirm('席表に読めない行があります。\n' + paste.errors.join('\n') + '\n\n読めた行だけで始めますか？')) return;
  if (paste && paste.n > n) n = paste.n;
  var btn = document.getElementById('kk-go');
  if (btn) { btn.disabled = true; btn.textContent = '用意しています…'; }
  callServer('createKenkyuKaigi', { 'クラス名': v('kk-cls'), '人数': n, '議題名': v('kk-name'), '実施日': day, '座席の元': from,
      '呼び名': paste ? paste.names : null, '座席': paste ? paste.seats : null, '役割': paste ? paste.roles : null })
    .then(function (r) { closeOverlay(); startKenkyuKaigi(r['議題ID']); })
    .catch(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = n + '人で始める'; }
      alertErr(e);
    });
}
/** 研究用の会を開く。仮の児童で組み直すため、その議題IDでブートを取り直す。 */
function startKenkyuKaigi(gidaiId) {
  callServer('getKaigiBoot', null, gidaiId).then(function (b) {
    App.kaigiBoot = b;
    var g = (b['研究一覧'] || []).filter(function (x) { return x['議題ID'] === gidaiId; })[0] || {};
    startKaigi(gidaiId, g['議題名'] || '(未設定)', true);
  }).catch(alertErr);
}
function escapeAttr(s) { return String(s == null ? '' : s).replace(/'/g, '\\\''); }

/* 一覧に出す見出し。議題名が未入力でも「第n回 学級会」で識別できるようにする。 */
function gidaiLabel(g) {
  var kai = g['回'] ? '第' + g['回'] + '回' : '';
  var nm = (g['議題名'] && g['議題名'] !== '(未設定)') ? g['議題名'] : '';
  if (kai && nm) return kai + '「' + nm + '」';
  return nm || (kai ? kai + ' 学級会' : '学級会') + (nm ? '' : '(議題名なし)');
}

// 議題なしで即スタート: 見取り画面へ直行。サーバ側で議題名='(未設定)'・回=次の回・実施日=今日。
function quickStartKaigi() {
  callServer('createGidai', {}).then(function (r) {
    // ホーム一覧にも仮の議題を足しておく(戻ったときに見えるように)
    (App.kaigiBoot['議題一覧'] = App.kaigiBoot['議題一覧'] || []).unshift(
      { '議題ID': r['議題ID'], '回': App.kaigiBoot['次の回'] || '', '議題名': '(未設定)', '実施日': '', 'めあて': '', '柱1': '', '柱2': '', '柱3': '', '決まったこと': '', '状態': '実施中' });
    startKaigi(r['議題ID'], '(未設定)');
  }).catch(alertErr);
}

/* ===== 議題の内容(あとから入力) =====
   議題名・めあて・柱・決まったことを1枚のシートでまとめて書く。会の前でも最中でも後でもよい。
   空のままでも会は成立する(ライブ優先・設計05 §108)。 */
function gidaiInfoOf(gidaiId) {
  var R = App._kaigiReview;
  if (R && R.gidaiId === gidaiId && R.data && R.data['議題']) return R.data['議題'];
  var list = (App.kaigiBoot && App.kaigiBoot['議題一覧']) || [];
  return list.filter(function (g) { return g['議題ID'] === gidaiId; })[0] || {};
}
function openGidaiSheet(gidaiId) {
  var g = gidaiInfoOf(gidaiId) || {};
  var nm = (g['議題名'] && g['議題名'] !== '(未設定)') ? g['議題名'] : '';
  function fld(id, label, val, ph, wide) {
    return '<div style="margin-bottom:10px' + (wide ? '' : ';flex:1;min-width:180px') + '">' +
      '<label class="sheet__label" for="' + id + '">' + label + '</label>' +
      '<input id="' + id + '" value="' + escapeHtml(val || '') + '" placeholder="' + escapeHtml(ph) + '" style="width:100%;box-sizing:border-box">' +
    '</div>';
  }
  var html = '<div class="overlay" id="overlay" onclick="if(event.target===this)closeOverlay()"><div class="sheet">' +
    '<button class="btn sheet__close" onclick="closeOverlay()">閉じる</button>' +
    '<div class="sheet__title">議題の内容 <span style="font-weight:600;font-size:14px;color:var(--ink-sub)">(あとからでOK・空欄のままでもOK)</span></div>' +
    fld('gs-name', '議題名', nm, '例: お楽しみ会の内容を決めよう', true) +
    fld('gs-meate', 'めあて', g['めあて'], '例: 全員が納得して決める', true) +
    '<div class="row" style="align-items:flex-start">' +
      fld('gs-h1', '柱1', g['柱1'], '例: 何をするか') +
      fld('gs-h2', '柱2', g['柱2'], '例: 役割分担') +
      fld('gs-h3', '柱3', g['柱3'], '(任意)') +
    '</div>' +
    '<label class="sheet__label" for="gs-kimatta">決まったこと</label>' +
    '<textarea class="memo-input" id="gs-kimatta" placeholder="会で決まったことを1〜3行で">' + escapeHtml(g['決まったこと'] || '') + '</textarea>' +
    '<div class="row" style="justify-content:flex-end;margin-top:10px">' +
      '<button class="btn" onclick="closeOverlay()">やめる</button>' +
      '<button class="btn btn--primary" onclick="saveGidaiSheet(\'' + gidaiId + '\')">保存</button></div>' +
    '</div></div>';
  document.body.appendChild(el(html));
  var f = document.getElementById('gs-name'); if (f) f.focus();
}
function saveGidaiSheet(gidaiId) {
  function v(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
  var info = { '議題名': v('gs-name'), 'めあて': v('gs-meate'), '柱1': v('gs-h1'), '柱2': v('gs-h2'), '柱3': v('gs-h3'), '決まったこと': v('gs-kimatta') };
  var shown = info['議題名'] || '(未設定)';
  // 楽観的にローカルへ反映(保存は非同期・失敗したら知らせる)
  var g = ((App.kaigiBoot && App.kaigiBoot['議題一覧']) || []).filter(function (x) { return x['議題ID'] === gidaiId; })[0];
  if (g) { Object.keys(info).forEach(function (k) { g[k] = info[k]; }); g['議題名'] = shown; }
  var R = App._kaigiReview;
  if (R && R.gidaiId === gidaiId && R.data && R.data['議題']) {
    Object.keys(info).forEach(function (k) { R.data['議題'][k] = info[k]; });
    R.data['議題']['議題名'] = shown;
  }
  if (App.kaigi && App.kaigi.議題ID === gidaiId) App.kaigi.議題名 = shown;
  closeOverlay();
  callServer('saveGidaiInfo', gidaiId, info).catch(alertErr);
  // 画面を書き直す(ライブは見取りを止めないようヘッダーだけ・振り返りは内容欄だけ)
  if (App.screen === 'kaigi_live') refreshKaigiHead();
  else if (App.screen === 'kaigi_review' && R) paintGidaiInfo(R.data['議題'] || {});
}
/* ライブ画面のヘッダー(議題名・柱タグ)だけを描き直す。見取りの状態には触らない。 */
function refreshKaigiHead() {
  var K = App.kaigi; if (!K) return;
  var g = gidaiInfoOf(K.議題ID) || {};
  var btn = document.getElementById('kaigi-name-btn');
  if (btn) btn.innerHTML = escapeHtml(K.議題名 || '(未設定)') + ' <span style="font-size:12px">✎</span>';
  K.pillars = ['柱1', '柱2', '柱3'].map(function (k) { return normPillar(g[k]); }).filter(Boolean);
  var tag = document.getElementById('kaigi-pillar');
  if (tag) { tag.innerHTML = K.pillars.length ? '柱1: ' + escapeHtml(K.pillars[0]) : ''; tag.hidden = !K.pillars.length; }
}

/* ===== 学級会ライブ画面 =====
   resume=true: 途中の会に戻る(発言数・よさ数・欠席・段階・役割をサーバから復元)。 */
function startKaigi(gidaiId, gidaiName, resume) {
  App.screen = 'kaigi_live';
  setBodyMode('gk');
  var b = App.kaigiBoot;
  var childTypes = (b['発言種類'] || []).filter(function (t) { return t['種別'] !== '教師'; });
  App.kaigi = {
    議題ID: gidaiId, 議題名: gidaiName || '', stage: (b['段階'] || [])[0],
    tool: { kind: null, value: '' },   // 開始時は道具なし=実況バーが「種類をえらんで」と案内(設計19 §3.1)
    _childTypes: childTypes,
    students: b['児童'], roles: {}, count: {}, yosaCount: {}, flow: [],
    teacherOn: !!b['教師ログ'], absent: {},
    sel: null, selItem: null, draft: { speech: '', yosa: '', stamp: '' },
    taisetsu: '', editSeats: false, seatsDirty: false,
    pos: null, gridType: null,                      // 席(升目の自由配置・docs/29)。renderHall が保存から組む
    pickShikai: false, setup: null,                 // 司会グループを選ぶ / 会のはじめの段取り('seats'=席を作る)
    flip: (b['向き'] === '先生から'),
    links: [], showLinks: false, linking: null,   // つながり(🔗の道具で残す「だれに向けて」)
    tab: 'flow', lastRec: null,                    // 右パネルのタブ / 直前の記録(取り消し用・設計19)
    teacherPalette: false,                          // 先生ミニパレット(「先生 ▾」で開く・20 §7.3)
  };
  // ★司会グループは自動で選ばない(既定6人・番号の若い順はやめた・docs/29 §3)。
  //   続きからはサーバの役割を戻す。新しく始めるときは beginKaigiSetup で席をタップして選ぶ。
  var hasSeats = !!((b['座席'] || {})['形']);
  App.kaigi.pos = kgFromSaved(App.kaigi.students, b['座席'], []);
  if (!hasSeats) { App.kaigi.gridType = 'コの字'; App.kaigi.layoutAuto = true; }   // 型のまま=司会を選ぶと黒板の前へ配り直す
  renderKaigiLive();
  if (resume) {
    // 続きから: 画面はもう出ているので、届いた分だけ静かに上書きする(待たせない)
    callServer('getGidaiDetail', gidaiId).then(function (d) {
      var K = App.kaigi; if (!K || K.議題ID !== gidaiId) return;
      K.count = d['発言数'] || {};
      K.yosaCount = d['よさ数'] || {};
      K.absent = {}; (d['欠席児童ID'] || []).forEach(function (id) { K.absent[id] = true; });
      if (d['教師振り返り'] != null) { K.taisetsu = d['教師振り返り']; K._taisetsuSaved = K.taisetsu; }
      if (d['段階']) K.stage = d['段階'];
      if ((d['役割'] || []).length) { K.roles = {}; d['役割'].forEach(function (r) { K.roles[r['児童ID']] = r['役割']; }); }
      K.flow = d['流れ'] || [];
      K.links = [];
      [['つながり', 'speech'], ['よさつながり', 'yosa']].forEach(function (kv) {
        (d[kv[0]] || []).forEach(function (e) { var n = e.count || 1; for (var i = 0; i < n; i++) K.links.push({ from: e.from, to: e.to, mode: kv[1] }); });
      });
      // 席を保存していない会は、司会グループを黒板の前にして型から組み直す(保存してあれば保存の並びのまま)
      if (!hasSeats) K.pos = kgTemplate(K.gridType || 'コの字', kaigiIds(K), shikaiIdsOf(K));
      renderStageBtns(); renderHall(); renderKFlow(); renderKPanel();
      // ★研究用の会は作った直後も「続きから」で開く。まだ何も記録が無く、司会も決まっていなければ、はじめの段取りへ
      if (!K.flow.length && !shikaiIdsOf(K).length) beginKaigiSetup(hasSeats);
    }).catch(function () {});
  } else {
    beginKaigiSetup(hasSeats);
  }
}
/** 会のはじめ(docs/29 §1): 席が無ければ ①席を作る(型→ドラッグ→保存) → ②司会グループを選ぶ。あれば②だけ。 */
function beginKaigiSetup(hasSeats) {
  var K = App.kaigi; if (!K) return;
  if (hasSeats) { startPickShikai(); return; }
  K.setup = 'seats'; K.editSeats = true; K.seatsDirty = true; K.sel = null;
  renderHall(); renderSide(); renderToolRows(); renderNowBar();
}

          '<div class="tabbody" id="kpanel"></div>' +
          // 保存はスクロールの外に固定。書いたあと必ず目に入る場所に置く(20 §8.1)
          '<div class="sidefoot" id="sideFoot"></div>' +

      '</div>' +
      // ④ 道具バー = 押す頻度で上下2段(見取り設計書 v1.0 §5)
      //    上段=よく押す(大きく) / 下段=残り(小さく)。どちらの段に置くかはマスタの『段』列で決まる。
      //    優先するのは見た目の整合ではなく押しやすさ(先生は45分間、司会と板書も見ている)。
      // ★2026-10-22 先生「もはや不要」: 機能・よさは会のあとの会話分析で付ける(docs/30 §8.9)。会の最中の道具バーは出さない
      '<div class="tools" hidden>' +
        '<div class="trow trow--big" id="toolrow1"></div>' +

          '<span id="gLower" class="yosa-wrap"></span>' +
          '<span class="spacer"></span>' +
          '<button class="aux' + (K.showLinks ? ' on' : '') + '" id="btnLinks" title="席をタップした子の、つないだ／つながれた線だけを出します(学級全体のつながり図は振り返り画面)" onclick="toggleLinkLines()">' + mtIco('link') + ' この子のつながり ' + (K.showLinks ? 'ON' : 'OFF') + '</button>' +
          '<button class="aux" onclick="openKatari()">' + mtIco('chat') + ' 終わりの話メモ</button>' +
        '</div>' +

      '<div class="footbar" id="taisetsu-bar"></div>' +
    '</div>' +
    '<div id="queue-badge" class="queue-badge hidden"></div>';
  setSideWidth(Number(b['パネル幅']) || 0, false);   // 前に決めた幅(0=既定)
  renderStageBtns(); renderHall(); renderToolRows(); renderNowBar(); renderLastRec(); renderSide(); renderTaisetsuBar();
  observeHall();
  // ★採寸は「全部を描き終えてから」もう一度(renderHall の中の1回目は道具バーがまだ空)
  fitHall(); requestAnimationFrame(function () { if (App.screen === 'kaigi_live') fitHall(); });
  startKaigiTimer();
  renderQueueBadge();
}
/* ===== 右パネルの幅(つまみでドラッグ・←→キー・ダブルクリックで既定) ===== */
var SIDE_W = { min: 260, maxRatio: 0.55 };   // 狭すぎると書けない／広すぎると席が押せない
function setSideWidth(px, save) {
  var side = document.getElementById('kside'); if (!side) return;
  if (!px) side.style.flexBasis = '';                     // 既定(css の clamp)
  else {
    var max = Math.floor(window.innerWidth * SIDE_W.maxRatio);
    px = Math.max(SIDE_W.min, Math.min(max, Math.round(px)));
    side.style.flexBasis = px + 'px';
  }
  if (save) {
    if (App.kaigiBoot) App.kaigiBoot['パネル幅'] = px || '';
    callServer('saveSetting', '学級会_パネル幅', px ? String(px) : '').catch(function () {});
  }
  scheduleFitHall();
}
function sideGripStart(ev) {
  var side = document.getElementById('kside'); if (!side) return;
  ev.preventDefault();
  var x0 = ev.clientX, w0 = side.getBoundingClientRect().width, last = w0;
  var grip = document.getElementById('side-grip'); if (grip) grip.classList.add('on');
  function move(e) { last = w0 + (x0 - e.clientX); setSideWidth(last, false); fitHall(); }
  function up() {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
    if (grip) grip.classList.remove('on');
    setSideWidth(document.getElementById('kside').getBoundingClientRect().width, true);
  }
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
}
function sideGripKey(ev) {
  var side = document.getElementById('kside'); if (!side) return;
  var d = ev.key === 'ArrowLeft' ? 30 : ev.key === 'ArrowRight' ? -30 : 0; if (!d) return;
  ev.preventDefault();
  setSideWidth(side.getBoundingClientRect().width + d, true);
}
// 柱の値を正規化(空/未設定を落とす)
function normPillar(v) { var s = (v == null ? '' : String(v)).trim(); return s; }
