<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">

<script>
/* 体験版のしかけ（作品棚）。どこにも つながず、この ページの 中の 作り物の データで 動かす。 */
(function () {
  var last = 0;
  function note(msg) {
    var now = Date.now(); if (now - last < 6000) return; last = now;
    function show() {
      var d = document.createElement('div');
      d.textContent = msg;
      d.setAttribute('role', 'status');
      d.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:2147483000;background:#fff;color:#1d1d1f;border:1px solid #c9ced6;border-radius:12px;padding:8px 14px;font:14px/1.5 -apple-system,"Hiragino Sans",sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:92vw;text-align:center;pointer-events:none';
      document.body.appendChild(d);
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 3500);
    }
    if (document.readyState === 'complete') show(); else window.addEventListener('load', function () { setTimeout(show, 300); });
  }
  window.__DEMO_NOTE = note;
  var realOpen = window.open;
  window.open = function (u) { var s = String(u || ''); if (/^https?:/i.test(s) && s.indexOf(location.origin) !== 0) { note('体験版なので、ほかのページは開きません'); return null; } return realOpen.apply(window, arguments); };
  var realFetch = window.fetch;
  if (realFetch) window.fetch = function (u) { var s = String((u && u.url) || u || ''); if (/^https?:/i.test(s) && s.indexOf(location.origin) !== 0) return Promise.reject(new TypeError('体験版なので外へはつなぎません')); return realFetch.apply(this, arguments); };
  // 子どもの画面と先生の画面を切りかえる小さなボタン（#teacher で先生）
  var SW = null;
  if (SW) document.addEventListener('DOMContentLoaded', function () {
    var te = location.hash === '#teacher', b = document.createElement('button');
    b.type = 'button'; b.textContent = te ? '子どもの画面へ' : '先生の画面へ';
    b.setAttribute('aria-label', '体験版：' + b.textContent + '切りかえる');
    b.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:2147483000;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #9aa3ad;background:#fff;color:#1d1d1f;font:600 14px -apple-system,"Hiragino Sans",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer';
    b.onclick = function () { location.hash = te ? '' : '#teacher'; location.reload(); };
    document.body.appendChild(b);
  });
  note('体験版です。どこにも送りません');
})();

</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 学習指導要領（国語）を引く画面。データは下の dy-data 1か所。GAS に入れるときは、ここをスプレッドシートから読む形に差しかえる。
   授業メイトとのつなぎ：#82102D3231400000 のようにコードを付けて開くと、その項目を出す。選んだ項目は postMessage でも渡す。 */
:root{color-scheme:light;--dy-ink:#22252a;--dy-sub:#4a5260;--dy-line:#d6dbe2;--dy-soft:#f5f7fa;--dy-blue:#1a4fa0;--dy-blue2:#e8eef8;--dy-ok:#166b34;
 --dy-g:"BIZ UDPGothic","BIZ UDPゴシック","BIZ UDGothic","BIZ UDゴシック","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
html,body{height:100%;margin:0}body{background:#fff;color:var(--dy-ink);font-family:var(--dy-g);font-size:16px;letter-spacing:.03em;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}[hidden]{display:none!important}
button,input{font:inherit;color:var(--dy-ink)}input{background:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--dy-blue);outline-offset:2px}
#dy-app{height:100%;display:flex;flex-direction:column;gap:6px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
#dy-app button{min-height:44px;min-width:44px;border:1px solid #9aa3ad;border-radius:8px;background:#fff;padding:6px 12px;cursor:pointer;white-space:nowrap}
#dy-app button[aria-pressed=true]{background:var(--dy-blue2);border-color:var(--dy-blue);color:var(--dy-blue);font-weight:700}
#dy-app button.dy-main{background:var(--dy-blue);border-color:var(--dy-blue);color:#fff;font-weight:700}
#dy-app button:disabled{opacity:.45;cursor:default}
/* 上：名前・学年・系統・さがす */
.dy-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dy-head h1{margin:0 6px 0 0;font-size:20px;font-weight:700;white-space:nowrap}
.dy-seg{display:flex;border:1px solid #9aa3ad;border-radius:8px;overflow:hidden}
#dy-app .dy-seg button{border:0;border-radius:0;border-right:1px solid var(--dy-line);padding:6px 10px}#dy-app .dy-seg button:last-child{border-right:0}
.dy-sp{flex:1}
.dy-find{flex:none;display:flex;align-items:center;gap:4px;border:1px solid #9aa3ad;border-radius:8px;padding:0 4px 0 10px;min-height:44px;width:100%}
.dy-find input{border:0;outline:0;flex:1;min-width:0;min-height:40px;font-size:15px}
#dy-app .dy-find button{border:0;min-width:40px;padding:0;color:var(--dy-sub)}
.dy-ic{width:20px;height:20px;flex:none;vertical-align:-4px}
/* 中：左に領域、右に事項 */
.dy-body{flex:1;min-height:0;display:flex;gap:10px}
.dy-side{flex:0 0 220px;min-height:0;display:flex;flex-direction:column;gap:6px}
.dy-nav{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.dy-nav h2{margin:6px 0 2px;font-size:15px;color:var(--dy-sub);font-weight:700}
#dy-app .dy-nav button{flex:none;text-align:left;border-color:transparent;white-space:normal;line-height:1.3;padding:6px 10px}
#dy-app .dy-nav button[aria-pressed=true]{border-color:var(--dy-blue)}
.dy-pane{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--dy-line);border-radius:8px;overflow:hidden}
.dy-ttl{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-bottom:1px solid var(--dy-line);background:var(--dy-soft)}
.dy-ttl b{font-size:18px}.dy-ttl span{font-size:15px;color:var(--dy-sub)}
.dy-list{flex:1;min-height:0;overflow:auto}
.dy-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.dy-cols>*{min-width:0;border-right:1px solid var(--dy-line)}.dy-cols>*:nth-child(3n){border-right:0}
#dy-app .dy-cols .dy-it{height:100%}
.dy-cols .dy-sub,.dy-cols .dy-goal{grid-column:span 1}.dy-cols .dy-subrow{grid-column:1/-1;border-right:0}
.dy-empty{border-bottom:1px solid var(--dy-line);background:var(--dy-soft)}
.dy-colh{position:sticky;top:0;z-index:1;background:#fff;padding:6px 12px;font-weight:700;font-size:16px;border-bottom:1px solid var(--dy-line)}
.dy-colh.now{color:var(--dy-blue)}
.dy-sub{padding:8px 12px 2px;font-size:15px;color:var(--dy-sub);font-weight:700}
/* 1つの項目：押すと選ぶ（✓が付く） */
#dy-app .dy-it{display:grid;min-height:44px;border-radius:0;white-space:normal;grid-template-columns:28px 1fr 24px;gap:6px;align-items:start;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--dy-line);padding:10px 12px;cursor:pointer;line-height:1.75;font-size:16px;color:var(--dy-ink)}
#dy-app .dy-it:hover{background:var(--dy-soft)}
.dy-it .k{font-weight:700;color:var(--dy-blue);padding-top:1px}
.dy-it .ck{width:22px;height:22px;border:2px solid #9aa3ad;border-radius:4px;margin-top:2px;display:flex;align-items:center;justify-content:center}
#dy-app .dy-it[aria-pressed=true]{background:var(--dy-blue2);font-weight:400;color:var(--dy-ink)}
.dy-it[aria-pressed=true] .ck{background:var(--dy-blue);border-color:var(--dy-blue)}
.dy-it[aria-pressed=true] .ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);margin-top:-3px}
.dy-it.hit{outline:3px solid #b8860b;outline-offset:-3px}
.dy-it .w{font-size:15px;color:var(--dy-sub);display:block}
.dy-it ol{margin:4px 0 0;padding-left:0;list-style:none}.dy-it li{font-size:14px}
.dy-act .dy-it{color:#3b4250}
.dy-goal{padding:10px 12px;border-bottom:1px solid var(--dy-line);line-height:1.8}
.dy-goal p{margin:0 0 6px}
/* 指導事項の下：扱う単元（光村） */
.dy-it .u{display:block;font-size:15px;color:var(--dy-sub);margin-top:2px;line-height:1.6}
/* 単元から：左に単元の一覧、右にその単元で目指すこと */
#dy-app .dy-nav .dy-un{display:block;border:1px solid #9aa3ad;margin-bottom:4px;padding:6px 10px}#dy-app .dy-nav .dy-un:hover{background:var(--dy-soft)}#dy-app .dy-nav .dy-un[aria-pressed=true]{border:2px solid var(--dy-blue);padding:5px 9px}.dy-un small{display:block;font-size:14px;color:var(--dy-sub)}
.dy-unit{padding:8px 12px;border-bottom:1px solid var(--dy-line);font-size:17px;font-weight:700;line-height:1.6}
.dy-unit small{display:block;font-weight:400;font-size:14px;color:var(--dy-sub)}
.dy-mk{display:inline-block;min-width:4.2em;font-weight:700;font-size:15px;color:var(--dy-sub)}
.dy-mk.on{color:var(--dy-blue)}
#dy-app .dy-aim{grid-template-columns:4.8em 1fr 24px}.dy-aim .t{display:block}.dy-aim .w{font-size:15px;color:var(--dy-sub)}
.dy-aim.main .t{font-weight:700}
.dy-go{color:var(--dy-sub);font-size:18px;padding-top:2px}
.dy-li{padding:10px 12px;border-bottom:1px solid var(--dy-line);line-height:1.75}
/* 目指す力の印：字＋枠。◎重点は塗り、○は線だけ（色だけで伝えない） */
:root{--dy-A:#9a4310;--dy-B:#17653a;--dy-C:#1a4fa0;--dy-K:#6a3d9a}
.dy-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.dy-tag{display:inline-flex;align-items:center;gap:1px;border:1.5px solid currentColor;border-radius:6px;padding:0 6px;font-size:14px;line-height:22px;font-weight:700;background:#fff}
.dy-tag.A{color:var(--dy-A)}.dy-tag.B{color:var(--dy-B)}.dy-tag.C{color:var(--dy-C)}.dy-tag.K{color:var(--dy-K)}
.dy-tag.on.A{background:var(--dy-A);border-color:var(--dy-A);color:#fff}.dy-tag.on.B{background:var(--dy-B);border-color:var(--dy-B);color:#fff}
.dy-tag.on.C{background:var(--dy-C);border-color:var(--dy-C);color:#fff}.dy-tag.on.K{background:var(--dy-K);border-color:var(--dy-K);color:#fff}
.dy-un .h{font-size:14px;color:var(--dy-sub);font-weight:400;margin-left:4px;white-space:nowrap}
/* 1年の地図：よこに月、たてに領域。学期で切りかえ */
.dy-mapbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dy-legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--dy-sub)}
.dy-map{display:grid;min-width:0;grid-template-columns:repeat(var(--dy-n),minmax(0,1fr));grid-template-rows:auto 1fr;grid-auto-flow:column}
.dy-map>*{border-right:1px solid var(--dy-line);border-bottom:1px solid var(--dy-line);min-width:0;padding:6px}
.dy-mh{font-weight:700;text-align:center;background:var(--dy-soft);padding:6px}
.dy-rh{font-weight:700;display:flex;flex-direction:column;justify-content:center;gap:2px;background:var(--dy-soft)}
.dy-rh small{font-size:14px;font-weight:400;color:var(--dy-sub)}
.dy-cell{display:flex;flex-direction:column;gap:4px}
#dy-app .dy-chip{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;width:100%;min-height:44px;padding:3px 8px;border:1px solid #9aa3ad;border-radius:8px;background:#fff;white-space:normal;text-align:left;line-height:1.35;font-size:15px;color:var(--dy-ink)}
#dy-app .dy-chip:hover{background:var(--dy-soft)}
.dy-chip .h{font-size:14px;color:var(--dy-sub);margin-left:4px;white-space:nowrap}
.dy-chip .dy-tags{margin-top:0;flex-wrap:nowrap}
.dy-map{position:relative}.dy-mh{position:sticky;top:0;z-index:1}
:root{--dy-new:#8a4b00;--dy-new2:#fff3df;--dy-ins:#fff0a8}
/* 前回とくらべる：左に前回、右にいま */
.dy-cmpg{display:grid;grid-template-columns:1fr 1fr}
.dy-cmpg>div{min-width:0;padding:8px 12px;border-bottom:1px solid var(--dy-line);line-height:1.75}
.dy-cmpg>div:nth-child(odd){border-right:1px solid var(--dy-line)}
.dy-cmpg .dy-colh2{position:sticky;top:0;z-index:1;background:#fff;font-weight:700;line-height:1.5}
.dy-cmpg .dy-note{grid-column:1/-1;border-right:0!important;background:var(--dy-soft);font-size:15px;line-height:1.6}
.dy-cmpg .dy-sub{grid-column:1/-1;border-right:0!important}
.dy-cmpg .k{font-weight:700;color:var(--dy-blue);margin-right:6px}
.dy-x{color:var(--dy-sub);font-size:15px}
.dy-flag{display:inline-block;font-size:14px;font-weight:700;border:1.5px solid var(--dy-new);color:var(--dy-new);background:var(--dy-new2);border-radius:6px;padding:0 6px;margin-right:6px;line-height:22px}
del{text-decoration:line-through 2px;color:#5d636c}
ins{text-decoration:underline 2px;text-underline-offset:3px;background:var(--dy-ins)}
/* 歩み：年を横、柱を縦の帯に。帯が切れた所が変わった所 */
.dy-fig{padding:10px 12px;overflow-x:auto}
.dy-fg{display:grid;grid-template-columns:76px repeat(var(--dy-n),minmax(62px,1fr));gap:6px 3px;min-width:740px;align-items:stretch}
.dy-fg .yh{font-weight:700;text-align:center;font-size:15px;line-height:1.3;padding-bottom:2px;border-bottom:2px solid var(--dy-line)}
.dy-fg .yh small{display:block;font-size:14px;font-weight:400;color:var(--dy-sub)}
.dy-fg .yh.now{color:var(--dy-blue);border-color:var(--dy-blue)}.dy-fg .yh.next{color:var(--dy-new);border-color:var(--dy-new)}
.dy-fg .ln{font-weight:700;font-size:15px;display:flex;align-items:center}
#dy-app .dy-fg .sg{min-height:52px;white-space:normal;line-height:1.35;font-size:14px;padding:4px 6px;border-radius:6px;border:1px solid #8fa6c8;background:var(--dy-blue2);color:var(--dy-ink);text-align:center}
#dy-app .dy-fg .sg.nx{border:2px dashed var(--dy-new);background:#fff}
#dy-app .dy-fg .sg.em{border:1px dashed var(--dy-line);background:#fff;color:var(--dy-sub)}
#dy-app .dy-fg .sg.nm{background:#fff;border-color:var(--dy-ink);font-weight:700}
.dy-fgk{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--dy-sub);margin-top:10px}
.dy-fgk i{display:inline-block;width:22px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid #8fa6c8;background:var(--dy-blue2)}
.dy-fgk i.nx{border:2px dashed var(--dy-new);background:#fff}
.dy-y{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:10px 12px;border-bottom:1px solid var(--dy-line)}
.dy-y.now{background:var(--dy-blue2)}.dy-y.hl{outline:3px solid #b8860b;outline-offset:-3px}
.dy-y .yy{font-size:22px;font-weight:700;line-height:1.2}.dy-y .yy small{display:block;font-size:14px;font-weight:400;color:var(--dy-sub)}
.dy-y h3{margin:0;font-size:17px}.dy-y ul{margin:4px 0 0;padding-left:1.2em}
.dy-chips2{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.dy-chips2 span{font-size:14px;border:1px solid var(--dy-line);border-radius:4px;padding:0 6px;background:#fff}
.dy-y a,.dy-nx a{color:var(--dy-blue);font-size:14px}
.dy-nx{padding:8px 12px;border-bottom:1px solid var(--dy-line);line-height:1.7}.dy-nx .d{font-size:14px;color:var(--dy-sub)}
.dy-lead{padding:10px 12px;border-bottom:1px solid var(--dy-line);background:var(--dy-soft);line-height:1.7}
.dy-steps{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--dy-line)}
.dy-steps span{font-size:14px;border:1px solid var(--dy-line);border-radius:6px;padding:4px 8px;background:#fff}.dy-steps span.now{border:2px solid var(--dy-new);font-weight:700}
.dy-sp2{flex:1}
.dy-empty2{color:var(--dy-sub);font-size:14px;text-align:center;padding-top:10px}
mark{background:#fff0a8;color:inherit}
.dy-none{padding:16px;color:var(--dy-sub)}
/* 下：選んだもの */
.dy-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:48px}
.dy-picked{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--dy-sub);font-size:14px}
.dy-src{font-size:14px;color:var(--dy-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dy-toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--dy-ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:15px}
/* せまい画面（iPhone・たて）：左の領域は上の横ならびに */
@media (max-width:760px){
 .dy-body{flex-direction:column}
 .dy-seg{overflow-x:auto;max-width:100%}#dy-app .dy-seg button{flex:none}.dy-ttl{flex-wrap:wrap}
 .dy-side{flex:none}.dy-nav{flex:none;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}.dy-nav h2{display:none}
 #dy-app .dy-nav button{flex:none;white-space:nowrap;border-color:var(--dy-line)}
 .dy-cols{grid-template-columns:1fr}.dy-col{border-right:0}
 .dy-find{width:100%}
 #dy-app .dy-aim{grid-template-columns:3.6em 1fr 12px;padding:10px 8px}.dy-mk{min-width:0}
 .dy-map{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}.dy-map>*{border-right:0}.dy-mh{text-align:left}
}
</style></head><body>
<div id="dy-app">
 <div class="dy-head">
  <h1>学習指導要領　国語</h1>
  <div class="dy-seg" id="dy-mode" role="group" aria-label="見かた"><button data-m="unit">単元</button><button data-m="map">1年の地図</button><button data-m="yoryo">指導事項</button><button data-m="cmp">前回とくらべる</button><button data-m="hist">歩み</button></div>
  <div class="dy-seg" id="dy-band" role="group" aria-label="学年"></div>
  <button id="dy-kei" aria-pressed="false" title="1年から6年まで ならべる"><svg class="dy-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><rect x="17" y="4" width="4" height="16" rx="1"/></svg> 系統</button>
 </div>
 <div class="dy-body">
  <div class="dy-side" id="dy-side">
   <label class="dy-find"><svg class="dy-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="dy-q" type="search" placeholder="ことばで さがす" aria-label="ことばで さがす"><button id="dy-qx" hidden aria-label="けす">×</button></label>
   <nav class="dy-nav" id="dy-nav" aria-label="えらぶ"></nav>
  </div>
  <section class="dy-pane"><div class="dy-ttl" id="dy-ttl"></div><div class="dy-list" id="dy-list"></div></section>
 </div>
 <div class="dy-foot">
  <span class="dy-picked" id="dy-picked"></span>
  <button id="dy-clear" disabled>はずす</button>
  <button id="dy-copy" disabled><svg class="dy-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg> 写す</button>
  <button id="dy-send" class="dy-main" disabled hidden>授業メイトへ</button>
 </div>
 <div class="dy-src" id="dy-src"></div>

る敬語の使い方に慣れること。"},{"c":"72103D3412900000","area":"T","kind":"jiko","g":"イ","k":"ケ","t":"比喩や反復などの表現の工夫に気付くこと。"},{"c":"72103D3413100000","area":"T","kind":"jiko","g":"ウ","k":"ア","t":"第５学年及び第６学年の各学年においては，学年別漢字配当表の当該学年までに配当されている漢字を読むこと。また，当該学年の前の学年までに配当されている漢字を書き，文や文章の中で使うとともに，当該学年に配当されている漢字を漸次書き，文や文章の中で使うこと。"},{"c":"72103D3413200000","area":"T","kind":"jiko","g":"ウ","k":"イ","t":"仮名及び漢字の由来，特質などについて理解すること。"},{"c":"72100D3421000000","area":"S","kind":"jiko","k":"ア","t":"用紙全体との関係に注意し，文字の大きさや配列などを決めるとともに，書く速さを意識して書くこと。"},{"c":"72101D3422000000","area":"S","kind":"jiko","k":"イ","t":"目的に応じて使用する筆記具を選び，その特徴を生かして書くこと。"},{"c":"72102D3423000000","area":"S","kind":"jiko","k":"ウ","t":"毛筆を使用して，穂先の動きと点画のつながりを意識して書くこと。"}]}}},"kyoka_chu":{"lead":"言葉による見方・考え方を働かせ，言語活動を通して，国語で正確に理解し適切に表現する資質・能力を次のとおり育成することを目指す。","mokuhyo":[{"c":"8310100100000000","t":"社会生活に必要な国語について，その特質を理解し適切に使うことができるようにする。"},{"c":"8310100200000000","t":"社会生活における人との関わりの中で伝え合う力を高め，思考力や想像力を養う。"},{"c":"8310100300000000","t":"言葉がもつ価値を認識するとともに，言語感覚を豊かにし，我が国の言語文化に関わり，国語を尊重してその能力の向上を図る態度を養う。"}],"c":"8310100000000000"}}</script>

<script>
(function(){
const D=JSON.parse(document.getElementById('dy-data').textContent);
const U=JSON.parse(document.getElementById('dy-units').textContent);
const E=JSON.parse(document.getElementById('dy-extra').textContent);
// 光村の単元データが無い版（公開用）では、「単元」「1年の地図」を出さない
const HAS_U=!!(U.grades&&Object.keys(U.grades).length);
const BANDS=[['12','1・2年'],['34','3・4年'],['56','5・6年']];
const BNAME={'12':'1・2年','34':'3・4年','56':'5・6年','中1':'中1','中2':'中2','中3':'中3'};
const KEI={sho:['12','34','56'],chu:['56','中1','中2','中3']};
const GRADES=['1','2','3','4','5','6'];
const bandOf=g=>g<=2?'12':g<=4?'34':'56';
const AREAS=[
 {id:'goal',g:'',n:'目標'},
 {id:'知1',g:'知識及び技能',n:'(1) 言葉の特徴や使い方'},
 {id:'知2',g:'知識及び技能',n:'(2) 情報の扱い方'},
 {id:'知3',g:'知識及び技能',n:'(3) 我が国の言語文化'},
 {id:'A',g:'思考力，判断力，表現力等',n:'A 話すこと・聞くこと'},
 {id:'B',g:'思考力，判断力，表現力等',n:'B 書くこと'},
 {id:'C',g:'思考力，判断力，表現力等',n:'C 読むこと'}];
// 指導案・授業メイトで使う呼び名（授業メイトの見本と同じ形）
function label(it){
 if(it.area[0]==='知') return '知識及び技能 ('+it.area[1]+') '+it.k;
 const a=AREAS.find(x=>x.id===it.area).n;
 return a+' ('+(it.kind==='act'?2:1)+') '+it.k;
}
const ALL={};  // コード → 項目
Object.keys(D.bands).forEach(b=>D.bands[b].items.forEach(it=>{it.band=b;ALL[it.c]=it;}));
const USE={};  // コード → 扱う単元 [{g,i,main}]
GRADES.forEach(g=>(U.grades[g]||[]).forEach((u,i)=>u.aim.forEach(a=>a.c.forEach(c=>{(USE[c]=USE[c]||[]);if(!USE[c].some(x=>x.g===g&&x.i===i))USE[c].push({g,i,main:a.main});}))));
const uname=u=>u.title[0];
// 目指す力（領域）：A話す・聞く B書く C読む K知識・技能。時数（sp）と目標（aim）から
const DOMS=[['A','話す・聞く','話'],['B','書く','書'],['C','読む','読'],['K','知識・技能','知']];
const domOf=c=>{const a=ALL[c].area;return a[0]==='知'?'K':a;};
function unitDoms(u){
 const r={};
 Object.keys(u.sp||{}).forEach(k=>{const d=k==='知'?'K':k;(r[d]=r[d]||{main:false,h:0}).h+=u.sp[k];});
 u.aim.forEach(a=>a.c.forEach(c=>{const d=domOf(c);r[d]=r[d]||{main:false,h:0};if(a.main)r[d].main=true;}));
 return r;
}
function tagsHTML(u){
 const r=unitDoms(u);
 return '<span class="dy-tags">'+DOMS.filter(d=>r[d[0]]).map(d=>'<span class="dy-tag '+d[0]+(r[d[0]].main?' on':'')+'" title="'+d[1]+'">'+d[2]+(r[d[0]].main?'◎':'')+'</span>').join('')+'</span>';
}
// 月：'９月〜10月' → 9（はじまりの月）
const monthOf=m=>+m.normalize('NFKC').split('〜')[0].replace(/[^0-9]/g,'');
// 3学期制・2学期制のどちらでも通じるよう、月で区切る
const TERMS=[['1','4〜7月',[4,5,6,7]],['2','9〜12月',[9,10,11,12]],['3','1〜3月',[1,2,3]]];
const termNow=()=>{const m=new Date().getMonth()+1;return m>=4&&m<=8?'1':m>=9?'2':'3';};
const S={mode:'unit',grade:'6',ui:0,band:'56',area:'C',kei:false,keiR:'sho',q:'',pick:[],hit:'',term:termNow(),hist:'fig',hy:-1};
try{const o=JSON.parse(localStorage.getItem('dy-state')||'{}');['mode','grade','ui','band','area'].forEach(k=>{if(o[k]!=null)S[k]=o[k];});}catch(e){}
if(!HAS_U){if(S.mode==='unit'||S.mode==='map')S.mode='yoryo';document.querySelectorAll('[data-m=unit],[data-m=map]').forEach(b=>b.remove());}
else if(!U.grades[S.grade]||!U.grades[S.grade][S.ui])S.ui=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(t){const e=esc(t);if(!S.q)return e;const q=esc(S.q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return e.replace(new RegExp(q,'g'),'<mark>$&</mark>');}
function save(){try{localStorage.setItem('dy-state',JSON.stringify({mode:S.mode,grade:S.grade,ui:S.ui,band:S.band,area:S.area}));}catch(e){}}

/* ---------- 指導事項から ---------- */
function usedLine(c){
 const us=(USE[c]||[]).slice().sort((a,b)=>(b.main-a.main)||(a.g-b.g)||(a.i-b.i));
 if(!us.length)return '';
 const MAX=6,s=us.slice(0,MAX).map(x=>x.g+'年'+(x.main?'◎':'')+uname(U.grades[x.g][x.i])).join('　');
 return '<span class="u">単元：'+esc(s)+(us.length>MAX?' ほか':'')+'</span>';
}
function itemHTML(it,showBand,noUse){
 const on=S.pick.includes(it.c);
 const subs=it.subs?'<ol>'+it.subs.map(s=>'<li>（'+s.k+'）'+hl(s.t)+'</li>').join('')+'</ol>':'';
 const w=showBand?'<span class="w">'+BNAME[it.band]+'　'+esc(label(it))+'</span>':'';
 return '<button class="dy-it'+(S.hit===it.c?' hit':'')+'" data-c="'+it.c+'" aria-pressed="'+on+'"><span class="k">'+it.k+'</span><span>'+w+hl(it.t)+subs+(noUse?'':usedLine(it.c))+'</span><span class="ck" aria-hidden="true"></span></button>';
}
function bandBlock(b){
 const its=D.bands[b].items.filter(x=>x.area===S.area);
 const j=its.filter(x=>x.kind==='jiko'),a=its.filter(x=>x.kind==='act');
 let h=j.map(x=>itemHTML(x)).join('');
 if(a.length) h+='<div class="dy-sub">言語活動の例</div><div class="dy-act">'+a.map(x=>itemHTML(x)).join('')+'</div>';
 return h;
}
// 系統：指導事項・言語活動の例を、記号（ア・イ…）ごとに横一列
function keiRows(cols){
 let h='';
 [['jiko',''],['act','言語活動の例']].forEach(([kind,name])=>{
  const per=cols.map(b=>D.bands[b].items.filter(x=>x.area===S.area&&x.kind===kind));
  const n=Math.max(...per.map(a=>a.length));if(!n)return;
  if(name)h+='<div class="dy-sub dy-subrow">'+name+'</div>';
  for(let i=0;i<n;i++)per.forEach(a=>{h+=a[i]?itemHTML(a[i],false,true):'<div class="dy-empty"></div>';});
 });
 return h;
}
function goalBlock(b){
 return '<div class="dy-goal">'+D.bands[b].mokuhyo.map(m=>'<p>'+hl(m.t)+'</p>').join('')+'</div>';

/* ---------- 前回とくらべる ---------- */
// 文字のちがい（LCS）。特活の見本と同じ作り：短すぎる「同じ」は前後にまとめて、印を読みやすくする
function lcsLen(a,b){let p=new Uint16Array(b.length+1);for(let i=a.length-1;i>=0;i--){const q=new Uint16Array(b.length+1);for(let j=b.length-1;j>=0;j--)q[j]=a[i]===b[j]?p[j+1]+1:Math.max(p[j],q[j+1]);p=q;}return p[0];}
const sim=(a,b)=>2*lcsLen(a,b)/(a.length+b.length||1);
const kanji=s=>s.replace(/[ぁ-ゖ，。、・「」（）\s]/g,'');
// 組にするのは、文全体で 0.5 以上、かつ 漢字とカタカナだけでも 0.35 以上（ひらがなの「こと」「など」で近く見えるのをふせぐ）
const near=(a,b)=>{const s=sim(a,b);return s>=0.5&&sim(kanji(a),kanji(b))>=0.35?s:0;};
function diff(a,b){
 const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 let ops=[],i=0,j=0;const push=(k,c)=>{const l=ops[ops.length-1];if(l&&l[0]===k)l[1]+=c;else ops.push([k,c]);};
 while(i<n&&j<m){if(a[i]===b[j]){push('=',a[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1]){push('-',a[i]);i++;}else{push('+',b[j]);j++;}}
 while(i<n)push('-',a[i++]);while(j<m)push('+',b[j++]);
 for(let k=1;k<ops.length-1;k++)if(ops[k][0]==='='&&ops[k][1].length<3){ops.splice(k,1,['-',ops[k][1]],['+',ops[k][1]]);}
 const A=[],B=[];ops.forEach(([k,c])=>{if(k!=='+')A.push([k,c]);if(k!=='-')B.push([k,c]);});
 const join=(x,tag)=>{let o=[];x.forEach(([k,c])=>{const l=o[o.length-1];if(l&&l[0]===k)l[1]+=c;else o.push([k,c]);});return o.map(([k,c])=>k==='='?esc(c):'<'+tag+'>'+esc(c)+'</'+tag+'>').join('');};
 return [join(A,'del'),join(B,'ins')];
}
// いまの領域 → 前回のどこと並べるか
const OLDOF={A:x=>x.area==='A',B:x=>x.area==='B',C:x=>x.area==='C',
 '知1':x=>x.area==='T'&&(x.g==='イ'||x.g==='ウ'),'知2':()=>false,'知3':x=>(x.area==='T'&&x.g==='ア')||x.area==='S'};
const TG={'ア':'伝統的な言語文化','イ':'言葉の特徴やきまり','ウ':'文字'};
const oldLab=x=>x.area==='T'?'〔'+TG[x.g]+'〕('+x.k+')':x.area==='S'?'〔書写〕'+x.k:x.k;
const fullT=x=>x.t+(x.subs?x.subs.map(s=>'（'+s.k+'）'+s.t).join(''):'');
const CMPNOTE={
 goal:'目標の分け方が変わりました。前回は「話す・聞く」「書く」「読む」の能力ごと、いまは「知識及び技能」「思考力，判断力，表現力等」「学びに向かう力，人間性等」の3つの柱ごとに書かれています。',
 '知1':'前回の〔伝統的な言語文化と国語の特質に関する事項〕は、いまは〔知識及び技能〕に入りました。ここでは前回の「言葉の特徴やきまり」「文字」と並べています。',
 '知2':'(2)「情報の扱い方」は、平成29年告示で新しくできた項目です。',
 '知3':'前回の「伝統的な言語文化」と〔書写〕と並べています。',
 A:'',B:'',C:''};
// はっきり近い項目どうしだけを組にする。残りは「そのほかの項目」として、左右に記号の順で並べる（組にならない＝新しい、とは限らない）
function pairUp(news,olds){
 const cand=[];news.forEach((n,i)=>olds.forEach((o,j)=>{const s=near(fullT(n),fullT(o));if(s)cand.push([s,i,j]);}));
 cand.sort((a,b)=>b[0]-a[0]);const nm={},used=new Set();
 cand.forEach(([s,i,j])=>{if(nm[i]!=null||used.has(j))return;nm[i]=j;used.add(j);});
 return {pairs:news.map((n,i)=>nm[i]!=null?[olds[nm[i]],n]:null).filter(Boolean),restN:news.filter((n,i)=>nm[i]==null),restO:olds.filter((o,j)=>!used.has(j))};
}
function cmpRows(P){
 let h=P.pairs.map(([o,n])=>{const [a,b]=diff(fullT(o),fullT(n));return '<div><span class="k">'+esc(oldLab(o))+'</span>'+a+'</div><div><span class="k">'+n.k+'</span>'+b+'</div>';}).join('');
 const m=Math.max(P.restN.length,P.restO.length);
 if(m){
  if(P.pairs.length)h+='<div class="dy-note">そのほかの項目（記号の順）</div>';
  for(let i=0;i<m;i++){const o=P.restO[i],n=P.restN[i];
   h+='<div>'+(o?'<span class="k">'+esc(oldLab(o))+'</span>'+esc(fullT(o)):'')+'</div><div>'+(n?'<span class="k">'+n.k+'</span>'+esc(fullT(n)):'')+'</div>';}
 }
 return h;
}

 if(note)h+='<div class="dy-note">'+esc(note)+'</div>';

  const n=Math.max(O.mokuhyo.length,N.mokuhyo.length);
  for(let i=0;i<n;i++)h+='<div>'+(O.mokuhyo[i]?'<span class="k">('+(i+1)+')</span>'+esc(O.mokuhyo[i].t):'')+'</div><div>'+(N.mokuhyo[i]?'<span class="k">('+(i+1)+')</span>'+esc(N.mokuhyo[i].t):'')+'</div>';
 }else{

   const news=N.items.filter(x=>x.area===S.area&&x.kind===kind),olds=O.items.filter(x=>x.kind===kind&&OLDOF[S.area](x));
   if(!news.length&&!olds.length)return;
   if(S.area.length===1)h+='<div class="dy-sub">'+name+'</div>';

 const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;const i=S.pick.indexOf(c);if(i<0)S.pick.push(c);else S.pick.splice(i,1);b.setAttribute('aria-pressed',i<0);renderPick();});
$('dy-q').addEventListener('input',e=>{S.q=e.target.value.trim();$('dy-qx').hidden=!S.q;render();});
$('dy-qx').addEventListener('click',()=>{S.q='';$('dy-q').value='';$('dy-qx').hidden=true;render();$('dy-q').focus();});
$('dy-clear').addEventListener('click',()=>{S.pick=[];render();});
$('dy-copy').addEventListener('click',()=>{
 const t=S.mode==='unit'?unitText()+'\n'+unitAims().map(p=>(p.main?'◎':'○')+p.label+'　'+p.text).join('\n'):picked().map(p=>p.label+'　'+p.text).join('\n');
 copyText(t).then(()=>toast('写しました。指導案に はりつけられます'));});
// 授業メイトへ：授業メイトの画面が {type:'yoryo-hello'} か yoryo-open を送ってきたときだけ、ボタンを出してその画面に渡す。
// 受け手がいないのに「送りました」と出さないため、それまでボタンは隠しておく。
let mate=null;
$('dy-send').addEventListener('click',()=>{
 const msg=S.mode==='unit'?{type:'yoryo-unit',src:D.src,grade:+S.grade,unit:U.grades[S.grade][S.ui].unit,title:U.grades[S.grade][S.ui].title,items:unitAims()}:{type:'yoryo-pick',src:D.src,items:picked()};
 if(mate){mate.postMessage(msg,'*');toast('授業メイトへ送りました');}
});
// コードを付けて開くと、その項目を出す（#82102D3231400000）
function openCode(c){
 const x=ALL[c];if(!x)return false;
 const chu=x.band[0]==='中';S.mode='yoryo';S.band=chu?'56':x.band;S.area=x.area;S.kei=chu;S.keiR=chu?'chu':S.keiR;S.q='';$('dy-q').value='';$('dy-qx').hidden=true;S.hit=c;save();render();
 const el=document.querySelector('[data-c="'+c+'"]');if(el)el.scrollIntoView({block:'center'});
 return true;
}
// GAS の授業メイトから ?a=yoryo&tangen=コード で開くと、#tangen=コード になって届く
const fromHash=()=>openCode(decodeURIComponent(location.hash.slice(1)).replace(/^tangen=/,''));
window.addEventListener('hashchange',fromHash);
// 授業メイトの中に入れたとき：{type:'yoryo-open',code:'82102D3231400000'} で開く。{type:'yoryo-hello'} は渡す先を知らせるだけ
window.addEventListener('message',e=>{const t=e.data&&e.data.type;if(t!=='yoryo-open'&&t!=='yoryo-hello')return;
 if(e.source&&e.source!==window){mate=e.source;$('dy-send').hidden=false;}
 if(t==='yoryo-open')openCode(e.data.code);});
const SRC='出典：文部科学省「学習指導要領コード」（小学校 平成29年・平成20年告示、中学校 平成29年告示）'+(HAS_U?'／光村図書「年間指導計画例（令和6年度版）」':'');
$('dy-src').textContent=SRC;
render();fromHash();
// ほかの画面からも使える：コードで引く
window.DY_YORYO={open:openCode,get:c=>ALL[c]?{code:c,band:ALL[c].band,label:label(ALL[c]),text:ALL[c].t}:null};
})();
</script>
</body></html>
